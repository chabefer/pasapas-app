// One run of the method per field, spliced in between fIntro and the grand totals. Built
// from F_AREAS rather than written out six times, so the two things §11 flagged as waiting
// on the Chapter 2 crash test — how many fields, and how much scaffolding — are both one
// line to change.
//
// ⚠️ Everything a step needs must come off `A`, never off module state: `fStepsFor` runs at
// LOAD, when the current field is still the chapter's own. Chapter 2 shipped that bug and
// was right only by luck. (Inside the step body FIELD is correct, because the wrapper at the
// foot of this file has called setArea first.)
// PART F's own pictures. The field wearing every letter of the formula — a under it, A on
// the block, s_A and d̃ bracketed on its two sides — so the line the child is answering
// question by question is never abstract.
// o.A  — true once the child has counted the block
// o.sA — null while s_A is not in play, '?' while its question is open, 'val' once answered
function fFieldEl(N, o) {
  const q = o || {};
  const SA = SUB0;
  const lo = q.sA == null ? SA
    : SA + ' = ' + (q.sA === 'val' ? N.n : '?');
  // ⚠️ The band on the FIELD is `d`, the true leftover — never `d̃` (Sylvain). d̃ is the width
  // of the strips we STAND IN for it with, and it is a whisker wider. Writing d̃ on the ground
  // would put the approximation one step earlier than it actually happens.
  // ⚠️ The OUTER bracket (s̃, spanning the whole side) needs the full BPADL gutter: vbar
  // right-aligns an outer label into [0, OX − BVOUT − 6], which at padL 104 is 2px wide.
  const PAD = q.whole ? BPADL : 104;
  const stage = squareSplitEl({
    squares: true, plot: 'mark', padL: PAD,
    brackets: {
      // `d` on the ground, `d̃` once the screen is about OUR answer: the wrap-up brackets the
      // whole side as s̃, so its two pieces have to be the two that add up to s̃.
      lo: '<strong>' + lo + '</strong>', hi: bold(q.hi || 'd'), both: true,
      whole: q.whole || undefined,
    },
  });
  const R = regionBoxes(), put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    stage.appendChild(d);
    return d;
  };
  // ⚠️ The block wears its letter AND its number — but the number arrives only AFTER the
  // child has counted it (Sylvain). Printing `A = 4` over the very squares they are being
  // asked to count answers the question in the picture. So while the question is open the
  // block carries `A = ?` and the answer replaces the mark: the chapter's own "?"-then-reveal,
  // and the question mark stands for a quantity of something rather than for a bare number.
  put('left:' + (PAD + R.a.x) + 'px; top:' + R.a.y + 'px; width:' + R.a.w + 'px;' +
      'height:' + R.a.h + 'px; display:flex; align-items:center; justify-content:center;' +
      'font-size:22px; color:#3f7a34; z-index:5; pointer-events:none;')
    .innerHTML = '<strong>' + SUBA0 + ' = ' + (q.A ? N.sq : '?') + '</strong>';
  const h = parseFloat(stage.style.height) || R.side;
  put('left:0; top:' + (h + 4) + 'px; width:' + (PAD + R.side) + 'px; text-align:center;' +
      'font-size:16px; color:#5a5240;').innerHTML = '<strong>a = ' + N.A + '</strong>';
  stage.style.height = (h + 30) + 'px';
  return stage;
}

// `a − A` IN AREA (Sylvain): the whole field, take away the block of whole magic squares,
// and what is left is two strips of s_A × d̃ — then those strips piled one on another, with
// the beginning of the equation still standing. Four terms in a row, at a reduced scale
// (46px to the magic length, Chapter 2's own) because at the field's 80 the area-12 row would
// be 817px against a 760px container.
//
// ⚠️ The strips and the pile are drawn from the EXACT share, never the rounded one: this is
// the division itself, and on the last two fields six layers of 0.17 would stand taller than
// the ground they came out of.
// `a − A` IN AREA, built up one term at a time (Sylvain). The whole field, take away the
// block of whole magic squares, and what is left is the L itself — then, once the child has
// said how big that is, the same ground as that many magic squares stood on end. On the next
// screen the two strips of s_A × d̃ arrive, and then those strips cut into d̃ × 1 pieces and
// piled. Nothing is ever taken away: each stage adds one more `=`.
//
// `show` is a set: 'L' (always), 'rem', 'strips', 'pile'.
//
// ⚠️ Drawn at 38px to the magic length. At the field's own 80 the area-12 row would be well
// over 1500px; even at 46 the five-term stage bursts the 760px container.
// ⚠️ The strips and the pile come off the EXACT share, never the rounded one: this is the
// division itself, and on the last two fields six layers of 0.17 would stand taller than the
// ground they came out of.
function fAreaRowEl(N, show) {
  const has = k => show.indexOf(k) >= 0;
  // ⚠️ The scale is chosen so a LAYER OF THE PILE is at least 11px, because every layer wears
  // a d̃ and six labels 6px apart are a smear. Only the area-10 field (a sixth) needs more than
  // the base 38; its row then wraps onto two lines, which is what flex-wrap is for. The pile
  // cannot simply be drawn bigger than the rest — its whole argument is that it is the same
  // height as the a − A squares beside it.
  const SPX = Math.min(66, Math.max(38, Math.ceil(11 / N.exact)));
  const side = Math.sqrt(N.A) * SPX, blk = N.n * SPX, dPx = N.exact * SPX;
  // ⚠️ s_A keeps its VALUE on every side it marks, from the moment the child works it out
  // (Sylvain) — the formulas underneath stay symbolic, but a length on the ground is a number.
  const ORG = REG.d.ink, FILL = 'rgba(232,163,61,0.30)', SA = SUB0;
  const SAV = SA + ' = ' + N.n;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:center; gap:11px;' +
    'margin-top:18px; flex-wrap:wrap;';
  const term = (el, label, col) => {
    const w = document.createElement('div');
    w.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:6px;';
    w.appendChild(el);
    const c = document.createElement('div');
    c.innerHTML = '<strong>' + label + '</strong>';
    c.style.cssText = 'font-size:14px; white-space:nowrap; color:' + (col || ORG) + ';';
    w.appendChild(c);
    row.appendChild(w);
  };
  const sign = txt => {
    const d = document.createElement('div');
    d.innerHTML = txt;
    d.style.cssText = 'font-size:22px; color:#5a5240; margin-bottom:20px;';
    row.appendChild(d);
  };
  const holder = (w, h) => {
    const d = document.createElement('div');
    d.style.cssText = 'position:relative; width:' + w + 'px; height:' + h + 'px;';
    return d;
  };
  const cells = (host, x, y, cols, rows) => {
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const q = document.createElement('div');
      q.className = 'field-cell filled';
      q.style.cssText = 'position:absolute; left:' + (x + c * SPX) + 'px;' +
        'top:' + (y + r * SPX) + 'px; width:' + SPX + 'px; height:' + SPX + 'px;';
      host.appendChild(q);
    }
  };
  const bar = (host, x, y, w, h) => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute; left:' + x + 'px; top:' + y + 'px;' +
      'width:' + w + 'px; height:' + h + 'px; box-sizing:border-box; background:' + FILL +
      '; border:1.5px solid ' + ORG + ';';
    host.appendChild(d);
  };
  // a bracket hugging one side of a shape, with its label
  // The label shrinks to fit its own band, because the pile writes d̃ on EVERY layer and on
  // the two fields whose share is a sixth those layers are 6px tall.
  const vlab = (host, x, y, h, txt) => {
    const fs = Math.max(8, Math.min(13, h - 2));
    const b1 = document.createElement('div');
    b1.style.cssText = 'position:absolute; left:' + (x - 9) + 'px; top:' + y + 'px;' +
      'width:6px; height:' + h + 'px; box-sizing:border-box; border:2px solid ' + ORG +
      '; border-right:none;';
    host.appendChild(b1);
    const l = document.createElement('div');
    l.innerHTML = '<strong>' + txt + '</strong>';
    // ⚠️ 44px, not 32: `s_A = 2` wrapped onto two lines in a 32px box. The label is allowed
    // to overhang its holder to the left — there is flex gap there and nothing to collide
    // with — which is cheaper than moving every shape in the row right by twelve pixels.
    l.style.cssText = 'position:absolute; left:' + (x - 58) + 'px;' +
      'top:' + (y + h / 2 - fs * 0.72) + 'px; width:44px; text-align:right;' +
      'white-space:nowrap; font-size:' + fs + 'px; line-height:' + fs + 'px;' +
      'color:' + ORG + ';';
    host.appendChild(l);
  };
  const hlab = (host, x, y, w, txt) => {
    const b1 = document.createElement('div');
    b1.style.cssText = 'position:absolute; left:' + x + 'px; top:' + y + 'px;' +
      'width:' + w + 'px; height:6px; box-sizing:border-box; border:2px solid #2f6fb5;' +
      'border-top:none;';
    host.appendChild(b1);
    const l = document.createElement('div');
    l.innerHTML = '<strong>' + txt + '</strong>';
    l.style.cssText = 'position:absolute; left:' + (x - 40) + 'px; top:' + (y + 8) + 'px;' +
      'width:' + (w + 80) + 'px; text-align:center; font-size:13px; color:#2f6fb5;';
    host.appendChild(l);
  };

  // 1 — the field, with the magic squares where the child laid them, and its two side marks
  const f = holder(side + 50, side + 24);
  const fg = holder(side, side);
  fg.style.cssText += 'position:absolute; left:50px; top:0; background:#f4f0e4;' + EDGE;
  // ⚠️ The strip round the block wears the SAME light brown it wears two terms to the right
  // (Sylvain). It is the same ground either way, and the subtraction only reads as taking the
  // block out if what is left is already the colour it will be when it stands on its own.
  // Painted over the whole field and then covered by the magic squares, which are opaque.
  const wash = document.createElement('div');
  wash.style.cssText = 'position:absolute; left:0; top:0; width:' + side + 'px;' +
    'height:' + side + 'px; background:' + FILL + ';';
  fg.appendChild(wash);
  cells(fg, 0, side - blk, N.n, N.n);
  f.appendChild(fg);
  vlab(f, 50, 0, side - blk, 'd');            // the field's own band: d, not d̃
  vlab(f, 50, side - blk, blk, SAV);
  term(f, 'a = ' + N.A, '#5a5240');
  sign('&minus;');
  // 2 — the block on its own
  const bl = holder(blk, blk);
  cells(bl, 0, 0, N.n, N.n);
  term(bl, SUBA0 + ' = ' + N.sq, '#3f7a34');
  sign('=');
  // 3 — the L itself, still wearing d̃ and s_A
  const NS = 'http://www.w3.org/2000/svg';
  const L = holder(side + 50, side + 24);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', side);
  svg.setAttribute('height', side);
  svg.style.cssText = 'position:absolute; left:50px; top:0;';
  const poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', [
    [0, 0], [side, 0], [side, side], [blk, side], [blk, side - blk], [0, side - blk],
  ].map(q => q.join(',')).join(' '));
  poly.setAttribute('fill', FILL);
  poly.setAttribute('stroke', ORG);
  poly.setAttribute('stroke-width', '2');
  svg.appendChild(poly);
  L.appendChild(svg);
  vlab(L, 50, 0, side - blk, 'd');            // ...and the L's, until we approximate
  // bare `s_A` here (Sylvain): the field two terms to the left already says what it is worth,
  // and repeating the number on the very next shape is the same fact twice in one breath.
  vlab(L, 50, side - blk, blk, SA);
  // the leftover carries its OWN size, `?` until the child answers (Sylvain) — which is what
  // makes the stack of magic squares that used to stand here unnecessary: the strip and the
  // number are the same term now, and the row is one term shorter.
  term(L, nw('a &minus; ' + SUBA0 + ' = ' + (has('rem') ? N.rem : '?')), '#3f7a34');
  const remStack = () => {
    const g = holder(SPX, N.rem * SPX);
    cells(g, 0, 0, 1, N.rem);
    return g;
  };
  // 4 — and now the approximation: two strips of s_A × d̃, cut into their s_A pieces so
  // the length is countable
  if (has('strips')) {
    sign('&asymp;');
    const st = holder(blk + 50, 2 * dPx + 5 + 24);
    for (let i = 0; i < 2; i++) {
      const y = i * (dPx + 5);
      bar(st, 50, y, blk, dPx);
      for (let c = 1; c < N.n; c++) {
        const t2 = document.createElement('div');
        t2.style.cssText = 'position:absolute; left:' + (50 + c * SPX) + 'px; top:' + y +
          'px; width:1.5px; height:' + dPx + 'px; background:' + ORG + ';';
        st.appendChild(t2);
      }
      vlab(st, 50, y, dPx, DTIL);
    }
    hlab(st, 50, 2 * dPx + 5 + 3, blk, SAV);
    term(st, nw('2 &times; (' + SA + ' &times; ' + DTIL + ')'));
  }
  // 5 — those same pieces piled one on another
  if (has('pile')) {
    sign('=');
    // On the screen where the share is named, the pile's left side carries the whole fact
    // (Sylvain): `k × d̃ = a − A magic lengths`, in an outer rank of bracket over the
    // per-layer d̃. NOT a `1 magic length` under the foot of it — the width is not what that
    // sentence is about, and the height said in magic lengths is.
    // 116 is enough for `4 × d̃` — it was 230 back when this label also carried "= 3 magic
    // lengths", which now stands on the far right beside the ground it is the height of.
    const sides = has('pilesides'), g2 = sides ? 116 : 50;
    const p2 = holder(SPX + g2, N.k * dPx);
    // ⚠️ EVERY layer wears its d̃, not just the top one (Sylvain) — the question on this screen
    // is how many of them there are, and one label answers "a d̃ and some other things".
    for (let i = 0; i < N.k; i++) {
      bar(p2, g2, i * dPx, SPX, dPx);
      vlab(p2, g2, i * dPx, dPx, DTIL);
    }
    if (sides) {
      const H2 = N.k * dPx, ob = document.createElement('div');
      ob.style.cssText = 'position:absolute; left:' + (g2 - 52) + 'px; top:0; width:8px;' +
        'height:' + H2 + 'px; box-sizing:border-box; border:2.5px solid ' + ORG +
        '; border-right:none;';
      p2.appendChild(ob);
      const ol = document.createElement('div');
      // just the COUNT here (Sylvain) — how many d̃ are stacked. What they come to in magic
      // lengths is written on the far right, beside the ground it equals, and in blue.
      // ⚠️ `? × d̃` while the question is open: the bracket is there to be counted along, and
      // the number arrives with the answer. Same "?"-then-reveal as everything else here.
      ol.innerHTML = '<strong>' + nw((has('pileq') ? '?' : N.k) + ' &times; ' + DTIL) +
        '</strong>';
      ol.style.cssText = 'position:absolute; left:0; top:' + (H2 / 2 - 10) + 'px;' +
        'width:' + (g2 - 58) + 'px; text-align:right; font-size:13px; color:' + ORG + ';';
      p2.appendChild(ol);
    }
    // ⚠️ no symbolic caption once the sides are marked: the picture is saying it.
    term(p2, sides ? '&nbsp;' : nw('(2 &times; ' + SA + ') &times; (' + DTIL + ' &times; 1)'));
  }
  // 6 — and the pile taken to be EXACTLY the leftover, which is the step that turns the
  // approximation into a number you can divide (Sylvain). Same ground the L is labelled with, said again
  // on the far side of the pile — which is what makes the height readable.
  if (has('rem2')) {
    sign('=');
    if (has('pilesides')) {
      // ⚠️ The height is MATERIALIZED, not written loose beside the shape (Sylvain): a bracket
      // up the side of the green ground, exactly as the pile has one, carrying `? magic
      // lengths` while the question is open and the number once it lands. Blue, because in
      // this chapter green is ground and blue is length.
      const H3 = N.rem * SPX;
      // ⚠️ `a − A = 3` belongs under the SQUARES, not under the squares-plus-bracket-plus-
      // label (Sylvain). term() centres its caption on whatever it is given, so the stack
      // carries its own caption in a column and the length hangs off the side of that.
      const col = document.createElement('div');
      col.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:6px;';
      col.appendChild(remStack());
      const cap2 = document.createElement('div');
      cap2.innerHTML = '<strong>' + nw('a &minus; ' + SUBA0 + ' = ' + N.rem) + '</strong>';
      cap2.style.cssText = 'font-size:14px; white-space:nowrap; color:#3f7a34;';
      col.appendChild(cap2);
      const w2 = document.createElement('div');
      w2.style.cssText = 'display:flex; align-items:flex-start;';
      w2.appendChild(col);
      const br = document.createElement('div');
      br.style.cssText = 'width:8px; height:' + H3 + 'px; margin-left:6px; flex:none;' +
        'box-sizing:border-box; border:2.5px solid #2f6fb5; border-left:none;';
      w2.appendChild(br);
      const bl = document.createElement('div');
      bl.innerHTML = '<strong>' + nw(lenLabel(has('remq') ? '?' : N.rem)) + '</strong>';
      bl.style.cssText = 'margin-left:7px; margin-top:' + (H3 / 2 - 10) + 'px;' +
        'font-size:14px; white-space:nowrap; color:#2f6fb5;';
      w2.appendChild(bl);
      row.appendChild(w2);
    } else {
      term(remStack(), nw('a &minus; ' + SUBA0 + ' = ' + N.rem), '#3f7a34');
    }
  }
  return row;
}

// The leftover cut into 2 × s_A strips one magic length long and piled up — the division,
// with every layer wearing its own d̃ so the count is something to DO. Same picture as the
// take-stock page's third term, at the same scale, on each field's own numbers.
function fPileEl2(N) {
  // ⚠️ the EXACT share, not the rounded one: the pile IS the division, and on the last two
  // fields six layers of 0.17 would stand taller than the magic square they came out of.
  const dPx = N.exact * PX, GUT = 96, W = GUT + PX + 40;
  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:16px auto 0; width:' + W + 'px;' +
    'height:' + (N.k * dPx + 62) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  for (let i = 0; i < N.k; i++) {
    put('left:' + GUT + 'px; top:' + (i * dPx) + 'px; width:' + PX + 'px;' +
        'height:' + dPx + 'px; box-sizing:border-box; border:2px solid ' + REG.d.ink + ';' +
        'background:rgba(232,163,61,0.30);');
    put('left:' + (GUT - 14) + 'px; top:' + (i * dPx) + 'px; width:8px;' +
        'height:' + dPx + 'px; box-sizing:border-box;' +
        'border:2.5px solid ' + REG.d.ink + '; border-right:none;');
    put('left:' + (GUT - 56) + 'px; top:' + (i * dPx + dPx / 2 - 11) + 'px; width:36px;' +
        'text-align:right; font-size:15px; color:' + REG.d.ink + ';')
      .innerHTML = '<strong>' + DTIL + '</strong>';
  }
  const bot = N.k * dPx;
  put('left:' + GUT + 'px; top:' + (bot + 6) + 'px; width:' + PX + 'px; height:8px;' +
      'box-sizing:border-box; border:2.5px solid #2f6fb5; border-top:none;');
  put('left:' + (GUT - 60) + 'px; top:' + (bot + 17) + 'px; width:' + (PX + 120) + 'px;' +
      'text-align:center; font-size:15px; color:#2f6fb5; white-space:nowrap;')
    .innerHTML = '<strong>' + t('c3_d_lbl_1ml') + '</strong>';
  return box;
}

// One magic length, ruled into its ten tenths, with one half of it shaded — which is how a
// half becomes five tenths, and then 0.5. Only the half needs this: a whole share needs no
// picture at all, and three quarters comes off the quarter Part D already wrote.
function fHalfLenEl(parts) {
  const P = parts || 2;
  const W = 400, H = 30, box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:18px auto 0; width:' + W + 'px;' +
    'height:' + (H + 30) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  put('left:0; top:0; width:' + W + 'px; height:' + H + 'px; box-sizing:border-box;' +
      'background:#eaf5e5; border:2px solid #3f7a34;');
  put('left:0; top:0; width:' + (W / P) + 'px; height:' + H + 'px; box-sizing:border-box;' +
      'background:rgba(232,163,61,0.34); border:2px solid ' + REG.d.ink + ';');
  for (let i = 1; i < 10; i++)
    put('left:' + (i * W / 10) + 'px; top:0; width:1.5px; height:' + H + 'px;' +
        'background:#8aba8a;');
  // the cut that ends the share is heavier than the tenth rules: it is the one that matters,
  // and on a share that does not come out even it visibly falls BETWEEN two tenth marks
  put('left:' + (W / P - 1.5) + 'px; top:-6px; width:3px; height:' + (H + 12) + 'px;' +
      'background:' + REG.d.ink + ';');
  put('left:0; top:' + (H + 8) + 'px; width:' + W + 'px; text-align:center;' +
      'font-size:15px; color:#3f7a34;')
    .innerHTML = '<strong>' + t('c3_d_lbl_1ml') + '</strong>';
  return box;
}

// ---------------------------------------------------------------------------
// One field, three steps. The child does the whole method: lay the magic squares, read A
// off the ground, take it from a, find s_A on Chapter 1's table, pile the strips and count
// the d̃, turn the share into a decimal, add it to s_A, and fence the result.
//
// ⚠️ Everything comes off `A`, never off module state: these run at LOAD, when the current
// field is still the chapter's own. Chapter 2 shipped that bug and was right only by luck.
// ---------------------------------------------------------------------------
function fLayStep(A, first) {
  const N = fNums(A);
  const step = function () {
    clearGame();
    showEliel();
    storyHTML('<div class="speaker">Eliel</div><p>' +
      t(first ? 'c3_f_a1' : 'c3_f_a', { a: A }) + '</p>');
    // The child lays them, as they did in Part A — the area is given, the covering is theirs.
    // Nothing moves on by itself: they can go on trying for as long as they like, and say when
    // they are done (Sylvain).
    layMagicSquares({
      keepTrying: true,
      onFull: () => addButton(t('c3_f_btn_done'), () => {
        clearGame();
        showEliel();
        gameArea.appendChild(fFieldEl(N, {}));      // A = ?, and s_A not in play yet
        askAfterButton(t('c3_f_qA', { aA: bold(SUBA0) }), N.sq, () => {
          // A now stands on the block, and s_A is asked straight off it
          clearGame();
          showEliel();
          gameArea.appendChild(fFieldEl(N, { A: true, sA: '?' }));
          gameArea.appendChild(showFullMultTable(1, 10, null, false));
          // the name, the definition and this field's own number, in one line — so the
          // question is visibly a square root and not a riddle about multiplication
          askAfterButton(t('c3_f_qSA', {
            chain: bold(nw(SUB0 + ' = ' + sqrtHTML(SUBA0) + ' = ' + sqrtHTML(N.sq))),
            A: N.sq, label: bold(areaLabel(N.sq)),
          }), N.n, () => {
            // the answer gets its own screen (Sylvain), on the field it came off — and from
            // here on s_A is written with its value everywhere it appears
            clearGame();
            showEliel();
            gameArea.appendChild(fFieldEl(N, { A: true, sA: 'val' }));
            storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_f_sa_ok', {
              eq: bold(nw(SUB0 + ' = ' + sqrtHTML(N.sq) + ' = ' + N.n)),
            }) + '</p>');
            addButton(t('btn_continue'), nextStep);
          }, t('c3_f_hSA'));
        }, t('c3_f_hA'));
      }),
    });
  };
  Object.defineProperty(step, 'name', { value: 'fLay' + A, configurable: true });
  step.fieldArea = A;
  return step;
}

function fShareStep(A) {
  const N = fNums(A);
  const step = function () {
    clearGame();
    showEliel();
    const SA = bold(SUB0), D = bold(DTIL);
    const row = show => { clearGame(); showEliel(); gameArea.appendChild(fAreaRowEl(N, show)); };
    // 1 — the field, less the block, IS the leftover strip. How big is it?
    const intro = t('c3_f_areq', { sA: SA, d: bold('d') });
    gameArea.appendChild(fAreaRowEl(N, []));
    askWithLead(intro,
      t('c3_f_qRem', { calc: bold(nw('a &minus; ' + SUBA0 + ' = ' + A + ' &minus; ' + N.sq)) }),
      N.rem, () => {
        // ⚠️ RETIRED (Sylvain, 2026-08-22): a screen used to sit here showing the leftover alone
        // under the very sentence the question had already carried — the same words twice, and
        // it recurred on every one of the eight fields. The answer now materialises together
        // with the two strips it is about to be cut into, which is the screen that had something
        // new to say.
        {
          // the two strips arrive, cut into their s̃₀ pieces
          row(['rem', 'strips']);
          storyHTML('<div class="speaker">Eliel</div><p>' +
            t('c3_f_strips', { sA: SA, d: D }) + '</p>');
          addButton(t('c3_f_yes'), () => {
            // 4 — and those pieces piled up. Nothing has been taken away: one more `=`.
            // the pile's total bracket arrives HERE (Sylvain), carrying `? × d̃` — this is
            // the screen where the child counts the layers, so this is where the thing to
            // count along belongs.
            row(['rem', 'strips', 'pile', 'pilesides', 'pileq']);
            askAfterButton(t('c3_f_qK2', { d: D }), N.k, () => {
              // the assumption, said out loud, and then written on the far right. The pile
              // gets its total bracket here, carrying `? × d̃` — something to count along
              // while the question is open.
              // the count is answered, so the pile's bracket fills in; the green ground's
              // height is the question now, so ITS bracket carries the "?"
              row(['rem', 'strips', 'pile', 'rem2', 'pilesides', 'remq']);
              askWithLead(t('c3_f_assume', {
                d: D, rest: bold(nw('a &minus; ' + SUBA0)),
              }), t('c3_f_qTall'), N.rem, () => {
                row(['rem', 'strips', 'pile', 'rem2', 'pilesides']);
                storyHTML('<div class="speaker">Eliel</div><p>' +
                  t('c3_f_share_is', {
                    eq: bold(nw(N.k + ' &times; ' + DTIL)), d: D,
                    ord: t('c3_f_ord_' + N.k), len: bold(lenLabel(N.rem)),
                  }) + '</p>');
                addButton(t('btn_continue'), nextStep);
              }, t('c3_f_hTall'));
            }, t('c3_f_hK2'));
          });
        }
      }, t('c3_f_hRem', { a: A, A: N.sq }));
  };
  Object.defineProperty(step, 'name', { value: 'fShare' + A, configurable: true });
  step.fieldArea = A;
  return step;
}

// The four d̃ of `4 × d̃`, laid end to end under a ruler of whole magic lengths — Chapter 2's
// carry row, which regrouped eighteen tenths into one magic length and eight, generalised to
// whatever this field's share happens to be. The child clicks each piece to gather it in, and
// on the last click the row re-draws as the whole magic lengths they came to.
//
// ⚠️ Only used where 4 × d̃ IS a whole number of magic lengths. On the two fields whose share
// is a sixth and a third it is not, and there is nothing to regroup INTO — those two have
// their own beat (the fence is not whole either, so Eliel buys the next length up).
function fFourEl(N, onDone) {
  const L = 116, total = 4 * N.dt, W = Math.max(total, 1) * L + 60;
  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:20px auto 0; width:' + W + 'px;' +
    'height:132px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  // the reference: one whole magic length, with a dashed line dropped from its far end —
  // the child can see where each whole one stops before any of it is regrouped
  put('left:30px; top:12px; width:' + L + 'px; height:16px; box-sizing:border-box;' +
      'background:#eaf5e5; border:2px solid #3f7a34;');
  put('left:0; top:10px; width:26px; text-align:right; font-size:12px; color:#3f7a34;')
    .innerHTML = '<strong>1</strong>';
  for (let i = 1; i * L <= total * L + 0.5; i++)
    put('left:' + (30 + i * L) + 'px; top:12px; width:0; height:82px;' +
        'border-left:2px dashed #3f7a34;');
  const rowY = 64;
  let done = 0;
  const pieces = [];
  const draw = () => {
    pieces.forEach(p => p.remove());
    pieces.length = 0;
    if (done < 4) {
      for (let i = 0; i < 4; i++) {
        const p = put('left:' + (30 + i * N.dt * L) + 'px; top:' + rowY + 'px;' +
          'width:' + (N.dt * L) + 'px; height:30px; box-sizing:border-box; z-index:2;' +
          'background:' + (i < done ? '#cfe8c4' : 'rgba(232,163,61,0.30)') + ';' +
          'border:2px solid ' + (i < done ? '#3f7a34' : REG.d.ink) + ';' +
          (i < done ? '' : 'cursor:pointer;'));
        if (i >= done) p.addEventListener('click', () => { done = i + 1; draw(); });
        pieces.push(p);
      }
    } else {
      // gathered: the same ground, counted as whole magic lengths
      for (let i = 0; i < total; i++)
        pieces.push(put('left:' + (30 + i * L) + 'px; top:' + rowY + 'px; width:' + L + 'px;' +
          'height:30px; box-sizing:border-box; z-index:2; background:#cfe8c4;' +
          'border:2px solid #3f7a34;'));
      if (onDone) onDone();
    }
  };
  draw();
  return box;
}

// The share, measured — and measured with PART D's OWN DEVICES (Sylvain), not with new ones.
// First `twoSidesEl`, the two lines side by side: `2 × s_A × d̃` on the left, ticked into its
// k pieces, against `a − A` magic lengths on the right — dHowLong's picture with this field's
// numbers. Then `quarterLayEl`, the tall bar with pieces laid on it: one d̃, and the child
// lays tenths of a magic length along it exactly as they did on the quarter.
//
// ⚠️ One procedure, not three special cases. What the tenths do decides the rest: they come
// out exactly (five of them, or ten for a whole one), or they do not — and then the hundredths
// either finish it (seven tenths and five hundredths, for three quarters) or never will (a
// sixth, a third), and we round UP because you can cut wire and you cannot stretch it.
function fMeasureStep(A) {
  const N = fNums(A);
  const step = function () {
    clearGame();
    showEliel();
    const D = bold(DTIL);
    // same layout and same colours as the screen before it (Sylvain): the left line is named
    // by the COUNT of d̃ on it, and the length it comes to is written in blue on the right.
    const sides = () => twoSidesEl(null, {
      n: N.k, rn: N.rem,
      left: N.k + ' &times; ' + DTIL, leftSide: true, leftCol: REG.d.ink,
      right: nw('a &minus; ' + SUBA0 + ' = ' + lenLabel(N.rem)),
      rightCol: '#2f6fb5',
    });
    gameArea.appendChild(sides());
    // ⚠️ On a field whose share is already a WHOLE magic length there is nothing to measure
    // (Sylvain): the two lines say `2 × d̃ = 2 magic lengths`, and one of two equal parts of
    // two is one. Laying ten tenths on it to arrive at the same place would be ceremony.
    if (Number.isInteger(N.exact)) {
      askWithLead(t('c3_f_lay_intro', { len: bold(lenLabel(N.rem)), k: N.k, d: D }),
        t('c3_f_q_whole', { d: D }), N.dt, () => nextStep(), t('c3_f_h_whole'),
        { decimal: true });
      return;
    }
    storyHTML('<div class="speaker">Eliel</div><p>' +
      t('c3_f_lay_intro', { len: bold(lenLabel(N.rem)), k: N.k, d: D }) + '</p>');
    addButton(t('btn_continue'), () => {
      clearGame();
      showEliel();
      // one d̃ drawn at QBAR, so a tenth of a MAGIC LENGTH is this much of it
      const TEN = QBAR * 0.1 / N.exact;
      const fit = Math.floor(N.exact * 10 + 1e-9);
      const exact = Math.abs(N.exact * 10 - fit) < 1e-9;
      const bar = quarterLayEl({ label: bold(DTIL) });
      gameArea.appendChild(bar);
      let left = 10, laid = 0;
      bar.__tray(left, TEN, 'c3_q_sup_tenths');
      const done = () => {
        bar.__stripOff();
        askAfterButton(t('c3_f_qLay'), fit, () => {
          clearGame();
          showEliel();
          gameArea.appendChild(sides());
          const lead = exact
            ? t('c3_f_lay_exact', { n: fit })
            : t('c3_f_lay_over', { n: fit });
          askWithLead(lead, t('c3_f_qDec', { d: D }), N.dt,
            () => nextStep(), t('c3_f_hDec'), { decimal: true });
        }, t('c3_f_hLay'));
      };
      bar.__hit(() => {
        if (left <= 0) return;
        const over = bar.__lay(TEN);            // ...draws green to the end, red past it
        laid++; left--;
        bar.__tray(left, TEN, 'c3_q_sup_tenths');
        // the piece that will not fit is the answer on a share that does not come out even;
        // on one that does, the last piece lands exactly on the end
        if (over || left === 0 || (exact && laid === fit)) done();
      });
      storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_f_lay_go', { d: D }) + '</p>');
    });
  };
  Object.defineProperty(step, 'name', { value: 'fMeasure' + A, configurable: true });
  step.fieldArea = A;
  return step;
}

function fWrapStep(A, last) {
  const N = fNums(A);
  const step = function () {
    clearGame();
    showEliel();
    // s̃ is what the question is about, so the whole side wears it — `?` while it is open and
    // the number once it lands, which is the chapter's own "?"-then-reveal.
    // d̃ wears its value here too (Sylvain): the wrap-up writes s̃ = s_A + d̃ = 2 + 0.75, and
    // every one of those three numbers should be readable off the ground it came from.
    const F = q => ({ A: true, sA: 'val', hi: DTIL + ' = ' + fmtNum(N.dt),
                      whole: bold(SUB1 + ' = ' + q) });
    const ASK = F('?'), GOT = F(fmtNum(N.s));
    const show = () => { clearGame(); showEliel(); gameArea.appendChild(fFieldEl(N, GOT)); };
    gameArea.appendChild(fFieldEl(N, ASK));
    // the chain opens on the thing we are actually after — the square root of THIS field's
    // area — so the number the child is about to write is visibly the answer to the question
    // the chapter asked, and the ≈ sits where it belongs
    askAfterButton(t('c3_f_qS', {
      chain: bold(nw(sqrtHTML(A) + ' &asymp; ' + SUB1 + ' = ' + SUB0 + ' + ' +
        DTIL + ' = ' + N.n + ' + ' + fmtNum(N.dt))),
    }), N.s, () => {
      show();
      const four = 4 * N.dt;
      const chain = bold(nw('4 &times; ' + fmtNum(N.s) + ' = 4 &times; (' + N.n + ' + ' +
        fmtNum(N.dt) + ') = 4 &times; ' + N.n + ' + 4 &times; ' + fmtNum(N.dt)));
      const part = bold(nw('4 &times; ' + fmtNum(N.dt)));
      // ⚠️ A side that is already whole needs no distributivity at all (Sylvain): 4 × 2 = 8
      // comes straight off Chapter 1's table, and taking it apart into 4 × (2 + 0) would be a
      // trick applied where there is nothing to untangle.
      //
      // THROUGH TENTHS where 4 × d̃ is not itself whole (Sylvain): 0.8 is eight tenths, four
      // eights are 32 tenths, and the dot moves one place to come back — Chapter 2's own road,
      // and every step of it something the child can check.
      if (!Number.isInteger(N.s) && !Number.isInteger(four)) {
        clearGame();
        showEliel();
        const tn = Math.round(N.dt * 10);
        const stage = () => { clearGame(); showEliel();
          gameArea.appendChild(fFieldEl(N, GOT)); };
        gameArea.appendChild(fFieldEl(N, GOT));
        askAfterButton(t('c3_f_q_t4', {
          chain: chain, part: part, d: bold(fmtNum(N.dt)), tn: tn,
          mul: bold(nw('4 &times; ' + tn)),
        }), 4 * tn, () => {
          stage();
          askAfterButton(t('c3_f_q_dot', { ten: bold(String(4 * tn)), part: part }), four,
            () => {
              stage();
              askAfterButton(t('c3_f_q_sum', {
                sum: bold(nw('4 &times; ' + N.n + ' + ' + fmtNum(four) + ' = ' + (4 * N.n) +
                  ' + ' + fmtNum(four))),
              }), N.fence, wrapUp, t('c3_f_h_sum'), { decimal: true });
            }, t('c3_f_h_dot'), { decimal: true });
        }, t('c3_f_h_t4', { tn: tn }));
        return;
      }
      // the fence, taken apart with Chapter 2's own identity before it is added up
      if (!N.round && Number.isInteger(four) && !Number.isInteger(N.s)) {
        clearGame();
        showEliel();
        gameArea.appendChild(fFieldEl(N, GOT));
        gameArea.appendChild(fFourEl(N, () => {
          // the pieces are gathered; now the number they came to, and only then the total
          askAfterButton(t('c3_f_q_four2', { d: bold(fmtNum(N.dt)) }), four, () => {
            askAfterButton(t('c3_f_q_wire2', {
              sum: bold(nw('4 &times; ' + N.n + ' + ' + four)),
            }), N.w, wrapUp, t('c3_f_h_wire', { n: N.n }));
          }, t('c3_f_h_four'));
        }));
        storyHTML('<div class="speaker">Eliel</div>' +
          '<p>' + t('c3_f_dist', {
            calc: bold('4 &times; ' + fmtNum(N.s)), chain: chain, d: bold(fmtNum(N.dt)),
          }) + '</p>' +
          '<p style="margin-top:10px">' + t('c3_f_q_four', { d: bold(fmtNum(N.dt)) }) +
          '</p>');
        return;
      }
      askAfterButton(t('c3_f_q_wire', { calc: bold('4 &times; ' + fmtNum(N.s)) }), N.w,
        wrapUp, t('c3_f_h_wire', { n: N.n }));
    }, t('c3_f_hS', { n: N.n }), { decimal: true });
    function wrapUp() {
      show();
      storyHTML('<div class="speaker">Eliel</div><p>' +
        t(last ? 'c3_f_done_last' : 'c3_f_done', {
          sqrt: bold(sqrtHTML(A)), s: bold(fmtNum(N.s)), w: bold(String(N.w)),
        }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    }
  };
  Object.defineProperty(step, 'name', { value: 'fWrap' + A, configurable: true });
  step.fieldArea = A;
  return step;
}

// what each field's fence came to — the three sources are the three stretches of the
// chapter, and this is what the wire screen writes under each square
function wireFor(A) {
  if (EASY.indexOf(A) >= 0) return 4 * Math.round(Math.sqrt(A));
  if (A === CHAPTER_AREA) return 4 * 2.25;
  return fNums(A).w;
}

// The wire total, added two at a time. The order is the smart one — everything that comes
// out whole first, then the three with tenths — so the tenths meet each other rather than
// being carried through every step. 11.2 + 12.8 is the beat the ordering exists for: two
// tenths and eight tenths ARE a magic length, and the pair lands on a whole 24.
function wireSumSteps() {
  const whole = [], frac = [];
  SOLVED.forEach(A => {
    const w = wireFor(A);
    (Number.isInteger(w) ? whole : frac).push({ v: w, fields: [A], d: 0 });
  });
  whole.sort((x, y) => x.v - y.v);
  frac.sort((x, y) => x.v - y.v);
  let nums = whole.concat(frac);
  const steps = [];
  // collapse a pair, left to right, until one number is left. The new number carries BOTH
  // sets of fields, so the box round it on the next step holds all of them.
  const take = (i, prompt, opts) => {
    const r = Math.round((nums[i].v + nums[i + 1].v) * 10) / 10;
    steps.push({
      entries: nums.map(e => ({ v: e.v, fields: e.fields.slice(), d: e.d })),
      pairIndices: [i, i + 1], pairResult: r,
      prompt: prompt || t('c3_f_sum_prompt'), opts: opts,
    });
    nums = nums.slice(0, i).concat([{
      v: r, fields: nums[i].fields.concat(nums[i + 1].fields),
      d: Math.max(nums[i].d, nums[i + 1].d) + 1,
    }], nums.slice(i + 2));
  };
  // ...the whole ones, in NEIGHBOURING PAIRS and then in pairs of those: 4+6, 8+8, 9+10,
  // 12+12, then 10+16, 19+24, then 26+43, then +14. Collapsing left to right instead would
  // make it a running total, which is a different (and duller) thing to do.
  let n = whole.length;
  while (n > 1) {
    let i = 0;
    while (i + 1 < n) { take(i); n--; i++; }
  }
  // ...then the two whose tenths complete each other, then the third, then everything
  take(nums.length - 3, t('c3_f_sum_tenths'), { decimal: true });
  take(nums.length - 2, null, { decimal: true });
  take(0, t('c3_f_sum_last'), { decimal: true });
  return steps;
}

// THE SUM, WITH CHAPTER 1's OWN REGROUPING (Sylvain) — and it is the FIELDS that go inside
// the grouping box, not just the figures. Each number in the running sum carries the fields it
// came out of; a number made of several fields is drawn as those fields side by side inside a
// coloured box with its value underneath, and the two being added are framed together in one
// more box carrying "?" until the child answers. That is `totalSeeds`, one chapter on.
//
// ⚠️ The fields are laid out in the SUM's order, not the order they were solved in — which is
// what the "let's put them in order" button is for. Otherwise a group would span fields that
// are not next to each other and the box would have to jump over its neighbours.
function wireGroupEl(entries, pair, valueOf, look) {
  const box = document.createElement('div');
  box.style.cssText = 'display:flex; flex-wrap:wrap; justify-content:center;' +
    'align-items:flex-end; gap:7px; margin-top:10px;';
  // ⚠️ EVERY field keeps its own number underneath it, whatever box it has ended up inside
  // (Sylvain). The group's total is written under the group, and the fields go on saying what
  // each of them was worth — otherwise a regrouping looks like the parts being replaced by the
  // whole rather than gathered into it.
  const L2 = look || {};
  const FPX = 24;
  const fieldUnit = (A, capCol) => {
    const u = document.createElement('div');
    u.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:3px;';
    const f = squareFieldEl(A, { px: FPX, fill: '#f9f4e2' });
    f.style.margin = '0';
    // ⚠️ The ground goes on saying what it is while it is being added up: Marimon's squares
    // and their seeds on the seed total, the green fence on the wire total. A number in the
    // sum should never stop being a picture of the field it came off.
    let inner2 = f;
    if (L2.seeds) {
      const h2 = document.createElement('div');
      h2.style.cssText = 'position:relative; display:inline-block;';
      h2.appendChild(f);
      h2.appendChild(marimonStripsEl(A, FPX));
      inner2 = h2;
    }
    const ring = document.createElement('div');
    ring.style.cssText = L2.fence
      ? 'padding:2px; border:2px solid #5a8f3d; border-radius:2px;'
      : 'display:inline-block;';
    ring.appendChild(inner2);
    u.appendChild(ring);
    const n2 = document.createElement('div');
    n2.textContent = fmtNum(valueOf(A));
    n2.style.cssText = 'font-size:12px; color:' + (capCol || '#8a8168') + ';' +
      (capCol ? 'font-weight:bold;' : '');
    u.appendChild(n2);
    return u;
  };
  // ⚠️ The + between the two being added is part of the regrouping and wears its colour too
  // (Sylvain) — Chapter 1's totals highlight the sign, not only the numbers. A sum sign that
  // stays grey says the two numbers happen to be next to each other; a coloured one says they
  // are being put together.
  const plus = col => {
    const p2 = document.createElement('div');
    p2.textContent = '+';
    p2.style.cssText = 'font-size:' + (col ? 21 : 17) + 'px; padding-bottom:20px;' +
      'color:' + (col || '#8a8168') + ';' + (col ? 'font-weight:bold;' : '');
    return p2;
  };
  // a group: its fields side by side inside the coloured cell, and its value UNDER them but
  // still INSIDE the cell — the number belongs to the box, so it lives in it
  const cell = (kids, d, label, labelCol, plusCol) => {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px;' +
      'border:3px solid ' + groupColors[(d - 1) % groupColors.length] + ';' +
      'background:' + groupBgs[(d - 1) % groupBgs.length] + ';' +
      'border-radius:9px; padding:4px 7px;';
    const row2 = document.createElement('div');
    row2.style.cssText = 'display:flex; align-items:flex-end; gap:6px;';
    kids.forEach((k, i) => { if (i) row2.appendChild(plus(plusCol)); row2.appendChild(k); });
    c.appendChild(row2);
    const cap = document.createElement('div');
    cap.innerHTML = '<strong>' + label + '</strong>';
    cap.style.cssText = 'font-size:17px; color:' +
      (labelCol || groupColors[(d - 1) % groupColors.length]) + ';';
    c.appendChild(cap);
    return c;
  };
  // ⚠️ The two being added take the colour of the cell they are joining, not of the cell they
  // are in (Sylvain) — the same rule the equation line follows, so `10 + 26` reads red in both
  // halves at once. Their own boxes keep their own colour: the box says where the number came
  // from, the number says where it is going.
  const entryEl = (e, capCol) => (e.d
    // ⚠️ NOT `e.fields.map(fieldUnit)` — map hands the callback (value, index, array), so the
    // index arrives as the caption colour and every field after the first goes bold in a
    // colour that is not one. Harmless while fieldUnit took one argument; a bug the moment it
    // took two.
    ? cell(e.fields.map(A => fieldUnit(A)), e.d, fmtNum(e.v), capCol)
    : fieldUnit(e.fields[0], capCol));
  entries.forEach((e, i) => {
    if (i === pair[0]) {
      if (i) box.appendChild(plus());
      // the two being added, framed together, the "?" under them and inside their cell
      const d2 = Math.max(entries[i].d, entries[i + 1].d) + 1;
      const NEW = groupColors[(d2 - 1) % groupColors.length];
      box.appendChild(cell(
        [entryEl(entries[i], NEW), entryEl(entries[i + 1], NEW)], d2, '?', null, NEW));
      return;
    }
    if (i === pair[0] + 1) return;
    if (i) box.appendChild(plus());
    box.appendChild(entryEl(e));
  });
  return box;
}

// Both totals are added the same way, so the loop that does it is written once. `steps` comes
// out of the same pairwise collapse; `valueOf` is what each field is worth on this screen —
// its fence on the wire screen, its area on the seed screen.
function runSum(steps, valueOf, onDone, look) {
  const orig = steps[0].entries.map(e => e.v);
  let k = 0;
  const go = () => {
    if (k >= steps.length) { onDone(); return; }
    const st = steps[k];
    clearGame();
    showEliel();
    gameArea.appendChild(wireGroupEl(st.entries, st.pairIndices, valueOf, look));
    gameArea.appendChild(wireEqEl(orig, st.entries, st.pairIndices));
    storyHTML('<div class="speaker">Eliel</div><p>' + st.prompt + '</p>');
    askNumber('', st.pairResult, () => { k++; go(); },
      fmtNum(st.entries[st.pairIndices[0]].v) + ' + ' +
      fmtNum(st.entries[st.pairIndices[1]].v), st.opts);
  };
  go();
}

// The equation half of the same picture, and it moves at the SAME pace as the plot above it
// (Sylvain): Chapter 1's totalWire shape exactly — the original twelve stay in grey, an `=`
// underneath, and then the sum as it stands, with **every number wearing the colour of the box
// its fields are in** and the two about to be added wearing the new one. So the child can read
// the same regrouping twice over, once as ground and once as arithmetic.
function wireEqEl(orig, entries, pair) {
  const d2 = Math.max(entries[pair[0]].d, entries[pair[0] + 1].d) + 1;
  const NEW = groupColors[(d2 - 1) % groupColors.length];
  const colOf = e => (e.d ? groupColors[(e.d - 1) % groupColors.length] : '#5a5240');
  const wrap = document.createElement('div');
  wrap.style.cssText = 'text-align:center; margin-top:16px;';
  const grey = document.createElement('div');
  grey.textContent = orig.map(v => fmtNum(v)).join(' + ');
  grey.style.cssText = 'font-size:15px; color:#a89f88;';
  wrap.appendChild(grey);
  const line = document.createElement('div');
  line.style.cssText = 'margin-top:5px; font-size:20px; color:#5a5240;';
  let html = '= ';
  entries.forEach((e, i) => {
    // the + that joins the pair is coloured with them; every other one stays grey
    if (i) html += (i === pair[0] + 1
      ? ' <span style="color:' + NEW + '"><strong>+</strong></span> '
      : ' + ');
    const inPair = i === pair[0] || i === pair[0] + 1;
    html += '<span style="color:' + (inPair ? NEW : colOf(e)) +
      (inPair ? '; background:' + groupBgs[(d2 - 1) % groupBgs.length] +
                '; border-radius:4px; padding:1px 5px' : '') +
      '"><strong>' + fmtNum(e.v) + '</strong></span>';
  });
  line.innerHTML = html;
  wrap.appendChild(line);
  return wrap;
}

// The seeds, added the same way — twelve areas, smallest first, in neighbouring pairs. No
// tenths anywhere here (an area is a whole number of magic squares every time), so no special
// beat and no decimal input: it is the same machinery with an easier set of numbers, which is
// the right way round — the child meets the shape on the hard total and repeats it on the easy
// one, rather than the other way about.
function seedSumSteps() {
  let nums = SOLVED.map(A => ({ v: A, fields: [A], d: 0 }));
  nums.sort((x, y) => x.v - y.v);
  const steps = [];
  const take = i => {
    const r = nums[i].v + nums[i + 1].v;
    steps.push({
      entries: nums.map(e => ({ v: e.v, fields: e.fields.slice(), d: e.d })),
      pairIndices: [i, i + 1], pairResult: r, prompt: t('c3_f_sum_prompt'),
    });
    nums = nums.slice(0, i).concat([{
      v: r, fields: nums[i].fields.concat(nums[i + 1].fields),
      d: Math.max(nums[i].d, nums[i + 1].d) + 1,
    }], nums.slice(i + 2));
  };
  let n = nums.length;
  while (n > 1) {
    let i = 0;
    while (i + 1 < n) { take(i); n--; i++; }
  }
  return steps;
}

// every field the child actually solves, in the order they meet them
const SOLVED = EASY.concat([CHAPTER_AREA], F_AREAS);
const TOTAL_SEEDS = SOLVED.reduce((t, A) => t + A, 0);
const TOTAL_WIRE = EASY.reduce((t, A) => t + 4 * Math.round(Math.sqrt(A)), 0) +
  4 * 2.25 + F_AREAS.reduce((t, A) => t + fNums(A).w, 0);

(function spliceInPartF() {
  const at = chapterSteps.findIndex(f => f.name === 'fTotalWire');
  const runs = [];
  F_AREAS.forEach((A, i) => {
    runs.push(fLayStep(A, i === 0), fShareStep(A), fMeasureStep(A),
      fWrapStep(A, i === F_AREAS.length - 1));
  });
  chapterSteps.splice(at, 0, ...runs);
})();

// Part G puts two of the twelve fields back under the check, so its three field screens
// carry their own area — bound here rather than by a line inside each step, for the same
// reason as everything else in this chapter: ?step=N and the debug bar enter at an
// arbitrary index, in any order, and the geometry has to be right before the step's first
// line runs. The two fields come off G_BAD rather than being written out, so the pair
// cannot drift from the meter that selects them.
(function bindPartG() {
  const bind = (name, A) => {
    const fn = chapterSteps.find(f => f.name === name);
    if (fn) fn.fieldArea = A;
  };
  ['gSplit1', 'gBlock1', 'gStrips1', 'gCorner1'].forEach(n => bind(n, G_BAD[0]));
  bind('gCheck2', G_BAD[1]);
})();

// PART H, then the closing PRECISION screens (Sylvain, 2026-08-22). One full run per field,
// spliced in before `hEnd`, the same shape as Part F's own splice; the four diverge only where
// the field does. `hAgain` closes Part H — it writes the two rounds as one move, which is a
// sentence about something the child has by then done.
//
// ⚠️ THE PRECISION SCREENS COME AFTER `hEnd`, NOT BEFORE PART H. They were tried in front of it
// on 2026-08-22, so that the length error could choose the fields to refine; Sylvain moved them
// back the same day. The consequence is the ranking: Part H picks off the meter the child
// actually has, which is the AREA one, and that is why there are four rounds and not five.
//
// The DERIVATION stands on the area-3 field, where the band is fat enough to see — a band's
// legibility is a ratio, not a size, and scaling cannot help because it scales both. It prints
// not one number, so standing it on a refined field gives nothing away. Everything after it
// stands on H_SHOW, the field the chapter never refines and the only one whose division a child
// can do.
(function splicePartH() {
  const at = chapterSteps.findIndex(f => f.name === 'hEnd');
  const bind = (fns, A) => fns.map(fn => {
    const w = function () { return fn.apply(this, arguments); };
    Object.defineProperty(w, 'name', { value: fn.name, configurable: true });
    w.fieldArea = A;
    return w;
  });
  chapterSteps.splice(at, 0,
    ...G_BAD.reduce((all, A) => all.concat(hStepsFor(A)), [])
      .concat(hStepsFor(H_THIRD, [hWorst], hSevenBand, hMid(H_THIRD)))
      .concat(hStepsFor(H_FOURTH, [hWorst], hSevenBand, hMid(H_FOURTH))));
  // ...and the precision screens after it, closing the chapter.
  const end = chapterSteps.findIndex(f => f.name === 'hEnd');
  // ⚠️ `hAgain` sits AFTER the precision screens now (Sylvain, 2026-08-22), not at the end of
  // Part H: it writes the two rounds as one move, and what follows it is the chapter doing
  // exactly that — one more round on all twelve, and then another.
  // ⚠️ THE WHOLE PRECISION STRETCH NOW STANDS ON H_SHOW, the field the chapter never refines
  // (Sylvain, 2026-08-22) — including the derivation, which used to be drawn on the area-3 one
  // for legibility. And between the derivation and the report, Part H's own run: the same
  // screens the four refined fields had, on this field's own numbers, truncated before
  // `hAnswer`, because this time the number is not spent — only reported.
  chapterSteps.splice(end + 1, 0,
    ...bind([hPrec1, hPrec2], H_SHOW)
      .concat(hStepsFor(H_SHOW, [], hSevenBand, hMid(H_SHOW), true))
      .concat(bind([hPrec3, hPrec4, hPrec5], H_SHOW))
      .concat(bind([hAgain, hRound2, hRound3, hFinal], H_SHOW)));
})();

// Every step runs on ITS OWN field, bound here rather than by a line inside each step —
// which is what keeps ?step=N and the debug jump bar honest: they enter at an arbitrary
// index, in any order, and the geometry has to be right before the step's first line runs.
// Chapter 2 built this at Part F and paid for the retrofit; Chapter 3 has it from screen one.
// The name is carried across by hand, or the debug bar labels every step "step N".
const steps = chapterSteps.map(fn => {
  const area = fn.fieldArea || CHAPTER_AREA;
  const wrapped = function () { setArea(area); return fn.apply(this, arguments); };
  Object.defineProperty(wrapped, 'name', { value: fn.name, configurable: true });
  return wrapped;
});

startGame(steps);

</script>
