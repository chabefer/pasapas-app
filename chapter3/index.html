      const d = document.createElement('div');
      d.style.cssText = 'position:absolute; left:' + x + 'px; top:' + y + 'px;' +
        'width:' + w + 'px; height:' + h + 'px; z-index:1; pointer-events:none;' + HATCH +
        'outline:2px solid #c98a2a; outline-offset:-1px;';
      stage.appendChild(d);
    });
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const cell = document.createElement('div');
      cell.className = 'field-cell filled';
      cell.style.cssText = 'position:absolute; left:' + (c * PX) + 'px;' +
        'top:' + (side - (r + 1) * PX) + 'px; width:' + PX + 'px; height:' + PX + 'px;' +
        'z-index:2; pointer-events:none;';
      stage.appendChild(cell);
    }
  }
  if (withBrace) hangSide(stage, side, block, label);
  return stage;
}

// The length itself, made into a thing: a bar under the field spanning exactly the side in
// question, with its value written beneath. One routine, so the bar on the screen that ASKS
// for the length and the bar on the screen that CHECKS it are the same object in the same
// place — the child is not shown two different pictures of one length.
// The label carries "?" until the answer lands, which is the chapter's own ordering, and it
// carries the UNIT in both states: a question mark stands for a quantity of something, never
// for a bare number (Chapter 2's tallyView rule).
function hangSide(stage, side, wpx, labelHTML) {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:absolute; left:0; top:' + (side + 6) + 'px;' +
    'width:' + wpx + 'px; height:12px; border:3px solid #2f6fb5; border-top:none;' +
    'box-sizing:border-box; z-index:3;';
  stage.appendChild(bar);
  if (labelHTML) {
    const cap = document.createElement('div');
    cap.innerHTML = labelHTML;
    // Centred on the bar and allowed to overhang it — on the area-1 field the side is 80px
    // and "1 magic length" is wider than that, and shrinking the words to fit a short side
    // would make the label smaller exactly where the field is smallest.
    cap.style.cssText = 'position:absolute; left:0; top:' + (side + 22) + 'px;' +
      'width:' + wpx + 'px; text-align:center; white-space:nowrap; z-index:3;' +
      'font-size:16px; color:#2f6fb5;';
    stage.appendChild(cap);
  }
  stage.style.height = (side + (labelHTML ? 48 : 26)) + 'px';
  return stage;
}

// ⚠️ Singular, for the area-1 field and for any side of one magic length.
function lenLabel(s) {
  return t(s === 1 ? 'c3_a_lbl_len_one' : 'c3_a_lbl_len', { s: s });
}

// The three fields whose side the child can already find, smallest first. Their areas are
// the perfect squares in range, which is exactly why they are doable — but that is the thing
// to be discovered by doing them, so nothing on screen says it in advance.
const EASY = [1, 4, 9];

// The radical, drawn properly: the tick and the bar over the number it covers. A bare "√5"
// would do, but this is the notation the child will meet at school, and the chapter's rule
// is that notation arrives once, correctly, at the moment it is needed.
// ⚠️ Returns HTML, so it may only go into a story panel. Hints render with textContent
// (fb_hint in pap-core.js) and would print the markup literally.
function sqrtHTML(inner) {
  return '<span style="white-space:nowrap">&radic;<span style="border-top:1.5px solid currentColor;' +
    'padding:0 3px 0 1px; margin-left:-1px">' + inner + '</span></span>';
}

// The three solved fields, to scale, each with its side written under it as a square root.
// This is the picture the name arrives on: three answers the child found themselves, now
// wearing the notation for the first time.
function solvedFieldsEl() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; align-items:flex-end; justify-content:center; gap:34px; margin-top:8px;';
  for (const A of EASY) {
    const sd = Math.round(Math.sqrt(A));
    const cell = document.createElement('div');
    cell.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:6px;';
    // Drawn as the magic squares the child actually laid, not as a solid green block: the
    // caption names the SIDE, and the ground under it has to go on saying how the area was
    // covered, or the picture stops being the one they just made. Chapter 1's covered
    // colours, hand-built rather than showFilledField, whose .filled::after always draws a
    // seed — nothing is being planted here yet.
    const f = document.createElement('div');
    f.style.cssText = 'display:grid; flex:none; border-radius:3px;' + EDGE +
      'grid-template-columns:repeat(' + sd + ',44px); grid-template-rows:repeat(' + sd + ',44px);';
    for (let i = 0; i < A; i++) {
      const c = document.createElement('div');
      c.style.cssText = 'box-sizing:border-box; width:44px; height:44px;' +
        'background:#d4edda; border:1px solid #8aba8a;';
      f.appendChild(c);
    }
    // the side itself, marked along the bottom — it is what the notation names
    const bar = document.createElement('div');
    // Exactly the side's own length: with the boundary outside the land (see EDGE), the
    // grid's width IS sd magic lengths, so the mark and the side it names agree.
    bar.style.cssText = 'width:' + (sd * 44) + 'px; height:9px; box-sizing:border-box;' +
      'border:3px solid #2f6fb5; border-top:none;';
    cell.appendChild(f);
    cell.appendChild(bar);
    const cap = document.createElement('div');
    cap.innerHTML = sqrtHTML(A) + ' = ' + sd;
    cap.style.cssText = 'font-size:19px; color:#3a3a3a; white-space:nowrap; margin-top:2px;';
    cell.appendChild(cap);
    wrap.appendChild(cell);
  }
  return wrap;
}

// One of the three easy fields, start to finish: the area is given, the child covers the
// ground with it, and the SIDE is what falls out. Chapter 1 went side -> area; this is the
// same machinery run backwards, and it is not a reflex yet, so all three get the full run.
// ⚠️ Built from A, never from module state: this runs at LOAD, before setArea has been
// called for this field. Inside the returned function, module state is correct, because the
// wrapper at the bottom of the file has set the area before the first line runs.
function easyFieldStep(A) {
  const sd = Math.round(Math.sqrt(A));
  const step = function () {
    clearGame();
    showEliel();
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_a_fill', { label: areaLabel(A) }) + '</p>');
    layMagicSquares({
      // The moment the ground is covered, the SIDE is drawn — the bar under the field,
      // carrying "? magic lengths". Asking about a length while nothing on screen points at
      // one makes the child find the question before they can answer it.
      onFull: (stage, side) => {
        hangSide(stage, side, sd * PX, lenLabel('?'));
        askInline(t('c3_a_side_q'), sd, () => {
          clearGame();
          showEliel();   // clearGame() empties elf-area as well — without this he vanishes
          // Same field, same bar, same place — now with the answer written under it, so the
          // s in "s TIMES s = a" and the length on the ground are visibly one number.
          // Chapter 1's table comes up beneath with the answer showing: this is a
          // confirmation of something just worked out, not a lookup still to do.
          gameArea.appendChild(coveredBlockEl(true, lenLabel(sd)));
          gameArea.appendChild(showFullMultTable(1, 10, { a: sd, b: sd }, false));
          storyHTML('<div class="speaker">Eliel</div><p>' +
            t('c3_a_side_ok', { s: sd, a: A }) + '</p>');
          addButton(t('btn_continue'), nextStep);
        }, t('c3_a_side_hint'));
      },
    });
  };
  Object.defineProperty(step, 'name', { value: 'aEasy' + A, configurable: true });
  step.fieldArea = A;
  return step;
}

// ---------------------------------------------------------------------------
// THE ZOOM LADDER — Part A', and the picture the whole part rests on.
//
// The side is measured three times over, each pass on what the pass before it could not
// reach: whole magic lengths, then tenths, then hundredths. Each row is the previous row's
// LEFTOVER, magnified so that the new unit is a comfortable size, with a cone joining the
// two so the child can see it is the same piece of ground and not a new picture.
//
// It is drawn as a LADDER rather than as Chapter 2's ring-cone-lens, and deliberately: a
// lens shows one magnification, and the content here is that there is always another one.
// Stacking the rows is what makes "and we could go on for ever" a thing you can look at.
// The cone and the magnification are Chapter 2's vocabulary, so nothing new has to be
// learned about how to read it.
//
// ⚠️ Every quantity is derived from FIELD, which setArea fills in — so these are functions,
// never module-level consts (lesson 27).
// ---------------------------------------------------------------------------
const UPX = 62;          // pixels per unit on a magnified row
const ROWH = 26;         // the drawn thickness of a measured side
const CONE = 44;         // vertical space the cone between two rows gets

// How the measuring actually goes: at each level, how many of the current unit fit, and
// what is left. Level 0's unit is a whole magic length, level 1's a tenth, level 2's a
// hundredth. Pure arithmetic on FIELD.s, and the ONLY place these digits are decided.
function measureLevels(n) {
  const out = [];
  let rest = FIELD.s, unit = 1;
  for (let k = 0; k < n; k++) {
    const laid = Math.floor(rest / unit + 1e-9);
    out.push({ k: k, unit: unit, laid: laid, span: rest, rest: rest - laid * unit });
    rest -= laid * unit;
    unit /= 10;
  }
  return out;
}

// One measured row: the side, the units laid along it, and the piece at the end they could
// not reach. Level 0 is drawn at the FIELD's own scale, so it is literally the bottom side of
// the field above it; every other row is drawn at UPX per unit, which is the magnification.
//
// ⚠️ ONLY the leftover is hatched. The first version hatched the whole row and drew the laid
// pieces over it — and a laid piece is a 7px LINE (Chapter 1's vocabulary for a magic length
// on a boundary), which simply disappears into a hatched background. Worse, it made the hatch
// mean nothing: hatching is this project's mark for ground a piece could not reach, so it has
// to stop exactly where the pieces stop. Found by looking; the DOM was correct throughout.
function ladderRow(lv, laidCount) {
  const px = lv.k === 0 ? PX : UPX;
  const w = lv.span / lv.unit * px;          // the whole row, in pixels
  const green = laidCount * px;
  const row = document.createElement('div');
  row.style.cssText = 'position:relative; height:' + ROWH + 'px; width:' + w + 'px;';

  const base = document.createElement('div');
  base.style.cssText = 'position:absolute; left:0; top:0; width:' + w + 'px; height:' + ROWH +
    'px; box-sizing:border-box; background:#fffef5; border:1px solid #d8cfae; border-radius:2px;';
  row.appendChild(base);

  const rest = document.createElement('div');
  rest.style.cssText = 'position:absolute; left:' + green + 'px; top:0; z-index:1;' +
    'width:' + (w - green) + 'px; height:' + ROWH + 'px; box-sizing:border-box;' + HATCH +
    'outline:2px solid #c98a2a; outline-offset:-1px;';
  row.appendChild(rest);
  // Kept, because on the row the child is laying on the leftover has to RETREAT as pieces go
  // down — otherwise the hatch sits across the whole row for the whole interaction and says
  // "none of this is measured" while the child is measuring it.
  row.__rest = rest;
  row.__w = w;

  for (let i = 0; i < laidCount; i++) row.appendChild(ladderPiece(i * px, px));
  row.dataset.w = w;
  row.dataset.green = green;
  return row;
}

// One laid unit, centred in the row's thickness.
function ladderPiece(x, px) {
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute; top:' + Math.round((ROWH - 20) / 2) + 'px;' +
    'left:' + x + 'px; z-index:2; pointer-events:none;';   // pointer-events load-bearing:
  d.innerHTML = lengthSVG(true, px, 0, px);                // a laid piece must not swallow
  return d;                                                // the click that lays the next one
}

// The cone from one row's leftover down to the next row's full width — the same widening
// pair of guides Chapter 2's lens used, which is what says "this is that, magnified".
function ladderCone(fromX0, fromX1, toX0, toX1) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const lo = Math.min(fromX0, toX0), hi = Math.max(fromX1, toX1);
  svg.setAttribute('width', hi - lo);
  svg.setAttribute('height', CONE);
  svg.style.cssText = 'display:block; position:absolute; left:' + lo + 'px;';
  const poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', [
    [fromX0 - lo, 0], [fromX1 - lo, 0], [toX1 - lo, CONE], [toX0 - lo, CONE],
  ].map(pt => pt.join(',')).join(' '));
  poly.setAttribute('fill', 'rgba(232,163,61,0.16)');
  poly.setAttribute('stroke', '#c98a2a');
  poly.setAttribute('stroke-width', '1.5');
  poly.setAttribute('stroke-dasharray', '5 4');
  svg.appendChild(poly);
  return svg;
}

// The whole apparatus: the field, its bottom side as row 0, and one row per magnification.
// `active` is the level the child is laying on; everything above it is already done.
// onDone fires when the active row is full.
function zoomLadder(active, onDone) {
  const lvs = measureLevels(active + 1);
  const side = FIELD.s * PX;
  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:8px auto 0;';

  // the field itself, sitting on row 0 — the side being measured is its own bottom edge
  const f = document.createElement('div');
  f.style.cssText = 'position:absolute; left:0; top:0; width:' + side + 'px; height:' + side +
    'px; background:#f4f0e4; border-radius:3px;' + EDGE;
  box.appendChild(f);

  // Two passes. Each row is centred on the MIDDLE OF THE LEFTOVER IT MAGNIFIES, not on the
  // page — otherwise the cone runs diagonally across the picture and reads as an arrow
  // pointing somewhere else rather than as a widening view of one piece of ground. Positions
  // are worked out first, then shifted as a block so nothing falls off the left edge.
  const rows = [];
  let y = side + 12;
  let cx = side / 2;                          // where the next row wants its centre
  lvs.forEach((lv, i) => {
    const laid = i < active ? lv.laid : 0;
    const px = lv.k === 0 ? PX : UPX;
    const row = ladderRow(lv, laid);
    const w = +row.dataset.w;
    rows.push({ lv: lv, el: row, x: cx - w / 2, w: w, y: y, px: px });
    // the leftover's midpoint, in this row's own coordinates, becomes the next row's centre
    cx = (cx - w / 2) + lv.laid * px + (w - lv.laid * px) / 2;
    y += ROWH;
    if (i < lvs.length - 1) y += CONE + 12;
  });
  const shift = Math.max(0, -Math.min.apply(null, rows.map(r => r.x)));
  f.style.left = (rows[0].x + shift) + 'px';
  const wide = Math.max(side, Math.max.apply(null, rows.map(r => r.x + shift + r.w)));
  box.style.width = wide + 'px';
  rows.forEach(r => {
    r.x += shift;
    r.el.style.position = 'absolute';
    r.el.style.left = r.x + 'px';
    r.el.style.top = r.y + 'px';
    box.appendChild(r.el);
  });

  // cones, drawn once the geometry of both ends is known
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    const gx = a.x + a.lv.laid * a.px;           // where a's leftover starts
    const cone = ladderCone(gx, a.x + a.w, b.x, b.x + b.w);
    cone.style.top = (a.y + ROWH + 5) + 'px';
    box.appendChild(cone);
  }

  // The bottom row is the child's to lay — but only on the screens that ask for it. The two
  // closing screens draw the ladder with one row MORE than has been measured, and that row
  // stays bare on purpose: it is the next magnification, still untouched, which is what
  // "and we could go on for ever" looks like. Nothing there should be clickable.
  if (!onDone) { box.style.height = (y + 30) + 'px'; return box; }

  const act = rows[rows.length - 1];
  let laid = 0;
  const lay = () => {
    if (laid >= act.lv.laid) return;
    act.el.appendChild(ladderPiece(laid * act.px, act.px));
    laid++;
    const covered = laid * act.px;
    act.el.__rest.style.left = covered + 'px';
    act.el.__rest.style.width = (act.el.__w - covered) + 'px';
    if (laid < act.lv.laid) say('Eliel', t('c3_a_keep'));
    else if (onDone) onDone();
  };
  // The hit strip runs the whole row and a good way above and below it: a row is 26px tall
  // and the child is aiming at a strip, not at a slot. Chapter 2's rule, twice over.
  const strip = document.createElement('div');
  strip.style.cssText = 'position:absolute; left:' + act.x + 'px; top:' + (act.y - 12) + 'px;' +
    'width:' + act.w + 'px; height:' + (ROWH + 24) + 'px; z-index:3; cursor:pointer;';
  strip.addEventListener('click', lay);
  strip.addEventListener('dragover', e => e.preventDefault());
  strip.addEventListener('drop', e => {
    e.preventDefault();
    lay();
    if (currentDraggedLength) { currentDraggedLength.remove(); currentDraggedLength = null; }
  });
  box.appendChild(strip);

  box.style.height = (y + 30) + 'px';
  return box;
}

// ---------------------------------------------------------------------------
// THE FOUR-RECTANGLE SQUARE — Part B, and Chapter 2's own picture with both sides
// the same. Chapter 2 cut a rectangle's two sides and got a x c + b x c + a x d + b x d;
// cut a SQUARE's two sides at the same place and the four pieces are 2x2, 2xd, 2xd and dxd.
// That is the whole of this chapter, and it is why decimals had to come first.
//
// ⚠️ d is 19px wide on this field. Three of the four regions are therefore a MARK, not a
// place that can hold a label — so nothing is written inside them. The four terms sit in a
// legend under the picture, each in its own region's ink, and the region lights up when its
// term is being talked about. Colour is the link (Chapter 2's lesson 20), which is what
// makes leader lines unnecessary here.
// ---------------------------------------------------------------------------
// THE TILDE â and it arrives at the APPROXIMATION, which is where it belongs (Sylvain).
//
// The true d satisfies `4d + d² = 1` exactly. The moment Part C crosses the corner out, the
// number that solves what is left is no longer d: it is a NEW number, and `4 × d̃ = 1` is
// then an EXACT statement, because d̃ is defined as the one that makes it true. What is
// approximate is `d̃ ≈ d`.
//
// That distinction is worth the notation twice over: it makes every equals sign in Parts D
// and E a real equals â d̃ = 0.25 exactly, s̃ = 2 + d̃ = 2.25 exactly,
// s̃² = 5 + d̃² = 5 + 1/16 exactly â so the ONLY approximate step in the whole
// chapter is the one where the corner was dropped, and Part E's check measures precisely that.
//
// Combining tilde (U+0303) on every letter so they wear the same mark; a precomposed one
// sits differently on the line.
const DTIL = 'd\u0303', STIL = 's\u0303', ATIL = 'a\u0303';
const nw = h => '<span style="white-space:nowrap">' + h + '</span>';
const bold = h => '<strong>' + nw(h) + '</strong>';

const REG = {
  a: { fill: '#d4edda', ink: '#3f7a34' },   // 2 x 2 — the magic squares, Chapter 1's colour
  b: { fill: '#dbe7f5', ink: '#2f6fb5' },   // 2 x d — the band above
  c: { fill: '#f7dfe6', ink: '#b5497a' },   // d x 2 — the strip beside
  d: { fill: '#f6e6c8', ink: '#b8862a' },   // d x d — the corner, and the one we throw away
};

// Where the four pieces are, in pixels, on a square of side `sideMl` split at n magic
// lengths. Defaults to the field itself; Part E passes 2.25, the side we computed, so that
// the checking picture is honestly the square of OUR answer and not of the true side.
// ⚠️ `splitMl` is additive. Round 1 always cuts at FIELD.n — the whole magic squares that
// fitted — so every call up to Part G passes nothing and is unchanged by construction. Part H
// cuts the SAME square somewhere else: at our new, shaved answer. Same four regions, same
// four colours, read the other way round.
function regionBoxes(sideMl, splitMl) {
  const side = (sideMl == null ? FIELD.s : sideMl) * PX;
  const a = (splitMl == null ? FIELD.n : splitMl) * PX, b = side - a;
  return {
    a: { x: 0, y: side - a, w: a, h: a },
    b: { x: 0, y: 0, w: a, h: b },
    c: { x: a, y: side - a, w: b, h: a },
    d: { x: a, y: 0, w: b, h: b },
    side: side, aPx: a, bPx: b,
  };
}

// The field, cut or uncut. opts:
//   cut        draw the four regions (otherwise one plain field)
//   focus      key, or a list of keys — everything else fades
//   squares    draw the four magic squares inside region a
//   side       draw a square of this side instead of the field's (Part E passes 2.25)
//   brackets   true for the Chapter 2 default (bottom side, 2 + d), or an object:
//                {lo, hi}   the two piece labels
//                {whole}    an outer bracket spanning the WHOLE side, labelled
//                {both}     the same mark-up on the left side as well
//
// ⚠️ Brackets on the left side push the whole picture right, so every absolutely-positioned
// child is offset by OX. Chapter 2 needed the same padL/padR bookkeeping for the same
// reason, and got caught once by a field that jumped sideways between consecutive screens —
// so the offset is a constant, not a per-screen measurement.
// Left-hand room for the vertical brackets. Four things have to fit between the page edge
// and the field, in this order: the WHOLE-side label, its bracket, the piece label, its
// bracket. 192 is what that comes to with "s̃ = 2.25" as the widest label — measured, not
// guessed, because at 118 the whole-side label had nowhere to go and sat on top of the
// piece bracket.
const BPADL = 192, BPADB = 46, BPADB2 = 82;
const BVIN = 26, BVOUT = 96;      // bracket left edges, inner and outer, back from the field

function squareSplitEl(opts) {
  const o = opts || {};
  const R = regionBoxes(o.side, o.split);
  const lit = o.focus == null ? null : (Array.isArray(o.focus) ? o.focus : [o.focus]);
  const br = (o.brackets === true) ? { lo: '2', hi: '<strong>d</strong>' }
           : (o.brackets || null);
  // BPADL (192) is sized for Part E's whole-side label (`s̃ = 2.25`). A screen whose side
  // labels are two characters long carries 100px of empty gutter for nothing — and when the
  // field sits beside a second figure, that empty gutter pushes the pair off centre.
  // ⚠️ Floor: vbar right-aligns its label into [OX − BVOUT + 11, OX − BVIN − 6], which goes
  // negative below about 100.
  const OX = (br && br.both) ? (o.padL || BPADL) : 0;
  const stage = document.createElement('div');
  stage.style.cssText = 'position:relative; margin:8px auto 0;' +
    'width:' + (R.side + OX) + 'px; height:' + R.side + 'px;';

  const base = document.createElement('div');
  base.style.cssText = 'position:absolute; left:' + OX + 'px; top:0; width:' + R.side + 'px;' +
    'height:' + R.side + 'px; background:#f4f0e4; border-radius:3px;' + EDGE;
  stage.appendChild(base);

  if (o.cut) {
    const gone = o.off == null ? [] : (Array.isArray(o.off) ? o.off : [o.off]);
    ['a', 'b', 'c', 'd'].forEach(k => {
      const g = R[k];
      const el = document.createElement('div');
      const on = lit == null || lit.indexOf(k) >= 0;
      const off = gone.indexOf(k) >= 0;
      // A region that has been TAKEN OFF is drawn as bare ground with a dashed edge: the
      // piece is gone, but the hole it left is still part of the field and has to stay
      // visible, or the picture stops being the field the child has been looking at.
      el.style.cssText = 'position:absolute; left:' + (g.x + OX) + 'px; top:' + g.y + 'px;' +
        'width:' + g.w + 'px; height:' + g.h + 'px; box-sizing:border-box; z-index:1;' +
        (off
          ? 'background:#f4f0e4; outline:1.5px dashed #b9ae94; outline-offset:-1px;'
          : 'background:' + REG[k].fill + '; outline:1.5px solid ' + REG[k].ink + ';' +
            'outline-offset:-1px;' + (on ? '' : 'opacity:0.28;'));
      stage.appendChild(el);
      // ⚠️ The whole magic lengths inside the two STRIPS, ticked (Sylvain). Each strip is
      // `n` magic lengths long, and until now it was a plain rectangle — the `2` in `2 × d`
      // had to be taken from the bracket outside rather than counted in the piece itself.
      // Lighter than the outline, so the strip still reads as ONE strip made of n parts
      // rather than as n strips; the same rule Chapter 2's fused magic length follows.
      if (o.stripTicks && !off && (k === 'b' || k === 'c')) {
        for (let i = 1; i < FIELD.n; i++) {
          const tk = document.createElement('div');
          const vert = k === 'b';
          tk.style.cssText = 'position:absolute; z-index:1; pointer-events:none;' +
            'background:' + REG[k].ink + '; opacity:' + (on ? 0.45 : 0.13) + ';' +
            (vert
              ? 'left:' + (g.x + OX + i * PX) + 'px; top:' + g.y + 'px; width:1.5px;' +
                'height:' + g.h + 'px;'
              : 'left:' + (g.x + OX) + 'px; top:' + (g.y + i * PX) + 'px;' +
                'width:' + g.w + 'px; height:1.5px;');
          stage.appendChild(tk);
        }
      }
    });
  }
  if (o.squares && o.off && String(o.off).indexOf('a') >= 0) o.squares = false;

  if (o.squares) {
    // the four magic squares the child laid in Part A, still where they were laid
    for (let r = 0; r < FIELD.n; r++) {
      for (let c = 0; c < FIELD.n; c++) {
        const cell = document.createElement('div');
        cell.className = 'field-cell filled';
        // ⚠️ The magic squares sit ON region a, at a higher z-index, so they have to fade
        // WITH it. Without this the block stays at full strength while the region beneath it
        // dims, and focusing the two strips does not actually make the big one recede —
        // which is the whole job of the focus.
        cell.style.cssText = 'position:absolute; left:' + (c * PX + OX) + 'px;' +
          'top:' + (R.side - (r + 1) * PX) + 'px; width:' + PX + 'px; height:' + PX + 'px;' +
          'z-index:2; pointer-events:none;' +
          (lit != null && lit.indexOf('a') < 0 ? 'opacity:0.28;' : '');
        stage.appendChild(cell);
      }
    }
  }

  // MARIMON'S RULE, CASHED IN ON THE PICTURE (Sylvain). Four whole magic squares sit in the
  // corner where the child laid them, and everything left over round the edges is ONE piece
  // with the area of one magic square — so it takes the fifth seed. Without it the field
  // shows four seeds under a question whose answer is five.
  //
  // ⚠️ THIS SCREEN DRAWS THE TRUE FIELD, not our answer's square, and that is the point
  // (Sylvain: "the seed computation uses the true field, not the approximated one — so 5
  // magic squares is exact, and not an approximation"). The area is what Marimon GAVE us;
  // nothing here was estimated. So the leftover L is 4d + d² = 1 EXACTLY — the very equation
  // Part B wrote down — and there is nothing over. A first version carved a plot out of the
  // 2.25 square and left the sixteenth showing, which quietly said the seed count inherited
  // our overshoot. It does not. Asserted in ch3_numbers.py.
  if (o.plot) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', R.side);
    svg.setAttribute('height', R.side);
    svg.style.cssText = 'position:absolute; left:' + OX + 'px; top:0; z-index:3;' +
      'pointer-events:none;';
    const poly = document.createElementNS(NS, 'polygon');
    // ONE outline round the whole bent patch, never two rectangles each with its own edge —
    // the screen is entirely about it being a single piece (Chapter 2, lesson 21).
    // the whole leftover L: the field minus the block of magic squares in its corner
    poly.setAttribute('points', [
      [0, 0], [R.side, 0], [R.side, R.side], [R.aPx, R.side],
      [R.aPx, R.bPx], [0, R.bPx],
    ].map(q => q.join(',')).join(' '));
    // `true` is a PLANTED plot (green, with its seed); 'mark' is the same L merely pointed
    // at — Part F wants to say "this is the leftover" without saying "this is a tree".
    const mark = o.plot === 'mark';
    poly.setAttribute('fill', mark ? 'rgba(232,163,61,0.22)' : '#d4edda');
    // ...a STRONGER edge than a magic square's. The fill says planted; the edge has to say
    // ONE PIECE, and at #8aba8a it was the same hairline the four squares already carry, so
    // the whole field went uniformly green and the plot stopped being a thing.
    poly.setAttribute('stroke', mark ? REG.d.ink : '#3f7a34');
    poly.setAttribute('stroke-width', '2.5');
    svg.appendChild(poly);
    stage.appendChild(svg);
    // ⚠️ The seed is matched BY HAND to .field-cell.filled::after in pap-core.css: a '·' at
    // 24px in #555. Chapter 2's lesson 22 — the glyph draws far smaller than its font-size,
    // so a plot's seed and a magic square's seed have to come off the same two numbers or
    // the carved plot quietly reads as a smaller tree.
    // ⚠️ NOT an early return: `br` is drawn after this block, and a `plot:'mark'` field that
    // also wanted brackets would silently lose them.
    if (!mark) {
      const seed = document.createElement('div');
      seed.textContent = '\u00b7';
      // AT THE ELBOW — the top-right corner, which is the middle of the L (Sylvain). A seed
      // halfway along the top band sits on one arm and reads as that arm's; the elbow is the
      // one point that belongs to the whole bent patch equally, and it is where the eye goes
      // to ask what shape this thing is.
      seed.style.cssText = 'position:absolute; left:' + (OX + R.aPx) + 'px;' +
        'top:0; width:' + R.bPx + 'px; height:' + R.bPx + 'px;' +
        'display:flex; align-items:center;' +
        'justify-content:center; font-size:24px; color:#555; z-index:4; pointer-events:none;';
      stage.appendChild(seed);
    }
  }

  // THE FENCE. Green wire laid all the way round, outside the field's own boundary — which
  // is an outline (painted outside the box), so the wire sits clear of it and the ground
  // keeps its true size. Ticks fall at every whole magic length from each corner, so a side
  // reads as two whole ones and a bit and the child can count the nine.
  //
  // ⚠️ Drawn round the TRUE field while its length is our estimate (4 × 2.25 = 9), and the
  // two differ by about a pixel. That is the honest direction to be out in: the estimate is
  // an overestimate, so there is a whisker more wire than fence — and you can cut wire.
  if (o.wire) {
    // ⚠️ The ticks have to be much darker than the wire, not a shade of it: at #3f7a34 on
    // #5a8f3d they vanished, and a fence you cannot count magic lengths off is just a border.
    const T = 7, OFF = 5, GRN = '#5a8f3d', TK = '#22421c';
    const bar = (x, y, w, h) => {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute; left:' + (OX + x) + 'px; top:' + y + 'px;' +
        'width:' + w + 'px; height:' + h + 'px; background:' + GRN + ';' +
        'border-radius:2px; z-index:5; pointer-events:none;';
      stage.appendChild(d);
    };
    const S = R.side, o1 = OFF + T;
    bar(-o1, -o1, S + 2 * o1, T);                       // top
    bar(-o1, S + OFF, S + 2 * o1, T);                   // bottom
    bar(-o1, -o1, T, S + 2 * o1);                       // left
    bar(S + OFF, -o1, T, S + 2 * o1);                   // right
    const tick = (x, y, w, h) => {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute; left:' + (OX + x) + 'px; top:' + y + 'px;' +
        'width:' + w + 'px; height:' + h + 'px; background:' + TK + '; z-index:6;' +
        'pointer-events:none;';
      stage.appendChild(d);
    };
    for (let m = PX; m < S; m += PX) {
      tick(m, -o1, 2, T); tick(m, S + OFF, 2, T);       // along the top and bottom
      tick(-o1, m, T, 2); tick(S + OFF, m, T, 2);       // and down both sides
    }
  }

  if (br) {
    // A bracket under (or beside) a span of the side, with its label. Labels are allowed to
    // overhang their own bracket: the 0.25 piece is 19px wide and its label is far wider,
    // and shrinking type to fit would make it smallest exactly where the quantity is hardest
    // to see.
    const hbar = (x, w, col, txt, row) => {
      const y = R.side + 6 + row * 36;
      const bar = document.createElement('div');
      bar.style.cssText = 'position:absolute; left:' + (x + OX) + 'px; top:' + y + 'px;' +
        'width:' + w + 'px; height:11px; box-sizing:border-box; z-index:3;' +
        'border:3px solid ' + col + '; border-top:none;';
      stage.appendChild(bar);
      const cap = document.createElement('div');
      cap.innerHTML = txt;
      cap.style.cssText = 'position:absolute; left:' + (x + OX) + 'px; top:' + (y + 15) + 'px;' +
        'width:' + w + 'px; text-align:center; white-space:nowrap; z-index:3;' +
        'font-size:17px; color:' + col + ';';
      stage.appendChild(cap);
    };
    // The left side runs BOTTOM-UP, as it has since Chapter 1: the 2 piece sits against the
    // bottom corner, where region a is, and the small piece is at the top.
    // Each label is right-aligned into the gap immediately left of its OWN bracket, so the
    // whole-side label cannot land on the piece bracket.
    // ⚠️ `br.outer` widens the gap between the two ranks of bracket. Lesson 16: the inner
    // label is right-aligned into whatever room the outer bracket leaves it, and Part H's
    // pieces wear their NAMES (`ẽ = 0.25`), which is 66px against the 53 the default gutter
    // gives. Every earlier caller omits it and keeps BVOUT exactly.
    const OUT = br.outer || BVOUT;
    const vbar = (yTop, h, col, txt, outer) => {
      const x = OX - (outer ? OUT : BVIN);
      const right = x - 6;                       // where this label must end
      const left = outer ? 0 : (OX - OUT + 11);  // ...and where it may start
      const bar = document.createElement('div');
      bar.style.cssText = 'position:absolute; left:' + x + 'px; top:' + yTop + 'px;' +
        'width:11px; height:' + h + 'px; box-sizing:border-box; z-index:3;' +
        'border:3px solid ' + col + '; border-right:none;';
      stage.appendChild(bar);
      const cap = document.createElement('div');
      cap.innerHTML = txt;
      cap.style.cssText = 'position:absolute; left:' + left + 'px;' +
        'top:' + (yTop + h / 2 - 13) + 'px; width:' + (right - left) + 'px;' +
        'text-align:right; white-space:nowrap; z-index:3;' +
        'font-size:17px; color:' + col + ';';
      stage.appendChild(cap);
    };

    hbar(0, R.aPx, '#2f6fb5', br.lo, 0);
    hbar(R.aPx, R.bPx, REG.d.ink, br.hi, 0);
    if (br.both) {
      vbar(R.side - R.aPx, R.aPx, '#2f6fb5', br.lo, false);
      vbar(0, R.bPx, REG.d.ink, br.hi, false);
    }
    let h = R.side + BPADB;
    if (br.whole) {
      hbar(0, R.side, '#3a3a3a', br.whole, 1);
      if (br.both) vbar(0, R.side, '#3a3a3a', br.whole, true);
      h = R.side + BPADB2;
    }
    stage.style.height = h + 'px';
  }
  return stage;
}

// The side, marked up the way Chapter 2 marks a side (Sylvain): the two pieces bracketed —
// `2` and `d` — with the TRUE side `s` bracketed outside them, so that `2 + d = s` is a
// picture and not only a line of prose. `both` puts the same mark-up up the LEFT, which is
// where the child has measured every side since Chapter 1.
//
// ⚠️ It has to be the SAME object on every screen that draws this field. `both` pads the
// stage by BPADL, so a screen carrying it beside one that did not would make the field jump
// 96px sideways between them — the defect Part A already had to fix once. Nine call sites,
// one helper, and they cannot drift.
// ⚠️ Anything sitting UNDER the bracketed field has to be padded the way the field is, or it
// centres on the page while the field centres BPADL/2 to the right of it — and a coloured chip
// that does not line up with the ground it is coloured after is the colour doing the work
// alone. (Part G's own legend needed exactly this.)
function underField(el) {
  el.style.paddingLeft = BPADL + 'px';
  return el;
}

// THE ROUNDS, NUMBERED (Sylvain). `s̃₀` is our crudest answer — the side of the block of
// whole magic squares — `s̃₁` the first refinement, `s̃₂` the second, and `A₀` is what the
// block holds. Numbering them is what makes `we could do it again` a sentence about notation
// as well as about method.
// ⚠️ It stretches the tilde's meaning: everywhere else it marks the number we get once the
// corner is dropped, and s̃₀ has no corner dropped — it is exact. Here it means "our nth
// estimate of s", which is a second, compatible reading, but a reading and not the same one.
// ⚠️ And these same three symbols run through Parts A, C, D, E, F, G and H under their old
// names (`A`, `s_A`, `s̃`): 16 `sub('s','A')` sites, 48 `SUB1` sites and 20 strings. Until
// that sweep is done, eStock is the only screen that numbers them.
const SUB0 = sub(STIL, '0'), SUB1 = sub(STIL, '1'), SUB2 = sub(STIL, '2'),
      SUBA0 = sub(ATIL, '0'), SUBA1 = sub(ATIL, '1');

function bBr() {
  return { lo: '2', hi: '<strong>d</strong>', both: true, whole: '<strong>s</strong>' };
}

// A term in its region's ink — the only thing tying a 19px sliver to the words about it.
function regTerm(k, html) {
  return '<span style="background:' + REG[k].fill + '; color:' + REG[k].ink +
    '; border:1.5px solid ' + REG[k].ink + '; border-radius:5px; padding:1px 7px;' +
    'white-space:nowrap; font-weight:bold">' + html + '</span>';
}

// The legend: the four terms under the picture, in the order they sit on the ground.
function regLegend(focus, terms) {
  const lit = focus == null ? null : (Array.isArray(focus) ? focus : [focus]);
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:center; gap:10px;' +
    'margin-top:14px; flex-wrap:wrap; font-size:19px;';
  (terms || [['a', '2 &times; 2'], ['b', '2 &times; d'],
             ['c', '2 &times; d'], ['d', 'd &times; d']])
    .forEach(([k, txt], i) => {
      if (i) {
        const plus = document.createElement('span');
        plus.textContent = '+';
        plus.style.cssText = 'color:#5a5240;';
        row.appendChild(plus);
      }
      const chip = document.createElement('span');
      chip.innerHTML = regTerm(k, txt);
      if (lit != null && lit.indexOf(k) < 0) chip.style.opacity = '0.3';
      row.appendChild(chip);
    });
  return row;
}

// One line of the argument, as chips. Terms carry their region's colour so the line and
// the ground go on saying the same thing; the operator between two terms is plain.
// THE RIGHT-HAND SIDE OF THE AREA EQUATION, AS GROUND (Sylvain): `n` magic squares, laid the
// way the child laid them in Part A — a k × k block, and whatever is left over standing alone to
// its right, on the same ground line. For the area-5 field that is four in a square plus one.
// ⚠️ Same `field-cell filled` as the block inside the field itself, so both sides of the equation
// are made of the same object and their seed marks cannot drift apart.
// ⚠️ `blockOff` takes the k × k block AWAY, leaving the hole it left — the same bare ground and
// dashed edge `squareSplitEl` uses when region a is lifted off the field. It is what lets the two
// sides of the equation lose their four magic squares at the same moment, on one button.
function areaSquaresEl(n, blockOff) {
  const k = Math.floor(Math.sqrt(n) + 1e-9), rest = n - k * k;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:flex-end; gap:16px;';
  const block = document.createElement('div');
  block.style.cssText = 'position:relative; flex:none;' +
    'width:' + (k * PX) + 'px; height:' + (k * PX) + 'px;';
  for (let r = 0; r < k; r++) for (let c = 0; c < k; c++) {
    const cell = document.createElement('div');
    if (blockOff) {
      cell.style.cssText = 'position:absolute; box-sizing:border-box;' +
        'left:' + (c * PX) + 'px; top:' + (r * PX) + 'px;' +
        'width:' + PX + 'px; height:' + PX + 'px; background:#f4f0e4;' +
        'outline:1.5px dashed #b9ae94; outline-offset:-1px;';
    } else {
      cell.className = 'field-cell filled';
      cell.style.cssText = 'position:absolute; left:' + (c * PX) + 'px; top:' + (r * PX) + 'px;' +
        'width:' + PX + 'px; height:' + PX + 'px;';
    }
    block.appendChild(cell);
  }
  row.appendChild(block);
  for (let i = 0; i < rest; i++) {
    const one = document.createElement('div');
    one.className = 'field-cell filled';
    one.style.cssText = 'flex:none; width:' + PX + 'px; height:' + PX + 'px;';
    row.appendChild(one);
  }
  return row;
}

// `[the cut-up field]  =  [n magic squares]`, with the equation line underneath still centred on
// the FIELD — which is why the holder is given the field stage's own width and pinned to the
// row's left edge. Without that the chips would drift right with the row and stop lining up with
// the ground they are coloured after (the rule written next to `underField`).
function areaEqEl(stage, n, line, blockOff) {
  const side = FIELD.s * PX;
  stage.style.margin = '0';          // ⚠️ its `margin: 8px auto 0` would eat the row's free space
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:flex-start; gap:18px;';
  row.appendChild(stage);
  const mid = h => {
    const d = document.createElement('div');
    d.style.cssText = 'flex:none; height:' + side + 'px; display:flex; align-items:center;';
    if (typeof h === 'string') d.innerHTML = h; else d.appendChild(h);
    return d;
  };
  const eq = mid('=');
  eq.style.fontSize = '26px';
  eq.style.color = '#3a3a3a';
  row.appendChild(eq);
  row.appendChild(mid(areaSquaresEl(n, blockOff)));
  // ⚠️ EVERYTHING IS LEFT-ALIGNED INSIDE A SHRINK-TO-FIT COLUMN, and the column is what gets
  // centred. The field's square then always sits `BPADL + side/2` from the column's left edge,
  // and the line's holder is exactly twice that wide — so the line centres on the square whether
  // the right-hand side is five magic squares or one. Centring the row instead moved the field
  // with it and the chips stopped lining up with the ground they are coloured after.
  const col = document.createElement('div');
  col.style.cssText = 'display:flex; flex-direction:column; align-items:flex-start;' +
    'width:fit-content; margin:8px auto 0;';
  col.appendChild(row);
  const holder = document.createElement('div');
  holder.style.cssText = 'flex:none; width:' + (2 * BPADL + side) + 'px;';
  holder.appendChild(line);
  col.appendChild(holder);
  return col;
}

function eqLine(terms, rhs, sign) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:center; gap:9px;' +
    'margin-top:16px; flex-wrap:wrap; font-size:20px; color:#3a3a3a;';
  const op = txt => {
    const sp = document.createElement('span');
    sp.innerHTML = txt;
    row.appendChild(sp);
  };
  terms.forEach(([k, html], i) => {
    if (i) op('+');
    const chip = document.createElement('span');
    chip.innerHTML = regTerm(k, html);
    row.appendChild(chip);
  });
  op('&nbsp;' + (sign || '=') + '&nbsp;');
  const r = document.createElement('span');
  r.innerHTML = '<strong>' + rhs + '</strong>';
  row.appendChild(r);
  return row;
}

// The leftover L, taken off the field and laid out flat — either as the two strips and the
// corner, or with the strips pushed end to end into one. Beside it, at the same scale, ONE
// MAGIC SQUARE: because 4 x d + d x d really is exactly 1, the two sides of the picture have
// the same area, and the child can see that they do.
// The leftover L, taken off the field and laid out flat. Three states:
//   'split'    the two strips and the corner
//   'joined'   the strips pushed end to end, and the corner
//   'dropped'  the strip ALONE — the corner is gone, because the equation it belongs to is
//              gone. From here the strip is 4 × d̃ and its area is EXACTLY one magic square:
//              4 × d̃ = 1 by the definition of d̃, so 320px × 20px = 6400 = 80², and the
//              picture is true rather than nearly true.
// ⚠️ 'split' and 'joined' draw the TRUE d (they are the real ground, and 4d + d² = 1);
// 'dropped' draws d̃. That 1px difference in thickness is the approximation, to scale.
// THE EQUATION AS GROUND — Part C's grammar, extracted on its second use (Part H lays out
// the same kind of line one round later). A row of rectangles, each with its SIDES written on
// it in Chapter 2's convention — long side bracketed underneath, short side bracketed in a
// gutter to its left, area named below both, sides first and area second because that is the
// order the child computed them in — with operators between and a magic square on the right.
function pieceRow() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; justify-content:center; align-items:flex-end; gap:14px;' +
    'margin-top:18px; flex-wrap:wrap;';
  const GUT = 26;
  const piece = (w, h, k, label, longL, shortL, units) => {
    const col = document.createElement('div');
    col.style.cssText = 'position:relative; flex:none;' +
      'width:' + (w + GUT) + 'px; height:' + (h + 54) + 'px;';
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute; left:' + GUT + 'px; top:0;' +
      'width:' + w + 'px; height:' + h + 'px; box-sizing:border-box;' +
      'background:' + REG[k].fill + '; border:1.5px solid ' + REG[k].ink + ';';
    col.appendChild(el);
    // ⚠️ The whole magic lengths inside the piece, ticked off. Lighter than the border, so
    // the strip still reads as ONE strip made of that many parts rather than as several
    // strips — the same rule the fused magic length follows in Chapter 2's carry row. It is
    // what makes cutting the strips up and piling them an obvious next move rather than a
    // new instruction.
    for (let i = 1; i < (units || 0); i++) {
      const tk = document.createElement('div');
      tk.style.cssText = 'position:absolute; left:' + (GUT + i * PX) + 'px; top:0;' +
        'width:1.5px; height:' + h + 'px; background:' + REG[k].ink + '; opacity:0.5;';
      col.appendChild(tk);
    }
    const mark = (css, txt, tcss) => {
      const b = document.createElement('div');
      b.style.cssText = 'position:absolute;' + css;
      col.appendChild(b);
      const c = document.createElement('div');
      c.innerHTML = txt;
      c.style.cssText = 'position:absolute; white-space:nowrap; font-size:13px;' +
        'color:#5a5240;' + tcss;
      col.appendChild(c);
    };
    if (shortL) mark(
      'left:' + (GUT - 13) + 'px; top:0; width:7px; height:' + h + 'px;' +
      'box-sizing:border-box; border:2px solid #8a8168; border-right:none;',
      shortL, 'left:0; top:' + (h / 2 - 9) + 'px; width:' + (GUT - 17) + 'px; text-align:right;');
    if (longL) mark(
      'left:' + GUT + 'px; top:' + (h + 5) + 'px; width:' + w + 'px; height:7px;' +
      'box-sizing:border-box; border:2px solid #8a8168; border-top:none;',
      longL, 'left:' + (GUT - 20) + 'px; top:' + (h + 13) + 'px; width:' + (w + 40) + 'px;' +
      'text-align:center;');
    const cap = document.createElement('div');
    cap.innerHTML = label;
    cap.style.cssText = 'position:absolute; left:' + (GUT - 20) + 'px; top:' + (h + 32) + 'px;' +
      'width:' + (w + 40) + 'px; text-align:center; font-size:14px; white-space:nowrap;' +
      'color:' + REG[k].ink + ';';
    col.appendChild(cap);
    wrap.appendChild(col);
    return col;
  };
  const plus = txt => {
    const sp = document.createElement('div');
    sp.innerHTML = txt;
    sp.style.cssText = 'font-size:22px; color:#5a5240; padding-bottom:52px;';
    wrap.appendChild(sp);
    return sp;
  };
  // ...and the magic square on the right, with its own two sides written on it as well.
  // ⚠️ `frac` is for the field whose band is NOT one whole magic square. Part F rounded the
  // area-7 field's share up, so its band is 0.84 of one — and the row's `=` has to be true.
  // It is drawn as the ground it is, inside a dashed outline of the whole magic square, so
  // "not quite one" is something to see rather than a number to be told. Every other caller
  // passes nothing and gets exactly what it got before.
  // ⚠️ A FRACTIONAL BAND NEEDS A WIDER GUTTER, and this was wrong on the shipped fields as
  // well as on the new one. The side label lives in a `GUT - 17` = 9px box, which is right
  // for the "1" every band was when this was written and far too narrow for "0.84" or "0.25"
  // — those printed straight across their own bracket. Widened only where the label is long,
  // so `square()` with no argument, and every band that IS one whole magic square, is
  // untouched by construction. Lesson 16, and only a render could see it.
  const square = frac => {
    const f = frac == null ? 1 : frac;
    const SG = f < 1 ? 48 : GUT;
    const one = document.createElement('div');
    one.style.cssText = 'position:relative; flex:none;' +
      'width:' + (PX + SG) + 'px; height:' + (PX + 54) + 'px;';
    if (f < 1) {
      const gh = document.createElement('div');
      gh.style.cssText = 'position:absolute; left:' + SG + 'px; top:0; width:' + PX + 'px;' +
        'height:' + PX + 'px; box-sizing:border-box;' +
        'outline:1.5px dashed #b9ae94; outline-offset:-1px;';
      one.appendChild(gh);
    }
    const sq = document.createElement('div');
    sq.className = 'field-cell filled';
    sq.style.cssText = 'position:absolute; left:' + SG + 'px; top:0;' +
      'width:' + PX + 'px; height:' + (f * PX) + 'px;';
    one.appendChild(sq);
    const smark = (css, txt, tcss) => {
      const b = document.createElement('div');
      b.style.cssText = 'position:absolute;' + css;
      one.appendChild(b);
      const c = document.createElement('div');
      c.innerHTML = txt;
      c.style.cssText = 'position:absolute; white-space:nowrap; font-size:13px; color:#5a5240;' + tcss;
      one.appendChild(c);
    };
    smark('left:' + (SG - 13) + 'px; top:0; width:7px; height:' + (f * PX) + 'px;' +
          'box-sizing:border-box; border:2px solid #8a8168; border-right:none;',
          fmtNum(f), 'left:0; top:' + (f * PX / 2 - 9) + 'px; width:' + (SG - 17) +
          'px; text-align:right;');
    // ⚠️ Callers place the square's BOTTOM bracket themselves, so they have to be given the
    // gutter this square actually used, not the row's.
    return { one: one, smark: smark, GUT: SG };
  };
  return { wrap: wrap, piece: piece, plus: plus, square: square, GUT: GUT };
}

function unrolledLEl(mode, align) {
  const til = mode === 'dropped';
  const D = til ? DTIL : 'd';
  const dPx = til ? dTilde() * PX : (FIELD.s - FIELD.n) * PX;
  const R = pieceRow(), wrap = R.wrap, piece = R.piece, plus = R.plus, GUT = R.GUT;
  const N = String(FIELD.n);
  // ⚠️ The strips carry their whole magic lengths here too (Sylvain), so the `4` in `4 × d`
  // and the `2` in `2 × d` are countable in the ground rather than only readable in the
  // label — and so that pushing two 2-long strips end to end visibly makes a 4-long one.
  if (mode !== 'split') {
    piece(FIELD.n * 2 * PX, dPx, 'b', bold('4 &times; ' + D), '4', D, FIELD.n * 2);
  } else {
    piece(FIELD.n * PX, dPx, 'b', '2 &times; ' + D, N, D, FIELD.n);
    plus('+');
    piece(FIELD.n * PX, dPx, 'c', '2 &times; ' + D, N, D, FIELD.n);
  }
  if (!til) {
    plus('+');
    piece(dPx, dPx, 'd', D + ' &times; ' + D, D, D);
  } else if (align) {
    // A hole exactly the shape of the corner that is no longer there, so that the "= one
    // magic square" on this row lands under the one on the row above. Both equations have
    // the SAME square on the right, and that is half the argument — it has to look it.
    plus('+').style.visibility = 'hidden';
    piece(dPx, dPx, 'd', D + ' &times; ' + D, D, D).style.visibility = 'hidden';
  }
  plus('=');
  const SQ = R.square(), one = SQ.one, smark = SQ.smark;
  smark('left:' + GUT + 'px; top:' + (PX + 5) + 'px; width:' + PX + 'px; height:7px;' +
        'box-sizing:border-box; border:2px solid #8a8168; border-top:none;',
        '1', 'left:' + GUT + 'px; top:' + (PX + 13) + 'px; width:' + PX + 'px; text-align:center;');
  const cap = document.createElement('div');
  cap.textContent = '1';
  cap.style.cssText = 'position:absolute; left:' + GUT + 'px; top:' + (PX + 32) + 'px;' +
    'width:' + PX + 'px; text-align:center; font-size:14px; color:#3f7a34;';
  one.appendChild(cap);
  wrap.appendChild(one);
  return wrap;
}

// Both area equations, one above the other: the true one (strip + corner = magic square) and
// the new one (strip alone = magic square). Same square on the right of both, so the only
// thing that can have changed is the strip — which is the whole argument for d̃ being bigger,
// and it is left on screen while the question is asked (Sylvain).
function twoEquationsEl() {
  const wrap = document.createElement('div');
  // LEFT-aligned, not centred: both rows begin with the strip, so aligning their left edges
  // puts the two strips one directly above the other and the thickness is a straight
  // comparison. Centring would offset them by half the corner's width and the eye would have
  // to do arithmetic before it could look.
  wrap.style.cssText = 'display:flex; flex-direction:column; align-items:flex-start; gap:2px;' +
    'width:fit-content; margin:0 auto;';
  wrap.appendChild(unrolledLEl('joined'));
  wrap.appendChild(unrolledLEl('dropped', true));
  return wrap;
}

// The OLD strip laid inside the NEW one, with the extra ground hatched — the project's mark
// for ground a piece does not reach, used here for ground the old strip does not reach
// (Sylvain).
//
// ⚠️ The extra band is d̃ − d over d̃ = 5.6% of the strip's height, WHATEVER the scale. At
// PX = 80 that is 1.1px, and a 1.1px band cannot carry a hatch whose pattern repeats every
// 9px. Making it thicker would be a lie about how good the answer is, on the one screen whose
// job is to say how good it is. So the band is drawn honestly at true scale AND the last
// stretch of the strip is magnified ten times beside it, which is the chapter's own answer to
// this problem: magnify, never exaggerate.
const SC_RUN = 55, SC_ZOOM = 10;      // px of strip taken for the close-up, and by how much

function stripCompareEl() {
  const dT = (FIELD.s - FIELD.n) * PX, dN = dTilde() * PX;
  const W = 4 * PX, ZW = SC_RUN * SC_ZOOM, ZH = dN * SC_ZOOM, ZI = dT * SC_ZOOM;
  const GUT = 112, RING = 5, TOP = 30, CONE2 = 54;
  const strip = { x: GUT + (ZW - W) / 2, y: TOP, w: W, h: dN };
  const zoom = { x: GUT, y: TOP + dN + RING + CONE2 + 10, w: ZW, h: ZH };

  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:20px auto 0;' +
    'width:' + (GUT + ZW + 90) + 'px; height:' + (zoom.y + ZH + 26) + 'px;';
  const add = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  // the old strip nested inside the new one, with the extra ground hatched
  const nest = (x, y, w, hOld, hNew) => {
    add('left:' + x + 'px; top:' + y + 'px; width:' + w + 'px; height:' + hNew + 'px;' +
        'box-sizing:border-box; border:1.5px solid ' + REG.b.ink + ';' + HATCH);
    add('left:' + x + 'px; top:' + (y + hNew - hOld) + 'px; width:' + w + 'px;' +
        'height:' + hOld + 'px; box-sizing:border-box; background:' + REG.b.fill + ';' +
        'border:1.5px solid ' + REG.c.ink + ';');
  };
  nest(strip.x, strip.y, strip.w, dT, dN);
  nest(zoom.x, zoom.y, zoom.w, ZI, ZH);

  // ---- the magnifying glass: a ring on the end of the strip, and a cone down to the
  // magnified view. Chapter 2 made the lens this chapter's one zoom device and Part A′'s
  // ladder kept the cone; the same vocabulary says "this is that, ten times bigger".
  const rx0 = strip.x + strip.w - SC_RUN, rx1 = strip.x + strip.w;
  add('left:' + (rx0 - RING) + 'px; top:' + (strip.y - RING) + 'px;' +
      'width:' + (SC_RUN + 2 * RING) + 'px; height:' + (dN + 2 * RING) + 'px;' +
      'box-sizing:border-box; border:2.5px solid #c98a2a; border-radius:6px; z-index:3;');
  const cone = ladderCone(rx0 - RING, rx1 + RING, zoom.x, zoom.x + zoom.w);
  cone.style.top = (strip.y + dN + RING + 3) + 'px';
  box.appendChild(cone);

  // ---- both heights, on the SAME side of the magnified view: d̃ outside, d inside, so the
  // hatched band between their tops is exactly what d̃ adds.
  const vb = (yTop, h, col, txt, outer) => {
    const x = zoom.x - (outer ? 56 : 16);
    add('left:' + x + 'px; top:' + yTop + 'px; width:9px; height:' + h + 'px;' +
        'box-sizing:border-box; border:2.5px solid ' + col + '; border-right:none;');
    const c = add('left:' + (outer ? 0 : x - 42) + 'px; top:' + (yTop + h / 2 - 12) + 'px;' +
      'width:' + (outer ? x - 6 : 36) + 'px; text-align:right; font-size:16px;' +
      'color:' + col + '; white-space:nowrap;');
    c.innerHTML = txt;
  };
  vb(zoom.y, ZH, REG.b.ink, bold(DTIL), true);
  vb(zoom.y + (ZH - ZI), ZI, REG.c.ink, bold('d'), false);

  // ---- and what the difference is called, level with the band it names
  const band = ZH - ZI;
  const lab = add('left:' + (zoom.x + zoom.w + 12) + 'px; top:' + zoom.y + 'px;' +
    'height:' + Math.max(band, 2) + 'px; display:flex; align-items:center;' +
    'border-left:2px solid #d9a441; padding-left:8px; font-size:14px; color:#b5772a;' +
    'white-space:nowrap;');
  lab.innerHTML = t('c3_c_lbl_extra', { dtil: DTIL });

  // the two strips still named, on the true-scale one
  const nameL = (dy, col, txt) => {
    const c = add('left:0; top:' + (strip.y + dy) + 'px; width:' + (strip.x - 14) + 'px;' +
      'text-align:right; font-size:15px; color:' + col + '; white-space:nowrap;');
    c.innerHTML = txt;
  };
  nameL(-24, REG.b.ink, bold('4 &times; ' + DTIL));
  nameL(dN + 8, REG.c.ink, bold('4 &times; d'));
  return box;
}

// Ask a question from a screen that currently has a BUTTON on it. askInline only rewrites
// the story panel, so without this the button survives underneath its own question and
// clicking it again just re-asks. Chapter 2 hit this the first time it asked a question off
// a Continue button (its Part B), and the symptom is invisible to a screenshot: the bug IS
// a button that should no longer be there.
function askAfterButton(question, answer, onCorrect, hint, opts) {
  buttonArea.innerHTML = '';
  askInline(question, answer, onCorrect, hint, opts);
}

// ⚠️ askInline() REPLACES the story panel — it calls storyHTML(). So a lead written with
// storyHTML() just before it is gone the instant the question appears, and the child reads
// the question with none of the sentence that set it up. The picture survives (the game area
// is untouched); the words do not. Anything the question needs therefore has to travel
// INSIDE the question, which is what this does. Chapter 2 hit the same trap three times
// (aNotation, the two associativity screens, eSides) and fixed it the same way each time.
const PARA = '</p><p style="margin-top:10px">';
function askWithLead(lead, question, answer, onCorrect, hint, opts) {
  askAfterButton(lead + PARA + question, answer, onCorrect, hint, opts);
}

// PART D's pictures.
//
// The strip is 4 magic lengths long and d across. Chop it into four pieces of one magic
// length each and pile them up, and the pile is one magic length TALL — four d's, one on
// top of another. That is the whole of "share it out": division arrives as stacking, and
// the answer is read off the height rather than got from a rule.
//
// ⚠️ The pile comes to 4d = 0.944 magic lengths, not 1 — it is short by exactly the corner
// we threw away in Part C. So it is drawn inside a magic square's outline WITH that gap
// visible. Rounding it up to a perfect fit would quietly un-say the approximation the
// previous part just made.
// d-tilde, in magic lengths: the number Part C defined by 4 x d-tilde = 1. For the area-5
// field that is (5 - 4) / (2 x 2) = a quarter, so four layers fill a magic square EXACTLY —
// which is the whole of Part D's argument, and it has to be drawn exactly or the argument is
// drawn wrong. The old version used the TRUE d and fell 4.5px short: honest about
// `4d + d² = 1`, but it contradicts the exact line Part C now ends on.
function dTilde() { return (FIELD.A - FIELD.n * FIELD.n) / (2 * FIELD.n); }

// The two cases the argument rules out, drawn: the same four-layer pile against the same
// magic square, once too tall and once too short. The mismatched ground is hatched, which is
// this project's mark for ground that does not come out right — so "too much" and "not
// enough" are the same picture with the hatch on opposite sides of the line.
// Factors of 1.32 and 0.7: far enough from 1 to be unmistakable at a glance, which is what a
// counterfactual has to be. Nothing here claims to be to scale — these are the shapes we are
// saying the rectangle is NOT.
// ⚠️ THE FACTORS ARE NOT FREE. Four layers have to stay countable and the mismatch has to
// stay obviously less than one layer, or the picture says something we never claimed:
//   - too long: the square's top edge must land in the MIDDLE of the top layer. At 1.32 it
//     landed 3% into it — on the join — so three stripes filled the square exactly and the
//     figure read "3 × d̃ = 1", which is not the claim and is not true.
//   - too short: the gap must be well under one layer. At 0.7 it was 1.7 layers, which reads
//     as two layers missing rather than as four layers falling a little short.
// 1.15 puts the edge 48% up the top layer; 0.86 leaves a gap of 0.65 of a layer.
const CASE_LONG = 1.15, CASE_SHORT = 0.86, CPX = 116;

function pileCaseEl(factor, capKey, verdictKey) {
  const H = CPX * factor, layer = H / 4;
  const PX = CPX;                        // these figures are drawn bigger, so the mismatch
  const GUT = 130, CW = GUT + PX + 16;   // band is ~17px and can carry a hatch at all
  const X = GUT;                         // room on the left for the two height brackets
  const base = Math.max(PX, H);          // the ground both shapes stand on
  const col = document.createElement('div');
  col.style.cssText = 'position:relative; flex:none; width:' + CW + 'px;' +
    'height:' + (base + 64) + 'px;';
  // the magic square's own ground, behind everything — so a pile that falls short leaves
  // green showing, and the thing being matched is a place rather than an outline
  const put0 = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    col.appendChild(d);
    return d;
  };
  put0('left:' + X + 'px; top:' + (base - PX) + 'px; width:' + PX + 'px; height:' + PX + 'px;' +
       'background:#eaf5ea;');
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    col.appendChild(d);
    return d;
  };
  // ORDER MATTERS. The pile goes down first; the mismatched ground is hatched OVER it, or the
  // hatch is hidden underneath and the "too much" case shows nothing at all. The magic
  // square's outline goes last of all, because its top edge is the line the whole comparison
  // is against and it must never be covered.
  for (let i = 0; i < 4; i++) {
    put('left:' + X + 'px; top:' + (base - (i + 1) * layer) + 'px; width:' + PX + 'px;' +
        'height:' + layer + 'px; box-sizing:border-box; background:' + REG.b.fill + ';' +
        'border:1.5px solid ' + REG.b.ink + '; z-index:1;');
  }
  const band = factor > 1
    ? [base - H, H - PX]                 // the part of the pile sticking out above the square
    : [base - PX, PX - H];               // the part of the square the pile fails to reach
  put('left:' + X + 'px; top:' + band[0] + 'px; width:' + PX + 'px; height:' + band[1] + 'px;' +
      'box-sizing:border-box; z-index:2;' + HATCH + 'outline:1.5px solid #c98a2a;');
  put('left:' + X + 'px; top:' + (base - PX) + 'px; width:' + PX + 'px; height:' + PX + 'px;' +
      'box-sizing:border-box; outline:3px dashed #3f7a34; z-index:3;');

  // The two heights, both on the LEFT and both measured from the same ground line: the pile's
  // own 4 × d̃ nearest the figure, and the magic square's side one column further out. Which
  // of the two brackets is the taller IS the answer to the question being asked, so they have
  // to be side by side and start together.
  const vb = (h, col, txt, outer) => {
    const bx = X - (outer ? 62 : 18);
    put('left:' + bx + 'px; top:' + (base - h) + 'px; width:9px; height:' + h + 'px;' +
        'box-sizing:border-box; border:2.5px solid ' + col + '; border-right:none;');
    put('left:' + (outer ? 0 : bx - 40) + 'px; top:' + (base - h / 2 - 11) + 'px;' +
        'width:' + (outer ? bx - 6 : 34) + 'px; text-align:right; white-space:nowrap;' +
        'font-size:14px; color:' + col + ';').innerHTML = txt;
  };
  // ⚠️ The SHORT label goes in the inner column. Between the two brackets there are only
  // ~40px, and "4 × d̃" needs 45 — it overhung its own bracket there. "1" fits in 12.
  vb(PX, '#3f7a34', bold('1'), false);
  vb(H, REG.b.ink, bold('4 &times; ' + DTIL), true);

  if (capKey) put('left:0; top:' + (base + 10) + 'px; width:' + CW + 'px; text-align:center;' +
      'font-size:13px; line-height:16px; color:#5a5240;').innerHTML = t(capKey);
  // ⚠️ The verdict is withheld while the question is open — on those screens it IS the answer.
  if (verdictKey) put('left:0; top:' + (base + 34) + 'px; width:' + CW + 'px; text-align:center;' +
      'font-size:13px; line-height:16px; color:#b5772a;').innerHTML = t(verdictKey);
  return col;
}

// A two-way question the child can settle by looking. A wrong answer is not waved through:
// the reason is restated and the buttons stay up, exactly as askInline treats a wrong number.
// Used for the four beats that make up the "it can only be equal" argument.
function choose(storyHTML_, pic, labels, correctIdx, wrongKey, onCorrect) {
  const ask = () => {
    clearGame();
    showEliel();
    storyHTML(storyHTML_);
    if (pic) gameArea.appendChild(pic());
    labels.forEach((lbl, i) => addButton(t(lbl), () => {
      if (i === correctIdx) return onCorrect();
      storyHTML('<div class="speaker">Eliel</div><p>' + t(wrongKey) + '</p>');
      setTimeout(ask, 1900);
    }));
  };
  ask();
}

function pileCasesEl() {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-end; gap:54px;' +
    'margin-top:20px;';
  row.appendChild(pileCaseEl(CASE_LONG, 'c3_d_case_big', 'c3_d_case_toobig'));
  row.appendChild(pileCaseEl(CASE_SHORT, 'c3_d_case_small', 'c3_d_case_toosmall'));
  return row;
}

function stackEl(state) {
  const dPx = dTilde() * PX;
  const GAP = 7, PADB = 46;
  const wide = state === 'whole' || state === 'cut';
  // ⚠️ Sized for the FRENCH label, not the English one. « 4 × d̃ = 1 longueur magique » is
  // 226px against "4 × d̃ = 1 magic length"'s 165 — at 204 the French ran straight over the
  // pile it was labelling. Same gutter in both languages on purpose: a per-language geometry
  // would make the picture jump between EN and FR. (Chapter 2, lesson 16, third time.)
  // ⚠️ THE LEFT GUTTER IS SIZED TO THE LABEL THAT ACTUALLY GOES IN IT. A flat 118 was room for
  // `L = 4 × d̃`, which only two of the five states carry — and on the CUT state it pushed the
  // row to 779px against the container's 760, so the magic square wrapped onto a second line and
  // left the `=` dangling at the end of the first. (Pre-existing; the row is exactly as wide as
  // it was before the side label moved.) 44 is what `d̃` needs, 118 what `L = 4 × d̃` needs, and
  // 264 what the French « 4 × d̃ = 1 longueur magique » needs.
  const GUT = state === 'pile1eq' ? 264 : (state === 'pile1' ? 118 : 44);
  const W = wide ? 4 * PX + (state === 'cut' ? 3 * GAP : 0) : PX;
  const H = wide ? dPx : 4 * dPx;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; justify-content:center; align-items:flex-start;' +
    'gap:22px; margin-top:20px; flex-wrap:wrap;';

  const col = document.createElement('div');
  col.style.cssText = 'position:relative; flex:none;' +
    'width:' + (GUT + W) + 'px; height:' + (H + PADB) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    col.appendChild(d);
    return d;
  };
  const bar = (x, y, w, h) => put('left:' + (GUT + x) + 'px; top:' + y + 'px;' +
    'width:' + w + 'px; height:' + h + 'px; box-sizing:border-box;' +
    'background:' + REG.b.fill + '; border:1.5px solid ' + REG.b.ink + ';');
  // a bracket in the left gutter, with its label right-aligned beside it
  const vb = (y, h, txt, size) => {
    put('left:' + (GUT - 14) + 'px; top:' + y + 'px; width:8px; height:' + h + 'px;' +
        'box-sizing:border-box; border:2.5px solid ' + REG.b.ink + '; border-right:none;');
    put('left:0; top:' + (y + h / 2 - (size > 13 ? 13 : 10)) + 'px;' +
        'width:' + (GUT - 20) + 'px; text-align:right; white-space:nowrap;' +
        'font-size:' + size + 'px; color:' + REG.b.ink + ';').innerHTML = txt;
  };
  const hb = (x, w, txt) => {
    put('left:' + (GUT + x) + 'px; top:' + (H + 6) + 'px; width:' + w + 'px; height:8px;' +
        'box-sizing:border-box; border:2.5px solid #8a8168; border-top:none;');
    put('left:' + (GUT + x - 60) + 'px; top:' + (H + 16) + 'px; width:' + (w + 120) + 'px;' +
        'text-align:center; font-size:14px; color:#5a5240; white-space:nowrap;')
      .innerHTML = txt;
  };

  if (state === 'whole') {
    bar(0, 0, W, dPx);
    // ⚠️ The four whole magic lengths ticked inside the strip (Sylvain), lighter than its own
    // outline — so the `4` under it is something to count, and cutting it into four is cutting
    // at marks that were already there rather than a fresh decision. Same rule as the four
    // regions' strips and the unrolled ones: light enough that the bar still reads as ONE bar
    // made of four parts.
    for (let i = 1; i < 4; i++) {
      put('left:' + (GUT + i * PX) + 'px; top:0; width:1.5px; height:' + dPx + 'px;' +
          'background:' + REG.b.ink + '; opacity:0.45;');
    }
    vb(0, dPx, bold(DTIL), 16);
    hb(0, W, bold('4'));
  } else if (state === 'cut') {
    for (let i = 0; i < 4; i++) {
      bar(i * (PX + GAP), 0, PX, dPx);
      hb(i * (PX + GAP), PX, bold('1'));
    }
    vb(0, dPx, bold(DTIL), 16);
  } else {
    // stacked. 'pile4' shows d̃ against EACH layer — four of them up the side, which is what
    // 4 × (d̃ × 1) says. 'pile1' replaces those four with the single bracket they add up to.
    for (let i = 0; i < 4; i++) bar(0, i * dPx, PX, dPx);
    if (state === 'pile4') for (let i = 0; i < 4; i++) vb(i * dPx, dPx, bold(DTIL), 13);
    // 'pile1eq' writes the finished equation on the side it is about, which is the whole
    // point of the last screen of the argument: the same fact as ground and as arithmetic.
    else vb(0, H, bold(state === 'pile1eq'
      ? '4 &times; ' + DTIL + ' = ' + t('c3_d_lbl_1ml')
      : 'L = 4 &times; ' + DTIL), 16);
    hb(0, PX, bold('l = ' + t('c3_d_lbl_1ml')));
  }
  wrap.appendChild(col);

  const mid = document.createElement('div');
  mid.innerHTML = '=';
  mid.style.cssText = 'font-size:24px; color:#5a5240; margin-top:' + (H / 2 - 16) + 'px;';
  wrap.appendChild(mid);

  // The magic square carries ITS two sides as well (Sylvain): both of them one magic length,
  // marked the same way as the rectangle's. Both halves of the equality are then described in
  // the same terms, which is what lets a child check it rather than take it.
  // Likewise: « 1 longueur magique » is 145px where "1 magic length" is 96, and at 116 it
  // printed across the magic square.
  // ⚠️ THE SIDE MEASUREMENT GOES TO THE RIGHT OF THE MAGIC SQUARE (Sylvain), not between the
  // `=` and the square: there, 176px of label held the two halves of the equality apart and the
  // square sat far off to the right of its own equals sign. Mirrored, the `=` lands beside the
  // square it is about and the label goes where there is room. The bracket turns round with it
  // (`border-left:none`, so it opens toward the square it measures).
  // ⚠️ AND THE COLUMN KEEPS A LEFT PAD, because the square's own foot label is 145px against an
  // 80px square and overhangs 33 each side. Letting it overflow instead put it straight through
  // the strip's foot label on the piled states, where that column is only 124px wide. `L2` is
  // what the overhang needs, and the row still fits: the gutter above bought more than it costs.
  const G2 = 176, L2 = 36;
  const col2 = document.createElement('div');
  col2.style.cssText = 'position:relative; flex:none;' +
    'width:' + (L2 + PX + G2) + 'px; height:' + (PX + PADB) + 'px;';
  const put2 = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    col2.appendChild(d);
    return d;
  };
  const sq = document.createElement('div');
  sq.className = 'field-cell filled';
  sq.style.cssText = 'position:absolute; left:' + L2 + 'px; top:0;' +
    'width:' + PX + 'px; height:' + PX + 'px;';
  col2.appendChild(sq);
  put2('left:' + (L2 + PX + 6) + 'px; top:0; width:8px; height:' + PX + 'px;' +
       'box-sizing:border-box; border:2.5px solid #3f7a34; border-left:none;');
  put2('left:' + (L2 + PX + 20) + 'px; top:' + (PX / 2 - 11) + 'px;' +
       'width:' + (G2 - 26) + 'px;' +
       'text-align:left; font-size:14px; color:#3f7a34; white-space:nowrap;')
    .innerHTML = bold(t('c3_d_lbl_1ml'));
  put2('left:' + L2 + 'px; top:' + (PX + 6) + 'px; width:' + PX + 'px; height:8px;' +
       'box-sizing:border-box; border:2.5px solid #3f7a34; border-top:none;');
  put2('left:' + (L2 - 60) + 'px; top:' + (PX + 16) + 'px; width:' + (PX + 120) + 'px;' +
       'text-align:center; font-size:14px; color:#3f7a34; white-space:nowrap;')
    .innerHTML = bold(t('c3_d_lbl_1ml'));
  put2('left:' + L2 + 'px; top:' + (PX + 38) + 'px; width:' + PX + 'px; text-align:center;' +
       'font-size:14px; color:#3f7a34; white-space:nowrap;').innerHTML = t('c3_d_lbl_one');
  wrap.appendChild(col2);
  return wrap;
}

// ---------------------------------------------------------------------------
// FROM THE SQUARE TO THE NUMBER — the last stretch of Part D.
//
// The two squares are done with; what is left is a statement about two LENGTHS, so the
// pictures shed everything but the two sides. Same colours and same size as the sides they
// come from, so nothing has to be re-learned: the blue one is our square's side, carrying
// 4 × d̃ on its left and its four d̃ on the right, with the four ticks that divide it; the
// green one is the magic square's side.
const QBAR = 320;                    // one QUARTER of a magic length, magnified (vertical)
const QTENTH = QBAR * 0.4;           // ...so a tenth is 128px and a hundredth is 12.8
const QHUND = QBAR * 0.04;

// ⚠️ Part F measures d̃ with THESE devices, not with new ones (Sylvain): the same two lines
// side by side, and the same bar with pieces laid on it. `o.n` is how many d̃ the left line is
// ticked into, `o.left` and `o.right` the two names. Defaults are Part D's own, so dHowLong
// is unchanged by construction.
function twoSidesEl(onPick, o) {
  const q = o || {};
  const N4 = q.n || 4;
  const H = 216, seg = H / N4;         // a length diagram, drawn large enough to label
  // The four candidates stand VERTICALLY, on the same ground line as the side they are being
  // compared with and at the SAME scale (Sylvain) — so the child settles it by looking: only
  // one of them reaches the first tick. A horizontal list beside a vertical line would have
  // left the two incomparable, and the answer would have had to be taken on trust.
  const CANDS = [['half', 0.5, 'c3_q_sh_half'], ['third', 1 / 3, 'c3_q_sh_third'],
                 ['quarter', 0.25, 'c3_q_sh_quarter'], ['tenth', 0.1, 'c3_q_sh_tenth']];
  // ⚠️ Colours are the caller's (Sylvain), because Part F's two lines are the same two
  // quantities its area row draws: the leftover in light brown, its length in blue. Part D
  // passes nothing and keeps the blue-and-green it has always had.
  const LC = q.leftCol || REG.b.ink, RC = q.rightCol || '#3f7a34';
  const CW = 74, GAPX = 44;
  const nCand = onPick ? CANDS.length : 0;
  // room to the LEFT of the line when its name goes there rather than under its foot
  const LPAD = q.leftSide ? 110 : 20;
  const LX = nCand * CW + (nCand ? GAPX : 0) + LPAD;   // the 4 × d̃ line
  const RX = LX + 170;                               // ...and the magic square's side
  // ⚠️ BOTH LINES ARE READ FROM THE BOTTOM UP, so a part-unit shows at the TOP (Sylvain) —
  // the same way round as the pile they come off, whose part-layer sits on top. And each
  // carries a DIMMED phantom above it: the rest of the last e~ on the left, the rest of the
  // magic length on the right, ticks and all. That is what lets the child SEE that the two
  // rulings never coincide, which is the whole reason the next screen has to measure.
  // ⚠️ Both are additive. Part D and Part F pass whole counts and no phantom, and their two
  // screens are byte-identical to before (snapshot-checked).
  const RN = q.rn || 1, seg2 = H / RN, rMax = q.rTo || RN;
  const nUp = q.nPhantom ? (Math.ceil(N4 - 1e-9) - N4) * seg : 0;
  const rUp = (rMax - RN) * seg2;
  const TOP = 8 + Math.max(nUp, rUp), BASE = TOP + H;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; margin:22px auto 0; width:' + (RX + 210) + 'px;' +
    'height:' + (BASE + 68) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    wrap.appendChild(d);
    return d;
  };

  CANDS.slice(0, nCand).forEach(([k, f, key], i) => {
    const h = H * f;
    const cell = put('left:' + (i * CW) + 'px; top:' + TOP + 'px; width:' + CW + 'px;' +
      'height:' + (H + 44) + 'px; cursor:pointer; border-radius:8px;' +
      'border:2px solid transparent;');
    const bar = document.createElement('div');
    bar.style.cssText = 'position:absolute; left:' + (CW / 2 - 13) + 'px;' +
      'top:' + (H - h) + 'px; width:26px; height:' + h + 'px; box-sizing:border-box;' +
      'background:' + REG.b.fill + '; border:2px solid ' + REG.b.ink + ';';
    cell.appendChild(bar);
    const lab = document.createElement('div');
    lab.innerHTML = t(key);
    lab.style.cssText = 'position:absolute; left:0; top:' + (H + 8) + 'px; width:' + CW + 'px;' +
      'text-align:center; font-size:13px; line-height:16px; color:#3a3a3a;';
    cell.appendChild(lab);
    cell.addEventListener('mouseenter', () => { cell.style.borderColor = REG.b.ink; });
    cell.addEventListener('mouseleave', () => { cell.style.borderColor = 'transparent'; });
    cell.addEventListener('click', () => onPick(k));
  });

  if (nUp) put('left:' + LX + 'px; top:' + (TOP - nUp) + 'px; width:5px;' +
               'height:' + nUp + 'px; background:' + LC + '; opacity:0.35;');
  put('left:' + LX + 'px; top:' + TOP + 'px; width:5px; height:' + H + 'px;' +
      'background:' + LC + ';');
  const nT = Math.floor(N4 + 1e-9);
  const tickL = (y, dim) => put('left:' + (LX - 7) + 'px; top:' + (y - 1.5) + 'px;' +
                                'width:19px; height:3px; background:' + LC + ';' +
                                (dim ? 'opacity:0.35;' : ''));
