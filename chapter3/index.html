    addButton(t('c3_ap_comp_no'), nextStep);
  },

  // ---- PART B: name the bit, and square the side -------------------------
  // The move the whole chapter turns on, and it is a move about NOTATION rather than about
  // arithmetic: the thing we cannot measure gets a letter, and once it has a letter it can
  // go into a picture and be operated on. Chapter 2 earned this — its Part E wrote the sides
  // of a field as sums and then as letters — so here it is a tool being picked up again.
  function bName() {
    clearGame();
    showEliel();
    const eq = '<strong>s = 2 + d</strong>';
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_b_name1') + '</p>' +
      '<p style="margin-top:8px">' + t('c3_b_name2') + '</p>' +
      '<p style="margin-top:8px">' + t('c3_b_name3', { eq: eq }) + '</p>'
    );
    gameArea.appendChild(squareSplitEl({ brackets: bBr() }));
    addButton(t('btn_continue'), nextStep);
  },

  // The cut, watched rather than asserted — Chapter 2's "Carry on the lines!" button, and
  // for the same reason: the child should see the four pieces appear out of the two cuts,
  // not arrive already drawn.
  function bCut() {
    clearGame();
    showEliel();
    const sq = '<strong><span style="white-space:nowrap">(2 + d) &times; (2 + d)</span></strong>';
    // ⚠️ showEliel() appends to gameArea (not to #elf-area), so a redraw that empties the
    // game area takes Eliel with it. He has to be put back every time.
    const draw = cut => {
      gameArea.innerHTML = '';
      showEliel();
      gameArea.appendChild(squareSplitEl({ brackets: bBr(), cut: cut, stripTicks: true, squares: cut }));
    };
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_b_cut1', { formula: '<strong>s &times; s</strong>', sq: sq }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_b_cut2') + '</p>'
    );
    draw(false);
    addButton(t('c3_b_cut_btn'), () => {
      draw(true);
      storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_b_cut3') + '</p>');
      buttonArea.innerHTML = '';
      addButton(t('btn_continue'), nextStep);
    });
  },

  // The one piece of the four that IS a number — and it is the four magic squares the child
  // laid with their own hands in Part A, still sitting where they laid them.
  function bBigSquare() {
    clearGame();
    showEliel();
    gameArea.appendChild(squareSplitEl({ cut: true, stripTicks: true, focus: 'a', brackets: bBr() }));
    gameArea.appendChild(underField(regLegend('a')));
    askInline(t('c3_b_big_q'), FIELD.n * FIELD.n, () => {
      clearGame();
      showEliel();
      gameArea.appendChild(squareSplitEl({ cut: true, stripTicks: true, focus: 'a', brackets: bBr(), squares: true }));
      gameArea.appendChild(underField(regLegend('a')));
      storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_b_big_ok') + '</p>');
      addButton(t('btn_continue'), nextStep);
    }, t('c3_b_big_hint'));
  },

  // ...and the three that are not numbers. Saying so plainly is the point: an area you can
  // write but not count is a new kind of object, and the chapter needs the child to be
  // comfortable with it before Part C starts moving them around.
  function bStrips() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_b_strip1', { term: regTerm('b', '2 &times; d') }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_b_strip2') + '</p>'
    );
    gameArea.appendChild(squareSplitEl({ cut: true, stripTicks: true, focus: ['b', 'c'], brackets: bBr(), squares: true }));
    gameArea.appendChild(underField(regLegend(['b', 'c'])));
    addButton(t('btn_continue'), nextStep);
  },

  // The corner, named and flagged. In Chapter 2 it was the piece everybody forgets; here it
  // is the piece we are about to throw away on purpose, so it gets its own screen.
  function bCorner() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_b_corner1', { term: regTerm('d', 'd &times; d') }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_b_corner2') + '</p>'
    );
    gameArea.appendChild(squareSplitEl({ cut: true, stripTicks: true, focus: 'd', brackets: bBr(), squares: true }));
    gameArea.appendChild(underField(regLegend('d')));
    addButton(t('btn_continue'), nextStep);
  },

  // The line the rest of the chapter works on. Everything the child knows about this field
  // is in it: the four pieces on the left, Marimon's record on the right.
  function bEquation() {
    clearGame();
    showEliel();
    // Every term nowrap, and each + travelling with the term after it — at 768px the sum
    // otherwise breaks between "2" and "x d", and a wrapped product reads as a typo.
    const nw = h => '<span style="white-space:nowrap">' + h + '</span>';
    const sum = '<strong>' + nw('2 &times; 2') + nw(' + 2 &times; d') +
      nw(' + 2 &times; d') + nw(' + d &times; d') + '</strong>';
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_b_eq1', { sum: sum }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_b_eq2', { a: FIELD.A }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_b_eq3') + '</p>'
    );
    const line = document.createElement('div');
    line.style.cssText = 'display:flex; justify-content:center; align-items:center; gap:10px;' +
      'margin-top:16px; font-size:21px; flex-wrap:wrap;';
    line.appendChild(regLegend());
    const eq = document.createElement('span');
    eq.innerHTML = '&nbsp;=&nbsp;<strong>' + FIELD.A + '</strong>';
    eq.style.cssText = 'font-size:21px; color:#3a3a3a;';
    line.appendChild(eq);
    // ⚠️ The equation is finished IN AREA as well as in numbers (Sylvain): the cut-up square,
    // an `=`, and the five magic squares it comes to — four in a block, as on the left, and the
    // fifth beside them. The picture now says exactly what the line under it says.
    gameArea.appendChild(areaEqEl(
      squareSplitEl({ cut: true, stripTicks: true, brackets: bBr(), squares: true }),
      FIELD.A, line));
    addButton(t('btn_continue'), nextStep);
  },

  // ---- PART C: take the four off, and throw the corner away --------------
  // The four magic squares are on both sides of the line, so they can come off both — which
  // is an operation on an EQUATION, and the first one this project has ever done. It is
  // shown as a thing that happens to the ground (the four are lifted off, and the hole they
  // leave stays visible) so that "do the same to both sides" is a physical act first.
  function cTakeOff() {
    clearGame();
    showEliel();
    const four = [['a', '2 &times; 2'], ['b', '2 &times; d'], ['c', '2 &times; d'], ['d', 'd &times; d']];
    const three = four.slice(1);
    // ⚠️ THE FOUR COME OFF BOTH SIDES ON THE SAME CLICK (Sylvain), which is the whole of what
    // this screen is teaching. So the right-hand side loses its block of four at the very moment
    // the field does, and what is left standing there — one magic square — is the answer to the
    // question the line is asking. The child reads it off the ground, which is this chapter's
    // way of answering everything else.
    const draw = off => {
      gameArea.innerHTML = '';
      showEliel();
      gameArea.appendChild(areaEqEl(
        squareSplitEl({ cut: true, stripTicks: true, brackets: bBr(),
                        squares: !off, off: off ? 'a' : null }),
        FIELD.A, eqLine(off ? three : four, off ? '?' : String(FIELD.A)), off));
    };
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_c_off1', { a: FIELD.A }) + '</p>');
    draw(false);
    addButton(t('c3_c_off_btn'), () => {
      draw(true);
      buttonArea.innerHTML = '';
      askInline(t('c3_c_off_q', { a: FIELD.A }), FIELD.A - FIELD.n * FIELD.n, () => {
        gameArea.innerHTML = '';
        showEliel();
        gameArea.appendChild(areaEqEl(
          squareSplitEl({ cut: true, stripTicks: true, brackets: bBr(), off: 'a' }),
          FIELD.A - FIELD.n * FIELD.n, eqLine(three, '1')));
        gameArea.appendChild(unrolledLEl('split'));
        storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_c_off2') + '</p>');
        addButton(t('btn_continue'), nextStep);
      }, t('c3_c_off_hint', { a: FIELD.A }));
    });
  },

  // Two strips of the same size pushed end to end make one strip twice as long. That is
  // where 2xd + 2xd becomes 4xd — and it is done by sliding ground about, not by a rule
  // about letters, because sliding ground about is what this whole project does.
  function cJoin() {
    clearGame();
    showEliel();
    const draw = joined => {
      gameArea.innerHTML = '';
      showEliel();
      gameArea.appendChild(unrolledLEl(joined ? 'joined' : 'split'));
      gameArea.appendChild(eqLine(
        joined ? [['b', '4 &times; d'], ['d', 'd &times; d']]
               : [['b', '2 &times; d'], ['c', '2 &times; d'], ['d', 'd &times; d']], '1'));
    };
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_c_join1') + '</p>');
    draw(false);
    addButton(t('c3_c_join_btn'), () => {
      draw(true);
      buttonArea.innerHTML = '';
      storyHTML('<div class="speaker">Eliel</div><p>' +
        t('c3_c_join2', { term: regTerm('b', '4 &times; d') }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    });
  },

  // The judgement, put to the child before it is acted on. Both buttons advance: it is an
  // invitation to have an opinion about how much a small thing matters, which is the actual
  // content of the screen and is not something to be right or wrong about.
  function cCornerSmall() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_c_small1') + '</p>' +
      '<p style="margin-top:8px">' + t('c3_c_small2') + '</p>'
    );
    gameArea.appendChild(unrolledLEl('joined'));
    gameArea.appendChild(eqLine([['b', '4 &times; d'], ['d', 'd &times; d']], '1'));
    addButton(t('c3_c_small_no'), nextStep);
    addButton(t('c3_c_small_yes'), nextStep);
  },

  // ...and the approximation itself. Said as a decision with a reason and a promise attached,
  // rather than as a rule: we are leaving something out ON PURPOSE, we know it is not nothing,
  // and Part G is where we come back and measure exactly what it cost us.
  function cDrop() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_c_drop1') + '</p>' +
      '<p style="margin-top:8px">' + t('c3_c_drop2') + '</p>' +
      '<p style="margin-top:8px">' + t('c3_c_drop3', {
        dtil: bold(DTIL),
        eq: bold('4 &times; ' + DTIL + ' = 1'),
        near: bold(DTIL + ' &asymp; d'),
      }) + '</p>'
    );
    // The corner is GONE from the picture, not merely faded (Sylvain). The equation it
    // belonged to is gone: what is left is a single strip, 4 × d̃, whose area is exactly one
    // magic square. Keeping the corner on screen beside an exact equals would be showing a
    // piece that the line no longer accounts for.
    gameArea.appendChild(unrolledLEl('dropped'));
    gameArea.appendChild(eqLine([['b', '4 &times; ' + DTIL]], '1'));
    addButton(t('btn_continue'), nextStep);
  },

  // Is the new number bigger or smaller than the true one? It is BIGGER, and the child can
  // reason it straight off the picture: the square has not changed, a piece has been taken
  // away from what covers it, so what is left has to make up the difference. (Algebraically
  // 4d̃ = 1 = 4d + d², so d̃ = d + d²/4 — always bigger.) This is the screen that makes the
  // tilde pay for itself: two numbers, and we can say which way round they go.
  function cBigger() {
    clearGame();
    showEliel();
    const v = { dtil: bold(DTIL), d: bold('d') };
    const ask = () => {
      storyHTML(
        '<div class="speaker">Eliel</div>' +
        '<p>' + t('c3_c_big1') + '</p>' +
        '<p style="margin-top:8px">' + t('c3_c_big_q', v) + '</p>'
      );
      buttonArea.innerHTML = '';
      // ⚠️ Button labels go through textContent, so they get the PLAIN letters — never
      // bold()/nw(), which would print their own markup on the button.
      // A wrong answer is not waved through: this one is deducible from the picture, so it
      // is answered the way askInline answers a wrong number — the reason is restated and
      // the buttons stay up. Nothing is lost by trying.
      addButton(t('c3_c_big_yes', { dtil: DTIL, d: 'd' }), () => {
        clearGame();
        showEliel();
        storyHTML(
          '<div class="speaker">Eliel</div>' +
          '<p>' + t('c3_c_big2', {
            dtil: bold(DTIL), L: bold('L = 4'), l: bold('l'),
          }) + '</p>' +
          '<p style="margin-top:8px">' +
            t('c3_c_big3', { dtil: bold(DTIL), d: bold('d') }) + '</p>'
        );
        gameArea.appendChild(twoEquationsEl());
        gameArea.appendChild(stripCompareEl());
        addButton(t('btn_continue'), nextStep);
      });
      addButton(t('c3_c_big_no', { dtil: DTIL, d: 'd' }), () => {
        storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_c_big_wrong') + '</p>');
        setTimeout(ask, 1800);
      });
    };
    gameArea.appendChild(twoEquationsEl());
    ask();
  },

  // ---- PART D: share it out, and d-tilde comes out -----------------------
  // GAP 2. Division has never appeared in this project — Chapter 1 built multiplication,
  // Chapter 2 built x10 and distributivity — and `4 x d-tilde = 1` needs it. It arrives the way
  // multiplication did: off the ground, as equal shares, with the answer read off a picture
  // rather than got from a rule.
  function dCut() {
    clearGame();
    showEliel();
    const draw = st => {
      gameArea.innerHTML = '';
      showEliel();
      gameArea.appendChild(stackEl(st));
    };
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_d_cut1', { L: bold('4'), d: bold(DTIL) }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_d_cut2') + '</p>'
    );
    draw('whole');
    addButton(t('c3_d_cut_btn'), () => {
      draw('cut');
      buttonArea.innerHTML = '';
      storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_d_cut3', {
        d: bold(DTIL),
        area1: bold('1 &times; ' + DTIL),
        eq1: bold('4 &times; ' + DTIL + ' = 4 &times; (1 &times; ' + DTIL + ')'),
      }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    });
  },

  // COMMUTATIVITY, and the swap has a meaning on the ground: end to end becomes one on top of
  // another. The four stripes keep their own d̃ up the side — four of them, which is exactly
  // what 4 × (d̃ × 1) says (Sylvain).
  function dStack() {
    clearGame();
    showEliel();
    const draw = st => {
      gameArea.innerHTML = '';
      showEliel();
      gameArea.appendChild(stackEl(st));
    };
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_d_stack1', {
      a: bold('1 &times; ' + DTIL), b: bold(DTIL + ' &times; 1'),
      eq2: bold('4 &times; ' + DTIL + ' = 4 &times; (1 &times; ' + DTIL + ')' +
                ' = 4 &times; (' + DTIL + ' &times; 1)'),
    }) + '</p>');
    draw('cut');
    addButton(t('c3_d_stack_btn'), () => {
      draw('pile4');
      buttonArea.innerHTML = '';
      storyHTML('<div class="speaker">Eliel</div><p>' +
        t('c3_d_st_area', { d: bold(DTIL) }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    });
  },

  // ASSOCIATIVITY, and its meaning on the ground: the four d̃'s up the side become the one
  // bracket they add up to. That single relabelling is the whole step — the shape does not
  // move, only the way it is measured.
  function dAssoc() {
    clearGame();
    showEliel();
    const L = bold('L = 4 &times; ' + DTIL), l = bold('l = 1');
    const draw = st => {
      gameArea.innerHTML = '';
      showEliel();
      gameArea.appendChild(stackEl(st));
    };
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_d_as1', {
      eq3: bold('4 &times; ' + DTIL + ' = 4 &times; (1 &times; ' + DTIL + ')' +
                ' = 4 &times; (' + DTIL + ' &times; 1) = (4 &times; ' + DTIL + ') &times; 1'),
    }) + '</p>');
    draw('pile4');
    addButton(t('c3_d_as2'), () => {
      draw('pile1');
      buttonArea.innerHTML = '';
      storyHTML('<div class="speaker">Eliel</div><p>' +
        t('c3_d_as3', { d: bold(DTIL), L: L, l: l }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    });
  },

  // ...and now the conclusion is TRIED rather than argued (Sylvain). Make the side longer and
  // look; make it shorter and look; find that neither will do; and only then say it must be
  // equal. Four beats, each with a question the child settles off the picture.
  function dTryLonger() {
    const L = bold('L = 4 &times; ' + DTIL);
    choose(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_d_try1', { L: L }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_d_try_long_q') + '</p>',
      () => pileCaseEl(CASE_LONG, 'c3_d_case_big', null),
      ['c3_d_opt_larger', 'c3_d_opt_smaller'], 0, 'c3_d_try_long_no',
      () => {
        clearGame();
        showEliel();
        storyHTML('<div class="speaker">Eliel</div><p>' +
          t('c3_d_try_long_ok', { L: L }) + '</p>');
        gameArea.appendChild(pileCaseEl(CASE_LONG, 'c3_d_case_big', 'c3_d_case_toobig'));
        addButton(t('btn_continue'), nextStep);
      });
  },

  function dTryShorter() {
    const L = bold('L = 4 &times; ' + DTIL);
    choose(
      '<div class="speaker">Eliel</div><p>' + t('c3_d_try_short_q') + '</p>',
      () => pileCaseEl(CASE_SHORT, 'c3_d_case_small', null),
      ['c3_d_opt_larger', 'c3_d_opt_smaller'], 1, 'c3_d_try_short_no',
      () => {
        clearGame();
        showEliel();
        storyHTML('<div class="speaker">Eliel</div><p>' +
          t('c3_d_try_short_ok', { L: L }) + '</p>');
        gameArea.appendChild(pileCaseEl(CASE_SHORT, 'c3_d_case_small', 'c3_d_case_toosmall'));
        addButton(t('btn_continue'), nextStep);
      });
  },

  // Neither will do — so what is left? Both cases side by side, with their verdicts.
  function dMustEqual() {
    const L = bold('L = 4 &times; ' + DTIL);
    choose(
      '<div class="speaker">Eliel</div><p>' + t('c3_d_must_q', { L: L }) + '</p>',
      pileCasesEl,
      ['c3_d_opt_yes', 'c3_d_opt_no'], 0, 'c3_d_must_no',
      () => nextStep());
  },

  // ...and what that makes the rectangle. The pile comes back, finished, for the answer.
  function dIsSquare() {
    const L = bold('L = 4 &times; ' + DTIL), l = bold('l = 1');
    choose(
      '<div class="speaker">Eliel</div><p>' + t('c3_d_sq_q2', {
        eq: bold('4 &times; ' + DTIL + ' = 1'), L: L, l: l,
      }) + '</p>',
      () => stackEl('pile1'),
      ['c3_d_opt_yes', 'c3_d_opt_no'], 0, 'c3_d_sq_no2',
      () => {
        clearGame();
        showEliel();
        storyHTML(
          '<div class="speaker">Eliel</div>' +
          '<p>' + t('c3_d_sq_ok2') + '</p>' +
          '<p style="margin-top:8px">' + t('c3_d_sq_ok3', { L: L }) + '</p>'
        );
        // The same fact twice over (Sylvain): as an equation, and as the ground it stands
        // for — with the equation written on the very side of the square it is about.
        gameArea.appendChild(eqLine([['b', '4 &times; ' + DTIL]], '1'));
        gameArea.appendChild(stackEl('pile1eq'));
        addButton(t('btn_continue'), nextStep);
      });
  },

  // ---- the quarter, and how to write it -------------------------------
  // The two squares have done their work; what is left is a statement about two LENGTHS. So
  // the picture sheds everything except the two sides, keeping their colours — and the four
  // ticks on ours are the four d̃ the child is about to be asked to measure.
  function dHowLong() {
    clearGame();
    showEliel();
    const ask = () => {
      clearGame();
      showEliel();
      storyHTML(
        '<div class="speaker">Eliel</div>' +
        '<p>' + t('c3_q_how1', { eq: bold('4 &times; ' + DTIL + ' = 1') }) + '</p>' +
        '<p style="margin-top:8px">' + t('c3_q_how2', { d: bold(DTIL) }) + '</p>'
      );
      gameArea.appendChild(twoSidesEl(k => {
        if (k !== 'quarter') {
          storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_q_how_no') + '</p>');
          return setTimeout(ask, 1900);
        }
        clearGame();
        showEliel();
        storyHTML(
          '<div class="speaker">Eliel</div>' +
          '<p>' + t('c3_q_w1', { d: bold(DTIL) }) + '</p>' +
          '<p style="margin-top:8px">' + t('c3_q_w2') + '</p>' +
          '<p style="margin-top:8px">' + t('c3_q_w3') + '</p>'
        );
        gameArea.appendChild(twoSidesEl());
        addButton(t('btn_continue'), nextStep);
      }));
    };
    ask();
  },

  // TENTHS ALONE WILL NOT DO IT — and the child finds that out by laying them, exactly as
  // Chapter 2's Part A found out that whole magic lengths would not measure a weird field.
  // Two fit, the third runs out past the end, and that overshoot is the answer.
  function dTryTenths() {
    clearGame();
    showEliel();
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_q_t1') + '</p>');
    const bar = quarterLayEl();
    gameArea.appendChild(bar);
    let left = 3, laid = 0;
    bar.__tray(left, QTENTH, 'c3_q_sup_tenths');
    bar.__hit(() => {
      if (left <= 0) return;
      const over = bar.__lay(QTENTH);
      laid++;
      bar.__tray(--left, QTENTH, 'c3_q_sup_tenths');
      if (laid === 2) say('Eliel', t('c3_q_t2'));
      if (over) {
        bar.__stripOff();
        storyHTML(
          '<div class="speaker">Eliel</div>' +
          '<p>' + t('c3_q_t3') + '</p>' +
          '<p style="margin-top:8px">' + t('c3_q_t4') + '</p>'
        );
        addButton(t('btn_continue'), nextStep);
      }
    });
  },

  // ...and hundredths do. Two tenths, five hundredths, and the quarter comes out exactly —
  // which is what makes 0.25 writable at all, and it is Gap 3 (the hundredth of a LENGTH,
  // built back in Part A′) being spent.
  function dHundredths() {
    clearGame();
    showEliel();
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_q_h1') + '</p>');
    const bar = quarterLayEl();
    gameArea.appendChild(bar);
    let unit = QTENTH, left = 2, key = 'c3_q_sup_tenths', laid = 0;
    bar.__tray(left, unit, key);
    bar.__hit(() => {
      if (left <= 0) return;
      bar.__lay(unit);
      left--; laid++;
      bar.__tray(left, unit, key);
      if (laid === 2) {
        // the two tenths are down; the hundredths come out for the gap that is left
        unit = QHUND; left = 5; key = 'c3_q_sup_hund';
        bar.__tray(left, unit, key);
        storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_q_h2') + '</p>');
      }
      if (laid === 7) {
        bar.__stripOff();
          askAfterButton(t('c3_q_h3'), 2, () => {
            askAfterButton(t('c3_q_h4'), 5, () => {
              askAfterButton(t('c3_q_h5'), 0.25, () => {
                clearGame();
                showEliel();
                // The whole thing back on one screen before the last question: the FIELD,
                // still 2 + d down its side (the true d — that has never changed), and under
                // it the magic square the four d̃ came to. The two pictures are the two halves
                // of the substitution the chapter has just made.
                gameArea.appendChild(squareSplitEl({ cut: true, stripTicks: true, brackets: bBr(), squares: true }));
                gameArea.appendChild(stackEl('pile1eq'));
                // The recap travels WITH the question, or the question destroys it.
                const recap =
                  t('c3_q_h6', {
                    eqd: bold(DTIL + ' = ' + fmtNum(0.25)), d: bold(DTIL),
                    eqs: bold(sqrtHTML(FIELD.A) + ' &asymp; 2 + ' + fmtNum(0.25)),
                  }) + PARA + t('c3_q_h6b', { d: bold(DTIL) });
                // The whole road in one line, right above the box the child types into:
                // the exact side, the substitution, and the number it came to.
                askWithLead(recap, t('c3_q_h7', {
                  sqrt: bold(sqrtHTML(FIELD.A)),
                  chain: bold(sqrtHTML(FIELD.A) + ' = 2 + d &asymp; 2 + ' + DTIL +
                              ' = 2 + ' + fmtNum(0.25)),
                }), 2.25, () => nextStep(), t('c3_q_h7_hint'), { decimal: true });
              }, t('c3_q_h5_hint'), { decimal: true });
            }, t('c3_q_h4_hint'));
          }, t('c3_q_h3_hint'));
      }
    });
  },

  // ---- PART E: check it, then cash it in ---------------------------------
  // Part E's side mark-up, in one place so every screen of the part draws it identically and
  // the picture cannot jump between them.
  // The promise made in Part C comes due. Squaring 2.25 gives 5 AND ONE SIXTEENTH, and that
  // sixteenth is exactly the corner that was thrown away — so the child can see both that
  // the answer is a little too big and precisely why, and by how much.
  //
  // "One sixteenth" is first a PICTURE — sixteen quarter-squares in a magic square — because
  // that is the form a child can check. It is THEN turned into 0.0625, in the four steps
  // after eCorner, by halving a hundred flower squares until the halving stops coming out
  // even. (That reverses an earlier rule here, which said four decimal places would be a new
  // idea smuggled in to serve a check. Announced, they would have been. Built, they are the
  // chapter's own method run one level finer.)
  // Our answer gets a name of its own — and then the multiplication that will test it is
  // handed back to the child as a question rather than performed for them: *how do we work
  // out a multiplication like that? Does it remind you of anything?* (Sylvain). The answer is
  // Chapter 2's own identity, and the child should be the one to say so.
  function eCheck() {
    clearGame();
    showEliel();
    const S = fmtNum(2.25), Q = fmtNum(0.25);
    const eqA = bold(SUBA1 + ' = ' + SUB1 + '&sup2; = ' + SUB1 + ' &times; ' + SUB1);
    const eqFull = bold(SUBA1 + ' = ' + SUB1 + ' &times; ' + SUB1 +
      ' = (2 + ' + Q + ') &times; (2 + ' + Q + ')');
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_e_ch1', {
        sqrt_a: bold(sqrtHTML(FIELD.A)), s: bold(S), stil: bold(SUB1),
      }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_e_ch2', {
        a: FIELD.A, stil: bold(SUB1), atil: bold(SUBA1), eq_a: eqA,
      }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_e_n3', {
        stil: bold(SUB1), q: bold(Q), eq_full: eqFull,
      }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_e_n4') + '</p>'
    );
    // Undivided on purpose: this screen asks HOW to work the multiplication out, and the
    // four-rectangle answer is the next screen's to give. Showing the cut here would answer
    // the question in the picture while Eliel is still asking it.
    gameArea.appendChild(squareSplitEl({ side: 2.25 }));
    // Both advance: a child who cannot name it is about to be shown it, and a question that
    // only accepts one answer teaches that Eliel was not really asking.
    addButton(t('c3_e_n_yes'), nextStep);
    addButton(t('c3_e_n_no'), nextStep);
  },

  // The decomposition, named and written out, and then handed on to be computed piece by
  // piece — which is where the old version started, and it started a screen too late.
  function eDistrib() {
    clearGame();
    showEliel();
    const Q = fmtNum(0.25);
    // The undecomposed product stays in front of the split one (Sylvain), so the child can
    // see WHICH multiplication is being taken apart instead of carrying it over from the
    // screen before. Chapter 2's eSplitSides made exactly this call for the same reason.
    // Every term is nowrap, so a line break can only land on a + or an =.
    const four = bold(SUBA1 + ' = ' + SUB1 + '&sup2;') + ' = ' +
      nw('(2 + ' + Q + ') &times; (2 + ' + Q + ')') + ' = ' +
      nw('2 &times; 2') + ' + ' + nw('2 &times; ' + Q) + ' + ' +
      nw('2 &times; ' + Q) + ' + ' + nw(Q + ' &times; ' + Q);
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_e_d1', { stil: bold(SUB1 + ' = ' + fmtNum(2.25)) }) + '</p>' +
      '<p style="margin-top:10px; font-size:19px">' + four + '</p>' +
      '<p style="margin-top:10px">' + t('c3_e_d2') + '</p>'
    );
    // Both sides bracketed (Sylvain), each showing the WHOLE side and the two pieces it comes
    // apart into — Chapter 2's L = a + b and l = c + d, one dimension at a time. On a square
    // the two are the same, and seeing the same mark-up twice is what says so.
    gameArea.appendChild(squareSplitEl({ side: 2.25, cut: true, squares: true, brackets: eBr() }));
    addButton(t('btn_continue'), nextStep);
  },

  // Now the pieces, one at a time — and the one being examined is the one that is lit.
  function ePartsBig() {
    clearGame();
    showEliel();
    const lit = () => squareSplitEl({
      side: 2.25, cut: true, squares: true, brackets: eBr(), focus: 'a',
    });
    gameArea.appendChild(lit());
    // The child does this one themselves (Sylvain). It is the easy term of the four, and an
    // easy term handed over is a term they own before the two awkward ones arrive — the same
    // reason Part A gave them 1, 4 and 9 before the area-5 field.
    askWithLead(t('c3_e_ch3'), t('c3_e_ch_bq', { eq: bold('2 &times; 2') }), 4, () => {
      clearGame();
      showEliel();
      gameArea.appendChild(lit());
      storyHTML('<div class="speaker">Eliel</div><p>' +
        t('c3_e_ch3b', { eq: bold('2 &times; 2 = 4') }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    }, t('c3_e_ch_bhint'));
  },

  function ePartsStrips() {
    clearGame();
    showEliel();
    const one = nw('1 &times; ' + DTIL);
    const eqd = nw(DTIL + ' = ' + fmtNum(0.25));
    const eq4 = nw('4 &times; ' + DTIL + ' = 1');
    // ⚠️ `stripTicks` — the 2 magic lengths inside each strip, marked by the tick between them
    // (Sylvain), the way Part B's own strips and Part G's check both mark them. It is what makes
    // "each is 2 magic lengths long" something to count rather than something to be told, and
    // therefore what makes "so each is two pieces of 1 × d̃" follow off the picture.
    const strips = () => squareSplitEl({
      side: 2.25, cut: true, squares: true, brackets: eBr(), focus: ['b', 'c'],
      stripTicks: true,
    });
    storyHTML('<div class="speaker">Eliel</div><p>' +
      t('c3_e_p_strip', {
        q: fmtNum(0.25), one: one, d: bold(DTIL), eqd: eqd, eq4: eq4,
      }) + '</p>');
    gameArea.appendChild(strips());
    // THE EASY ROUTE (Sylvain). Each strip is 2 magic lengths of d̃-wide ground, so it is two
    // pieces of 1 × d̃; the two strips are four of them. Pile those four up and it is Part D's
    // own pile — 4 × d̃ = 1 magic length, the equation d̃ was DEFINED to satisfy. So the two
    // strips come to a magic square by a fact the child established with their own hands,
    // rather than by a fresh piece of arithmetic. Watched on a button rather than asserted,
    // which is Chapter 2's "Carry the lines across!" idiom.
    addButton(t('c3_e_p_btn'), () => {
      clearGame();
      showEliel();
      gameArea.appendChild(strips());
      gameArea.appendChild(stackEl('pile1eq'));
      // The strips and the pile both stay up (the game area is untouched by a question), so
      // the answer is read off the picture rather than remembered from it — and the sentence
      // that explains the pile rides along with the question rather than being eaten by it.
      askWithLead(t('c3_e_p_piled', { one: one, eq4: eq4 }), t('c3_e_ch_q'), 1, () => {
        clearGame();
        showEliel();
        gameArea.appendChild(squareSplitEl({
          side: 2.25, cut: true, squares: true, brackets: eBr(), focus: ['a', 'b', 'c'],
        }));
        storyHTML(
          '<div class="speaker">Eliel</div>' +
          '<p>' + t('c3_e_ch4', { a: FIELD.A }) + '</p>' +
          '<p style="margin-top:8px">' + t('c3_e_ch5') + '</p>'
        );
        addButton(t('btn_continue'), nextStep);
      }, t('c3_e_ch_hint'));
    });
  },

  // The corner counted, not asserted — and then named as the cost of Part C's decision.

    clearGame();

          t('c3_e_cor3', { dtil: bold(DTIL), d: bold('d') }) + '</p>'
      );
      addButton(t('btn_continue'), nextStep);
    }, t('c3_e_cor_hint'));
  },

  // ---- the sixteenth, turned into a number --------------------------------
  // ⚠️ THIS SUPERSEDES the rule written above eCheck, that the corner is never written as
  // 0.0625 (Sylvain: "that is not easy, right? Could we try anyway?"). The objection was
  // never to four decimal places as such — it was to four places ARRIVING FROM NOWHERE in
  // order to make a check come out. Here they are built, the chapter's own way: halve a
  // hundred flower squares four times over on the ground, watch the last two cuts slice
  // cells down the middle, and the four figures after the dot are the CONSEQUENCE of that
  // rather than its premise. Every number in the run is answered by the child.
  function eSixteenthCut() {
    clearGame();
    showEliel();
    const show = st => { clearGame(); showEliel(); gameArea.appendChild(flowerCutEl(st)); };
    show(0);
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_e_16_1') + '</p>');
    addButton(t('c3_e_16_btn'), () => {
      show(1);
      askWithLead(t('c3_e_16_2'), t('c3_e_16_q1'), 50, () => {
        show(2);
        askWithLead(t('c3_e_16_3'), t('c3_e_16_q2'), 25, () => nextStep(), t('c3_e_16_h2'));
      }, t('c3_e_16_h1'));
    });
  },

  // The two awkward cuts. Neither is asked as a number — 12.5 IS the awkwardness being
  // displayed, and asking for it would answer the question the picture is posing.
  function eSixteenthHalves() {
    clearGame();
    showEliel();
    const show = st => { clearGame(); showEliel(); gameArea.appendChild(flowerCutEl(st)); };
    show(2);

  // The corner of the corner — and the quarter is written the way Part D wrote d̃, which is

  function eSixteenthQuarter() {
    clearGame();
    showEliel();
    gameArea.appendChild(flowerCutEl(4));
    askWithLead(t('c3_e_16_7', { d: bold(DTIL) }), t('c3_e_16_q4'), 0.25, () => {
      askAfterButton(t('c3_e_16_q5', { sum: bold('6 + ' + fmtNum(0.25)) }), 6.25,
        () => nextStep(), t('c3_e_16_h5'), { decimal: true });
    }, t('c3_e_16_h4'), { decimal: true });
  },

  // Hundredths back to magic squares — Chapter 2's own dot-move, on a number that already
  // has something after the dot. That is the one new thing here, and it is said out loud.
  function eSixteenthDecimal() {
    clearGame();
    showEliel();
    const field = () => squareSplitEl({
      side: 2.25, cut: true, squares: true, brackets: eBr(),
    });
    gameArea.appendChild(flowerCutEl(4));
    askWithLead(t('c3_e_16_8', { n: bold(fmtNum(6.25)) }), t('c3_e_16_q6'), 0.0625, () => {
      clearGame();
      showEliel();
      gameArea.appendChild(field());
      const chain = bold(SUBA1 + ' = ' + SUB1 + '&sup2; = ' + fmtNum(2.25) + ' &times; ' +
        fmtNum(2.25) + ' = 5 + ' + fmtNum(0.0625));
      askWithLead(t('c3_e_16_9', { chain: chain }),
        t('c3_e_16_q7', { atil: bold(SUBA1) }), 5.0625, () => {
          clearGame();
          showEliel();
          gameArea.appendChild(field());
          storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_e_16_10', {
            a: fmtNum(5.0625), m: FIELD.A, q: fmtNum(0.0625),
          }) + '</p>');
          addButton(t('btn_continue'), nextStep);
        }, t('c3_e_16_h7', { q: fmtNum(0.0625) }), { decimal: true });
    }, t('c3_e_16_h6'), { decimal: true });
  },

  // The fence — Chapter 2's distributivity used on a decimal, and the four quarters that
  // make one are the very fact Part D's pile established.
  function eFence() {
    clearGame();
    showEliel();
    const split = '<strong><span style="white-space:nowrap">4 &times; ' + fmtNum(2.25) +
      ' = 4 &times; 2 + 4 &times; ' + fmtNum(0.25) + '</span></strong>';
    gameArea.appendChild(squareSplitEl({ side: 2.25, cut: true, squares: true }));
    // The split IS the content of this screen, so it has to survive the question being

    askWithLead(
      t('c3_e_fen1', { s: '<strong>' + fmtNum(2.25) + '</strong>' }) + PARA +
      t('c3_e_fen2', { split: split }),
      t('c3_e_fen_q'), 9, () => {

      showEliel();

      storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_e_fen3', { p: 9 }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    }, t('c3_e_fen_hint'));
  },

  // The seeds, and the reason they are easy: for the first time in three chapters the AREA
  // is the thing we were handed, so the shopping list falls straight out of it.
  function eSeeds() {
    clearGame();
    showEliel();
    // All five seeds are sown BEFORE the question. Chapter 2's lesson 17 is about the
    // NUMBER — a caption, a bracket's label — not about the ground: the sown field is what
    // the question is about, and the child counts what they can see.
    // ⚠️ No `side` override — this is the TRUE field, area exactly 5. Every other screen in
    // Part E draws our answer's square (2.25 a side, area 5.0625) because they are checking
    // the answer. The seeds are not: they come off the area Marimon handed us, so nothing on
    // this screen is approximate and nothing is left over. The two squares differ by 1px.
    gameArea.appendChild(squareSplitEl({ cut: true, squares: true, plot: true }));
    askWithLead(t('c3_e_seed1', { a: FIELD.A }) +
      PARA + t('c3_e_seed2', { eq: bold('4 &times; d + d &times; d = 1') }),
      t('c3_e_seed_q'), FIELD.A, () => nextStep(), t('c3_e_seed_hint'));
  },

  // The ending. Part F follows, but this has to stand on its own: it is the designed break
  // in a chapter that may well be two sittings (CHAPTER3_PLAN.md §8 D7). So it closes the
  // quest properly — and then mentions, quietly, that there are more fields.
  function eEnd() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_e_end1', { a: FIELD.A, p: 9 }) + '</p>' +
      '<p style="margin-top:8px">' + t('c3_e_end2') + '</p>'
    );
    // The true field, its five seeds, and the fence Eliel came for — the whole quest in one
    // picture. Not cut into the four regions: that decomposition did its work and is over,
    // and here the ground is simply planted. (Same reasoning as eSeeds and Part F.)
    gameArea.appendChild(squareSplitEl({ squares: true, plot: true, wire: true }));
    const box = document.createElement('div');
    box.style.cssText = 'text-align:center; margin-top:26px; padding:18px;' +
      'background:#d4edda; border-radius:12px;';
    box.innerHTML =
      '<h2 style="color:#5a8f3d; margin-bottom:8px;">' + t('c3_e_end_title') + '</h2>' +
      '<p style="font-size:18px;">' + t('c3_e_end_text', {
        sqrt: '<strong>' + sqrtHTML(FIELD.A) + '</strong>', s: '<strong>' + fmtNum(2.25) + '</strong>',
      }) + '</p>' +
      '<p style="margin-top:12px; color:#888;">' +
        t('c3_e_end_next', { n: AREAS.length - EASY.length - 1 }) + '</p>';
    gameArea.appendChild(box);
    addButton(t('btn_continue'), nextStep);
  },

  // THE METHOD, WRITTEN OUT WITH LETTERS (Sylvain). Everything Parts B-E did on one field,
  // said once for ANY field — which is what makes it carry into Part F, where the child runs
  // it six more times. It is deliberately the LAST screen before the quest card rather than
  // the first after it: the summary is the payoff of this sitting and belongs inside it,
  // and the designed break (§8 D7) comes after the celebration, not before the point.
  //
  // The picture stays up beside the letters the whole way, because every symbol in the line
  // is a piece of ground on it: s_A is the block in the corner, a − A is the L, d̃ is how
  // thick the L is, and the little square is the corner we throw away.
  function eStock() {
    clearGame();
    showEliel();
    const A = bold('a'), AA = bold(SUBA0), SA = bold(SUB0), D = bold(DTIL);
    const REST = bold(nw('a &minus; ' + SUBA0));
    const K = bold(nw('2 &times; ' + SUB0));
    // ⚠️ THE FRACTION IS BRACKETED AND NAMED (Sylvain): a bracket under it and `d̃` beneath, so
    // the line says in notation what the picture below says in ground — that the share the child
    // has been working out all along IS that fraction. Drawn as the square underbracket this
    // chapter uses everywhere else for "this span is X", not a curly brace, and in the formula's
    // own ink rather than a colour that means something elsewhere.
    // ⚠️ Both marks are absolutely positioned off the fraction, so they cannot shift the line;
    // the div carries the padding they need instead.
    const braced =
      '<span style="position:relative; display:inline-block;">' +
        fracHTML('a &minus; ' + SUBA0, '2 &times; ' + SUB0) +
        '<span style="position:absolute; left:0; right:0; top:100%; margin-top:5px;' +
          'height:9px; box-sizing:border-box; border:2.5px solid #3a3a3a;' +
          'border-top:none;"></span>' +
        '<span style="position:absolute; left:-20px; right:-20px; top:100%;' +
          'margin-top:17px; text-align:center; font-size:20px; color:#3a3a3a;">' +
          '<strong>' + DTIL + '</strong></span>' +
      '</span>';
    const formula = '<div style="text-align:center; font-size:24px; margin:16px 0 6px;' +
      'padding-bottom:40px; color:#3a3a3a;"><strong>' +
      nw(SUB1 + ' = ' + SUB0 + ' + ' + braced) + '</strong></div>';
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_e_st1') + '</p>' +
      '<p style="margin-top:10px">' + t('c3_e_st2', {
        a: A, sqa: bold(nw('s = ' + sqrtHTML('a'))),
        approx: bold(nw(SUB1 + ' &asymp; s')),
      }) + '</p>' +
      formula +
      '<p style="margin-top:10px">' + t('c3_e_st3', {
        a: A, aA: AA, sA: SA, rootA: bold(sqrtHTML(SUBA0)),
      }) + '</p>' +
      // ⚠️ `{bar}` is the fraction bar itself, drawn rather than named — the paragraph is
      // explaining what that stroke MEANS, so it has to be the stroke and not the word.
      '<p style="margin-top:10px">' + t('c3_e_st4', {
        roota: bold(sqrtHTML('a')), s1: bold(SUB1), d: D, rest: REST, k: K,
        s0eq: bold(nw(SUB0 + ' = ' + sqrtHTML(SUBA0))),
        bar: '<span style="display:inline-block; width:24px; vertical-align:middle;' +

    );
    // the same field, marked up in the letters the line uses
    const stage = squareSplitEl({
      cut: true, squares: true, padL: 104,
      brackets: { lo: '<strong>' + SUB0 + '</strong>', hi: bold(DTIL), both: true },
    });
    // ⚠️ `a` is the field's true area, Marimon's own number; `ã₀` is the area our zeroth
    // answer's square gives, and `ã₁` the area the first one gives. They used to be `a` and
    // `A`, one keystroke apart — now they differ by a tilde and a subscript, and they read as
    // what they are: the truth, and our successive approximations of it. The block still
    // wears its letter, because it is the one on the line a child could read as the other.
    const R = regionBoxes(), lab = document.createElement('div');
    lab.innerHTML = '<strong>' + SUBA0 + '</strong>';
    lab.style.cssText = 'position:absolute; left:' + (104 + R.a.x) + 'px;' +

      'display:flex; align-items:center; justify-content:center; font-size:30px;' +
      'color:#3f7a34; z-index:5; pointer-events:none;';
    stage.appendChild(lab);
    // ⚠️ THE FIELD GOES ALONE AND CENTRED, with the chain beneath it (Sylvain). Its bracket
    // gutter is 104px, so centring the STAGE would leave the square itself 52px right of the
    // page's axis — the holder is twice the distance from the stage's left edge to the square's

    stage.style.margin = '0';

    col.style.cssText = 'display:flex; flex-direction:column; align-items:center;' +
      'margin-top:8px;';
    const holder = document.createElement('div');
    holder.style.cssText = 'flex:none; width:' + (2 * 104 + FIELD.s * PX) + 'px;';
    holder.appendChild(stage);
    col.appendChild(holder);
    col.appendChild(stockAreaEqEl());
    gameArea.appendChild(col);
