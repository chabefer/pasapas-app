// The improvement is not asserted, it is the difference between two pictures.
const HB = 120;

// ⚠️ THE BOX MEASURES THE BAND, so its side is the square root of the band's AREA — never
// e~ itself. On a field whose shave came out even the two are the same number; where it was
// rounded, or where the share it came from was rounded, they are not.
function bandSide(v, A) { return Math.sqrt(Math.max(0, v * v - A)); }

function hBeforeAfterEl(A) {
  const H = hNums(A);
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-start;' +
    'gap:64px; margin-top:18px;';
  // ⚠️ Each caption names its answer as well as giving it — `s̃ = 2` and `s̃₂ = 1.75`, not a
  // bare 2 and 1.75 (Sylvain). Two numbers side by side under two boxes need saying WHICH,
  // and the chapter has letters for both.
  [[bandSide(sTilFor(A), A), 'c3_h_lbl_before', nw(SUB1 + ' = ' + fmtNum(sTilFor(A)))],
   [bandSide(H.s2, A), 'c3_h_lbl_after', nw(SUB2 + ' = ' + fmtNum(H.s2))]].forEach(([w, key, ans]) => {
    const cell = document.createElement('div');
    cell.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:8px;';
    const box = document.createElement('div');
    box.style.cssText = 'position:relative; width:' + HB + 'px; height:' + HB + 'px;' +
      'background:#f4f0e4; outline:2px dashed #9c8f74; outline-offset:-1px;';
    if (w > 0) {
      const c = document.createElement('div');
      c.style.cssText = 'position:absolute; right:0; top:0; width:' + (w * HB) + 'px;' +
        'height:' + (w * HB) + 'px; box-sizing:border-box; background:' + REG.d.fill + ';' +
        'outline:1.5px solid ' + REG.d.ink + '; outline-offset:-1px;';
      box.appendChild(c);
    }
    cell.appendChild(box);
    const cap = document.createElement('div');
    cap.innerHTML = t(key, { s: '<strong>' + ans + '</strong>' });
    cap.style.cssText = 'font-size:14px; color:#5a5240; text-align:center; width:' +
      (HB + 40) + 'px;';
    cell.appendChild(cap);
    row.appendChild(cell);
  });
  return row;
}

// The two refined corners, for the meter's last appearance. ⚠️ A function, not a const:
// lesson 27, and it is one line either way.
// ⚠️ `done` is the list of fields refined SO FAR, which is what separates the meters in Part
// H's last stretch: a screen that ASKS which field is worst now must show the one it is about
// to refine still carrying its round-1 corner. Absent, every round is in — the ending's meter.
function hRefined(done) {
  const m = {};
  (done || H_ROUNDS).forEach(A => {
    if (G_BAD.indexOf(A) < 0) m[A] = bandSide(hNums(A).s2, A);
  });
  // ⚠️ Same rule as the boxes: the meter shows the ERROR, so a refined field's corner is
  // drawn from the band it actually has, not from its e~.
  G_BAD.forEach(A => { m[A] = bandSide(hNums(A).s2, A); });
  return m;
}

// The same list, for the LENGTH meter: field -> the answer now in force. The meter works out
// its own bar from it, so the two instruments cannot disagree about what has been refined.
function hAnswers(done) {
  const m = {};
  (done || H_ROUNDS).forEach(A => { m[A] = hNums(A).s2; });
  return m;
}

// EVERY field's answer after ONE MORE ROUND. Round two is the chapter's own rule — the shave
// laid out in hundredths and truncated — which is exactly `hNums(A).s2`, so the four fields Part
// H refined keep the answers the child wrote and the other eight get theirs the same way.
function hAnswers2() {
  const m = {};
  AREAS.forEach(A => { m[A] = hNums(A).s2; });
  return m;
}
// ⚠️ ROUND THREE CANNOT USE THAT RULE. By then the shave is smaller than a hundredth on every
// single field, so laying it out in hundredths would truncate it to nothing and the round would
// do nothing at all. The units have run out again — exactly as the magic lengths did, and then
// the tenths — so this one is taken exact, and the chapter says so on the screen.
function hAnswers3() {
  const m = {};
  AREAS.forEach(A => { const g = hNums(A).s2; m[A] = g - lErr(A, g); });
  return m;
}

// ---- PART H: do it again -------------------------------------------------
// Round 2, and the whole point is that it is round 1 AGAIN rather than a new trick. One
// thing changes: our answer is too big, so instead of growing a guess we shave one. The L
// we take off is two strips that run the whole length of the square, so they OVERLAP in
// the corner and count it twice — where round 1's corner was counted none and had to be
// added. Forget the corner, exactly as before, and the arithmetic comes out positive
// throughout. That is CHAPTER3_PLAN.md §7's whole argument for shaving rather than writing
// a negative number (D1), and it is why the second pass feels like the first.
function hIntro() {
  clearGame();
  showEliel();
  const A0 = FIELD.A, H0 = hNums(A0);
  const frame = lab => {
    clearGame();
    showEliel();
    gameArea.appendChild(hFrameEl(A0, lab));
  };
  frame(null);
  // ⚠️ The SECOND field says so (Sylvain). The screen is otherwise word for word the one the
  // child has already seen, and arriving at an identical page with no acknowledgement reads as
  // having gone backwards rather than as starting again on a new field.
  const again = A0 !== G_BAD[0];
  storyHTML(
    '<div class="speaker">Eliel</div>' +
    (again ? '<p>' + t('c3_h_in_again', { eq: bold('a = ' + A0) }) + '</p>' : '') +
    '<p' + (again ? ' style="margin-top:10px"' : '') + '>' +
      // ⚠️ Named only where the name is not already on the screen: the second field's own
      // lead-in (`c3_h_in_again`) says "the a = 8 field" one line above.
      t(again ? 'c3_h_in1b' : 'c3_h_in1', {
        eq: bold('a = ' + A0), sqrt_a: bold(sqrtHTML(FIELD.A)),
        d: bold('d'), dtil: bold(DTIL),
      }) + '</p>' +
    // ⚠️ `e`, not `ẽ`. This is the TRUE difference — the one the picture actually shows,
    // between our square's edge and the field's. `ẽ` is a different number and it is born
    // two screens later, the moment the corner is crossed out, exactly as `d̃` was born out
    // of `d` in Part C. Naming the drawn gap `ẽ` would be the d-versus-d̃ conflation all
    // over again, one round on.
    '<p style="margin-top:10px">' + t('c3_h_in2', {
      stil: bold(SUB1 + ' = ' + fmtNum(H0.g)), s1: bold(SUB1), ss: bold('s'), e: bold(E1()),
      // ⚠️ `s̃₁ = s + e`, not `s = s̃₁ − e`: the picture shows the big square holding the
      // field PLUS the band, so this way round is reading the picture rather than
      // rearranging it.
      eq: bold(nw(SUB1 + ' = s + ' + E1())),
    }) + '</p>'
  );
  // THE BAND IS COMPUTED, NOT ANNOUNCED (Sylvain). Two questions the child can answer with
  // what is already on the screen — the square of our answer, and Marimon's own number —
  // and between them they say how much ground we are over by. That is what makes the whole
  // of Part H possible: the error is not a vague "a bit too big", it is a number we hold.
  addButton(t('btn_continue'), () => {
    frame(null);
    askWithLead(
      t('c3_h_q1_lead', { stil: bold(SUB1 + ' = ' + fmtNum(H0.g)) }),
      t('c3_h_q1', { eq: bold(nw(fmtNum(H0.g) + ' &times; ' + fmtNum(H0.g))) }),
      H0.g * H0.g,
      () => {
        frame(t('c3_h_band_q'));
        askWithLead(
          t('c3_h_q2_lead', { eq: hSqEq(H0.g), a: bold(nw('a = ' + A0)),
              rt: bold(sqrtHTML(A0)) }),
          t('c3_h_q2', { eq: hExcessEq(H0.g, A0) }), H0.exc,
          () => {
            frame(t('c3_h_band'));
            storyHTML(
              '<div class="speaker">Eliel</div>' +
              '<p>' + t('c3_h_q2_ok', {
                dsq: bold(nw(DTIL + ' &times; ' + DTIL)), dtil: bold(DTIL), d: bold('d'),
              }) + '</p>' +
              '<p style="margin-top:10px">' + t('c3_h_q2_ok2', {
                e: bold(E1()), approx: bold(nw(ET1() + ' &asymp; ' + E1())),
              }) + '</p>'
            );
            addButton(t('c3_h_in_yes'), nextStep);
            addButton(t('c3_h_in_no'), nextStep);
          }, t('c3_h_q2_hint'));
      }, t('c3_h_q1_hint', { g: fmtNum(H0.g) }));
  });
}

// The two strips, one at a time — and then together, which is the only screen that
// matters: the little corner is in BOTH of them.
function hStrips() {
  const A = FIELD.A, H = hNums(A);
  // ⚠️ The square is cut at our new answer, which is precisely what we are trying to find
  // — so the piece that will become it carries a "?" and not its number. The shave is a
  // LETTER at this point, exactly as `d` was in Part B: drawn, named, not yet counted.
  // ⚠️ Split where the TRUE field ends, not at our new answer — this screen is still
  // looking at the band between our square and the field, and the new answer does not
  // exist yet. The two cuts are 1.4px apart at this scale, and the difference between them
  // IS the approximation, which arrives on the next screen.
  // ⚠️ THE FIELD IS TAKEN OFF, not merely dimmed (Sylvain). The screen before this one
  // subtracted it — `ã₁ − a` — and this one says "let us look at that band on its own", so the
  // ground it leaves has to be bare. That is Part C's own idiom (`cTakeOff` lifts the four
  // magic squares off and leaves the hole showing, dashed), and it is what makes the band the
  // subject of the picture rather than a rim round a field that is still there.
  const sq = f => squareSplitEl({
    side: H.g, split: Math.sqrt(A), cut: true, focus: f, off: 'a',
    brackets: { lo: bold('s'), hi: bold(E1()), both: true,
                whole: bold(SUB1 + ' = ' + fmtNum(H.g)) },
  });
  const show = (f, key, btn, next) => {
    clearGame();
    showEliel();
    gameArea.appendChild(sq(f));
    storyHTML('<div class="speaker">Eliel</div><p>' +
      t(key, {
        e: bold(E1()), g: bold(fmtNum(H.g)), stil: bold(SUB1),
        area: bold(nw(SUB1 + ' &times; ' + E1())),
      }) + '</p>');
    addButton(t(btn), next);
  };
  show(null, 'c3_h_st1', 'c3_h_st_btn1', () =>
    show(['b', 'd'], 'c3_h_st2', 'c3_h_st_btn2', () =>
      show(['c', 'd'], 'c3_h_st3', 'c3_h_st_btn3', () => {
        clearGame();
        showEliel();
        gameArea.appendChild(sq(['b', 'c', 'd']));
        askInline(t('c3_h_st_q'), 2, () => {
          clearGame();
          showEliel();
          gameArea.appendChild(sq('d'));
          storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_st_ok') + '</p>');
          addButton(t('btn_continue'), nextStep);
        }, t('c3_h_st_hint'));
      })));
}

// Forget the corner — the same decision as Part C, and this time it comes off instead of
// going on. What is left is a sharing the child has done eight times in Part F, and on
// this field it is Part D's own sum down to the number.
function hForget() {
  const A = FIELD.A, H = hNums(A);
  // THE EQUATION IS LAID OUT AS GROUND BEFORE IT IS PILED (Sylvain), exactly as Part C's
  // cJoin does: the band flat, the corner crossed off it, and only then the strips stacked.
  // It is what makes the area line something to read off the picture rather than to accept
  // — and it is what makes replacing `e` by `ẽ` a thing that HAPPENS on screen.
  const show = (dropped, key, btn, vars, next) => {
    clearGame();
    showEliel();
    gameArea.appendChild(hUnrolledEl(A, dropped));
    storyHTML('<div class="speaker">Eliel</div><p>' + t(key, vars) + '</p>');
    addButton(t(btn), next);
  };
  show('full', 'c3_h_fg_lay', 'c3_h_fg_btn1', {
    area: bold(nw(SUB1 + ' &times; ' + E1())), e: bold(E1()),
  }, () => show('approx', 'c3_h_fg_approx', 'c3_h_fg_btn_fix', {
    area: bold(nw(SUB1 + ' &times; ' + E1())), e: bold(E1()),
    esq: bold(nw(E1() + ' &times; ' + E1())),
  }, () => show('tilde', 'c3_h_fg1', 'btn_continue', {
    e: bold(E1()), etil: bold(ET1()), s2: bold(SUB2),
    // ⚠️ Stated the way the picture states it — s̃₁ holds the field plus the band — and s̃₂ is
    // DEFINED as the number that makes the line exact again, which is the same move ẽ itself
    // was born by, one level up.
    eq_true: bold(nw(SUB1 + ' = s + ' + E1())),
    eq_new: bold(nw(SUB1 + ' &asymp; s + ' + ET1())),
    eq_def: bold(nw(SUB1 + ' = ' + SUB2 + ' + ' + ET1())),
  // ⚠️ On the third field this screen's button IS the hand-off — it must not add a second one
  // underneath itself. (It did, and the drive spun: `show` leaves its own button up, so the
  // callback has to replace the screen rather than append to it. The same trap askAfterButton
  // exists for, arriving through a different door.)
  }, () => show('tilde', 'c3_h_fg1b',
    H.exc === 1 ? 'c3_h_fg_btn2' : 'btn_continue', {
    e: bold(E1()), etil: bold(ET1()), esq: bold(nw(E1() + ' &times; ' + E1())),
    stil: bold(SUB1 + ' = ' + fmtNum(H.g)), s2: bold(SUB2),
  }, H.exc !== 1 ? nextStep : () => {
    // THE PILE IS READ, NOT ASSERTED (Sylvain). Every layer wears its own `ẽ` and the
    // magic square wears its side, so the three questions can be answered off the picture
    // in order: how many are piled up, how tall the pile therefore is, and only then how
    // big one of them is. The last one used to be the only one, and it asked the child to
    // do the whole division in their head.
    // ⚠️ THE THIRD FIELD PILES IN A STEP OF ITS OWN, so hForget never reaches here on it: the
    // count (5.6) has to be worked out first, which is hJoin's whole job.
    const pile = () => {
      clearGame();
      showEliel();
      gameArea.appendChild(fPileEl(H.k, H.exc, {
        layerLabel: bold(ET1()), rightLabel: bold(gLen(1)),
      }));
    };
    pile();
    askWithLead(
      t('c3_h_fg2', { k: H.k, g: bold(fmtNum(H.g)), e: bold(ET1()) }),
      t('c3_h_pile_q1', { e: bold(ET1()) }), H.k,
      () => {
        pile();
        askWithLead(t('c3_h_pile_ok1', { k: H.k, e: bold(ET1()) }),
          t('c3_h_pile_q2', { e: bold(nw(H.k + ' &times; ' + ET1())) }), 1,
          () => {
            pile();
            // ⚠️ Where the share does not come out even there is no number to ask for:
            // one of six equal shares of a magic length is not writable, and finding that
            // out is the area-8 field's whole job. It says so and hands on to the laying.
            if (!H.even) {
              storyHTML('<div class="speaker">Eliel</div>' +
                '<p>' + t('c3_h_pile_ok2', {
                  eq: bold(nw(H.k + ' &times; ' + ET1() + ' = ' + gLen(1))), k: H.k,
                }) + '</p>' +
                '<p style="margin-top:10px">' +
                  t('c3_h_ag_never', { k: H.k, e: bold(ET1()) }) + '</p>');
              addButton(t('btn_continue'), nextStep);
              return;
            }
            askWithLead(
              t('c3_h_pile_ok2', {
                eq: bold(nw(H.k + ' &times; ' + ET1() + ' = ' + gLen(1))), k: H.k,
              }),
              t('c3_h_fg_q', { e: bold(ET1()) }), H.exact,
              () => {
                pile();
                storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_fg_ok', {
                  e: bold(ET1() + ' = ' + fmtNum(H.exact)), k: H.k,
                }) + '</p>');
                addButton(t('btn_continue'), nextStep);
              }, t('c3_h_fg_hint', { k: H.k }), { decimal: true });
          }, t('c3_h_pile_h2'));
      }, t('c3_h_pile_h1'));
  }))));
}
// 2 − 0.25, done on the ground (Sylvain). The one piece of arithmetic in Part H a child
// could stall on, and the road between quarters and decimals is worth walking rather than
// being told: shave a quarter off eight of them, count seven, find the whole magic length
// hiding in four of those, and be left with three quarters.

  const A = FIELD.A, H = hNums(A), per = Math.round(1 / H.written);
  const line = st => {

}

// Three quarters into a decimal, through hundredths — where they are whole numbers and the

  const A = FIELD.A, H = hNums(A), per = Math.round(1 / H.written);
  const three = H.g * per - 1 - per;                 // 3 quarters

          askWithLead(t('c3_h_75_ok2', { c: 3 * cent }),
            t('c3_h_75_q3', { n: three }), three * H.written, () => {

            }, t('c3_h_75_h3', { c: 3 * cent }), { decimal: true });

function hAnswer() {
  const A = FIELD.A, H = hNums(A);
  // Both pieces say what they ARE, not just what they measure (Sylvain): the shave wears
  // `ẽ = 0.25`, and what is left wears `s̃₂` — our SECOND answer, which is the notation the
  // ending needs anyway (`we could do it again` means another s̃ after this one).
  const sq = lo => squareSplitEl({
    side: H.g, split: H.s2, cut: true, focus: 'a',
    brackets: { lo: bold(SUB2 + ' = ' + lo),
                hi: bold(ET1() + ' = ' + fmtNum(H.written)), both: true, outer: 134,
                whole: bold(SUB1 + ' = ' + fmtNum(H.g)) },
  });
  clearGame();
  showEliel();
  gameArea.appendChild(sq('?'));
  // ⚠️ Generic, and it has to be: s̃₂ = (s̃ − 1) + (1 − ẽ) on ANY field. The area-3 field's
  // 1 + 0.75 came off the quarter line; the area-8 field's 2 + 0.84 comes off the hundredths.
  // The assembly is the same either way.
  // ⚠️ The whole magic lengths we leave alone, and what is left of the LAST piece — which
  // is a whole magic length on the first two fields and 0.75 of one on the area-7 field.
  const whole = Math.ceil(H.g) - 1;
  const frac = Math.round((H.g - whole - H.written) * 100) / 100;
  const q = bold(nw(whole + ' + ' + fmtNum(frac)));
  askWithLead(
    t('c3_h_an1', {
      e: bold(ET1() + ' = ' + fmtNum(H.written)), s2: bold(SUB2),
      len: bold(gLen(whole)), d: bold(fmtNum(frac)), g: bold(fmtNum(H.g)),
    }),
    t('c3_h_an_q', { eq: q }), H.s2,
    () => {
      clearGame();
      showEliel();
      gameArea.appendChild(sq(fmtNum(H.s2)));
      storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_an_ok', {
        sqrt_a: bold(sqrtHTML(A)), s: bold(fmtNum(H.s2)), old: bold(fmtNum(H.g)),
      }) + '</p>');
      addButton(t('btn_continue'), nextStep);
    }, t('c3_h_an_hint', { len: bold(gLen(whole)), d: bold(fmtNum(frac)) }), { decimal: true });
}

// Part G's rule, applied to the new answer — and it holds word for word, with e~ where d~
// was: (g − e~)² = a + e~ × e~, exactly. So the corner is still the whole of the error, and
// the child can see how much smaller it has become.
// THE CHECK, ON THE SAME PICTURE AS THE OPENING (Sylvain) — our new answer's square drawn
// round the field exactly as our first one was, so the two bands can be compared by looking.
// ⚠️ And the check cannot be run the way hIntro ran it: nobody can square 1.75 in their
// head. That is what Part G's rule is FOR — the band is always the corner we forgot, and
// this time the corner we forgot was e~ x e~. So the rule earns its keep here rather than
// being recited.
// THE CORNER, COUNTED BY DISTRIBUTIVITY (Sylvain) — not read off by eye. `e~` is a tenth and
// five hundredths, so the little square it leaves comes apart exactly as every square in this
// trilogy comes apart:
//     0.15 × 0.15 = 0.1×0.1 + 0.1×0.05 + 0.05×0.1 + 0.05×0.05
// and each of those four pieces is something the child can name in Marimon's own flower
// squares: one whole one, two halves (which fit together into a second, once one of them is
// turned), and a quarter — which is the very number Part D wrote for a quarter. 2.25 flower
// squares, and then the dot moves two places to come back to magic squares.
//
// ⚠️ The 0.1 × 0.1 piece is laid IN THE CORNER of the magic square, so it lands exactly on one
// of the flower squares ruled underneath it. That is what makes the count a reading of the
// picture rather than an assertion about it.
const FCT = 340;                            // the magic square, on this screen's own scale
// ⚠️ THE BIG PIECE CANNOT BE GREEN HERE. `REG.a.fill` is `#d4edda`, which is exactly the colour
// of the magic square this corner is laid ON — so the 0.1 × 0.1 piece was invisible, on the one
// screen whose whole job is counting it. The block-is-green convention carries no meaning on
// this picture anyway (the square being cut is the error, not the field), so that one piece
// takes a colour of its own and the other three keep the chapter's.
const FREG = { a: { fill: '#efe3f7', ink: '#7a4fa3' }, b: REG.b, c: REG.c, d: REG.d };
function hFlowerCornerEl(o) {
  const q = o || {}, C = FCT / FLOWERN, HALF = C / 2;
  const lit = q.focus == null ? null : (Array.isArray(q.focus) ? q.focus : [q.focus]);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; margin:18px auto 0; width:' + FCT + 'px;' +
    'height:' + FCT + 'px; display:grid; background:#d4edda;' +
    'grid-template-columns:repeat(' + FLOWERN + ',' + C + 'px);' +
    'grid-template-rows:repeat(' + FLOWERN + ',' + C + 'px);' + EDGE;
  for (let i = 0; i < FLOWERN * FLOWERN; i++) {
    const c = document.createElement('div');
    c.style.cssText = 'position:relative; box-sizing:border-box; width:' + C + 'px;' +
      'height:' + C + 'px; border:1px solid #8aba8a;';
    wrap.appendChild(c);
  }
  const put = (k, x, y, w, h) => {
    const on = lit == null || lit.indexOf(k) >= 0;
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute; left:' + x + 'px; top:' + y + 'px;' +
      'width:' + w + 'px; height:' + h + 'px; box-sizing:border-box;' +
      'background:' + FREG[k].fill + '; outline:2px solid ' + FREG[k].ink + ';' +
      // ⚠️ 0.25 was invisible on fills this pale — a dimmed piece has to still be a piece,
      // or the child cannot see what the lit one is being compared with.
      'outline-offset:-1px;' + (on ? '' : 'opacity:0.45;');
    wrap.appendChild(d);
    return d;
  };
  const X = FCT - C, X2 = FCT - C - HALF;
  if (!q.cut) {
    // ⚠️ z-index:-1 is wrong here for the same reason it was wrong on quarterGridEl: the
    // wrap is no stacking context. The cells are positioned instead, so DOM order decides
    // and the rules paint over the patch — which is how its pieces stay countable.
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute; left:' + X2 + 'px; top:0;' +
      'width:' + (C + HALF) + 'px; height:' + (C + HALF) + 'px; box-sizing:border-box;' +
      'background:' + REG.d.fill + '; outline:2.5px solid ' + REG.d.ink + ';' +
      'outline-offset:-2px;';
    wrap.insertBefore(d, wrap.firstChild);
    return wrap;
  }
  put('a', X, 0, C, C);                                  // 0.1 × 0.1 — one flower square
  put('b', X2, 0, HALF, C);                              // 0.1 × 0.05 — half of one
  // ⚠️ Turned, and moved up alongside its twin (Sylvain): the two halves are only visibly ONE
  // flower square once one of them has been stood on end and fitted against the other.
  // ⚠️ Immediately LEFT of its twin, so the two of them land exactly on one flower square of
  // the grid underneath — which is the whole claim. A gap between them and the pair is just
  // two halves near each other.
  if (q.joined) put('c', X2 - HALF, 0, HALF, C);
  else put('c', X, C, C, HALF);                          // 0.05 × 0.1 — the other half
  put('d', X2, C, HALF, HALF);                           // 0.05 × 0.05 — a quarter of one
  return wrap;
}

// The corner's OWN four-way cut, one scale down: `0.32 × 0.32` of a magic square is
// `3.2 × 3.2` flower squares, and 3.2 comes apart into 3 + 0.2 exactly as 3.32 came apart
// into 3 + 0.32. The same picture, the same four pieces, the same colours — which is the
// point: it is not a new method, it is this one again on smaller ground.
function hNestEl(f) {
  const n = Math.floor(f + 1e-9), d = Math.round((f - n) * 100) / 100;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:10px;';
  wrap.appendChild(squareSplitEl({
    side: f, split: n, cut: true,
    brackets: { lo: fmtNum(n), hi: bold(fmtNum(d)), both: true,
                whole: bold(fmtNum(f)) },
  }));
  // ⚠️ THE IDENTITY ON ONE LINE, AND EACH TERM'S VALUE UNDER THE TERM (Sylvain). Written as
  // `3 × 3 = 9 + 2 × 3 × 0.2 = 1.2 + …` it puts two different levels of `=` on one line — the
  // products' own, and the sum's — which is unreadable. The values go BELOW, so the only `=`
  // signs on the line are the identity's.
  const head = document.createElement('div');
  head.innerHTML = bold(nw(fmtNum(f) + ' &times; ' + fmtNum(f))) + ' = ' +
    bold(nw('(' + fmtNum(n) + ' + ' + fmtNum(d) + ') &times; (' +
            fmtNum(n) + ' + ' + fmtNum(d) + ')')) + ' =';
  head.style.cssText = 'font-size:16px; color:#5a5240; text-align:center;';
  wrap.appendChild(head);
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-start; gap:8px;';
  const term = (html, val, col) => {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px;';
    const p1 = document.createElement('div');
    p1.innerHTML = bold(nw(html));
    p1.style.cssText = 'font-size:16px; color:' + col + '; white-space:nowrap;';
    const p2 = document.createElement('div');
    p2.innerHTML = bold(fmtNum(val));
    p2.style.cssText = 'font-size:16px; color:' + col + ';';
    c.appendChild(p1);
    c.appendChild(p2);
    return c;
  };
  // ⚠️ THE SIGNS (Sylvain): a `+` on BOTH lines, because both are sums — the products line is
  // the expansion, the values line is the addition the child is about to do. The `=` closes
  // the PRODUCTS line only, handing off to the values below it; the values line ends bare,
  // because its total is what the question is asking for.
  // Built as two-line columns with the cell left blank where a sign is not wanted, so
  // everything aligns by construction rather than by a hand-tuned margin.
  const sign = (top, bot) => {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px;';
    [top, bot].forEach(g => {
      const l = document.createElement('div');
      l.innerHTML = g || '&nbsp;';
      l.style.cssText = 'font-size:16px; color:#5a5240;';
      c.appendChild(l);
    });
    return c;
  };
  row.appendChild(term(fmtNum(n) + ' &times; ' + fmtNum(n), n * n, REG.a.ink));
  row.appendChild(sign('+', '+'));
  row.appendChild(term('2 &times; ' + fmtNum(n) + ' &times; ' + fmtNum(d),
                       Math.round(2 * n * d * 100) / 100, REG.b.ink));
  row.appendChild(sign('+', '+'));
  row.appendChild(term(fmtNum(d) + ' &times; ' + fmtNum(d),
                       Math.round(d * d * 100) / 100, REG.d.ink));
  row.appendChild(sign('=', ''));
  wrap.appendChild(row);
  return wrap;
}

function hCheck() {
  const A = FIELD.A, H = hNums(A);
  // ⚠️ THE BAND ROUND 2 LEAVES IS THE CORNER **ONLY WHERE THE SHAVE CAME OUT EXACT** (Sylvain).
  // Where it was truncated the band is corner + what stopping short cost — 0.0656 against the
  // 0.0256 corner on the area-8 field, 0.0224 against 0.0064 on the area-11 one. Four sentences
  // in this step claimed otherwise, two of them naming "a thirty-sixth" as the size of a band
  // 2.4 times bigger. `b2` is the real thing, and every closing number now comes off it.
  const b2 = Math.round((H.s2 * H.s2 - A) * 10000) / 10000;
  const b2fs = Math.round(b2 * 10000) / 100;          // ...in flower squares
  const frame = band => {
    clearGame();
    showEliel();
    gameArea.appendChild(hFrameEl(A, { round2: true, band: band }));
  };
  frame(null);
  storyHTML(
    '<div class="speaker">Eliel</div>' +
    '<p>' + t('c3_h_ck_a1', {
      s2: bold(SUB2 + ' = ' + fmtNum(H.s2)), sqrt_a: bold(sqrtHTML(A)),
    }) + '</p>' +
    '<p style="margin-top:10px">' + t('c3_h_ck_a2') + '</p>'
  );
  addButton(t('btn_continue'), () => {
    frame(t('c3_h_band_q'));
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      // ⚠️ The third field never worked its band out by squaring — nobody can square 2.75
      // — so it cannot be reminded that it did. It read the band off Part G's rule, which
      // is the very rule this screen is about to use again.
      '<p>' + t(Number.isInteger(H.g) ? 'c3_h_ck_a3' : 'c3_h_ck_a3b', {
        g: bold(fmtNum(H.g)), a: A, sq: H.g * H.g, exc: fmtNum(H.exc),
        s2: bold(fmtNum(H.s2)), dsq: bold(nw(DTIL + ' &times; ' + DTIL)),
      }) + '</p>' +
      '<p style="margin-top:10px">' + t(H.even ? 'c3_h_ck_a4' : 'c3_h_ck_a4b', {
        rule: bold(nw(SUB2 + ' &times; ' + SUB2 + ' = a + ' +
                      ET1() + ' &times; ' + ET1())),
        esq: bold(nw(fmtNum(H.written) + ' &times; ' + fmtNum(H.written))),
        // ⚠️ The band is the corner we ADDED, not the one we forgot — the same correction
        // gWrap needed for round 1, arriving one round on. `ẽ × ẽ` is there because our
        // answer overshoots s, and the sentence now says so.
        s2: bold(SUB2), ss: bold('s'),
      }) + '</p>'
    );
    addButton(t('c3_h_ck_btn'), () => {
      // ⚠️ FOUR ROUTES TO SIZING THE CORNER, and which one applies is a fact about the
      // field's own numbers rather than a choice. In the order the code tries them:
      //   e~ = 1/4        (area 3)  — a magic square ruled into quarters holds 16 of it
      //   2 x s~1 whole   (area 8)  — e~ is one of k equal shares, so k x k of it, 36
      //   e~ < 0.1        (area 11) — smaller than a flower square, so counted INSIDE one:
      //                               8 x 8 = 64 of the hundredth-squares a flower square holds
      //   otherwise       (area 7)  — distributivity, four pieces on a flower-square grid
      // (Four stale comments used to stand here, each describing a design that had been
      // replaced — including one claiming a shave stopped at a tenth, which no field has.)
      if (!hIsQuarter(H)) {
        // ⚠️ WHERE THE DENOMINATOR COMES FROM depends on the field, and the difference is
        // worth having. The area-8 field's shave is one of the SIX equal shares the pile
        // showed, so its corner is a sixth by a sixth and a magic square holds 36. The
        // area-7 field's is not a share at all — it was measured, and it stopped at exactly
        // one tenth — so its corner is a tenth by a tenth, which is Chapter 2's own flower
        // square, a hundred to a magic square. Same screen, and on that field the answer is
        // a fact the child already owns rather than a new count.
        // ⚠️ TWO WAYS TO SIZE A CORNER THAT IS NOT A QUARTER, and which one applies is a
        // fact about the field rather than a choice. Where e~ is one of k equal shares of a
        // magic length — the area-8 field's sixth — a magic square ruled k by k holds k²
        // of the corner, and the pile has already told the child what k is. Where it is
        // not a share at all — the area-7 field's 0.15, which was MEASURED — the corner is
        // one flower square and a half each way, so it is counted in Chapter 2's own unit:
        // one whole one, two halves and a quarter. That is Part E's halving, at a new size.
        // ⚠️ The pile came to ONE magic length only where the band is one magic square —
        // `k` being whole is not enough. The area-6 field has k = 5 and a band of 0.25, so
        // `5 × ẽ = 0.25`, and this route would have called ẽ a fifth of a magic length.
        const share = Number.isInteger(H.k) && H.exc === 1;
        // the tail both routes share: the band named, the field's own area asked for, then
        // the two errors side by side
        const afterCorner = (bandKey, vars, lead) => {
          frame(t(bandKey, vars));
          askWithLead(lead, t('c3_h_ck_q2', {
            eq: bold(nw(SUB2 + ' &times; ' + SUB2)),
          }), A, () => {
            clearGame();
            showEliel();
            gameArea.appendChild(hBeforeAfterEl(A));
            storyHTML('<div class="speaker">Eliel</div><p>' +
              t('c3_h_ck3_fl', vars) + '</p>');
            addButton(t('btn_continue'), nextStep);
          }, t('c3_h_ck_h2'));
        };
        if (share) {
          // the area-8 field: e~ is one of k equal shares of a magic length, so a magic square
          // ruled k by k holds k² of the corner and the pile has already said what k is
          clearGame();
          showEliel();
          gameArea.appendChild(quarterGridEl(true, H.k * H.k - 1, H.k));
          askWithLead(
            t('c3_h_ck_odd', {
              esq: bold(nw(fmtNum(H.written) + ' &times; ' + fmtNum(H.written))),
              etil: bold(ET1()), k: H.k,
              eq6: bold(nw(H.k + ' &times; ' + ET1() + ' = ' + gLen(1))),
            }),
            t('c3_h_ck_odd_q'), H.k * H.k, () => {
              afterCorner('c3_h_band_fl', { n: fmtNum(b2fs), before: 100 },
                t('c3_h_ck_odd_ok', { n: H.k * H.k, ew: bold(fmtNum(H.written)),
                                      band: bold(fmtNum(b2)) }));
            }, t('c3_h_ck_odd_h', { k: H.k }));
          return;
        }
        // ⚠️ AND WHERE THE CORNER IS SMALLER THAN A FLOWER SQUARE it is counted inside one.
        // The area-11 field's e~ is 0.08 — eight hundredths of a magic length — so the little
        // square is 8 by 8 of the hundredth-squares that a flower square holds a hundred of.
        // `8 × 8 = 64` is Chapter 1's table, `0.64` of a flower square follows, and the dot
        // then moves two places to magic squares, exactly as everywhere else.
        const sub = Math.round(H.written * 100);
        if (sub < 10 && H.even) {
          const gridSub = () => {
            clearGame();
            showEliel();
            gameArea.appendChild(quarterGridEl(false, null, FLOWERN, sub, FCT));
          };
          gridSub();
          askWithLead(t('c3_h_sub1', {
            esq: bold(nw(fmtNum(H.written) + ' &times; ' + fmtNum(H.written))),
            e2: bold(sub + ''), eq: bold(nw(sub + ' &times; ' + sub)),
          }), t('c3_h_sub_q1'), sub * sub, () => {
            gridSub();
            const fsq = Math.round(sub * sub) / 100;
            askWithLead(t('c3_h_sub_ok1', { n: bold(sub * sub + '') }),
              t('c3_h_sub_q2'), fsq, () => {
                gridSub();
                askWithLead(t('c3_h_sub_ok2', { n: bold(fmtNum(fsq)) }),
                  t('c3_h_sub_q3'), Math.round(sub * sub) / 10000, () => {
                    afterCorner('c3_h_band_fl', {
                      n: fmtNum(b2fs),
                      before: Math.round(H.exc * FLOWERN * FLOWERN / 100),
                    }, t(H.even ? 'c3_h_fl_ok' : 'c3_h_fl_ok2', {
                      n: bold(fmtNum(Math.round(sub * sub) / 10000)),
                      band: bold(fmtNum(b2)) }));
                  }, t('c3_h_fl_h5'), { decimal: true });
              }, t('c3_h_sub_h2'), { decimal: true });
          }, t('c3_h_sub_h1', { n: sub }));
          return;
        }
        // ⚠️ AND WHERE THE SHAVE WAS TRUNCATED THE SQUARE IS WORKED OUT IN FULL (Sylvain).
        // On those fields the band is NOT the corner, so the rule cannot give it — the answer
        // has to be squared. `s̃₂ = 3.32` cuts into `3 + 0.32`, and the whole check runs in
        // FLOWER SQUARES, where the numbers come out whole: 900 + 192 + 10.24 = 1102.24
        // against the field's 1100, so the band is 2.24. The corner needs its own four-way cut
        // (`3.2 × 3.2`), which is the chapter's method used twice over rather than a new one.
        // ⚠️ Written as a FLAT list of beats rather than nested callbacks — six of those in a
        // row is where the last paren goes missing.
        if (!H.even && sub < 10) {
          const n = FIELD.n, dd = Math.round((H.s2 - n) * 100) / 100;   // 3 and 0.32
          const FS = 100;                                  // flower squares to a magic square
          const blk = n * n * FS, one = Math.round(n * dd * FS), str = 2 * one;
          const cor = Math.round(dd * dd * FS * 100) / 100;
          const tot = Math.round((blk + str + cor) * 100) / 100;
          const sq = f => squareSplitEl({
            side: H.s2, split: n, cut: true, focus: f, stripTicks: true,
            brackets: { lo: fmtNum(n), hi: bold(fmtNum(dd)), both: true,
                        whole: bold(SUB2 + ' = ' + fmtNum(H.s2)) },
          });
          const tm = (x, y) => bold(nw(fmtNum(x) + ' &times; ' + fmtNum(y)));
          const fl = Math.round(dd * 10 * 100) / 100;       // 0.32 in flower-square sides: 3.2
          const beats = [
            { el: () => sq('a'),
              lead: t('c3_h_sq_b1', { eq: tm(n, n), sq: n * n }),
              q: t('c3_h_sq_bq', { eq: bold(nw(n * n + ' &times; 100')) }), a: blk,
              hint: t('c3_h_sq_bh', { sq: n * n }),
              ok: t('c3_h_sq_bok', { v: bold(blk + '') }) },
            { el: () => sq(['b', 'c']),
              lead: t('c3_h_sq_s1', { n: n, d: bold(fmtNum(dd)), one: bold(one + '') }),
              q: t('c3_h_sq_sq', { eq: bold(nw('2 &times; ' + one)) }), a: str,
              hint: t('c3_h_sq_sh', { a: n, b: Math.round(dd * 100), c: one }),
              ok: t('c3_h_sq_sok', { v: bold(str + '') }) },
            { el: () => hNestEl(fl),
              lead: t('c3_h_sq_c1', { eq: tm(dd, dd), f: bold(fmtNum(fl)) }),
              q: t('c3_h_sq_cq', { eq: bold(nw(fmtNum(fl) + ' &times; ' + fmtNum(fl))) }),
              a: cor, hint: t('c3_h_sq_ch'), dec: true,
              ok: t('c3_h_sq_cok', { v: bold(fmtNum(cor)) }) },
            { el: () => sq(null),
              lead: t('c3_h_sq_t1', { b: bold(blk + ''), s: bold(str + ''),
                                      c: bold(fmtNum(cor)) }),
              q: t('c3_h_sq_tq', { eq: bold(nw(blk + ' + ' + str + ' + ' + fmtNum(cor))) }),
              a: tot, hint: t('c3_h_sq_th'), dec: true,
              ok: t('c3_h_sq_tok', { v: bold(fmtNum(tot)) }) },
            { el: () => hFrameEl(A, { round2: true, band: t('c3_h_band_q') }),
              okEl: () => hFrameEl(A, { round2: true,
                                        band: t('c3_h_band_v2', { v: fmtNum(b2fs) }) }),
              lead: t('c3_h_sq_d1', { a: A, fs: bold(A * FS + ''), tot: bold(fmtNum(tot)) }),
              q: t('c3_h_sq_dq', { eq: bold(nw(fmtNum(tot) + ' &minus; ' + A * FS)) }),
              a: b2fs, hint: t('c3_h_sq_dh'), dec: true,
              ok: t('c3_h_sq_dok', { n: bold(fmtNum(b2fs)), m: bold(fmtNum(b2)) }) },
          ];
          const run = i => {
            const B = beats[i];
            if (!B) {
              clearGame();
              showEliel();
              gameArea.appendChild(hBeforeAfterEl(A));
              storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_ck3_fl', {
                n: fmtNum(b2fs), before: Math.round(H.exc * FS),
              }) + '</p>');
              addButton(t('btn_continue'), nextStep);
              return;
            }
            clearGame();
            showEliel();
            gameArea.appendChild(B.el());
            askWithLead(B.lead, B.q, B.a, () => {
              clearGame();
              showEliel();
              gameArea.appendChild((B.okEl || B.el)());
              storyHTML('<div class="speaker">Eliel</div><p>' + B.ok + '</p>');
              addButton(t('btn_continue'), () => run(i + 1));
            }, B.hint, B.dec ? { decimal: true } : undefined);
          };
          clearGame();
          showEliel();
          gameArea.appendChild(sq(null));
          storyHTML('<div class="speaker">Eliel</div>' +
            '<p>' + t('c3_h_sq1', {
              s2: bold(SUB2 + ' = ' + fmtNum(H.s2)),
              eq: bold(nw(fmtNum(H.s2) + ' = ' + n + ' + ' + fmtNum(dd))),
            }) + '</p>' +
            '<p style="margin-top:10px">' + t('c3_h_sq2') + '</p>');
          addButton(t('c3_h_7_btn'), () => run(0));
          return;
        }
        // ⚠️ THE AREA-7 FIELD COUNTS ITS CORNER BY DISTRIBUTIVITY (Sylvain), piece by piece.
        // Reading "one whole one, two halves and a quarter" off the picture was a count by
        // eye; this is the identity Chapter 2 built, used at the smallest scale in the trilogy.
        const T = fmtNum(0.1), F = fmtNum(0.05);
        const pic = o => {
          clearGame();
          showEliel();
          gameArea.appendChild(hFlowerCornerEl(o));
        };
        const term = (x, y) => bold(nw(fmtNum(x) + ' &times; ' + fmtNum(y)));
        pic({});
        storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_fl1', {
          esq: bold(nw(fmtNum(H.written) + ' &times; ' + fmtNum(H.written))),
          split: bold(nw(fmtNum(H.written) + ' = ' + T + ' + ' + F)),
          eq: bold(nw(term(0.1, 0.1) + ' + ' + term(0.1, 0.05) + ' + ' +
                      term(0.05, 0.1) + ' + ' + term(0.05, 0.05))),
        }) + '</p>');
        addButton(t('c3_h_fl_btn'), () => {
          pic({ cut: true, focus: 'a' });
          askWithLead(t('c3_h_fl2', { eq: term(0.1, 0.1) }), t('c3_h_fl_q1'), 1, () => {
            pic({ cut: true, focus: ['b', 'c'] });
            storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_fl3', {
              e1: term(0.1, 0.05), e2: term(0.05, 0.1),
            }) + '</p>');
            addButton(t('c3_h_fl_btn2'), () => {
              pic({ cut: true, joined: true, focus: ['b', 'c'] });
              askWithLead(t('c3_h_fl4'), t('c3_h_fl_q2'), 1, () => {
                pic({ cut: true, joined: true, focus: 'd' });
                askWithLead(t('c3_h_fl5', { eq: term(0.05, 0.05) }),
                  t('c3_h_fl_q3'), 0.25, () => {
                    pic({ cut: true, joined: true });
                    askWithLead(t('c3_h_fl6'),
                      t('c3_h_fl_q4', { sum: bold(nw('1 + 1 + ' + fmtNum(0.25))) }),
                      2.25, () => {
                        pic({ cut: true, joined: true });
                        askWithLead(t('c3_h_fl7', { n: bold(fmtNum(2.25)) }),
                          t('c3_h_fl_q5'), 0.0225, () => {
                            afterCorner('c3_h_band_fl', {
                              n: fmtNum(b2fs),
                              before: Math.round(H.exc * FLOWERN * FLOWERN / 100),
                            }, t('c3_h_fl_ok', { n: bold(fmtNum(b2)) }));
                          }, t('c3_h_fl_h5'), { decimal: true });
                      }, t('c3_h_fl_h4'), { decimal: true });
                  }, t('c3_h_fl_h3'), { decimal: true });
              }, t('c3_h_fl_h2'));
            });
          }, t('c3_h_fl_h1'));
        });
        return;
      }
      clearGame();
      showEliel();
      gameArea.appendChild(quarterGridEl(true, QN * QN - 1));
      askWithLead(t('c3_h_ck1', { e: bold(fmtNum(H.written)) }),
        t('c3_h_ck_q'), QN * QN, () => {
          frame(t('c3_h_band_16'));
          // ⚠️ The answer is the FIELD's area — s̃₂² = a + ẽ², so the whole magic squares
          // before the sixteenth are Marimon's own number. Written as 1 first, which the
          // driver dutifully "answered"; only reading the trace caught it.
          askWithLead(t('c3_h_ck2', { a: A }), t('c3_h_ck_q2', {
            eq: bold(nw(SUB2 + ' &times; ' + SUB2)),
          }), A, () => {
            clearGame();
            showEliel();
            gameArea.appendChild(hBeforeAfterEl(A));
            storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_ck3') + '</p>');
            addButton(t('btn_continue'), nextStep);
          }, t('c3_h_ck_h2'));
        }, t('c3_h_ck_hint'));
    });
  });
}
// The second field, scaffolding off — and the one thing it has that the first has not:
// its shave never comes out even. So `≈` arrives again, and the rounding goes the OTHER
// way from Part F's.
// The share that never comes out even — the area-8 field's own beat, kept from the version
// that ran it on its own. Lay tenths along e~ and one fits; a second runs past. Then the
// hundredths, and we stop where we are.
// ⚠️ Laying TRUNCATES, and on a shave that is the safe direction — take less off and the
// answer stays above the truth. Part F had to add one more hundredth for the same reason,
// because there the piece was a SHARE being added on. Same argument, opposite rounding: it
// is the ANSWER that has to stay too big, never the piece.
function hLay() {
  const A = FIELD.A, H = hNums(A);
  clearGame();
  showEliel();
  // ⚠️ THE COUNTING GOES PAST THE TRUTH, in both units (Sylvain). The child lays tenths until
  // one runs straight past the end — that overshoot is how you find out how many FIT, and it
  // is Part A's own move at a new scale — then takes it back off and does the same with the
  // hundredths. Only then are they asked how many whole ones of each went down. Giving the
  // tray exactly the right number would have answered both questions before they were put.
  const TEN = QBAR * 0.1 / H.exact, HUND = TEN / 10;
  const bar = quarterLayEl({ label: bold(ET1()) });
  gameArea.appendChild(bar);
  const say = html => storyHTML('<div class="speaker">Eliel</div><p>' + html + '</p>');
  let phase = 0, unit = TEN, left = 10, key = 'c3_q_sup_tenths', fit = 0;
  bar.__tray(left, unit, key);
  bar.__hit(() => {
    if (left <= 0) return;
    const over = bar.__lay(unit);
    left--;
    if (!over) { fit++; bar.__tray(left, unit, key); return; }
    // it ran past. Leave it there to be looked at, and let the child take it off.
    // ⚠️ On the area-7 field the very FIRST hundredth runs past, so the count is zero and
    // the sentence has to say so — "we have gone as far as the hundredths will take us"
    // is true but reads as though some of them fitted.
    // ⚠️ On the area-11 field the very FIRST tenth runs past, so none of them fit at all —
    // and "one whole tenth is all that fits" would be a sentence about a piece that is not
    // there. The count decides the wording, never the field.
    say(t(phase === 0 ? (H.tenths ? 'c3_h_lay_over1' : 'c3_h_lay_over1b')
                      : 'c3_h_lay_over2', { e: bold(ET1()), t: H.tenths }));
    addButton(t('c3_h_lay_btn'), () => {
      buttonArea.innerHTML = '';
      bar.__undo(); left++;
      if (phase === 0) {
        phase = 1; unit = HUND; left = 10; key = 'c3_q_sup_hund'; fit = 0;
        bar.__tray(left, unit, key);
        say(t('c3_h_lay_mid'));
        return;
      }
      bar.__stripOff();
      askAfterButton(t('c3_h_lay_q', { e: bold(ET1()) }), H.tenths, () => {
        askAfterButton(t('c3_h_lay_q2'), H.hund, () => {
          clearGame();
          showEliel();
          gameArea.appendChild(bar);
          storyHTML('<div class="speaker">Eliel</div>' +
            // ⚠️ `≈` ONLY WHERE THE SHAVE WAS ROUNDED (Sylvain). The area-8 field's is a
            // sixth written 0.16, so it is about; the area-7 field's comes out EXACTLY at
            // 0.15, and writing `≈` there understates an answer we actually caught.
            '<p>' + t(H.tenths ? 'c3_h_lay_ok' : 'c3_h_lay_ok_t0', {
              t: H.tenths, h: H.hund, e: bold(ET1() + eSign(H) + fmtNum(H.written)),
            }) + '</p>' +
            '<p style="margin-top:10px">' +
              t(H.even ? 'c3_h_lay_stop0' : 'c3_h_lay_stop') + '</p>');
          addButton(t('btn_continue'), nextStep);
        }, t('c3_h_lay_h2'));
      }, t('c3_h_lay_hint'));
    });
  });
  say(t('c3_h_lay_go', { e: bold(ET1()) }));
}

// ...and then the subtraction, the same shape as the quarter line's: leave the whole magic
// lengths alone, take the shave out of the last one, and do THAT in hundredths, where it is
// a whole number. 100 − 16 = 84, so 0.84 — and the answer is the whole ones plus that.
function hHundredths() {
  const A = FIELD.A, H = hNums(A);
  // ⚠️ The piece the shave comes out of is the last one, whole or not: a magic length on
  // the area-8 field (100 hundredths), three quarters of one on the area-7 field (75).
  const whole = Math.ceil(H.g) - 1, last = Math.round((H.g - whole) * 100);
  const cent = Math.round(H.written * 100);
  const frac = Math.round((H.g - whole - H.written) * 100) / 100;
  const bar = f => hQuartersEl(A, 'shaved', {
    pieces: true, frac: bold(f),
    shave: bold(ET1() + eSign(H) + fmtNum(H.written)),
  });
  clearGame();
  showEliel();
  gameArea.appendChild(bar('?'));
  askWithLead(
    t(last === 100 ? 'c3_h_hd1' : 'c3_h_hd1p', {
      g: bold(fmtNum(H.g)), e: bold(fmtNum(H.written)), e2: bold(cent + ''),
      w: whole, len: bold(gLen(whole)), last: bold(fmtNum(H.g - whole)), c: bold(last + ''),
    }),
    t(last === 100 ? 'c3_h_hd_q1' : 'c3_h_hd_q1p',
      { eq: bold(nw(last + ' &minus; ' + cent)) }), last - cent, () => {
      clearGame();
      showEliel();
      gameArea.appendChild(bar('?'));
      askWithLead(t('c3_h_hd_ok1', { c: last - cent }), t('c3_h_hd_q2'), frac, () => {
        clearGame();
        showEliel();
        gameArea.appendChild(bar(fmtNum(frac)));
        storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_hd_ok2', {
          d: bold(fmtNum(frac)), w: whole, len: bold(gLen(whole)),
        }) + '</p>');
        addButton(t('btn_continue'), nextStep);
      }, t('c3_h_hd_h2', { c: last - cent }), { decimal: true });
    }, t('c3_h_hd_h1', { a: last, b: cent }));
}

// ---- the third round, on the field that is worst NOW (Sylvain) --------------------------
// The child reads the meter and picks it themselves: with 3 and 8 refined, the biggest corner
// left is the area-7 field's — its d̃ was 0.8, the biggest share of all twelve.
//
// ⚠️ THIS FIELD CANNOT OPEN THE WAY THE OTHER TWO DID, and the reason is worth knowing.
// Part F ROUNDED its share up (three quarters would not come out in tenths, so 0.75 became
// 0.8), which breaks the one thing hIntro leans on: its band is NOT d̃ × d̃. It is 0.84, where
// the corner is 0.64 — the extra 0.2 is what the rounding cost. So the band has to be worked
// out rather than read off the rule, and s̃₁ = 2.8 is not a square anybody does in their head.
// It is squared the way Chapter 2 squared 6.2 × 3.7: cut the side into 2 + 0.8 and read the
// four pieces off the ground. Which also means the field arrives at Part H's second screen
// holding a band it has computed itself, exactly as the other two did.
// ⚠️ `hPileCut` only exists where the pile HAS a part-layer to trade. On the area-6 field
// `2 × s̃₁ = 5` exactly, so every piece is already a whole magic length and that step would be
// asking about a bit-over that is not there.
function hMid(A) {
  const k = 2 * sTilFor(A);
  return [hJoin].concat(Number.isInteger(k) ? [] : [hPileCut]).concat([hPile, hLines]);
}

// ⚠️ `before` is the fields refined SO FAR, which is what separates the meters in Part H's
// last stretch: a screen that ASKS which field is worst now must show the one it is about to
// refine still carrying its round-1 corner.
function hWorst() {
  const A = FIELD.A, before = H_ROUNDS.slice(0, H_ROUNDS.indexOf(A));
  // ⚠️ `dual`, like hEnd: on the fields the child has already refined, the pale round-1 corner
  // stays behind the solid round-2 one — which is what makes "there is almost nothing left of
  // them" a thing to see rather than a thing to be told, and it is the same instrument the rest
  // of the chapter now uses.
  const meter = () => {
    clearGame();
    showEliel();
    // ⚠️ `err: false`, not `lengths: false`: the blue `s̃` lines are drawn — two on the fields
    // already refined, pale round 1 above solid round 2 — but not the `>--<`, which is not
    // derived until after Part H. Every meter screen in the chapter now draws the same thing.
    gameArea.appendChild(precFieldsEl({ answers: hAnswers(before), dual: true, err: false }));
  };
  meter();
  askWithLead(t(before.length > 2 ? 'c3_h_w1b' : 'c3_h_w1'), t('c3_h_w_q'), A, () => {
    meter();
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c3_h_w_ok', {
      r: bold(sqrtHTML(A)), s1: bold(SUB1 + ' = ' + fmtNum(sTilFor(A))),
      d: bold(DTIL + ' = ' + fmtNum(dtFor(A))),
    }) + '</p>');
    addButton(t('btn_continue'), nextStep);
  }, t('c3_h_w_hint'));
}

function hSevenBand() {
  const A = FIELD.A, H = hNums(A), d = dtFor(A), n = FIELD.n;
  const sq = f => squareSplitEl({
    side: H.g, split: n, cut: true, focus: f, stripTicks: true,
    brackets: { lo: fmtNum(n), hi: bold(fmtNum(d)), both: true,
                whole: bold(SUB1 + ' = ' + fmtNum(H.g)) },
  });
  const strips = 2 * n * d, corner = d * d;
  const put = (el, lead, q, ans, hint, ok, next, opts, okEl) => {
    clearGame();
    showEliel();
    gameArea.appendChild(el);
    askWithLead(lead, q, ans, () => {
      clearGame();
      showEliel();
      gameArea.appendChild(okEl || el.cloneNode(true));
      storyHTML('<div class="speaker">Eliel</div><p>' + ok + '</p>');
      addButton(t('btn_continue'), next);
    }, hint, opts);
  };
  clearGame();
  showEliel();
  gameArea.appendChild(hFrameEl(A, null));
  storyHTML('<div class="speaker">Eliel</div>' +
    '<p>' + t('c3_h_7_in1', {
      s1: bold(SUB1 + ' = ' + fmtNum(H.g)), e: bold(E1()), etil: bold(ET1()),

        t('c3_h_7_ch', { a: Math.round(d * 10), b: Math.round(d * d * 100) }),

                     ? 'c3_h_7_bok' : 'c3_h_7_bok2'), {

// THE JOIN, AND THE 5.6 (Sylvain) — the number was being handed over, and it is a sum the
// child can do. The two strips are pushed end to end and the total is taken apart the way the
// chapter takes every decimal apart: the WHOLE magic lengths first (2 in each strip, so 4),
// then the two 0.8 tails laid under a reference magic length, where ten of their sixteen
// tenths make one more whole and 6 are left. Chapter 2's carry row, at a new size.
//
// ⚠️ Each strip is drawn with its whole magic lengths ticked and its 0.8 tail in the shave's
// own gold, so the 4 is countable and the two tails are visibly the thing left over. Ticking
// the joined strip at every magic length would have shown 5 and a tail, which is the answer
// to the LAST question sitting on the screen during the first one.
const JL = 110;                       // px to the magic length, on the join's own row
function hJoinEl(A, stage, o) {
  const opt = o || {};
  const H = hNums(A), n = FIELD.n, tail = H.g - n, th = Math.max(14, H.exact * JL);
  const gap = stage === 'apart' ? 26 : 0;
  // ⚠️ The left gutter is the SAME on every stage, whether or not the dimensions are drawn on
  // it. It exists for the `ẽ` bracket on the last screen, and widening the picture only there
  // would slide the strip sideways between two consecutive screens — the defect Part A had to
  // fix once already.
  const X0 = 46;
  const W = X0 + 2 * H.g * JL + gap + 30;
  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:22px auto 0; width:' + W + 'px;' +
    'height:' + (th + 62) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  [['b', X0], ['c', X0 + H.g * JL + gap]].forEach(([k, x]) => {
    // the whole magic lengths, ticked
    put('left:' + x + 'px; top:0; width:' + (n * JL) + 'px; height:' + th + 'px;' +
        'box-sizing:border-box; background:' + REG[k].fill + ';' +
        'border:1.5px solid ' + REG[k].ink + ';' + (opt.dimWhole ? 'opacity:0.3;' : ''));
    for (let i = 1; i < n; i++)
      put('left:' + (x + i * JL) + 'px; top:0; width:1.5px; height:' + th + 'px;' +
          'background:' + REG[k].ink + '; opacity:' + (opt.dimWhole ? 0.15 : 0.5) + ';');
    // ...and the tail, in the shave's colour, ticked into its tenths
    put('left:' + (x + n * JL) + 'px; top:0; width:' + (tail * JL) + 'px;' +
        'height:' + th + 'px; box-sizing:border-box; background:' + REG.d.fill + ';' +
        'border:1.5px solid ' + REG.d.ink + ';' + (opt.dimTail ? 'opacity:0.3;' : ''));
    if (stage === 'apart') {
      put('left:' + (x - 30) + 'px; top:' + (th + 12) + 'px;' +
          'width:' + (H.g * JL + 60) + 'px; text-align:center; font-size:15px;' +
          'color:#5a5240;').innerHTML = bold(SUB1 + ' = ' + fmtNum(H.g));
    }
  });
  if (stage !== 'apart' && !opt.dims) {
    put('left:' + X0 + 'px; top:' + (th + 12) + 'px; width:' + (2 * H.g * JL) + 'px;' +
        'text-align:center; font-size:16px; color:#5a5240;')
      .innerHTML = bold(nw(fmtNum(H.g) + ' + ' + fmtNum(H.g)));
  }
  // ⚠️ ...and on the last screen the two SIDES are written on the ground (Sylvain): the length
  // bracketed underneath and the width bracketed at the near end, so "5.6 magic lengths long
  // and ẽ across" is a sentence about something the child can point at. The chapter's own
  // sides-first order, and the same bracket mark-up every other picture in it uses.
  if (opt.dims) {
    const w = 2 * H.g * JL;
    put('left:' + X0 + 'px; top:' + (th + 10) + 'px; width:' + w + 'px; height:10px;' +
        'box-sizing:border-box; border:2.5px solid #5a5240; border-top:none;');
    put('left:' + (X0 - 60) + 'px; top:' + (th + 26) + 'px; width:' + (w + 120) + 'px;' +
        'text-align:center; font-size:15px; color:#5a5240; white-space:nowrap;')
      .innerHTML = bold(gLen(2 * H.g));
    put('left:' + (X0 - 15) + 'px; top:0; width:8px; height:' + th + 'px;' +
        'box-sizing:border-box; border:2.5px solid ' + REG.d.ink + '; border-right:none;');
    put('left:0; top:' + (th / 2 - 9) + 'px; width:' + (X0 - 21) + 'px;' +
        'text-align:right; font-size:15px; color:' + REG.d.ink + ';').innerHTML = bold(ET1());
  }
  return box;
}

// The two tails, under a whole magic length. Ten of their tenths fuse into one more whole one
// and the rest are left over — which is Chapter 2's carry, and the reason this screen exists
// rather than the sum being stated.
function hTailsEl(A, done) {
  const H = hNums(A), tail = H.g - FIELD.n, TEN = JL / 10;
  const total = 2 * tail, whole = Math.floor(total + 1e-9), rest = total - whole;
  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:22px auto 0;' +
    'width:' + (total * JL + 90) + 'px; height:132px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  // the reference, with a dashed line dropped from its far end — where a whole one stops is
  // something the child can see before anything is regrouped
  // ⚠️ The reference's name goes ABOVE it, centred on the bar. It was in a 34px gutter to the
  // left and « 1 magic length » is 90px, so it printed straight across the bar it labels —
  // Chapter 2's lesson 16, and it is worse in French. There is no room to the left: the row
  // has to start at the same x as the bar or the regrouping does not line up.
  put('left:40px; top:0; width:' + JL + 'px; text-align:center; font-size:13px;' +
      'color:#3f7a34; white-space:nowrap;').innerHTML = bold(gLen(1));
  put('left:40px; top:22px; width:' + JL + 'px; height:16px; box-sizing:border-box;' +
      'background:#eaf5e5; border:2px solid #3f7a34;');
  put('left:' + (40 + JL) + 'px; top:22px; width:0; height:82px;' +
      'border-left:2px dashed #3f7a34;');
  const rowY = 72, TH = 30;
  const ticks = (x, w, col) => {
    for (let i = 1; i * TEN < w - 0.5; i++)
      put('left:' + (x + i * TEN) + 'px; top:' + (rowY + 5) + 'px; width:1.5px;' +
          'height:' + (TH - 10) + 'px; background:' + col + '; opacity:0.55; z-index:3;');
  };
  if (!done) {
    for (let i = 0; i < 2; i++) {
      const x = 40 + i * tail * JL;
      put('left:' + x + 'px; top:' + rowY + 'px; width:' + (tail * JL) + 'px;' +
          'height:' + TH + 'px; box-sizing:border-box; z-index:2;' +
          'background:' + REG.d.fill + '; border:2px solid ' + REG.d.ink + ';');
      ticks(x, tail * JL, REG.d.ink);
    }
  } else {
    // the same ground, counted as whole magic lengths and what is left of them
    for (let i = 0; i < whole; i++) {
      const x = 40 + i * JL;
      put('left:' + x + 'px; top:' + rowY + 'px; width:' + JL + 'px; height:' + TH + 'px;' +
          'box-sizing:border-box; z-index:2; background:#cfe8c4;' +
          'border:2px solid #3f7a34;');
      ticks(x, JL, '#3f7a34');
    }
    const x = 40 + whole * JL + 6;
    put('left:' + x + 'px; top:' + rowY + 'px; width:' + (rest * JL) + 'px;' +
        'height:' + TH + 'px; box-sizing:border-box; z-index:2;' +
        'background:' + REG.d.fill + '; border:2px solid ' + REG.d.ink + ';');
    ticks(x, rest * JL, REG.d.ink);
  }
  return box;
}

function hJoin() {
  const A = FIELD.A, H = hNums(A), n = FIELD.n, tail = H.g - n;
  const pic = el => {
    clearGame();
    showEliel();
    gameArea.appendChild(el);
  };
  const say = (html, el) => {
    pic(el);
    storyHTML('<div class="speaker">Eliel</div><p>' + html + '</p>');
  };
  const rest = Math.round((2 * tail - (2 * tail >= 1 - 1e-9 ? 1 : 0)) * 100) / 100;
  say(t('c3_h_j1', { e: bold(ET1()), g: bold(fmtNum(H.g)) }), hJoinEl(A, 'apart'));
  addButton(t('c3_h_j_btn'), () => {
    // ⚠️ The whole magic lengths first, with the two tails dimmed — the question is about the
    // part of the picture the sentence is about (Part C's own greying-out).
    // ⚠️ And every lead here travels INSIDE its question (askWithLead), because askInline
    // replaces the story panel: written with storyHTML first, it is gone the instant the
    // question appears. Three of these were lost that way in the first build.
    pic(hJoinEl(A, 'joined', { dimTail: true }));
    askWithLead(
      t('c3_h_j2', { n: n, g: bold(fmtNum(H.g)), tail: bold(fmtNum(tail)),
                     eq: bold(nw(fmtNum(H.g) + ' = ' + n + ' + ' + fmtNum(tail))) }),
      t('c3_h_j_qw'), 2 * n, () => {
        say(t('c3_h_j_okw', { w: bold(2 * n + '') }) + PARA +
            t('c3_h_j3', { tail: bold(fmtNum(tail)), len: bold(gLen(1)) }),
            hTailsEl(A, false));
        // ⚠️ THE MIRROR CASE, and it wants no button at all: on the area-11 field the two
        // tails are 0.4 each, so between them they come to 8 tenths and never reach the
        // dashed line. There is no hidden magic length to bring out — the picture says so,
        // and the child simply counts the tenths.
        const rolls = 2 * tail >= 1 - 1e-9;
        const askTails = () => {
          askWithLead(t(rolls ? (rest ? 'c3_h_j_okt' : 'c3_h_j_okt0') : 'c3_h_j_short',
                        { len: bold(gLen(1)) }),
            t(rolls ? 'c3_h_j_qt' : 'c3_h_j_qt2'),
            Math.round((2 * tail - (rolls ? 1 : 0)) * 10), () => {
              pic(hJoinEl(A, 'joined'));
              askWithLead(
                t(rolls ? (rest ? 'c3_h_j4' : 'c3_h_j4c') : 'c3_h_j4b', {
                  w: bold(2 * n + ''), r: bold(fmtNum(rest)),
                  sum: bold(nw(fmtNum(2 * n) + (rolls ? ' + 1 + ' : ' + ') + fmtNum(rest))) }),
                t('c3_h_j_qs', { eq: bold(nw(fmtNum(H.g) + ' + ' + fmtNum(H.g))) }), 2 * H.g,
                () => {
                  say(t('c3_h_j_oks', { k: bold(fmtNum(2 * H.g)), e: bold(ET1()) }),
                      hJoinEl(A, 'joined', { dims: true }));
                  addButton(t('btn_continue'), nextStep);
                }, t('c3_h_j_hs', { w: 2 * n, r: fmtNum(rest) }), { decimal: true });
            }, t('c3_h_j_ht'));
        };
        if (rolls) {
          addButton(t('c3_h_j_btn2'), () => { pic(hTailsEl(A, true)); askTails(); });
        } else {
          askTails();
        }
      }, t('c3_h_j_hw', { n: n }));

}

// THE PILE, IN TWO STAGES (Sylvain) — and the step between them is the one that was missing.
//
// The pile as it comes OFF the strip is five pieces a whole magic length long and a last one
// only 0.6 of one, all at full e~ thickness: the 5.6, made of ground. But heights can only be
// compared when every piece runs the same length, so that last rectangle has to be traded for
// one a full magic length long — and what it is then across is a NEW length, `l̃`, with
//     e~ × 0.6 = l̃ × 1
// The trade is commutativity and associativity, and it is the child's own vocabulary:
// `e~ × 0.6 = 0.6 × e~ = (0.6 × e~) × 1`, so `l̃ = 0.6 × e~`. Same area, same one-magic-length
// side, so the other side has to match. Drawing the second pile without this hands the 0.6
// over as a thickness with no reason behind it.
function hPileCut() {
  const A = FIELD.A, H = hNums(A), n = FIELD.n;
  const frac = Math.round((H.k - Math.floor(H.k)) * 100) / 100;
  const LE = bold(nw(fmtNum(frac) + ' &times; ' + ET1()));   // what l̃ turns out to be
  const cut = () => {
    clearGame();
    showEliel();
    gameArea.appendChild(fPileEl(H.k, H.exc, {
      cut: true, pileOnly: true, layerLabel: bold(ET1()),
      cutLabel: bold(fmtNum(frac)), foot: bold(gLen(1)),
    }));
  };
  const say = (html, el) => {
    el();
    storyHTML('<div class="speaker">Eliel</div>' + html);
  };
  say('<p>' + t('c3_h_pc1', {
    w: bold(Math.floor(H.k) + ''), e: bold(ET1()), f: bold(fmtNum(frac)),
    k: bold(fmtNum(H.k)),
  }) + '</p>', cut);
  addButton(t('btn_continue'), () => {
    say('<p>' + t('c3_h_pc2', {
      e: bold(ET1()), f: bold(fmtNum(frac)), l: bold(LTIL),
      eq: bold(nw(ET1() + ' &times; ' + fmtNum(frac) + ' = ' + LTIL + ' &times; 1')),
    }) + '</p>', cut);
    addButton(t('c3_h_pc_btn'), () => {
      // ⚠️ Once it is solved, `l̃` comes OFF the picture and its value goes on (Sylvain) — a
      // letter is worth drawing only while it is unknown. And the whole pile now wears its
      // own height down the far left, which is the quantity the next screen asks for.
      const done = () => {
        clearGame();
        showEliel();
        gameArea.appendChild(fPileEl(H.k, H.exc, {
          pileOnly: true, layerLabel: bold(ET1()), topLabel: LE, foot: bold(gLen(1)),
          leftLabel: bold(nw(fmtNum(H.k) + ' &times; ' + ET1())),
        }));
      };
      say('<p>' + t('c3_h_pc3', {
        e: bold(ET1()), f: bold(fmtNum(frac)),
        c1: bold(nw(ET1() + ' &times; ' + fmtNum(frac) + ' = ' + fmtNum(frac) +
                    ' &times; ' + ET1())),
        c2: bold(nw('(' + fmtNum(frac) + ' &times; ' + ET1() + ') &times; 1')),
      }) + '</p><p style="margin-top:10px">' + t('c3_h_pc4', {
        l: bold(LTIL), f: bold(fmtNum(frac)), e: bold(ET1()),
        eq: bold(nw(LTIL + ' = ' + fmtNum(frac) + ' &times; ' + ET1())),
      }) + '</p>', done);
      addButton(t('btn_continue'), nextStep);
    });
  });
}

// ---- HOW PRECISE IS THE TRICK, IN LENGTHS? (Sylvain) --------------------------------------
//
// ⚠️ THIS RUNS BEFORE PART H, NOT AFTER IT (CHAPTER3_PLAN.md §13, 2026-08-21). It shipped at
// the end, which was backwards: the precision-in-lengths question is the REASON to refine, so
// it comes first and CHOOSES the fields. Part G ranks the twelve by the AREA each answer is
// out by; this converts that to a LENGTH, the length meter ranks them again, and Part H then
// goes back for the worst five off that instrument.
//
// Every error this chapter has measured has been an AREA — a band, a corner, so many flower
// squares. But the trick exists to find a LENGTH, and Eliel buys wire by the magic length. So
// the conversion is the chapter's own move one more time: the band is two strips of `s̃ × e`
// less the corner they share, so with the corner dropped
//     ã − a ≈ 2 × s̃ × e   and therefore   e ≈ (ã − a) / (2 × s̃)
// ⚠️ NO NEW LETTERS. `e` already means "how far our answer is above the truth" (Part H names
// it on its very first screen) and `ẽ` is already its estimate. And the punch, now that this
// comes FIRST, points forward instead of back: the number that says how far out we are is the
// very number we shall shave off, which is what the whole of Part H then does.
// ⚠️ It also understates, always, because `ã − a = e × (s̃ + s)` exactly and `s̃ + s < 2 × s̃`.
// Asserted in ch3_numbers.py.
//
// ⚠️ THE DERIVATION IS DRAWN ON THE WORST FIELD AND THE APPLICATION ON THE KINDEST — and the
// two are different fields on purpose. The derivation prints not one number, so it gives away
// nothing about the field it stands on; what it needs is a band a child can SEE, and a band's
// legibility is a ratio, not a size. `e / s̃₁` runs from 12.5% on the area-3 field down to 2%
// on the area-6 one, and scaling the picture up cannot help, because it scales both. So the
// argument is made where the band is fattest, and the arithmetic is then done where the
// division comes out kind (0.25 into 5, the only one in the set a child can do).

// The band as ground: our answer's square with the true field cut out of it, so what is left
// is the rim we are claiming and the field has not got. At the field's own scale, like every
// other square in this chapter.
function precBandEl(A) {
  const g = sTilFor(A);
  return squareSplitEl({
    side: g, split: Math.sqrt(A), cut: true, off: 'a', focus: ['b', 'c'],
    brackets: { lo: bold('s'), hi: bold(E1()), both: true,
                whole: bold(SUB1 + ' = ' + fmtNum(g)) },
  });
}

  // between two consecutive screens.
  const meter = () => {

    // s̃ₖ² = a + corner). Only round 1 grows, and only because it starts from the block, which
    // undershoots. And the ⋮ goes BELOW the third line: nothing is skipped between them.
    b2.innerHTML = both() + line('3', '2', '2', nw(sub(ATIL, '2') + ' &minus; a'), '&minus;') +
      '<div style="text-align:center; font-size:22px; color:#8a8168; margin-top:12px;">' +

// ⚠️ `stop` truncates the run before `hAnswer`/`hCheck` — the two screens that SPEND the shave.
// The precision stretch runs the whole of this machinery on the area-6 field and then does not
// take the number off: it reports it. That the two are the same number is the chapter's point.
function hStepsFor(A, pre, first, mid, stop) {
  const H = hNums(A);
  // ⚠️ `stop` drops `hHundredths` as well, not only `hAnswer`/`hCheck`: that screen already
  // does the subtraction (100 − 16 = 84). `hLay` is where the run ends on the shave ITSELF,
  // stated as so many tenths and so many hundredths — which is the number the precision
  // stretch wants and the last one it is allowed to have.
  // ⚠️ It therefore only makes sense on the lay branch. The quarter branch has no screen that
  // names the shave without spending it — `hQuarters` IS the subtraction — and H_SHOW is
  // never a quarter (its shave is 0.05), so the assertion holds by construction.
  const run = (pre || []).concat([first || hIntro, hStrips, hForget]).concat(mid || [])
    .concat(hIsQuarter(H) ? [hQuarters, hSeventyFive] : (stop ? [hLay] : [hLay, hHundredths]))
    .concat(stop ? [] : [hAnswer, hCheck]);
  return run.map(fn => {
    const w = function () { return fn.apply(this, arguments); };
    Object.defineProperty(w, 'name', { value: fn.name + A, configurable: true });
    w.fieldArea = A;
    return w;
  });
}

    gameArea.appendChild(zoomLadder(2, () => {

      addButton(t('btn_continue'), nextStep);
    }));
  },

  // The whole ladder on screen at once, which is the argument: three magnifications, three
  // leftovers, and no reason for the fourth to be any different. Both buttons advance — it
  // is an invitation to have an opinion, not a test.
  function apNeverEnds() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_ap_never1') + '</p>' +
      '<p style="margin-top:8px">' + t('c3_ap_never2') + '</p>'
    );
    gameArea.appendChild(zoomLadder(3));
    addButton(t('c3_ap_never_yes'), nextStep);
    addButton(t('c3_ap_never_no'), nextStep);
  },

  // The sign, earned. It is not a convention being announced; it is the only honest thing
  // left to write after three passes that all left something over.
  function apApprox() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +
      '<p>' + t('c3_ap_approx1') + '</p>' +
      '<p style="margin-top:8px">' +
        t('c3_ap_approx2', { approx: '<strong>' + sqrtHTML(FIELD.A) + ' &asymp; ' + fmtNum(2.2) + '</strong>' }) +
      '</p>'
    );
    gameArea.appendChild(zoomLadder(3));
    addButton(t('btn_continue'), nextStep);
  },

  // ...and the turn. The area is the one exact thing we hold, and it has not been used.
  function apCompute() {
    clearGame();
    showEliel();
    storyHTML(
      '<div class="speaker">Eliel</div>' +

    );
