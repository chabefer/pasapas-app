  // ⚠️ Emitted TOP-DOWN even though they are counted bottom-up, so that on a whole count the
  // order and the positions are exactly what they always were — which is what keeps Part D's
  // and Part F's screens byte-identical rather than merely looking the same.
  for (let i = 0; i <= nT; i++) tickL(BASE - (nT - i) * seg);
  if (nUp) tickL(TOP - nUp, true);
  else if (nT < N4 - 1e-9) tickL(TOP);
  const nLab = Math.ceil(N4 - 1e-9);
  for (let j = 0; j < nLab; j++) {
    put('left:' + (LX + 20) + 'px;' +
        'top:' + (BASE - (nLab - j) * seg + seg / 2 - 9) + 'px; width:40px;' +
        'font-size:' + Math.max(10, Math.min(14, seg - 6)) + 'px; color:' + LC + ';')
      .innerHTML = bold(q.unit || DTIL);
  }
  // its name: beside the line where the caller asks for that (the two sides then read the
  // same way, each named on its own outer edge), or under its foot where the left-hand space
  // belongs to Part D's four candidates.
  if (q.leftSide) {
    put('left:0; top:' + (TOP + H / 2 - 11) + 'px; width:' + (LX - 30) + 'px;' +
        'text-align:right; font-size:16px; color:' + LC + '; white-space:nowrap;')
      .innerHTML = bold(q.left || ('4 &times; ' + DTIL));
  } else {
    put('left:' + (LX - 70) + 'px; top:' + (BASE + 10) + 'px; width:145px;' +
        'text-align:center; font-size:16px; color:' + LC + '; white-space:nowrap;')
      .innerHTML = bold(q.left || ('4 &times; ' + DTIL));
  }

  put('left:' + (LX + 86) + 'px; top:' + (TOP + H / 2 - 15) + 'px; font-size:22px;' +
      'color:#5a5240;').innerHTML = '=';
  if (rUp) put('left:' + RX + 'px; top:' + (TOP - rUp) + 'px; width:5px;' +
               'height:' + rUp + 'px; background:' + RC + '; opacity:0.35;');
  put('left:' + RX + 'px; top:' + TOP + 'px; width:5px; height:' + H + 'px;' +
      'background:' + RC + ';');
  // ⚠️ A tick at EVERY magic length, not just the two ends (Sylvain): the label says
  // "2 magic lengths", and a line with nothing on it between its ends is asking to be taken
  // on trust. `o.rn` is how many it is worth; Part D passes nothing and gets 1.
  const rT = Math.floor(RN + 1e-9), rN = q.rTo ? Math.round(rMax) : rT;
  for (let i = 0; i <= rN; i++) {
    const at = rN - i;
    put('left:' + (RX - 7) + 'px; top:' + (BASE - at * seg2 - 1.5) + 'px;' +
        'width:19px; height:3px; background:' + RC + ';' +
        (at > RN + 1e-9 ? 'opacity:0.35;' : ''));
  }
  put('left:' + (RX + 22) + 'px; top:' + (TOP + H / 2 - 11) + 'px; width:190px;' +
      'font-size:15px; white-space:nowrap; color:' + RC + ';')
    .innerHTML = bold(q.right || t('c3_d_lbl_1ml'));
  return wrap;
}

// Part E's side mark-up, in one place: the whole side and the two pieces it comes apart
// into, on BOTH sides of the square. Defined once so every screen in the part draws it the
// same and the picture cannot jump sideways between consecutive screens.
function eBr() {
  return { lo: '2', hi: '<strong>' + fmtNum(0.25) + '</strong>', both: true,
           whole: '<strong>' + SUB1 + ' = ' + fmtNum(2.25) + '</strong>' };
}

// PART E's one new picture: a magic square ruled into QUARTERS both ways, so the little
// corner can be counted rather than asserted. 4 rows of 4 — Chapter 1's own square numbers
// doing the work — and one cell lit, which is the corner we threw away.
// This is `CHAPTER3_PLAN.md`'s error meter arriving early, and Part G will reuse it to rank
// every field by how much its own dropped corner cost.
const QN = 4, QC = 46;                   // the magic square, ruled into quarters both ways

// ⚠️ `n` is additive: the magic square is ruled into QUARTERS unless a caller asks for
// something else, and the whole square keeps its size whatever n is — the area-8 field's
// corner is a sixth by a sixth, so it wants sixths, and 6 × 6 = 36 is the quarters' own
// trick at a new denominator. Every earlier call passes two arguments or fewer.
function quarterGridEl(litCell, litIndex, n, n0, tot) {
  // ⚠️ `tot` because a magic square ruled into a HUNDRED flower squares cannot be the
  // same size as one ruled into sixteen quarters: at 186px a flower square is 18px and
  // the area-7 field's corner — one and a half of them each way — reads as a single
  // cell. The count it is asking for is one whole, two halves and a quarter.
  const N = n || QN, C = (tot || QN * QC) / N;
  // Which cell is lit matters now that the field's corner is magnified INTO it: it has to be
  // the one the cone lands on. Default is the bottom-right, directly under the field's own
  // top-right corner.
  const li = litIndex == null ? N * N - 1 : litIndex;
  // ⚠️ `block` lights the bottom-right b x b instead of a single cell: the area-7 field's
  // corner is 0.75 by 0.75, which is three quarters each way — nine of the sixteen.
  // ⚠️ ...and where it is not a whole number of cells (the area-7 field's corner is 1.5
  // flower squares each way) it cannot be done by lighting cells at all. That one is an
  // overlay laid over the grid, so the child sees it cut a whole cell in half — which is
  // what makes the count "one whole one, two halves and a quarter" rather than a number to
  // be told. Part E's own halving, at a new size.
  const b = n0 || 0, part = b && Math.abs(b - Math.round(b)) > 1e-9;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; margin:18px auto 0; width:' + (N * C) + 'px;' +
    'height:' + (N * C) + 'px; display:grid; background:#d4edda;' +
    'grid-template-columns:repeat(' + N + ',' + C + 'px);' +
    'grid-template-rows:repeat(' + N + ',' + C + 'px);' + EDGE;
  for (let i = 0; i < N * N; i++) {
    const c = document.createElement('div');
    const r = Math.floor(i / N), c0 = i % N;
    const on = part ? false
             : (b ? (r >= N - b && c0 >= N - b) : (litCell && i === li));
    c.style.cssText = 'position:relative; box-sizing:border-box; width:' + C + 'px;' +
      'height:' + C + 'px; border:1px solid #8aba8a;' + (on ? 'background:' + REG.d.fill +
      '; outline:2.5px solid ' + REG.d.ink + '; outline-offset:-2px;' : '');
    wrap.appendChild(c);
  }
  if (part) {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:absolute; right:0; top:0; width:' + (b * C) + 'px;' +
      'height:' + (b * C) + 'px; box-sizing:border-box; background:' + REG.d.fill + ';' +
      'outline:2.5px solid ' + REG.d.ink + '; outline-offset:-2px;';
    // ⚠️ FIRST in the DOM, and the cells are `position:relative` for it — a positioned element
    // paints above IN-FLOW content whatever the order, so the cells have to be positioned too
    // before order decides. (z-index:-1 is the other fix and it is wrong here: the wrap is not
    // a stacking context, so the patch disappears behind the grid's own background.) The whole
    // question is how much ground the patch covers — one whole flower square, two halves and a
    // quarter — and an opaque patch hides the two lines that say where the halves are cut. Its
    // own solid outline still says ONE patch, the way Marimon's bent example does.
    wrap.insertBefore(ov, wrap.firstChild);
  }
  return wrap;
}

// eCorner's picture, as ONE magnification rather than two diagrams (Sylvain). The field's
// corner and one cell of the magic square are the SAME 0.25 × 0.25 square, so a ring sits on
// the corner, a cone widens up from it, and the cell it lands on is that corner at 46px
// instead of 19. And the magic square carries « 1 magic length » on two of its sides, so it
// is visibly a MAGIC square and not merely a grid — which is the whole reason sixteen of
// these little ones make one of it.
//
// ⚠️ The magnified square goes ABOVE the field, where the zoom ladder puts magnifications
// BELOW. The corner sits on the field's top edge, so a downward cone would have to cross the
// field to reach it. Chapter 2's rule is proximity, not direction — the lens goes directly
// over or beside its own ring — and its Part B corner caption moved above its lens for the
// same kind of reason: below, it landed on the cone.
//
// For the same reason the square's two labels are on its LEFT and its TOP: the cone leaves
// from the bottom edge, and a bracket there would be the first thing it crossed.
function cornerZoomEl() {
  const R = regionBoxes(2.25);
  const GW = QN * QC;
  const FX = 8, FW = R.side + BPADL, FH = R.side + BPADB2;
  const GLAB = 176;                      // gutter for « 1 longueur magique » (145px in FR)
  const TPAD = 46, GY = TPAD, FY = GY + GW + CONE;
  const cx0 = FX + BPADL + R.aPx, cx1 = cx0 + R.bPx;     // the corner, in wrapper coords
  // place the square so its bottom-right cell sits directly over that corner
  const GX = (cx0 + cx1) / 2 - ((QN - 1) * QC + QC / 2);
  const W = Math.max(GX + GW, cx1 + 30, FX + FW), H = FY + FH;

  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:8px auto 0; width:' + W + 'px;' +
    'height:' + H + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };

  const grid = quarterGridEl(true);
  grid.style.margin = '0';
  grid.style.position = 'absolute';
  grid.style.left = GX + 'px';
  grid.style.top = GY + 'px';
  box.appendChild(grid);

  // its two sides, in the green the magic square is drawn in everywhere else
  const GRN = '#3f7a34';
  put('left:' + (GX - 14) + 'px; top:' + GY + 'px; width:8px; height:' + GW + 'px;' +
      'box-sizing:border-box; border:2.5px solid ' + GRN + '; border-right:none;');
  put('left:' + (GX - GLAB) + 'px; top:' + (GY + GW / 2 - 11) + 'px;' +
      'width:' + (GLAB - 22) + 'px; text-align:right; white-space:nowrap;' +
      'font-size:14px; font-weight:bold; color:' + GRN + ';')
    .innerHTML = t('c3_d_lbl_1ml');
  put('left:' + GX + 'px; top:' + (GY - 17) + 'px; width:' + GW + 'px; height:8px;' +
      'box-sizing:border-box; border:2.5px solid ' + GRN + '; border-bottom:none;');
  put('left:' + (GX - 40) + 'px; top:' + (GY - 40) + 'px; width:' + (GW + 80) + 'px;' +
      'text-align:center; white-space:nowrap; font-size:14px; font-weight:bold;' +
      'color:' + GRN + ';').innerHTML = t('c3_d_lbl_1ml');

  // the cone: wide at the cell it magnifies into, narrow at the corner it comes off
  const cone = ladderCone(GX + (QN - 1) * QC, GX + QN * QC, cx0, cx1);
  cone.style.top = (GY + GW) + 'px';
  box.appendChild(cone);

  const field = squareSplitEl({
    side: 2.25, cut: true, squares: true, brackets: eBr(), focus: 'd',
  });
  field.style.margin = '0';
  field.style.position = 'absolute';
  field.style.left = FX + 'px';
  field.style.top = FY + 'px';
  box.appendChild(field);

  // the ring, last, so nothing paints over it
  const RR = 28, rcx = (cx0 + cx1) / 2, rcy = FY + R.bPx / 2;
  put('left:' + (rcx - RR) + 'px; top:' + (rcy - RR) + 'px; width:' + (2 * RR) + 'px;' +
      'height:' + (2 * RR) + 'px; border-radius:50%; box-sizing:border-box;' +
      'border:2.5px solid #c98a2a; z-index:5; pointer-events:none;');
  return box;
}

// THE SAME GROUND, FOUR WAYS, AS AN EQUATION CHAIN (Sylvain, 2026-08-22): the leftover L, then
// the two strips it is really made of, then those strips piled into a share, then what the share
// comes to — that many whole magic squares. The chain runs ACROSS and wraps after the first `=`,
// so it reads as a line of arithmetic that ran out of width rather than as a column of stacked
// pictures.
//
// ⚠️ The strips are d̃ wide, NOT the field's own d. d̃ is what the equation is about, and the two
// differ by a pixel and a bit — but the whole point of the line is that two strips of s̃₀ × d̃
// come to exactly a − ã₀, and drawing them at the true d would make that false by the corner.
// (One magic square, both ways: 2 × 160 × 20 = 80 × 80.)
function stockAreaEqEl() {
  const S = FIELD.s * PX, aPx = FIELD.n * PX;
  const dPx = dTilde() * PX, k = 2 * FIELD.n;
  const ORG = REG.d.ink, BLU = '#2f6fb5', FILL = 'rgba(232,163,61,0.30)';
  const SA = SUB0;

  // Each term is its own little box, so the row lays them out instead of one tall canvas
  // placing every shape by hand.
  const box = (w, h) => {
    const d = document.createElement('div');
    d.style.cssText = 'position:relative; flex:none; width:' + w + 'px; height:' + h + 'px;';
    d.put = css => {
      const e = document.createElement('div');
      e.style.cssText = 'position:absolute;' + css;
      d.appendChild(e);
      return e;
    };
    return d;
  };
  // ⚠️ Captions are centred on the SHAPE they name, not on the box, and may overhang it: the
  // pile is 80px wide and its caption four times that.
  const cap = (b, y, html, x, w) => b.put('left:' + (x - 90) + 'px; top:' + y + 'px;' +
    'width:' + (w + 180) + 'px; text-align:center; font-size:16px; color:' + ORG + ';' +
    'white-space:nowrap;').innerHTML = '<strong>' + html + '</strong>';
  const rect = (b, x, y, w, h) => b.put('left:' + x + 'px; top:' + y + 'px;' +
    'width:' + w + 'px; height:' + h + 'px; box-sizing:border-box; background:' + FILL + ';' +
    'border:2px solid ' + ORG + ';');
  // a bracket in the gutter, label right-aligned beside it. `outer` is the second rank, further
  // left, for a bracket that spans several of the inner ones.
  const vb = (b, sx, y, h, txt, outer) => {
    const x = sx - (outer ? 52 : 14), right = x - 6;
    const left = outer ? 0 : sx - 40;
    b.put('left:' + x + 'px; top:' + y + 'px; width:8px; height:' + h + 'px;' +
      'box-sizing:border-box; border:2.5px solid ' + ORG + '; border-right:none;');
    b.put('left:' + left + 'px; top:' + (y + h / 2 - 11) + 'px;' +
      'width:' + (right - left) + 'px; text-align:right; font-size:15px;' +
      'color:' + ORG + '; white-space:nowrap;').innerHTML = '<strong>' + txt + '</strong>';
  };
  const hb = (b, x, w, y, txt, col) => {
    b.put('left:' + x + 'px; top:' + y + 'px; width:' + w + 'px; height:8px;' +
      'box-sizing:border-box; border:2.5px solid ' + col + '; border-top:none;');
    b.put('left:' + (x - 70) + 'px; top:' + (y + 11) + 'px; width:' + (w + 140) + 'px;' +
      'text-align:center; font-size:15px; color:' + col + '; white-space:nowrap;')
      .innerHTML = '<strong>' + txt + '</strong>';
  };
  // ⚠️ Given a height, the sign centres itself in it — which is how the second row keeps its two
  // `=` on the middle of the squares while the row itself aligns on their TOPS.
  const eqSign = h => {
    const d = document.createElement('div');
    d.innerHTML = '=';
    d.style.cssText = 'flex:none; font-size:24px; color:#5a5240;' +
      (h ? 'height:' + h + 'px; display:flex; align-items:center;' : '');
    return d;
  };
  const rowEl = () => {
    const r = document.createElement('div');
    r.style.cssText = 'display:flex; align-items:center; justify-content:center;' +
      'gap:18px; margin-top:16px; flex-wrap:wrap;';
    return r;
  };

  // 1 — the L, off the field and on its own, at the field's own size
  const bL = box(S, S + 34);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', S);
  svg.setAttribute('height', S);
  svg.style.cssText = 'position:absolute; left:0; top:0;';
  const poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', [
    [0, 0], [S, 0], [S, S], [aPx, S], [aPx, S - aPx], [0, S - aPx],
  ].map(q => q.join(',')).join(' '));
  poly.setAttribute('fill', FILL);
  poly.setAttribute('stroke', ORG);
  poly.setAttribute('stroke-width', '2.5');
  svg.appendChild(poly);
  bL.appendChild(svg);
  cap(bL, S + 6, nw('a &minus; ' + SUBA0), 0, S);

  // 2 — the same ground as TWO strips, each s̃₀ long and d̃ wide. Both wear their d̃ (Sylvain):
  // with only one labelled, the picture says "a strip and something else" where the caption
  // says "two of the same thing".
  const P2 = 48, h2 = 2 * dPx + 3;
  const bS = box(P2 + aPx, h2 + 60);
  for (let i = 0; i < 2; i++) {
    rect(bS, P2, i * (dPx + 3), aPx, dPx);
    vb(bS, P2, i * (dPx + 3), dPx, DTIL);
  }
  hb(bS, P2, aPx, h2 + 6, SA, BLU);
  cap(bS, h2 + 34, nw('2 &times; (' + SA + ' &times; ' + DTIL + ')'), P2, aPx);

  // 3 — AND THE DIVISION, MATERIALIZED: the same ground again as 2 × s̃₀ pieces of d̃ × 1, piled
  // one on another. Every layer wears its own d̃ — that is what makes the 2 × s̃₀ something you
  // count rather than something you are told — and ONE outer bracket spans the lot.
  // ⚠️ 160, not 100: the outer bracket's label is right-aligned into `P3 − 58`, and
  // `2 × s̃₀ × d̃` is ~85px — at 100 it ran straight through the four inner `d̃` labels. Sized
  // for the label that actually goes there, which is the same lesson the strip gutters learned.
  const P3 = 160, h3 = k * dPx;
  const bP = box(P3 + PX, h3 + 60);
  for (let i = 0; i < k; i++) {
    rect(bP, P3, i * dPx, PX, dPx);
    vb(bP, P3, i * dPx, dPx, DTIL);
  }
  vb(bP, P3, 0, h3, nw('2 &times; ' + SA + ' &times; ' + DTIL), true);
  hb(bP, P3, PX, h3 + 6, t('c3_d_lbl_1ml'), BLU);
  cap(bP, h3 + 34, nw('(2 &times; ' + SA + ') &times; (' + DTIL + ' &times; 1)'), P3, PX);

  // 4 — and what the share comes to: that many WHOLE magic squares, in Chapter 1's own green.
  // The same object bEquation puts on the right of its own equation.
  const bQ = document.createElement('div');
  // ⚠️ The gap is what puts this caption on the same line as the pile's own: the pile carries a
  // bracket and two texts under it, so its caption lands at h3 + 34, and the square is h3 tall.
  bQ.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:34px;' +
    'flex:none;';
  bQ.appendChild(areaSquaresEl(FIELD.A - FIELD.n * FIELD.n));
  const cQ = document.createElement('div');
  cQ.innerHTML = '<strong>' + nw('a &minus; ' + SUBA0) + '</strong>';
  cQ.style.cssText = 'font-size:16px; color:' + ORG + '; white-space:nowrap;';
  bQ.appendChild(cQ);

  // ⚠️ TWO ROWS, and the second opens on its own `=` (Sylvain) — the chain is one line of
  // arithmetic that has run out of width, not two separate pictures.
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center;';
  const r1 = rowEl();
  r1.appendChild(bL); r1.appendChild(eqSign()); r1.appendChild(bS);
  // ⚠️ The second row aligns on the TOP, not the middle — the pile and the magic square are both
  // h3 tall, so aligning their tops is what puts their BOTTOM sides on one line, which is the
  // comparison the row is making. The `=` signs are centred on that height by hand.
  const r2 = rowEl();
  r2.style.alignItems = 'flex-start';
  r2.appendChild(eqSign(h3)); r2.appendChild(bP);
  r2.appendChild(eqSign(h3)); r2.appendChild(bQ);
  wrap.appendChild(r1);
  wrap.appendChild(r2);
  return wrap;
}

function fracHTML(num, den) {
  return '<span style="display:inline-block; vertical-align:middle; text-align:center;' +
    'margin:0 3px;">' +
    '<span style="display:block; padding:0 5px 2px;">' + num + '</span>' +
    '<span style="display:block; padding:2px 5px 0; border-top:2px solid currentColor;">' +
      den + '</span></span>';
}

// s with a subscript A: "the side of a square whose area is A". The subscript is new in this
// chapter and it is the last piece of notation it introduces, so it is only ever written
// beside the picture that says what it means.
function sub(base, low) {
  return base + '<sub style="font-size:0.72em">' + low + '</sub>';
}

// The magic square as its hundred FLOWER SQUARES, halved one cut at a time, with the part
// still in play highlighted and the rest washed out (Sylvain). This is where "one sixteenth"
// stops being a name and becomes a number: the first two cuts are clean, and the third and
// fourth are not — they slice cells straight down the middle, which is exactly WHY the
// answer ends up with four figures after the dot.
//
// Each stage is a LIST of parts rather than one rectangle, because from the third cut on the
// kept ground is no longer whole cells. 'half' and 'quarter' pieces get their own tint, so
// "four whole ones, four halves, and that little corner" is something to count off the
// picture rather than a claim to accept.
const FCUT = [
  [{ x: 0, y: 0,   w: 10,  h: 10,  k: 'full' }],                     // one magic square: 100
  [{ x: 0, y: 0,   w: 5,   h: 10,  k: 'full' }],                     // a half: 50
  [{ x: 0, y: 5,   w: 5,   h: 5,   k: 'full' }],                     // a quarter: 25
  [{ x: 0, y: 8,   w: 5,   h: 2,   k: 'full' },                      // two full rows of five
   { x: 0, y: 7.5, w: 5,   h: 0.5, k: 'half' }],                     // ...and five HALVES
  [{ x: 0, y: 8,   w: 2,   h: 2,   k: 'full' },                      // four whole ones
   { x: 0, y: 7.5, w: 2,   h: 0.5, k: 'half' },                      // two halves on top
   { x: 2, y: 8,   w: 0.5, h: 2,   k: 'half' },                      // two down the side
   { x: 2, y: 7.5, w: 0.5, h: 0.5, k: 'quarter' }],                  // and the corner
];

function flowerCutEl(stage) {
  const N = 10, C = 44, S = N * C;
  const parts = FCUT[stage];
  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:16px auto 0; width:' + S + 'px;' +
    'height:' + S + 'px;' + EDGE;
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  // the hundred flower squares, as two gradient layers rather than a hundred nodes
  put('left:0; top:0; width:' + S + 'px; height:' + S + 'px; background:#d4edda;' +
      'background-image:repeating-linear-gradient(to right,#8aba8a 0 1px,transparent 1px ' +
        C + 'px),repeating-linear-gradient(to bottom,#8aba8a 0 1px,transparent 1px ' +
        C + 'px);');
  const x0 = Math.min.apply(null, parts.map(q => q.x));
  const y0 = Math.min.apply(null, parts.map(q => q.y));
  const x1 = Math.max.apply(null, parts.map(q => q.x + q.w));
  const y1 = Math.max.apply(null, parts.map(q => q.y + q.h));
  // The ground that has been cut away is WASHED, not removed: it is still the magic square
  // we started from, and the child has to be able to see how much of it is left.
  [[0, 0, N, y0], [0, y1, N, N - y1], [0, y0, x0, y1 - y0], [x1, y0, N - x1, y1 - y0]]
    .forEach(r => { if (r[2] > 0 && r[3] > 0)
      put('left:' + r[0] * C + 'px; top:' + r[1] * C + 'px; width:' + r[2] * C + 'px;' +
          'height:' + r[3] * C + 'px; background:rgba(244,240,228,0.74); z-index:2;'); });
  // ⚠️ Nothing is tinted before the first cut. The orange marks the piece we are FOLLOWING
  // down, and at stage 0 we are not following anything yet — we are looking at a magic
  // square, which is green in this project and has been since Chapter 1. Tinting it made it
  // khaki, and a magic square that is not green is a different object.
  if (stage > 0) {
    // ⚠️ Halves are tinted the SAME as whole cells: it is all the same ground, and three
    // shades of one orange inside a 110px square read as mud rather than as a count. The
    // grid lines already say which cells are whole and which were sliced — a half piece is
    // visibly half as tall (or half as wide) as its neighbours. Only the leftover QUARTER
    // gets its own shade, because at 22px it is the one piece a child could miss, and it is
    // the piece the next question is about.
    const TINT = { full: 'rgba(232,163,61,0.32)', half: 'rgba(232,163,61,0.32)',
                   quarter: 'rgba(232,163,61,0.62)' };
    parts.forEach(q => put('left:' + q.x * C + 'px; top:' + q.y * C + 'px;' +
      'width:' + q.w * C + 'px; height:' + q.h * C + 'px; z-index:3;' +
      'background:' + TINT[q.k] + ';'));
    // one outline round the lot: whatever shape it has, it is ONE piece of ground
    put('left:' + x0 * C + 'px; top:' + y0 * C + 'px; width:' + (x1 - x0) * C + 'px;' +
        'height:' + (y1 - y0) * C + 'px; box-sizing:border-box; z-index:4;' +
        'border:3px solid ' + REG.d.ink + '; pointer-events:none;');
  }
  return box;
}

// ONE QUARTER of a magic length, drawn VERTICALLY and as a LENGTH — Chapter 1's ticked line,
// not a filled rectangle (Sylvain). Everything in this stretch is about lengths, and a filled
// bar is how this project draws ground.
//
// The child lays pieces by clicking THE QUARTER, not the tray: the tray says what is left in
// hand, the target says where it goes. That is Chapter 2's hit-strip principle — the strip is
// generous (the whole height, 60px wide) because the difficulty here should never be motor.
// A drop on the same strip works too, for anyone who reaches for a piece first.
function quarterLayEl(o) {
  const lbl = (o && o.label) || t('c3_q_opt_quarter');
  const W = 460, PADT = 16;
  const box = document.createElement('div');
  box.style.cssText = 'position:relative; margin:20px auto 0; width:' + W + 'px;' +
    'height:' + (QBAR + PADT + 46) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    box.appendChild(d);
    return d;
  };
  const SX = 150;                                  // where the quarter stands
  // the quarter itself: a plain guide with a tick at each end, the way a length is shown
  put('left:' + (SX + 9) + 'px; top:' + PADT + 'px; width:2px; height:' + QBAR + 'px;' +
      'background:' + REG.d.ink + '; opacity:0.45;');
  [PADT, PADT + QBAR].forEach(y => put('left:' + (SX - 2) + 'px; top:' + (y - 1.5) + 'px;' +
      'width:24px; height:3px; background:' + REG.d.ink + ';'));
  // ⚠️ NOT bold() — that wraps its content in nowrap, and this caption has to wrap inside a
  // narrow gutter. It overflowed straight across the bar it was labelling.
  put('left:0; top:' + (PADT + QBAR / 2 - 26) + 'px; width:' + (SX - 26) + 'px;' +
      'text-align:right; font-size:14px; line-height:18px; font-weight:bold;' +
      'color:' + REG.d.ink + ';').innerHTML = lbl;

  let filled = 0, n = 0;
  const laid = [];
  box.__lay = size => {
    const rest = QBAR - filled;
    const over = size > rest + 0.5;
    const d = put('left:' + SX + 'px; top:' + (PADT + QBAR - filled - size) + 'px;' +
      'z-index:2; pointer-events:none;');          // load-bearing: a laid piece must not
    d.innerHTML = over                             // swallow the click that lays the next
      ? lengthSVG(false, size, size - rest, size)  // red above the end, green below it
      : lengthSVG(false, size, 0, size);
    filled += size; n++;
    laid.push([d, size]);
    return over;
  };
  // ⚠️ Taking the last piece back off. A piece that RUNS PAST is how the child finds out how
  // many fit — but it must then come off again, or the bar is left claiming more ground than
  // it has and anything laid after it sits in the wrong place.
  box.__undo = () => {
    if (!laid.length) return;
    const [d, size] = laid.pop();
    d.remove(); filled -= size; n--;
  };
  box.__count = () => n;
  // the hit strip: the whole run of the quarter and a good way either side of it
  const strip = put('left:' + (SX - 20) + 'px; top:' + (PADT - 14) + 'px; width:60px;' +
    'height:' + (QBAR + 28) + 'px; z-index:3; cursor:pointer;');
  box.__hit = fn => {
    strip.addEventListener('click', fn);
    strip.addEventListener('dragover', e => {
      e.preventDefault();
      strip.style.background = 'rgba(90,143,61,0.10)';
    });
    strip.addEventListener('dragleave', () => { strip.style.background = 'transparent'; });
    strip.addEventListener('drop', e => {
      e.preventDefault();
      strip.style.background = 'transparent';
      fn();
    });
  };
  box.__stripOff = () => { strip.remove(); };

  // ...and the tray, standing to the right: what is still in hand, drawn the same way
  const tray = put('left:' + (SX + 120) + 'px; top:' + PADT + 'px; width:' + (W - SX - 130) +
    'px; height:' + QBAR + 'px; display:flex; align-items:flex-end;');
  const cap = put('left:' + (SX + 120) + 'px; top:' + (PADT + QBAR + 8) + 'px;' +
    'width:' + (W - SX - 130) + 'px; font-size:13px; color:#8a8168;');
  box.__tray = (count, size, labelKey) => {
    tray.innerHTML = '';
    // An empty tray keeps its caption otherwise, so the last screen reads "still in hand:
    // hundredths of a magic length" over nothing at all.
    cap.innerHTML = count > 0 ? t(labelKey) : '';
    for (let i = 0; i < count; i++) {
      const pc = document.createElement('div');
      pc.style.cssText = 'display:inline-block; margin:0 16px 0 0; vertical-align:bottom;' +
        'cursor:grab;';
      pc.innerHTML = lengthSVG(false, Math.max(size, 22), 0, Math.max(size, 22));
      // Draggable as well as clickable: a piece can be carried onto the quarter, or the
      // quarter can be clicked and the next piece comes off the top of the pile. Whichever
      // the child reaches for first, the same thing happens.
      // ⚠️ Firefox will not start a drag without setData in dragstart.
      pc.draggable = true;
      pc.addEventListener('dragstart', e => {
        pc.style.opacity = '0.45';
        e.dataTransfer.setData('text/plain', 'piece');
      });
      pc.addEventListener('dragend', () => { pc.style.opacity = '1'; });
      tray.appendChild(pc);
    }
  };
  return box;
}

// ---------------------------------------------------------------------------
// PART F — the other fields, with the child running the method.
//
// ⚠️ 10 and 11 are NOT in this list (CHAPTER3_PLAN.md §8 D3, taking the recommendation).
// They are the only two whose sharing does not come out even — a sixth and a third — and
// the only two whose fence is not a whole number of magic lengths. They are NAMED at the
// end of the part rather than quietly dropped, which turns the hole in the list of twelve
// into a promise instead of an oversight, and previews Part A′'s "it never ends" one level
// up. Restoring them is one entry in this array.
// ⚠️ D3 REVERSED (Sylvain): 10 and 11 ship after all, so the list of twelve is finished and
// no field is left standing. They go LAST, not in numeric order, because they are the hard
// case: their share does not come out even. 1 ÷ 6 and 2 ÷ 6 never finish — which is Part A′'s
// own discovery one level up, and the reason the chapter has `≈` at all.
const F_AREAS = [2, 3, 6, 7, 8, 12, 10, 11];

// ⚠️ EVERY share in Part F stops at TENTHS (Sylvain), and one that does not come out even
// takes ONE MORE tenth rather than being cut finer. His reason is the good one: saying "and
// 75 hundredths" is something the child has to take on trust, where "seven tenths fit, the
// eighth sticks out, and we need more wire rather than less" is something they have just
// watched happen. It also makes one rule out of three, keeps every d̃ to a single decimal
// place, and keeps every answer an OVERestimate — which is what the fence rests on
// (√7 = 2.6458 against our 2.8, √10 = 3.1623 against 3.2, √11 = 3.3166 against 3.4).
const F_ROUNDED = { 7: 0.8, 10: 0.2, 11: 0.4 };

// n whole magic lengths fit, rem is the L left over, the L cuts into 2n strips one magic
// length long, and sharing rem between them gives the width. Every number asserted in
// ch3_numbers.py, against the chapter's own 5 → 2.25 → 9 as the control.
function fNums(A) {
  const n = Math.floor(Math.sqrt(A) + 1e-9);
  const rem = A - n * n;
  const k = 2 * n;
  const exact = rem / k;                       // the true share — what the PILE is drawn from
  const round = F_ROUNDED[A] != null;
  const dt = round ? F_ROUNDED[A] : exact;
  const s = n + dt, fence = 4 * s;
  // ⚠️ The fence IS the answer, whole or not (Sylvain). It used to be rounded up to the next
  // whole magic length here — "wire comes off the roll in whole lengths" — and that beat is
  // gone: three of the eight fences come out in tenths, and saying so is the honest end of
  // the calculation. It leaves the grand total in tenths too (120.6), which is Chapter 2's
  // own carry at ten tenths and something the child has done.
  return { A: A, n: n, sq: n * n, rem: rem, k: k, exact: exact, dt: dt, round: round,
           s: s, fence: fence, w: fence };
}

// The sharing, generalised off Part D's pile: k layers, each one magic length long and dt
// wide, coming to `rem` magic squares. Drawn once, on the first field only — after that the
// child has done it seven times and the scaffolding comes off (Chapter 2's Part F).
// ⚠️ `o` is additive: Part F's eight calls pass two arguments and are unchanged by
// construction. Part H labels the pile — every layer wearing its own name, and the magic
// square wearing its side — because there the pile is not a confirmation of a share already
// found but the thing the answer is read OFF. A pile whose layers are unnamed answers
// "how many are there" and nothing else; one that says what each layer IS, against a square
// that says how long its side is, answers "so how big is one of them".
function fPileEl(k, rem, o) {
  const opt = o || {};
  const LW = 96, H = rem * LW;                    // the pile is `rem` magic squares tall
  // ⚠️ `k` NEED NOT BE WHOLE (Sylvain): two strips of 2.8 cut into magic-length pieces give
  // five and a bit — and the chapter draws that pile TWICE, in this order. `cut` is the pile
  // as it comes off the strip: whole pieces a magic length long and a last one only `frac` of
  // one, at full e~ thickness. The default is the pile AFTER that last piece has been traded
  // for one a whole magic length long and `l̃` across, which is what makes the layers
  // comparable — and the step between the two is where `l̃ = 0.6 × e~` gets derived. Drawing
  // only the second hands the 0.6 over as a thickness with no reason behind it.
  const full = Math.floor(k + 1e-9), lay = H / k, frac = k - full, hasPart = frac > 1e-9;
  const cut = !!opt.cut;
  const cap = (hasPart && !cut) ? (1 - frac) * lay : 0;      // the dimmed part of the top
  const pileH = cut ? Math.ceil(k - 1e-9) * lay : cap + H;
  // gutters: the outer one carries the whole pile's height, the inner one every layer's name
  const LI = opt.layerLabel ? ((hasPart && opt.topLabel) ? 68 : 52) : 0;
  const LO = opt.leftLabel ? 128 : 0;
  const LPAD = LO + LI, RPAD = opt.rightLabel ? 170 : 0;
  const FOOT = opt.foot ? 40 : 0;
  // ⚠️ BOTH SHAPES STAND ON ONE BASELINE (Sylvain), and so do their phantoms: the ground the
  // pile makes is drawn at the BOTTOM of the magic square it does not quite fill, exactly as
  // the pile's solid part sits at the bottom of the e~ it does not quite fill. Boxes of
  // different heights are pushed down to a common floor rather than hung from a common top.
  const sqH = (rem < 1) ? LW : H;
  const BASE = Math.max(pileH, sqH);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; justify-content:center; align-items:flex-start;' +
    'gap:26px; margin-top:22px; flex-wrap:wrap;';
  const foot = (host, x, w) => {
    if (!opt.foot) return;
    const br = document.createElement('div');
    br.style.cssText = 'position:absolute; left:' + x + 'px; top:' + (BASE + 8) + 'px;' +
      'width:' + w + 'px; height:9px; box-sizing:border-box;' +
      'border:2.5px solid #5a5240; border-top:none;';
    host.appendChild(br);
    const lb = document.createElement('div');
    lb.innerHTML = opt.foot;
    lb.style.cssText = 'position:absolute; left:' + (x - 50) + 'px;' +
      'top:' + (BASE + 22) + 'px; width:' + (w + 100) + 'px; text-align:center;' +
      'font-size:14px; white-space:nowrap; color:#5a5240;';
    host.appendChild(lb);
  };
  const pile = document.createElement('div');
  pile.style.cssText = 'position:relative; width:' + (LW + LPAD) + 'px;' +
    'height:' + (BASE + FOOT) + 'px;';
  const TOP = BASE - pileH;                     // pushed down onto the common floor
  for (let i = 0; i < Math.ceil(k - 1e-9); i++) {
    const part = hasPart && i === 0;
    if (part) {
      // what a whole one would have been, behind it — the length it is short of when the pile
      // is drawn as cut, the thickness it is short of once it has been traded
      const g = document.createElement('div');
      g.style.cssText = 'position:absolute; box-sizing:border-box; opacity:0.45;' +
        'background:' + REG.b.fill + '; border:1.5px dashed ' + REG.b.ink + ';' +
        (cut
          ? 'left:' + (LPAD + frac * LW) + 'px; top:' + TOP + 'px;' +
            'width:' + ((1 - frac) * LW) + 'px; height:' + lay + 'px; border-left:none;'
          : 'left:' + LPAD + 'px; top:' + TOP + 'px; width:' + LW + 'px;' +
            'height:' + cap + 'px; border-bottom:none;');
      pile.appendChild(g);
    }
    const b = document.createElement('div');
    b.style.cssText = 'position:absolute; left:' + LPAD + 'px;' +
      'top:' + (TOP + (part && !cut ? cap : i * lay)) + 'px;' +
      'width:' + (part && cut ? frac * LW : LW) + 'px;' +
      'height:' + (part && !cut ? frac * lay : lay) + 'px; box-sizing:border-box;' +
      'background:' + REG.b.fill + '; border:1.5px solid ' + REG.b.ink + ';';
    pile.appendChild(b);
    // ⚠️ EVERY layer wears its label, not just one — the question on this screen is how many
    // there are, and a single label answers "one of these and some other things" (the same
    // call Part F's own pile had to make).
    if (opt.layerLabel) {
      const lb = document.createElement('div');
      lb.innerHTML = (part && opt.topLabel) ? opt.topLabel : opt.layerLabel;
      lb.style.cssText = 'position:absolute; left:' + LO + 'px;' +
        'top:' + (TOP + i * lay) + 'px; z-index:1;' +
        'width:' + (LI - 8) + 'px; height:' + lay + 'px; display:flex;' +
        'align-items:center; justify-content:flex-end;' +
        'font-size:' + Math.min(15, Math.max(9, lay - 3)) + 'px;' +
        'color:' + REG.b.ink + ';';
      pile.appendChild(lb);
    }
  }
  // the whole pile's own height, bracketed down its far left — what the layers add up to
  if (opt.leftLabel) {
    const solidTop = TOP + (cut ? 0 : cap);
    const bar = document.createElement('div');
    bar.style.cssText = 'position:absolute; left:' + (LO - 15) + 'px; top:' + solidTop +
      'px; width:11px; height:' + (BASE - solidTop) + 'px; box-sizing:border-box;' +
      'border:3px solid ' + REG.b.ink + '; border-right:none;';
    pile.appendChild(bar);
    const lb = document.createElement('div');
    lb.innerHTML = opt.leftLabel;
    lb.style.cssText = 'position:absolute; left:0; top:' +
      ((solidTop + BASE) / 2 - 11) + 'px; width:' + (LO - 22) + 'px; text-align:right;' +
      'font-size:15px; white-space:nowrap; color:' + REG.b.ink + ';';
    pile.appendChild(lb);
  }
  // the length of the part-piece, written over the part of it that is really there
  if (cut && hasPart && opt.cutLabel) {
    const cl = document.createElement('div');
    cl.innerHTML = opt.cutLabel;
    cl.style.cssText = 'position:absolute; left:' + LPAD + 'px; top:' + (TOP - 19) + 'px;' +
      'width:' + (frac * LW) + 'px; text-align:center; font-size:13px; white-space:nowrap;' +
      'color:' + REG.d.ink + ';';
    pile.appendChild(cl);
    pile.style.marginTop = '20px';
  }
  foot(pile, LPAD, LW);
  wrap.appendChild(pile);
  if (opt.pileOnly) return wrap;
  const eq = document.createElement('div');
  eq.innerHTML = '=';
  eq.style.cssText = 'font-size:24px; color:#5a5240;' +
    'margin-top:' + (BASE - H / 2 - 16) + 'px;';
  wrap.appendChild(eq);
  const sq = document.createElement('div');
  sq.style.cssText = 'position:relative; width:' + (LW + RPAD) + 'px;' +
    'height:' + (BASE + FOOT) + 'px;';
  const sqTop = BASE - sqH;
  if (rem < 1) {
    // the whole magic square it does not quite come to, standing ABOVE the ground it holds —
    // so "not quite one" is a thing to see, and the two phantoms line up with each other
    const gh = document.createElement('div');
    gh.style.cssText = 'position:absolute; left:0; top:' + sqTop + 'px; width:' + LW + 'px;' +
      'height:' + LW + 'px; box-sizing:border-box;' +
      'outline:1.5px dashed #b9ae94; outline-offset:-1px;';
    sq.appendChild(gh);
  }
  const bed = document.createElement('div');
  bed.style.cssText = 'position:absolute; left:0; top:' + (BASE - H) + 'px;' +
    'width:' + LW + 'px; height:' + H + 'px; overflow:hidden;';
  sq.appendChild(bed);
  for (let i = 0; i < Math.ceil(rem - 1e-9); i++) {
    const c = document.createElement('div');
    c.className = 'field-cell filled';
    // ⚠️ Clipped at the TOP now, not the bottom: the ground sits on the floor and the magic
    // square it does not fill runs up above it.
    c.style.cssText = 'position:absolute; left:0; bottom:' + (i * LW) + 'px;' +
      'width:' + LW + 'px; height:' + LW + 'px;';
    bed.appendChild(c);
  }
  // the magic square's own side, bracketed down its right — which is what the pile's height
  // is going to be measured against
  if (opt.rightLabel) {
    const bar = document.createElement('div');
    bar.style.cssText = 'position:absolute; left:' + (LW + 10) + 'px;' +
      'top:' + (BASE - H) + 'px; width:11px; height:' + H + 'px; box-sizing:border-box;' +
      'border:3px solid #3f7a34; border-left:none;';
    sq.appendChild(bar);
    const lb = document.createElement('div');
    lb.innerHTML = opt.rightLabel;
    lb.style.cssText = 'position:absolute; left:' + (LW + 30) + 'px;' +
      'top:' + (BASE - H / 2 - 13) + 'px; width:' + (RPAD - 34) + 'px; font-size:15px;' +
      'color:#3f7a34;';
    sq.appendChild(lb);
  }
  foot(sq, 0, LW);
  wrap.appendChild(sq);
  return wrap;
}

// ---------------------------------------------------------------------------
// PART G's pictures — the error meter.
//
// Every answer in this chapter overshoots by exactly the corner it threw away:
// s~ x s~ = a + d~ x d~, and that is an IDENTITY, not an estimate (asserted for every
// field in ch3_numbers.py). So the corner IS the error, and an error you can draw is an
// error a child can rank. Each field gets one magic square's outline with its own dropped
// corner sitting inside it, all twelve at ONE scale — so twelve errors are compared by
// looking rather than by arithmetic. The three perfect squares get an empty box: nothing
// was ever left over on those, so there was never a corner to throw away.
// ---------------------------------------------------------------------------

// The d~ the child actually WROTE, field by field, and the answer they got from it.
// ⚠️ Not a fresh calculation: these have to agree with what Part F put on screen, which is
// why they go through fNums (and so inherit F_ROUNDED for the two fields whose share never
// came out even). The three easy fields have no d~ at all — their sides are exact.
function dtFor(A) {
  if (EASY.indexOf(A) >= 0) return 0;
  if (A === CHAPTER_AREA) return 0.25;
  return fNums(A).dt;
}
function sTilFor(A) {
  if (EASY.indexOf(A) >= 0) return Math.round(Math.sqrt(A));
  if (A === CHAPTER_AREA) return 2.25;
  return fNums(A).s;
}
// ⚠️ The plural trap, again. lenLabel tests s === 1, so it has to be handed the NUMBER 1
// and not the string "1" that fmtNum returns — otherwise the area-1 field reads
// "1 magic lengths". Chapter 2 was caught by exactly this on a carry of one magic length.
function gLen(v) { return lenLabel(v === 1 ? 1 : fmtNum(v)); }

const ETIL = 'e\u0303';   // the shave — round 2's own number, the way d~ was round 1's
// ⚠️ `e` is Part H's own letter for the true gap between our answer and the truth. By the time
// the precision screens run, every field has had more than one answer, so it takes its round
// number like `s̃` and `ẽ` already do: `e₁` is the gap on the first answer, and `ẽ₁` is the only
// thing we can actually compute for it.
const E1 = () => sub('e', '1');
const ET1 = () => sub(ETIL, '1');
// The width the pile's last piece takes once it has been stretched to a full magic length
// (Sylvain). A side, so it wears `l` — Chapter 1's own letter for the short one.
const LTIL = 'l\u0303';

// ROUND 2, THE SHAVE (CHAPTER3_PLAN.md §7, D1). Our answer g is too big, so we take a border
// off two sides. The two strips run the WHOLE length of the square, so they overlap in the
// corner and count it twice; forget the corner (again) and the width that is left is
//     e~ = (g x g - a) / (2 x g)
// ⚠️ e~ < e, the TRUE shave — the mirror of round 1's d~ > d. We do not shave off enough, so
// the answer stays ABOVE the truth, which is what keeps "you can cut wire, you cannot stretch
// it" true after every round. And the identity survives whole: (g - e~)^2 = a + e~ x e~,
// exactly as s~^2 = a + d~ x d~. Same line, same corner, sign flipped. Asserted for every
// field in ch3_numbers.py.
function hNums(A) {
  const g = sTilFor(A), exc = g * g - A, k = 2 * g;
  const exact = exc / k;
  // Laying pieces TRUNCATES — and on a shave that is exactly the safe direction, because
  // shaving off less keeps the answer above the truth. (On a SHARE, Part F had to add one
  // more hundredth for the same reason. Same argument, opposite rounding: it is the answer
  // that must stay too big, not the piece.)
  const tenths = Math.floor(exact * 10 + 1e-9);
  // ⚠️ "Comes out even" means the exact share TERMINATES within two places — not that
  // 1/share is a whole number. `Number.isInteger(1 / (1/6))` is **true**, because IEEE
  // rounds it to exactly 6, and that quietly sent the area-8 field down the quarter-line
  // branch. Test the decimal, not its reciprocal.
  const even = Math.abs(exact * 100 - Math.round(exact * 100)) < 1e-9;
  const hund = Math.floor((exact - tenths / 10) * 100 + 1e-9);
  const written = Math.round(tenths * 10 + hund) / 100;
  return { g: g, exc: exc, k: k, exact: exact, tenths: tenths, hund: hund,
           written: written, even: even, s2: Math.round((g - written) * 100) / 100 };
}

// ⚠️ The quarter-line screens (hQuarters / hSeventyFive) are about a QUARTER, tick for tick
// — not about a shave that merely comes out even. The area-7 field's does come out even, at
// 0.15, and would have walked straight into a picture ruled into quarters.
function hIsQuarter(H) { return Math.abs(H.written - 0.25) < 1e-9; }

// ⚠️ The sign between `e~` and the number we write for it. Exact where the laying came
// out even (the area-7 field's 0.15), about where it was rounded down (the area-8
// field's sixth, written 0.16). Written once so no screen can disagree with another.
function eSign(H) { return H.even ? ' = ' : ' &asymp; '; }

// The excess, in eStock's own notation (Sylvain). Both call sites — hIntro for the first two
// fields, hSevenBand for the third — go through these, so the same screen cannot be lettered
// one way on one field and another way on the next.
// ⚠️ It is `ã₁`, our FIRST answer's square, and never `ã₂`: ã₂ is what the shave will give us,
// and this screen is measuring what we have to shave off.
function hSqEq(g) {
  return bold(nw(SUBA1 + ' = ' + SUB1 + '&sup2; = ' + fmtNum(g) + ' &times; ' + fmtNum(g) +
                 ' = ' + fmtNum(g * g)));
}
function hExcessEq(g, A) {
  return bold(nw(SUBA1 + ' &minus; a = ' + fmtNum(g * g) + ' &minus; ' + A));
}

const FLOWERN = 10;    // flower squares along a magic square's side (Chapter 2's unit)

// THE SAME THING SAID ON THE FIELDS THEMSELVES (Sylvain, 2026-08-22). The twelve laid out
// exactly as `aIntro` lays them — to scale, at aIntro's own 40px to the magic length — and each
// one wearing both halves of its mistake:
//
//   • a BLUE LINE under the field, starting at its left corner, ticked at each end, as long as
//     our answer `s̃₁`. It therefore reaches a little PAST the field's own edge, and that
//     overshoot is the error made visible against the ground it is an error about — no second
//     diagram, no scale to translate.
//   • the overshoot measured, just below, by a `>--<` dimension marker aligned with the blue
//     line's right-hand end.
//   • the AREA error, `ã₁ − a`, as a gold square in the field's TOP-RIGHT corner — the same
//     quantity the meter's boxes have carried all through Part G, now sitting on the field, and
//     directly above the end of the blue line, so both halves of the mistake are on one side.
//   • and underneath, the statement: `√a ≈ s̃₁ ± ẽ₁`.
//
// ⚠️ THE ARROWHEADS GO OUTSIDE THE SPAN, pointing in. Inside, they would need room the span has
// not got: the errors run from 10px down to half a pixel at this scale, and a marker that
// collapses on the small fields is a marker that says nothing exactly where the answer is best.
// Outside, `>` and `<` simply meet, which reads as "very nearly none" rather than as nothing.
//
// ⚠️ The marker measures `ẽ₁`, and the real overshoot is `e`, a whisker more — 0.7px on the
// worst field. That is the chapter's own `ẽ < e` drawn to scale, and it is the right direction:
// we never claim to be closer than we are.
const PFPX = 40;          // px to the magic length — aIntro's own scale, so the fields match
const PFARR = 6;          // how far each arrowhead reaches outside the span it marks
const PFBLUE = '#2f6fb5'; // our answer's colour since the quarter line
const PFDIM = 'opacity:0.4;';   // ...and what a round we have already improved on is drawn at

// `o`: { answers, dual, lengths, values, order } — see precFieldsEl.
function precFieldCellEl(A, o) {
  const opt = o || {};
  const lengths = opt.lengths !== false, values = opt.values !== false, dual = !!opt.dual;
  // ⚠️ `err` is the `>--<` and the `± ẽ` under it, and it is SEPARATE from the line: Part G's
  // meter draws the answer `s̃₁` as a length — which the child has had since Part F — but not how
  // far out it is, which is not derived until after Part H. Defaults to following `lengths`.
  const err = opt.err !== false && lengths;
  // ⚠️ `errFor` is a LIST of the fields that actually draw their mark and their `±`, while `err`
  // still governs the layout for every cell — so a screen can reveal one field's precision
  // without the other eleven giving away the screen that comes next, and without the twelve
  // captions ending up at two different heights.
  const showErr = err && (opt.errFor == null || opt.errFor.indexOf(A) >= 0);
  const SD = opt.sd, ED = opt.ed == null ? 4 : opt.ed;
  const g1 = sTilFor(A);                            // our first answer, always
  const g2 = (opt.answers && opt.answers[A] != null) ? opt.answers[A] : null;  // ...and our second
  const cur = g2 == null ? g1 : g2;                 // the answer now in force
  const side = Math.sqrt(A) * PFPX;      // the TRUE field, which is the one Marimon measured
  // ⚠️ THE GHOST ROW IS RESERVED ON EVERY CELL of a two-round screen, drawn or not — otherwise
  // the fields nobody went back for would sit 14px lower than the ones that were refined, and
  // twelve fields drawn to scale against each other have to stand on one line.
  // ⚠️ ANY NUMBER OF PALE LAYERS, not just one. `prev` gives this field's earlier answers,
  // oldest first; `ng` is how many rows the SCREEN reserves, so that twelve fields with
  // different histories still stand on one baseline and their captions land on one line.
  const prev = (opt.prev && opt.prev[A]) ? opt.prev[A] : ((dual && g2 != null) ? [g1] : []);
  const NG = opt.ng == null ? (dual ? 1 : 0) : opt.ng;
  const GH = lengths ? NG * 14 : 0;
  const GLINE = side + 12, LINE = GLINE + GH;
  const GMARK = LINE + 15, MARK = GMARK + NG * 12;
  const CAP = err ? MARK + 16 : (lengths ? LINE + 14 : side + 10);
  const W = lengths ? Math.max(side, g1 * PFPX) + PFARR : side;
  const cell = document.createElement('div');
  cell.style.cssText = 'position:relative; flex:none; width:' + W + 'px;' +
    'height:' + (CAP + (values ? 40 : 24)) + 'px;' +
    ((opt.focus && opt.focus.indexOf(A) < 0) ? PFDIM : '');
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    cell.appendChild(d);
    return d;
  };
  // the field, at its true size. Its boundary is an OUTLINE, painted outside the box, so the
  // drawn square is exactly as big as the ground and the blue line below can be compared with
  // its edge honestly (the rule written next to EDGE).
  put('left:0; top:0; width:' + side + 'px; height:' + side + 'px;' +
      'background:#f4f0e4; border-radius:3px;' + EDGE);

  // ⚠️ PALE IS WHERE WE WERE, SOLID IS WHERE WE ARE (Sylvain). On a two-round screen every mark
  // is drawn twice — the round-1 one pale and behind, the round-2 one solid and on top — so one
  // cell carries the whole history and the CURRENT answer is always the prominent thing. The
  // fields nobody went back for have no pale layer at all, which is what says so.
  const band = (v, ghost) => {
    if (!(v > 0)) return;
    const bp = v * PFPX;
    // ⚠️ `left: side - bp`, never `right: 0`: on a screen that draws the lengths the cell is
    // wider than the field (the blue line overshoots it, and the arrowhead reaches past that),
    // so `right` would anchor to the cell.
    put('left:' + (side - bp) + 'px; top:0; width:' + bp + 'px; height:' + bp + 'px;' +
        'box-sizing:border-box; background:' + REG.d.fill + ';' +
        'outline:1.5px solid ' + REG.d.ink + '; outline-offset:-1px;' +
        'z-index:' + (ghost ? 2 : 3) + ';' + (ghost ? PFDIM : ''));
  };
  // the AREA error, in the field's TOP-RIGHT corner — the corner the four-region picture puts
  // it in, and, where the lengths are drawn, directly above the end of the blue line and the
  // `>--<` beneath it, so the three marks stack in one column.
  prev.forEach(v => band(bandSide(v, A), true));
  band(bandSide(cur, A), false);

  if (lengths) {
    // our answer as a LENGTH: from the field's left corner, ticked at both ends
    const line = (v, y, ghost) => {
      const w = v * PFPX, dim = ghost ? PFDIM : '';
      put('left:0; top:' + y + 'px; width:' + w + 'px; height:3px;' +
          'background:' + PFBLUE + ';' + dim);
      put('left:0; top:' + (y - 4) + 'px; width:2px; height:11px;' +
          'background:' + PFBLUE + ';' + dim);
      put('left:' + (w - 2) + 'px; top:' + (y - 4) + 'px; width:2px; height:11px;' +
          'background:' + PFBLUE + ';' + dim);
    };
    prev.forEach((v, i) => line(v, GLINE + i * 14, true));
    line(cur, LINE, false);

    // ...and how far past the field's edge each one reaches, marked off against its own line
    const mark = (v, from, y, ghost) => {
      const ew = v * PFPX;
      if (!(ew > 0)) return;
      const gw = from * PFPX, x0 = gw - ew, ink = REG.d.ink, dim = ghost ? PFDIM : '';
      put('left:' + x0 + 'px; top:' + (y + 3) + 'px; width:' + ew + 'px; height:2px;' +
          'background:' + ink + ';' + dim);
      put('left:' + (x0 - PFARR) + 'px; top:' + y + 'px; width:0; height:0;' +
          'border-left:' + PFARR + 'px solid ' + ink + ';' +
          'border-top:4px solid transparent; border-bottom:4px solid transparent;' + dim);
      put('left:' + gw + 'px; top:' + y + 'px; width:0; height:0;' +
          'border-right:' + PFARR + 'px solid ' + ink + ';' +
          'border-top:4px solid transparent; border-bottom:4px solid transparent;' + dim);
    };
    if (showErr) {
      prev.forEach((v, i) => mark(lErr(A, v), v, GMARK + i * 12, true));
      mark(lErr(A, cur), cur, MARK, false);
    }
  }

  // ⚠️ Where the lengths are drawn the caption is two lines and allowed to overhang:
  // `√2 ≈ 1.5 ± 0.0833` is twice the width of the area-2 field. Split, each line is about as
  // wide as the smallest cell. Without them there is only ever one line to write.
  const e = lErr(A, cur), sign = dtFor(A) ? ' &asymp; ' : ' = ';
  const cap = put('left:-16px; top:' + CAP + 'px; width:' + (W + 32) + 'px;' +
                  'text-align:center; font-size:13px; line-height:18px; color:#5a5240;' +
                  'white-space:nowrap;');
  cap.innerHTML = !values ? sqrtHTML(A)
    : (err
        ? '<div>' + sqrtHTML(A) + sign + fmtNum(cur, SD) + '</div>' +
          '<div>' + ((showErr && e > 0) ? '&plusmn; ' + fmtNum(e, ED) : '&nbsp;') + '</div>'
        : sqrtHTML(A) + sign + fmtNum(cur, SD));
  return cell;
}

// The twelve fields, laid out exactly as `aIntro` lays them, each carrying its own error.
//   order    the order to lay them in (default: the order the child met them)
//   answers  field -> the answer now in force, where a second round has replaced the first
//   dual     draw round 1 pale behind the current answer as well as the current one solid
//   prev     field -> its earlier answers, oldest first, all drawn pale (generalises `dual`)
//   lengths  draw the blue s̃ line (default true)
//   err      draw the `>--<` under it and the `± ẽ` in the caption (default: follows `lengths`)
//   values   write the answer in the caption as well as the root (default true)
//   errFor   restrict the `>--<` and the `±` to these fields (default: all of them)
//   focus    a list: every other field fades
//   sd / ed  decimals for the answer and for its precision (default: fmtNum's own, and 4).
//            The third round needs SEVEN of each, because by then the shave is a millionth.
function precFieldsEl(o) {
  const opt0 = o || {};
  const order = opt0.order || AREAS;
  // the tallest history on this screen decides how many rows EVERY cell reserves
  const ng = opt0.prev
    ? order.reduce((m, A) => Math.max(m, (opt0.prev[A] || []).length), 0)
    : (opt0.dual ? 1 : 0);
  const opt = Object.assign({}, opt0, { ng: ng });
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center;' +
    'gap:18px; margin-top:6px;';
  // Rows of four, bottom-aligned — so twelve different-sized fields read as a row rather than
  // as a staircase, and every caption lands on one line. allFieldsEl's own rule.
  for (let i = 0; i < order.length; i += 4) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:flex-end; justify-content:center; gap:26px;';
    order.slice(i, i + 4).forEach(A => row.appendChild(precFieldCellEl(A, opt)));
    wrap.appendChild(row);
  }
  return wrap;
}

// Biggest bite first; ties keep the natural order, so the area-3 field comes before the
// area-8 one — which is also the order the child met them in.
// ...and the ranking is by that same real error, for the same reason.
const gErr = A => bandSide(sTilFor(A), A);
// ⚠️ THE FIELDS ARE NEVER RE-ORDERED BY THE SIZE OF THE ERROR (Sylvain, 2026-08-22). They keep
// the order the child met them in, on every screen that draws them — which is what makes "not
// one of the others has moved a hair" a thing the child can check by comparing two consecutive
// screens. Sorting made the whole board jump every time, and on fields drawn to scale it also
// scrambled the one arrangement that reads by itself: smallest to biggest.

// The two the child can catch UNAIDED, and the reason they are catchable rather than merely
// bad: their d~ came out a whole magic length, so s~ is a whole number, so squaring it lands
// on a Chapter 1 table entry with a verdict the child can read. Every other bad answer
// squares to something no table has (2.75 x 2.75), and would have to be taken on trust.
// Asserted in ch3_numbers.py, where it is also shown these are the two biggest corners.
const G_BAD = AREAS.filter(A => dtFor(A) > 0 && Number.isInteger(sTilFor(A)));

// THE ERROR AS A LENGTH (CHAPTER3_PLAN.md §13). Every box on the meter is an AREA, and Eliel
// buys wire by the LENGTH; the conversion is the chapter's own move one more time, dropping
// the corner the two strips share:
//     ã − a ≈ 2 × s̃ × e   and therefore   e ≈ (ã − a) / (2 × s̃)
// ⚠️ It always UNDERSTATES, because ã − a = e × (s̃ + s) exactly and s̃ + s < 2 × s̃. That is the
// same fact as ẽ < e, and it is why every answer stays above the truth. Asserted in
// ch3_numbers.py.
// ⚠️ It is also EXACTLY Part H's own shave, `hNums(A).exact` — which is the closing point of
// the chapter: how far out we are, and how much to take off next, are one number. This is the
// closing PRECISION statement, and it is deliberately NOT what chooses the fields (Sylvain,
// 2026-08-22): the child meets it only after Part H, so Part H picks off the meter it has.
const lErr = (A, g) => { const s = (g == null ? sTilFor(A) : g); return s ? (s * s - A) / (2 * s) : 0; };

// The field with the biggest corner left once G_BAD have been refined — the child finds it
// off the meter, and it comes off the numbers rather than being written down here.
const hPick = done => AREAS.filter(A => done.indexOf(A) < 0 && gErr(A) > 0)
  .sort((x, y) => gErr(y) - gErr(x))[0];
const H_THIRD = hPick(G_BAD);
const H_FOURTH = hPick(G_BAD.concat([H_THIRD]));
// ⚠️ THE CHAPTER REFINES FOUR, AND THERE CANNOT BE A FIFTH off this meter: once those four are
// done, three fields are TIED at the top (2, 6 and 12 all threw away a corner of 0.25), and
// "which is worst now" then has no answer a picture can give. That is the tied-boxes trap, and
// it is the reason four is where Part H stops.
const H_DONE4 = G_BAD.concat([H_THIRD, H_FOURTH]);
// `H_SHOW` is a fifth field the chapter does NOT refine — the one the closing precision formula
// is tried on, chosen because its numbers let the child do the division themselves (0.25 shared
// into 5). It has to stay unrefined, or that screen has no field to stand on.
const H_SHOW = AREAS.filter(A => H_DONE4.indexOf(A) < 0 && gErr(A) > 0 && hNums(A).even)
  .sort((x, y) => gErr(y) - gErr(x))[0];
const H_ROUNDS = H_DONE4;

// Part E's own mark-up, for any field: the WHOLE side (s~ = 2) with the two pieces it
// comes apart into bracketed inside it — Chapter 2's L = a + b, on both sides, because on a
// square the two are the same and seeing the identical mark-up twice is what says so.
// eBr() is this with the area-5 field's numbers hard-coded; this is the same object built
// from whichever field is current.
function gBr(A) {
  const n = Math.floor(Math.sqrt(A) + 1e-9);
  return { lo: fmtNum(n), hi: '<strong>' + fmtNum(dtFor(A)) + '</strong>', both: true,
           whole: '<strong>' + SUB1 + ' = ' + fmtNum(sTilFor(A)) + '</strong>' };
}

// The four terms with THIS field's numbers in them, in the order they sit on the ground.
// ⚠️ Every one of the four is a whole number on the two fields Part G checks — that is what
// D9's selection rule actually buys, and it is why the child can run the whole identity here
// with nothing but Chapter 1's table. The two strips are written the same way round as Part
// E writes them, so the line reads as the one the child already knows.
function gTerms(A) {
  const n = Math.floor(Math.sqrt(A) + 1e-9);
  const N = fmtNum(n), D = fmtNum(dtFor(A));
  return [['a', N + ' &times; ' + N], ['b', N + ' &times; ' + D],
          ['c', N + ' &times; ' + D], ['d', D + ' &times; ' + D]];
}

// The values behind those terms, so no screen has to work them out by hand.
function gVals(A) {
  const n = Math.floor(Math.sqrt(A) + 1e-9), d = dtFor(A);
  return { n: n, d: d, blk: n * n, strip: n * d, strips: 2 * n * d,
           corner: d * d, sum: sTilFor(A) * sTilFor(A) };
}

// The picture every screen of the check draws, so they cannot drift: the square of our
// answer, cut into the four, both sides bracketed, with the legend under it — and the same
// `focus` moving through both at once, which is what ties a chip to its ground.
function gCheckStage(A, focus) {
  const wrap = document.createElement('div');
  wrap.appendChild(squareSplitEl({
    side: sTilFor(A), cut: true, squares: true, brackets: gBr(A), focus: focus,
  }));
  // ⚠️ The bracketed stage is BPADL wider than the square and centres as a whole, so the
  // square's own centre sits BPADL/2 right of the page's. A legend centred on the page would
  // therefore sit off to the left of the picture it labels — and a chip has to line up with
  // the ground it is coloured after, or the colours are doing the work alone. Padding a
  // centred row on the left by BPADL moves its centre by exactly BPADL/2.
  const leg = regLegend(focus, gTerms(A));
  leg.style.paddingLeft = BPADL + 'px';
  wrap.appendChild(leg);
  return wrap;
}


// PART H's ONE NEW PICTURE (Sylvain) — and it is what turns the shave from an idea into a
// piece of ground. The TRUE field is drawn inside the square our answer describes, sharing
// its bottom-left corner, and the band between the two outlines IS our error: exactly
// s~ x s~ - a of it, which on both of Part H's fields is one whole magic square.
//
// The left side then carries three ranks of bracket, outermost first: s~ (our answer),
// s (the true side, in the middle), and inside them s_A and d~ — so the child can see at one
// glance that s sits between s_A and s~, and that d~ overshoots it. The gap at the top is the
// difference, and it wears its own bracket on the right.
//
// ⚠️ The TRUE field wears the solid boundary every field in this chapter has had, and OUR
// square is DASHED: the field is real ground and our answer is a claim about it. Getting that
// the other way round would make the claim look like the land.
const HPAD = 246;                        // room for three ranks of bracket
const HRANK = [26, 100, 174];            // ...at these offsets back from the square's edge
// ⚠️ `o.round2` draws the SAME picture for the second answer: the true field inside the
// square of side s~2 instead of s~, so the band between them is the new error and the child
// can see it has all but vanished. The inner brackets change with it — s~2 comes apart into
// the whole magic length and the three quarters they just worked out, not into s_A and d~ —
// and there is no bracket on the gap at all, because at 1.4px there is nothing to bracket.
// That absence is honest, and it is half of what the screen says.
function hFrameEl(A, o) {
  const opt = (typeof o === 'string' || o == null) ? { band: o } : o;
  const bandLabel = opt.band;
  const H = hNums(A);
  const S = (opt.round2 ? H.s2 : H.g) * PX;
  const T = Math.sqrt(A) * PX, B = Math.floor(Math.sqrt(A) + 1e-9) * PX;
  const stage = document.createElement('div');
  stage.style.cssText = 'position:relative; margin:10px auto 0;' +
    'width:' + (HPAD + S + 90) + 'px; height:' + (S + 44) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    stage.appendChild(d);
    return d;
  };
  // our answer's square: the excess colour all over, and a dashed edge because it is a claim
  put('left:' + HPAD + 'px; top:0; width:' + S + 'px; height:' + S + 'px;' +
      'box-sizing:border-box; background:' + REG.d.fill + ';' +
      'outline:3px dashed ' + REG.d.ink + '; outline-offset:0; border-radius:3px;');
  // the true field, sharing the bottom-left corner. Nothing is drawn between the two
  // outlines, so the band reads as ONE bent piece rather than as three — which is what it is,
  // and cutting it up is the next screen's job (Part B's own move).
  put('left:' + HPAD + 'px; top:' + (S - T) + 'px; width:' + T + 'px; height:' + T + 'px;' +
      'box-sizing:border-box; background:#f4f0e4; border-radius:3px;' + EDGE);
  // the whole magic squares the child laid, still in the corner, wearing their letter
  const n = Math.round(B / PX);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const cell = document.createElement('div');
    cell.className = 'field-cell filled';
    cell.style.cssText = 'position:absolute; left:' + (HPAD + c * PX) + 'px;' +
      'top:' + (S - (r + 1) * PX) + 'px; width:' + PX + 'px; height:' + PX + 'px;' +
      'z-index:2; pointer-events:none;';
    stage.appendChild(cell);
  }
  // ⚠️ The label in the middle is the FIELD's own number, `a` — Marimon's record, and the
  // one thing this chapter was ever given (Sylvain). It sits inside the true square because
  // that is the ground it describes; the block underneath is a piece of it and already says
  // what it is worth through its own `s_A` bracket. Its colour is `a`'s colour throughout
  // the chapter rather than the block's green, so the label belongs to the field and not to
  // the magic squares it happens to land on.
  put('left:' + HPAD + 'px; top:' + (S - T) + 'px; width:' + T + 'px; height:' + T + 'px;' +
      'display:flex; align-items:center; justify-content:center; font-size:20px;' +
      'color:#5a5240; z-index:3; pointer-events:none;')
    .innerHTML = '<strong>a = ' + A + '</strong>';

  // a bracket up the left, at one of the three ranks, with its label right-aligned into the
  // gap immediately outside it — the same rule squareSplitEl's vbar follows.
  const vb = (rank, yTop, h, col, txt) => {
    const x = HPAD - HRANK[rank];
    put('left:' + x + 'px; top:' + yTop + 'px; width:11px; height:' + h + 'px;' +
        'box-sizing:border-box; z-index:3; border:3px solid ' + col + '; border-right:none;');
    const left = rank + 1 < HRANK.length ? HPAD - HRANK[rank + 1] + 11 : 0;
    put('left:' + left + 'px; top:' + (yTop + h / 2 - 13) + 'px;' +
        'width:' + (x - 6 - left) + 'px; text-align:right; white-space:nowrap; z-index:3;' +
        'font-size:17px; color:' + col + ';').innerHTML = txt;
  };
  if (opt.round2) {
    // ⚠️ Short labels: the inner gutter is 57px and "1 magic length" is ~100, so it printed
    // across the field. `1` and `0.75` are enough beside an outer bracket reading s̃₂ = 1.75.
    // ⚠️ And BOTH are blue. Gold has meant the shave all through Part H; these two are the
    // pieces of our ANSWER, exactly as they were on the quarter line.
    // ⚠️ The inner pair is drawn only where the child actually BUILT a whole-plus-fraction
    // split — the area-3 field's 1 and 0.75, off its quarter line. The area-8 field got its
    // answer by taking a tenth straight off, so `1` and `1.9` there would be an arbitrary cut
    // dressed up as a decomposition.
    if (H.even) {
      vb(0, S - PX, PX, '#2f6fb5', '<strong>1</strong>');
      vb(0, 0, S - PX, '#2f6fb5', '<strong>' + fmtNum(H.s2 - 1) + '</strong>');
    }
    vb(1, S - T, T, '#3f7a34', '<strong>s</strong>');
    vb(2, 0, S, '#3a3a3a', '<strong>' + SUB2 + ' = ' + fmtNum(H.s2) + '</strong>');
  } else {
    vb(0, S - B, B, '#2f6fb5', '<strong>' + SUB0 + ' = ' + fmtNum(n) + '</strong>');
    vb(0, 0, S - B, REG.d.ink, '<strong>' + DTIL + ' = ' + fmtNum(dtFor(A)) + '</strong>');
    vb(1, S - T, T, '#3f7a34', '<strong>s</strong>');
    vb(2, 0, S, '#3a3a3a', '<strong>' + SUB1 + ' = ' + fmtNum(H.g) + '</strong>');
    // and the difference itself, on the right, pointing at the gap it measures
    const gx = HPAD + S + 10;
    put('left:' + gx + 'px; top:0; width:11px; height:' + (S - T) + 'px;' +
        'box-sizing:border-box; z-index:3; border:3px solid ' + REG.d.ink + ';' +
        'border-left:none;');
    put('left:' + (gx + 20) + 'px; top:' + ((S - T) / 2 - 13) + 'px; white-space:nowrap;' +
        'font-size:17px; z-index:3; color:' + REG.d.ink + ';').innerHTML =
        '<strong>' + E1() + '</strong>';
  }

  // ⚠️ The caption is the ANSWER to a question the child is about to be asked, so it is
  // absent until it is asked, carries "?" while it is open, and only then says what the band
  // is worth. Printing "1 magic square" from the start would answer it in the picture.
  if (bandLabel) {
    put('left:' + HPAD + 'px; top:' + (S + 12) + 'px; width:' + S + 'px; text-align:center;' +
        'font-size:15px; color:' + REG.d.ink + ';').innerHTML = bandLabel;
  }
  return stage;
}

// THE BAND, LAID OUT FLAT — Part C's `cJoin` one round later, and the same grammar
// (`pieceRow`). Two strips, each the whole side of our square long, less the little corner
// they both contain:  s~ x e  +  s~ x e  -  e x e  =  one magic square.
//
// Then the corner is crossed out and the row becomes  s~ x e~ + s~ x e~ = one magic square,
// which is `2 x s~ x e~ = 1`. ⚠️ The strips come out very slightly NARROWER, not wider: with
// nothing subtracted they have to be smaller to still come to one. That is `e~ < e` drawn to
// scale — 1.4px on this field — and it is why the answer stays above the truth.
// Three states, and the middle one is the argument (Sylvain):
//   'full'    s~ x e  +  s~ x e  -  e x e   =  one magic square      (exact, and true)
//   'approx'  s~ x e  +  s~ x e              ~= one magic square      (corner gone, e kept)
//   'tilde'   s~ x e~ +  s~ x e~             =  one magic square      (exact again, narrower)
// Dropping the corner but KEEPING the height turns the equals into an `is about`, and the
// row is now too big by exactly the corner we crossed out. That is what makes `e~ < e`
// something the child can reason to rather than be told: the new strips have to come to
// exactly one magic square where the old ones came to more, and they are the same length.
function hUnrolledEl(A, mode) {
  const H = hNums(A);
  const til = mode === 'tilde';
  const w = (til ? H.exact : H.g - Math.sqrt(A)) * PX;
  const E = til ? ET1() : 'e';
  const R = pieceRow(), plus = R.plus, piece = R.piece, GUT = R.GUT;
  const side = fmtNum(H.g), area = SUB1 + ' &times; ' + E;
  const long = bold(SUB1 + ' = ' + side);
  piece(H.g * PX, w, 'b', area, long, bold(E), H.g);
  plus('+');
  piece(H.g * PX, w, 'c', area, long, bold(E), H.g);
  // ⚠️ On the dropped row the corner is kept as an INVISIBLE hole, so the "= one magic
  // square" lands under the one on the row before it. Part C's `align` does exactly this,
  // and for exactly the same reason: both rows have the same square on the right, and that
  // is half the argument.
  const gone = plus('&minus;');
  const corner = piece(w, w, 'd', E + ' &times; ' + E, bold(E), bold(E));
  if (mode !== 'full') { gone.style.visibility = 'hidden'; corner.style.visibility = 'hidden'; }
  plus(mode === 'approx' ? '&asymp;' : '=');
  const SQ = R.square(H.exc), one = SQ.one, SG = SQ.GUT;
  SQ.smark('left:' + SG + 'px; top:' + (PX + 5) + 'px; width:' + PX + 'px; height:7px;' +
           'box-sizing:border-box; border:2px solid #8a8168; border-top:none;',
           '1', 'left:' + (SG - 20) + 'px; top:' + (PX + 13) + 'px; width:' + (PX + 40) +
           'px; text-align:center;');
  const cap = document.createElement('div');
  cap.innerHTML = H.exc === 1 ? t('c3_h_one_sq')
                : t('c3_h_band_sq', { v: fmtNum(H.exc) });
  cap.style.cssText = 'position:absolute; left:' + (SG - 20) + 'px; top:' + (PX + 32) +
    'px; width:' + (PX + 40) + 'px; text-align:center; font-size:14px; white-space:nowrap;' +
    'color:#3f7a34;';
  one.appendChild(cap);
  R.wrap.appendChild(one);
  return R.wrap;
}

// THE QUARTER LINE — how `2 - 0.25` actually gets done (Sylvain). It is the one piece of
// arithmetic in Part H a child could stall on, and doing it on the ground is what makes the
// road between quarters and decimals a road they have walked rather than a rule.
//
// The whole side laid out flat, ticked into quarters: shave one off, count what is left (7),
// find the whole magic length hiding in it (4 of them), and the leftover is 3 quarters.
//
// ⚠️ Only works where e~ is one over a whole number — 0.25 is a quarter, so 4 to the magic
// length. That is true on the area-3 field, which is the only field these screens run on;
// the area-8 field's shave is 0.16 and gets the short route instead.
const QPX = 150, QLH = 30;               // a magic length, and the bar's thickness
function hQuartersEl(A, stage, o) {
  const opt = o || {};
  const H = hNums(A);
  // ⚠️ The sub-ticks are drawn only where e~ REALLY divides a magic length — the area-3
  // field's quarter does, the area-8 field's 0.16 does not (six of them come to 0.96). That
  // field gets ticks at the whole magic lengths and nothing finer, which is all its question
  // needs. And the shaved piece is drawn at e~ itself rather than as "one unit", so it comes
  // out right on both.
  // ⚠️ Sub-ticks only where e~ REALLY divides a magic length. `H.even` is not that test —
  // the area-7 field's 0.15 comes out even and is not one-seventh of anything, and asking
  // round(1/0.15) for it ruled the bar into sevenths, which is a picture that lies.
  const inv = 1 / H.written;
  const per = Math.abs(inv - Math.round(inv)) < 1e-9 ? Math.round(inv) : 1;
  const QW = QPX / per;
  const keptPx = (stage === 'plain' ? H.g : H.g - H.written) * QPX;
  const shavePx = H.written * QPX;
  const total = H.g * per, kept = stage === 'plain' ? total : total - 1;
  const W = H.g * QPX, PADB = (o && o.pieces) ? 126 : 86;
  const stg = document.createElement('div');
  stg.style.cssText = 'position:relative; margin:22px auto 0;' +
    'width:' + (W + 60) + 'px; height:' + (QLH + PADB) + 'px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    stg.appendChild(d);
    return d;
  };
  const X0 = 30;
  // the part still there, and the quarter that has gone
  put('left:' + X0 + 'px; top:0; width:' + keptPx + 'px; height:' + QLH + 'px;' +
      'box-sizing:border-box; background:#dbe7f5; border:2px solid #2f6fb5;');
  if (stage !== 'plain') {
    put('left:' + (X0 + keptPx) + 'px; top:0; width:' + shavePx + 'px;' +
        'height:' + QLH + 'px; box-sizing:border-box;' +
        'outline:2px dashed ' + REG.d.ink + '; outline-offset:-2px;' + HATCH);
  }
  // every quarter ticked, and the whole magic lengths ticked heavier — so "how many whole
  // ones are hiding in seven quarters" is a thing to look at rather than to divide
  for (let i = 1; i < total; i++) {
    const whole = i % per === 0;
    put('left:' + (X0 + i * QW - (whole ? 1.5 : 1)) + 'px;' +
        'top:' + (whole ? -6 : 4) + 'px; width:' + (whole ? 3 : 2) + 'px;' +
        'height:' + (QLH + (whole ? 12 : -8)) + 'px;' +
        'background:' + (whole ? '#3a3a3a' : '#2f6fb5') + ';' +
        (whole ? '' : 'opacity:0.55;'));
  }
  const bracket = (x, w, col, txt, row) => {
    const y = QLH + 12 + row * 40;
    put('left:' + (X0 + x) + 'px; top:' + y + 'px; width:' + w + 'px; height:10px;' +
        'box-sizing:border-box; border:3px solid ' + col + '; border-top:none;');
    put('left:' + (X0 + x - 40) + 'px; top:' + (y + 14) + 'px; width:' + (w + 80) + 'px;' +
        'text-align:center; white-space:nowrap; font-size:15px; color:' + col + ';')
      .innerHTML = txt;
  };
  // ⚠️ Two stages, not one: 'first' brackets the whole magic length and leaves the rest bare,
  // because the very next question is how many quarters are left BESIDE it — and a bracket
  // reading `3 × 0.25` answers it. 'grouped' is the reveal. (Lesson 17, on a bracket.)
  // ⚠️ And both brackets are BLUE. Gold has meant the shave all through Part H, and the
  // quarter that left is hatched in gold two pixels away; these three are part of the ANSWER.
  if (stage === 'first' || stage === 'grouped') {
    bracket(0, QPX, '#2f6fb5', bold(gLen(1)), 0);
    if (stage === 'grouped') bracket(QPX, keptPx - QPX, '#2f6fb5',
            bold(nw((kept - per) + ' &times; ' + fmtNum(H.written))), 0);
  } else if (opt.pieces) {
    // ⚠️ The two pieces the subtraction is ABOUT, bracketed on the ground they sit on: the
    // shave at the far end and what is left of the last magic length beside it, with the
    // whole side below them both. The `?` carries the chapter's own ordering — a question
    // mark stands for a quantity of something, and it becomes the number when the child has
    // earned it.
    // ⚠️ ceil, not g − 1: on the area-7 field s̃₁ is 2.75, so the piece the shave comes
    // out of is the 0.75 after the second whole magic length, not a magic length at all.
    // Identical on every field whose s̃₁ is whole, which is both of the first two.
    const x0 = (Math.ceil(H.g) - 1) * QPX;
    bracket(x0, keptPx - x0, '#2f6fb5', opt.frac, 0);
    bracket(keptPx, shavePx, REG.d.ink, opt.shave, 0);
    bracket(0, W, '#3a3a3a', bold(SUB1 + ' = ' + fmtNum(H.g)), 1);
  } else {
    bracket(0, W, '#3a3a3a', bold(SUB1 + ' = ' + fmtNum(H.g)), 0);
  }
  return stg;
}

// The error, before and after — the same box the meter uses, at a size worth looking at.
