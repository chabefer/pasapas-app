    c3_a_intro2: "We could go out and measure them all out, but we could instead use Marimon’s records. For each field, he noted its area in magic squares, so that we know exactly how many seeds we need to buy. Unfortunately, Marimon did not record their side length, so that we do not know how much wire to buy.",

    // ---- Part E: check it, then cash it in ----------------------------
    c3_e_ch1: "Let’s check what we found: {sqrt_a} &asymp; {s}. And first, let’s give that answer of ours a name of its own: {stil} = {s}. The little wave on top is there to say <em>this is our answer</em> — not the true side of the field, which we never did manage to catch.",
    c3_e_ch2: "Now, if our answer is any good, then {stil} multiplied by itself ought to come out at about {a}, oughtn’t it? Let’s call that {atil}: {eq_a}. Then we can go and see how far {atil} really is from {a}.",

    c3_e_16_4: "Twenty-five. But a quarter is not a sixteenth — we have to halve it <strong>twice more</strong>. Let’s try just once, and see what happens.",
    c3_e_16_btn2: "Cut it in half again!",
    c3_e_16_5: "Ah. Look what that did. To cut twenty-five in half I had to slice a whole row of flower squares <strong>down the middle</strong>: two full rows of five, and a row of five <strong>halves</strong>. Hmm.",
    c3_e_16_btn3: "Halve it once more!",
    c3_e_16_6: "And again. Now there are <strong>four</strong> whole flower squares, <strong>four halves</strong> along two of its edges, and one little corner smaller still. Two halves make a whole, so those four halves make two full flower squares.",
    c3_e_16_q3: "So how many <strong>whole</strong> flower squares does the sixteenth come to?",
    c3_e_16_h3: "Four whole ones, and four halves make two more.",
    c3_e_16_7: "Six. And then that little corner in the darker shade, still left over — it is <strong>a quarter</strong> of a flower square. We have written a quarter before: it is exactly what {d} turned out to be, a quarter of a magic length.",
    c3_e_16_q4: "So how do we write a quarter of a flower square?",
    c3_e_16_h4: "Two tenths and five hundredths.",
    c3_e_16_q5: "So a sixteenth of a magic square is {sum} flower squares. How many flower squares is that in all?",
    c3_e_16_h5: "Six, and a quarter more.",
    c3_e_16_8: "{n} flower squares. Now back to magic squares. A flower square is a <strong>hundredth</strong> of a magic square, so we move the dot <strong>two places</strong>, the way we always do. Careful — this time the number already has something after the dot, so the answer will have <strong>four</strong> figures after it.",
    c3_e_16_q6: "How much is one sixteenth of a magic square, written as a number?",
    c3_e_16_h6: "Move the dot two places to the left, and slide a 0 in on the way.",
    c3_e_16_9: "There it is. And now we can write the whole thing out: {chain}",
    c3_e_16_q7: "So how much is {atil}?",
    c3_e_16_h7: "Five, and {q} more.",
    c3_e_16_10: "<strong>{a}</strong>. Marimon wrote <strong>{m} magic squares</strong> in his book, and our answer squares to {a} — too big by {q}, which is the corner and nothing else. Pretty close, for a side nobody could measure.",
    c3_e_fen1: "Good enough for a fence, and a fence is what we came for. Four sides, each {s} magic lengths long.",
    c3_e_fen2: "And we can take that apart the way we always do: {split}. Four twos, and four quarters — and four quarters make <strong>one</strong>.",
    c3_e_fen_q: "So how many magic lengths of wire does Eliel need to go all the way round?",
    c3_e_fen_hint: "4 TIMES 2 is 8, and 4 quarters make 1.",
    c3_e_fen3: "<strong>{p} magic lengths of wire.</strong> A whole number, out of a side we could never even measure.",

    c3_e_seed1: "And the seeds are the easy part, for once — and the <em>exact</em> part. The area is the one thing we were given: {a} magic squares, in Marimon’s own handwriting. One seed to a magic square, and not an <strong>about</strong> in sight. It was only ever the fence that needed the side.",
    c3_e_seed2: "And look where the fifth one goes. Four whole magic squares sit where you laid them, right back at the start — and everything left over round the edges hangs together in <strong>one piece</strong>, with the area of exactly one magic square. That is the very {eq} we wrote down when we first cut this field up. So by Marimon’s rule it takes a seed of its own, however long and thin it is.",
    c3_e_seed_q: "How many tree seeds does this field need?",
    c3_e_seed_hint: "Four whole magic squares, and the ground round the edge makes a fifth.",

    c3_e_end1: "{a} tree seeds and {p} magic lengths of wire. Eliel can go to market.",
    c3_e_end2: "And think about what you just did. Nobody measured that side — nobody <em>could</em>. You took the one number Marimon had written down, cut a square into four pieces, threw away the smallest one on purpose, and shared out what was left. And out came a length.",
    c3_e_end_title: "The first root!",
    c3_e_end_text: "{sqrt} ≈ {s}, worked out from the area alone.",
    c3_e_end_next: "There are {n} more fields waiting.",
    c3_e_st1: "Let’s stop a minute and take stock of what we have just done, because it is quite something.",
    c3_e_st2: "Any time you have a square field whose <strong>area</strong> you know — call it {a} — but whose <strong>side</strong> you do not, and that side is {sqa}, you can now get very close to it by computing {approx}. Here is the whole thing in one line:",
    c3_e_st3: "{aA} is how many <strong>whole magic squares</strong> you can fit inside {a}, and {sA} is the side of a square of that area — {rootA}, which you know on sight, because {aA} is one of the square numbers off Chapter 1’s table.",
    c3_e_st4: "Our approximation of {roota}, {s1}, starts from {s0eq} and adds our {d} to it — and we work it out by dividing the ground that is left, {rest}, into as many pieces as there are magic lengths in the two strips of height {d} laid end to end (and there are {k} of them). The {bar} sign says just that: divide the number above the bar (we call it the numerator) into as many pieces as the number below it asks for (we call it the denominator). Do not be too impressed by this formula that looks so complicated. We are going to practise using it plenty of times, do not you worry.",
    c3_e_st5: "Let’s see how the trick does on the other fields.",
    c3_f_intro: "Twelve fields burned. Three of them you could name on sight, one we have just fought our way through — and these {n} are next. Same method every time, and you are running it now.",
    c3_f_btn: "Let’s go!",
    c3_f_btn_done: "That’s all that fits!",
    c3_f_areq: "Now take those magic squares out of the field. What is left is the strip round the edge: {sA} along it, and {d} across.",
    c3_f_a1: "First one: <strong>a = {a} magic squares</strong> of ground. Lay down every whole magic square that fits.",
    c3_f_a: "Next field: <strong>a = {a} magic squares</strong>. You know the drill — lay down every whole magic square that fits.",
    c3_f_qA: "Good. How many went down? That is our {aA}.",
    c3_f_hA: "Count the ones on the ground.",
    c3_f_qRem: "And the ground left over is the whole field less the magic squares: {calc}. How much is that, in magic squares?",
    c3_f_hRem: "{a} take away {A}.",
    c3_f_qSA: "{chain} is the side of a square of {label}. What, times itself, makes {A}?",
    c3_f_hSA: "Look down the table for a number multiplied by itself.",
    c3_f_sa_ok: "{eq}. That is the side of the block of magic squares you laid down — and it stays with us now, all the way to the end.",
    c3_f_pile: "So we cut the leftover ground into strips one magic length long and pile them up. Each layer is {d} thick, and the whole pile is the leftover: {rem} magic squares.",
    c3_f_qK: "How many {d} are in the pile?",
    c3_f_hK: "Count the layers.",
    c3_f_dcalc: "{chain}. So {d} is {rem} shared into {k} equal parts.",
    c3_f_half2: "One half. And how do we write a half with a dot? Watch — here is a whole magic length, cut into its ten tenths, and split down the middle.",
    c3_f_qTenths: "How many tenths are there in one half?",
    c3_f_hTenths: "Half of ten.",
    c3_f_whole2: "{rem} shared into {k} — and each share is a whole magic length. Nothing to put after the dot at all.",
    c3_f_quarters: "Three quarters this time. We wrote one quarter as {q} on the very first field we solved, so three of them...",
    c3_f_qDec: "So how do we write {d} in magic lengths?",
    c3_f_hDec: "Count the tenths first, then the hundredths if there are any.",
    c3_f_strips: "Remember that we stand in for that leftover strip with <strong>two strips</strong>, each {sA} long and {d} high? Let’s cut them into {d} × 1 pieces and pile them up, shall we?",
    c3_f_yes: "Yes, let’s!",
    c3_f_qK2: "How many {d} × 1 pieces are piled up there?",
    c3_f_hK2: "Count the layers.",
    c3_f_qTall: "How many magic lengths tall is that pile, then?",
    c3_f_assume: "Now let’s say that this pile of {d} × 1 pieces is <strong>exactly</strong> the leftover ground {rest}, and not merely about it. That is the whole of our approximation, in one line — and it is what lets us turn it into a number.",
    c3_f_hTall: "It is the leftover ground, stood on end.",
    c3_f_ord_2: "one half",
    c3_f_ord_4: "one quarter",
    c3_f_ord_6: "one sixth",
    c3_f_share_is: "So {eq} is {len}, and {d} is <strong>{ord}</strong> of {len}.",
    c3_f_lay_intro: "Hmm. Not the easiest thing to do in your head, is it? Let me lay them all down: {len} on the right, and the {k} {d} beside them — they come to exactly the same height.",
    c3_f_lay_go: "Now measure one {d} the way we always measure: lay tenths of a magic length along it.",
    c3_f_qLay: "How many tenths did you get on?",
    c3_f_hLay: "Count the ones you laid.",
    c3_f_q_whole: "Nothing to measure here — the parts come out whole. So how many magic lengths is {d}?",
    c3_f_h_whole: "Look at the two lines: how much is one of those parts?",
    c3_f_lay_exact: "And it comes out <strong>exactly</strong> — {n} tenths, not a sliver over or under.",
    c3_f_lay_over: "And it does not come out even: {n} tenths fit, and the next one sticks out past the end. We could cut finer and finer — but it is wire we are buying, and a hair too much is far better than a hair too short. So we take <strong>one more tenth</strong>.",
    c3_f_lay_tail_ok: ", and <em>that</em> one is exact.",
    c3_f_lay_tail_no: ", and there is <strong>still</strong> a sliver over. Cut again and again: this one never finishes. So we say <strong>about</strong> — and since we are buying wire, we take a hair more rather than a hair less.",
    c3_f_never: "Cut those tenths into ten again and {h} hundredths fit — and there is <strong>still</strong> a sliver over. Cut again, and again: this one never finishes. Remember the very first side we tried to measure? Same thing. So we say <strong>about</strong> — and since we are buying wire, we take a hair more rather than a hair less.",
    c3_f_qTenths2: "Lay tenths along one share. How many fit before the next one would stick out?",
    c3_f_hTenths2: "Count the tenths that finish inside the shaded part.",
    c3_f_buy: "{calc} magic lengths. But wire comes off the roll in whole magic lengths — and you can cut wire, you cannot stretch it.",
    c3_f_qBuy: "So how many whole magic lengths does Eliel buy?",
    c3_f_hBuy: "The next whole one up.",
    c3_f_q_t4: "{chain}. Now {part}: {d} is <strong>{tn} tenths</strong>, so how many tenths is {mul}?",
    c3_f_h_t4: "Four times {tn}, off Chapter 1’s table.",
    c3_f_q_dot: "{ten} tenths. Move the dot one place to come back to whole magic lengths: how much is {part}?",
    c3_f_h_dot: "Ten tenths make one magic length.",
    c3_f_q_sum: "So the whole fence is {sum}. How many magic lengths is that?",
    c3_f_h_sum: "Add the two.",
    c3_f_dist: "Fence it: {calc}. Let’s use distributivity: {chain}. Four whole magic lengths, plus four {d}.",
    c3_f_q_four: "So how many magic lengths do those four {d} make? Look — I have laid them below, with a whole magic length marked above. Click each one to gather them up, and count what you get.",
    c3_f_h_four: "Count the whole lengths they fill.",
    c3_f_q_four2: "There. So how many whole magic lengths do those four {d} come to?",
    c3_f_q_wire2: "So all together: {sum}. How many magic lengths of wire?",
    c3_f_qS: "Let’s wrap up. {chain}. How many magic lengths is that?",
    c3_f_hS: "The {n} whole ones, and the bit on top.",
    c3_f_lead1: "First one: <strong>{a} magic squares</strong> of ground. The whole magic squares are down already — I laid them while you were reading — and what they could not cover is outlined round the edge.",
    c3_f_lead: "Next field: <strong>{a} magic squares</strong>. Whole magic squares down, leftover outlined.",
    c3_f_q_sq: "How many whole magic squares fit inside?",
    c3_f_h_sq: "Count the ones on the picture.",
    c3_f_q_rem: "So how much ground is left over, in magic squares?",
    c3_f_h_rem: "The whole field is {a}, and {sq} of it is covered.",
    c3_f_share1: "Now share it out, the way we did before. Cut the leftover into <strong>{k}</strong> strips, each one magic length long, and pile them up: {k} layers, and the pile comes to <strong>{rem}</strong>.",
    c3_f_q_dt: "So how wide is one strip? That is our {d}.",
    c3_f_h_dt: "{rem} shared between {k}.",
    c3_f_half: "A half! We have not written a half yet — but we know tenths, and half of ten is five, so a half is <strong>five tenths</strong>.",
    c3_f_threeq: "Three quarters this time. A quarter was {q}, so three of them...",
    c3_f_q_s: "And the side? {sum}",
    c3_f_h_s: "The {n} whole magic lengths, and the strip on top.",
    c3_f_q_wire: "Fence it: {calc}. How many magic lengths of wire?",
    c3_f_h_wire: "Four times {n}, and four times the bit after the dot.",
    c3_f_done: "{sqrt} &asymp; {s}, and {w} magic lengths of wire. Next.",
    c3_f_done_last: "{sqrt} &asymp; {s}, and {w} magic lengths of wire. That is the last of them.",
    c3_f_tot1: "Look at that. Every field we could do, done — the three you knew on sight, the one we had to invent a method for, and these eight you ran yourself. Now the shopping list, and it is a long one. Every field wants a fence all the way round, and here is what each one came to.",
    c3_f_q_seeds: "How many tree seeds altogether?",
    c3_f_h_seeds: "1 + 4 + 9 makes 14, then 5, then 2 + 3 + 6 + 7 + 8 + 12, then 10 and 11.",
    c3_f_tot2: "{w} magic lengths of wire. Marimon is going to need a bigger cart. And now the seeds — one to every magic square of ground, and the area is the one thing we were given every time.",
    c3_f_q_wire_all: "How many magic lengths of wire altogether?",
    c3_f_h_wire_all: "4 + 8 + 12 makes 24, then 9, then 6 + 8 + 10 + 12 + 14, and the three with tenths: 11.2, 12.8, 13.6.",
    c3_f_sum_btn: "Let’s put them in order!",
    c3_f_sum_go: "There they are, in order. Two at a time now — I will light the pair, and you say what they come to.",
    c3_f_sum_lead: "Twelve numbers is a lot to add in one go. Let’s put them in a better order first: the ones that come out whole together, and the three with tenths at the end. Then we take them two at a time.",
    c3_f_sum_lead2: "Twelve again — and these ones are easier, because every area is a whole number of magic squares. Smallest first, and two at a time, just as we did with the wire.",
    c3_f_sum_prompt: "Add the two shaded ones.",
    c3_f_sum_tenths: "These two have tenths. Take the whole magic lengths first, then the tenths — and watch what the tenths do.",
    c3_f_sum_last: "And the last one: the whole ones, and everything that had tenths in it.",
    c3_f_tot1b: "<strong>{w} magic lengths of wire.</strong> Twelve fences, added two at a time — and the only tricky bit was two tenths and eight tenths making a whole magic length between them.",
    c3_f_close: "<strong>{s} tree seeds and {w} magic lengths of wire.</strong> And every single one of those numbers came out of an area — not one of those sides was ever measured, because not one of them could be. Twelve fields burned, and twelve are ready to plant. The last two never came out even, however far we went — and that is exactly what <strong>about</strong> is for.",
    c3_a_back1: "Think about what we have done so far, you and I. Every field we have ever measured, we walked the sides first and worked out the ground afterwards.",
    c3_a_back2: "This time it is the other way round. I am holding the ground, and what I need is the side. We have never done it that way round.",
    c3_a_back_ok: "Let’s try anyway!",
    c3_a_back_hmm: "That does sound hard.",

    c3_a_pick: "Let’s start with this one. Marimon’s records say it holds <strong>{a} magic squares</strong> of ground.",
    c3_a_try: "{a} magic squares. So can we not simply lay them out on the field and read the side off them? Go on — put them down.",
    c3_a_keep: "Keep going!",
    c3_a_left_over: "Four of them went down, and then they stopped. You still have one magic square in your hand — try to put it somewhere.",
    c3_a_refuse: "There is nowhere for it to go. The bare ground is real ground, and there is plenty of it — but it is a thin band round two sides, and a whole magic square will not fit into a thin band.",

    c3_a_four_q: "Look at the four that did go down. They make a square of their own. How many magic lengths across is it?",
    c3_a_four_hint: "Two magic squares along the bottom, two up the side.",
    c3_a_more1: "Two magic lengths across — and the field is bigger than that, because there is bare ground left all round the outside.",
    c3_a_more2: "So the side of this field is <strong>more than 2 magic lengths</strong>.",

    c3_a_three_q: "Could the side be 3, then? If it were, how many magic squares would the field hold? Look it up.",
    c3_a_three_hint: "A square field of side 3 — that is 3 TIMES 3.",
    c3_a_three_no: "Nine magic squares. But Marimon’s records say this field holds {a}. So a side of 3 magic lengths is far too much.",

    c3_a_between: "So there we are: the square root of {a} is <strong>more than 2</strong> magic lengths and <strong>less than 3</strong>.",
    c3_a_between2: "Which is a start. But I cannot walk into the market and ask for “between 2 and 3” magic lengths of wire. I need a number. Let’s go out to the field and measure it properly.",

    c3_g_in1: "Twelve fields, and twelve sides. Three of them I am sure of — 1, 4 and 9 were square numbers, and you found their sides straight off the multiplication table. The other nine are every one of them an <strong>about</strong>.",

    c3_g_in2: "And before I go and spend all that wire, I would rather like to know what an <strong>about</strong> is really worth. Can we tell, without walking all the way back out to the fields and measuring everything again?",

    c3_g_in_yes: "We can check them!",
    c3_g_in_no: "I don’t see how.",

    c3_g_s1: "This is the check we ran on the field holding 5 magic squares, and here it is again on the field holding {a}. Our answer was {stil} — and just as it did last time, it comes apart into two pieces: {split}.",
    c3_g_s2: "So {atil}, the square of our approximation of {sqrt_a}, cuts into the same four pieces as before, in the same four colours. And this time every one of the four is a whole number — so we can work out all four of them, and see what our answer is really claiming.",
    c3_g_blk_q: "The big block first. How many magic squares is that? {eq}",
    c3_g_blk_hint: "A square of side {n}.",
    c3_g_blk_ok: "{eq}. That is the block of whole magic squares you laid on this field yourself, right back at the start — and it has not moved since.",
    c3_g_str_q: "Now the two strips, both together. How many magic squares? {eq}",
    c3_g_str_hint: "Each strip is {n} by {d} — and there are two of them.",
    c3_g_str_ok: "{eq}. So the block and the two strips together are exactly the field — which is no accident at all: that is precisely what we built {dtil} to make true. Those three pieces <strong>are</strong> Marimon’s ground, all of it.",
    c3_g_cor_q: "Which leaves the little corner. How big is that one? {eq}",
    c3_g_cor_hint: "A square of side {d}.",
    c3_g_cor1: "A <strong>whole magic square</strong>. And there it sits, in the corner — ground our approximation invented, that the field has not got. This is what it cost us to put {dtil} in place of {d} so as to cover the little square {dsq} we ignored: the strips had to grow a bit to cover it, and grown strips leave another corner of their own behind, of area {dtsq}, a little bigger.",
    c3_g_cor2: "Our approximation of {rt}, {s1}, makes a square whose area is {sum} magic squares, where the true square holds {a}. We are out by a whole magic square — the {dtsq} corner we have just worked out. On the field holding 5 the same corner came to a sixteenth of a magic square, and that mattered far less. Here it is a whole one, out of {a}.",
    c3_g_e1: "Now this one, and you know the way by now: the field holding {a}, our answer {stil}, coming apart into {split}. Same four pieces, same four colours.",
    c3_g_e_end: "{sum} magic squares claimed, and the field holds {a}. A whole magic square too much, a second time — and again it is exactly the corner. So these two, {r1} and {r2}, are the two answers I would not want to build a fence on.",














    c3_g_m1: "And in fact we can do this for every field at once, without a single multiplication. The corner we add by mistake is always a little square, and its side is always {d} — the share you worked out. So here are all twelve of them: each field with its own corner drawn on it, its answer {s1} written underneath, and that answer drawn as a blue line beneath the field, so you can see how far it reaches.",


    c3_g_m2: "Both of them, exactly the same: {r1} and {r2} are out by a whole magic square each — find the field holding 1 magic square and put your finger on it, their corners are exactly that big. And after those two it drops away very fast indeed, because a corner is a little square, and a little square half a magic length across is only a quarter of a magic square.",

    c3_g_m_q: "So: how many fields have no corner on them at all?",
    c3_g_m_hint: "The ones whose side you already knew, right at the start.",

    c3_g_m3: "Three of them: the fields holding 1, 4 and 9. There was never anything left over on those, so there was never a corner to throw away — and their sides are not <strong>about</strong> anything at all. They are exact.",
    c3_g_m_q2: "And now the other end. Two fields have a bigger corner than any of the others. Tell me the smaller of their two areas first.",
    c3_g_m_h2: "The two biggest orange corners on the board. Take the smaller field of the two.",
    c3_g_m_ok2: "{r}, yes. And the other one?",
    c3_g_m_q3: "Tell me its area too.",
    c3_g_m_h3: "The other of the two big corners.",

    c3_g_r1: "So here is the whole business, in one line: {rule}. The square of our answer is the field, plus the corner we have added by making {dtil} slightly larger than {d}, so that the strips cover the little square we left out.",

    c3_g_r1b: "Except on {n} of them — the ones whose share never came out even in tenths, so we rounded it up. That extra went into our answer, and so it is in the square as well: those ones are out by rather more than their own corner, and each corner below is drawn the size its own answer is really out by. Still too big, mind you, which is the direction that suits us.",

    c3_g_r2: "Which means two things, and they are both rather good. We always know how far out we are, without measuring a thing. And we are always out the <strong>same way</strong>: our answer is a little too big, never too small. For a fence that is the right way to be wrong — you can always cut wire, and you can never stretch it.",

    c3_g_r3: "But a whole magic square too much, twice over… no, I do not like that at all. {r1} and {r2} deserve better than that. Shall we go back to those two and have another go?",

    btn_play_again: "Play again",

    c3_h_in1: "Here is the {eq} field as it really is, and drawn round it, the square our answer describes. They share their bottom-left corner — and between the two edges lies a band of ground. That band is our mistake: area our approximation of {d} by {dtil} has added, and that the real field has not got.",
    c3_h_in1b: "Here is the field as it really is, and drawn round it, the square our answer describes. They share their bottom-left corner — and between the two edges lies a band of ground. That band is our mistake: area our approximation of {d} by {dtil} has added, and that the real field has not got.",

    c3_h_in2: "So the true side {ss} is a little shorter than our {stil}. Let us call the difference {e} — {eq} — and there it is on the right of the picture, the width of that band. If we could work out {e}, we could shave it off {s1} and have a much better answer for {ss}.",

    c3_h_in_yes: "Let’s shave it!",
    c3_h_in_no: "Smaller how?",

    c3_h_st1: "So let us look at that band on its own. It is two strips, each running the whole side of our square and {e} across. Watch what happens when I lay them down.",

    c3_h_st_btn1: "The first strip!",

    c3_h_st2: "The strip along the top: the whole side {stil} long, {e} across — so an area of {area}.",

    c3_h_st_btn2: "And the other one!",

    c3_h_st3: "And the strip down the side, just the same: the whole side {stil} long, {e} across — so an area of {area}.",

    c3_h_st_btn3: "Both at once, please!",
    c3_h_st_q: "Now look carefully at the little corner where the two strips meet. How many times have we counted it?",
    c3_h_st_hint: "It is part of the strip along the top. Is it part of the one down the side as well?",
    c3_h_st_ok: "Twice. The strips each run the whole length of the square, so they overlap, and the little corner sits inside both of them. That is new. The first time round, the corner was a piece we had to <strong>add on</strong>; this time it is a piece we have counted <strong>one time too many</strong>.",

    c3_h_fg1: "We can — by approximating {e} with a number that is easier to find: {etil}, the one that makes the line come out exactly right.<br>But that will make our answer for the side an <em>about</em> again, will it not? We had {eq_true}, exactly. Now we shall only have {eq_new}. So let us give the number for which that line <em>is</em> exact — not an <em>about</em> — a name of its own: {s2}, with {eq_def}.",

    c3_h_fg2: "Now cut the two strips into pieces one magic length long, and pile them up. Every layer of that pile is one of our {e}, and beside it stands the magic square they have to make between them.",

    c3_h_fg_q: "So how much is {e}?",
    c3_h_fg_hint: "{k} of them make one whole magic length.",
    c3_h_fg_ok: "{e}. A quarter of a magic length — the very same number our first share came to.",

    c3_h_an1: "So there we are: what is left of our square's side is {len} and {d}. That is {s2}.",

    c3_h_an_q: "How long is its side now? {eq}",
    c3_h_an_hint: "The {len} we left alone, and the {d} left of the last piece.",
    c3_h_an_ok: "There we are. {sqrt_a} is about {s}, where before we said {old} — and it cost us four small steps.",

    c3_h_ck1: "A quarter by a quarter. Here is a magic square, ruled into quarters both ways.",

    c3_h_ck_q: "How many of that little corner fit inside one magic square?",
    c3_h_ck_hint: "Four rows of four.",

    c3_h_ck2: "Sixteen — so the band is <strong>one sixteenth</strong> of a magic square, and there it is round the field, drawn to scale.",

    c3_h_ck3: "Three and one sixteenth, where our first answer gave three and a <strong>whole magic square</strong> more. Look at the two errors side by side. That is what one more round bought us.",

    c3_h_lbl_before: "our first answer, {s}",
    c3_h_lbl_after: "our second answer, {s}",



    c3_h_ag_never: "But here is the trouble. One of {k} equal shares of a magic length is not a number we can write. It never comes out even, however far we go — do you remember the very first side we tried to measure, right at the start of all this? Same thing. So we shall do what we did then: go as far as tenths and hundredths, and then say <strong>about</strong>.",

    c3_h_lay_go: "Lay tenths of a magic length along {e}, and let us see how many fit.",
    c3_h_lay_q: "How many whole tenths fit along {e}?",
    c3_h_lay_hint: "The long green ones. The red one did not fit.",
    c3_h_lay_ok: "{t} tenth and {h} hundredths — and a further hundredth would run past the end again. So we stop there: {e}.",
    c3_h_lay_stop: "And here is the thing worth noticing. When we were <em>sharing</em> the leftover out, a piece that did not quite fit meant taking <strong>one more</strong>. Shaving is the other way about: we stop where we are and take <strong>less</strong> off. Either way it is the answer that has to stay a little too big — you can always cut wire, and you can never stretch it.",

    c3_h_end1: "Look at the corners now — {n} of them refined: {list}. Every one of those was among the biggest on the board, and on each you can see both at once: pale, where it was, and solid, where it is now.",

    c3_h_end2: "And here is the best part. We could do it again. Take the answer we have, square it, see how much it is out by, shave off the difference — and round it goes, better every single time. As many times as you like.",

    c3_h_end3: "And every answer we have written down, all the way through, has been a little too big and never a little too small. For a fence that is exactly the right way to be wrong: you can always cut wire, and you can never stretch it.",

    c3_h_end_title: "Quest complete!",
    c3_h_end_text: "You found the side of every one of the twelve fields from its area alone — and then you went back and made the {n} worst ones better.",
    c3_h_end_next: "Eliel has his seeds and he has his wire. The forest can go back in the ground.",
    c3_h_band: "the band between them: 1 magic square",
    c3_h_band_q: "the band between them: ?",
    c3_h_q1_lead: "And here is what makes the whole thing possible: we can work out exactly how big that band is, without measuring a thing. Our wrong square has a side of {stil}.",
    c3_h_q1: "So what is its area? {eq}",
    c3_h_q1_hint: "A square of side {g}.",
    c3_h_q2_lead: "{eq} magic squares — that is the area our approximation of {rt} comes to. And Marimon’s record says the field itself holds {a}.",
    c3_h_q2: "So how big is the band round the true field? {eq}",
    c3_h_q2_hint: "The difference between the two.",
    c3_h_q2_ok: "One whole magic square. And that band is exactly {dsq} — the little corner we ended up with when we put {dtil} in place of the true {d}.",
    c3_h_q2_ok2: "So now we know what we are looking for, and how much ground is at stake. Let us find a way to work {e} out — or, if we cannot, the best approximation to it we can manage: {approx}.",
    c3_h_one_sq: "1 magic square",
    c3_h_fg_lay: "So here is that band, taken off the field and laid out flat. Two strips, each of them {area} — and then the little corner taken off once, because we counted it in both of them.",
    c3_h_fg_btn1: "Forget the corner!",
    c3_h_fg_btn2: "Pile them up!",
    c3_h_fg_approx: "There — the corner is gone. But look what that does to the line. Two strips of {area}, with nothing taken off them, come to a little <em>more</em> than one magic square: too much by exactly the corner we crossed out, {esq}. So this is no longer an equals sign — it is an <strong>is about</strong>.",
    c3_h_fg_btn_fix: "Can we make it exact again?",
    c3_h_pile_q1: "How many {e} are piled up there, one on top of another?",
    c3_h_pile_h1: "Count the layers.",
    c3_h_pile_ok1: "{k} of them, one on top of another.",
    c3_h_pile_q2: "And how tall is that pile — how long is {e} altogether? Look at the side of the magic square standing beside it.",
    c3_h_pile_h2: "The pile is exactly as tall as the magic square, and the magic square's side is one magic length.",
    c3_h_pile_ok2: "{eq}. Piled one on top of another they come to exactly one magic length, which is what the magic square standing beside them says.<br>And this is a sum you have solved before — back when we found our very first share, {k} of them made one magic length then too.",
    c3_h_qt1: "Now, {stil} take away {e}. That is not an easy one to do in your head — so let us do it on the ground instead. Here is our side laid out flat, and because a quarter is what we are taking off, I have marked the whole thing out in quarters.",
    c3_h_qt_btn: "Shave one off!",
    c3_h_qt2: "There goes our {e} — one quarter of a magic length, gone.",
    c3_h_qt_q1: "How many quarters are left?",
    c3_h_qt_h1: "Count the ones still there.",
    c3_h_qt_ok1: "{n} quarters left.",
    c3_h_qt_q2: "Now — how many whole magic lengths are hiding inside those quarters?",
    c3_h_qt_h2: "It takes {per} quarters to make one whole magic length. The heavy tick marks show you where they are.",
    c3_h_qt_ok2: "One whole magic length — the first {per} quarters, all together.",
    c3_h_qt_q3: "And how many quarters are left over beside it?",
    c3_h_qt_h3: "All the ones past the heavy tick, after the {per} that made the magic length.",
    c3_h_qt_ok3: "So what is left of our side is {len} and three quarters. Now we only have to write that as a number.",
    c3_h_75_1: "Three quarters, then: {eq}. We know how to write one quarter — {q} — but adding three of those together is awkward. So let us count them in <strong>hundredths</strong>, where they are whole numbers: one quarter is {c} hundredths.",
    c3_h_75_q1: "Two of them first. {eq}",
    c3_h_75_h1: "Two lots of twenty-five.",
    c3_h_75_ok1: "{eq}. And now the third one.",
    c3_h_75_q2: "{eq}",
    c3_h_75_h2: "Fifty, and twenty-five more.",
    c3_h_75_ok2: "{c} hundredths. And to come back from hundredths to magic lengths we move the dot two places, exactly as we have always done.",
    c3_h_75_q3: "So how much is three quarters of a magic length, written as a number?",
    c3_h_75_h3: "{c} hundredths, with the dot moved two places. There will be nothing left of it.",
    c3_h_75_ok3: "{d}. So three quarters is {d} of a magic length, and what is left of our side is {len} and {d}.",
    c3_h_fg1b: "And we can already say something about how big {etil} is. The two strips of height {e} were too big by {esq}; these two have to come to <strong>exactly</strong> one magic square, so they are smaller. And they are the same length ({stil}). So {etil} has to be a little <strong>smaller</strong> than {e}.<br>Which means {s2} has to be a little <strong>larger</strong> than the true side. And that is still fine, is it not? Better to buy a little too much wire than not enough.",
    c3_h_band_16: "the band between them: one sixteenth of a magic square",
    c3_h_ck_a1: "Now let us check it, on the very same picture we started with. Here is the field again — and drawn round it this time, the square our <em>new</em> answer describes, {s2}.",
    c3_h_ck_a2: "Look at the band between the two edges. It is still there — our answer is still a little too big, as it has to be — but it has gone very thin indeed.",
    c3_h_ck_a3: "Last time we worked that band out by squaring our answer and taking the field away: {g} times {g} is {sq}, and {sq} less {a} is {exc}. But nobody can square {s2} in their head.",
    c3_h_ck_a4: "And we do not have to. Remember the rule: {rule}. The band is always of the same size as the little corner we have added by making {s2} slightly larger than {ss} — and this time the corner we have added is {esq}.",
    c3_h_ck_btn: "How big is that?",
    c3_h_ck_q2: "And the square of our new answer, {eq}, is the field plus that band. So how many whole magic squares is it, before the band?",
    c3_h_ck_h2: "The field itself.",
    c3_h_hd1: "So we take {e} off our {g} magic lengths. The first {w} we can leave alone — it is the last one the shave comes out of. And one whole magic length is <strong>100 hundredths</strong>, where {e} is just {e2}.",
    c3_h_hd_q1: "So what is left of that last magic length, counted in hundredths? {eq}",
    c3_h_hd_h1: "{a} hundredths, less {b}.",
    c3_h_hd_ok1: "{c} hundredths. And to come back to magic lengths we move the dot two places, exactly as we always do.",
    c3_h_hd_q2: "So how much is that, written as a number?",
    c3_h_hd_h2: "{c} hundredths, with the dot moved two places. There will be nothing left of it.",
    c3_h_hd_ok2: "{d}. So what is left of our side is {len} and {d}.",
    c3_h_ck_odd: "And this time the corner we have added is {esq}. So how do we measure it?<br>Remember what the pile told us: {eq6}. So {etil} is one of {k} equal shares of a magic length — and here is a magic square, ruled into sixths both ways. Count them.",
    c3_h_ck_a4b: "And we do not have to. Remember the rule: {rule}. If we had shaved off exactly the right amount, the band would be that little corner and nothing more — and the corner we have added is {esq}. We stopped a shade short of exact, on purpose, to keep our answer safely too big, so the real band is a little bigger than the corner.",
    c3_h_le1: "One last thing, and it is the thing Eliel actually needs. Every error we have measured in this quest has been an <strong>area</strong> — a band, a little corner, so many flower squares. But wire is a <strong>length</strong>. Here is the band again: {band} of a magic square, and the gap between the two edges is {e}. How do we get from the one to the other?",
    c3_h_le_btn: "How, then?",
    c3_h_le2: "The same way as always. The band is two strips, each the whole side {s1} long and {e} across, less the little corner they share — and if we forget that corner one more time, {eq}. Turn it round and there is {e} on its own: {div}.",
    c3_h_le3: "And look what that is. It is {etil} — the shave. The number you have worked out four times over was never really an area at all: it was how far our answer was out <strong>along the side</strong>, which is exactly what we needed. {num}.",
    c3_h_ag1: "And now look at the two rounds side by side. In the first, the block’s area fell <strong>short</strong> of the field, so we grew the side. In the second, our square’s area went <strong>over</strong>, so we shaved it. But it is the same thing every time: you take how far out the area is with your first answer, you share that mistake into as many pieces as twice your first answer, and you use what you find to correct that first answer. Between the first round and the second, you use exactly the same approach. Only the direction of the correction changes.",
    c3_h_ag_btn: "So we could go on?",
    c3_h_ag2: "For ever. Square your answer, see how far the area is out, share it into twice your answer, and shave the side by that much. Then do it again. And it is always a shave after the first round, because from there on every answer we write is a little too big — which is the one thing this whole quest has been careful about. Each {s} is better than the one before it, and there is no last one.",
    c3_h_ag3: "One more round on {r} would take us from {v} to a number right in its first four figures after the dot. Two more, and we should run out of paper before we ran out of rightness.",
    c3_h_fl_ok2: "{n} of a magic square — that is the corner our rule promises. And because we stopped the shave a shade short of exact, the real band is a little bigger: {band} of a magic square, which is what the box below is drawn from.",
    c3_h_j_qt2: "So how many tenths do the two of them make between them?",
    c3_h_sub_q3: "How much is the corner, then, in magic squares?",
    c3_h_sub_ok2: "{n} of a flower square. And a hundred flower squares make one magic square, so the dot moves two places once more.",
    c3_h_sub_h2: "Out of a hundred. Move the dot two places.",
    c3_h_sub_q2: "So how much of a flower square is that?",
    c3_h_sub_ok1: "{n} of them — and a hundred of them make one flower square.",
    c3_h_sub_h1: "{n} rows of {n}, off Chapter 1's own table.",
    c3_h_sub_q1: "How many of those little squares does our corner cover?",
    c3_h_sub1: "And this time the corner we have added is {esq} — which is smaller than one of Marimon's flower squares. So let us go inside one. A flower square holds a hundred little squares of a hundredth of a magic length, and {e2} hundredths is what our {esq} measures along each side: {eq}.",
    c3_h_7_bok2: "{band} of a magic square too much. And look at what that is made of: {co} is the little corner we forgot, exactly as the rule says — and the other {ex} is what it cost us to round our share up to {ex2}, back when it would not come out even in tenths however far we went. Both of them come off now.",
    c3_h_lay_ok_t0: "Not one whole tenth, and {h} hundredths — and a further hundredth would run past the end again. So we stop there: {e}.",
    c3_h_lay_over1b: "There — the very first one runs straight past the end. So not one whole tenth fits along {e}. Take it back off, and let us try something smaller.",
    c3_h_j4b: "So the two strips come to {w} whole magic lengths, and {r} more after them — {sum}.",
    c3_h_j_short: "And they do not reach it — the two of them together stop short of a whole magic length. So there is no magic length hiding in there this time.",
    c3_h_fl1: "And this time the corner we have added is {esq}. Now {split}, so our usual formula takes it apart the way it takes every square apart: {eq}. Here it is, laid on a magic square with Marimon's flower squares ruled underneath. Let us take the pieces one at a time.",
    c3_h_fl_btn: "Cut it up!",
    c3_h_fl2: "The big one first: {eq}. Look where it sits.",
    c3_h_fl_q1: "How many flower squares does that piece cover?",
    c3_h_fl_h1: "It lands exactly on one of them.",
    c3_h_fl3: "Then the two thin ones, {e1} and {e2}. Each of them is half a flower square — and halves go together.",
    c3_h_fl_btn2: "Put them together!",
    c3_h_fl4: "There: one of them stood on end and fitted against the other.",
    c3_h_fl_q2: "So how many flower squares do those two make between them?",
    c3_h_fl_h2: "Two halves.",
    c3_h_fl5: "And the little one in the elbow, {eq}. It would take <strong>four</strong> of those to make a flower square — and you have written a quarter before.",
    c3_h_fl_q3: "So how many flower squares is it?",
    c3_h_fl_h3: "One quarter, written as a number.",
    c3_h_fl_q4: "So how many flower squares does the whole corner cover? {sum}",
    c3_h_fl6: "One, and one, and a quarter.",
    c3_h_fl_h4: "Two whole ones and a quarter.",
    c3_h_fl7: "{n} flower squares. And a hundred flower squares make one magic square, so to say that in magic squares we move the dot two places, exactly as we always do.",
    c3_h_fl_q5: "How much is the corner, then, in magic squares?",
    c3_h_fl_h5: "Move the dot two places to the left.",
    c3_h_fl_ok: "{n} of a magic square. That is the whole of our error now, worked out rather than guessed at.",
    c3_h_pc4: "So {eq}. Two rectangles covering the same ground, both a whole magic length long — so they can only be the same across. There is our pile: every piece a full magic length now, and the top one {f} of an {e} thick.",
    c3_h_pc3: "Turn it round first — {c1} — because a rectangle does not care which of its sides you name first. And then write the 1 back in: {c2}. Multiplying a length by one whole magic length gives an area with the very same number on it, only measuring magic squares now where it was measuring magic lengths before.",
    c3_h_pc_btn: "Commutativity and associativity!",
    c3_h_pc2: "Now, I want to compare heights, and for that every piece has to run the same length — a whole magic length. So let me trade that last rectangle, {e} across and {f} long, for one that IS a whole magic length long. Call what it is then across {l}, and the two must cover the same ground: {eq}. So what is {l}?",
    c3_h_pc1: "Now cut that strip into pieces one magic length long and pile them up. {w} of them come out whole, each an {e} thick — and then the strip runs out, so the last piece is only {f} of a magic length long. Which is exactly what {k} meant.",
    c3_h_j1: "Two strips, each {g} magic lengths long and {e} across. Let us push them end to end and see how long that comes to — because how many of them there are is the number we shall be sharing by.",
    c3_h_j_btn: "End to end!",
    c3_h_j2: "There. Now, each strip is {n} whole magic lengths with {tail} more on the end of it — {eq} — so I have coloured the whole ones and the bits over differently.",
    c3_h_j_qw: "How many WHOLE magic lengths are there in the two strips together?",
    c3_h_j_hw: "{n} in each strip.",
    c3_h_j_okw: "{w} whole magic lengths.",
    c3_h_j3: "And now the two bits over, {tail} each. Here they are, laid end to end under {len} — and look how far past it they run.",
    c3_h_j_btn2: "Make the hidden magic length appear!",
    c3_h_j_okt: "There it is. Ten of those tenths make {len} all on their own, and it has been hiding in there the whole time.",
    c3_h_j_qt: "And how many tenths are left over beside it?",
    c3_h_j_ht: "Count the little divisions on the piece that is left.",
    c3_h_j4: "So the two strips come to {w} whole magic lengths, and one more out of the bits over, and {r} left after that — {sum}.",
    c3_h_j_qs: "So how long is the joined strip? {eq}",
    c3_h_j_hs: "{w}, and one more, and {r} after that.",
    c3_h_j_oks: "{k} magic lengths long, and {e} across. That is the strip we have to share out.",
    c3_h_p1: "There is the pile, then: {w} of them an {e} thick, and on top the one we traded, {l} thick. So the whole pile is {k} of our {e} — exactly the number the strip was long. And standing beside it is the ground they make between them, {band} of a magic square.",
    c3_h_p_q: "The pile is one magic length wide. So how tall is it, in magic lengths? {eq}",
    c3_h_p_h: "One magic length wide, and {band} of a magic square of ground. So it is that tall.",
    c3_h_p_ok: "{eq}. So the pile stands {len} tall — and that is the whole of what we know about {band}, said as a LENGTH at last instead of as a piece of ground.",
    c3_h_ln1: "Here is that same height twice over. On the left it is counted in {e} — there are {k} of them. On the right it is counted in tenths of a magic length, the way we count everything: {band} of one.",
    c3_h_ln2: "And look where the marks fall. Not one {e} lands on a tenth. So we cannot simply read it off — we shall have to measure it, exactly as we measured that very first side.",
    c3_h_hd_q1p: "So what is left of that last piece, counted in hundredths? {eq}",
    c3_h_band_v: "the band between them: {v} of a magic square",
    c3_h_band_sq: "{v} of a magic square",
    c3_h_7_in1: "Same road as before, then. Here is the field again, with the square our first answer describes drawn round it: {s1}. What we need is {e} — or at least a decent approximation of it, {etil}. And for that we need the excess: how much more ground {a1} covers than {aa}.",
    c3_h_7_in2: "Last time we found that band by squaring our answer. Nobody is going to square {g} in their head — but nobody has to, because we know exactly what {g} is made of. It is the {n} whole magic lengths that fitted, and the {d} we shared out on top of them: {eq}. So our square comes apart the way every square in this quest has come apart.",
    c3_h_7_btn: "Cut it up!",
    c3_h_7_s1: "There it is: a block of {n} by {n}, two strips, and the little corner. Take the two strips first. Each one is {n} magic lengths long and {d} across, so the two of them together are {eq}.",
    c3_h_7_sq: "How much ground is that? {eq}",
    c3_h_7_sh: "{a} times {b} is {c} tenths, and then the dot comes back one place.",
    c3_h_7_sok: "{v}. That is both strips together.",
    c3_h_7_c1: "And now the little corner — the piece everybody forgets. Its two sides are {eq}.",
    c3_h_7_cq: "So how much is the corner? {eq}",
    c3_h_7_ch: "{a} times {a} is {b} hundredths, and then the dot comes back two places.",
    c3_h_7_cok: "{v}. Tiny — and it is about to matter.",
    c3_h_7_t1: "So there is the whole of our square: the block, {blk} = {sq}, the two strips, {st}, and the corner, {co}.",
    c3_h_7_tq: "How big is our square altogether, then? {eq}",
    c3_h_7_th: "Add them one at a time, starting with the block.",
    c3_h_7_tok: "{v}. So we did square it after all — we simply did it on the ground instead of in our heads, by cutting it up and counting the pieces. Which is what this whole quest has been doing from the start.",
    c3_h_7_bh: "Take Marimon's number off it.",
    c3_h_7_bok: "{band} of a magic square too much. And look at what that is made of: {co} is the little corner we forgot, exactly as the rule says — and the other {ex} is what it cost us to round our share up from {ex1} to {ex2}, all the way back when we shared the leftover out. Both of them come off now.",
    c3_h_lbl_band: "{v} of a magic length",
    c3_h_pile_q1b: "How many whole {e} are piled up there, one on top of another?",
    c3_h_lay_stop0: "And this one came out exactly — nothing at all left over at the end. That does not always happen. When it does not, we stop where we are and take a little <strong>less</strong> off, so that the answer stays a little too big — you can always cut wire, and you can never stretch it.",
    c3_h_band_fl: "the band between them: about {n} flower squares",
    c3_h_ck3_fl: "{before} flower squares before, and {n} now. Look at the two errors side by side. That is what one more round bought us, and we could go round again whenever we liked.",
    c3_h_pr_d4: "And it works the same whichever answer we are holding: put that answer's square on top, and twice that answer underneath. Let us do it properly on this very field, then — every step, exactly as we did when we were shaving.",
    c3_h_pr1: "Look how far we have come. But now look at what those little corners actually measure. Every one of them is an <strong>area</strong> — so many flower squares of ground our answer claims and the field has not got. And areas are not what we came for, are they? It is the <strong>side</strong> we are after, so that Eliel can go and buy his wire.",
    c3_h_pr_y1: "That is right!",
    c3_h_pr_n1: "I do not mind either way.",
    c3_h_pr2: "So what we should really like to know is something else: not how much ground we are out by, but how far out our answer is <strong>along the side</strong>, in magic lengths. We met that gap when we were shaving and called it <strong>e</strong>; now that every field has had more than one answer, let us write {e} for the gap on the first. That is the number worth having.",
    c3_h_pr_y2: "Sure!!",
    c3_h_pr_n2: "Hmm, wait — what?",
    c3_h_pr3: "Can we work it out? I think we can. Let me show you.",
    c3_h_pr_d1: "Take the {a} field, and go back to the very first answer we found for it. The big square is the square of that answer, and the field itself is the hole cut out of the middle of it. What is left round the edge — the band, {band} — is the ground the answer claims and the field has not got. And {e} is what we are really after: the gap between the two edges, measured across.",
    c3_h_pr_d2: "And the band is two strips, each the whole side {s2} long and {e} across, less the little corner they share. Forget that corner one last time and {eq}.",
    c3_h_pr_d3: "Turn it round, and there is {e} on its own: {div}. That is the whole of it — an area we know, shared into twice the answer we hold. And that is exactly the number we have been shaving off all along.",
    c3_h_pr_d3b: "Mind you: what we can work out is {etil}, and not {e} itself. So we can only <em>approximate</em> how far out we are as a length — while we know it exactly as an area — but that is quite enough to tell whether it is a lot or rather little.",
    c3_h_pr_b0: "And there it is — {etil}. On the four fields we went back for, this is the very point where we took it off and wrote {s2}. Not this time: we only wanted to know how far out we are, and now we do.",
    c3_h_pr_b2: "So we can write it out properly at last: {pm}.",
    c3_h_pr_b3: "And notice what that means. How far out we are, and how much to take off next, are one and the same number — {etil} does both jobs. That is why the trick works at all.",
    c3_h_pr_p1: "The other divisions are harder than that one, so I have done them all myself. Look at the fields again — under each one there is a blue line now, starting at its left corner, and that is the side we found for it, {s1}. See how every single one of them reaches a little past the field's own edge? That is our mistake, on the ground it is a mistake about. And the {e} marked underneath is exactly how far past.",
    c3_h_pr_p1b: "And the little gold square in the corner of each field is the very same mistake said the other way: {band}, the ground our answer claims that the field has not got. One is an area and the other is a length — and it is the length Eliel has needed all along, because wire is sold by the magic length and not by the magic square.",
    c3_h_pr_p2: "So every field can be written out properly at last: {form}. The answer we found, and how far it can be from the truth — and it is never on the small side, always on the big one, which for a fence is the way round to be wrong.",
    c3_h_pr_p3: "And here are the {n} we went back for, with their second answers: {form}. On those four, everything pale is where we were — the longer line, the wider mark, the bigger corner — and everything solid is where we are now. The other eight are exactly as they were, because we left them alone.",
    c3_h_all2: "Here is {s2} for every single field, each with its own precision — the ones you went back for, and the rest, which I have just done the very same way. Pale is where each of them started.",
    c3_h_all2b: "And I could go on, could I not?",
    c3_h_all3: "One more step, then. Here is {s3}, for all twelve — with both the rounds before it still showing behind, pale: the corner and the line each field had at the start, and the ones it had after the second round.",
    c3_h_all3b: "This time the shave is smaller than a hundredth on nearly every field. Our units have run out again, exactly as the magic lengths did, and then the tenths. So this once I have not rounded it at all. Look how many figures are right now.",
    c3_h_fin1: "We have learned so much in this adventure: what a square root is, how to work one out, and how precise that working-out is.",
    c3_h_fin2: "And we have learned to write a half and a quarter in magic lengths, with tenths and hundredths of a magic length sitting to the right of the dot: {half}, and {quarter}.",
    c3_h_the_end: "THE END",
    c3_h_ti1: "And once more — except look: there is no single worst one left. Four boxes down there are neck and neck, so close that you could not put a hair between them.",
    c3_h_ti_ok: "So there is nothing to choose between them, and any one would do. Let us take {r}, whose first answer was {s1} — I have a feeling about that one.",
    c3_h_j_okt0: "There it is. The two of them make {len} exactly, all on their own, with nothing at all left over.",
    c3_h_j4c: "So the two strips come to {w} whole magic lengths, and one more out of the bits over — and this time nothing after that at all: {sum}.",
    c3_h_ln2b: "And look where the marks fall. Every second {e} lands exactly on a tenth. That is a good sign: it means this one is going to come out even, and we shall not have to stop short.",
    c3_h_7_bok3: "{band} of a magic square too much — and this time that is the little corner and nothing else, {co} exactly. This field's share came out even back in the first round, so there is no rounding riding along with it. Off it comes.",
    c3_h_sq1: "Now let us check it properly, the way we have checked every square in this quest. Our answer is {s2}, and nobody squares that in their head — but we know what it is made of: {eq}. So it comes apart into the same four pieces as always.",
    c3_h_sq2: "And this time let us count in <strong>flower squares</strong>, where the numbers come out whole. There are a hundred of them in every magic square.",
    c3_h_sq_b1: "The block first: {eq}, which is {sq} whole magic squares.",
    c3_h_sq_bq: "How many flower squares is that? {eq}",
    c3_h_sq_bh: "{sq} magic squares, a hundred flower squares in each.",
    c3_h_sq_bok: "{v} flower squares in the block.",
    c3_h_sq_s1: "Then the two strips. Each one is {n} magic lengths long and {d} across, which comes to {one} flower squares.",
    c3_h_sq_sq: "So how many flower squares in the two of them? {eq}",
    c3_h_sq_sh: "{a} times {b} is {c} for one of them, and there are two.",
    c3_h_sq_sok: "{v} flower squares in the strips.",
    c3_h_sq_c1: "And the little corner, {eq}. In flower squares its sides are {f} each way — so it is a square all of its own, and it comes apart into four pieces exactly as the big one did. Here it is, cut up.",
    c3_h_sq_cq: "How many flower squares does the corner cover? {eq}",
    c3_h_sq_ch: "Add the three numbers written under the pieces.",
    c3_h_sq_cok: "{v} flower squares in the corner.",
    c3_h_sq_t1: "So there is the whole square: {b} in the block, {s} in the strips and {c} in the corner.",
    c3_h_sq_tq: "How many flower squares is our square altogether? {eq}",
    c3_h_sq_th: "Add them one at a time.",
    c3_h_sq_tok: "{v} flower squares.",
    c3_h_sq_d1: "And the field itself is {a} magic squares — which is {fs} flower squares. Our square claims {tot}.",
    c3_h_sq_dq: "So how big is the band round the true field? {eq}",
    c3_h_sq_dh: "Take the field away from our square.",
    c3_h_sq_dok: "{n} flower squares — {m} of a magic square. That is what our answer is really out by, worked out from end to end and not guessed at.",
    c3_h_band_v2: "the band between them: {v} flower squares",
    c3_h_w1: "Look at the corners now. On the two we went back for you can see both at once — pale where each of them was, solid where it is now — and there is very little left of them. Not one of the others has moved a hair.",
    c3_h_w1b: "And again. Three of them very nearly empty now, each with its old corner still showing pale behind — and the rest have not stirred.",
    c3_h_w_q: "So which field is the worst one <em>now</em>? Tell me its area.",
    c3_h_w_hint: "The biggest orange corner still on the board. Its area is the number under the root sign written beneath it.",
    c3_h_w_ok: "{r} it is. Our answer for it was {s1}, and the corner it left behind is the biggest one on the board — because its own {d} was the biggest share of all twelve. Let us go and shave that one too.",
    c3_h_fg2b: "Now cut the two strips into pieces one magic length long, and pile them up. Every layer of that pile is one of our {e} — and standing beside it is the band they all have to make between them, {band} of a magic square.",
    c3_h_pile_h1b: "Count the whole layers. There is a bit of another one on top of them.",
    c3_h_pile_ok1b: "{k} whole ones — and a bit of another sitting on top.",
    c3_h_ag_half: "And here is the trouble. On the other two fields the pile came to exactly one magic length, and sharing out one magic length is something we know how to do. Not here. {k} equal shares is not a sharing anybody can do, and this pile does not even come to a magic length.<br>So we shall do what we did at the very beginning of this quest, when the working-out would not come: we shall <strong>measure</strong> {e}.",
    c3_h_hd1p: "So we take {e} off our {g} magic lengths. The first {len} we can leave alone — it is the last piece, the {last} that comes after them, that the shave has to come out of. And {last} of a magic length is <strong>{c} hundredths</strong>, where {e} is only {e2}.",
    c3_h_ck_a3b: "On this field we never squared anything at all, and we are not going to start now — nobody can square {g}, let alone {s2}. We read the band straight off the rule instead, and that is exactly what we shall do again.",
    c3_h_ck_odd_q: "How many of that little corner fit inside one magic square?",
    c3_h_ck_odd_h: "{k} rows of {k}.",
    c3_h_ck_odd_ok: "{n} of them. So if we had shaved exactly, the band would be a <strong>thirty-sixth</strong> of a magic square. We stopped at {ew} instead, a shade short of a whole sixth, so the real band is bigger than that: {band} of a magic square, and that is what the box below is drawn from.",
    c3_h_in_again: "Let’s do the same thing with the {eq} field.",
    c3_h_lay_mid: "Out come the hundredths, for the gap that is left.",
    c3_h_lay_q2: "And how many whole hundredths after them?",
    c3_h_lay_h2: "The short green ones.",
    c3_h_lay_over1: "There — that one runs straight past the end. So one whole tenth is all that fits along {e}. Take it back off, and let us try something smaller.",
    c3_h_lay_btn: "Take it off again!",
    c3_h_lay_over2: "And that one runs past as well. So we have gone as far as the hundredths will take us.",
  },

  fr: {
    page_title: "Le Pouvoir de la Racine",

    c3_a_intro1: "On a chassé les Gorns, et on a replanté les champs étranges. Mais le feu est allé bien plus loin qu’on ne le croyait. Regarde : douze autres champs, tous brûlés, et tous carrés. Le problème, c’est qu’on ne connaît pas leurs dimensions.",
    c3_a_intro2: "On pourrait aller tous les mesurer un par un, ou bien on pourrait se servir des registres de Marimon. Pour chaque champ, il a noté son aire en carrés magiques : on sait donc exactement combien de graines il faut acheter. Malheureusement, Marimon n’a pas noté la longueur de leurs côtés, et on ne sait donc pas combien de fil acheter.",
    c3_a_problem: "Et c’est bien là mon problème. Les Gorns reviendront — ils reviennent toujours — et je ne peux pas acheter une seule longueur de fil tant que je ne sais pas combien mesure un côté.",
    c3_a_ask: "Ce qui serait bien, ce serait d’essayer de retrouver la longueur du côté de chaque champ à partir de son aire totale. Tu crois que c’est faisable ? Tu veux bien qu’on essaie ?",
    c3_a_ask_yes: "Je t’aide !",
    c3_a_ask_no: "Je ne suis pas sûr que ce soit possible.",
    c3_a_lbl_area: "{a} carrés magiques",
    c3_a_lbl_area_one: "1 carré magique",
    c3_a_lbl_len: "{s} longueurs magiques",
    c3_a_lbl_len_one: "1 longueur magique",

    c3_a_easy1: "Douze champs, et pas un seul côté connu. Mais ne commençons pas par le plus difficile. Ces trois-là me paraissent les plus faciles : prenons-les en premier, en commençant par le plus petit.",
    c3_a_fill: "Les registres de Marimon disent que celui-ci contient {label}. Pose-les tous dessus — tous les carrés, sans laisser de trou.",
    c3_a_side_q: "Regarde maintenant le <strong>côté</strong> du champ. Il fait combien de longueurs magiques ?",
    c3_a_side_hint: "Compte les carrés magiques le long d’un bord : ça te donne le nombre de longueurs magiques.",
    c3_a_side_ok: "C’est ça. Et regarde : <strong>{s} FOIS {s} = {a}</strong>, exactement l’aire que Marimon a notée dans ses registres. C’est l’aire qui nous a donné le côté.",

    c3_a_root1: "Arrêtons-nous un instant. Ce qu’on vient de faire — prendre l’aire d’un champ carré, appelons-la <strong>a</strong>, et retrouver la longueur de son côté, appelons-le <strong>s</strong> — porte un nom.",
    c3_a_root2: "On dit que <strong>s</strong> est la <strong>racine carrée</strong> de <strong>a</strong>, et on l’écrit {sqrt_a}.",
    c3_a_root3: "Et maintenant tu sais pourquoi on parle de <em>racine</em> : c’est la longueur du côté qui est à la <strong>racine</strong> d’un champ carré d’aire <strong>a</strong>. Tout le champ pousse à partir d’elle.",
    c3_a_root4: "Voyons si on peut trouver la racine carrée de nos autres champs.",

    c3_ap_go1: "Alors : {sqrt_a}. On sait qu’elle fait plus de 2 et moins de 3, et ça ne suffit pas pour acheter du fil.",
    c3_ap_go2: "Allons au champ et <strong>mesurons</strong>-le, tout simplement. Pose les longueurs magiques le long du côté du bas.",
    c3_ap_two: "Deux longueurs magiques entières sont posées, et puis plus rien. Regarde le bout du côté : il en reste un morceau, et il est bien trop court pour une troisième.",
    c3_ap_ten1: "On est déjà passés par là, toi et moi. Dans le champ étrange, quand les longueurs magiques entières n’allaient pas jusqu’au bout, on en a coupé une en dix.",
    c3_ap_ten2: "Voici ce morceau qui reste, vu de près. Pose les dixièmes le long.",
    c3_ap_ten3: "Deux dixièmes. Et il en reste <strong>encore</strong> un bout — plus court qu’un dixième, donc un troisième dixième ne rentre pas.",
    c3_ap_ten4: "Le côté fait donc plus de <strong>2,2</strong> longueurs magiques et moins de <strong>2,3</strong>. C’est mieux. Mais ce n’est toujours pas un nombre.",
    c3_ap_hun1: "Alors on recommence : on coupe un dixième en dix. Chacun de ces tout petits morceaux est un <strong>centième de longueur magique</strong> — il en faut cent pour faire une longueur magique entière.",
    c3_ap_hun2: "Voici ce qui reste, de plus près encore. Pose les centièmes le long.",
    c3_ap_hun3: "Trois centièmes. Et regarde le bout. Il en reste <strong>encore</strong> un morceau.",
    c3_ap_never1: "Tu vois ce qui se passe ? À chaque fois qu’on coupe plus petit on s’approche, et à chaque fois il reste quelque chose. On pourrait couper ces centièmes en dix à leur tour, et ça recommencerait pareil.",
    c3_ap_never2: "On pourrait continuer comme ça pour toujours ?",
    c3_ap_never_yes: "Pour toujours !",
    c3_ap_never_no: "Ça doit bien s’arrêter quelque part.",
    c3_ap_approx1: "Pour toujours. Ce côté a une longueur qu’aucun découpage n’écrira jamais exactement. Ce n’est pas de notre faute et ce n’est pas une erreur : c’est comme ça, cette longueur.",
    c3_ap_approx2: "Alors on fait ce que font tous ceux qui mesurent depuis toujours : on dit <strong>environ</strong>. Et il y a un signe pour environ — <strong>&asymp;</strong>. On écrit {approx} : le côté fait environ 2,2 longueurs magiques, un peu plus que ça, mais pas jusqu’à 2,3.",
    c3_ap_comp1: "Et ça ne me plaît pas, et je vais te dire pourquoi. Mesurer ne finira jamais, et je ne peux toujours pas arriver au marché et demander <em>environ</em> autant de fil.",
    c3_ap_comp2: "Mais il y a une chose qu’on sait sur ce champ et qu’on n’a pas encore utilisée : <strong>son aire fait exactement {a} carrés magiques</strong>. Marimon l’a notée, et lui, il ne se trompe pas.",
    c3_ap_comp3: "Alors voilà ce que je veux essayer. Pas mesurer le côté — le <strong>calculer</strong>, à partir de l’aire. On essaie ?",
    c3_ap_comp_yes: "On calcule !",
    c3_ap_comp_no: "Tu sais faire ça, toi ?",

    c3_b_name1: "Voilà ce qu’on sait. Le côté fait <strong>2 longueurs magiques entières</strong>, et puis <strong>un petit bout en plus</strong>. Ce bout, on l’a mesuré trois fois et on ne l’a jamais attrapé.",
    c3_b_name2: "Alors arrêtons d’essayer de l’attraper, et donnons-lui plutôt un nom. On va appeler ce bout <strong>d</strong>, comme la <em>différence</em> entre le 2 qu’on connaît et le côté qu’on cherche.",
    c3_b_name3: "Et à ce moment-là, le côté, c’est exactement ça : {eq}. On ne sait pas encore ce que vaut d. Mais on peut l’écrire, et il se trouve que ça suffit.",

    c3_b_cut1: "Bon. Le champ est un carré, et on sait trouver l’aire d’un carré : {formula}. L’aire de ce champ, c’est donc {sq}.",
    c3_b_cut2: "Deux côtés, chacun coupé en deux. Ça te rappelle quelque chose ? Ça devrait — c’est exactement ce qu’on a fait au champ étrange. Prolongeons les traits.",
    c3_b_cut_btn: "Prolonge les traits !",
    c3_b_cut3: "Quatre morceaux. Prenons-les un par un.",

    c3_b_big_q: "Le grand d’abord, dans le coin du bas : <strong>2 longueurs magiques sur 2 longueurs magiques</strong>. Ça fait combien de carrés magiques ?",
    c3_b_big_hint: "2 FOIS 2 — directement dans la table.",
    c3_b_big_ok: "Quatre carrés magiques, et les voilà posés sur le terrain. C’est le morceau qu’on sait compter.",

    c3_b_strip1: "Maintenant les deux rectangles longs et fins. Chacun fait <strong>2 longueurs magiques</strong> de long et <strong>d</strong> de large — son aire est donc {term}.",
    c3_b_strip2: "Et non, on ne peut pas mettre un nombre là-dessus, puisqu’on ne connaît pas d. Ce n’est pas grave. On ne compte pas encore, on <strong>écrit</strong>.",

    c3_b_corner1: "Et le petit, tout au fond du coin : <strong>d</strong> sur <strong>d</strong>. Son aire est {term}.",
    c3_b_corner2: "Tu l’as déjà rencontré, ce coin. Dans le champ étrange, c’était celui qu’on oubliait le plus facilement. Garde-le à l’œil — il va devenir le morceau le plus utile de ce champ.",

    c3_b_eq1: "Remets les quatre ensemble et tu retrouves le champ entier. L’aire, c’est donc {sum}.",
    c3_b_eq2: "Et cette aire, on la connaît déjà. Marimon l’a notée : <strong>{a} carrés magiques</strong>, exactement. Donc :",
    c3_b_eq3: "Une seule ligne, et tout ce qu’on sait de ce champ est dedans. Il ne reste plus qu’à essayer d’en déduire <strong>d</strong>.",


    c3_c_off1: "Regarde cette ligne. À gauche, quatre carrés magiques et trois morceaux bizarres. À droite, {a} carrés magiques. Les quatre sont des <strong>deux</strong> côtés — alors enlevons-les des deux côtés, et voyons ce qui reste.",
    c3_c_off_btn: "Enlève les quatre !",
    c3_c_off_q: "Le champ contenait {a} carrés magiques et on vient d’en enlever 4. Combien de carrés magiques de terrain nous reste-t-il ?",
    c3_c_off_hint: "{a} carrés magiques, moins 4.",
    c3_c_off2: "Un carré magique. Et voilà tout ce qui reste — trois morceaux de terrain qui, ensemble, font exactement un carré magique. Regarde, je les ai mis bien alignés en dessous pour que tu puisses mieux les voir :",

    c3_c_join1: "Regarde encore les deux longs et fins. Ils font exactement la même taille tous les deux — <strong>2</strong> de long et <strong>d</strong> de large. Alors mettons-les bout à bout.",
    c3_c_join_btn: "Mets-les bout à bout !",
    c3_c_join2: "Une seule bande, <strong>4</strong> longueurs magiques de long et <strong>d</strong> de large : {term}. Il ne reste donc plus que deux morceaux — la bande et le coin, qui font un carré magique à eux deux.",

    c3_c_small1: "Et maintenant, le passage intéressant. Regarde le petit coin qui est resté tout seul. Il est vraiment <em>minuscule</em>.",
    c3_c_small2: "Si on l’oubliait tout simplement — si on faisait comme si la bande était le carré magique à elle toute seule — est-ce qu’on se tromperait beaucoup ?",
    c3_c_small_no: "Presque pas.",
    c3_c_small_yes: "Je préférerais le garder.",

    c3_c_drop1: "Presque pas. Alors c’est exactement ce qu’on va faire : <strong>oublier le coin</strong>. Pas parce qu’il n’est rien — il est quelque chose — mais parce qu’il est assez petit pour que l’oublier ne gâche pas trop la réponse.",
    c3_c_drop2: "Mais attention — barrer ce coin change ce qu’on cherche. Le <em>vrai</em> d a besoin de son coin pour que la somme fasse pile un carré magique. Sans lui, le nombre qui convient est un nombre un peu différent.",
    c3_c_drop3: "Alors il reçoit un nom à lui : {dtil}, avec une petite vague au-dessus pour dire <em>c’est celui qu’on obtient lorsque l’on élimine le coin</em>. Et là, notre ligne est <strong>exacte</strong> : {eq}. Pas <em>environ</em> — exactement, parce que {dtil} <em>est</em> le nombre qui la rend vraie.<br>Ce qui n’est qu’<em>environ</em>, c’est ceci : {near}. Notre nouveau nombre est proche du vrai, et on verra plus tard à quel point.",

    c3_c_big1: "Encore une chose qui vaut le coup d’être remarquée avant de continuer. Il y a un instant, il fallait la bande et le coin, tous les deux ensemble, pour couvrir tout le carré magique. Maintenant, la bande doit le couvrir entièrement toute seule.",
    c3_c_big_q: "Alors lequel des deux est le plus grand — notre nouveau {dtil}, ou le vrai {d} ?",
    c3_c_big_yes: "{dtil} est plus grand.",
    c3_c_big_no: "{d} est plus grand.",
    c3_c_big_wrong: "Réfléchis encore. Le carré magique n’a pas changé de taille, et on a retiré un morceau de ce qui le couvre. Ce qui reste doit bien compenser la différence.",
    c3_c_big2: "Oui, c’est {dtil} le plus grand. Le même carré, couvert par moins de morceaux — celui qui reste doit donc grossir un peu. Et comme sa longueur ne change pas, {L}, c’est forcément la hauteur {l} qui grandit. Voici l’ancienne bande posée dans la nouvelle, avec le terrain en plus hachuré :",
    c3_c_big3: "Ce n’est qu’un cheveu — si fin qu’il faut grossir le bout dix fois avant que les hachures se voient. Et c’est bien là l’idée : ce petit cheveu, c’est l’erreur que nous faisons en utilisant {dtil} à la place de {d}. Si le cheveu est suffisamment petit, notre approximation de {d} par {dtil} sera bonne.",
    c3_c_lbl_extra: "ce que {dtil} ajoute",
    c3_d_cut1: "Voici notre bande : {L} longueurs magiques de long, {d} de large, et elle couvre exactement un carré magique.",
    c3_d_cut2: "Découpons-la en <strong>quatre bandes égales</strong>, d’une longueur magique chacune.",
    c3_d_cut_btn: "Découpe-la en quatre !",
    c3_d_cut3: "Quatre fois exactement la même forme — chacune longue de <strong>1</strong> et large de {d}, donc chacune d’aire {area1}. Autrement dit : {eq1}",
    c3_d_stack1: "Or {a} et {b}, c’est la même chose — c’est la <strong>commutativité</strong>. On peut donc écrire {eq2}, ce qui veut dire qu’on peut <strong>empiler</strong> les quatre petites bandes {b} les unes sur les autres au lieu de les aligner en une seule bande plus longue.",
    c3_d_stack_btn: "Empile-les !",
    c3_d_st_area: "Et les voilà — et tu vois le {d} quatre fois de suite, le long du côté.",
    c3_d_as1: "Et maintenant l’<strong>associativité</strong> : quand on multiplie trois nombres, on choisit lesquels deux on fait en premier. On peut donc aller un cran plus loin : {eq3}",
    c3_d_as2: "Rassemble les quatre !",
    c3_d_as3: "Les quatre {d} du côté deviennent un seul {L}. En empilant les bandes, on a donc fabriqué un <strong>rectangle</strong> de côtés {L} et {l} — et il couvre toujours exactement un carré magique.",
    c3_d_try1: "Alors : est-ce que {L} est plus long qu’une longueur magique, ou plus court ? Ne devinons pas — essayons, et regardons.",
    c3_d_try_long_q: "Imaginons qu’on le fasse <em>plus long</em>. Voilà à quoi ressemblerait le rectangle. Le terrain qu’il couvre serait-il plus grand ou plus petit qu’un carré magique ?",
    c3_d_try_short_q: "Et maintenant dans l’autre sens. Imaginons qu’on le fasse <em>plus court</em>. Plus grand ou plus petit qu’un carré magique ?",
    c3_d_opt_larger: "Plus grand.",
    c3_d_opt_smaller: "Plus petit.",
    c3_d_opt_yes: "Oui.",
    c3_d_opt_no: "Non.",
    c3_d_try_long_ok: "Plus grand — ça déborde par le haut. Et ça ne va pas : notre rectangle doit couvrir <strong>exactement</strong> un carré magique, pas une miette de plus. Donc {L} <strong>ne peut pas être plus long</strong> qu’une longueur magique.",
    c3_d_try_long_no: "Regarde encore. La pile est plus haute que le carré magique, et elle est aussi large que lui.",
    c3_d_try_short_ok: "Plus petit — ça n’arrive pas en haut. Et ça ne va pas non plus : notre rectangle doit couvrir un carré magique entier, pas un bout. Donc {L} <strong>ne peut pas être plus court</strong> non plus.",
    c3_d_try_short_no: "Regarde encore. La pile s’arrête avant le haut du carré magique, et elle est aussi large que lui.",
    c3_d_must_q: "Donc {L} ne peut pas être plus long qu’une longueur magique, et il ne peut pas être plus court. Alors — quoi, du coup ? Il est forcément <strong>égal</strong> à une longueur magique ?",
    c3_d_must_no: "Qu’est-ce qu’il reste d’autre ? Ni plus long, ni plus court. Après ça, il n’y a plus qu’une seule possibilité pour une longueur.",
    c3_d_sq_q2: "Oui ! {eq}. Et ça fait quoi, de notre rectangle, celui dont les côtés sont {L} et {l} ? Est-ce que c’est un <strong>carré</strong> ?",
    c3_d_sq_no2: "Regarde encore ses deux côtés. Ils font tous les deux une longueur magique.",
    c3_d_sq_ok2: "Un carré — et pas n’importe lequel. Son côté fait une longueur magique et son terrain fait un carré magique. C’<strong>est</strong> un carré magique.",
    c3_d_sq_ok3: "Et par conséquent, le côté {L} de ce carré est égal à une longueur magique. Le voilà écrit des deux façons — comme une égalité, et comme le terrain qu’elle raconte :",
    c3_d_case_big: "si le côté était plus long…",
    c3_d_case_small: "si le côté était plus court…",
    c3_d_case_toobig: "… trop de terrain",
    c3_d_case_toosmall: "… pas assez de terrain",
    c3_d_stack3: "Quatre. Quatre {d}, l’un sur l’autre, font une longueur magique. Donc {d} est l’une des quatre parts égales d’une longueur magique — un <strong>quart</strong> de longueur magique.",
    c3_d_lbl_one: "un carré magique",
    c3_d_lbl_1ml: "1 longueur magique",
    c3_q_how1: "On sait donc que {eq} — quatre d’entre eux, l’un après l’autre, font une longueur magique.",
    c3_q_how2: "Alors, combien mesure {d} tout seul ?",
    c3_q_opt_quarter: "un quart de longueur magique",
    c3_q_opt_half: "une moitié de longueur magique",
    c3_q_opt_third: "un tiers de longueur magique",
    c3_q_opt_tenth: "un dixième de longueur magique",
    c3_q_sh_half: "une moitié",
    c3_q_sh_third: "un tiers",
    c3_q_sh_quarter: "un quart",
    c3_q_sh_tenth: "un dixième",
    c3_q_how_no: "Regarde encore. Il en faut <strong>quatre</strong> pour remplir la longueur magique — ni plus, ni moins.",
    c3_q_lbl_1ml: "une longueur magique",
    c3_q_sup_tenths: "il te reste : des dixièmes de longueur magique",
    c3_q_sup_hund: "il te reste : des centièmes de longueur magique",
    c3_q_w1: "Un quart de longueur magique. Voilà ce qu’est {d}.",
    c3_q_w2: "Mais comment est-ce qu’on <em>écrit</em> ça ? On sait écrire les dixièmes de longueur magique, et les centièmes. Mais les quarts ? Comment ferait-on pour un quart ?",
    c3_q_w3: "Essayons d’abord avec les dixièmes — si ça marchait, ce serait tellement plus simple.",
    c3_q_t1: "Voici un quart de longueur magique, vu de près. Est-ce qu’on peut compter un nombre entier de <strong>dixièmes</strong> pour le remplir exactement ? <strong>Fais glisser un dixième sur le quart</strong>, ou clique simplement sur le quart.",
    c3_q_t2: "Deux dixièmes posés, et le quart n’est pas plein. Pose-en encore un.",
    c3_q_t3: "Trop ! Le troisième dixième dépasse le bout. Un quart de longueur magique fait donc <strong>plus de 2 dixièmes</strong> et <strong>moins de 3 dixièmes</strong>. Les dixièmes seuls n’y arriveront pas.",
    c3_q_t4: "Voyons si ça tombe mieux avec les centièmes.",
    c3_q_h1: "Le même quart — et maintenant on a aussi des centièmes en main. Commence par les deux dixièmes, puisqu’on sait qu’ils rentrent : <strong>fais-les glisser sur le quart</strong>, ou clique dessus.",
    c3_q_h2: "Maintenant, remplis le trou qui reste avec les centièmes. Est-ce que ça tombe juste ?",
    c3_q_h3: "Oui ! Pas une miette en trop, pas une miette en moins. Alors — combien de <strong>dixièmes</strong> as-tu posés ?",
    c3_q_h3_hint: "Compte les deux gros morceaux.",
    c3_q_h4: "Et combien de <strong>centièmes</strong> ?",
    c3_q_h4_hint: "Compte les petits, au bout.",
    c3_q_h5: "Deux dixièmes et cinq centièmes. Et ça s’écrit comment, en longueurs magiques entières ?",
    c3_q_h5_hint: "Rien avant la virgule, puis les dixièmes, puis les centièmes.",
