    put('left:' + (OX + lx - 76) + 'px; top:' + (OY + y * px + hh * px / 2 - 11) + 'px;' +
      'width:70px; text-align:right; font-size:15px; font-weight:bold; color:' + col +
      '; z-index:9;').innerHTML = txt;
  });
  if (o.side) {                                    // a measure up the big square's far edge
    box(W + 10, -G, 11, D + G, 'border:3px solid ' + o.side[1] +
      '; border-left:none; z-index:7;');
    put('left:' + (OX + W + 26) + 'px; top:' + (OY - G + (D + G) / 2 - 12) + 'px;' +
      'width:70px; font-size:15px; font-weight:bold; color:' + o.side[1] +
      '; z-index:7;').innerHTML = o.side[0];
  }
  return stage;
}

// PART G's PICTURES.
// The two fields with their equations underneath, before and after everything is moved to
// one side — so "they are the same problem" is something to look at rather than be told.
function gPairEl(moved) {
  const row = document.createElement('div');
  // bottoms aligned, so the two equations underneath land on one line — they are being
  // compared, and a comparison reads better level
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-end;' +
    'gap:34px; margin-top:14px; flex-wrap:wrap;';
  const col = (el, eq) => {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex; flex-direction:column; align-items:center;';
    c.appendChild(el);
    const cap = document.createElement('div');
    cap.style.cssText = 'margin-top:6px; font-size:15px; text-align:center;';
    cap.innerHTML = eq;
    c.appendChild(cap);
    row.appendChild(c);
  };
  const keep = FIELD.i;
  setField(3);
  col(stackFieldEl('whole', { px: 26, labels: { rect: bold(fmtNum(2 * FIELD.B)) } }),
    bold(nw(moved ? 's &times; s + 4 &times; s &minus; 21 = 0' : 's &times; s + 4 &times; s = 21')));
  setField(keep);
  col(stripFieldEl({ px: 26, cLabel: bold(fmtNum(FF.C)) }),
    bold(nw(moved ? 's &times; s &minus; 10 &times; s + 21 = 0' : 's &times; s + 21 = 10 &times; s')));
  return row;
}

// The one line, with the plus-or-minus in it.
// ⚠️ It takes the SIGNED coefficients, `B̃` and `C̃`, because that is what `gOne` has just
// named — the screens either side of it would otherwise call the same two numbers by two
// different letters. Part F's own line (`fRule`) and Part G's summary (`gSum`) keep plain
// `B` and `C`: those are that field's real length and real area, both positive, and the
// two lines agree because `B̃ = −B` there.
function gLineHTML() {
  const h2 = fracHTML(BTIL, '2');
  return bold(nw('s = &minus;' + h2 + ' &plusmn; ' +
    sqrtHTML(nw(h2 + ' &times; ' + h2 + ' &minus; ' + CTIL))));
}

// The three sign chains gLine works through, built rather than written into strings — this
// chapter has been strict about never putting a symbol in the dictionary, and threading a
// dash through six terms of a placeholder would be worse than building it.
// ⚠️ Each term is nowrap and every "=" travels with the term AFTER it, so a chain that has to
// wrap breaks between terms and never inside a product. These are long: the squaring one is
// six terms and will wrap at 768px, which is what that rule is for.
function gChain(parts) {
  return '<strong>' + parts.map((q, i) => i ? nw('= ' + q) : nw(q)).join(' ') + '</strong>';
}
function gSignChains() {
  const m = '&minus;', x = ' &times; ', h = fracHTML('B', '2');
  const hh = h + x + h;
  return {
    neg: gChain([m + BTIL, m + '(' + m + '10)', m + '1' + x + '(' + m + '1' + x + '10)',
                 '(' + m + '1' + x + m + '1)' + x + '10', '1' + x + '10', '10']),
    sq: gChain([fracHTML(BTIL, '2') + x + fracHTML(BTIL, '2'),
                '(' + m + h + ')' + x + '(' + m + h + ')',
                '(' + m + '1' + x + h + ')' + x + '(' + m + '1' + x + h + ')',
                '(' + m + '1' + x + m + '1)' + x + hh, '1' + x + hh, hh]),
    cee: gChain([m + CTIL, m + '(' + m + 'C)', m + '1' + x + '(' + m + '1' + x + 'C)',
                 '(' + m + '1' + x + m + '1)' + x + 'C', '1' + x + 'C', 'C']),
    hh: hh
  };
}

// What the two signs actually DO in the line, worked through rather than asserted. Every
// chain sits on its own centred line: five dense paragraphs of dashes inside running prose
// would be unreadable, and the chapter's habit is to give an equation its own line anyway.
function gSignsHTML() {
  const c = gSignChains(), m = '&minus;';
  const ctr = h => '<p style="margin-top:12px; text-align:center; font-size:17px">' + h + '</p>';
  return '<p style="margin-top:14px">' + t('c4_g_sg1', {
      bt: bold(BTIL), b4: bold(nw(BTIL + ' = B = 4')) }) + '</p>' +
    '<p style="margin-top:12px">' + t('c4_g_sg2', {
      bt: bold(BTIL), b10: bold(nw(BTIL + ' = ' + m + 'B = ' + m + '10')) }) + '</p>' +
    ctr(c.neg) +
    '<p style="margin-top:12px">' + t('c4_g_sg3', {
      bt: bold(BTIL), bteq: bold(nw(BTIL + ' = ' + m + 'B')) }) + '</p>' +
    ctr(c.sq) +
    '<p style="margin-top:6px">' + t('c4_g_sg3b') + '</p>' +
    '<p style="margin-top:12px">' + t('c4_g_sg4', { ct: bold(CTIL), g: bold('g') }) + '</p>' +
    '<p style="margin-top:12px">' + t('c4_g_sg5', {
      ct: bold(CTIL), ceq: bold(nw(CTIL + ' = ' + m + 'C')) + ', ' + t('c4_g_sg5c') }) + '</p>' +
    ctr(c.cee) +
    '<p style="margin-top:6px">' + t('c4_g_sg5b', { hh: bold(nw(c.hh)) }) + '</p>' +
    '<p style="margin-top:12px">' + t('c4_g_sg6', { pm: bold('&plusmn;') }) + '</p>';
}

// The field's own line in full, built from the very numbers the walk asks for — so the
// equation under the picture and the `B̃`/`C̃` the questions want cannot drift apart.
//   B̃ = 4,  C̃ = −21  ->  s x s + 4 x s − 21 = 0
//   B̃ = −10, C̃ = 21  ->  s x s − 10 x s + 21 = 0
// ⚠️ Drawn on EVERY state of the walk, so it never appears or vanishes between two
// consecutive screens — and it is the problem, so it belongs under the field it is about
// rather than up with the formula, which is the tool.
function gEqnRow(Bt, Ct) {
  const p = document.createElement('p');
  p.style.cssText = 'text-align:center; font-size:18px; margin:14px 0 0';
  p.innerHTML = gEqnHTML(Bt, Ct);
  return p;
}
function gEqnHTML(Bt, Ct) {
  const term = (n, unit) => (n < 0 ? ' &minus; ' : ' + ') + fmtNum(Math.abs(n)) + unit;
  return bold(nw('s &times; s' + term(Bt, ' &times; s') + term(Ct, '') + ' = 0'));
}

// Two answers on a number line, one of which is not a length. ⚠️ Drawn from zero, so that
// a root to the LEFT of zero is visibly somewhere no field can be — which is the whole of
// what "a length that cannot be" means, and it is better seen than asserted.
function gRootsEl(marks) {
  const lo = -9, hi = 9, px = 34;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; margin:26px auto 0;' +
    'width:' + ((hi - lo) * px + 60) + 'px; height:96px;';
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    wrap.appendChild(d);
    return d;
  };
  const X = v => 30 + (v - lo) * px;
  put('left:30px; top:44px; width:' + ((hi - lo) * px) + 'px; height:3px;' +
    'background:#3a3a3a;');
  // no field can have a side at or below zero, so that half of the line is greyed out
  put('left:30px; top:34px; width:' + ((0 - lo) * px) + 'px; height:23px;' + HATCH +
    'opacity:0.5;');
  for (let v = lo; v <= hi; v++) {
    put('left:' + (X(v) - 1) + 'px; top:' + (v % 5 === 0 ? 36 : 40) + 'px; width:2px;' +
      'height:' + (v % 5 === 0 ? 19 : 11) + 'px; background:#7a7060;');
    if (v % 5 === 0) put('left:' + (X(v) - 20) + 'px; top:60px; width:40px;' +
      'text-align:center; font-size:13px; color:#7a7060;').innerHTML =
        (v < 0 ? '&minus;' : '') + fmtNum(Math.abs(v));
  }
  (marks || []).forEach(v => {
    const ok = v > 0;
    put('left:' + (X(v) - 7) + 'px; top:' + (44 - 5) + 'px; width:14px; height:14px;' +
      'border-radius:50%; background:' + (ok ? '#3f7a34' : '#a3364a') + '; z-index:3;');
    put('left:' + (X(v) - 40) + 'px; top:12px; width:80px; text-align:center;' +
      'font-size:15px; font-weight:bold; z-index:3; color:' +
      (ok ? '#3f7a34' : '#a3364a') + ';').innerHTML =
      nw((v < 0 ? '&minus;' : '') + fmtNum(Math.abs(v)));
  });
  return wrap;
}

// BOTH ROOTS OF PART F's EQUATION, AS FIELDS. They differ in whether the square is wider
// or narrower than what lies beside it, which is the only way to tell them apart and is
// the note the chapter ends on.
// ⚠️ `o.cLabel` / `o.bLabel` override the two labels. `gSum` is the one screen that wants the
// SIGNED letters on the ground — it is the summary, and its whole job is mapping the picture
// onto the line — where `gNeg` and `gTwo` deliberately keep the true length and area there,
// because on those screens how the dash ARISES is the question being asked. Every other
// caller passes neither and is unchanged by construction.
function gBothFieldsEl(focus, o) {
  o = o || {};
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-end;' +
    'gap:40px; margin-top:14px; flex-wrap:wrap;';
  [3, 7].forEach((sv, i) => {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex; flex-direction:column; align-items:center;' +
      (focus !== undefined && focus !== i ? 'opacity:0.32;' : '');
    c.appendChild(stripFieldEl({ sv: sv, px: 26,
      cLabel: o.cLabel || bold(fmtNum(FF.C)),
      labels: { s: bold('s = ' + fmtNum(sv)), b: o.bLabel } }));
    row.appendChild(c);
  });
  return row;
}

// The tray, with a caption that says what is still in hand. Chapter 3's shape.
function squareTray(count) {
  const label = document.createElement('div');
  label.id = 'supply-label';
  label.textContent = t('supply_squares');
  gameArea.appendChild(label);
  const supply = document.createElement('div');
  supply.id = 'supply-area';
  for (let i = 0; i < count; i++) {
    const sq = document.createElement('div');
    sq.className = 'magic-square';
    sq.draggable = true;
    sq.addEventListener('dragstart', () => { currentDraggedSquare = sq; sq.classList.add('dragging'); });
    sq.addEventListener('dragend', () => { sq.classList.remove('dragging'); currentDraggedSquare = null; });
    supply.appendChild(sq);
  }
  gameArea.appendChild(supply);
  // A square that LANDS comes out of the tray — the one that was dragged, or else the
  // last in the row. (A refused one goes back in the hand; nothing is refused here.)
  // ⚠️ An empty tray must take its caption with it, or the screen reads "your magic squares,
  // click on the field to place them" over nothing at all. Chapter 3 shipped exactly that
  // once, on its finished quarter.
  const tidy = () => {
    if (supply.querySelectorAll('.magic-square').length) return;
    label.remove(); supply.remove();
  };
  return () => {
    if (currentDraggedSquare) { currentDraggedSquare.remove(); currentDraggedSquare = null; }
    else {
      const left = supply.querySelectorAll('.magic-square');
      if (left.length) left[left.length - 1].remove();
    }
    tidy();
  };
}

function stage(el) { gameArea.appendChild(el); return el; }

// ---------------------------------------------------------------------------
// PART A — the L arrives, and its side is found by covering
// ---------------------------------------------------------------------------
// PART G — THE SAME CUT, RUN ON THE OTHER ROOT'S FIELD (Sylvain, 2026-08-27).
//
// The `s = 7` field: a square 7 x 7 with a rectangle 3 wide and 7 deep beside it, still
// 21 magic squares and still 10 long. Halving the strip lands the mark INSIDE the square,
// so the rule as the child learned it does not fit — and that is the screen this is for.
//
// What the cut actually needed was the rectangle's LONGER side, cut at `h` from one end.
// Last field that side lay along the strip and the mark fell in the middle of it; here the
// longer side is the rectangle's DEPTH, because the square overshoots the mark instead of
// falling short of it — by the very same `g`. Cut there, walk the little piece round, and
// the same 5 x 5 less a 2 x 2 comes out.
//
// ⚠️ AND THE L's CORNER SQUARE IS 3 x 3, NOT 7 x 7 — the OTHER root's square, because an L
// of 21 cannot hold a corner of 49. That is not a flaw in the picture, it is the point of
// the part: the cut hands back `g`, and `g` hands back BOTH answers at once.
//
//   field -> cut -> moved -> parts -> square, in ONE canvas so nothing jumps.
const GPX = 44, G7 = 7;
function gCutEl(state, o) {
  o = o || {};
  const px = GPX, s = G7, B = FF.B, h = fH(), g = fG(), w = B - s;   // 7, 10, 5, 2, 3
  const MOVED = (state === 'moved' || state === 'parts' || state === 'square');
  // ⚠️ padL is the same on EVERY state, drawn or not: the half of B stands up the field's
  // left edge on one of them, and a gutter that appears only there would slide the whole
  // field sideways between two consecutive screens.
  // ⚠️ FOOT is constant, and deep enough for FOUR bracket rows (s|w, h|h, g, B). The
  // field hangs from CAP, so a taller canvas only adds space underneath and nothing on
  // screen moves — where a per-screen FOOT would slide the button between two states.
  const padL = 104, CAP = 26, FOOT = 150;
  const stage = document.createElement('div');
  stage.style.cssText = 'position:relative; margin:10px auto 0;' +
    'width:' + (padL + (B + g) * px + 120) + 'px; height:' + (CAP + s * px + FOOT) + 'px;';
  const OX = padL, OY = CAP;
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    stage.appendChild(d);
    return d;
  };
  // everything below is in FIELD UNITS, so the geometry reads like the arithmetic
  const box = (x, y, ww, hh, css) => put('left:' + (OX + x * px) + 'px;' +
    'top:' + (OY + y * px) + 'px; width:' + (ww * px) + 'px; height:' + (hh * px) + 'px;' +
    'box-sizing:border-box;' + css);
  // ⚠️ `focus` is the list of pieces to keep at full strength; everything else fades, so
  // the picture says which ground the question is about at the moment it is asked. Absent,
  // nothing fades — the default has to stay untouched, since every earlier screen uses it.
  const lit = k => !o.focus || o.focus.indexOf(k) >= 0;
  const fade = k => lit(k) ? '' : 'opacity:0.24;';
  const fill = (x, y, ww, hh, pc, z, key) => box(x, y, ww, hh, 'background:' + pc.fill +
    '; outline:2px solid ' + pc.ink + '; outline-offset:-1px; z-index:' + (z || 3) + ';' +
    fade(key));
  const label = (x, y, ww, hh, txt, ink) => {
    box(x, y, ww, hh, 'display:flex; align-items:center; justify-content:center;' +
      'font-size:15px; font-weight:bold; color:' + ink + '; z-index:7;').innerHTML = txt;
  };

  fill(0, 0, s, s, PIECE.sq, 3, 'sq');                         // the field's own square
  if (o.sq) label(0, 0, s, s, o.sq, PIECE.sq.ink);
  if (MOVED) {
    // ⚠️ keyed on nothing, so it fades with everything else the moment a question lights
    // one piece: it is where the little piece USED to be and is never the subject.
    box(s, 0, w, g, GHOST + 'z-index:2;' + fade('gone'));      // where the little piece was
    if (state === 'parts' || state === 'square') {
      fill(s, g, w, g, PIECE.arm, 3, 'L');                     // the L's top-left strip
      fill(s, s - w, w, w, PIECE.sq, 3, 'L');                  // ...and its corner square
      // ⚠️ Its OWN label, never the field's. The corner is 3 x 3 and the field's square
      // is 7 x 7, and the whole punchline is that those are different numbers.
      if (o.corner3) label(s, s - w, w, w, o.corner3, PIECE.sq.ink);
    } else {
      fill(s, g, w, h, PIECE.foot, 3, 'L');   // half the L, on `moved`
    }
    fill(B, s - w, g, w, PIECE.arm, 5, 'L');                   // the piece, walked round
  } else if (state === 'cut') {
    fill(s, 0, w, g, PIECE.arm);
    fill(s, g, w, h, PIECE.foot);
  } else {
    fill(s, 0, w, s, PIECE.foot);
  }
  // the corner: missing, then filled in
  if (state === 'square' || (MOVED && o.fillCorner))
    fill(B, g, g, g, PIECE.corn, 4, 'corner');
  else if (MOVED) {
    box(B, g, g, g, 'background:#f4f0e4; z-index:4;' + fade('corner'));
    // ⚠️ A LIT GHOST NEEDS ITS OWN MARK. The corner is missing ground, so it cannot be
    // filled to say "this is the piece we mean" — that would draw land the field has not
    // got. It takes a heavier dashed edge instead, in the colour it would wear if it were
    // there, and only while a question is actually pointing at it.
    box(B, g, g, g, GHOST + 'z-index:5;' + fade('corner'));
  }
  if (MOVED) box(s, g, h, h, 'outline:3px solid #3a3a3a; z-index:6; pointer-events:none;');
  if (o.area) label(s, g, h, h, o.area, '#3a3a3a');
  if (o.corner && lit('corner')) label(B, g, g, g, o.corner, PIECE.corn.ink);
  box(0, 0, MOVED ? s : B, s, 'outline:3px solid #3a3a3a; z-index:8; pointer-events:none;');
  // HALF OF B, STOOD UP THE FIELD'S LEFT EDGE, and carried across (Sylvain, 2026-08-27).
  // ⚠️ This is Chapter 2's own "carry the lines across", not a new instruction — which is
  // the whole point of framing it this way. The child is never told to measure the
  // rectangle's depth (they cannot: it is `s`, the unknown). They stand a length they HAVE
  // against the side of the field and carry it over, and where it crosses the rectangle is
  // the cut.
  if (o.stand) {
    box(-0.62, s - h, 0.26, h,
      'border:3px solid #a3364a; border-right:none; z-index:7;');
    put('left:0; top:' + (OY + (s - h / 2) * px - 12) + 'px; width:' + (padL - 40) + 'px;' +
      'text-align:right; font-size:15px; font-weight:bold; color:#a3364a; z-index:7;')
      .innerHTML = o.stand;
  }
  if (o.carry) box(0, s - h - 0.035, MOVED ? s : B, 0.07,
    'background:#a3364a; z-index:9;');
  // ⚠️ `s` up the LEFT of the field's own square, in the same gutter `stand` uses (they are
  // never both set). With `h` measured up the right of the big one, the two squares are seen
  // to be squares — each as tall as the bracket under it is wide — instead of being asserted.
  if (o.sleft) {
    box(-0.62, 0, 0.26, s,
      'border:3px solid ' + PIECE.sq.ink + '; border-right:none; z-index:7;');
    put('left:0; top:' + (OY + s / 2 * px - 12) + 'px; width:' + (padL - 40) + 'px;' +
      'text-align:right; font-size:15px; font-weight:bold; color:' + PIECE.sq.ink +
      '; z-index:7;').innerHTML = o.sleft;
  }
  // the halfway mark on its own, for the screens whose `h` is measured BELOW the field
  if (o.split) box(h - 0.04, 0, 0.08, s, 'background:#a3364a; z-index:9;');
  // the strip's halfway mark — which on THIS field falls inside the square
  if (o.mid) {
    box(h - 0.04, -0.3, 0.08, s + 0.3, 'background:#a3364a; z-index:9;');
    const tb = (x, ww) => {
      box(x, -0.62, ww, 0.24, 'border:3px solid #a3364a; border-bottom:none; z-index:7;');
      put('left:' + (OX + x * px) + 'px; top:' + (OY - 0.62 * px - 22) + 'px;' +
        'width:' + (ww * px) + 'px; text-align:center; font-size:14px; font-weight:bold;' +
        'color:#a3364a; z-index:7;').innerHTML = o.mid;
    };
    tb(0, h); tb(h, h);
  }
  // brackets under the strip, and up the right-hand edge of whatever is being measured
  // `row` is an index now (0..3), and `true` still means row one, so nothing older moves.
  const hb = (x, ww, txt, col, row) => {
    const y = s + 0.16 + (row === true ? 1 : (row || 0)) * 0.78;
    box(x, y, ww, 0.24, 'border:3px solid ' + col + '; border-top:none; z-index:7;');
    put('left:' + (OX + x * px) + 'px; top:' + (OY + y * px + 14) +
      'px; width:' + (ww * px) + 'px; text-align:center; font-size:15px; font-weight:bold;' +
      'color:' + col + '; z-index:7;').innerHTML = txt;
  };
  (o.bars || []).forEach(b => hb(b[0], b[1], b[2], b[3], b[4]));
  const vb = (x, y, hh, txt, col) => {
    box(x + 0.18, y, 0.24, hh,
      'border:3px solid ' + col + '; border-left:none; z-index:7;');
    put('left:' + (OX + (x + 0.5) * px) + 'px;' +
      'top:' + (OY + (y + hh / 2) * px - 20) + 'px; width:96px; font-size:15px;' +
      'font-weight:bold; color:' + col + '; z-index:7;').innerHTML = txt;
  };
  (o.vbars || []).forEach(b => vb(b[0], b[1], b[2], b[3], b[4]));
  return stage;
}

// ⚠️ ONE bracket row for both of gOtherL's L screens, so nothing appears or vanishes
// between two consecutive pictures. Row 0 tiles the field's square as `h` then `g` and
// carries the L's own side beside them; row 1 spans the square with `s`.
// The whole side of the strip, accounted for: `g` on top nearest the ground, then what the
// strip is made of, then its two halves, then B. Shared by gOther and gOtherL's first screen
// so that not one bracket moves when the little piece walks round.
const gSideBars = () => [
  [fH(), G7 - fH(), bold('g'), PIECE.arm.ink, 0],
  [0, G7, bold('s'), PIECE.sq.ink, 1],
  [G7, FF.B - G7, bold('w'), PIECE.foot.ink, 1],
  [0, fH(), bold('h'), '#a3364a', 2],
  [fH(), FF.B - fH(), bold('h'), '#a3364a', 2],
  [0, FF.B, bold(nw('B = ' + fmtNum(FF.B))), '#3a3a3a', 3],
];

// ⚠️ ONE picture for every screen from the walk-round to the answer, across BOTH steps, so
// the two cannot drift apart. `moved` throughout, on Sylvain's "same plot": the corner stays
// a GHOST, because that ground really is missing — the big square is a construction and its
// outline says so, where filling it in would draw land the field has not got.
// ⚠️ `o` overrides: `{ area: null }` drops the caption on the screens that are ASKING for a
// number it would print, and `focus` lights the one piece the question is about.
const gLPlot = (bot, vb, o) => gCutEl('moved', Object.assign({
  area: bold(areaLabel(FF.C)),
  stand: bold(nw('h = ' + fmtNum(fH()))), carry: true, split: true,
  bars: gSideBars().concat([
    [G7, fH(), bot, '#a3364a', 0],
    [FF.B, fG(), bold('g'), PIECE.arm.ink, 1]]),
  vbars: vb || [] }, o || {}));
// The two vertical measures on the big square's right-hand edge, x = B + g. They are
// ADJACENT and together span the whole of it: `w`, the green piece's long side — which is
// the yellow rectangle's own width — and the corner's side above it. So `w + g = h` is
// something to read off the ground rather than a claim to accept.
// ⚠️ Each keeps the colour of the LETTER it carries, not of the piece it lies against: `w`
// has been the yellow's ink and `g` the green's since the strip was first cut, and the
// letter's colour is what says where the length came from.
const gRightW = lab => [FF.B + fG(), G7 - (FF.B - G7), FF.B - G7, lab, PIECE.foot.ink];
const gRightG = lab => [FF.B + fG(), fG(), fG(), lab, PIECE.arm.ink];
const gRight = () => [gRightW(bold('w')), gRightG(bold('g'))];

// ⚠️ THE SCHOOL FORM RUN BACK OVER EVERY FIELD OF THE CHAPTER (Sylvain, 2026-08-28).
// One generated step per field: the equation said twice — once in AREA terms, as the pieces
// of ground add up, and once in maths, moved to one side — then `Ã`, `B̃`, `C̃` read off it,
// and `a`, `b`, `c` asked for.
// ⚠️ THE L FIELDS NEED THE ADJUSTMENT Sylvain named, and it is one line: an L IS a square
// plus two rectangles (`(s+b)² − b² = s² + 2bs`), so its area equation is
// `s × s + 2 × b × s = a` and the school form falls straight out of it.
// ⚠️ `Ã = 1` on every one of the five, because the piece that repeats is plain `s` — which
// is the point of the sweep: `a` is 1 every time, so the school line collapses to the one
// they already know, and only Part H's field ever needed the general form.
function hFieldSpecs() {
  const L = (n, ai) => {
    const f = L_FIELDS[ai], Bt = 2 * f.B, Ct = -f.C;
    return { n: n, ai: ai, At: 1, Bt: Bt, Ct: Ct, sv: f.s === null ? Math.sqrt(93) - 5 : f.s,
      kind: 'L', area: 's &times; s + 2 &times; ' + fmtNum(f.B) + ' &times; s = ' + fmtNum(f.C) };
  };
  const f3 = L_FIELDS[3];
  return [
    L('hSchA', 0), L('hSchB', 1), L('hSchC', 2),
    { n: 'hSchE', ai: 3, At: 1, Bt: 2 * f3.B, Ct: -f3.C, kind: 'stack', sv: f3.s,
      area: 's &times; s + ' + fmtNum(2 * f3.B) + ' &times; s = ' + fmtNum(f3.C) },
    { n: 'hSchF', ai: 3, At: 1, Bt: -FF.B, Ct: FF.C, kind: 'strip', sv: FF.s,
      area: 's &times; s + ' + fmtNum(FF.C) + ' = ' + fmtNum(FF.B) + ' &times; s' }
  ];
}

function hFieldStep(F, first) {
  return function () {
    clearGame(); showEliel();
    const m = '&minus;';
    const sg = n => (n < 0 ? ' ' + m + ' ' : ' + ') + fmtNum(Math.abs(n));
    // ⚠️ Every number printed here goes through `fn`, not `fmtNum`: a negative one has to
    // wear the chapter's own &minus;, not an ASCII hyphen. `C̃ = -39` was rendering with a
    // stubby dash two lines under a proper one.
    const fn = n => (n < 0 ? m : '') + fmtNum(Math.abs(n));
    const av = F.At * F.At, bv = F.At * F.Bt, cv = F.Ct;
    const k = { a: !first, b: false, c: false, solving: false, s: false };
    // ⚠️ `a` is only asked on the first field: the answer is 1 five times over, and the
    // chapter's rule is that a second run should feel like doing it again, not being taught it
    // again. The FORMULA, though, is run in full on every one — that is the check.
    const bb = bv * bv, fac = 4 * av * cv, disc = bb - fac;
    const rt = Math.sqrt(disc), exact = Number.isInteger(rt);
    const plus = Math.abs((-bv + rt) / (2 * av) - F.sv) < 1e-6;
    const other = ((plus ? -1 : 1) * rt - bv) / (2 * av);
    // ⚠️ `s = ?` IS the square's own side label, not a line of its own: a length on the
    // ground wears its number, which is this project's habit throughout. Plain `s` until the
    // formula run starts, `s = ?` while it is being worked, the number when it lands.
    const sol = () => bold(nw(k.solving ? 's = ' + (k.s ? fn(F.sv) : '?') : 's'));
    const frm = () => bold(nw('s = ' + fracHTML(nw(m + '(' + fn(bv) + ') &plusmn; ' +
      sqrtHTML(nw('(' + fn(bv) + ') &times; (' + fn(bv) + ') ' + m + ' 4 &times; ' +
        fn(av) + ' &times; (' + fn(cv) + ')'))), nw('2 &times; ' + fn(av)))));
    const maths = () => bold(nw('s &times; s' + sg(F.Bt) + ' &times; s' + sg(F.Ct) + ' = 0'));
    const abc = () => bold(nw('a = ' + (k.a ? fn(av) : '?') +
      ', b = ' + (k.b ? fn(bv) : '?') + ', c = ' + (k.c ? fn(cv) : '?')));
    // ⚠️ EACH PLOT WEARS WHAT MARIMON GAVE US (Sylvain, 2026-08-28) — the notch's own side
    // (`B/2` on an L, since an L has two of them and `B̃` is the pair) or the whole `B` on the
    // other two, and the area `C`. Those are the numbers `Ã`, `B̃`, `C̃` are read off, so they
    // belong on the ground rather than only in the sentence.
    const draw = () => F.kind === 'strip'
      ? stripFieldEl({ px: 30, cLabel: bold(nw('C = ' + fmtNum(FF.C))),
          sLabel: bold(nw('s &times; s')), labels: { s: sol() } })
      : F.kind === 'stack'
        ? stackFieldEl(null, { px: 26, area: bold(nw('C = ' + fmtNum(FIELD.C))),
            labels: { rect: bold(nw('B = ' + fmtNum(2 * FIELD.B))), s: sol() } })
        // ⚠️ `pieces: true` — the L drawn as the square and the two rectangles it IS, which is
        // exactly what the area equation above it names.
        : lWithArea();
    // ⚠️ The L's `C` goes ABOVE the field, not through `lFieldEl`'s own `area` option — that
    // one lands inside the horizontal arm, so `C = 39` read as that rectangle's area when 39
    // is the whole L's. Caption and picture have to agree about what they are counting.
    const lWithArea = () => {
      const d = document.createElement('div');
      const cap = document.createElement('p');
      cap.style.cssText = 'text-align:center; font-size:15px; margin:8px 0 0; color:#5a5240';
      cap.innerHTML = bold(nw('C = ' + fmtNum(FIELD.C)));
      d.appendChild(cap);
      d.appendChild(lFieldEl({ px: 26, sv: F.sv, pieces: true, brackets: true,
        labels: { b: bold(nw(fracHTML('B', '2') + ' = ' + fmtNum(FIELD.B))), s: sol() } }));
      return d;
    };
    const pic = () => {
      const w = document.createElement('div');
      const line = (h, css) => { const p = document.createElement('p');
        p.style.cssText = 'text-align:center;' + css; p.innerHTML = h; w.appendChild(p); };
      line(bold(nw(F.area)), 'font-size:18px; margin:2px 0 0');
      line(maths(), 'font-size:18px; margin:10px 0 0; color:#a3364a');
      line(abc(), 'font-size:17px; margin:10px 0 0');
      if (k.solving) line(frm(), 'font-size:18px; margin:12px 0 0; color:#a3364a');
      w.appendChild(draw());
      return w;
    };
    const V = { at: bold(ATIL), bt: bold(BTIL), ct: bold(CTIL),
      a: bold('a'), b: bold('b'), c: bold('c'), s2: bold('s'),
      tri: bold(nw(ATIL + ' = ' + fn(F.At) + ', ' + BTIL + ' = ' + fn(F.Bt) +
        ', ' + CTIL + ' = ' + fn(F.Ct))),
      aeq: bold(nw('a = ' + ATIL + ' &times; ' + ATIL)),
      beq: bold(nw('b = ' + ATIL + ' &times; ' + BTIL)),
      ceq: bold(nw('c = ' + CTIL)) };
    const ASKS = [];
    if (first) ASKS.push({ q: 'c4_h_fs_qa', h: 'c4_h_fs_ha', n: av, set: 'a' });
    ASKS.push({ q: 'c4_h_fs_qb', h: 'c4_h_fs_hb', n: bv, set: 'b' });
    ASKS.push({ q: 'c4_h_fs_qc', h: 'c4_h_fs_hc', n: cv, set: 'c' });
    let i = 0;
    const run = () => {
      clearGame(); showEliel(); stage(pic());
      if (i === ASKS.length) {
        tell(t(first ? 'c4_h_fs_ok1' : 'c4_h_fs_ok', V));
        addButton(t('btn_continue'), () => { k.solving = true; j = 0; beat(); });
        return;
      }
      const q = ASKS[i];
      const lead = i === 0 ? t(first ? 'c4_h_fs_l1' : 'c4_h_fs_l', V) + PARA : '';
      // ⚠️ `decimal` wherever the answer is not a whole number. Without it the input is
      // type="number" and the value goes through parseInt, which throws the dot away — so
      // `c = −26.25` on the second field could never be answered. Chapter 3 hit exactly this
      // when its sums grew tenths.
      askAfterButton(lead + t(q.q, V), q.n, () => { k[q.set] = true; i++; run(); },
        t(q.h, V), { decimal: !Number.isInteger(q.n) });
    };
    // ⚠️ Declared BEFORE the block that fills them: the inexact branch below assigns both,
    // and a `let` after that point is a temporal dead zone. The drive caught it as
    // "Cannot access 'B3' before initialization" — nothing else would have.
    let B3 = {}, RT_APPROX = rt;
    // ⚠️ A FLAT LIST OF BEATS, not nested callbacks — this file has lost a paren that way once.
    const BEATS = [
      ['c4_h_fs_qd', 'c4_h_fs_hd', disc, { d: bold(nw('b &times; b ' + m + ' 4 &times; a &times; c')),
        bb: bold(fn(bb)), fac: bold(fn(fac)) }]
    ];
    if (exact) {
      BEATS.push(['c4_h_fs_qr', 'c4_h_fs_hr', rt,
        { rt: bold(sqrtHTML(fn(disc))), r: bold(fn(rt)) }]);
      BEATS.push(['c4_h_fs_qs', 'c4_h_fs_hs', F.sv,
        { e: bold(nw('(' + fn(-bv) + ' ' + (plus ? '+' : m) + ' ' + fn(rt) +
          ') &divide; ' + fn(2 * av))) }]);
    } else {
      // ⚠️ THE ONE DISCRIMINANT THAT NEVER COMES OUT gets Chapter 3's own method, not a number
      // handed over (Sylvain, 2026-08-28) — and the block it starts from is free: the field
      // BEFORE this one has just established 19 × 19 = 361.
      //   s̃₁ = s̃₀ + (a − ã₀) / (2 × s̃₀) = 19 + 11/38 ≈ 19 + 0.29 = 19.29
      // The share rounds UP, exactly as it did in Chapter 3, so the answer stays too big and
      // the fence is long enough.
      const s0 = Math.floor(rt), s0sq = s0 * s0, rem = disc - s0sq, two = 2 * s0;
      const share = Math.ceil((rem / two) * 100) / 100, rtA = s0 + share;
      B3 = { s0: bold(fn(s0)), s0sq: bold(fn(s0sq)), nx: bold(nw(fn(s0 + 1) + ' &times; ' +
        fn(s0 + 1))), rem: bold(nw(fn(disc) + ' ' + m + ' ' + fn(s0sq))),
        two: bold(nw('2 &times; ' + fn(s0))), sh: bold(fn(share)), rtA: bold(fn(rtA)),
        sum: bold(nw(fn(s0) + ' + ' + fn(share))) };
      RT_APPROX = rtA;
      BEATS.push(['c4_h_fs_qn1', 'c4_h_fs_hn1', (s0 + 1) * (s0 + 1), B3]);
      BEATS.push(['c4_h_fs_qn2', 'c4_h_fs_hn2', rem, B3]);
      BEATS.push(['c4_h_fs_qn3', 'c4_h_fs_hn3', two, B3]);
      BEATS.push(['c4_h_fs_qn4', 'c4_h_fs_hn4', rtA, B3]);
    }
    let j = 0;
    const beat = () => {
      clearGame(); showEliel(); stage(pic());
      if (j === BEATS.length) {
        k.s = true;
        clearGame(); showEliel(); stage(pic());
        tell(t(exact ? 'c4_h_fs_done' : 'c4_h_fs_approx',
          Object.assign({}, V, { seq: bold(nw('s = ' + fn(F.sv))),
            other: bold(fn(other)),
            rt: bold(fmtNum(RT_APPROX)),
            sv: bold(fmtNum(Math.ceil(((-bv + RT_APPROX) / (2 * av)) * 100) / 100)),
            half: bold(nw('(' + fn(-bv) + ' + ' + fmtNum(RT_APPROX) + ') &divide; ' +
              fn(2 * av))),
            old: bold(fmtNum(4.67)) })));
        addButton(t('btn_continue'), nextStep);
        return;
      }
      const [q, h, n, v] = BEATS[j++];
      const vv = Object.assign({}, V, v);
      askAfterButton(t(q, vv), n, beat, t(h, vv), { decimal: !Number.isInteger(n) });
    };
    run();
  };
}

// ⚠️ THE CLOSING GENERALISATION (Sylvain, 2026-08-28). What the whole quest was about, said
// once for ANY field of this shape — and then the two formulas reconciled.
// ⚠️ Every symbol is built here rather than written into the dictionary, as everywhere else in
// this chapter. `gChain` keeps each term nowrap with the `=` travelling with the term after it,
// so the long derivation breaks between terms and never inside a product.
const gM = '&minus;';
function gSchoolHTML() {
  return bold(nw('s = ' + fracHTML(nw(gM + 'b &plusmn; ' +
    sqrtHTML(nw('b &times; b ' + gM + ' 4 &times; a &times; c'))), nw('2 &times; a'))));
}
function gEndP(html, css) {
  return '<p style="margin-top:' + (css || '10px') + '">' + html + '</p>';
}
function gEndCtr(html, size) {
  return '<p style="margin-top:14px; text-align:center; font-size:' + (size || 18) + 'px">' +
    html + '</p>';
}
function gEndRules() {
  return gEndP(t('c4_g_gen1', { eq: bold(nw('a &times; s&sup2;')), bs: bold(nw('b &times; s')),
      s: bold('s'), c: bold('c') })) +
    gEndCtr(bold(nw('a &times; s&sup2; + b &times; s + c = 0')), 19) +
    gEndCtr(gSchoolHTML(), 19) +
    gEndP(t('c4_g_gen2', { one: bold(nw('a = 1')), bt: bold(BTIL), ct: bold(CTIL),
      eq: bold(nw('s&sup2; + ' + BTIL + ' &times; s + ' + CTIL + ' = 0')) }));
}
function gEndTricks() {
  const rt = a => sqrtHTML(a);
  return gEndP(t('c4_g_gen3', { one: bold(nw('a = 1')),
      eq: bold(nw('a &times; s&sup2; + b &times; s + c = 0')),
      sub: bold(nw('S&sup2; + ' + BTIL + ' &times; S + ' + CTIL + ' = 0')),
      sub2: bold('S'),
      defs: bold(nw('S = ' + rt('a') + ' &times; s, ' + BTIL + ' = ' + fracHTML('b', rt('a')) +
        ', ' + CTIL + ' = c')),
      s: bold('s'),
      back: bold(nw('s = ' + fracHTML('S', rt('a')))) })) +
    gEndP(t('c4_g_gen4', { eq: bold(nw('s&sup2; + ' + BTIL + ' &times; s + ' + CTIL + ' = 0')),
      s: bold('s'),
      defs: bold(nw(BTIL + ' = ' + fracHTML('b', 'a') + ', ' + CTIL + ' = ' +
        fracHTML('c', 'a'))) })) +
    gEndP(t('c4_g_gen5', { one: bold(nw('a = 1')), laws: bold(t('c4_g_gen_laws')),
      r1: bold(nw(rt(fracHTML('A', 'B')) + ' = ' + fracHTML(rt('A'), rt('B')))),
      r2: bold(nw('(' + fracHTML('A', 'B') + ')&sup2; = ' + fracHTML('A&sup2;', 'B&sup2;'))) })) +
    gEndCtr(gChain([
      fracHTML(nw(gM + 'b &plusmn; ' + sqrtHTML(nw('b&sup2; ' + gM + ' 4 &times; c'))), '2'),
      gM + fracHTML('b', '2') + ' &plusmn; ' + fracHTML(sqrtHTML(nw('b&sup2; ' + gM +
        ' 4 &times; c')), '2'),
      gM + fracHTML('b', '2') + ' &plusmn; ' + fracHTML(sqrtHTML(nw('b&sup2; ' + gM +
        ' 4 &times; c')), rt('4')),
      gM + fracHTML('b', '2') + ' &plusmn; ' + rt(fracHTML(nw('b&sup2; ' + gM + ' 4 &times; c'), '4')),
      // ⚠️ Sylvain's own intermediate, kept: the division distributing over BOTH terms before
      // `4 × c / 4` collapses to `c`. Folding the two together hides the one step a child
      // would actually need.
      gM + fracHTML('b', '2') + ' &plusmn; ' + rt(nw(fracHTML('b&sup2;', '4') + ' ' + gM + ' ' +
        fracHTML(nw('4 &times; c'), '4'))),
      // ⚠️ `4` becomes `2²` and the `4/4` is pulled out as a factor of its own, so BOTH of
      // the last step's simplifications are set up on the line before it rather than
      // happening at once.
      gM + fracHTML('b', '2') + ' &plusmn; ' + rt(nw(fracHTML('b&sup2;', '2&sup2;') +
        ' ' + gM + ' c &times; (' + fracHTML('4', '4') + ')')),
      gM + fracHTML('b', '2') + ' &plusmn; ' + rt(nw('(' + fracHTML('b', '2') + ')&sup2; ' +
        gM + ' c'))
    ]), 17) +
    gEndP(t('c4_g_gen6', { bt: bold(BTIL), ct: bold(CTIL), b: bold('b'), c: bold('c') }));
}

// ---------------------------------------------------------------------------
// THE CLOSING SET — eight fields nobody has seen, the whole method run on each.
// Scoped and every number asserted in ../ch4_eight_fields.py and CHAPTER4_PLAN.md §15.
// ⚠️ `a` MUST BE A PERFECT SQUARE for a field to exist at all: `a = Ã²`, where `Ã` is how many
// times as wide the square was made. `a = 2` cannot be drawn. That is why both of the two
// `a ≠ 1` fields use `a = 4`.
// ⚠️ `a` is NOT asked on these: it is 1 six times over, `hSchA` has already asked it once and
// said why, and the chapter's rule is that a second run should feel like doing it again rather
// than being taught it again. `B̃` and `C̃` are read off the field instead.
// ---------------------------------------------------------------------------
const E8 = [
  { k: 'L',     s: 2,   b: 3,  C: 16 },
  { k: 'L',     s: 4,   b: 6,  C: 64 },
  { k: 'stack', s: 4,   B: 4,  C: 32 },
  { k: 'stack', s: 2,   B: 10, C: 24 },
  { k: 'strip', s: 6,   B: 8,  C: 12 },
  { k: 'strip', s: 10,  B: 14, C: 40 },
  // ⚠️ `s` is the answer the child ACTUALLY computes — the `+` branch — so on these two it
  // is the bigger root (3.5 and 3), and the drawn square is `Ã × s` = 7 and 6, which is what
  // makes the rectangle come to C: 7 × 3 = 21 and 6 × 4 = 24.
  { k: 'sub',   s: 3.5, A: 2,  B: 10, C: 21 },   // sqrt(a) is the clean route here
  { k: 'sub',   s: 3,   A: 2,  B: 10, C: 24 }    // ...and b/a, c/a are both whole here
];
// the three coefficients, straight off the shape
function e8abc(F) {
  if (F.k === 'L')     return { a: 1, b: 2 * F.b, c: -F.C };
  if (F.k === 'stack') return { a: 1, b: F.B, c: -F.C };
  if (F.k === 'strip') return { a: 1, b: -F.B, c: F.C };
  return { a: F.A * F.A, b: -F.A * F.B, c: F.C };
}
function e8mar(F) {
  // ⚠️ `&minus;`, not fmtNum's ASCII hyphen: `b = -20` printed a stubby dash next to the proper
  // ones in the equation two lines below it.
  const eq = (l, v) => bold(nw(l + ' = ' + (v < 0 ? '&minus;' : '') + fmtNum(Math.abs(v))));
  if (F.k === 'L') return eq(fracHTML('B', '2'), F.b) + ', ' + eq('C', F.C);
  // ⚠️ On a widened field Marimon's record is the school form. `Ã` is NOT given — it is
  // worked out from `a`, which is the first thing the S route asks for, so printing it here
  // would answer that question in the caption.
  if (F.k === 'sub') { const q = e8abc(F);
    return eq('a', q.a) + ', ' + eq('b', q.b) + ', ' + eq('c', q.c); }
  return eq('B', F.B) + ', ' + eq('C', F.C);
}
// ⚠️ `o.bare` strips every label off. On the overview the caption above each cell already
// carries Marimon's record, and the labels do not survive being shrunk: a `C = 12` centred in a
// rectangle 26px wide is clipped, and the brackets crowd into their neighbours.
function e8Draw(F, px, o) {
  o = o || {};
  const L = o.labels || {};
  if (o.bare) {
    if (F.k === 'L') return lFieldEl({ px: px, sv: F.s, bv: F.b, pieces: true });
    if (F.k === 'stack') return stackFieldEl(null, { px: px, sv: F.s, bv: F.B / 2, plain: true });
    return stripFieldEl({ px: px, sv: F.k === 'sub' ? F.A * F.s : F.s, bv: F.B,
      inner: F.k === 'sub' ? F.s : undefined, plain: true });
  }
  if (F.k === 'L')
    return lFieldEl({ px: px, sv: F.s, bv: F.b, pieces: true, brackets: o.brackets,
      labels: { b: L.b || bold(nw(fracHTML('B', '2') + ' = ' + fmtNum(F.b))), s: L.s } });
  if (F.k === 'stack')
    return stackFieldEl(null, { px: px, sv: F.s, bv: F.B / 2,
      area: o.brackets ? bold(nw('C = ' + fmtNum(F.C))) : null,
      labels: { rect: L.b || bold(nw('B = ' + fmtNum(F.B))), s: L.s } });
  // both remaining shapes are one strip; the widened one carries the little square inside it
  const sv = F.k === 'sub' ? F.A * F.s : F.s;
  // ⚠️ THE STRIP'S LENGTH IS NOT GIVEN ON A WIDENED FIELD (Sylvain, 2026-09-01) — it is

  // to the question the S route now opens with.
  const bLab = F.k === 'sub'
    ? bold(nw('B = ' + fracHTML(fmtNum(F.A * F.B), ATIL)))
    : L.b;
  return stripFieldEl({ px: px, sv: sv, bv: F.B,
    inner: F.k === 'sub' ? F.s : undefined,
    // ⚠️ On a widened field `s` is the LITTLE square's side, and its own bracket is where the
    // answer belongs — the bottom one measures `S`. A length on the ground wears its number.
    sTop: F.k === 'sub' ? (o.sTop || bold('s')) : undefined,
    cLabel: bold(nw('C = ' + fmtNum(F.C))),
    labels: { s: L.s || bold(F.k === 'sub' ? nw(ATIL + ' &times; s') : 's'), b: bLab } });
}
// all eight on one page, each under its own Marimon record
// ⚠️ TWO PER ROW, not four. The widest of the eight is a strip 14 magic lengths long, and its
// helper adds 80px of gutter — so at four across the cells overlap and the captions land on the
// field above. Two across at px 13 leaves every one of them room.
// ⚠️ Each cell is a fixed box with the field pushed to the BOTTOM, so the eight stand on common
// lines however different their shapes are, and the captions stay level with each other.
function e8AllEl(px, showS) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; flex-wrap:wrap; justify-content:center;' +
    'align-items:flex-end; gap:4px 20px; margin-top:12px;';
  E8.forEach((F, i) => {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex; flex-direction:column; align-items:center;' +
      // ⚠️ 235, and `flex-shrink:0` on the two real children. The tallest of the eight is a
      // square 2 across with a rectangle 10 deep on top — 192px of stage at this scale — and at
      // 205 the cell overflowed, so flex compressed the caption up into the field.
      'width:355px; height:' + (showS ? 258 : 235) + 'px;';
    const cap = document.createElement('p');
    cap.style.cssText = 'margin:2px 0 0; font-size:14px; color:#5a5240; text-align:center;';
    cap.innerHTML = bold(nw('#' + (i + 1))) + ' &nbsp; ' + e8mar(F);
    // ⚠️ spacer, field, THEN caption — the record sits directly under its own field, and with
    // the cells a fixed height the eight stand on a common line and the captions come out level.
    // Caption-first left a hole above the small shapes as big as the shapes themselves.
    const gap = document.createElement('div');
    gap.style.cssText = 'flex:1';
    const shape = e8Draw(F, px || 13, { bare: true });
    shape.style.flexShrink = '0'; cap.style.flexShrink = '0';
    c.appendChild(gap); c.appendChild(shape); c.appendChild(cap);
    // ⚠️ THE CHILD'S OWN ANSWER, under its field (Sylvain, 2026-09-01) — the closing screen
    // is a reminder of eight results, and eight shapes with no numbers on them are not that.
    if (showS) {
      const ans = document.createElement('p');
      ans.style.cssText = 'margin:2px 0 0; font-size:16px; color:#a3364a; text-align:center;';
      ans.style.flexShrink = '0';
      ans.innerHTML = bold(nw('s = ' + fmtNum(F.s)));
      c.appendChild(ans);
    }
    row.appendChild(c);
  });
  return row;
}

// One step per field. `a = 1` runs the prettier line straight; `a != 1` offers the child the
// three routes and runs whichever they pick — all three work on both, which is what makes the
// choice a real one rather than a fork with a right answer.
function e8Step(F, idx) {
  return function () {
    clearGame(); showEliel();
    const m = '&minus;', fn = n => (n < 0 ? m : '') + fmtNum(Math.abs(n));
    const sg = n => (n < 0 ? ' &minus; ' : ' + ') + fmtNum(Math.abs(n));
    const { a, b, c } = e8abc(F);
    const k = { at: false, b: false, c: false, sq: false, rt: false, x: false, s: false };
    // ⚠️ A negative wears its brackets: `(−5) × (−5)`, never `−5 × −5`, and `−B̃/2` with
    // `B̃/2 = −5` is written **5** rather than `−−5`.
    const par = v => (v < 0 ? '(' + fn(v) + ')' : fn(v));
    const sTil = bold(BTIL), cTil = bold(CTIL);
    let route = null, RB = 0, RC = 0, cap = '';       // the route's own B~ and C~
    const line = () => bold(nw('s&sup2; + ' + BTIL + ' &times; s + ' + CTIL + ' = 0'));
    const shown = () => bold(nw((k.b ? fn(RB) : BTIL) + ', ' + (k.c ? fn(RC) : CTIL)));
    const half = () => RB / 2;
    const inner = () => half() * half() - RC;
    // ⚠️ THE EQUATION AND THE LINE BOTH FILL IN AS THE CHILD ANSWERS (Sylvain, 2026-09-01) —
    // the chapter's own "?"-then-reveal, on a formula rather than a caption, and the same shape
    // `gNeg` and `hSchool` already use. A symbol stands until its number is earned; from then on
    // the number stands in its place, in the equation and in the line together.
    const XS = () => (route === 'S' ? 'S' : 's');
    const eqHTML = () => {
      if (route === 'school')
        return bold(nw(fn(a) + ' &times; s&sup2;' + sg(b) + ' &times; s' + sg(c) + ' = 0'));
      const X = XS();
      let e = X + '&sup2;' +
        (k.b ? sg(RB) : ' + ' + BTIL) + ' &times; ' + X +
        (k.c ? sg(RC) : ' + ' + CTIL) + ' = 0';
      if (route === 'S') e += ',&nbsp; S = ' + (k.at ? fn(F.A) : ATIL) + ' &times; s';
      return bold(nw(e));
    };
    const frmHTML = () => {
      if (route === 'school') {
        const d = b * b - 4 * a * c;
        const tail = k.rt ? fn(Math.sqrt(d)) : k.sq ? sqrtHTML(fn(d))
          : sqrtHTML(nw('(' + fn(b) + ') &times; (' + fn(b) + ') ' + m + ' 4 &times; ' +
            fn(a) + ' &times; (' + fn(c) + ')'));
        return bold(nw('s = ' + fracHTML(nw(m + '(' + fn(b) + ') &plusmn; ' + tail),
          nw('2 &times; ' + fn(a)))));
      }
      const X = XS();
      if (k.x) return bold(nw(X + ' = ' + fn(-half() + Math.sqrt(inner()))));
      const h2 = k.b ? par(half()) : fracHTML(BTIL, '2');
      const head = k.b ? fn(-half()) : m + fracHTML(BTIL, '2');
      const cc = k.c ? par(RC) : CTIL;
      const tail = k.rt ? fn(Math.sqrt(inner())) : k.sq ? sqrtHTML(fn(inner()))
        : sqrtHTML(nw(h2 + ' &times; ' + h2 + ' ' + m + ' ' + cc));
      return bold(nw(X + ' = ' + head + ' &plusmn; ' + tail));
    };
    // ⚠️ ON A WIDENED FIELD THE BRACKET NAMES THE SQUARE'S SIDE AND SAYS WHAT IT IS MADE OF
    // (Sylvain, 2026-09-01): `S = Ã × s`, and once `Ã` is settled `= 2 × s` as well — so the
    // substitution the whole route rests on is written on the ground it is about, not only in
    // the line above. `k.x` and not `k.s`: this bracket measures S, which is known one beat
    // before `s` is.
    const sLab = () => {
      if (F.k !== 'sub') return bold(nw('s = ' + (k.s ? fn(F.s) : '?')));
      return bold(nw('S = ' + ATIL + ' &times; s' +
        (k.at ? ' = ' + fn(F.A) + ' &times; s' : '') +
        ' = ' + (k.x ? fn(F.A * F.s) : '?')));
    };
    const pic = () => {
      const w = document.createElement('div');
      const p = (h, css) => { const e = document.createElement('p');
        e.style.cssText = 'text-align:center;' + css; e.innerHTML = h; w.appendChild(e); };
      p(bold(nw('#' + (idx + 1))) + ' &nbsp; ' + e8mar(F), 'font-size:14px; margin:2px 0 0;' +
        'color:#5a5240');
      if (route) p(eqHTML(), 'font-size:17px; margin:10px 0 0; color:#a3364a');
      // ⚠️ The line appears when it starts being USED — the moment both coefficients are in
      // hand — not from the top, where it would be a tool with nothing to put in it. On the
      // school route it IS the tool, so it stands from the start.
      if (route === 'school' || (k.b && k.c))
        p(frmHTML(), 'font-size:17px; margin:8px 0 0; color:#a3364a');
      // ⚠️ THE FIELD SWITCHES on the divide-through route once the new one has been built:
      // `a = 1`, strip `−B̃` long, rectangle `C̃`, and the SAME `s`. That is the whole claim of
      // that route, and it is worth drawing rather than asserting.
      if (newF) {
        w.appendChild(stripFieldEl({ px: 30, sv: F.s, bv: -RB,
          cLabel: bold(nw(CTIL + ' = ' + fn(RC))),
          labels: { s: bold(nw('s = ' + (k.s ? fn(F.s) : '?'))),
            // ⚠️ `B = 5`, matching the six plain fields' own bracket. `−B̃ = 5` is precise
            // and it is what the line above uses, but the strip's length is a length and
            // every other field in the set calls it `B`.
            b: bold(nw('B = ' + fn(-RB))) } }));
        return w;
      }
      w.appendChild(e8Draw(F, 30, { brackets: true,
        sTop: F.k === 'sub'
          ? bold(nw('s = ' + (k.s ? fn(F.s) : '?')))
          : undefined,
        labels: { s: sLab() } }));
      // ⚠️ Chapter 1's own table, under the field, for the two divisions the route asks for —
      // the column for `a` lit, so "the number that times four gives twenty" is something to
      // scan for rather than something to know.
      if (tableCol) w.appendChild(showFullMultTable(1, 10, { a: tableCol, b: null }, true));
      return w;
    };
    // ⚠️ Raw labels on the second one: `s = 5 + 2` is notation and identical in both
    // languages, so it cannot live in the dictionary — `verify.js` rejects an EN/FR pair with
    // identical prose, and rightly. Built in code, as every other symbol in this chapter is.
    // ⚠️ The `+` branch goes SECOND, so the row cannot be got by taking the first thing.
    const pickWide = X => ({ q: 'c4_e8_pw_q', v: { x: bold(X) },
      labels: ['c4_e8_pw2', 'c4_e8_pw1'], correct: 1, wrong: 'c4_e8_pw_no' });
    const pickSign = (X, hd, r, dv) => ({ q: 'c4_e8_ps_q', v: { x: bold(X) }, raw: true,
      labels: [X + ' = ' + (dv ? '(' + fmtNum(hd) + ' \u2212 ' + fmtNum(r) + ') \u00f7 ' +
          fmtNum(dv) : fmtNum(hd) + ' \u2212 ' + fmtNum(r)),
        X + ' = ' + (dv ? '(' + fmtNum(hd) + ' + ' + fmtNum(r) + ') \u00f7 ' + fmtNum(dv)
          : fmtNum(hd) + ' + ' + fmtNum(r))],
      correct: 1, wrong: 'c4_e8_ps_no' });
    let BEATS = [], j = 0, tableCol = null, newF = false;
    const beat = () => {
      // ⚠️ The table is read off the beat ABOUT to run, before the picture is drawn. Setting
      // it afterwards put it one beat behind — the question that needs it came up without it,
      // and the next one carried it for nothing.
      const peek = BEATS[j];
      tableCol = (peek && (Array.isArray(peek) ? (peek[3] && peek[3].table) : peek.table)) || null;
      clearGame(); showEliel(); stage(pic());
      if (j === BEATS.length) {
        // ⚠️ WHY THIS ROOT AND NOT THE OTHER. On the two L shapes and the two stacks the other
        // answer comes out NEGATIVE — a length that cannot be, Part E's own move. On the four
        // strip-shaped fields BOTH are honest, exactly as in Part F, and the only thing that
        // tells them apart is the picture: the square Marimon drew is the WIDER one, which is
        // Part G's question word for word. Saying nothing left the choice unexplained.
        const o = OTHER;
        tell(t(o > 0 ? 'c4_e8_done2' : 'c4_e8_done', {
          seq: bold(nw('s = ' + fn(F.s))), other: bold(fn(o)),
          sq: bold(fn(F.k === 'sub' ? F.A * F.s : F.s)),
          rest: bold(fn(F.B - (F.k === 'sub' ? F.A * F.s : F.s))) }));
        addButton(t('btn_continue'), nextStep);
        return;
      }
      const nx = BEATS[j++];
      const [q, h, n, v] = Array.isArray(nx) ? nx : [nx.q, null, null, nx.v];
      const vv = Object.assign({ bt: sTil, ct: cTil, s: bold('s'), n: bold(fmtNum(idx + 1)),
        at: bold(ATIL),
        a: bold(fn(a)), b: bold(fn(b)), c: bold(fn(c)), one: bold(nw('a = 1')) }, v);
      // ⚠️ A CHOICE, not a typed answer — and not waved through: both are settleable by
      // looking at the field, so a wrong one is answered the way `askInline` answers a wrong
      // number and the buttons stay up. Part G's own rule for exactly this question.
      if (!Array.isArray(nx)) {
        if (nx.say) {
          // ⚠️ EVERY BUTTON ADVANCES — `aWeirdIndeed`'s rule. "Do you want me to show you?" is
          // an invitation, and a question that accepts only one answer teaches that Eliel was
          // not really asking.
          clearGame(); showEliel();
          storyHTML(lead(t(nx.say, vv)).replace('<p>', '<p>').concat(''));
          stage(pic());
          (nx.labels || ['btn_continue']).forEach(l => addButton(t(l), () => {
            if (nx.__set) k[nx.__set] = true;
            if (nx.build) newF = true;
            beat();
          }));
          return;
        }
        choose(lead(t(nx.q, vv)), pic, nx.labels, nx.correct, nx.wrong, beat, vv, nx.raw);
        return;
      }
      askAfterButton(t(q, vv), n, () => {
        if (v && v.__set) k[v.__set] = true;
        // on a route with no divide-back the S/s beat IS the answer for the field's own label
        if (v && v.__set === 'x' && route !== 'S') k.s = true;
        beat(); },
        t(h, vv), { decimal: !Number.isInteger(n) });
    };
    // ⚠️ THE OTHER ROOT IS SET BY THE ROUTE. It used to be recomputed from `RB`/`RC` and
    // divided by `Ã` whenever the field was a widened one — but on the divide-through route
    // `RB`/`RC` are ALREADY the per-`s` coefficients, so dividing again gave 1 where the
    // answer is 2, and on the school route `RB`/`RC` are `b` and `c` and it was nonsense.
    // Sylvain caught it by reading the screen; no check here could have.
    let OTHER = 0;
    // ⚠️ `skipBC` — the divide-through route supplies its own `B̃` and `C̃` beats (they are
    // DIVISIONS there, not readings), so `runLine` must not ask for them a second time. It did,
    // and the route quietly asked `B̃` twice with the new field already on screen.
    const runLine = (extra, pre, bKey, skipBC) => {
      const r = Math.sqrt(inner());
      const sq = bold(nw('(' + fracHTML(BTIL, '2') + ')&sup2; ' + m + ' ' + CTIL));
      BEATS = (pre || []).concat(skipBC ? [] : [
        [bKey || 'c4_e8_qb', bKey ? 'c4_e8_hbs' : 'c4_e8_hb', RB, { __set: 'b', d: bold(cap),
          ateq: bold(nw(ATIL + ' = ' + fn(F.A))), bq: bold(nw(BTIL + ' = ?')),
          bd: bold(nw(BTIL + ' &times; ' + ATIL + ' = ' + fn(b))) }],
        ['c4_e8_qc', 'c4_e8_hc', RC, { __set: 'c', d: bold(cap) }]
      ]).concat([
        ['c4_e8_qsq', 'c4_e8_hsq', inner(), { __set: 'sq', sq: sq,
          e: bold(nw('(' + fn(half()) + ')&sup2; ' + m + ' (' + fn(RC) + ')')) }],
        ['c4_e8_qrt', 'c4_e8_hrt', r, { __set: 'rt', rt: bold(sqrtHTML(fn(inner()))) }],
        ['c4_e8_qs', 'c4_e8_hs', extra ? -half() + r : F.s,
          { __set: 'x', e: bold(nw(fn(-half()) + ' + ' + fn(r))),
            cap: bold(extra ? 'S' : 's') }]
      ]);
      // ⚠️ WHERE BOTH ROOTS ARE HONEST FIELDS, the picture picks — Part G's own question,
      // asked here rather than assumed. The square we drew is the WIDE one, so its side is
      // the rectangle's LONG side, and that is the `+` branch. Where the other root is
      // negative there is nothing to choose by looking and the two beats are skipped.
      if (-half() - r > 0) BEATS.splice(BEATS.length - 1, 0,
        pickWide(XS()), pickSign(XS(), -half(), r));
      // ⚠️ The step back down is a MULTIPLICATION with a hole in it, like every other
      // division in this trilogy: `S = Ã × s`, so `s` is the number with `2 × s = 7`.
      // The prose says "half of", which holds because BOTH widened fields have `Ã = 2` —
      // `a` must be a perfect square for the field to exist at all, and
      // `ch4_eight_fields.py` asserts `a = 4` on both.
      if (extra) BEATS.push(['c4_e8_qdiv', 'c4_e8_hdiv', F.s,
        { __set: 's',
          seq: bold(nw('S = ' + ATIL + ' &times; s = ' + fn(F.A) + ' &times; s')),
          eq2: bold(nw(fn(F.A) + ' &times; s = ' + fn(-half() + r))),
          sv: bold(fn(-half() + r)) }]);
      OTHER = (-half() - r) / (extra ? F.A : 1);
      j = 0; beat();
    };
    if (a === 1) {
      route = 'plain'; RB = b; RC = c; cap = line();
      runLine(false);
      return;
    }
    // ⚠️ THREE ROUTES, and the child picks. All three land on the same two answers.
    // ⚠️ NOT `choose()`: there is no wrong button here. All three routes land on the same two
    // answers — that is the whole point of the screen — so it is an invitation, like the
    // chapter's other both-buttons-advance questions, and every one of them advances.
    storyHTML('<div class="speaker">Eliel</div><p>' + t('c4_e8_pick', {
      one: bold(nw('a = 1')),
      // ⚠️ Signed terms, so it reads `4 × s² − 20 × s + 21 = 0` and not `… + −20 × s …`.
      eq: bold(nw(fn(a) + ' &times; s&sup2;' + sg(b) + ' &times; s' + sg(c) + ' = 0')) }) +
      '</p>');
    stage(e8Draw(F, 30, { brackets: true }));
    [['c4_e8_r1', () => { route = 'S'; RB = b / F.A; RC = c;
        cap = bold(nw('S&sup2; + ' + BTIL + ' &times; S + ' + CTIL + ' = 0,&nbsp; S = ' +
          ATIL + ' &times; s'));
        // ⚠️ `Ã` FIRST (Sylvain, 2026-09-01). It is not on the field and not in Marimon's
        // record — it is the number that widened the square, so `Ã × Ã = a`, and the whole
        // S route hangs off settling it. `B̃` is then a DIVISION, `b/Ã`, rather than
        // something read off a bracket.
        runLine(true, [['c4_e8_qat', 'c4_e8_hat', F.A,
          { __set: 'at',
            aeq: bold(nw(ATIL + ' &times; ' + ATIL + ' = a')),
            req: bold(nw(ATIL + ' = ' + sqrtHTML('a') + ' = ' + sqrtHTML(fn(a)))) }]],
          'c4_e8_qbs'); }],
     // ⚠️ THE DIVIDE-THROUGH ROUTE DOES THE TWO DIVISIONS (Sylvain, 2026-09-01) rather than
     // announcing their answers: `b ÷ a` and `c ÷ a`, each posed as *which number times `a`
     // gives this?* with Chapter 1's table under the field. Then it says what those two
     // divisions actually WERE — a different field with the same `s` and `a = 1` — and draws it.
     ['c4_e8_r2', () => { route = 'div'; RB = b / a; RC = c / a; cap = line();
        const whole = Number.isInteger(RC);
        const pre = [
          ['c4_e8_qbd', 'c4_e8_hbd', RB, { __set: 'b', table: a,
            eq: bold(nw('? &times; ' + fn(a) + ' = ' + fn(b))) }]
        ];
        // ⚠️ Where the share does not come out whole (field #7's `c ÷ a` is 5.25) the answer is
        // GIVEN. The table cannot help with it and there is nothing to find by scanning.
        pre.push(whole
          ? ['c4_e8_qcd', 'c4_e8_hcd', RC, { __set: 'c', table: a,
              eq: bold(nw('? &times; ' + fn(a) + ' = ' + fn(c))) }]
          : { say: 'c4_e8_cd_told', __set: 'c',
              v: { eq: bold(nw(fn(c) + ' &divide; ' + fn(a) + ' = ' + fn(RC))) } });
        pre.push({ say: 'c4_e8_new_q', build: true,
          labels: ['c4_e8_new_a1', 'c4_e8_new_a2'] });
        runLine(false, pre, null, true); }],
     ['c4_e8_r3', () => { route = 'school'; runSchool(); }]]
      .forEach(([lbl, go]) => addButton(t(lbl), go));
    function runSchool() {
      const disc = b * b - 4 * a * c, r = Math.sqrt(disc);
      cap = bold(nw('s = ' + fracHTML(nw(m + 'b &plusmn; ' + sqrtHTML(nw('b &times; b ' + m +
        ' 4 &times; a &times; c'))), nw('2 &times; a'))));
      k.b = k.c = true; RB = b; RC = c;
      OTHER = (-b - r) / (2 * a);
      BEATS = [
        ['c4_e8_qd', 'c4_e8_hd', disc, { __set: 'sq', d: bold(nw('b &times; b ' + m +
          ' 4 &times; a &times; c')) }],
        ['c4_e8_qrt', 'c4_e8_hrt', r, { __set: 'rt', rt: bold(sqrtHTML(fn(disc))) }],
        ['c4_e8_qs', 'c4_e8_hs', F.s, { __set: 'x', cap: bold('s'),
          e: bold(nw('(' + fn(-b) + ' + ' + fn(r) + ') &divide; ' + fn(2 * a))) }]
      ];
      if ((-b - r) / (2 * a) > 0) BEATS.splice(BEATS.length - 1, 0,
        pickWide('s'), pickSign('s', -b, r, 2 * a));
      j = 0; beat();
    }
  };
}

  function aFindS() {

    const seq = bold('s = ' + fmtNum(FIELD.s));
    // ⚠️ THE COVERING STAYS ON THE GROUND (Sylvain). These are the very squares the child
    // laid a screen ago, and both questions here are answered by COUNTING them — three
    // across the square part, then nine in it. Redrawing the field bare made the child
    // multiply from a bracket instead of counting what they had done.
    // ⚠️ THE BRACKET CARRIES `s = ?` UNTIL THE ANSWER LANDS. It used to print `s = 3` on every
    // screen this draws — fine when the reveal was the only one, and a giveaway the moment the
    // root question was asked over the same picture. Lesson 17, on a bracket.
    const cov = (f, done) => lFieldEl({ pieces: true, cells: true, prefilled: true,
      brackets: true, focus: f,
      labels: { s: bold(nw('s = ' + (done ? fmtNum(FIELD.s) : '?'))) } });
    // ⚠️ THE AREA FIRST, THEN THE ROOT (Sylvain, 2026-09-01). The square part is covered by
    // nine of the very squares the child laid a screen ago, and its side is what we are after
    // — so this is a square root, on a number small enough to see, and naming it here is what
    // Part C's `√64` then leans on.
    const A = FIELD.s * FIELD.s;
    askAfterButton(t('c4_a_fs_q'), A, () => {

              stage(cov('sq', true));
              addButton(t('btn_continue'), nextStep);

    stage(lFieldEl({ pieces: true, cells: true, prefilled: true, brackets: true, focus: 'sq' }));

  // THE NOTCH COSTS NO WIRE — and this is the screen Part C will stand on. Filling the
  // corner in adds a great deal of ground and not one magic length of fence, because the
  // notch's two inner sides are exactly the two outer sides they replaced. Said here,
  // about a field the child has just fenced, long before it is used to solve anything.
  function aNotch() {
    clearGame(); showEliel();
    const per = 4 * FIELD.s + 4 * FIELD.B;
    const v = { big: bold(fmtNum(FIELD.big)) };
    const pic = (corner, onCorner) => lFieldEl({ brackets: true, wire: true, corner: corner,
      onCorner: onCorner, labels: { s: bold('s = ' + fmtNum(FIELD.s)) } });
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_a_no1') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_a_no2', v) + '</p>');
    // ⚠️ THE CHILD CLICKS THE BITE (Sylvain, 2026-09-02), rather than pressing a button that
    // says "fill in the corner". Naming the ground that would finish the square is the move;
    // a button asks nothing. Chapter 2's carve and Chapter 3's refusal are the same shape.
    let filled = false;
    // ⚠️ THREE BEATS AFTER THE CLICK (Sylvain, 2026-09-02), and the point of them is that the
    // corner does NOT do the same thing to the fence as it does to the ground. The fence is put
    // first as a question with a wrong answer available, because *more ground, no more wire* is
    // exactly the thing a child expects to be false.
    const go = () => {
      if (filled) return;
      filled = true;
      const eq = bold('4 &times; ' + fmtNum(FIELD.big) + ' = ' + fmtNum(per));
      const sqPlain = fmtNum(FIELD.B) + '\u00b2 = ' + fmtNum(FIELD.B) + ' \u00d7 ' +
        fmtNum(FIELD.B);
      const seed = () => {
        clearGame(); showEliel(); stage(pic('solid'));
        askAfterButton(t('c4_a_no_q'), FIELD.B * FIELD.B, () => {
            clearGame(); showEliel();
            // ⚠️ The tease is a SECOND paragraph and a key of its own, so it can be struck
            // on its own — but Part C goes looking for exactly this B × B, so the chapter
            // cannot afford to lose the pointer to it.
            storyHTML(lead('<p>' + t('c4_a_no_ok', { n: bold(areaLabel(FIELD.B * FIELD.B)) }) +
              '</p><p style="margin-top:10px">' + t('c4_a_no_ok2') + '</p>'));
            stage(pic('solid'));
            addButton(t('btn_continue'), nextStep);
          },
          // ⚠️ THREE HINTS THAT ESCALATE (`askInline` now takes an array): it is a square, then
          // its side, then the multiplication. One hint that gave the last of those away on the
          // second try would end the question rather than help with it.
          // ⚠️ Hints render with `textContent`, so they take PLAIN text — no bold, and the
          // squared sign and the times sign as characters rather than entities, which would
          // otherwise print literally. Same rule as Chapter 2's colour helpers.
          [t('c4_a_no_h1'), t('c4_a_no_h2', { b: lenLabel(FIELD.B) }),
           t('c4_a_no_h3', { sq: sqPlain })]);
      };
      const trees = () => choose(lead(t('c4_a_no4', { eq: eq })), () => pic('solid'),
        ['c4_a_no_t1', 'c4_a_no_t2', 'c4_a_no_t3'], 1, 'c4_a_no_tno', seed);
      choose(lead(t('c4_a_no3')), () => pic('solid'),
        ['c4_a_no_f1', 'c4_a_no_f2'], 1, 'c4_a_no_fno', trees, { eq: eq });
    };
    stage(pic('ghost', go));
  },

  function bSeeds() {
    const seeds = Math.floor(FIELD.C), plots = plotCount(), whole = wholeCount();
    const pic = mode => lFieldEl({ brackets: true, border: mode, cells: true,
      prefilled: true, labels: { s: bold('s = ' + fmtNum(FIELD.s)) } });
    const v = { whole: bold(fmtNum(whole)), plots: bold(fmtNum(plots)) };
    clearGame(); showEliel();
    // The plots are CARVED before the question is asked, not after it. The sown ground is
    // what the question is about, so the child counts what they can see — Chapter 2's own
    // boundary on the "?"-then-reveal rule (that rule is about a NUMBER, never the ground).
    tell('<p>' + t('c4_b_sd1') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_b_sd1b') + '</p>');
    stage(pic('colour'));
    // ⚠️ BOTH BUTTONS DRAW (`aWeirdIndeed`'s rule). Eliel is offering to mark the patches out,
    // which is an offer of help rather than a fork — and the plots have to be on the ground
    // before the question, since the child counts what they can see.
    const carve = () => {
      clearGame(); showEliel();
      askWithLead(t('c4_b_sd2'), t('c4_b_sd_q'), seeds, () => {
        clearGame(); showEliel();
        // AND THEN THE FLOWERS (Sylvain). The quarter no tree can have is a quarter of a
        // magic square — twenty-five flower squares — so it is not waste at all, and the
        // field closes on both shopping lists the way every field in this trilogy does.

  // that three squares were hiding in the picture and then produced them; this one goes
  // looking. Eliel wants a square whose area he knows, tries each one in turn, and only the
  // big one survives, so completing the square arrives as the thing left standing rather

      padB: 92, area: v.area }, o));
    // A FLAT LIST OF BEATS, never nested callbacks: six deep is where the last paren goes
    // missing, and it has twice.
    const BEATS = [
      { say: 'c4_c_n1', btns: ['c4_c_n1_a1', 'c4_c_n1_a2'], pic: {} },
      { say: 'c4_c_n2', btns: ['c4_c_yes', 'c4_c_no'], pic: { pieces: true, focus: 'sq' } },

    let j = 0;
    const beat = () => {
      if (j >= BEATS.length) { nextStep(); return; }

  // -------------------------------------------------------------------------

  // ⚠️ THE FIELDS GET BIGGER AND THE PICTURE MUST NOT. The area-68 field is 9.64

  // with the outer bracket's gutter it bursts the 760px container. Part D draws
  // every field at DPX so the three can also be stood side by side and compared.

  // ⚠️ THE LETTER IS `b`, NOT `B`, THROUGHOUT PART D (Sylvain, 2026-08-28). `B` is reserved
  // for a RECTANGLE's own side — Part E's whole rectangle, Part F's whole strip, and the
  // coefficient Part G writes — while `b` is half of it, which is exactly the side the L's
  // two rectangles have and exactly what this line takes off at the end. So `B / 2 = b`
  // holds across the chapter, and Part F's `h` is the same quantity under a third name.
  // ⚠️ Only DISPLAY strings change here. `B` is also a local JS name for `FIELD.B` in these
  // steps (16 `fmtNum(B)` and 9 `* B`), and those must stay exactly as they are.

      clearGame(); showEliel(); storyHTML(html); stage(pic()); addButton(btn, next);

    // Built one move at a time, in the order Part C said them — so the line is

    show(lead(t('c4_d_w1', v)) + '<p style="margin-top:10px">' + t('c4_d_w2', v) + '</p>',

        show(lead(t('c4_d_w6')) +

          '<p style="margin-top:14px">' + t('c4_d_w7') + '</p>',
