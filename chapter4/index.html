  // -------------------------------------------------------------------------
  // THE 90.25 FIELD — where the child RUNS Chapter 3's method rather than
  // being handed its answer (Sylvain, 2026-08-27). It used to meet this root
  // with "let us try straight down the middle", which is a lucky guess and not
  // a method, on the one screen whose job is to show the line works when the
  // root is off Chapter 1's table.
  //
  // The eight steps below are that quest's own round one, move for move:
  // the biggest square that fits, the leftover, the L carried across into
  // three, the corner forgotten, the strips widened to `dt`, joined, cut into
  // magic lengths, piled a magic length wide — and then stood against the same
  // ground as a column of magic squares, which is the division drawn.
  //
  // ⚠️ AND THE ROUNDING IS TESTED RATHER THAN APPLIED. Chapter 3's rule is that
  // a share rounds UP, because that quest could never check its own answer —
  // 9.25 / 18 is 0.5138…, so to the letter it gives 0.52, s ~ 1.52, against the
  // 1.5 the child measured exactly in Part B. This quest CAN check: Chapter 2
  // squares a decimal. So the five tenths that actually fitted are tried first,
  // 9.5 squares to 90.25 on the nose, and the `about` never has to be written.
  // That is not skipping Chapter 3's rule — it is finding out whether it is
  // needed, which is that quest's own move on the shares that came out even.
  // The area-68 field two steps later is where the rule does bite.
  // -------------------------------------------------------------------------
  function dTryC() {
    const B = FIELD.B, big = FIELD.C + B * B;
    const pic = ab => lFieldEl({ px: DPX, brackets: true, corner: 'solid', bigOutline: true,
      outer: bold(nw('s + ' + fmtNum(B))), areaBig: ab });
    clearGame(); showEliel();
    // ⚠️ The line comes back with the question. `dTryA` prints it with the first
    // field's own numbers in it, which IS the question there; here the question is
    // what goes under the root, so the reminder has to stay in LETTERS — the
    // instantiated form would print the answer above the box asking for it.
    const line = bold(nw('s = ' + sqrtHTML(nw('a + b &times; b')) + ' &minus; b'));
    const lineP = '</p><p style="margin-top:14px; text-align:center; font-size:20px">' + line;
    askWithLead(t('c4_d_c1', { a: bold('a'), bb: bold('b'), av: bold(fmtNum(FIELD.C)),
      bv: bold(fmtNum(B)) }) + lineP, t('c4_d_c_q'), big, () => {
        clearGame(); showEliel();
        storyHTML('<div class="speaker">Eliel</div>' +
          // The two comparisons are NOTATION and are built here rather than written
          // into the dictionary, so 9² = 9 × 9 = 81 cannot drift from the numbers.
          '<p>' + t('c4_d_c2', { n: bold(fmtNum(big)),
            lo: bold(nw('9&sup2; = 9 &times; 9 = 81')),
            hi: bold(nw('10&sup2; = 10 &times; 10 = 100')) }) + '</p>' +
          '<p style="margin-top:10px">' + t('c4_d_c3') + '</p>');
        stage(pic(bold(areaLabel(big))));
        addButton(t('c4_d_c_btn0'), nextStep);
      }, t('c4_d_c_h'), { decimal: true });
    stage(pic(null));
  },

  // Chapter 3's step one: the biggest square that fits, and what is left.
  // And now the rounding is TESTED rather than applied — see the note above.
  function dHalf() {
    const B = FIELD.B, big = FIELD.C + B * B, root = FIELD.big;
    const N = dNums(big, 9);
    const lo9 = 9 + Math.floor(N.dt * 10) / 10, hi9 = lo9 + 0.1;
    const pic = ab => lFieldEl({ px: DPX, brackets: true, corner: 'solid', bigOutline: true,
      outer: bold(nw('s + ' + fmtNum(B))), areaBig: ab });
    clearGame(); showEliel();
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_d_c_r3', { lo9: bold(fmtNum(lo9)), hi9: bold(fmtNum(hi9)) }) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_d_c_r4', { half: bold(fmtNum(root)),
        rt: bold(nw(sqrtHTML(fmtNum(big)))) }) + '</p>');
    stage(rootBlockEl(big, 9));
    addButton(t('c4_d_c_btn'), () => {
      clearGame(); showEliel();
      const W9 = 9, H9 = root - W9;          // 9 and a half, as two numbers
      const sq = bold(nw('(' + fmtNum(W9) + ' + ' + fmtNum(H9) + ') &times; (' +
        fmtNum(W9) + ' + ' + fmtNum(H9) + ') = ' + fmtNum(W9 * W9) + ' + ' +
        fmtNum(W9 * H9) + ' + ' + fmtNum(W9 * H9) + ' + ' + fmtNum(H9 * H9) +
        ' = ' + fmtNum(big)));
      askWithLead(t('c4_d_c4', { eq: sq, half: bold(fmtNum(root)) }),
        t('c4_d_c_q2', { eq: bold(nw('s = ' + fmtNum(root) + ' &minus; ' + fmtNum(B))),
          s: bold('s') }), FIELD.s, () => {
            clearGame(); showEliel();
            // ⚠️ 1,51 IS NOT TYPED — it is Chapter 3's own second round, run here, so the
            // sentence cannot drift from the method it describes. Round 1 lays tenths and a
            // SHARE ROUNDS UP (9,6); round 2 shaves and a SHAVE ROUNDS DOWN (0,09), giving
            // 9,51 and s = 1,51. Both rules are Chapter 3's, and both are what keep the answer
            // above the truth. Asserted in ch4_numbers.py.
            const n1 = Math.floor(Math.sqrt(big));
            const sh = (big - n1 * n1) / (2 * n1);
            const s1 = n1 + Math.ceil(sh * 10) / 10;
            const e2 = (s1 * s1 - big) / (2 * s1);
            const s2 = Math.round((s1 - Math.floor(e2 * 100) / 100 - B) * 100) / 100;
            storyHTML('<div class="speaker">Eliel</div>' +
              '<p>' + t('c4_d_c_ok', { seq: bold('s = ' + fmtNum(FIELD.s)) }) + '</p>' +
              '<p style="margin-top:10px">' + t('c4_d_c_ok2', {
                s2: bold(nw('s &asymp; s\u0303\u2082 = ' + fmtNum(s2))),
                sv: bold(fmtNum(FIELD.s)) }) + '</p>');
            stage(lFieldEl({ px: DPX, brackets: true, corner: 'solid', bigOutline: true,
              outer: bold(nw(fmtNum(FIELD.s) + ' + ' + fmtNum(B) + ' = ' + fmtNum(root))),
              labels: { s: bold('s = ' + fmtNum(FIELD.s)) }, areaBig: bold(areaLabel(big)) }));
            addButton(t('btn_continue'), nextStep);
          }, t('c4_d_c_h2'), { decimal: true });
      stage(pic(bold(areaLabel(big))));
      gameArea.appendChild(regionSplitEl(W9, H9));
    });
  },

  // ⚠️ THE FIELD CHAPTER 3 WAS FOR. Never covered, never measured — and its root is
  // sqrt(93), which no table will ever hold. The child is stuck for exactly one screen,
  // and then finds they are not stuck at all.
  function dNew() {
    const B = FIELD.B, big = FIELD.C + B * B;
    const pic = ab => lFieldEl({ px: DPX, brackets: true, corner: 'solid', bigOutline: true,
      outer: bold(nw('s + ' + fmtNum(B))), areaBig: ab, labels: { s: bold('s') } });
    clearGame(); showEliel();
    // ⚠️ The line comes back with the question, as it does on the field before — and in
    // LETTERS for the same reason: the question is what goes under the root, so the
    // instantiated form would print the answer above the box asking for it.
    const line = bold(nw('s = ' + sqrtHTML(nw('a + b &times; b')) + ' &minus; b'));
    const lineP = '</p><p style="margin-top:14px; text-align:center; font-size:20px">' + line;
    askWithLead(t('c4_d_n1', { av: bold(areaLabel(FIELD.C)), bv: bold(lenLabel(B)) }) + lineP,
      t('c4_d_n_q'), big, () => {
        clearGame(); showEliel();
        storyHTML('<div class="speaker">Eliel</div>' +
          // The two comparisons are NOTATION and are built here, as `dTryC`'s are.
          '<p>' + t('c4_d_n2', { n: bold(fmtNum(big)),
            lo: bold(nw('9&sup2; = 9 &times; 9 = 81')),
            hi: bold(nw('10&sup2; = 10 &times; 10 = 100')) }) + '</p>');
        stage(pic(bold(areaLabel(big))));
        addButton(t('c4_d_n_btn'), nextStep);
      }, t('c4_d_n_h'));
    stage(pic(null));
  },

  // Chapter 3's own round one, in miniature: the biggest square that fits, the leftover,
  // and the share — laid in tenths and rounded UP, which is Part F's own rule.
  // ⚠️ THE SIX SOLVE STEPS HAVE ALREADY RUN on this field, so `dRoot` starts where the
  // two fields part company: six tenths fit along the share and the seventh ran past —
  // and unlike the 90.25 field there is nothing here that will ever check an answer, so
  // this is where Chapter 3's rule finally bites. Go one unit finer, and take ONE MORE
  // than fits, because a share rounds UP and the answer has to stay big enough.
  function dRoot() {
    const B = FIELD.B, big = FIELD.C + B * B;
    const n = Math.floor(Math.sqrt(big)), N = dNums(big, n);
    const fits = Math.floor(N.dt * 10);
    const share = Math.ceil(N.dt * 100) / 100;   // a SHARE rounds up (Ch3 Part F)
    const root = n + share, sv = root - B;
    clearGame(); showEliel();
    // ⚠️ THE HUNDREDTHS ARE LAID, NOT ASSERTED (Sylvain, 2026-08-27, playing it). The
    // screen used to say "lay hundredths and take one more than fits" and then ask for the
    // number — so a child who had just applied that very rule at TENTHS wrote 0.7, which
    // is not wrong by anything the screen had said, and was refused. The rule was right;
    // what was missing was the unit, and the unit has to be on the ground.
    const hFits = Math.floor((N.dt - fits / 10) * 100);
    const fine = { tenths: fits };
    const lensAt = (l, ov) => stage(dLensEl(big, n, l, ov, null, fine));
    tell(t('c4_d_r2', { dt: bold(DTIL), tenths: bold(fmtNum(fits)),
      next: bold(fmtNum(fits + 1)),
      eq: bold(nw(fmtNum(N.rem) + ' &divide; (2 &times; ' + fmtNum(n) + ')')),
      // ⚠️ STACKED, as Chapter 3 introduced division: a slash fraction would be a second
      // notation for the one thing this trilogy has already given a shape to.
      frac: bold(fracHTML(2, 3)) }));
    stage(dLensEl(big, n, fits, false, null));
    addButton(t('c4_d_r_btn'), () => {
      let laid = 0;
      const draw = () => {
        clearGame(); showEliel();
        if (laid <= hFits) {
          tell(t(laid ? 'c4_d_rh2b' : 'c4_d_rh2a'));
          stage(dLensEl(big, n, laid, false, () => { laid++; draw(); }, fine));
        } else {
          tell(t('c4_d_lay_over'));
          lensAt(hFits, true);
          addButton(t('c4_d_lay_btn'), () => {
            clearGame(); showEliel();
            askInline(t('c4_d_rh_q'), hFits, () => {
              clearGame(); showEliel();
              // ⚠️ `lo` is d-tilde, NOT the side: `n +` in here made the sentence read
              // "more than 9.66 and less than 0.67", which is two different quantities
              // either side of one comparison. Both ends come off the same laying.
              askWithLead(t('c4_d_rh_ok', { lo: bold(fmtNum(fits / 10 + hFits / 100)),
                hi: bold(fmtNum(share)), dt: bold(DTIL) }),      t('c4_d_r_q2', { dt: bold(DTIL) }), share, () => {
        clearGame(); showEliel();
        const eq = bold(nw(sqrtHTML(fmtNum(big)) + ' &asymp; ' + fmtNum(n) + ' + ' +
          fmtNum(share) + ' = ' + fmtNum(root)));
        askWithLead(t('c4_d_r3', { eq: eq }),
          t('c4_d_r_q3', { eq: bold(nw('s &asymp; ' + fmtNum(root) + ' &minus; ' +
            fmtNum(B))), s: bold('s') }), sv, () => {
              clearGame(); showEliel();
              // ⚠️ THE FENCE IS WORKED OUT IN FOUR BEATS (Sylvain, 2026-09-04), because
              // `4 x 4.67` is nowhere near Chapter 1's table. The road is the chapter's own:
              // split the two stretches, then DISTRIBUTIVITY on the awkward one
              // (4 x 4.67 = 4 x (4 + 0.67) = 4 x 4 + 4 x 0.67), and then the two-thirds Eliel
              // named two screens ago earns its keep as a shortcut — 4 x 0.67 ~= 4 x 2/3 = 8/3,
              // which rounds UP to 2.67. Every number is derived, none typed.
              const wI = Math.floor(sv), wF = Math.round((sv - wI) * 100) / 100;
              const wB = 4 * B, wW = 4 * wI;
              const wT = Math.ceil(4 * 2 / 3 * 100) / 100;          // 8/3, rounded UP
              const wTot = Math.round((wB + wW + wT) * 100) / 100;
              const F23 = fracHTML(2, 3), F83 = fracHTML(4 * 2, 3);
              const v = { s: bold('s'), bb: bold('b'),
                eq: bold(nw('4 &times; ' + fmtNum(B) + ' + 4 &times; ' + fmtNum(sv))),
                eq1: bold(nw('4 &times; ' + fmtNum(B))),
                eq2: bold(nw('4 &times; ' + fmtNum(sv))),
                split: bold(nw(fmtNum(sv) + ' = ' + fmtNum(wI) + ' + ' + fmtNum(wF))),
                eq2a: bold(nw('4 &times; ' + fmtNum(wI))),
                eq3: bold(nw('4 &times; ' + fmtNum(wF))),
                frac67: bold(fmtNum(wF)), frac: bold(F23),
                chain: bold(nw('4 &times; ' + fmtNum(wF) + ' &asymp; 4 &times; ' + F23 +
                  ' = ' + F83)),
                eq3b: bold(nw(F83)),
                eq4: bold(nw(fmtNum(wB) + ' + ' + fmtNum(wW) + ' + ' + fmtNum(wT))) };
              const pic = () => lFieldEl({ px: DPX, brackets: true, wire: true,
                labels: { s: bold(nw('s &asymp; ' + fmtNum(sv))) } });
              // A FLAT LIST OF BEATS, never nested callbacks.
              const W = [
                { lead: 'c4_d_wr1', q: 'c4_d_wr_q1', ans: wB, hint: 'c4_d_wr_h1' },
                { lead: 'c4_d_wr2', q: 'c4_d_wr_q2', ans: wW, hint: 'c4_d_wr_h2' },
                { lead: 'c4_d_wr3', q: 'c4_d_wr_q3', ans: wT, hint: 'c4_d_wr_h3' },
                { lead: 'c4_d_wr4', q: 'c4_d_wr_q4', ans: wTot, hint: 'c4_d_wr_h4' },
              ];
              let wj = 0;
              const wire = () => {
                if (wj >= W.length) {
                  clearGame(); showEliel();
                  tell(t('c4_d_wr_ok', { eq: bold(nw(fmtNum(wB) + ' + ' + fmtNum(wW) +
                    ' + ' + fmtNum(wT) + ' = ' + fmtNum(wTot))) }));
                  stage(pic());
                  addButton(t('btn_continue'), nextStep);
                  return;
                }
                const k = W[wj++];
                clearGame(); showEliel();
                askWithLead(t(k.lead, v), t(k.q, v), k.ans, wire, t(k.hint, v),
                  { decimal: true });
                stage(pic());
              };
              askWithLead(t('c4_d_r_ok', { seq: bold(nw('s &asymp; ' + fmtNum(sv))) }),
                t('c4_d_wr_q1', v), wB, () => { wj = 1; wire(); },
                t('c4_d_wr_h1', v), { decimal: true });
              stage(pic());
            }, t('c4_d_r_h3'), { decimal: true });
        stage(lFieldEl({ px: DPX, brackets: true, corner: 'solid', bigOutline: true,
          outer: bold(nw('s + ' + fmtNum(B) + ' &asymp; ' + fmtNum(root))),
          areaBig: bold(areaLabel(big)) }));
              }, t('c4_d_r_h2'), { decimal: true });
              lensAt(hFits, false);
            }, t('c4_d_rh_h'));
            lensAt(hFits, false);
          });
        }
      };
      draw();
    });
  },

  function dEnd() {
    clearGame(); showEliel();
    const line = bold(nw('s = ' + sqrtHTML(nw('a + b &times; b')) + ' &minus; b'));
    storyHTML('<div class="speaker">Eliel</div>' +

      '<p style="margin-top:10px">' + t('c4_d_e2', { f: line }) + '</p>' +

  // -------------------------------------------------------------------------
  // PART E — a square with ONE rectangle stuck on it, cut in half and walked
  // round until it is the L we already know. `s^2 + Bs = C`, and the whole of

  // and the prose says so — `r` is the whole, `half` is what the line eats.

      const move = () => {

        stage(stackFieldEl('moved', { labels: { half: bold(fmtNum(FIELD.B)) } }));

    const half = fracHTML('B', '2');
    const line = bold(nw('s = ' + sqrtHTML(nw('a + b &times; b')) + ' &minus; b' +

        beq: bold(nw('b = ' + half)), bh: bold(nw('b = ' + fmtNum(FIELD.B))) }) + '</p>' +
      // ⚠️ The line is ANNOUNCED before it is printed (Sylvain, 2026-09-05): it is a formula for

      '<p style="margin-top:10px">' + t('c4_e_b3', { a: bold('a'), bb: bold('B'),
        sq: bold(nw('s &times; s')) }) + '</p>' +

          rect: bold(fmtNum(2 * FIELD.B)) }, area: bold(areaLabel(FIELD.C)) }));

  // ⚠️ THE FENCE IS THE SAME TOO, AND THE DECK STATES THIS WITHOUT EXPLAINING IT. The
  // rectangle's two long sides give up exactly what the notch takes back:
  // 2(s + s + 2B) = 4s + 4B = 4(s + B). True for every s and every B, asserted in
  // ../ch4_numbers.py on three of them. Worth a screen, because Part A's own notch
  // screen made the opposite-looking point and a child could reasonably expect the
  // fence to change when ground moves.
  function ePerim() {
    clearGame(); showEliel();
    const s0 = FIELD.s, B = FIELD.B, tall = s0 + 2 * B, per = 2 * (s0 + tall);
    askWithLead(t('c4_e_pr1'),
      t('c4_e_pr_q', { w: bold(lenLabel(s0)), h: bold(lenLabel(tall)) }), per, () => {
        clearGame(); showEliel();
        // ⚠️ THE FENCE-IS-UNCHANGED SCREEN IS STRUCK (Sylvain, 2026-09-05): "too complex and
        // not natural, and not used later". Checked before cutting — `c4_e_pr2`/`c4_e_pr3` were
        // referenced only here, and nothing downstream leans on 2(s + s + 2B) = 4(s + B).
        // ⚠️ And the picture follows: the answer is about the ORIGINAL rectangle, so the reveal
        // draws that field and not the L we made out of it (caption and picture must agree).
        tell(t('c4_e_pr_ok', { eq: bold(nw('2 &times; ' + fmtNum(s0) + ' + 2 &times; ' +
          fmtNum(tall) + ' = ' + fmtNum(per))) }));
        stage(stackFieldEl('whole', { labels: { s: bold('s = ' + fmtNum(s0)),
          rect: bold(fmtNum(2 * B)) } }));
        addButton(t('btn_continue'), nextStep);
      }, t('c4_e_pr_h'));

      rect: bold(fmtNum(2 * B)) } }));
  },

    clearGame(); showEliel();
    const per = 2 * (FIELD.s + FIELD.s + 2 * FIELD.B);
    // ⚠️ THE ORIGINAL FIELD, not the L we turned it into (Sylvain, 2026-09-01). Every other
    // screen in Part E is about the CUT; this one is about buying the seeds and the wire for
    // the ground Marimon actually handed over, and that ground is a square with a rectangle
    // stuck on top. Part E's own `stackFieldEl`, covered and sown.
    const pic = () => stackFieldEl(null, { px: DPX, cells: true,

        rect: bold(nw('B = ' + fmtNum(2 * FIELD.B))) } });

      addButton(t('btn_continue'), nextStep);

  },

  // -------------------------------------------------------------------------
  // PART F — THE OTHER SIGN. `s^2 + C = B x s`: a square beside a rectangle, in
  // one strip, and what Marimon gives is the TOTAL length rather than the
  // rectangle's depth. The deck's densest page (p18), rebuilt.
  //
  // The construction: the two widths add to B, so their half is h. The square
  // falls SHORT of the halfway mark by some g, and the rectangle runs PAST it by
  // the same g — because the halves are equal. So the rectangle is (h-g) by
  // (h+g), and a rectangle like that is a square of side h less a square of side
  // g. We know its area, so we know g, so we know s = h - g.
  // ⚠️ This part uses FF, not FIELD, and draws none of the L pictures.
  // -------------------------------------------------------------------------

  function fIntro() {
    clearGame(); showEliel();
    const v = { s: bold('s'), bv: bold(lenLabel(FF.B)), cv: bold(areaLabel(FF.C)) };
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_f_in1') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_f_in2', v) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_f_in3', v) + '</p>');
    stage(stripFieldEl({ cLabel: bold(areaLabel(FF.C)), sLeft: bold('s'),
      sLabel: bold(nw('s &times; s')) }));
    // ⚠️ The screen ends on "tu veux bien nous aider ?", so the button has to ANSWER it — a
    // bare Continue under a direct question reads as the question not having been asked.
    addButton(t('c4_f_in_btn'), nextStep);
  },

  function fWhat() {
    clearGame(); showEliel();
    const v = { s: bold('s'), bv: bold(lenLabel(FF.B)) };
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_f_wt1') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_f_wt2', v) + '</p>');
    const strip = () => stripFieldEl({ cLabel: bold(areaLabel(FF.C)), sLeft: bold('s'),
      sLabel: bold(nw('s &times; s')) });
    stage(strip());
    // ⚠️ A REAL FORK (Sylvain, 2026-09-06), not two ways of saying yes. The first button runs
    // PART E's trick on this field — halve the rectangle, walk a half round — and it genuinely
    // produces an L. It is a DEAD END all the same, because the line needs `a` and `b` and we
    // are given neither, and the child gets to find that out rather than be steered past it.
    // ⚠️ Half the rectangle is (B − s)/2 = 3.5, so the L is drawn with `bv`. Every Part F
    // picture is already drawn to scale from FF.s, so this presumes nothing new.
    const hw = (FF.B - FF.s) / 2;
    const deadL = ghost => lFieldEl({ px: DPX, sv: FF.s, bv: hw, brackets: true,
      corner: ghost ? 'ghost' : undefined,
      area: bold(nw('a = ?')), labels: { s: bold('s'), b: bold('?') } });
    const back = () => {
      clearGame(); showEliel();
      tell(t('c4_f_dd4'));
      stage(strip());
      addButton(t('c4_f_dd_btn'), nextStep);
    };
    const stuck = () => {
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_f_dd2', { a: bold('a'), bb: bold('b') }) + '</p>' +
        '<p style="margin-top:10px">' + t('c4_f_dd3', { cv: bold(areaLabel(FF.C)) }) + '</p>');
      stage(deadL(true));
      addButton(t('btn_continue'), back);
    };
    const tryE = () => {
      clearGame(); showEliel();
      tell(t('c4_f_dd1'));
      stage(deadL(false));
      addButton(t('btn_continue'), stuck);
    };
    addButton(t('c4_f_wt_a1'), tryE);
    addButton(t('c4_f_wt_a2'), nextStep);
  },

  // THE SCREEN THE PART TURNS ON. The square stops short of the halfway mark and the
  // rectangle runs past it by the same amount — two gaps drawn in one ink, because they
  // are one length. Watched on a button, so the second gap arrives as a discovery.
  function fHalf() {
    const v = { g: bold('g'), hv: bold(lenLabel(fH())), bv: bold(lenLabel(FF.B)),
      hg: bold(nw('h &minus; g')), hpg: bold(nw('h + g')), s: bold('s'),
      seq: bold(nw('s = h &minus; g')) };
    const mid = bold(nw('h = ' + fmtNum(fH())));
    clearGame(); showEliel();
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_f_hf1', v) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_f_hf2', v) + '</p>');
    stage(stripFieldEl({ mid: mid, cLabel: bold(areaLabel(FF.C)), sLeft: bold('s') }));
    addButton(t('c4_f_hf_btn'), () => {
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_f_hf3', v) + '</p>' +
        '<p style="margin-top:10px">' + t('c4_f_hf4', v) + '</p>');
      stage(stripFieldEl({ mid: mid, g: bold('g'), half: bold('h'),
        cLabel: bold(areaLabel(FF.C)), sLeft: bold('s'),
        // ⚠️ `s = h − g`, not a bare `h − g` (Sylvain, 2026-09-01). That bracket measures the
        // square's own side, which has been called `s` since the part opened — writing only
        // what it comes to drops the very thing the line is being solved for.
        labels: { s: bold(nw('s = h &minus; g')) } }));
      // ⚠️ BOTH ADVANCE. The screen ends on "c'est bon pour toi ?", and both answers are an
      // honest reading of it — the part has just produced four lengths and not one number, and
      // saying so is fair rather than wrong. A Continue under a direct question reads as the
      // question not having been asked.
      addButton(t('c4_f_hf_a1'), nextStep);
      addButton(t('c4_f_hf_a2'), nextStep);
    });
  },

  // ⚠️ REBUILT (Sylvain, 2026-08-27) in place of a difference-of-two-squares detour. The
  // rectangle is cut at the halfway mark and the little piece walked up onto the big one —
  // and what comes out is the chapter's OWN picture, completing the square for the fourth
  // time, rather than a separate identity used once and never again.
  function fRect() {
    // ⚠️ The two pieces are named by their COLOUR here, and `fMoveEl`'s cut view is the
    // authority: the g-wide slice is PIECE.arm (green) and the h-wide half is PIECE.foot
    // (yellow). Checked before writing the sentence.
    const v = { cv: bold(areaLabel(FF.C)), g: bold('g'), s: bold('s'),
      hv: bold(lenLabel(fH())), heq: bold(nw('h = ' + lenLabel(fH()))) };
    const bars = [[0, FF.s, bold('s'), PIECE.sq.ink], [FF.s, fG(), bold('g'), PIECE.arm.ink],
      [fH(), fH(), bold(nw('h = ' + fmtNum(fH()))), '#a3364a']];
    clearGame(); showEliel();
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_f_rc1', v) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_f_rc2', v) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_f_rc5', v) + '</p>');
    stage(fMoveEl('cut', { bars: bars, area: bold(areaLabel(FF.C)), sLeft: bold('s') }));
    // ⚠️ BOTH BUTTONS ADVANCE. The move is proposed rather than instructed — same call as
    // `fWhat` one screen back, and `aWeirdIndeed`'s rule: an invitation to have an opinion
    // about a move that looks absurd, not a test.
    const go = () => {
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_f_rc3', v) + '</p>' +
        '<p style="margin-top:10px">' + t('c4_f_rc4', v) + '</p>');
      stage(fMoveEl('moved', { bars: bars, area: bold(areaLabel(FF.C)), sLeft: bold('s') }));
      // ⚠️ BOTH ADVANCE. The screen ends on "pas vrai ?", and the sceptical button is a fair
      // reading — what is on screen is an L-SHAPE, but nobody has yet said what its corner is
      // or how it helps, which is exactly what `fSquares` goes on to do.
      addButton(t('c4_f_rc4_a1'), nextStep);
      addButton(t('c4_f_rc4_a2'), nextStep);
    };
    addButton(t('c4_f_rc_a1'), go);
    addButton(t('c4_f_rc_a2'), go);
  },

  // The L, read as the four regions this chapter has been reading since Part C: the twin
  // of the field's own square, two strips, and the one corner that is missing.
  // ⚠️ THE L's TWO SIDES ARE CHECKED BEFORE THE LINE IS USED (Sylvain, 2026-09-06). Our
  // formula only works on an L that COMPLETES to a square, and nobody had yet shown that this
  // one does. The child measures the walked-round piece themselves — its long side is `s`, its
  // short side `g` — and reads the L's left-hand side off the two of them.
  function fCheckL() {
    clearGame(); showEliel();
    tell(t('c4_f_ck1'));
    stage(fMoveEl('moved', { bars: fBotBars(),
      area: bold(areaLabel(FF.C)), sLeft: bold('s') }));
    // all three advance: it is an opinion about a thing nobody has checked yet
    ['c4_f_ck_a1', 'c4_f_ck_a2', 'c4_f_ck_a3'].forEach(k => addButton(t(k), nextStep));
  },

  function fSquares() {
    const v = { g: bold('g'), s: bold('s'), hv: bold(lenLabel(fH())),
      cv: bold(areaLabel(FF.C)), spg: bold(nw('s + g')),
      heq: bold(nw('h = B/2 = s + g = ' + fmtNum(fH()))),
      eq: bold(nw('s + ? = h')), geq: bold(nw('g = h &minus; s')),
      geqn: bold(nw('g = ' + sqrtHTML(fmtNum(fH() * fH() - FF.C)))),
      sub: bold(nw(fmtNum(fH() * fH()) + ' &minus; ' + fmtNum(FF.C) + ' = ' +
        areaLabel(fH() * fH() - FF.C))),
      rt: bold(nw(sqrtHTML(fmtNum(fH() * fH() - FF.C)) + ' = ?')),
      hsq: bold(nw('h&sup2; = h &times; h = ' + fmtNum(fH()) + ' &times; ' + fmtNum(fH()) +
        ' = ' + fmtNum(fH() * fH()))),
      eq25: bold(nw(fmtNum(fH() * fH()) + ' = ' + fmtNum(FF.C) + ' + ?')),
      nv: bold(areaLabel(fH() * fH() - FF.C)),
      gsq: bold(nw('g &times; g')), sq: bold(nw('s &times; s')) };
    const bars = [[fH(), FF.s, bold('s'), PIECE.sq.ink],
      [fH() + FF.s, fG(), bold('g'), PIECE.arm.ink]];
    const hbar = fBotBars();
    const SQ = PIECE.sq.ink, AR = PIECE.arm.ink, RD = '#a3364a';
    // ⚠️ The picture GAINS a measure per screen and never loses one, so by the last of them
    // `s`, `g` and the left-hand side are on the ground together — which is the state the
    // rest of the part reasons from.
    const walk = o => fMoveEl('moved', Object.assign({ bars: hbar, sLeft: bold('s'),
      area: bold(areaLabel(FF.C)) }, o));
    // ⚠️ IS THE MISSING CORNER EVEN A SQUARE? (Sylvain, 2026-09-06.) Our line completes an L
    // into a SQUARE, and nothing had shown that this corner is one — we only know it is `g`
    // tall. Its other side is what is left of the big square's top once the green rectangle's
    // `s` is taken off, so `s + ? = h` — and the answer is `g` (equally `h − s`, and both are
    // accepted). Only then is the corner `g × g` and the line allowed to run.
    const pic4 = () => walk({ topBar: [fH(), FF.s, bold('s'), SQ], lefts: LEFTS_H });
    const corner = () => choose(lead(t('c4_f_cn1', v)), pic4,
      ['h', '0', '5', 'B/2', 's', 'g', 's - g', 'h - s'], [5, 7], 'c4_f_cn_no', rest, v, true);
    // ⚠️ THE CORNER'S AREA COMES FIRST, AND IT COMES OUT OF THE TRICK RUN BACKWARDS (Sylvain,
    // 2026-09-06). On this field the big square's SIDE is the one thing we were given, so its
    // area is `h x h = 25` for free — and the corner is what is left when the L's 21 is taken
    // off it. Only then is it worth asking whether that corner is a square. Area first, side
    // second, which is the order every other field in the chapter uses too.
    const sure = () => {
      clearGame(); showEliel();
      tell(t('c4_f_ms2', v));
      stage(pic4());
      addButton(t('c4_f_ms_a1'), corner);
      addButton(t('c4_f_ms_a2'), corner);
    };
    const missing = () => {
      clearGame(); showEliel();
      askWithLead(t('c4_f_ms1', v), t('c4_f_ms_q'), fH() * fH() - FF.C, sure,
        t('c4_f_ms_h'));
      stage(pic4());
    };
    // ⚠️ The labels are NOTATION, identical in both languages, so they are passed `raw`.
    // ⚠️ THE CORNER'S SIDE COMES STRAIGHT OFF ITS AREA (Sylvain, 2026-09-06). `missing` has
    // already produced the 4 by running the trick backwards, so the four screens that used to
    // build up to that same 4 — the twin square, the two strips, filling the corner in, and
    // `h x h = 21 + g x g` — say it a second time and are struck. What is left is the one move
    // that is new: a square of known area gives up its side, which is the whole of last quest.
    const rest = () => {
      clearGame(); showEliel();
      askWithLead(t('c4_f_cn_ok', v) + '</p><p style="margin-top:10px">' + t('c4_f_gq', v),
        t('c4_f_gq2', v), fG(), nextStep, t('c4_f_gh'));
      stage(fMoveEl('square', { corner: bold(nw('g &times; g = ' + fmtNum(fH() * fH() - FF.C))),
        lefts: LEFTS_H,
        bars: [[fH(), fH(), bold(nw('s + g = h = ' + fmtNum(fH()))), '#a3364a']],
        side: [bold(nw('s + g = ' + fmtNum(fH()))), '#a3364a'] }));
    };
    // ⚠️ The three measures that stay for the rest of Part F: the two pieces in the inner
    // column, and `h = 5` spanning them from outside — this project's own two-pieces-and-the-
    // total mark-up. The outer one arrives only on the REVEAL; drawn a screen earlier it would
    // answer the question being asked (lesson 17).
    const LEFTS = [[-fG(), fG(), bold('g'), AR, 0], [0, FF.s, bold('s'), SQ, 0]];
    const LEFTS_H = LEFTS.concat([[-fG(), FF.s + fG(),
      bold(nw('h = ' + fmtNum(fH()))), RD, 1]]);
    // the L's left side is h, and so is its foot
    const three = () => {
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_f_wk4', v) + '</p>' +
        '<p style="margin-top:10px">' + t('c4_f_wk5', v) + '</p>');
      stage(walk({ topBar: [fH(), FF.s, bold('s'), SQ], lefts: LEFTS_H }));
      addButton(t('c4_f_wk_a1'), missing);
      addButton(t('c4_f_wk_a2'), missing);
    };
    // the left-hand side. ⚠️ FOUR of the six labels are the same length (s + g = h = B/2 = 5),
    // so all four are accepted; only `s` and `B` are wrong.
    // ⚠️ ONLY `g` IS DRAWN ON THE L's LEFT EDGE while the question is open (Sylvain,
    // 2026-09-06). The other piece is `s`, and the child is meant to find it themselves — off
    // the `s` measured at the field's own left edge and the `s` under the square at the bottom.
    // `s` is added to the L's edge only once they have missed, as help rather than as a given.
    const two = () => choose(lead(t('c4_f_wk3', v)),
      () => walk({ topBar: [fH(), FF.s, bold('s'), SQ], lefts: [LEFTS[0]] }),
      ['s', 'B', '5', 'h', 's + g', 'B/2'], [2, 3, 4, 5], 'c4_f_wk_no3', three, v, true,
      () => walk({ topBar: [fH(), FF.s, bold('s'), SQ], lefts: LEFTS }));
    // ⚠️ ONE question about the green piece, not two (Sylvain, 2026-09-06): its LONG side is
    // `s`, and `s` is measured down the left edge on every screen of this part, so asking for
    // it would be asking for something already on the picture. Only the SHORT side is new.
    clearGame(); showEliel();
    choose(lead(t('c4_f_wk2', v)),
      () => walk({ topBar: [fH(), FF.s, bold('s'), SQ] }),
      ['h', 's', '5', '10', 'g', 's + g', 'B'], 4, 'c4_f_wk_no2', two, v, true);
  },

  function fSolve() {
    const h = fH(), g = fG(), gsq = h * h - FF.C;
    const v = { g: bold('g'), gsq: bold(nw('g &times; g')) };
    const eq = bold(nw(fmtNum(h) + ' &times; ' + fmtNum(h) + ' = ' + fmtNum(FF.C) +
      ' + g &times; g'));
    const pic = () => fMoveEl('square', { corner: bold(nw('g &times; g')), sLeft: bold('s'),
      bars: [[h, h, bold(nw('s + g = h = ' + fmtNum(h))), '#a3364a']],
      side: [bold(nw('s + g = ' + fmtNum(h))), '#a3364a'] });
    clearGame(); showEliel();
    {
      {
        {
          // s = h - g, and the OTHER side is h + g - planted here for Part G, which is
          // about the two answers one equation can have.
          const other = h + g;
          // ⚠️ `g` was found on the screen before this one, so this step opens straight on
          // what it is worth and asks only for `s`.
          askWithLead(t('c4_f_eq_ok', { g: v.g, gv: bold(lenLabel(g)) }),
            t('c4_f_s_q', { g: v.g, s: bold('s'),
              eq: bold(nw('s + g = ' + fmtNum(fH()))) }), FF.s, () => {
              clearGame(); showEliel();
              tell(t('c4_f_s_ok', { seq: bold('s = ' + fmtNum(FF.s)), hv: bold(fmtNum(h)),
                g: v.g, other: bold(fmtNum(other)), sv: bold(fmtNum(FF.s)),
                bv: bold(fmtNum(FF.B)),
                mult: bold(nw(fmtNum(FF.s) + ' &times; ' + fmtNum(other) + ' = ' +
                  fmtNum(FF.C))) }));
              stage(stripFieldEl({ cLabel: bold(areaLabel(FF.C)),
                sLeft: bold('s = ' + fmtNum(FF.s)),
                labels: { s: bold('s = ' + fmtNum(FF.s)) } }));
              addButton(t('btn_continue'), nextStep);
            }, t('c4_f_s_h'));
          stage(pic());
        }
      }
    }
    stage(pic());
  },

  function fTotals() {
    clearGame(); showEliel();

  function fRule() {

    stage(fMoveEl('square', { corner: bold(nw('g &times; g')), sLeft: bold('s'),
      bars: [[fH(), fH(), bold(nw('s + g = h')), '#a3364a']] }));

  },

  // -------------------------------------------------------------------------
  // PART G — ONE EQUATION, TWO ANSWERS, and the chapter's ending.
  //
  // Parts E and F look like different problems and are the same one: move
  // everything to one side and both are `s^2 + Bs + C = 0`. Part E has B = 4 and
  // C = -21; Part F has B = -10 and C = 21.
  //
  // ⚠️ D3 SETTLED (Sylvain): the minus sign goes in, and it is named as OWING.
  // Taking 21 off a side that has none leaves us owing 21, which is what the dash
  // in front means; and the root -7 is set aside as "a length that cannot be",
  // not explained away. That is the deck's own line and it is the honest one.
  // -------------------------------------------------------------------------

  function gBoth() {
    clearGame(); showEliel();
    const e1 = bold(nw('s &times; s + 4 &times; s = 21'));
    const e2 = bold(nw('s &times; s + 21 = 10 &times; s'));
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_g_bo1') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_g_bo2', { e1: e1, e2: e2 }) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_g_bo3') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_g_bo_q') + '</p>');
    stage(gPairEl());
    // ⚠️ Both buttons advance. The question is an invitation to have an opinion about what
    // is coming, not a test — the chapter's own rule since `aWeirdIndeed`, and a choice that
    // accepts only one answer teaches the child that Eliel was not really asking.
    const on = () => {
      clearGame(); showEliel();
      tell(t('c4_g_bo4'));
      stage(gPairEl());
      addButton(t('btn_continue'), nextStep);

  // ⚠️ THE TWO-DASH RULE, STATED AND NOT EXPLAINED (Sylvain, 2026-08-28). The line about
  // to be used contains `2 x 2 - (-21)`, and there is no honest picture for a dash meeting
  // a dash — every real account of it appeals to keeping the arithmetic consistent, not to
  // anything a child can see. So it is given a NAME, called useful, and promised for later.
  // ⚠️ It is named THE RULE OF SIGNS (Sylvain asked for a proper term, in the register of
  // commutativity and distributivity). That is the real one, and in French it is exactly
  // what school calls it — « la règle des signes » — so the child meets the same words
  // again later. "Two dashes make a plus" stays as the plain gloss beside it, which is
  // how Chapter 2 handled distributivity: name it, then cut it back down to size.
  // ⚠️ And the promised story is DISTRIBUTIVITY, Chapter 2's own: 0 = -1 x (1 + -1) =
  // -1 x 1 + -1 x -1, so the last term has to be 1. The explanation is already built.
  function gDash() {
    clearGame(); showEliel();
    const rule = bold(nw('&minus;1 &times; &minus;1 = 1'));
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_g_ds1') + '</p>' +
      '<p style="margin-top:14px; text-align:center; font-size:24px">' + rule + '</p>' +
      '<p style="margin-top:14px">' + t('c4_g_ds2') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_g_ds3') + '</p>');
    addButton(t('btn_continue'), nextStep);
  },

  function gLine() {
    clearGame(); showEliel();
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_g_pm1') + '</p>' +
      '<p style="margin-top:14px; text-align:center; font-size:20px">' + gLineHTML() + '</p>' +
      '<p style="margin-top:14px">' + t('c4_g_pm2', { pm: bold('&plusmn;') }) + '</p>' +
      gSignsHTML());
    addButton(t('btn_continue'), nextStep);
  },

  // Part E's equation: 3, and a root that is not a field. Set aside, not explained away.
  // ⚠️ THE LINE IS RUN A PIECE AT A TIME, on the field it is about. The letter line stays put
  // at the top as the reference; underneath it a second copy fills in, letter by letter, as
  // each piece is answered — the chapter's own "?"-then-reveal, on a formula instead of a
  // caption. So the substitution is watched rather than performed off-screen.
  // ⚠️ `−B̃/2` is deliberately NOT a question: once `B̃/2 = 2` is answered the filled line
  // already prints `s = −2 ± …`, and asking for it would be asking for something on screen.
  // The sign is where it earns its keep on the OTHER field, which is `gTwo`'s job.
  function gNeg() {
    clearGame(); showEliel();
    const Bt = 2 * FIELD.B, Ct = -FIELD.C;          // B̃ = the rectangle's own depth; C̃ = −area
    const half = Bt / 2, sq = half * half, disc = sq - Ct, root = Math.sqrt(disc);
    const m = '&minus;', neg = n => m + fmtNum(Math.abs(n));
    const k = { half: false, sq: false, cc: false, disc: false, root: false };
    const filled = () => {
      const h = k.half ? fmtNum(half) : fracHTML(BTIL, '2');
      const cc = k.cc ? nw('(' + neg(Ct) + ')') : CTIL;
      let tail;
      if (k.root) tail = fmtNum(root);
      else if (k.disc) tail = sqrtHTML(fmtNum(disc));
      else if (k.sq) tail = sqrtHTML(nw(fmtNum(sq) + ' ' + m + ' ' + cc));
      else tail = sqrtHTML(nw(h + ' &times; ' + h + ' ' + m + ' ' + cc));
      return bold(nw('s = ' + m + h + ' &plusmn; ' + tail));
    };
    const pic = () => {
      const wrap = document.createElement('div');
      const p = document.createElement('p');
      p.style.cssText = 'text-align:center; font-size:19px; margin:4px 0 2px';
      p.innerHTML = gLineHTML();
      wrap.appendChild(p);
      // ⚠️ The filling-in copy appears only once there is something in it. Drawn from the
      // start it is a byte-for-byte duplicate of the line above it, which reads as a mistake
      // rather than as a second copy waiting to be filled.
      if (k.half || k.sq || k.cc || k.disc || k.root) {
        const q = document.createElement('p');
        // ⚠️ 18px, not 8: the letter line's own tick is STRETCHED and overflows its box
        // downward (scaleY does not take layout space), so at a small gap it lands on
        // the copy underneath.
        q.style.cssText = 'text-align:center; font-size:19px; margin:18px 0 2px; color:#a3364a';
        q.innerHTML = filled();
        wrap.appendChild(q);
      }
      // ⚠️ B̃ is written on the rectangle's own bracket, where it can be read off — and the
      // caption above stays the field's TRUE area. C̃ is −21 and the ground is 21: writing
      // the signed number on the picture would make the picture say something false about
      // the land, which is exactly what question 4 is for.
      // ⚠️ Drawn smaller than Part E drew it: the field is 7 magic lengths tall, and at the
      // chapter's own PX it plus the two formula lines runs off the bottom of the screen —
      // on a step whose whole point is reading the picture while answering about it.
      wrap.appendChild(stackFieldEl(null, { px: 34, area: areaLabel(FIELD.C),
        labels: { rect: bold(nw(BTIL + ' = ' + fmtNum(Bt))) } }));
      wrap.appendChild(gEqnRow(Bt, Ct));
      return wrap;
    };
    const bt = bold(BTIL), ct = bold(CTIL), h2 = bold(fracHTML(BTIL, '2'));
    const sqx = bold(nw(fracHTML(BTIL, '2') + ' &times; ' + fracHTML(BTIL, '2')));
    const dsc = bold(nw(fmtNum(sq) + ' &minus; (' + neg(Ct) + ')'));
    const rt = bold(sqrtHTML(fmtNum(disc)));
    const ASKS = [
      { q: 'c4_g_w_q1', h: 'c4_g_w_h1', n: Bt,   v: { bt: bt } },
      { q: 'c4_g_w_q2', h: 'c4_g_w_h2', n: half, v: { h2: h2 }, set: 'half' },
      { q: 'c4_g_w_q3', h: 'c4_g_w_h3', n: sq,   v: { sq: sqx }, set: 'sq' },
      { q: 'c4_g_w_q4', h: 'c4_g_w_h4', n: Ct,   v: { ct: ct, a: bold(areaLabel(FIELD.C)) }, set: 'cc' },
      { q: 'c4_g_w_q5', h: 'c4_g_w_h5', n: disc, v: { d: dsc }, set: 'disc' },
      { q: 'c4_g_w_q6', h: 'c4_g_w_h6', n: root, v: { rt: rt }, set: 'root' }
    ];
    let i = 0;
    const finish = () => {
      const three = bold(lenLabel(3)), mseven = bold(nw(neg(-7)));
      askAfterButton(t('c4_g_e_q', { eq: filled() }), 3, () => {
        clearGame(); showEliel();
        storyHTML('<div class="speaker">Eliel</div>' +
          '<p>' + t('c4_g_e_ok', { three: three, neg: mseven }) + '</p>' +
          '<p style="margin-top:10px">' + t('c4_g_e2', { neg: mseven }) + '</p>' +
          '<p style="margin-top:10px">' + t('c4_g_e3') + '</p>');
        // ⚠️ The number line first, then the FIELD under it wearing its answer, then the two
        // chains — so the screen reads answer, ground, working. The field's own bracket is
        // where `s = 3` is written: a length on the ground wears its number, which is this
        // project's habit and better than a bare `s = 3` floating beside it.
        stage(gRootsEl([3, -7]));
        const w = document.createElement('div');
        w.appendChild(stackFieldEl(null, { px: 34, area: areaLabel(FIELD.C),
          labels: { rect: bold(nw(BTIL + ' = ' + fmtNum(Bt))),
                    s: bold(nw('s = ' + fmtNum(FIELD.s))) } }));
        const h2f = fracHTML(BTIL, '2');
        const solve = plus => {
          const S = plus ? ' + ' : ' ' + m + ' ';
          const end = plus ? [fmtNum(root) + ' ' + m + ' ' + fmtNum(half), fmtNum(FIELD.s)]
                           : [neg(-half - root)];
          return gChain(['s = ' + m + h2f + S +
              sqrtHTML(nw(h2f + ' &times; ' + h2f + ' ' + m + ' ' + CTIL)),
            m + fmtNum(half) + S + sqrtHTML(nw(fmtNum(half) + ' &times; ' + fmtNum(half) +
              ' ' + m + ' (' + neg(Ct) + ')')),
            m + fmtNum(half) + S + sqrtHTML(nw(fmtNum(sq) + ' + ' + fmtNum(-Ct))),
            m + fmtNum(half) + S + sqrtHTML(fmtNum(disc)),
            m + fmtNum(half) + S + fmtNum(root)].concat(end));
        };
        [true, false].forEach((plus, n) => {
          const d = document.createElement('p');
          d.style.cssText = 'text-align:center; font-size:17px; margin:' +
            (n ? 10 : 18) + 'px 0 0; color:' + (plus ? '#3f7a34' : '#a3364a');
          d.innerHTML = solve(plus);
          w.appendChild(d);
        });
        gameArea.appendChild(w);
        addButton(t('btn_continue'), nextStep);
      }, t('c4_g_e_h'));
    };
    const run = () => {
      const a = ASKS[i];
      clearGame(); showEliel(); stage(pic());
      const lead = i === 0 ? t('c4_g_w_l', { bt: bt, ct: ct }) + PARA : '';
      askAfterButton(lead + t(a.q, a.v), a.n, () => {
        if (a.set) k[a.set] = true;
        i++;
        if (i < ASKS.length) run(); else { clearGame(); showEliel(); stage(pic()); finish(); }
      }, t(a.h, a.v));
    };
    run();
  },

  // Part F's equation: and THIS time both roots are honest fields. The deck's best page.
  // ⚠️ THE SAME WALK AS `gNeg`, on the other field — and here the two roles SWAP. There it
  // was the AREA that carried the dash (Marimon gave the whole field) and the length was
  // plain; here it is the LENGTH that carries it (he gave the whole strip) and the area is
  // plain. So the same six questions land on the opposite letters, which is the whole of
  // what `gOne` claimed about the two signs.
  // ⚠️ And `−B̃/2` IS a question this time. On the first field it was −2 and the filled line
  // printed it the moment `B̃/2` was answered; here `B̃/2 = −5` and `−B̃/2 = 5`, which is the
  // rule of signs doing real work — so it gets asked, where on the first field it could not be.
  // ⚠️ The walk runs on the SINGLE strip, not on `gBothFieldsEl` — which draws both roots
  // with `s = 3` and `s = 7` written on them, i.e. the answer, over a box asking for it.
  // Both fields arrive at the reveal, where they are the point.
  function gTwo() {
    clearGame(); showEliel();
    const Bt = -FF.B, Ct = FF.C;                    // B̃ = −(the whole strip); C̃ = the rectangle
    const half = Bt / 2, sq = half * half, disc = sq - Ct, root = Math.sqrt(disc);
    const hi = -half + root, lo = -half - root;     // 7 and 3, both honest fields
    const m = '&minus;', neg = n => m + fmtNum(Math.abs(n));
    const k = { half: false, nh: false, sq: false, cc: false, disc: false, root: false };
    const h2f = fracHTML(BTIL, '2');
    const filled = () => {
      const head = k.nh ? fmtNum(-half)
                 : k.half ? nw(m + '(' + neg(half) + ')') : m + h2f;
      const cc = k.cc ? fmtNum(Ct) : CTIL;
      const hp = k.half ? nw('(' + neg(half) + ')') : h2f;
      let tail;
      if (k.root) tail = fmtNum(root);
      else if (k.disc) tail = sqrtHTML(fmtNum(disc));
      else if (k.sq) tail = sqrtHTML(nw(fmtNum(sq) + ' ' + m + ' ' + cc));
      else tail = sqrtHTML(nw(hp + ' &times; ' + hp + ' ' + m + ' ' + cc));
      return bold(nw('s = ' + head + ' &plusmn; ' + tail));
    };
    const pic = () => {
      const wrap = document.createElement('div');
      const p = document.createElement('p');
      p.style.cssText = 'text-align:center; font-size:19px; margin:4px 0 2px';
      p.innerHTML = gLineHTML();
      wrap.appendChild(p);
      if (k.half || k.nh || k.sq || k.cc || k.disc || k.root) {
        const q = document.createElement('p');
        q.style.cssText = 'text-align:center; font-size:19px; margin:18px 0 2px; color:#a3364a';
        q.innerHTML = filled();
        wrap.appendChild(q);
      }
      // ⚠️ `B = 10` on the bottom bracket and `21` on the rectangle: the strip's TRUE length
      // and the rectangle's TRUE area. `B̃` is −10, and writing that on the ground would say
      // the strip is minus ten long — which is exactly what question 1 is for.
      wrap.appendChild(stripFieldEl({ px: 36, cLabel: bold(areaLabel(FF.C)),
        sLabel: bold(nw('s &times; s')) }));
      wrap.appendChild(gEqnRow(Bt, Ct));
      return wrap;
    };
    const bt = bold(BTIL), ct = bold(CTIL), h2 = bold(fracHTML(BTIL, '2'));
    const nh2 = bold(nw(m + fracHTML(BTIL, '2')));
    // the line's two branches, written out in full — the reveal draws both, and the merged
    // choice shows them under the two fields while the child picks between them
    const solve = plus => {
      const S = plus ? ' + ' : ' ' + m + ' ';
      return gChain(['s = ' + m + h2f + S +
          sqrtHTML(nw(h2f + ' &times; ' + h2f + ' ' + m + ' ' + CTIL)),
        fmtNum(-half) + S + sqrtHTML(nw('(' + neg(half) + ') &times; (' + neg(half) +
          ') ' + m + ' ' + fmtNum(Ct))),
        fmtNum(-half) + S + sqrtHTML(nw(fmtNum(sq) + ' ' + m + ' ' + fmtNum(Ct))),
        fmtNum(-half) + S + sqrtHTML(fmtNum(disc)),
        fmtNum(-half) + S + fmtNum(root),
        fmtNum(plus ? hi : lo)]);
    };
    const sqx = bold(nw(fracHTML(BTIL, '2') + ' &times; ' + fracHTML(BTIL, '2')));
    const dsc = bold(nw(fmtNum(sq) + ' ' + m + ' ' + fmtNum(Ct)));
    const rt = bold(sqrtHTML(fmtNum(disc)));
    const ASKS = [
      { q: 'c4_g_v_q1', h: 'c4_g_v_h1', n: Bt,    v: { bt: bt, b: bold(lenLabel(FF.B)) } },
      { q: 'c4_g_v_q2', h: 'c4_g_v_h2', n: half,  v: { h2: h2 }, set: 'half' },
      { q: 'c4_g_v_q3', h: 'c4_g_v_h3', n: -half, v: { nh: nh2 }, set: 'nh' },
      { q: 'c4_g_v_q4', h: 'c4_g_v_h4', n: sq,    v: { sq: sqx }, set: 'sq' },
      { q: 'c4_g_v_q5', h: 'c4_g_v_h5', n: Ct,    v: { ct: ct, a: bold(areaLabel(FF.C)) }, set: 'cc' },
      { q: 'c4_g_v_q6', h: 'c4_g_v_h6', n: disc,  v: { d: dsc }, set: 'disc' },
      { q: 'c4_g_v_q7', h: 'c4_g_v_h7', n: root,  v: { rt: rt }, set: 'root' }
    ];
    let i = 0;
    // ⚠️ MERGED WITH `gTell` (Sylvain, 2026-08-28). It used to ask for "the bigger of the
    // two" — an arithmetic question about a line the child had just finished building — and
    // then a separate step asked which of the two fields was ours, choosing between the words
    // "the narrow square" and "the wide square". Now there is one screen and one choice, and
    // it is made ON THE LINE: the two buttons are its own two branches. So the `±` stops being
    // a fact about notation and becomes the thing the child actually decides.
    const finish = () => {
      const three = bold(lenLabel(lo)), seven = bold(lenLabel(hi));
      const w = () => {
        const d = document.createElement('div');
        d.appendChild(gBothFieldsEl());
        [true, false].forEach((plus, n) => {
          const p = document.createElement('p');
          p.style.cssText = 'text-align:center; font-size:17px; margin:' +
            (n ? 10 : 18) + 'px 0 0; color:#3a3a3a';
          p.innerHTML = solve(plus);
          d.appendChild(p);
        });
        return d;
      };
      // ⚠️ Plain text, not the HTML helpers: addButton sets textContent. And the branch that
      // gives OUR field goes second, so the row cannot be got by taking the first thing.
      const lbl = plus => 's = ' + fmtNum(-half) + (plus ? ' + ' : ' \u2212 ') +
        fmtNum(root) + ' = ' + fmtNum(plus ? hi : lo);
      const tell = () => choose(lead(t('c4_g_tw_q')),
        w, [lbl(true), lbl(false)], 1, 'c4_g_tw_no', () => {
          clearGame(); showEliel();
          // ⚠️ `mult` carries its UNIT (`7 x 3 = 21 magic squares`), because the sentence
          // now says that this is the area the registers recorded — and a bare 21 beside a
          // 21-magic-square field would be the one place a number went unlabelled.
          storyHTML('<div class="speaker">Eliel</div>' +
            '<p>' + t('c4_g_tw_ok', { three: three }) + '</p>' +
            '<p style="margin-top:10px">' + t('c4_g_tw1', { seven: seven, three: three,
              bv: bold(lenLabel(FF.B)),
              mult: bold(nw('7 &times; 3 = ' + areaLabel(FF.C))) }) + '</p>');
          // ⚠️ BOTH at full strength, where `gTell` used to fade all but ours. The reveal now
          // carries `tw1`/`tw2` as well — the check that 7 really is a field, 7 x 3 = 21 and
          // 10 long — and dimming the field those two sentences are about would have the
          // picture arguing with the words on top of it.
          stage(gBothFieldsEl());
          addButton(t('btn_continue'), nextStep);
        }, { three: three, seven: seven }, true);
      // both advance: it is a doubt, and the screen after it is what settles the doubt
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_g_f_q', { eq: filled() }) + '</p>' +
        '<p style="margin-top:10px">' + t('c4_g_tw3') + '</p>');
      stage(w());
      addButton(t('c4_g_tw3_a1'), tell);
      addButton(t('c4_g_tw3_a2'), tell);
    };
    const run = () => {
      const a = ASKS[i];
      clearGame(); showEliel(); stage(pic());
      const lead = i === 0 ? t('c4_g_v_l') + PARA : '';
      askAfterButton(lead + t(a.q, a.v), a.n, () => {
        if (a.set) k[a.set] = true;
        i++;
        if (i < ASKS.length) run(); else { clearGame(); showEliel(); stage(pic()); finish(); }
      }, t(a.h, a.v));
    };
    run();
  },

  // ⚠️ THE REAL DERIVATION ON THE OTHER ROOT'S FIELD (Sylvain, 2026-08-27): *"the child
  // would want that at this point"*. And they would — the part has just claimed 7 is an
  // honest field, and a child who has spent Part F cutting one field has every right to
  // ask whether the cut would have worked on this one.
  //
  // ⚠️ IT DOES NOT, WORD FOR WORD, and that is the screen. Halving the strip lands the mark
  // INSIDE the square. What the cut really needed was the rectangle's LONGER side, cut at
  // `h` from one end — and last field that side lay along the strip, so the mark fell in
  // the middle of it and "halve the strip" was enough. Here the square OVERSHOOTS the mark
  // by the very same `g`, so the rectangle's depth is the long side and that is where the
  // five goes.
  function gOther() {
    const v = { bv: bold(lenLabel(FF.B)), hv: bold(lenLabel(fH())), g: bold('g'),
      seven: bold(lenLabel(G7)), three: bold(lenLabel(FF.B - G7)), s: bold('s') };
    const midbar = bold(nw('h = ' + fmtNum(fH())));
    clearGame(); showEliel();
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_g_ot1', v) + '</p>');
    // ⚠️ `s` and `w`, with no numbers on either (Sylvain). The whole screen is "pretend
    // Marimon handed us THIS field" — printing 7 and 3 on it would be knowing the answer.
    const pic0 = () => gCutEl('field', { bars: [[0, G7, bold('s'), PIECE.sq.ink],
      [G7, FF.B - G7, bold('w'), PIECE.foot.ink]] });
    stage(pic0());
    // ⚠️ BOTH ADVANCE, and the LETTERS are named on the screen after — where the picture has
    // been carrying `s` and `w` since the first. Naming them two screens later, as it used to,
    // asked the child to read two labels nobody had given them.
    const halve = () => {
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_g_ot3', v) + '</p>' +
        '<p style="margin-top:10px">' + t('c4_g_ot4', Object.assign({},
          v, { eqa: bold(nw('h = s &minus; g')) })) + '</p>' +
        // ⚠️ THE GOAL IS STATED BEFORE THE MECHANISM (Sylvain, 2026-09-06): we want an L whose
        // side we know, and `h` is the length we know — so the cut has a reason before the
        // next screen shows how it is made.
        '<p style="margin-top:10px">' + t('c4_g_ot4b', { hv: v.hv,
          heq: bold(nw('h = ' + fmtNum(fH()))) }) + '</p>');
      // ⚠️ `s` AND `w` STAY, on the row below the new `g` (Sylvain, 2026-09-06). They were
      // named on the screen before and the sentence here leans on both of them; and these are
      // `gSideBars()`'s own first three rows, so not one bracket moves between this screen and
      // the two that follow it.
      stage(gCutEl('field', { mid: midbar, bars: gSideBars().slice(0, 3) }));
      // both advance: it is an invitation, and the answer is the screen after
      // ⚠️ THE `ot6` SCREEN IS STRUCK (Sylvain, 2026-09-06): it derived `w = h − g` and
      // `s − g = h` in prose, and `gOtherL` has the child work the very same fact out off the
      // picture two screens later. Told and then asked is the drift this chapter treats as a
      // defect. The invitation now goes straight to the cut, which is what it offered to show.
      // ⚠️ THE WHOLE SIDE IS ACCOUNTED FOR (Sylvain, 2026-08-28): four bracket rows under the
      // field — `g`, then `s` and `w`, then the two `h` halves, then `B`. Shared with
      // `gOtherL`'s first screen, so not one bracket moves when the little piece walks round.
      // ⚠️ The vertical `g` on the RIGHT is the answer to the question below, so while that
      // question is open it carries a `?`. The horizontal `g` under the field stays as it is —
      // that one is the gap the square overshoots the mark by, and the child needs it to
      // answer at all.
      const cutPic = lab => gCutEl('cut', { stand: bold(nw('h = ' + fmtNum(fH()))), carry: true,
        split: true, bars: gSideBars(),
        vbars: [[FF.B, fG(), fH(), bold(nw('h = ' + fmtNum(fH()))), '#a3364a'],
                [FF.B, 0, fG(), bold(lab), PIECE.arm.ink]] });
      // ⚠️ THE LEFTOVER IS ASKED FOR (Sylvain, 2026-09-06) rather than announced: the
      // rectangle's long side is `s`, we have taken `h` off it, and what is left is `g` —
      // which is also `s − h`, so BOTH labels are accepted. That the two coincide is the
      // whole reason this field works at all.
      const vg = Object.assign({}, v, { h: bold('h'), cv: bold(areaLabel(FF.C)),
        heq: bold(nw('B/2 = h = ' + fmtNum(fH()))),
        heq2: bold(nw('h = ' + fmtNum(fH()))) });
      const stand = () => choose(lead(t('c4_g_ot6b', vg)), () => cutPic('?'),
        ['s', 'g', 's - h', 'h', 'B', 'B/2', '5', '10'], [1, 2], 'c4_g_ot6b_no', () => {
          clearGame(); showEliel();
          tell(t('c4_g_ot6c', vg));
          stage(cutPic('g'));
          addButton(t('c4_g_ot6c_a1'), nextStep);
          addButton(t('c4_g_ot6c_a2'), nextStep);
        }, vg, true);
      addButton(t('c4_g_ot4b_a1'), stand);
      addButton(t('c4_g_ot4b_a2'), stand);
    };
    const letters = () => {
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_g_ot5', { bv: v.bv, s: bold('s'), ww: bold('w'),
          wsb: bold(nw('w + s = B')) }) + '</p>');
      stage(pic0());
      addButton(t('c4_g_ot_btn1'), halve);
    };
    addButton(t('c4_g_ot1_a1'), letters);
    addButton(t('c4_g_ot1_a2'), letters);
  },

  // ...and the L it makes, read the way this chapter has read every L since Part C.
  function gOtherL() {
    const H = fH(), G = fG();
    const v = { g: bold('g'), hl: bold('h'), ww: bold('w'), s: bold('s'), bl: bold('B'),
      cv: bold(areaLabel(FF.C)), hv: bold(lenLabel(H)), qm: bold('?'),
      hq: bold(nw('h = ' + fmtNum(H))), weq: bold(nw('w + ? = h')),
      a1: bold(areaLabel(H * H)), a3: bold(areaLabel(H * H - FF.C)),
      // ⚠️ NEITHER equation carries its answer: each is printed beside the box asking for it.
      sqeq: bold(nw('h² = h &times; h = ' + fmtNum(H) + ' &times; ' + fmtNum(H))),
      ceq: bold(nw(fmtNum(H * H) + ' &minus; ' + fmtNum(FF.C))),
      geq: bold(nw('g = ' + sqrtHTML(nw(fmtNum(H) + ' &times; ' + fmtNum(H) +
        ' &minus; ' + fmtNum(FF.C))))) };
    // ⚠️ EVERY MEASUREMENT FROM BEFORE THE MOVE IS STILL THERE (Sylvain), so nothing has
    // to be taken on trust about what did and did not change when the piece walked round —
    // the `h` stood up the left, the red line carried across at `h`, the red halfway mark
    // down the middle of `B`, and gSideBars' four rows underneath.
    // Then the one new length — the L's own bottom side — is ASKED for rather than drawn:
    // it runs [7, 12], which is 5, and the two `h` halves are sitting right underneath it
    // at the same width, so it is settleable by looking.
    // ⚠️ NOT waved through, and `w` comes FIRST so the row cannot be got by taking the
    // first thing — the same rule the two-field question follows.
    choose(lead(t('c4_g_ot7', v) + PARA + t('c4_g_ot_bs_q', v)),
      () => gLPlot(bold('?')), ['c4_g_ot_bs_w', 'c4_g_ot_bs_h'], 1, 'c4_g_ot_bs_no',
      fillIt, { ww: v.ww, hv: v.hv });

    // ⚠️ THE L IS FILLED IN BEFORE ITS SQUARE IS MEASURED (Sylvain, 2026-09-07), and the
    // child is asked first. Until this screen the corner has been a hole — honest, since
    // that ground really is missing — but a question about "the big square's area" is a
    // question about ground that has to be there to be counted. So the hole is closed, on
    // the child's own say-so, and it stays closed for the rest of Part G.
    // ⚠️ Both buttons fill it: Eliel is proposing, not testing, and a question that accepts
    // only one answer teaches that he was not really asking.
    function fillIt() {
      clearGame(); showEliel();
      tell(t('c4_g_ot_bs_ok', v) + PARA + t('c4_g_ot_fl1', v));
      stage(gLPlot(bold('h')));
      addButton(t('c4_g_ot_fl_a1'), area1);
      addButton(t('c4_g_ot_fl_a2'), area1);
    }

    // ⚠️ THE THREE AREAS ARE ASKED, NOT STATED, AND EACH LIGHTS ITS OWN GROUND (Sylvain,
    // 2026-09-07). They follow from what the child has just settled — but following is not
    // the same as being seen, and the whole point of the sequence is which piece of ground
    // each number belongs to. So the big square, the L inside it, and the corner left over
    // are lit one at a time while everything else fades, on a picture that is otherwise
    // identical throughout.
    // ⚠️ The `21 magic squares` caption is OFF for the first two: on the second it IS the
    // answer, printed above the box asking for it. It arrives with the third question, where
    // it is the number being subtracted (lesson 17).
    function area1() {
      clearGame(); showEliel();
      askWithLead(t('c4_g_ot_ar_l1', v), t('c4_g_ot_ar_q1', v), H * H, area2,
        t('c4_g_ot_ar_h1'));
      stage(gLPlot(bold('h'), null, { area: null, fillCorner: true,
        focus: ['L', 'corner'] }));
    }
    function area2() {
      clearGame(); showEliel();
      askWithLead(t('c4_g_ot_ar_ok1', v), t('c4_g_ot_ar_q2', v), FF.C, area3,
        t('c4_g_ot_ar_h2'));
      stage(gLPlot(bold('h'), null, { area: null, fillCorner: true, focus: ['L'] }));
    }
    function area3() {
      clearGame(); showEliel();
      askWithLead(t('c4_g_ot_ar_ok2', v), t('c4_g_ot_ar_q3', v), H * H - FF.C, corner1,
        t('c4_g_ot_ar_h3'));
      stage(gLPlot(bold('h'), null, { fillCorner: true, focus: ['corner'] }));
    }

    // ⚠️ IS THE CORNER EVEN A SQUARE? (Sylvain, 2026-09-07.) The big square's area and the
    // corner's both follow from what the child has just settled, so they are STATED — and
    // then the one thing that does not follow gets three screens. Its bottom side is `g` by
    // construction (we cut it that way), but nothing so far says its vertical side is, and
    // without that there is no root to take.
    // ⚠️ Each vertical measure is on the picture from the START of the screen that asks
    // about it, carrying `?` until the answer lands — lesson 17, on a bracket.
    function corner1() {
      // ⚠️ `h - g` is 3 as well, so it names the same length as `w` and is accepted too:
      // refusing a right answer would be worse than the alternative.
      choose(lead(t('c4_g_ot_cn1', v) + PARA + t('c4_g_ot_cn_q', v)),
        () => gLPlot(bold('h'), [gRightW(bold('?'))], { fillCorner: true }),
        ['h', 'B', 's', 'w', 'g', 's - g', 'h - g'], [3, 6], 'c4_g_ot_cn_no', corner2,
        v, true);
    }
    // ⚠️ And `h - w` is 2, which is `g` — accepted for the same reason, and it is in fact
    // the very subtraction the sentence above the buttons writes out.
    function corner2() {
      choose(lead(t('c4_g_ot_cn_ok', v) + PARA + t('c4_g_ot_cn2_q', v)),
        () => gLPlot(bold('h'), [gRightW(bold('w')), gRightG(bold('?'))],
          { fillCorner: true }),
        ['h', 's', 'g', 'B/2', '5', 'w', 'h - w'], [2, 6], 'c4_g_ot_cn2_no', corner3,
        v, true);
    }
    // Both sides `g`, so it IS a square — and only now may its area be rooted.
    function corner3() {
      clearGame(); showEliel();
      askWithLead(t('c4_g_ot_cn2_ok', v), t('c4_g_sv_q4', v), G, nextStep,
        t('c4_g_sv_h4'));
      stage(gLPlot(bold('h'), gRight(),
        { fillCorner: true, corner: bold(nw('g &times; g')) }));
    }
  },

  // ⚠️ THE SOLVE TAKES STOCK FIRST (Sylvain, 2026-09-07): the two lengths are in hand, so
  // what is left is not arithmetic but the CHOICE of what to do with them — and that is put
  // to the child as three formulas rather than performed. The picture never changes under
  // the three screens; only the sentence does.
  function gSolve7() {
    const H = fH(), G = fG(), S = FF.B - FF.s;
    const v = { g: bold('g'), hl: bold('h'), s: bold('s'), bl: bold('B'),
      heq: bold(nw('h = B/2 = ' + fmtNum(H))),
      geq2: bold(nw('g = ' + sqrtHTML(nw(fmtNum(H * H) + ' &minus; ' + fmtNum(FF.C))) +
        ' = ' + sqrtHTML(fmtNum(H * H - FF.C)) + ' = ' + fmtNum(G))),
      seq: bold(nw('s = h + g')), seq7: bold(nw('s = ' + fmtNum(S))) };
    const pic = () => gLPlot(bold('h'), gRight(),
      { fillCorner: true, corner: bold(nw('g &times; g')) });
    // ⚠️ Only `h + g` is right: `h - g` is 3 and `w + g` is 5, which is `h` itself. And it
    // goes LAST, so the row cannot be got by taking the first thing.
    choose(lead(t('c4_g_ot10', v) + PARA + t('c4_g_sv_q1', v)), pic,
      ['h - g', 'w + g', 'h + g'], 2, 'c4_g_sv_no', () => {
        clearGame(); showEliel();
        askWithLead(t('c4_g_sv_ok5', v), t('c4_g_sv_q5', v), S, () => {
          clearGame(); showEliel();
          // ⚠️ The two fields have now been solved by the same trick with opposite signs,
          // so this is the first moment the `±` can be said to be FOR something rather than
          // merely explained. Written with the signed letters, because that is the line
          // `gLine` wrote and the one `gSum` is about to close on.
          const rt = bold(sqrtHTML(nw(fracHTML(BTIL, '2') + ' &times; ' +
            fracHTML(BTIL, '2') + ' &minus; ' + CTIL)));
          storyHTML(lead(t('c4_g_sv_ok', v) + PARA +
            t('c4_g_sv_pm', { pm: bold('&plusmn;'), rt: rt })));
          stage(pic());
          addButton(t('btn_continue'), nextStep);
        }, t('c4_g_sv_h5'));
        stage(pic());
      }, v, true);
  },

  // ⚠️ THE SUMMARY GETS ITS OWN STEP, and it is drawn on BOTH fields, because it is a
  // statement about both. Sylvain wrote it into the lead-in of the derivation; there it
  // would have pre-empted the cut, the walk, the L and the corner, all of which follow.
  function gSum() {
    clearGame(); showEliel();
    // ⚠️ THE SIGNED LETTERS (Sylvain, 2026-08-28), so the line Part G closes on is literally
    // `gLine`'s. Stacked, the way `fRule` and `hSchool` write it, so it is already in the
    // shape the schoolbook one arrives in two parts later.
    // ⚠️ And that puts a MINUS in front of the half. On this field `B̃ = −B = −10`, so
    // `−B̃/2 = 5 = h` — which is exactly what the child worked out in `gTwo`, question three.
    // Writing `s = B̃/2 ± …` would be off by a sign, and `h × h` is unaffected because
    // `(−5) × (−5) = 25` either way.
    const half = fracHTML(BTIL, '2');
    const disc = sqrtHTML(nw(half + ' &times; ' + half + ' &minus; ' + CTIL));
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_g_ot12', { hv: bold(lenLabel(fH())), cv: bold(areaLabel(FF.C)),
        g: bold('g'), hb: bold(nw('B/2 = h')), gsq: bold(nw('g &times; g')),
        geq: bold(nw('g = ' + sqrtHTML(nw('h &times; h &minus; ' +
          fmtNum(FF.C))) + ' = ' + disc)) }) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_g_ot13', { g: bold('g'), bl: bold('B'),
        seq1: bold(nw('s = h &minus; g')), seq2: bold(nw('s = h + g')) }) + '</p>' +
      '<p style="margin-top:16px; text-align:center; font-size:21px">' +
        bold(nw('s = h &plusmn; g = &minus;' + half + ' &plusmn; ' + disc)) + '</p>');
    // ⚠️ THE PLOTS WEAR THE SIGNED LETTERS HERE (Sylvain, 2026-08-28), so the picture and
    // the line above it name the same two numbers. `B̃ = −10` labels a bracket spanning a
    // strip that is really 10 long — which is the one place in the chapter that is allowed,
    // because this screen IS the mapping, and `gOne` and `gTwo` have both said where the
    // dash comes from. On those two screens the ground keeps its true figures instead.
    stage(gBothFieldsEl(undefined, {
      cLabel: bold(nw(CTIL + ' = ' + fmtNum(FF.C))),
      bLabel: bold(nw(BTIL + ' = &minus;' + fmtNum(FF.B))) }));
    addButton(t('btn_continue'), nextStep);
  },

  // -------------------------------------------------------------------------
  // PART H — THE EXPERIMENT (Sylvain, 2026-08-25): the material D1 set aside for
  // Chapter 5 (deck p23-25), fitted back on to see what it costs.
  //
  // The field was BUILT in stages: a little square of side s, made three times as
  // wide, then a rectangle of 21 laid against it, the strip 10 long. So
  //     (3s) x (3s) + 21 = 10 x (3s)
  // which is Part F's own line with 3s where s was. Name it S, solve the line we
  // already have, divide by 3.

  // ⚠️ THIS IS THE SUBSTITUTION HALF ONLY. The deck's p25 goes on to a = A x A,
  // b = A x B, c = C and the schoolbook (-b +- sqrt(b^2-4ac))/2a — which needs 900
  // and 756, a root of 144, a division by 18 and the fraction 7/3, none of which
  // this trilogy has built. See ../ch4_numbers.py's D1 note. Whether that half
  // belongs here is exactly what this experiment is for.
  // -------------------------------------------------------------------------

  // ⚠️⚠️ THE OTHER HALF OF THE EXPERIMENT — deck p25, the schoolbook formula. Built so
  // that D1 can be judged on what it actually reads like rather than on an estimate.
  // What it needs that nothing in this trilogy has built: 9 x 100 = 900, 4 x 9 x 21 = 756,
  // a subtraction in the hundreds, the root of 144, a division by 18, and the fraction 7/3.
  // Read it and decide.
  // ⚠️ THE SCHOOL FORM, RUN A PIECE AT A TIME (Sylvain, 2026-08-28). It used to state
  // `a = 9, b = −30, c = 21` and then ask two questions; now the child reads all three off
  // `Ã`, `B̃`, `C̃` and watches them drop into BOTH lines — the school equation and the school
  // formula — before solving it term by term. Same shape as `gNeg` and `gTwo`, one part on.
  function hSchool() {
    clearGame(); showEliel();
    const At = 3, Bt = -FF.B, Ct = FF.C;          // the substitution's own three numbers
    const av = At * At, bv = At * Bt, cv = Ct;    // ...and the school ones that come off them
    const bb = bv * bv, fac = 4 * av * cv, disc = bb - fac, rt = Math.sqrt(disc), twoa = 2 * av;
    const m = '&minus;', neg = n => m + fmtNum(Math.abs(n));
    const sg = n => (n < 0 ? ' ' + m + ' ' : ' + ') + fmtNum(Math.abs(n));
    const k = { a: false, b: false, c: false };
    const A = () => k.a ? fmtNum(av) : 'a', B = () => k.b ? null : 'b', C = () => k.c ? null : 'c';
    // the school equation, filling in
    const eqn = () => bold(nw((k.a ? fmtNum(av) : 'a') + ' &times; s&sup2;' +
      (k.b ? sg(bv) : ' + b') + ' &times; s' + (k.c ? sg(cv) : ' + c') + ' = 0'));
    // ...and the school formula, filling in with it
    const frm = () => {
      const bt = k.b ? nw('(' + neg(bv) + ')') : 'b';
      const at = k.a ? fmtNum(av) : 'a';
      const ct = k.c ? fmtNum(cv) : 'c';
      return bold(nw('s = ' + fracHTML(nw(m + bt + ' &plusmn; ' +
        sqrtHTML(nw(bt + ' &times; ' + bt + ' ' + m + ' 4 &times; ' + at + ' &times; ' + ct))),
        nw('2 &times; ' + at))));
    };
    const pic = () => {
      const w = document.createElement('div');
      const line = (h, css) => { const p = document.createElement('p');
        p.style.cssText = 'text-align:center; ' + css; p.innerHTML = h; w.appendChild(p); };
      line(eqn(), 'font-size:19px; margin:4px 0 0');
      line(frm(), 'font-size:19px; margin:18px 0 0; color:#a3364a');
      w.appendChild(stripFieldEl({ sv: 3, px: 34, inner: 1, sTop: bold('s'),
        cLabel: bold(fmtNum(FF.C)),
        labels: { s: bold(nw('S = 3 &times; s')) } }));
      return w;
    };
    const V = { at: bold(ATIL), bt: bold(BTIL), ct: bold(CTIL),
      a: bold('a'), b: bold('b'), c: bold('c'),
      aeq: bold(nw('a = ' + ATIL + ' &times; ' + ATIL)),
      beq: bold(nw('b = ' + ATIL + ' &times; ' + BTIL)),
      ceq: bold(nw('c = ' + CTIL)) };
    const ASKS = [
      { q: 'c4_h_sc_qa', h: 'c4_h_sc_ha', n: av, set: 'a' },
      { q: 'c4_h_sc_qb', h: 'c4_h_sc_hb', n: bv, set: 'b' },
      { q: 'c4_h_sc_qc', h: 'c4_h_sc_hc', n: cv, set: 'c' }
    ];
    let i = 0;
    // ⚠️ A FLAT LIST OF BEATS, not nested callbacks. Six `step(...)` deep is exactly where
    // the last paren goes missing — this file has done it once already — and the chain reads
    // as a list of questions, which is what it is.
    const solve = () => {
      const bx = bold(nw('b &times; b')), fx = bold(nw('4 &times; a &times; c')),
        tx = bold(nw('2 &times; a')),
        dx = bold(nw('b &times; b ' + m + ' 4 &times; a &times; c')),
        rx = bold(nw('(30 ' + m + ' 12) &divide; 18'));
      const BEATS = [
        [t('c4_h_sc_qbb', { bb: bx }), bb, t('c4_h_sc_hbb')],
        [t('c4_h_sc_qfac', { fac: fx }), fac, t('c4_h_sc_hfac')],
        [t('c4_h_sc_q1', { disc: dx }), disc, t('c4_h_sc_h1')],
        [t('c4_h_sc_q2', { n: bold(fmtNum(disc)) }), rt, t('c4_h_sc_h2')],
        [t('c4_h_sc_q2a', { twoa: tx }), twoa, t('c4_h_sc_h2a')],
        [t('c4_h_sc_qr', { r: rx }), 1, t('c4_h_sc_hr')]
      ];
      let j = 0;
      const beat = () => {
        clearGame(); showEliel(); stage(pic());
        if (j === BEATS.length) {
          storyHTML('<div class="speaker">Eliel</div>' +
            '<p>' + t('c4_h_sc_ok', {
              r1: bold(nw('(30 + 12) &divide; 18')), r2: rx,
              simp: bold(nw('42 &divide; 18 = ' + fracHTML('7', '3') + ', 18 &divide; 18 = 1')),
              one: bold('s = 1') }) + '</p>' +
            '<p style="margin-top:10px">' + t('c4_h_sc3b') + '</p>');
          addButton(t('btn_continue'), nextStep);
          return;
        }
        const [q, n, h] = BEATS[j++];
        askAfterButton(q, n, beat, h);
      };
      beat();
    };
    const run = () => {
      const q = ASKS[i];
      clearGame(); showEliel(); stage(pic());
      askAfterButton(t(q.q, V), q.n, () => {
        k[q.set] = true; i++;
        if (i < ASKS.length) run(); else { clearGame(); showEliel(); stage(pic()); solve(); }
      }, t(q.h, V));
    };
    // the intro, then the walk
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_h_sc1') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_h_sc2', {
        as: bold(nw(ATIL + ' &times; s')),
        expand: bold(nw(ATIL + ' &times; ' + ATIL + ' &times; s &times; s + ' + ATIL +
          ' &times; ' + BTIL + ' &times; s + ' + CTIL + ' = 0')),
        abc: bold(nw('a = ' + ATIL + ' &times; ' + ATIL + ', b = ' + ATIL + ' &times; ' +
          BTIL + ', c = ' + CTIL)) }) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_h_sc_way', {
        eq: bold(nw('a &times; s&sup2; + b &times; s + c = 0')) }) + '</p>' +
      '<p style="margin-top:10px">' + t('c4_h_sc_form') + '</p>' +
      '<p style="margin-top:14px; text-align:center; font-size:19px">' + frm() + '</p>' +
      '<p style="margin-top:14px">' + t('c4_h_sc_check') + '</p>');
    addButton(t('btn_continue'), run);
  },

  function gEnd() {
    clearGame(); showEliel();
    storyHTML('<div class="speaker">Eliel</div>' +

      gEndRules() +
