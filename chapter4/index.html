    // ⚠️ `correctIdx` may be an ARRAY (2026-09-06): on `fSquares`' third question four of the
    // six labels name the SAME length (s + g = h = B/2 = 5), and refusing a child who answers
    // `h` would be refusing a right answer. A number behaves exactly as it always did.
    const ok = Array.isArray(correctIdx) ? correctIdx : [correctIdx];
    labels.forEach((lbl, i) => addButton(raw ? lbl : t(lbl), () => {
      if (ok.indexOf(i) >= 0) return onCorrect();
      missed = true;
      storyHTML('<div class="speaker">Eliel</div><p>' + t(wrongKey, vars || {
        three: bold(lenLabel(3)), seven: bold(lenLabel(7)) }) + '</p>');
      setTimeout(ask, 1900);
    }));
  };
  ask();
}

function lead(html) { return '<div class="speaker">Eliel</div><p>' + html + '</p>'; }
function tell(html) { storyHTML(lead(html)); }

// ---------------------------------------------------------------------------
// THE PICTURE — one L-shaped field, and every screen of Part A draws it
// ---------------------------------------------------------------------------
// Built concretely for this part rather than generalised in advance. `tenthGrid`,
// `lengthSVG` and `pieceRow` all earned their shape by being written for one use and
// extracted on the second; this one will do the same when Part C needs it.
//
// Geometry, y measured DOWN from the top-left of the bounding square:
//     arm   (0,  0,  S,  Bp)      the standing rectangle, B long and s across
//     sq    (0,  Bp, S,  S )      the square, s by s
//     foot  (S,  Bp, Bp, S )      the lying rectangle, B long and s across
//     corner(S,  0,  Bp, Bp)      NOT field: the notch, B by B
function lFieldEl(o) {
  o = o || {};
  // ⚠️ `o.sv` overrides the side. The area-68 field's `s` is `\u221a93 \u2212 5` and is stored as
  // null, so the one screen that draws it (the school-form sweep) hands over the number.
  // ⚠️ `o.sv` / `o.bv` override the side and the notch. The closing set of eight fields is
  // not in L_FIELDS at all — it is drawn from its own numbers — so both have to be passable.
  const s = o.sv === undefined ? FIELD.s : o.sv,
        B = o.bv === undefined ? FIELD.B : o.bv, px = o.px || PX;
  const S = s * px, Bp = B * px, W = S + Bp;
  const focus = o.focus === undefined ? null
    : (Array.isArray(o.focus) ? o.focus : [o.focus]);
  // ⚠️ ONE padL FOR THE WHOLE OF PART C, whether a screen draws the outer bracket or not.
  // A gutter that grows only on the screens that need it slides the field sideways between
  // two consecutive views of the same ground — the defect Chapter 2 had to fix once and
  // Chapter 3 wrote down twice.
  const padL = o.padL === undefined ? (o.brackets ? (o.outer ? 210 : 112) : 0) : o.padL;
  const padB = o.padB === undefined ? (o.brackets ? (o.outer ? 92 : 46) : 0) : o.padB;
  const M = 14;                        // room for the fence, which is drawn OUTSIDE

  const stage = document.createElement('div');
  stage.style.cssText = 'position:relative; margin:10px auto 0;' +
    'width:' + (padL + W + M) + 'px; height:' + (M + W + padB) + 'px;';
  const OX = padL, OY = M;
  const put = (css, cls) => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.style.cssText = 'position:absolute;' + css;
    stage.appendChild(d);
    return d;
  };
  const box = (x, y, w, h, css) =>
    put('left:' + (OX + x) + 'px; top:' + (OY + y) + 'px;' +
        'width:' + w + 'px; height:' + h + 'px; box-sizing:border-box;' + css);

  const GEO = {
    arm:  [0, 0,  S,  Bp],
    sq:   [0, Bp, S,  S ],
    foot: [S, Bp, Bp, S ],
  };

  // The completing corner, when it is wanted. Drawn FIRST so the field's own outline
  // paints over its edge rather than under it.
  if (o.corner) {
    const solid = o.corner === 'solid';
    const cb = box(S, 0, Bp, Bp, 'background:' + (solid ? '#dfe9f5' : 'transparent') + ';' +
      (solid ? 'outline:2px solid #6f86a8; outline-offset:0;' : GHOST) + ' z-index:1;');
    // ⚠️ `o.onCorner` makes the bite CLICKABLE — the child picks the ground that would finish
    // the square rather than pressing a button that says so. A generous overlay, on the same
    // principle as Part A's hit strip: the difficulty must never be motor.
    if (o.onCorner) {
      const hit = box(S - 8, -8, Bp + 16, Bp + 16, 'z-index:9; cursor:pointer;');
    hit.id = 'notch-hit';   // walkcheck.js's hook: this step advances on a click, not a button
      hit.addEventListener('click', o.onCorner);
    }
    if (o.cornerLabel) {
      const c = put('left:' + (OX + S) + 'px; top:' + (OY + Bp / 2 - 14) + 'px;' +
        'width:' + Bp + 'px; text-align:center; font-size:16px; color:#2f5d9e; z-index:6;');
      c.innerHTML = o.cornerLabel;
    }
  }
  // The completing square as one shape — drawn round BOTH the field and the corner, which
  // is the only thing on the screen that says they are now one square.
  if (o.bigOutline) box(0, 0, W, W,
    'outline:4px solid #2f5d9e; outline-offset:3px; z-index:7; pointer-events:none;');

  // The three pieces. Each is its own colour when the picture is showing pieces, and
  // plain field-coloured when it is not — a screen about the SHAPE should not be
  // carrying a decomposition the child has not been shown yet.
  Object.keys(GEO).forEach(k => {
    const [x, y, w, h] = GEO[k];
    const lit = !focus || focus.indexOf(k) >= 0;
    box(x, y, w, h,
      'background:' + (o.pieces ? PIECE[k].fill : '#f4f0e4') + ';' +
      (o.pieces ? 'outline:1.5px solid ' + PIECE[k].ink + '; outline-offset:-1px;' : '') +
      'opacity:' + (lit ? 1 : 0.28) + '; z-index:2;');
  });

  // THE LEFTOVER BORDER — hatched while it is ground nobody could cover, and in its own
  // three colours once the chapter starts counting it.
  if (o.border) {
    const BP = borderPieces();
    Object.keys(BP).forEach(k => {
      const [x, y, w2, h] = BP[k].r;
      if (w2 <= 0 || h <= 0) return;             // a whole-sided field has no border at all
      const lit = !o.borderFocus || o.borderFocus === k ||
        (Array.isArray(o.borderFocus) && o.borderFocus.indexOf(k) >= 0);
      if (o.border === 'plots') return;           // drawn below, as planted ground
      const paint = o.border === 'colour'
        ? 'background:' + BP[k].fill + ';' +
          (o.hundredths ? 'background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px ' +
            (px / 10) + 'px),repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px ' +
            (px / 10) + 'px);' : '')
        : HATCH;
      box(x * px, y * px, w2 * px, h * px, paint +
        'outline:2px solid ' + (o.border === 'colour' ? BP[k].ink : '#c98a2a') + ';' +
        'outline-offset:-1px; opacity:' + (lit ? 1 : 0.25) + '; z-index:3;');
    });
  }

  // The border carved into Marimon's plots: planted ground, one seed to a plot, a solid cut
  // between plots — and the quarter that will not make a tenth one left BARE, because that
  // is the thing the closing question is about.
  if (o.border === 'plots') {
    const PL = borderPlots(), BP = borderPieces();
    // ⚠️ THE FLOWER SQUARES STAY VISIBLE UNDERNEATH (Sylvain). The border keeps its
    // hundredth ruling and each plot is laid over it in a TRANSLUCENT colour, which is
    // Chapter 2's own rule for exactly this picture: "a plot they cannot see into is just
    // a coloured blob". The child can still count what a hundred hundredths looks like.
    const rules = 'background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,' +
      'transparent 1px ' + (px / 10) + 'px),repeating-linear-gradient(0deg,' +
      'rgba(0,0,0,.16) 0 1px,transparent 1px ' + (px / 10) + 'px);';
    Object.keys(BP).forEach(k => {
      const [x, y, w2, h] = BP[k].r;
      if (w2 > 0 && h > 0) box(x * px, y * px, w2 * px, h * px,
        'background:#fdf8ec;' + rules + 'z-index:3;');
    });
    // one SVG for the carve, so a plot that bends is outlined with ONE stroke and no seam
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', W); svg.setAttribute('height', W);
    svg.style.cssText = 'position:absolute; left:' + OX + 'px; top:' + OY + 'px;' +
      'z-index:4; pointer-events:none; overflow:visible;';
    PL.patches.forEach((rects, i) => {
      const pa = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pa.setAttribute('d', plotPath(rects, px));
      pa.setAttribute('fill', PLOTCOL[i % PLOTCOL.length]);
      pa.setAttribute('fill-opacity', '0.72');
      pa.setAttribute('stroke', PLOTINK[i % PLOTINK.length]);
      pa.setAttribute('stroke-width', '3');
      pa.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(pa);
    });
    stage.appendChild(svg);
    // the quarter that will not make a tenth plot: no colour at all, and a dashed edge.
    // Bare IS the answer to the closing question, so it must not be dressed up.
    if (PL.leftover) {
      const [x, y, w2, h] = PL.leftover;
      // ⚠️ When the flowers go in, one seed to a FLOWER SQUARE — a radial tile exactly one
      // hundredth across, so all twenty-five arrive for one background layer rather than
      // twenty-five nodes. Chapter 2 did the same for its 494. The tiling starts at 0 like
      // the rules do, so every dot lands in the middle of its own little square.
      box(x * px, y * px, w2 * px, h * px,
        (o.flowers
          ? 'background-image:radial-gradient(circle at 50% 50%,#555 1.5px,transparent 1.6px);' +
            'background-size:' + (px / 10) + 'px ' + (px / 10) + 'px;'
          : '') +
        'outline:2px dashed #b5452f; outline-offset:-2px; z-index:5;');
    }
    // ⚠️ The seed is matched BY HAND to .field-cell.filled::after — 24px, #555 — so the
    // trees on the plots and the trees in the whole magic squares cannot drift apart.
    // Chapter 2 had to fix exactly that, and Chapter 3 again.
    PL.seeds.forEach(([sx, sy]) => {
      const d = put('left:' + (OX + sx * px - 10) + 'px; top:' + (OY + sy * px - 18) + 'px;' +
        'width:20px; height:24px; line-height:24px; text-align:center; font-size:24px;' +
        'color:#555; z-index:6; pointer-events:none;');
      d.textContent = '\u00b7';
    });
  }

  // ⚠️ When a covering is drawn ON TOP of the pieces, their fills and their outlines are
  // both hidden by it — so the three-piece decomposition simply vanishes on exactly the
  // screens that are about it. Each piece therefore gets its edge redrawn above the
  // squares, dimming with its own region. (Chapter 2's own rule for its magic-square
  // rules: the layer that has to be counted paints last.)
  if (o.pieces && o.cells) {
    Object.keys(GEO).forEach(k => {
      const [x, y, w2, h] = GEO[k];
      const lit = !focus || focus.indexOf(k) >= 0;
      box(x, y, w2, h, 'outline:2px solid ' + PIECE[k].ink + '; outline-offset:-1px;' +
        'opacity:' + (lit ? 1 : 0.28) + '; z-index:4; pointer-events:none;');
    });
  }

  // The outline of the whole L, as ONE path: six sides, drawn as four boxes' worth of
  // edge. ⚠️ It has to read as one field however the inside is coloured — Chapter 2's
  // lesson 21, from the screen where Marimon's bent patch read as two rectangles.
  const bar = (x, y, w, h) =>
    box(x, y, w, h, 'background:#3a3a3a; z-index:5;');
  const T = 3;
  bar(-T, -T, S + 2 * T, T);            // top of the arm
  bar(-T, -T, T, W + 2 * T);            // the whole left side
  bar(-T, W, W + 2 * T, T);             // the whole bottom
  bar(W, Bp - T, T, W - Bp + 2 * T);    // the right side of the foot
  bar(S, Bp - T, W - S + T, T);         // the notch, lying
  bar(S, -T, T, Bp + T);                // the notch, standing

  // The FIELD's area, on the field itself — centred in the foot, which is unambiguously
  // part of the L. ⚠️ It used to sit in the elbow, and once Part C fills the corner in and
  // outlines the big square that position reads as the foot's own label, or worse as the
  // big square's. A caption has to be inside the thing it is captioning.
  if (o.area) {
    const cap = put('left:' + (OX + S) + 'px; top:' + (OY + Bp + S / 2 - 11) + 'px;' +
      'width:' + Bp + 'px; font-size:15px; color:#5a5240; text-align:center; z-index:6;');
    cap.innerHTML = o.area;
  }
  // The COMPLETING SQUARE's area is a different quantity and gets a different place:
  // the middle of the big square, where it can only mean the big square.
  if (o.areaBig) {
    const cap = put('left:' + OX + 'px; top:' + (OY + W / 2 - 12) + 'px;' +
      'width:' + W + 'px; font-size:17px; color:#2f5d9e; text-align:center; z-index:8;');
    cap.innerHTML = o.areaBig;
  }

  // Per-piece captions, for the screen that names the three.
  if (o.names) {
    Object.keys(GEO).forEach(k => {
      if (focus && focus.indexOf(k) < 0) return;
      const [x, y, w, h] = GEO[k];
      const c = put('left:' + (OX + x) + 'px; top:' + (OY + y + h / 2 - 11) + 'px;' +
        'width:' + w + 'px; font-size:14px; text-align:center; z-index:6;' +
        'color:' + PIECE[k].ink + '; font-weight:bold;');
      c.textContent = t(PIECE[k].lbl);
    });
  }

  // BRACKETS. Left side: B on top, s underneath. Bottom: s on the left, B on the right.
  // Chapter 2's own side mark-up, and the labels carry their UNIT — a "?" stands for a
  // quantity of something, never for a bare number (Ch2's tallyView rule).
  if (o.brackets) {
    const L = o.labels || {};
    const vb = (y, h, txt, col) => {
      const bx = OX - 16;
      put('left:' + bx + 'px; top:' + (OY + y) + 'px; width:11px; height:' + h + 'px;' +
        'box-sizing:border-box; border:3px solid ' + col + '; border-right:none; z-index:6;');
      const lab = put('left:' + (OX - padL) + 'px; top:' + (OY + y + h / 2 - 12) + 'px;' +
        'width:' + (padL - 26) + 'px; text-align:right; font-size:15px; z-index:6;' +
        'color:' + col + ';');
      lab.innerHTML = txt;
    };
    const hb = (x, w, txt, col) => {
      const by = OY + W + 14;
      put('left:' + (OX + x) + 'px; top:' + by + 'px; width:' + w + 'px; height:11px;' +
        'box-sizing:border-box; border:3px solid ' + col + '; border-top:none; z-index:6;');
      const lab = put('left:' + (OX + x) + 'px; top:' + (by + 15) + 'px; width:' + w + 'px;' +
        'text-align:center; font-size:15px; z-index:6; color:' + col + ';');
      lab.innerHTML = txt;
    };
    vb(0, Bp, L.b || bold(fmtNum(B)), PIECE.arm.ink);
    vb(Bp, S, L.s || bold('s'), PIECE.sq.ink);
    hb(0, S, L.s || bold('s'), PIECE.sq.ink);
    hb(S, Bp, L.b || bold(fmtNum(B)), PIECE.foot.ink);
    // THE OUTER RANK: the whole side of the completing square, `s + B`. It is the bracket
    // Part C turns on, because the trick is that this one length is both `s + B` — which
    // holds the thing we want — and the square root of an area we can work out.
    if (o.outer) {
      const bx = OX - 110, col = '#3a3a3a';
      put('left:' + bx + 'px; top:' + OY + 'px; width:11px; height:' + W + 'px;' +
        'box-sizing:border-box; border:3px solid ' + col + '; border-right:none; z-index:6;');
      put('left:' + (OX - padL) + 'px; top:' + (OY + W / 2 - 12) + 'px;' +
        'width:' + (padL - 124) + 'px; text-align:right; font-size:16px; z-index:6;' +
        'color:' + col + ';').innerHTML = o.outer;
      const by = OY + W + 60;
      put('left:' + OX + 'px; top:' + by + 'px; width:' + W + 'px; height:11px;' +
        'box-sizing:border-box; border:3px solid ' + col + '; border-top:none; z-index:6;');
      put('left:' + OX + 'px; top:' + (by + 15) + 'px; width:' + W + 'px;' +
        'text-align:center; font-size:16px; z-index:6; color:' + col + ';').innerHTML = o.outer;
    }
  }

  // THE FENCE, coloured BY UNIT rather than by side — every stretch of length s in one
  // colour and every stretch of length B in the other, wherever it sits. That is Chapter
  // 2's Part C move (all the whole magic lengths orange, all the tenths purple), and it
  // is what makes "four of each" something to count rather than something to be told.
  if (o.wire) {
    const F = 7, G = 6;                       // thickness, and how far outside the edge
    const wb = (x, y, w, h, col) =>
      box(x, y, w, h, 'background:' + col + '; border-radius:2px; z-index:7;');
    // ⚠️ ONCE THE CORNER IS FILLED IN, THE FENCE MOVES OUT TO THE BIG SQUARE. Found by
    // rendering: the first version left the notch's two inner stretches running through
    // the middle of the completed square, and the big square's own top and right edges
    // bare — so the screen said "4 x 8 = 32", the perimeter of the SQUARE, over a picture
    // of the L's fence. A caption and its picture must agree (Ch2's lesson 22).
    // And the move is the screen's whole argument, drawn: the same eight pieces of wire,
    // FOUR of length s and FOUR of length B either way, just rearranged. The child can
    // count them again on the square and get the same two fours.
    if (o.corner === 'solid') {
      // every side of the big square is one s-stretch and one B-stretch
      wb(-T, -T - G - F, S + T, F, WIRE_S);   wb(S, -T - G - F, Bp + T, F, WIRE_B);
      wb(-T, W + T + G, S + T, F, WIRE_S);    wb(S, W + T + G, Bp + T, F, WIRE_B);
      wb(-T - G - F, -T, F, Bp + T, WIRE_B);  wb(-T - G - F, Bp, F, S + T, WIRE_S);
      wb(W + T + G, -T, F, Bp + T, WIRE_B);   wb(W + T + G, Bp, F, S + T, WIRE_S);
    } else {
      // left side: B on top, s below                     (one of each)
      wb(-T - G - F, -T, F, Bp + T, WIRE_B);
      wb(-T - G - F, Bp, F, S + T, WIRE_S);
      // bottom: s then B                                 (one of each)
      wb(-T, W + T + G, S + T, F, WIRE_S);
      wb(S, W + T + G, Bp + T, F, WIRE_B);
      // top of the arm: s                                (one s)
      wb(-T, -T - G - F, S + T, F, WIRE_S);
      // right of the foot: s                             (one s)
      wb(W + T + G, Bp, F, S + T, WIRE_S);
      // the notch, inside: B lying, B standing           (two Bs)
      wb(S, Bp - T - G - F, Bp + T, F, WIRE_B);
      wb(S + T + G, -T, F, Bp + T, WIRE_B);
    }
  }

  // The clickable covering. One magic square to a cell; the arm's rows are s wide and
  // the foot's rows are the full width, which is the decomposition the count then uses.
  // ⚠️ `prefilled` draws the SAME covering already done, and is not clickable — the screens
  // after the count are looking back at ground the child covered, not offering it again.
  // Without it they came up as a bare grid under a sentence saying the field was covered.
  if (o.cells) {
    // ⚠️ NEVER Math.round(s) HERE. It was left over from Part A, where s is a whole number
    // and rounding is harmless — on the area-26.25 field Math.round(1.5) is 2, so `total`
    // came to 36 on a picture holding 17 cells and onFull could never fire. The covering
    // finished, the question never came, and nothing threw: a screenshot shows a covered
    // field and a story panel that has not moved on, which reads as a pause rather than a
    // bug. Only driving the chapter finds it. (TODO.md lesson 27's cousin: derive from the
    // field, and derive it the same way everywhere — wholeCount() is the one source.)
    let filled = 0;
    const total = wholeCount();
    // ⚠️ A cell knows WHICH PIECE it sits in, so that the covering the child laid can be
    // focused the same way the pieces are. Without it the squares were drawn over the top
    // of the three regions at a flat opacity, and `focus` did nothing to them — so the
    // screen that asks "how many squares across the SQUARE part?" dimmed the region and
    // left all thirty-nine squares equally bright on top of it.
    const cellPiece = (cx, cy) => (cy < B ? 'arm' : (cx < s ? 'sq' : 'foot'));
    for (const [x0, y0, cw, ch] of wholeBlocks()) {
      for (let c = 0; c < cw; c++) for (let r = 0; r < ch; r++) {
        const cx = x0 + c, cy = y0 + r;
        const cell = document.createElement('div');
        cell.className = 'field-cell' + (o.prefilled ? ' filled' : '');
        const lit = !focus || focus.indexOf(cellPiece(cx, cy)) >= 0;
        cell.style.cssText = 'position:absolute; left:' + (OX + cx * px) + 'px;' +
          'top:' + (OY + cy * px) + 'px; width:' + px + 'px; height:' + px + 'px;' +
          'z-index:3; opacity:' + (lit ? 1 : 0.28) + ';' +
          'cursor:' + (o.prefilled ? 'default' : 'pointer') + ';';
        if (o.prefilled) { stage.appendChild(cell); continue; }
        let done = false;
        const fill = () => {
          if (done) return;
          done = true;
          cell.classList.add('filled');
          cell.style.cursor = 'default';   // a covered cell must stop LOOKING clickable
          if (o.consume) o.consume();
          if (++filled === total && o.onFull) o.onFull();
        };
        cell.addEventListener('click', fill);
        cell.addEventListener('dragover', e => e.preventDefault());
        cell.addEventListener('drop', e => { e.preventDefault(); fill(); });
        stage.appendChild(cell);
      }
    }
    // THE REFUSAL. On a field whose side is not whole there is a border left over that no
    // magic square will fit into, and the child has to MEET that rather than be told it —
    // Chapter 3's refused fifth square, and Chapter 2's refused fifth plot before it. The
    // click means "put the next one down", not "put it exactly here", so the target is the
    // whole picture and a generous margin: wherever they aim it, there is nowhere for it
    // to go. It re-arms rather than latching, so they may go on trying as long as they like.
    if (o.onRefused) {
      let over = null;
      const arm = () => {
        over = put('left:-24px; top:-24px; width:' + (padL + W + M + 48) + 'px;' +
          'height:' + (M + W + padB + 48) + 'px; z-index:8; cursor:pointer;' +
          'background:transparent;');
        over.addEventListener('click', () => { over.remove(); o.onRefused(); arm(); });
        over.addEventListener('dragover', e => e.preventDefault());
        // ⚠️ A refused square goes BACK IN THE HAND. Nothing lands on a refusal, so the
        // tray must not be touched — Chapter 3 shipped the opposite once and it punished
        // the child for trying the very thing the screen invites.
        over.addEventListener('drop', e => { e.preventDefault(); over.remove(); o.onRefused(); arm(); });
      };
      if (o.armed) arm(); else o.armRefusal = arm;
    }
  }
  return stage;
}

// The whole magic squares that fit, as two blocks — which is one formula for both fields
// rather than a special case each. They are pushed FLUSH with the top of the arm and the
// right of the foot, so what is left over is a border of width f along the left and the
// bottom with a little square where the two meet: the deck's own picture (p6), and the

// Both asserted in ../ch4_numbers.py.
function wholeBlocks() {
  const n = Math.floor(FIELD.s + 1e-9), f = FIELD.s - n, B = FIELD.B;
  return [[f, 0, n, n + B], [f + n, B, B, n]];
}

// The leftover border, in three pieces, in the deck's own colours (p6: the left strip
// yellow, the bottom strip green, the little corner red). The two strips are deliberately
// cut to be THE SAME SHAPE — f by (n+B) each — which is what lets the child compute one
// and read the other off it, exactly as the deck does.
function borderPieces() {
  const n = Math.floor(FIELD.s + 1e-9), f = FIELD.s - n, W = FIELD.big;

    corner: { r: [0, W - f, f, f], fill: '#f0b3a4', ink: '#a3452f' },

// MEASURING THE BORDER'S WIDTH — under the chapter's own magnifying glass (Sylvain,
// 2026-09-01), and on the TOP EDGE of the left strip, which is the one piece of it that runs
// horizontally and so can be laid against a ruler without turning anything.
//
// ⚠️ WHAT IS MEASURED IS A LINE, not a band. It was a thick bar before, which is how this
// project draws GROUND — and a thick bar being measured says we are after an area when we are
// after a length. So it is Chapter 1's own glyph: a spine with a tick at each end, and the
// tenths laid along it as ticked segments.
// ⚠️ The field stays exactly as the screens either side of it draw it, at PX, with the ring
// sitting on the very edge being magnified. Chapter 2's rule: the lens goes directly over its
// own ring, or it reads as an unrelated diagram.
function tenthLayEl(units, onFull) {
  const f = FIELD.s - Math.floor(FIELD.s);        // the strip's width, in magic lengths
  const Z = 320, T = Z / 10;                      // a magic length at lens scale, and a tenth
  const segW = f * Z;
  const FW = FIELD.big * PX + 14;                 // the field stage's own width
  // ⚠️ THE LENS SITS AS FAR LEFT AS IT WILL GO, over its own ring — which is at the field's
  // top-LEFT corner. Centred on the page it was 160px off to the right of the thing it
  // magnifies, and the cone then runs diagonally and reads as an arrow pointing elsewhere.
  // Chapter 3 wrote that down when it built its ladder; Chapter 2's rule is proximity.
  const RX = segW / 2 + 52, RY = 58;
  const LENSCX = RX + 16, LENSCY = 200;
  const CONE = 96;                                // from the lens down to the field
  const FTOP = LENSCY + RY + CONE;
  const NS = 'http://www.w3.org/2000/svg';
  const W = Math.max(FW, LENSCX - segW / 2 + Z + 20);

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; margin:10px auto 0; width:' + W + 'px;';
  const field = lFieldEl({ border: 'colour', borderFocus: 'left', cells: true,
    prefilled: true });
  field.style.margin = '0';
  field.style.position = 'absolute';
  field.style.left = ((W - FW) / 2) + 'px';
  field.style.top = FTOP + 'px';
  wrap.appendChild(field);
  const FH = parseFloat(field.style.height);
  wrap.style.height = (FTOP + FH + 10) + 'px';

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', FTOP + FH + 10);
  // ⚠️ `z-index:5`. `lFieldEl`'s own pieces carry z-index 2 and 3, and the field div sets up
  // no stacking context of its own — so they paint in the ROOT context and straight over a
  // later sibling with z-index auto. The ring came out as a half-arc sitting on the field's
  // top edge with its lower half swallowed.
  svg.style.cssText = 'position:absolute; left:0; top:0; overflow:visible; z-index:5;';
  const el = (n, at) => { const e = document.createElementNS(NS, n);
    Object.keys(at).forEach(k => e.setAttribute(k, at[k])); svg.appendChild(e); return e; };
  // ⚠️ Chapter 1's length glyph: a spine, and a tick at each end. Consecutive pieces share a
  // tick, so a row of them reads as one measured run — the geometry Chapter 2 had to copy
  // exactly when it borrowed this, because an inset tick leaves a gap at every join.
  const seg = (x1, x2, y, col, th) => {
    el('line', { x1: x1, y1: y, x2: x2, y2: y, stroke: col, 'stroke-width': th || 3 });
    [x1, x2].forEach(x => el('line', { x1: x, y1: y - 9, x2: x, y2: y + 9,
      stroke: col, 'stroke-width': th || 3 }));

  const text = (x, y, s2, col, size) => {
    const e = el('text', { x: x, y: y, 'text-anchor': 'middle', fill: col || '#5a5240',
      'font-size': size || 14, 'font-family': 'Georgia, serif', 'font-weight': 'bold' });
    e.textContent = s2; return e;

  // 1. THE RULER, at lens scale, ticked into its ten tenths — outside the lens, because it is
  //    a ruler we bring alongside and not a piece of this field.
  // ⚠️ The ruler is LEFT-ALIGNED with the segment in the lens, at the same scale — so its
  // tenth marks stand directly above the edge being measured and the two can be compared
  // by looking, which is the whole reason it is on the screen.
  const RX0 = LENSCX - segW / 2, RY0 = 52;
  seg(RX0, RX0 + Z, RY0, '#3a3a3a');
  for (let i = 1; i < 10; i++)
    el('line', { x1: RX0 + i * T, y1: RY0 - 6, x2: RX0 + i * T, y2: RY0 + 6,
      stroke: '#9a8f78', 'stroke-width': 2 });
  text(RX0 + Z / 2, RY0 + 30, t('c4_lbl_len_one').replace(/<[^>]+>/g, ''));

  // 2. THE RING, on the strip's top edge, and 3. THE CONE up to the lens
  const fx = (W - FW) / 2 + 14 + 0;               // lFieldEl's own OX inside its stage (M=14)
  const rcx = fx + (f * PX) / 2, rcy = FTOP + 14;

    rcx + rr, rcy, LENSCX + RX * 0.72, LENSCY].join(' '),
    fill: 'rgba(154,143,120,0.13)' });

  el('ellipse', { cx: LENSCX, cy: LENSCY, rx: RX, ry: RY,
    fill: '#fdfaf2', stroke: '#9a8f78', 'stroke-width': 3 });

  const laidG = document.createElementNS(NS, 'g'); svg.appendChild(laidG);
  const hit = el('rect', { x: SX - 8, y: SY - 22, width: segW + 16, height: 44,
    fill: 'transparent' });

  // the tray, and the laying — a click anywhere along the edge lays the NEXT one, never one
  // exactly where the finger landed (Chapter 2's hit strip, Chapter 3's carve)
  const supplyBox = document.createElement('div');
  let laid = 0;

    if (laid >= units) return;

    const ln = document.createElementNS(NS, 'line');

    ln.setAttribute('x2', x2); ln.setAttribute('y2', SY);
    ln.setAttribute('stroke', '#4a6f26'); ln.setAttribute('stroke-width', 6);
    g.appendChild(ln);
    [x1, x2].forEach(x => { const tk = document.createElementNS(NS, 'line');
      tk.setAttribute('x1', x); tk.setAttribute('y1', SY - 9);
      tk.setAttribute('x2', x); tk.setAttribute('y2', SY + 9);

    laidG.appendChild(g);

    if (left.length) left[left.length - 1].remove();
    if (++laid === units) { hit.style.cursor = 'default'; onFull(); }
  };
  hit.addEventListener('click', lay);
  hit.addEventListener('dragover', e => e.preventDefault());
  hit.addEventListener('drop', e => { e.preventDefault(); lay(); });

  const outer = document.createElement('div');
  outer.appendChild(wrap);
  const lbl = document.createElement('div');

  lbl.textContent = t('supply_tenths');

    pc.addEventListener('dragstart', () => pc.classList.add('dragging'));
    pc.addEventListener('dragend', () => pc.classList.remove('dragging'));

}

// MARIMON'S PLOTS ON THE BORDER. His rule, from the weird field: a tree seed needs a patch
// with the area of one magic square, all in ONE PIECE, whatever shape it happens to be. The
// border holds 9.25 magic squares of ground, so it carves into NINE plots with a quarter
// over — and the child can then count 17 + 9 instead of being told 26.
//
// It is walked as one connected path — down the left strip, round the corner, then right
// along the bottom — and cut every time a whole magic square's worth has been gathered.
// Two things fall out of that and both are the point: one plot BENDS ROUND THE CORNER, so
// "whatever shape it is" is shown rather than asserted; and the quarter that will not make
// a tenth plot is the ground left bare at the far end, which is what the last question is
// about. Every patch, the bend and the remainder are asserted in ../ch4_numbers.py.
function borderPlots() {
  const n = Math.floor(FIELD.s + 1e-9), f = FIELD.s - n, W = FIELD.big;
  const patches = [], cuts = [], seeds = [];
  if (f <= 0) return { patches, cuts, seeds, leftover: null };
  const per = 1 / f;                       // magic lengths of strip to one magic square
  let y = 0;
  while (y + per <= W - f - 1e-9) {
    patches.push([[0, y, f, per]]); seeds.push([f / 2, y + per / 2]);
    y += per;
    if (y < W - f - 1e-9) cuts.push(['h', 0, f, y]);
  }
  // the bending one: what is left of the left strip, plus the corner, plus a bite of the bottom
  const tail = (W - f - y) * f + f * f;
  const need = (1 - tail) / f;
  let x = f + need;
  // ⚠️ The tail and the corner are merged into ONE rectangle here. They abut along their
  // full width, so as two they would need an internal edge drawn or hidden; as one, every
  // patch in the carve is either a rectangle or a clean L of two, which is what lets
  // plotPath() outline it with a single stroke and no seam.
  patches.push([[0, y, f, W - y], [f, W - f, need, f]]);
  // ⚠️ THE SEED GOES AT THE ELBOW (Chapter 3's own rule): a seed on one arm reads as that
  // arm's, while the elbow is the one point belonging equally to the whole bent patch.
  seeds.push([f / 2, W - f / 2]);
  cuts.push(['v', W - f, f, x]);
  while (x + per <= W - 1e-9) {
    patches.push([[x, W - f, per, f]]); seeds.push([x + per / 2, W - f / 2]);
    x += per;
    if (x < W - 1e-9) cuts.push(['v', W - f, f, x]);
  }
  return { patches, cuts, seeds, leftover: [x, W - f, W - x, f] };
}
function plotCount() { return borderPlots().patches.length; }

// The outline of one plot as a single path. Every patch in the carve is either one
// rectangle or an L of two that meet along a full edge, so there are only the two cases —
// and drawing it as one path is what stops a bent plot showing a seam down its middle
// (Chapter 2's lesson 21: if the pedagogy says "this is ONE thing", the picture must not
// say "two"). The L is traced from the vertical piece's top-left, clockwise.
function plotPath(rects, px) {
  const P = (x, y) => (x * px) + ',' + (y * px);
  if (rects.length === 1) {
    const [x, y, w, h] = rects[0];
    return 'M' + P(x, y) + ' L' + P(x + w, y) + ' L' + P(x + w, y + h) +
           ' L' + P(x, y + h) + ' Z';
  }
  const [vx, vy, vw, vh] = rects[0];         // the standing piece
  const [hx, hy, hw, hh] = rects[1];         // the lying piece, along its foot
  return 'M' + P(vx, vy) + ' L' + P(vx + vw, vy) + ' L' + P(vx + vw, hy) +
         ' L' + P(hx + hw, hy) + ' L' + P(hx + hw, hy + hh) + ' L' + P(vx, vy + vh) + ' Z';
}


// Part D's scale. The area-68 field's completing square is 9.64 magic lengths across, so

const DPX = 52;

// PART D — CHAPTER 3's ROUND ONE, DRAWN (Sylvain, 2026-08-27)
// ---------------------------------------------------------------------------
// The 90.25 field is where the child RUNS the last quest's method instead of
// being handed its answer, so every move that quest made has to be a picture
// here: the L split in three, the corner dropped, the two strips widened and
// joined, cut into magic lengths, piled up — and then stood against the same
// ground as a column of magic squares, which IS the division.
//
// ⚠️ ONE SCALE FOR ALL OF IT (`DZ`). The whole argument is that these are the
// same ground in different shapes; a per-screen scale would quietly deny it.
// 26px puts the joined strip (18 magic lengths) at 468 and the tallest column

//
// ⚠️ `d` is the field's own band; `dt` is what the two strips must widen to

// — 0.4px, and it is drawn at 0.4px. Chapter 3's rule: the hair IS the
// approximation, and exaggerating it would say the answer is worse than it is.
// 24px puts the joined strip (18 magic lengths) at 432, the flat row at 700 and the
// tallest column (18 sixths of a magic length, 10.8) at 259 — all inside the 760 the
// container leaves. ⚠️ ONE SCALE FOR ALL OF IT: the whole argument is that these are the
// same ground in different shapes, and a per-screen scale would quietly deny it.
const DZ = 24;
const DTIL = 'd̃';                  // a COMBINING tilde, never an HTML entity
// ⚠️ The SIGNED coefficients of Part G, marked apart from `B` and `C` themselves —
// `B` is a rectangle's own side and `C` an area, both of them always positive lengths
// and grounds; `B̃` and `C̃` are those numbers with a sign on them, which is what the
// one line needs. ⚠️ The mark is Chapter 3's combining tilde and there it meant "our
// approximation of" — here it means "the signed version of". Same decoration, second
// job. Flagged rather than resolved: `b` is already taken (Part D), and Sylvain chose
// the tilde.
// ⚠️ `Ã` carries no sign — it is the 3 in `Ã × s`, and it is positive wherever this chapter
// uses it. Its tilde says *a coefficient of the shape*, which is the second job this mark
// has been given (Chapter 3's meant "our approximation of"). Kept because all three
// letters on `hGeneral`'s one line come off the same normalized shape and should look it.
const ATIL = 'Ã', BTIL = 'B̃', CTIL = 'C̃';
function dNums(a, n) {

function dBox(par, x, y, w, h, css) {

    'px; height:' + h + 'px; box-sizing:border-box;' + (css || '');

// ⚠️ NOTHING is written inside them: at DZ a strip is 12px, a mark and not a place that

function dSplitFieldEl(a, n) {
  const N = dNums(a, n), side = N.s * DZ, blk = n * DZ, w = N.d * DZ;
  const wrap = document.createElement('div');

    'height:' + side + 'px;';

    'align-items:center;' +
    'justify-content:center; font-size:15px; font-weight:bold; color:' + REG.a.ink + ';')
    .innerHTML = fmtNum(n) + ' &times; ' + fmtNum(n) + ' = ' + fmtNum(n * n);

// The three pieces off the field and laid out flat, then the corner dropped, then the
// strips widened, then pushed end to end, then cut at every magic length.
// mode: 'flat' | 'nocorner' | 'wide' | 'join' | 'cut'
//
// ⚠️ EVERY STRIP SHOWS ITS MAGIC LENGTHS (Sylvain, 2026-08-27) — nine light dividers
// inside each one, eighteen in the joined strip — so "nine long" is something to count
// rather than to take from the caption. On ALL the modes, not only the ones that talk
// about it, or a divider would appear between two consecutive screens; and LIGHTER than
// the outline, so a strip still reads as one strip made of parts rather than as nine
// strips. Chapter 3's `bStrips`, same rule.
//
// ⚠️ The joined strip keeps BOTH colours, nine pieces of each: it is two strips put end
// to end and it has to go on saying so. `cut` then opens real gaps between the eighteen,
// because that screen's whole claim is that they are now separate pieces.
function dRowEl(a, n, mode, hideCount) {
  const N = dNums(a, n);
  // ⚠️ `? x d` while the count IS the question (lesson 17): the caption used to read
  // `18 x d` directly under "how many pieces is that?".
  const cnt = hideCount ? '?' : null;
  const wide = (mode === 'wide' || mode === 'join' || mode === 'cut');
  const w = Math.max((wide ? N.dt : N.d) * DZ, 5);
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-end;' +
    'gap:8px; margin-top:22px;';
  const sign = ch => {
    const el = document.createElement('div');
    el.style.cssText = 'font-size:22px; font-weight:bold; color:#3a3a3a; padding-bottom:28px;';
    el.innerHTML = ch;
    row.appendChild(el);
  };
  // `units` = how many magic lengths the bar is; `gaps` cuts it into separate pieces.
  const piece = (len, hgt, cols, cap, units, gaps, ghost) => {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex; flex-direction:column; align-items:center;';
    const bar = document.createElement('div');
    bar.style.cssText = 'position:relative; width:' + len + 'px; height:' + hgt + 'px;' +
      'box-sizing:border-box;' + (ghost || gaps
        ? 'outline:2px dashed ' + (ghost ? '#9a8f78' : 'transparent') + '; outline-offset:-1px;'
        : dFill(cols[0]));
    if (units) for (let i = 0; i < units; i++) {
      const col = cols[Math.floor(i * cols.length / units)];
      const x = Math.round(i * len / units), x2 = Math.round((i + 1) * len / units);
      dBox(bar, x + (gaps ? 1 : 0), 0, x2 - x - (gaps ? 2 : 0), hgt,
        gaps ? dFill(col) : 'background:' + col.fill + ';');
    }
    // the magic-length dividers, lighter than the outline (see the note above)
    if (units && !gaps) {
      for (let i = 1; i < units; i++)
        dBox(bar, Math.round(i * len / units), 0, 1, hgt,
          'background:' + cols[0].ink + '; opacity:.4;');
      dBox(bar, 0, 0, len, hgt, dOutline(cols));
    }
    c.appendChild(bar);
    const cap2 = document.createElement('div');
    cap2.style.cssText = 'margin-top:9px; font-size:14px; font-weight:bold;' +
      'text-align:center; width:' + Math.max(len, 68) + 'px; color:' +
      (ghost ? '#9a8f78' : cols[0].ink) + ';';
    cap2.innerHTML = cap;
    c.appendChild(cap2);
    row.appendChild(c);
  };
  const wl = wide ? DTIL : 'd';
  if (mode === 'join' || mode === 'cut') {
    piece(N.k * DZ, w, [REG.b, REG.c], (cnt || fmtNum(N.k)) + ' &times; ' + wl,
      N.k, mode === 'cut');
  } else {
    piece(n * DZ, w, [REG.b], fmtNum(n) + ' &times; ' + wl, n);
    sign('+');
    piece(n * DZ, w, [REG.c], fmtNum(n) + ' &times; ' + wl, n);
    sign('+');
    if (mode === 'flat') piece(N.d * DZ, N.d * DZ, [REG.d], 'd &times; d');
    else piece(N.d * DZ, N.d * DZ, [REG.d], '<s>d &times; d</s>', 0, 0, true);
  }
  // ⚠️ `~`, never `<` (Sylvain): the two strips without the corner fall a little short of
  // the leftover, and `about` is a sign this trilogy has used since Chapter 3's Part A.
  // `<` has never appeared anywhere in three chapters and this is not the screen to
  // introduce it on.
  sign(mode === 'nocorner' ? '&asymp;' : '=');
  const tot = document.createElement('div');
  tot.style.cssText = 'width:96px; font-size:15px; font-weight:bold; color:#3a3a3a;' +
    'text-align:center; padding-bottom:22px; line-height:1.35;';
  tot.innerHTML = areaLabel(N.rem);
  row.appendChild(tot);
  return row;
}
// A two-colour bar needs its outline drawn once, over the pieces, or every piece carries
// its own and the bar reads as a row of boxes.
const dOutline = cols => 'outline:1.5px solid ' + cols[0].ink + '; outline-offset:-1px;' +
  'pointer-events:none;';

// A length measure down the outside of a column — Chapter 2's side bracket, vertical.
// ⚠️ THE END TICKS TURN INWARDS, towards the column they measure (Sylvain, 2026-08-27).
// Turned outwards they point at nothing and the measure reads as a bracket round the
// label instead of as a length taken off the ground beside it. So the line sits TICK
// clear of the inner edge and its ticks close the gap.
function dVBarEl(h, side, label, ink) {
  const W = 128, TICK = 14, wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; width:' + W + 'px; height:' + h + 'px;';
  const x = side === 'left' ? W - TICK : TICK - 2;     // the line
  const tx = side === 'left' ? W - TICK : 0;           // the ticks, running inwards
  dBox(wrap, x, 0, 2, h, 'background:' + ink + ';');
  dBox(wrap, tx, 0, TICK, 2, 'background:' + ink + ';');
  dBox(wrap, tx, h - 2, TICK, 2, 'background:' + ink + ';');
  const lab = document.createElement('div');
  lab.style.cssText = 'position:absolute; top:50%; transform:translateY(-50%);' +
    (side === 'left' ? 'right:' + (TICK + 10) + 'px; text-align:right;'
                     : 'left:' + (TICK + 10) + 'px; text-align:left;') +
    'width:' + (W - TICK - 10) + 'px; font-size:15px; font-weight:bold; color:' + ink +
    '; line-height:1.35;';
  lab.innerHTML = label;
  wrap.appendChild(lab);
  return wrap;
}

// THE DIVISION, DRAWN. Every column here is one magic length wide, so its area in magic
// squares and its height in magic lengths are the same number — which is the whole reason
// a leftover of GROUND can be turned into a LENGTH at all.
// ⚠️ The two columns are the same ground, so an `=` stands between them and each wears a
// length measure down its OUTER side (Sylvain, 2026-08-27): the pile's height on the left,
// the leftover's on the right. The equation underneath is then the two labels, said as one
// line — which is the thing the next screen goes and solves.
function dColsEl(a, n, eqHtml, rightLabel) {
  const N = dNums(a, n), row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-end;' +
    'gap:6px; margin-top:22px;';
  const H = N.rem * DZ;
  const colEl = kind => {
    const box = document.createElement('div');
    box.style.cssText = 'position:relative; width:' + DZ + 'px; height:' + H + 'px;' +
      (kind === 'rem' ? dFill(REG.a) : '');
    if (kind === 'rem') {
      for (let i = 1; i <= Math.floor(N.rem); i++)
        dBox(box, 0, (N.rem - i) * DZ, DZ, 1, 'background:' + REG.a.ink + '; opacity:.55;');
    } else {
      for (let i = 0; i < N.k; i++)
        dBox(box, 0, (N.rem - (i + 1) * N.dt) * DZ, DZ, N.dt * DZ,
          dFill(i < n ? REG.b : REG.c));
    }
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center;';
    wrap.appendChild(box);
    const foot = document.createElement('div');
    foot.style.cssText = 'margin-top:10px; font-size:14px; font-weight:bold;' +
      'text-align:center; color:#3a3a3a; width:120px;';
    foot.innerHTML = bold(lenLabel(1));
    wrap.appendChild(foot);
    return wrap;
  };
  // ⚠️ 29px is the column's own caption block (10 margin + one 19px line), so a measure
  // and the equals sign span exactly the column beside them instead of floating low.
  const FOOT = 29;
  const holder = el => {
    const h = document.createElement('div');
    h.style.cssText = 'margin-bottom:' + FOOT + 'px;';
    h.appendChild(el);
    return h;
  };
  row.appendChild(holder(dVBarEl(H, 'left',
    bold(nw(fmtNum(N.k) + ' &times; ' + DTIL)), REG.b.ink)));
  row.appendChild(colEl('pile'));
  const eq = document.createElement('div');
  eq.style.cssText = 'height:' + H + 'px; margin-bottom:' + FOOT + 'px; display:flex;' +
    'align-items:center; padding:0 6px; font-size:26px; font-weight:bold; color:#3a3a3a;';
  eq.innerHTML = '=';
  row.appendChild(eq);
  row.appendChild(colEl('rem'));
  row.appendChild(holder(dVBarEl(H, 'right',
    rightLabel || bold(lenLabel(N.rem)), REG.a.ink)));
  const out = document.createElement('div');
  out.appendChild(row);
  if (eqHtml) {
    const line = document.createElement('div');
    line.style.cssText = 'margin-top:16px; text-align:center; font-size:21px;';
    line.innerHTML = eqHtml;
    out.appendChild(line);
  }
  return out;
}

// CHAPTER 3's OWN MEASURING, at the one place this chapter needs it (Sylvain,
// 2026-08-27): take ONE of the pieces and lay tenths along it until one runs past the
// end. Drawn vertically and as a LENGTH — Chapter 1's ticked line, not a filled bar —
// because that is how this project draws a length, and the piece IS a height in the pile
// it came out of.
// ⚠️ 460px to the magic length, so a tenth is 46 — the size a whole magic length has on a
// field in Chapters 1 and 2. Small enough to fit five and an overshoot on one screen,
// big enough to be a click target rather than a precision task.
// CHAPTER 3's OWN MEASURING, UNDER CHAPTER 2's OWN LENS (Sylvain, 2026-08-27).
// The two columns STAY on screen — that is the whole point: the child is measuring one of
// the pieces the left-hand column is made of, and the equation it belongs to has to be
// there while they do it. So a ring goes round one band, a cone widens out of it, and the
// band is held in a lens at fifteen times its size with the tenths laid inside.
//
// ⚠️ ONE SVG, not divs. Chapter 2 settled this when it built the magnifier: a ring, a cone
// and a lens positioned against div-built ground is far more fragile than drawing the lot
// in one coordinate system. So the columns are redrawn here in SVG rather than reused from
// `dColsEl` — they are four rectangles, and the alternative is arithmetic across two
// layout models.
//
// ⚠️ The ring goes on the band nearest the LENS's own height, not on the top or bottom
// one, so the cone runs straight instead of diagonally across the picture. Chapter 2's
// rule is proximity: a lens that is not beside the thing it magnifies reads as an
// unrelated diagram.
//
// ⚠️ Only TENTHS are ever laid here. Chapter 3 would go on to hundredths and round up, and
// on this field that gives 0.52 and an answer of 1.52 against the 1.5 the child measured
// in Part B. What happens instead is on the next screen: we can check, so we try.
const SVGNS = 'http://www.w3.org/2000/svg';
const sv = (tag, at) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in at) e.setAttribute(k, at[k]);
  return e;
};
// ⚠️ A LAID PIECE IS A TICKED LINE, NOT A BLOCK (Sylvain, 2026-08-27). Chapter 1's glyph
// for a length: a spine with a tick at each end, so consecutive pieces share a tick and the
// row reads as one measured run. A filled rectangle is how this project draws GROUND, and
// nothing in this stretch is ground. It also survives being small — at a dozen pixels a
// block is a smudge, while a line with two ticks is still a length you can count.
//
// ⚠️ AND THE TENTHS STAY WHEN THE HUNDREDTHS ARRIVE (Sylvain), which is Chapter 3's Part A'
// ladder: `d` keeps its lens and its laid tenths, a second ring goes round the bit still
// left at the top, and a second cone widens down to a second lens where the hundredths are
// laid on that. Every rung of the ladder is the previous rung's leftover magnified, and
// nothing that has been measured ever leaves the screen.
//   opts.tenths = k  ->  rung 1 holds k tenths, already laid, and `laid`/`over` are the
//                        HUNDREDTHS being laid on rung 2.
function dLensEl(a, n, laid, over, onClick, opts) {
  const o = opts || {}, FINE = o.tenths != null;
  const N = dNums(a, n), W = 640;
  const LCX = 150, LCY = 175, LRX = 115, LRY = 158;
  const L2Y = 505, L2RX = 100, L2RY = 125;
  const HH = FINE ? L2Y + L2RY + 18 : 350;
  const wrap = document.createElement('div');
  const svg = sv('svg', { width: W, height: HH, viewBox: '0 0 ' + W + ' ' + HH,
    style: 'display:block; margin:14px auto 0; max-width:100%;' });
  const rect = (x, y, w, h, fill, ink, sw) => svg.appendChild(sv('rect',
    { x: x, y: y, width: Math.max(w, 0.5), height: Math.max(h, 0.5), fill: fill,
      stroke: ink || 'none', 'stroke-width': sw == null ? 1.5 : sw }));
  const poly = pts => svg.appendChild(sv('polygon', { fill: 'rgba(154,143,120,.15)',
    points: pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') }));
  // a cone widening SIDEWAYS (ring on the right, lens on the left)…
  const cone = (x1, y1, h1, x2, y2, h2) =>
    poly([[x2, y2 - h2], [x1, y1 - h1], [x1, y1 + h1], [x2, y2 + h2]]);
  // …and one widening DOWNWARDS. ⚠️ Not the same function with the arguments swapped: a
  // cone's mouth opens across its own axis, so the second rung's has to spread in x where
  // the first one's spreads in y. Drawn with the first one's code it came out a sliver.
  const coneDown = (x1, y1, h1, x2, y2, h2) =>
    poly([[x2 - h2, y2], [x1 - h1, y1], [x1 + h1, y1], [x2 + h2, y2]]);
  const lens = (cx, cy, rx, ry) => svg.appendChild(sv('ellipse', { cx: cx, cy: cy,
    rx: rx, ry: ry, fill: '#fdfbf4', stroke: '#8a8070', 'stroke-width': 3 }));
  const ring = (cx, cy, rx, ry) => svg.appendChild(sv('ellipse', { cx: cx, cy: cy,
    rx: rx, ry: Math.max(ry, 7), fill: 'none', stroke: '#8a8070', 'stroke-width': 2.5 }));

  const CH = N.rem * DZ, CT = LCY - CH / 2, CW = DZ, PX1 = 496, PX2 = 576;

  // ---- the gauge, and the pieces laid on it -------------------------------------------
  // ⚠️ The scale is CHOSEN so that what is measured PLUS one overshoot sits inside the
  // lens — and it is chosen from the same TOTAL whether or not we have gone fine, so the
  // gauge does not change size between two consecutive screens.
  const geom = (cx, cy, ry, span, unit) => {
    const TOTAL = span + unit, ML = (2 * ry - 44) / TOTAL, GH = span * ML;
    const gBase = cy + TOTAL * ML / 2;
    return { ML: ML, T: unit * ML, gBase: gBase, gTop: gBase - GH, GH: GH,
             GX: cx + 30, AX: cx - 18 };           // reference line, and the pieces' axis
  };
  const gaugeOn = (cx, cy, ry, span, unit, nLaid, isOver) => {
    const G = geom(cx, cy, ry, span, unit);
    const GH = G.GH, T = G.T, gBase = G.gBase, gTop = G.gTop, GX = G.GX, AX = G.AX;
    rect(GX - 1, gTop, 2, GH, '#8a8070', 'none');
    const endRule = () => {
      rect(AX - 16, gTop - 1, GX + 13 - AX + 16, 2, '#8a8070', 'none');
      rect(AX - 16, gBase - 1, GX + 13 - AX + 16, 2, '#8a8070', 'none');
    };
    endRule();
    // Chapter 1's length glyph: a spine and a tick at each end.
    const piece = (i, red) => {
      const y = gBase - (i + 1) * T, col = red ? '#b5452f' : '#6a4a9e';
      rect(AX - 1.5, y, 3, T, col, 'none');
      rect(AX - 12, y - 1.5, 24, 3, col, 'none');
      if (i === 0) rect(AX - 12, gBase - 1.5, 24, 3, '#6a4a9e', 'none');
    };
    for (let i = 0; i < nLaid; i++) piece(i, false);
    if (isOver) piece(nLaid, true);
    // ⚠️ The end rules go on AGAIN over the pieces. Underneath them the finish line is
    // hidden exactly where it matters, and the unit that runs past reads as a piece sitting
    // above the bar rather than as one crossing the end of it — which is the whole screen.
    endRule();
  };

  // ---- rung one ------------------------------------------------------------------------
  const tt = 0.84, lx = LCX + LRX * Math.sqrt(1 - tt * tt);
  let bi = 0, best = 1e9;
  for (let i = 0; i < N.k; i++) {
    const cy = CT + CH - (i + 0.5) * N.dt * DZ;
    if (Math.abs(cy - LCY) < best) { best = Math.abs(cy - LCY); bi = i; }
  }
  const RCY = CT + CH - (bi + 0.5) * N.dt * DZ, RRX = 27, RRY = 13;
  cone(PX1 - 5, RCY, RRY, lx, LCY, LRY * tt);
  lens(LCX, LCY, LRX, LRY);
  // ⚠️ The second cone is painted BEFORE rung one's pieces, so the tenths sit on top of it
  // rather than under a wash — which is why the gauge's geometry is computed separately
  // from its drawing.
  const G1 = geom(LCX, LCY, LRY, N.dt, 0.1);
  const gapBot = FINE ? G1.gBase - o.tenths * G1.T : 0;
  const gapCy = FINE ? (G1.gTop + gapBot) / 2 : 0, gapRy = FINE ? (gapBot - G1.gTop) / 2 : 0;
  if (FINE) coneDown(G1.AX, gapBot, 26, LCX, L2Y - L2RY * tt, L2RX * tt);
  gaugeOn(LCX, LCY, LRY, N.dt, 0.1, FINE ? o.tenths : laid, FINE ? false : over);
  const nm = sv('text', { x: LCX + 48, y: LCY + 8, 'font-size': 21, 'font-weight': 'bold',
    fill: REG.b.ink });
  nm.textContent = DTIL;
  svg.appendChild(nm);

  // ---- rung two: the bit still left at the top, magnified again -------------------------
  if (FINE) {
    ring(G1.AX, gapCy, 24, gapRy);
    lens(LCX, L2Y, L2RX, L2RY);
    gaugeOn(LCX, L2Y, L2RY, N.dt - o.tenths / 10, 0.01, laid, over);
  }

  // ---- the two columns, exactly as dColsEl draws them -----------------------------------
  for (let i = 0; i < N.k; i++) {
    const col = i < n ? REG.b : REG.c;
    rect(PX1, CT + CH - (i + 1) * N.dt * DZ, CW, N.dt * DZ, col.fill, col.ink);
  }
  rect(PX2, CT, CW, CH, REG.a.fill, REG.a.ink);
  for (let i = 1; i <= Math.floor(N.rem); i++)
    rect(PX2, CT + (N.rem - i) * DZ, CW, 1, REG.a.ink, 'none');
  const eqt = sv('text', { x: (PX1 + CW + PX2) / 2, y: CT + CH / 2 + 8,
    'text-anchor': 'middle', 'font-size': 22, 'font-weight': 'bold', fill: '#3a3a3a' });
  eqt.textContent = '=';
  svg.appendChild(eqt);
  ring(PX1 + CW / 2, RCY, RRX, RRY);

  if (onClick) {
    const c = FINE ? [LCX, L2Y, L2RX, L2RY] : [LCX, LCY, LRX, LRY];
    const hit = sv('ellipse', { cx: c[0], cy: c[1], rx: c[2], ry: c[3],
      fill: 'transparent', style: 'cursor:pointer;' });
    hit.addEventListener('click', onClick);
    svg.appendChild(hit);
  }
  wrap.appendChild(svg);
  const line = document.createElement('div');
  line.style.cssText = 'margin-top:2px; text-align:center; font-size:21px;';
  line.innerHTML = bold(nw(fmtNum(N.k) + ' &times; ' + DTIL + ' = ' + fmtNum(N.rem)));
  wrap.appendChild(line);
  return wrap;
}

// The three fields of Part D, to scale against each other, each with what the line gave.
function rollCallEl() {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; justify-content:center; align-items:flex-end;' +
    'gap:26px; margin-top:14px; flex-wrap:wrap;';
  const keep = FIELD.i;
  L_FIELDS.forEach((f, i) => {
    setField(i);
    const col = document.createElement('div');
    col.style.cssText = 'display:flex; flex-direction:column; align-items:center;';
    col.appendChild(lFieldEl({ px: 22 }));
    const cap = document.createElement('div');
    cap.style.cssText = 'margin-top:8px; font-size:14px; color:#3a3a3a; text-align:center;';
    // ⚠️ `=` on the two that came out exactly, `≈` on the one that never will. The sign is
    // the whole difference between them and it has to be right on the picture that lines
    // all three up.
    cap.innerHTML = bold(areaLabel(f.C)) + '<br>' +
      bold(nw('s ' + (f.s === null ? '&asymp;' : '=') + ' ' + fmtNum(fieldAnswer(i))));
    col.appendChild(cap);
    row.appendChild(col);
  });
  setField(keep);
  return row;
}


// PART E's PICTURE: a square with one rectangle stuck on top of it, and the cut that turns
// it into the chapter's own L. Three states, drawn in ONE canvas of the size the widest and
// tallest of them needs — so the square never moves, and what the child watches is the top
// half leaving its place and arriving at the side. That is the whole content of the part.
//
//   whole : rectangle (0, 0, s, 2B) sitting on the square (0, 2B, s, s)
//   cut   : the same, with the halving line drawn across it
//   moved : the lower half stays put as the L's arm; the upper half is at the side as its
//           foot, and the space it left is empty, which is what says it has gone.
function stackFieldEl(state, o) {
  o = o || {};
  // ⚠️ `o.sv` / `o.bv` override the side and the HALF-rectangle, for the closing eight.
  const s = o.sv === undefined ? FIELD.s : o.sv,
        B = o.bv === undefined ? FIELD.B : o.bv, px = o.px || PX;
  const S = s * px, Bp = B * px;
  const padL = 122, W = S + Bp, H = S + 2 * Bp;
  const stage = document.createElement('div');
  // ⚠️ The caption row is RESERVED on every call, drawn or not. The area belongs to the
  // whole field, so it goes above it rather than inside — written at the canvas's midpoint
  // it landed inside the green rectangle and read as that rectangle's own area. And a row
  // that appeared only on the screens carrying a caption would slide the field up and down
  // between consecutive views of it, which is the jump Chapter 2 had to fix once.
  const CAP = 30;
  stage.style.cssText = 'position:relative; margin:10px auto 0;' +
    // ⚠️ On the bare shape the box is as wide as the INK, not as wide as `W` — `W` allows for
    // the half that walks round in the 'moved' state, and reserving it here left the field
    // sitting at the far left of its own box and out of line with the caption under it.
    'width:' + (o.plain ? (state === 'moved' ? W : S) + 6 : padL + W + 18) + 'px; height:' +
    (H + CAP + (o.plain ? 6 : 46)) + 'px;';
  const OX = o.plain ? 3 : padL, OY = CAP + 6;
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    stage.appendChild(d);
    return d;
  };
  const box = (x, y, w, h, css) => put('left:' + (OX + x) + 'px; top:' + (OY + y) + 'px;' +
    'width:' + w + 'px; height:' + h + 'px; box-sizing:border-box;' + css);
  const EDGEIN = 'outline:3px solid #3a3a3a; outline-offset:0;';

  // the square never moves
  box(0, 2 * Bp, S, S, 'background:' + PIECE.sq.fill + ';' + EDGEIN + ' z-index:3;');
  if (state === 'moved') {
    box(0, Bp, S, Bp, 'background:' + PIECE.arm.fill + ';' + EDGEIN + ' z-index:3;');
    box(S, 2 * Bp, Bp, S, 'background:' + PIECE.foot.fill + ';' + EDGEIN + ' z-index:3;');
    // the space the travelling half came out of, so the move is visible after it has happened
    box(0, 0, S, Bp, 'outline:2px dashed #b9ae94; outline-offset:-1px; z-index:1;');
  } else {
    box(0, 0, S, 2 * Bp, 'background:' + PIECE.arm.fill + ';' + EDGEIN + ' z-index:3;');
    if (state === 'cut') box(0, Bp - 1.5, S, 3, 'background:#a3364a; z-index:5;');
  }
  // the field's own area, above it, where it can only mean the whole field — and centred
  // on the FIELD, not on the canvas, which is wider than the field until the half moves
  if (o.area) {
    // ⚠️ The box is at least 200px wide and CENTRED ON THE FIELD, not merely as wide as it.
    // Centring on the same point leaves every wider field's caption exactly where it was
    // (snapshot-checked), and it stops a narrow one — Part G draws this field at px 34 —
    // wrapping "21 magic squares" onto two lines and dropping the second onto the outline.
    const fw = state === 'moved' ? W : S, cw = Math.max(fw, 200);
    const d = put('left:' + (OX + fw / 2 - cw / 2) + 'px; top:0; width:' + cw + 'px;' +
      'text-align:center; font-size:15px; color:#5a5240; z-index:7; pointer-events:none;');
    d.innerHTML = o.area;
  }
  // labels inside the pieces
  const cap = (x, y, w, h, txt, col) => {
    const d = box(x, y, w, h, 'display:flex; align-items:center; justify-content:center;' +
      'font-size:14px; font-weight:bold; text-align:center; z-index:6; color:' + col + ';' +
      'pointer-events:none;');
    d.innerHTML = txt;
  };
  // ⚠️ THE COVERING, for the one screen that spends this field rather than cutting it up
  // (`eSeeds`). The square is `s × s` and the rectangle `s` by `2B`, so on Part E's field that
  // is 9 + 12 = 21 cells — the area, materialised, with `.field-cell.filled`'s own seed in each.
  // ⚠️ Guarded on both counts being whole (lesson 27's cousin): a field whose side is 1.5 would
  // silently come out with the wrong number of cells, and nothing would throw.
  if (o.cells) {
    const cw = Math.round(s), ch = Math.round(2 * B);
    if (Math.abs(cw - s) < 1e-9 && Math.abs(ch - 2 * B) < 1e-9) {
      for (let c = 0; c < cw; c++) for (let r = 0; r < ch + cw; r++) {
        const d = document.createElement('div');
        d.className = 'field-cell filled';
        d.style.cssText = 'position:absolute; left:' + (OX + c * px) + 'px;' +
          'top:' + (OY + r * px) + 'px; width:' + px + 'px; height:' + px + 'px; z-index:4;';
        stage.appendChild(d);
      }
    }
  }
  if (o.names) {
    cap(0, 2 * Bp, S, S, o.names.sq || '', PIECE.sq.ink);
    if (state === 'moved') {
      cap(0, Bp, S, Bp, o.names.half || '', PIECE.arm.ink);
      cap(S, 2 * Bp, Bp, S, o.names.half || '', PIECE.foot.ink);
    } else {
      cap(0, 0, S, 2 * Bp, o.names.rect || '', PIECE.arm.ink);
    }
  }
  // brackets: the width (s) underneath, and up the left whatever the state has there
  const vb = (y, h, txt, col) => {
    put('left:' + (OX - 16) + 'px; top:' + (OY + y) + 'px; width:11px; height:' + h + 'px;' +
      'box-sizing:border-box; border:3px solid ' + col + '; border-right:none; z-index:6;');
    put('left:0; top:' + (OY + y + h / 2 - 12) + 'px; width:' + (padL - 26) + 'px;' +
      'text-align:right; font-size:15px; z-index:6; color:' + col + ';').innerHTML = txt;
  };
  const hb = (x, w, txt, col) => {
    const by = OY + H + 12;
    put('left:' + (OX + x) + 'px; top:' + by + 'px; width:' + w + 'px; height:11px;' +
      'box-sizing:border-box; border:3px solid ' + col + '; border-top:none; z-index:6;');
    put('left:' + (OX + x) + 'px; top:' + (by + 15) + 'px; width:' + w + 'px;' +
      'text-align:center; font-size:15px; z-index:6; color:' + col + ';').innerHTML = txt;
  };
  const L = o.labels || {};
  // ⚠️ `o.plain` draws the shape ALONE. The overview page needs eight of these at a size
  // where a bracket's label is unreadable and its row is what makes the cells collide.
  if (!o.plain) {
  vb(2 * Bp, S, L.s || bold('s'), PIECE.sq.ink);
  // ⚠️ The WHOLE rectangle is `B` and each HALF of it is `b` — which is the convention
  // itself, drawn: halve `B` and you have the `b` that Part D's line takes off at the end.
  if (state === 'moved') vb(Bp, Bp, L.half || bold('b'), PIECE.arm.ink);
  else vb(0, 2 * Bp, L.rect || bold('B'), PIECE.arm.ink);
  hb(0, S, L.s || bold('s'), PIECE.sq.ink);
  if (state === 'moved') hb(S, Bp, L.half || bold('b'), PIECE.foot.ink);
  }
  return stage;
}


// ---------------------------------------------------------------------------
// PART F's TWO PICTURES.  s^2 + C = B x s
// ⚠️ This part does NOT use FIELD or lFieldEl: its field is not an L and never
// becomes one. Its numbers live here, and every one is asserted in ../ch4_numbers.py.
//   B = the whole length,  h = B/2,  g = h - s,  so the other width is h + g.
// ---------------------------------------------------------------------------
const FF = { B: 10, C: 21, s: 3 };
const fH = () => FF.B / 2;              // the half
const fG = () => fH() - FF.s;           // how far short of the half the square falls
const FPX = 52;

// THE FIELD, as one strip: a square beside a rectangle, together B long. With `mid` it
// carries the halfway mark — the whole part turns on the square falling SHORT of that mark
// by exactly as much as the rectangle runs past it, which is only true because the halves
// are equal, and which is a thing to see rather than be told.
function stripFieldEl(o) {
  o = o || {};
  // ⚠️ `sv` overrides the side, because Part G draws BOTH roots of Part F's equation and
  // the second of them (s = 7) is a real field too — a different one, taller than the first.
  const sv = o.sv === undefined ? FF.s : o.sv;
  // ⚠️ `o.bv` overrides the strip's length, for the closing eight.
  const BV = o.bv === undefined ? FF.B : o.bv;
  const px = o.px || FPX, S = sv * px, W = BV * px, H = sv * px;
  // ⚠️ The halfway mark's two brackets stand ABOVE the strip, so a screen carrying it
  // needs its headroom nearly doubled or they are drawn off the top of the stage.
  // ⚠️ The wider gutter ONLY where the inner square's own side is measured — which is all
  // five of Part H's strip screens and none of Part F's, so no two consecutive screens
  // differ. A flat 70 was the first attempt and it broke Part G: `gBothFieldsEl` draws two
  // fields side by side at px 26, and 30px of gutter apiece pushed them past the 760 the
  // container leaves, so they wrapped one under the other.
  const padL = (o.sTop || o.sLeft) ? 70 : 40, CAP = o.mid ? 58 : 30;
  const stage = document.createElement('div');
  stage.style.cssText = 'position:relative; margin:10px auto 0;' +
    'width:' + (o.plain ? W + 6 : padL + W + 40) + 'px; height:' +
    (CAP + H + (o.plain ? 6 : 116)) + 'px;';
  const OX = o.plain ? 3 : padL, OY = CAP;
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    stage.appendChild(d);
    return d;
  };
  const box = (x, y, w, h2, css) => put('left:' + (OX + x) + 'px; top:' + (OY + y) + 'px;' +
    'width:' + w + 'px; height:' + h2 + 'px; box-sizing:border-box;' + css);
  box(0, 0, S, H, 'background:' + PIECE.sq.fill + '; outline:3px solid #3a3a3a; z-index:3;');
  // Part H's field was built in stages, and the FIRST of them — the little square Eliel
  // wants to fence — is still there in the corner of the big one.
  // ⚠️ `s` ITSELF, measured down the left of the little square (Sylvain, 2026-08-28) —
  // at the TOP of the side, where the square is. Part H's whole subject is that the field
  // was built from a square of side `s` made three times as wide, and until now `s` was a
  // letter in the prose with nothing on the ground answering to it.
  if (o.sTop && o.inner) {
    box(-24, 0, 11, o.inner * px,
      // ⚠️ `border-right:none`, so the spine is on the LEFT and the two ticks turn RIGHT,
      // towards the side they measure. It was the other way round, which pointed them out
      // into the margin and away from the square — and it also disagreed with every other
      // vertical bracket in the chapter (`stackFieldEl`'s `vb` turns right too).
      'border:3px solid ' + PIECE.arm.ink + '; border-right:none; z-index:7;');
    put('left:0; top:' + (OY + o.inner * px / 2 - 12) + 'px; width:' + (padL - 32) + 'px;' +
      'text-align:right; font-size:15px; font-weight:bold; color:' + PIECE.arm.ink +
      '; z-index:7;').innerHTML = o.sTop;
  }
  // ⚠️ `s` DOWN THE WHOLE LEFT EDGE (Sylvain, 2026-09-06), on every Part F screen from the
  // first. The strip is `s` deep all along, so this one measure is true of the square, of the
  // rectangle, and of the L we make out of them — and it has to be standing there already by
  // the time the child is asked what the L's left-hand side comes to. Same spine-left,
  // ticks-turning-right convention as `sTop`.
  if (o.sLeft) {
    box(-24, 0, 11, H, 'border:3px solid ' + PIECE.sq.ink + '; border-right:none; z-index:7;');
    put('left:0; top:' + (OY + H / 2 - 12) + 'px; width:' + (padL - 32) + 'px;' +
      'text-align:right; font-size:15px; font-weight:bold; color:' + PIECE.sq.ink +
      '; z-index:7;').innerHTML = o.sLeft;
  }
  if (o.inner) box(0, 0, o.inner * px, o.inner * px,
    'background:' + PIECE.arm.fill + '; outline:3px solid ' + PIECE.arm.ink + ';' +
    'outline-offset:-1px; z-index:4;');
  box(S, 0, W - S, H, 'background:' + PIECE.foot.fill + '; outline:3px solid #3a3a3a; z-index:3;');
  if (o.cLabel) {
    const d = box(S, 0, W - S, H, 'display:flex; align-items:center; justify-content:center;' +
      'font-size:15px; font-weight:bold; color:' + PIECE.foot.ink + '; z-index:6;');
    d.innerHTML = o.cLabel;
  }
  // ⚠️ THE SQUARE IS LABELLED TOO (Sylvain, 2026-08-27, having read the 21 as the field's
  // own area). It is not: `C` is the RECTANGLE, and the whole strip is `B x s = 30`, which
  // is the very thing we do not know yet. Centring the 21 on the strip would make the
  // picture say something false, and `ch4_numbers.py` asserts both figures. What was
  // actually wrong is that one number sat alone inside a field with nothing to contrast it
  // — so the square now carries `s x s` and neither label can be read as the total.
  if (o.sLabel) {
    const d = box(0, 0, S, H, 'display:flex; align-items:center; justify-content:center;' +
      'font-size:15px; font-weight:bold; color:' + PIECE.sq.ink + '; z-index:6;');
    d.innerHTML = o.sLabel;
  }
  if (o.mid) {
    // ⚠️ `h` IS MEASURED, NOT MERELY NAMED (Sylvain, 2026-08-27). It used to be one label
    // floating over the halfway line, which says where the middle is and nothing about how
    // long a half is. A bracket now spans EACH half, both carrying `h = 5`, so the two are
    // seen to be the same length — which is the only reason halving the strip helps at all.
    const HP = fH() * px;
    const tb = (x, w) => {
      box(x, -26, w, 11, 'border:3px solid #a3364a; border-bottom:none; z-index:6;');
      put('left:' + (OX + x) + 'px; top:' + (OY - 50) + 'px; width:' + w + 'px;' +
        'text-align:center; font-size:14px; font-weight:bold; color:#a3364a; z-index:6;')
        .innerHTML = o.mid;
    };
    tb(0, HP); tb(HP, W - HP);
    // the mark itself carries on down from where the two brackets meet
    box(HP - 1.5, -15, 3, H + 15, 'background:#a3364a; z-index:5;');
  }
  // ⚠️ WHAT THE RECTANGLE'S WIDTH IS MADE OF, and the first version of this drew it wrong.
  // It put a second `g` bracket just past the halfway mark, to say "the rectangle runs past
  // the mark by the same g" — which is simply false: the rectangle runs past the mark by
  // the whole second half. What IS true, and what this draws, is that the rectangle takes
  // the bit of the first half the square left behind (that is g) AND THEN the whole second
  // half. So its width is h + g. Found by looking at the picture against its own sentence.
  if (o.g) {
    const bar = (x, w, txt, col) => {
      box(x, H + 8, w, 11, 'border:3px solid ' + col + '; border-top:none; z-index:6;');
      put('left:' + (OX + x) + 'px; top:' + (OY + H + 23) + 'px; width:' + w + 'px;' +
        'text-align:center; font-size:15px; color:' + col + '; z-index:6;').innerHTML = txt;
    };
    bar(S, fG() * px, o.g, PIECE.arm.ink);                 // what the square left in half one
    bar(fH() * px, fH() * px, o.half || bold('h'), '#a3364a');   // and the whole of half two
  }
  const hb = (x, w, txt, col, row) => {
    const by = OY + H + (row ? 46 : 8);
    box(x, by - OY, w, 11, 'border:3px solid ' + col + '; border-top:none; z-index:6;');
    put('left:' + (OX + x) + 'px; top:' + (by + 15) + 'px; width:' + w + 'px;' +
      'text-align:center; font-size:15px; color:' + col + '; z-index:6;').innerHTML = txt;
  };
  const L = o.labels || {};
  if (o.plain) return stage;      // ⚠️ the bare shape, for the overview page
  // ⚠️ `s` stays on the row when the gaps are marked (Sylvain, 2026-08-27) — the three
  // brackets are ADJACENT, not overlapping (s spans 0..s, g spans s..h, h spans h..B), so
  // the whole side reads left to right as s + g + h with nothing left unaccounted for.
  hb(0, S, L.s || bold('s'), PIECE.sq.ink);
  hb(0, W, L.b || bold(nw('B = ' + fmtNum(BV))), '#3a3a3a', true);
  if (o.area) put('left:' + OX + 'px; top:0; width:' + W + 'px; text-align:center;' +
    'font-size:15px; color:#5a5240; z-index:7;').innerHTML = o.area;
  return stage;
}

// PART F's REARRANGEMENT (Sylvain, 2026-08-27), which replaces a difference-of-two-squares
// detour with the chapter's OWN picture — completing the square, for the fourth time.
//
// Cut Marimon's rectangle at the halfway mark. What lies left of the mark is `g` wide and
// `s` deep; what lies right of it is `h` wide and `s` deep. Walk the little one up onto the
// left of the big one, turned a quarter turn, and the same 21 magic squares are now an L
// that sits inside a square of side `s + g` — which is `h`, and `h` is a number we KNOW.
// So `h x h = C + g x g`, the corner is the only thing missing, and 25 = 21 + 4 gives it.
//
//   `cut` -> `moved` -> `parts` -> `square`, in ONE canvas, so nothing jumps between them.
// ⚠️ The strip stays whole on screen throughout, with the slice's old place left dashed —
// Part C's own idiom for ground that has been lifted off. That is also what lets the child
// see that the L's corner square is the TWIN of the field's own `s x s`.
// THE BOTTOM MARK-UP that arrives at `fCheckL` and stays (Sylvain, 2026-09-06): `s` and `g`
// under the left of the field, and `h = 5` on a second row spanning them both. It is the fact
// the whole walk turns on — `s + g = h` — put on the ground as LENGTHS, so that when the child
// is asked what the L's left-hand side comes to, the two pieces it is made of are already
// measured somewhere on the picture and only have to be recognised.
function fBotBars() {
  return [[0, FF.s, bold('s'), PIECE.sq.ink], [FF.s, fG(), bold('g'), PIECE.arm.ink],
    [0, fH(), bold(nw('h = ' + fmtNum(fH()))), '#a3364a', 1],
    [fH(), fH(), bold(nw('h = ' + fmtNum(fH()))), '#a3364a']];
}

function fMoveEl(state, o) {
  o = o || {};
  const px = FPX, s = FF.s, h = fH(), g = fG(), B = FF.B;
  const S = s * px, H = h * px, G = g * px, W = B * px, D = s * px;
  const MOVED = state !== 'cut';
  const padL = o.sLeft ? 76 : 46, CAP = G + 40;
  const stage = document.createElement('div');
  stage.style.cssText = 'position:relative; margin:10px auto 0;' +
    'width:' + (padL + W + 46) + 'px; height:' + (CAP + D + 92) + 'px;';
  const OX = padL, OY = CAP;
  const put = css => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    stage.appendChild(d);
    return d;
  };
  const box = (x, y, w, hh, css) => put('left:' + (OX + x) + 'px; top:' + (OY + y) + 'px;' +
    'width:' + w + 'px; height:' + hh + 'px; box-sizing:border-box;' + css);
  const fill = (x, y, w, hh, pc, z) => box(x, y, w, hh, 'background:' + pc.fill +
    '; outline:2px solid ' + pc.ink + '; outline-offset:-1px; z-index:' + (z || 3) + ';');
  const label = (x, y, w, hh, txt, ink) => {
    const d = box(x, y, w, hh, 'display:flex; align-items:center; justify-content:center;' +
      'font-size:15px; font-weight:bold; color:' + ink + '; z-index:7;');
    d.innerHTML = txt;
  };

  // the field's own square, which never moves
  fill(0, 0, S, D, PIECE.sq);
  if (o.sq) label(0, 0, S, D, o.sq, PIECE.sq.ink);
  // the slice: in place, or lifted and turned, leaving a dashed hole behind it
  if (MOVED) {
    box(S, 0, G, D, GHOST + 'z-index:2;');
    fill(H, -G, S, G, PIECE.arm, 5);
  } else {
    fill(S, 0, G, D, PIECE.arm);
  }
  // the big half of the rectangle. In `parts` it comes apart into the twin square and the
  // second strip — the same two pieces, read the other way.
  if (state === 'parts' || state === 'square') {
    fill(H, 0, S, D, PIECE.sq);
    // ⚠️ The TWIN is labelled too, not just the field's own square: "the twin of the
    // field's own square" is a claim about two shapes, and it has to be legible on both.
    if (o.sq) label(H, 0, S, D, o.sq, PIECE.sq.ink);
    fill(H + S, 0, W - H - S, D, PIECE.arm);
  } else {
    fill(H, 0, W - H, D, PIECE.foot);
  }
  // the corner: missing, then filled in
  if (state === 'square') fill(H + S, -G, W - H - S, G, PIECE.foot, 4);
  else if (MOVED) box(H + S, -G, W - H - S, G, GHOST + 'z-index:4;');
  // ⚠️ ONE heavy outline round the L, so the 21 inside it belongs to the whole bent shape
  // and not to the piece it happens to sit on (Chapter 2's lesson 21).
  if (MOVED && state !== 'square') {
    box(H, -G, W - H, D + G, 'outline:3px solid #3a3a3a; z-index:6; pointer-events:none;');
    box(H + S, -G, W - H - S, G, 'background:#f4f0e4; z-index:5;');
    box(H + S, -G, W - H - S, G, GHOST + 'z-index:6;');
  }
  if (state === 'square')
    box(H, -G, W - H, D + G, 'outline:3px solid #3a3a3a; z-index:6; pointer-events:none;');
  // ⚠️ Before the move, the 21 is the WHOLE rectangle — both pieces of it — and only
  // afterwards does it belong to the L. It used to sit on the right-hand half alone.
  // ⚠️ ON THE 'moved' STATE THE LABEL SPANS THE WHOLE L, NOT THE YELLOW HALF (2026-09-06).
  // The screen now says the area is "les deux champs (jaune + vert)" together, and a 21 sitting
  // inside the yellow rectangle alone reads as the yellow's own area. Caption and picture must
  // agree. 'cut', 'parts' and 'square' are untouched.
  if (o.area) {
    const ax = MOVED ? H : S;
    const ay = state === 'moved' ? -G : 0, ah = state === 'moved' ? D + G : D;
    label(ax, ay, W - ax, ah, o.area, '#3a3a3a');
  }
  if (o.corner) label(H + S, -G, W - H - S, G, o.corner, PIECE.foot.ink);
  // the strip's own boundary, last, so it is never painted over
  box(0, 0, W, D, 'outline:3px solid #3a3a3a; z-index:8; pointer-events:none;');
  // the halfway mark
  box(H - 1.5, -G - 14, 3, D + G + 14, 'background:#a3364a; z-index:9;');

  // brackets: under the strip, and up the big square's right-hand side
  const hb = (x, w, txt, col, row) => {
    box(x, D + (row ? 46 : 8), w, 11,
      'border:3px solid ' + col + '; border-top:none; z-index:7;');
    put('left:' + (OX + x) + 'px; top:' + (OY + D + (row ? 61 : 23) ) + 'px;' +
      'width:' + w + 'px; text-align:center; font-size:15px; font-weight:bold;' +
      'color:' + col + '; z-index:7;').innerHTML = txt;
  };
  (o.bars || []).forEach(b => hb(b[0] * px, b[1] * px, b[2], b[3], b[4]));
  // ⚠️ A bracket ABOVE the piece that was walked round, and measures up the L's LEFT edge —
  // both additive, both used only by `fSquares`' walk. Field units in, pixels out, so the
  // call sites read like the arithmetic.
  // ⚠️ `s` down the strip's left edge, kept from `fIntro` right through the part — see
  // `stripFieldEl`'s own note. The strip is drawn 0..W by 0..D in every state, so this
  // measure is in the same place on all of them.
  if (o.sLeft) {
    box(-24, 0, 11, D, 'border:3px solid ' + PIECE.sq.ink + '; border-right:none; z-index:9;');
    put('left:0; top:' + (OY + D / 2 - 12) + 'px; width:' + (padL - 32) + 'px;' +
      'text-align:right; font-size:15px; font-weight:bold; color:' + PIECE.sq.ink +
      '; z-index:9;').innerHTML = o.sLeft;
  }
  if (o.topBar) {
    const [x, w, txt, col] = o.topBar;
    box(x * px, -G - 26, w * px, 11, 'border:3px solid ' + col +
      '; border-bottom:none; z-index:7;');
    put('left:' + (OX + x * px) + 'px; top:' + (OY - G - 50) + 'px; width:' + (w * px) +
      'px; text-align:center; font-size:15px; font-weight:bold; color:' + col +
      '; z-index:7;').innerHTML = txt;
  }
  // ⚠️ They STACK OUTWARDS by their position in the list: two measures at the same x would be
  // drawn one on top of the other, and the L's left side contains the green piece's own.
  (o.lefts || []).forEach(([y, hh, txt, col, rank], r) => {
    const lx = H - 21 - (rank === undefined ? r : rank) * 40;
    box(lx, y * px, 11, hh * px, 'border:3px solid ' + col +
      '; border-right:none; z-index:9;');
