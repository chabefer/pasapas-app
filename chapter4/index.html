    // ⚠️ The card no longer ENDS the chapter — the eight practice fields come after it, so it
    // hands on. Chapter 3 does the same thing at `eEnd` → `eStock` → Part F, for Sylvain's own
    // reason: the card closes the sitting cleanly on a number, and what follows opens the next
    // one for a child who may be coming back a day later. THE END moved to `e8End`.
    addButton(t('btn_continue'), nextStep);
  },
];

// Part G reasons about Parts E and F, so its steps run on Part E's field (the L that
// Part E built) — the only one of them that lFieldEl is asked to draw.
hFieldSpecs().forEach((F, n) => {
  const fn = hFieldStep(F, n === 0);
  Object.defineProperty(fn, 'name', { value: F.n });   // or the debug bar labels them all "step"
  fn.fieldIndex = F.ai;
  chapterSteps.splice(chapterSteps.findIndex(f => f.name === 'hSchool') + 1 + n, 0, fn);
});

// the page that lays all eight out, then one step per field, before the ending
function e8End() {
  clearGame(); showEliel();
  storyHTML('<div class="speaker">Eliel</div>' +
    '<p>' + t('c4_e8_end') + '</p>' +
    '<p style="text-align:center; font-size:22px; margin-top:14px">' +
    bold(t('c4_g_the_end')) + '</p>');
  stage(e8AllEl(13, true));
  addButton(t('btn_play_again'), () => { currentStep = 0; steps[0](); });
  // ⚠️ THE QUEST CARD MOVED HERE (Sylvain, 2026-09-07), off `gEnd`, which now simply hands on.
  // The eight practice fields are the chapter's real ending, so the card belongs after them —
  // and it fires ON ARRIVAL, over the finished page: closing it reveals THE END and the
  // Play-again button underneath, which is the order Chapter 3's own `hFinal` uses (card,
  // then THE END, then Play again). The overlay is full-screen and modal, so nothing beneath
  // it can be reached until the child closes it.
  celebrate(t('c4_g_celeb'), t('c4_g_celeb_text'));
}

{
  // ⚠️ AFTER `gEnd`, not before it (Sylvain, 2026-08-28): the quest card closes the teaching,
  // and the eight are the practice that closes the chapter.
  const at = chapterSteps.findIndex(f => f.name === 'gEnd') + 1;
  const all = function e8All() {
    clearGame(); showEliel();
    storyHTML('<div class="speaker">Eliel</div>' +
      '<p>' + t('c4_e8_in1') + '</p>' +
      '<p style="margin-top:10px">' + t('c4_e8_in2', { bt: bold(BTIL), ct: bold(CTIL),
        a: bold('a'), one: bold(nw('a = 1')) }) + '</p>');
    stage(e8AllEl());
    addButton(t('btn_continue'), nextStep);
  };
  all.fieldIndex = 3;
  const steps8 = E8.map((F, i) => {
    const fn = e8Step(F, i);
    Object.defineProperty(fn, 'name', { value: 'e8f' + (i + 1) });
    fn.fieldIndex = 3;
    return fn;
  });
  e8End.fieldIndex = 3;
  chapterSteps.splice(at, 0, all, ...steps8, e8End);
}

['gBoth', 'gMove', 'gOne', 'gDash', 'gLine', 'gNeg', 'gTwo', 'gOther', 'gOtherL',
 'gSolve7', 'gSum', 'gEnd',
 'hIntro', 'hLook', 'hName', 'hSolve', 'hGeneral', 'hSchool']
  .forEach(n => { chapterSteps.find(f => f.name === n).fieldIndex = 3; });



// Part E runs on the fourth field throughout.
['eIntro', 'eStuck', 'eCut', 'eHalve', 'eApply', 'eCheck', 'ePerim', 'eSeeds']
  .forEach(n => { chapterSteps.find(f => f.name === n).fieldIndex = 3; });


// Part D walks the three fields in turn, so its steps are bound one at a time.
// ⚠️ The six solve steps are NOT here: they are generated by `dSolveSteps` further
// down and carry their own fieldIndex, because the same six run twice.
[['dFormula', 0], ['dTryA', 0], ['dTryC', 1], ['dHalf', 1],
 ['dNew', 2], ['dRoot', 2], ['dEnd', 0]]
  .forEach(([n, i]) => { chapterSteps.find(f => f.name === n).fieldIndex = i; });


// Part C goes back to the FIRST field, every step of it.
// ---------------------------------------------------------------------------
// CHAPTER 3's ROUND ONE — THE SIX STEPS, BUILT ONCE AND RUN ON BOTH FIELDS
// ---------------------------------------------------------------------------
// Sylvain, 2026-08-27: the area-68 field solves its root "exactly the same way"
// as the 90.25 one. So the six steps are a factory rather than a literal — the
// same code, spliced into the chapter twice and bound to a different field each
// time, exactly as Chapter 3 generates its per-field runs.
//
// ⚠️ NOTHING IN HERE IS DECIDED FROM MODULE STATE. Everything comes off `FIELD`
// at run time, and the block's side off the area — Chapter 3's own rule, and the
// reason `?step=N` and the debug bar stay honest when the two runs interleave.
//
// ⚠️ AND THE TWO RUNS DIVERGE ONLY WHERE THE NUMBERS DO, which is the whole
// pedagogical point of running them the same way:
//   90.25 -> the share is 0.5138…, five tenths fit, and because THIS quest can
//            square a decimal we try 9.5 before rounding — and it is exact.
//   93    -> the share is two thirds, six tenths fit, and nothing will ever
//            check it, so we go finer and round UP. `dRoot` picks that up.
function dSolveSteps(tag) {
  const nOf = () => Math.floor(Math.sqrt(FIELD.C + FIELD.B * FIELD.B));
  const numbers = () => {
    const big = FIELD.C + FIELD.B * FIELD.B, n = nOf();
    return { big: big, n: n, N: dNums(big, n) };
  };
  const name = (nm, fn) => {
    Object.defineProperty(fn, 'name', { value: nm + tag, configurable: true });
    return fn;
  };
  return [
    name('dBlock', function () {
      const { big, n, N } = numbers();
      clearGame(); showEliel();
      // The block's square is NOTATION and is built from `n`, so it stays right on both
      // fields this run is spliced onto rather than being typed for one of them.
      askWithLead(t('c4_d_c_r1', { n: bold(fmtNum(big)), lo: bold(fmtNum(n * n)),
        root: bold(lenLabel(n)),
        sq: bold(nw(fmtNum(n) + '&sup2; = ' + fmtNum(n * n))) }),
        t('c4_d_c_rq1', { eq: bold(nw(fmtNum(big) + ' &minus; ' + fmtNum(n * n))) }),
        N.rem, () => nextStep(),
        t('c4_d_c_rh1', { n: fmtNum(big), lo: fmtNum(n * n) }), { decimal: true });
      stage(rootBlockEl(big, n));
    }),

    // Chapter 2's own "carry the lines across", on the L round the block.
    name('dSplit', function () {
      const { big, n, N } = numbers();
      const v = { n: bold(areaLabel(N.rem)), root: bold(lenLabel(n)), d: bold('d'),
        dd: bold(nw('d &times; d')) };
      clearGame(); showEliel();
      tell(t('c4_d_sp1', v));
      stage(rootBlockEl(big, n));
      addButton(t('c4_d_sp_btn'), () => {
        clearGame(); showEliel();
        tell(t('c4_d_sp2', v));
        stage(dSplitFieldEl(big, n));
        // ⚠️ At DZ a strip is a dozen pixels — a mark, not a place that can hold a
        // label. The three terms go in a legend underneath, each in its own piece's
        // ink, which is Chapter 3's Part B solution to exactly this.
        const st = nw(fmtNum(n) + ' &times; d');
        stage(dLegendEl([
          { fill: REG.b.fill, ink: REG.b.ink, html: st },
          { fill: REG.c.fill, ink: REG.c.ink, html: st },
          { fill: REG.d.fill, ink: REG.d.ink, html: nw('d &times; d') }]));
        addButton(t('c4_d_sp_btn2'), nextStep);
      });
    }),

    // Forget the corner — and watch what that costs, before `dt` is named.
    name('dForget', function () {
      const { big, n, N } = numbers();
      const v = { n: bold(areaLabel(N.rem)), d: bold('d'), dt: bold(DTIL) };
      const go = (html, mode, btn, next) => {
        clearGame(); showEliel(); storyHTML(html);
        stage(dRowEl(big, n, mode)); addButton(btn, next);
      };
      go(lead(t('c4_d_fg1', v)), 'flat', t('c4_d_fg_btn1'), () =>
        go(lead(t('c4_d_fg2')) + '<p style="margin-top:10px">' + t('c4_d_fg3', v) + '</p>',
          'nocorner', t('c4_d_fg_btn2'), () => {
            clearGame(); showEliel();
            tell(t('c4_d_fg4', { dt: bold(DTIL), eq: bold(nw('2 &times; (' + fmtNum(n) +
              ' &times; ' + DTIL + ') = ' + fmtNum(N.rem))) }));
            stage(dRowEl(big, n, 'wide'));
            addButton(t('btn_continue'), nextStep);
          }));
    }),

    // Join the two strips, cut the result at every magic length, and count them.
    name('dJoinCut', function () {
      const { big, n, N } = numbers();
      clearGame(); showEliel();
      tell(t('c4_d_jn1'));
      stage(dRowEl(big, n, 'wide'));
      addButton(t('c4_d_jn_btn1'), () => {
        clearGame(); showEliel();
        tell(t('c4_d_jn2', { dt: bold(DTIL) }));
        stage(dRowEl(big, n, 'join'));
        addButton(t('c4_d_jn_btn2'), () => {
          clearGame(); showEliel();
          askWithLead(t('c4_d_jn3', { dt: bold(DTIL) }), t('c4_d_jn_q'), N.k,
            () => nextStep(), t('c4_d_jn_h', { root: fmtNum(n) }));
          stage(dRowEl(big, n, 'cut', true));
        });
      });
    }),

    // The pile, one magic length wide — and beside it the same ground in the same
    // width, so that its HEIGHT in magic lengths is its area in magic squares.
    // That conversion is the whole reason a leftover can become a length at all.
    name('dTall', function () {
      const { big, n, N } = numbers();
      const area = bold(areaLabel(N.rem));
      clearGame(); showEliel();
      tell(t('c4_d_tl1', { n: bold(fmtNum(N.k)), dt: bold(DTIL) }));
      stage(dRowEl(big, n, 'cut'));
      addButton(t('c4_d_tl_btn'), () => {
        clearGame(); showEliel();
        askWithLead(t('c4_d_tl2', { area: area }), t('c4_d_tl_q', { area: area }),
          N.rem, () => nextStep(), t('c4_d_tl_h'), { decimal: true });
        // ⚠️ "?" on the right-hand measure: it labels the very height being asked for.
        stage(dColsEl(big, n, null, bold(t('c4_lbl_len', { s: '?' }))));
      });
    }),

    // THE DIVISION. The two columns are the same ground, so an `=` stands between them
    // and the equation under it is the line to solve. Then Chapter 3's own answer to a
    // division it cannot compute: keep the two columns on screen, ring one of the pieces,
    // and MEASURE it under the lens — lay tenths along it until one runs past.
    name('dDivide', function () {
      const { big, n, N } = numbers();
      const fits = Math.floor(N.dt * 10);
      const v = { n: bold(fmtNum(N.k)), dt: bold(DTIL), height: bold(lenLabel(N.rem)) };
      const eqHtml = bold(nw(fmtNum(N.k) + ' &times; ' + DTIL + ' = ' + fmtNum(N.rem)));
      clearGame(); showEliel();
      storyHTML('<div class="speaker">Eliel</div>' +
        '<p>' + t('c4_d_dv1', v) + '</p>' +
        '<p style="margin-top:10px">' + t('c4_d_dv2', v) + '</p>');
      stage(dColsEl(big, n, eqHtml));
      addButton(t('c4_d_dv_btn'), () => {
        // The one that runs past is drawn red and LEFT on screen to be looked at, then
        // taken off on a button — Chapter 3's `hLay`, move for move. Nothing advances by
        // itself: a tray holding exactly the right number would answer the question, so
        // the child lays until one overshoots and that is the signal.
        let laid = 0;
        const draw = () => {
          clearGame(); showEliel();
          if (laid <= fits) {
            tell(t(laid ? 'c4_d_lay2' : 'c4_d_lay1', { dt: bold(DTIL) }));
            stage(dLensEl(big, n, laid, false, () => { laid++; draw(); }));
          } else {
            tell(t('c4_d_lay_over'));
            stage(dLensEl(big, n, fits, true, null));
            addButton(t('c4_d_lay_btn'), () => {
              clearGame(); showEliel();
              askInline(t('c4_d_lay_q', { dt: bold(DTIL) }), fits, () => nextStep(),
                t('c4_d_lay_h'));
              stage(dLensEl(big, n, fits, false, null));
            });
          }
        };
        draw();
      });
    }),
  ];
}

// Spliced in AFTER the field-1 run's opening and AFTER the field-2 one's, newest
// first so the earlier index is still valid when the second splice happens.
[['dNew', 2], ['dTryC', 1]].forEach(([after, fi]) => {
  const at = chapterSteps.findIndex(f => f.name === after) + 1;
  const run = dSolveSteps(after === 'dTryC' ? 'B' : 'C');
  run.forEach(fn => { fn.fieldIndex = fi; });
  chapterSteps.splice(at, 0, ...run);
});

['cThree', 'cArea', 'cRoot', 'cSolve', 'cRule'].forEach(n => {
  chapterSteps.find(f => f.name === n).fieldIndex = 0;
});


// Part B runs on the SECOND field. Bound here, not by a line inside each step.
['bIntro', 'bLay', 'bBorder', 'bMeasure', 'bFindS', 'bCheck', 'bStrips', 'bCorner',
 'bAdd', 'bWire', 'bSeeds', 'bWrap'].forEach(n => {
  const fn = chapterSteps.find(f => f.name === n);
  fn.fieldIndex = 1;
});


// Every step runs on ITS OWN field, bound here rather than by a line inside each step —
// which is what keeps ?step=N and the debug jump bar honest: they enter at an arbitrary
// index, in any order, and the geometry has to be right before the step's first line runs.
// Chapter 2 built this at Part F and paid for the retrofit; Chapters 3 and 4 have it from
// screen one, where it costs nothing.
const steps = chapterSteps.map(fn => {
  const idx = fn.fieldIndex === undefined ? CHAPTER_FIELD : fn.fieldIndex;
  const wrapped = function () { setField(idx); return fn.apply(this, arguments); };
  Object.defineProperty(wrapped, 'name', { value: fn.name, configurable: true });
  return wrapped;
});

startGame(steps);

</script>
