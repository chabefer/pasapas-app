    c4_a_lay1: "Vas-y, pose les carrés magiques sur le champ, un par un, et espérons que le compte tombe rond. Parce que si ce n'est pas le cas, je ne vois pas comment on va s'en sortir.",
    c4_a_lay_done: "Voilà le champ entièrement recouvert. Pas un carré de trop, pas un de moins.",
    c4_a_cnt_q: "Alors, combien de carrés magiques a-t-il fallu ?",
    c4_a_cnt_hint: "Compte le bras, puis compte le pied.",
    c4_a_cnt_ok: "{n} — comme les registres de Marimon nous le disaient. Parfait ! Ouf ! Ils disent vrai, tout vieux qu'ils sont. Et en plus, regarde, nous avons aussi eu de la chance pour le carré, non ? Lui aussi est couvert par un nombre pile de carrés magiques. Ce n'était pas gagné.",
    c4_a_cnt_a1: "Ah oui, c'est vrai !",
    c4_a_cnt_a2: "Ah bon ?",


    c4_a_pc1: "Vérifions maintenant qu'en additionnant la surface du carré et des deux rectangles, on retrouve bien l'aire marquée sur les registres de Marimon ({area}).",
    c4_a_fs_q: "Regarde maintenant la partie carrée toute seule. Combien de carrés magiques faut-il pour la recouvrir entièrement ?",
    c4_a_fs_hint: "Trois rangées de trois, et elles sont déjà posées.",
    c4_a_fs_q2: "{n}, oui ! Et combien de longueurs magiques {s} faut-il pour suivre un côté de ce carré ? Est-ce que ça te rappelle quelque chose ?",
    c4_a_fs_a1: "Racine d'herbe",
    c4_a_fs_a2: "Racine carrée",
    c4_a_fs_a3: "Racine du sol",
    c4_a_fs_a4: "Racine cubique",
    c4_a_fs_no: "Pas celle-là. Pense à la forme : c'est le côté qui se trouve à la <b>racine</b> d'un champ <b>carré</b>, et c'est exactement de là que vient le nom.",
    c4_a_fs_q3: "Oui, exactement — la racine carrée. Nous savons donc que {eq}. Alors combien de longueurs magiques vaut la racine carrée de neuf ? Combien de longueurs magiques mesure le côté {s} du carré ?",
    c4_a_fs_h3: "Quel nombre, multiplié par lui-même, donne neuf ?",
    c4_a_fs_ok: "Oui !!! Le côté de la partie carrée vaut <b>3 longueurs magiques</b>. Tu as trouvé {s} !! Bravo !!!",
    c4_a_pc_qsq: "Le carré du coin fait {s} sur {s}. Quelle est son aire ?",
    c4_a_pc_hsq: "Trois FOIS trois, sur la table.",
    c4_a_pc_qrc: "Chacun des deux rectangles fait {b} sur {seq}. Quelle est l'aire de chaque rectangle ?",
    c4_a_pc_hrc: "Cinq FOIS trois.",
    c4_a_pc_ok: "L'aire du champ entier que nous avons calculée avec {seq} vaut donc {eq} — exactement le nombre noté dans les registres de Marimon. Parfait !!",

    c4_a_w1: "Ça y est, on peut calculer la longueur de clôture dont j'aurai besoin pour protéger le champ.",
    c4_a_w2: "Chaque tronçon de la clôture mesure soit {s}, soit {b} — il n'y a rien d'autre là-dehors. J'ai tracé les tronçons de {s} d'une couleur et ceux de {b} d'une autre.",
    c4_a_w_qs: "Combien y a-t-il de tronçons de longueur {s} ?",
    c4_a_w_hs: "Deux d'entre eux sont les petits bouts, et deux se cachent à l'intérieur des grands côtés.",
    c4_a_w_qb: "Et combien de longueur {b} ?",
    c4_a_w_hb: "Compte l'autre couleur.",
    c4_a_w_ok: "Quatre de chaque. La clôture entière vaut donc {eq}.",
    c4_a_wt_q: "Ce qui fait combien de longueurs magiques de fil ?",
    c4_a_wt_hint: "Douze et vingt.",
    c4_a_wt_ok: "{n} longueurs magiques. Voilà le fil acheté.",

    c4_a_no1: "Dis donc, regarde, c'est rigolo, mais ce champ est presque carré, non ?",
    c4_a_no2: "Clique sur la surface qui, si on la rajoutait à ce champ, en ferait un carré.",
    c4_a_no3: "Ce qui est rigolo, c'est qu'ajouter ce coin n'a pas eu le même effet sur la longueur de clôture dont on a besoin que sur le nombre d'arbres qu'on peut planter. Est-ce qu'on a besoin de <b>plus de fil</b> qu'avant pour clôturer ce nouveau grand champ carré ?",
    c4_a_no4: "Oui !!! On n'a pas besoin de plus de fil pour clôturer le nouveau champ carré que pour clôturer le champ en « L » : {eq}, le nombre même que nous venons d'acheter. Et est-ce qu'on peut planter le même nombre d'arbres dans le grand champ carré, ou plus que dans le champ en « L » ?",
    c4_a_no_q: "Exact !! On peut planter plus d'arbres. Combien, à ton avis ? Tu saurais calculer l'aire qu'on a rajoutée ? Elle fait combien de carrés magiques ?",
    c4_a_no_f1: "Oui",
    c4_a_no_f2: "Non",
    c4_a_no_fno: "Regarde la clôture elle-même. Fais le tour de l'encoche, puis le tour du coin que nous venons de boucher. Les deux côtés à l'intérieur sont exactement aussi longs que les deux côtés qu'ils remplaçaient à l'extérieur. Compte encore une fois.",
    c4_a_no_t1: "Moins",
    c4_a_no_t2: "Plus",
    c4_a_no_t3: "Autant",
    c4_a_no_tno: "Regarde le terrain cette fois, pas la clôture. Le champ a grandi : le coin que nous avons bouché, c'est du terrain qui n'y était pas avant, et un arbre a besoin de terrain.",
    c4_a_no_h1: "C'est un carré.",
    c4_a_no_h2: "C'est un carré, et son côté fait {b}.",
    c4_a_no_h3: "C'est un carré de côté cinq, donc son aire vaut {sq}.",
    c4_a_no_ok: "Oui !!! C'est ça ! {n} ! Pas la moindre longueur de clôture en plus, mais vingt-cinq carrés magiques de terrain de plus si on devait planter et clôturer le grand champ carré plutôt que le vrai champ en « L ».",
    c4_a_no_ok2: "Souviens-toi de ce coin. Nous allons le revouloir, et il fera alors quelque chose de bien plus surprenant.",

    c4_a_sd1: "Et les graines sont la partie facile, pour une fois — comme à la dernière quête, et pour la même raison. L'aire est la seule chose que Marimon ait notée.",
    c4_a_sd_q: "Une graine par carré magique. Combien de graines d'arbre faut-il à ce champ ?",
    c4_a_sd_hint: "C'est l'aire, relue dans une autre unité.",
    c4_a_sd_ok: "{n} graines d'arbre, et {n2} longueurs magiques de fil. Un champ de fait.",
    c4_a_sd2: "Cela dit, je vais te confier une chose. Il nous a fallu trente-neuf carrés magiques posés un par un pour trouver un seul nombre, et nous ne nous en sommes tirés que parce que le compte tombait rond. Et, avec Marimon, nous avons trouvé d'autres champs en « L ». Comment on va s'en sortir ?",
    c4_a_sd_b1: "T'inquiète, on va y arriver !",
    c4_a_sd_b2: "Mince, c'est vrai que c'est compliqué.",

    c4_b_in1: "Tiens, regarde par exemple, ce champ-ci.",
    c4_b_in2: "Le grand côté des rectangles vaut {b} cette fois. Et l'aire… {area}.",
    c4_b_in4: "De toutes façons, virgule ou pas, ça ne change rien à notre problème. Combien vaut {s} ? On essaye la même approche ? On recouvre, et on compte ?",
    c4_b_in_b1: "Allez !",
    c4_b_in_b2: "Bof, c'est pas très pratique tout ça !",

    c4_b_lay1: "Pose les carrés magiques. Autant qu'il en faudra.",
    c4_b_lay_ref: "Il n'y a plus de place pour lui. Regarde le long du bas et le long de la gauche — il reste une <b>bordure</b> de terre nue tout autour de l'extérieur, et elle est plus mince qu'un carré magique. Pas un de plus n'y entrera.",
    c4_b_lay_done: "Voilà tous les carrés magiques entiers qui pouvaient tenir.",
    c4_b_cnt_q: "Combien de carrés magiques entiers as-tu réussi à poser ?",
    c4_b_cnt_hint: "Neuf debout le long du bras, et huit couchés le long du pied.",
    c4_b_cnt_ok: "{n}. Et les registres de Marimon disent {area}, donc nous n'avons pas fini — il reste encore la bordure à couvrir.",

    c4_b_bd1: "Voici la bordure toute seule, en trois morceaux : une <b>bande à gauche</b>, une <b>bande en bas</b>, et le <b>petit carré</b> là où les deux se rejoignent.",
    c4_b_bd2: "Et les deux bandes ont la même forme l'une que l'autre — l'une debout, l'autre couchée. Cela va nous épargner du travail dans un instant.",
    c4_b_bd3: "Mais d'abord : tout ici dépend de la largeur de cette bordure. Mesurons-la.",

    c4_b_ms1: "Posons la loupe sur le bord du haut de cette bande, là où il file bien droit. Au-dessus, une longueur magique coupée en ses dix dixièmes, pour mesurer. Pose des dixièmes le long du bord jusqu'à en atteindre le bout.",
    c4_b_ms_q: "Combien de dixièmes a-t-il fallu ?",
    c4_b_ms_hint: "Compte ce que tu as posé.",
    c4_b_ms_ok: "{five} dixièmes, et pas une miette qui dépasse. La bordure fait donc {half} de longueur magique de large — {dec}, comme nous avons appris à écrire la moitié d'une longueur magique dans notre dernière aventure.",

    c4_b_fs1: "Regarde : {s}, c'est la largeur du rectangle, qui est égale à 1 longueur magique plus la largeur de la bande jaune que nous venons de calculer.",
    c4_b_fs_q: "Alors, combien vaut {s} ?",
    c4_b_fs_hint: "Une longueur magique entière, et la moitié d'une autre.",
    c4_b_fs_ok: "{seq}. Voilà notre réponse — si nous ne nous sommes pas trompés en mesurant la bande jaune. Ce serait bien de vérifier si on obtient bien l'aire notée dans les registres de Marimon, non ?",
    c4_b_fs_b1: "Bonne idée !!",
    c4_b_fs_b2: "Mouais. Mais juste si les registres sont corrects.",

    c4_b_ck1: "Et nous pouvons le vérifier, puisque Marimon nous a donné l'aire. Si la bordure fait vraiment {dec} de large, le champ entier doit valoir {area} exactement. Comptons la bordure, et nous verrons.",
    c4_b_ck2: "La bordure est mince, alors nous la comptons en <b>centièmes de carré magique</b> — les petits carrés que nous avions découpés sur le champ étrange. Et souviens-toi comment les deux unités vont ensemble : on mesure un côté en <b>dixièmes de longueur magique</b>, et l'aire tombe en <b>centièmes de carré magique</b>.",

    c4_b_st1: "Prenons la bande <b>jaune</b> d'abord. Elle fait {dec} longueur magique de large — c'est-à-dire {five} <b>dixièmes de longueur magique</b> — et elle monte sur {nine} le long du champ.",
    c4_b_st_q1: "Combien de dixièmes de longueur magique tiennent le long de ces {nine} ?",
    c4_b_st_h1: "Dix dixièmes par longueur magique.",
    c4_b_st_q2: "Alors, combien de centièmes de carré magique fait la bande jaune ? (et souviens-toi, si tu multiplies des <b>dixièmes de longueur magique</b>, tu auras le résultat en <b>centièmes de carré magique</b>).",
    c4_b_st_h2: "Cinq FOIS neuf font quarante-cinq — puis on ajoute le zéro.",
    c4_b_st_ok: "{eq} centièmes de carré magique.",

    c4_b_st2_q: "Et la bande <b>verte</b>, c'est le même rectangle, tourné sur le côté. Combien fait-elle de centièmes de carré magique ?",
    c4_b_st2_h: "La même chose que celle que nous venons de faire.",
    c4_b_st2_ok: "La même chose, bien sûr — {n}. Faire pivoter un morceau de terrain ne change pas son aire.",

    c4_b_co_q: "Reste le petit carré du coin. Il fait {five} <b>dixièmes de longueur magique</b> de chaque côté, alors combien de <b>centièmes de carré magique</b> recouvre-t-il ?",
    c4_b_co_h: "Cinq FOIS cinq.",
    c4_b_co_ok: "{n}.",

    c4_b_tt_q: "La bordure entière vaut donc {eq} — ce qui fait combien de centièmes de carré magique ?",
    c4_b_tt_h: "Neuf cents, et vingt-cinq de plus.",
    c4_b_tt_ok: "Oui ! Bravo !! {n} centièmes de carré magique ! C'est ça ! Et souviens-toi, comme cent centièmes de carré magique font un carré magique, pour passer de l'aire mesurée en centièmes de carré magique à l'aire mesurée en carrés magiques, il suffit de déplacer la virgule de deux rangs : {conv}.",

    c4_b_ad_q: "{whole} carrés magiques entiers, et {part} de plus. Combien fait le champ en tout ?",
    c4_b_ad_h: "Ajoute le quart à la fin.",
    c4_b_ad_ok: "{n}, exact !! C'est bien le nombre noté dans les registres de Marimon, au centième près. Donc, notre calcul était juste, et {s} est bien égal à {len}.",

    c4_b_wr_q: "Maintenant, calculons la longueur de fil nécessaire pour clôturer le champ : quatre longueurs de {s}, plus quatre de {b}. On va avoir besoin de combien de longueurs magiques de fil pour clôturer le champ, en tout ?",
    c4_b_wr_h: "Quatre demis font deux, donc quatre fois {s} font six.",
    c4_b_wr_ok: "{eq}. Acheté.",

    c4_b_sd_q: "Alors, combien de graines peut-on semer dans ce champ ?",
    c4_b_sd_h: "{whole} dans les carrés magiques entiers, et {plots} sur les lopins découpés.",
    c4_b_sd_ok: "{n} graines d'arbre, bravo ! {whole} dans les carrés magiques, et {plots} dans les surfaces de Marimon qui ont la même aire qu'un carré magique. Et puis, il y a un petit carré tout au bout, trop petit pour y planter un arbre. Tu te souviens qu'on aime bien y planter des fleurs ?",

    c4_b_sd1: "Et maintenant comptons les graines dont nous avons besoin. Une par carré magique — mais souviens-toi de la règle de Marimon, que nous avons apprise dans notre aventure avec les champs étranges : une graine d'arbre a besoin d'une surface égale à un carré magique entier, <b>d'un seul tenant</b>, quelle que soit sa forme. Pas besoin de planter une graine d'arbre dans un carré, tant que la surface, même biscornue, est d'un seul tenant, et couvre la même aire qu'un carré magique.",
    c4_b_sd1b: "À ton avis, combien de graines d'arbres allons-nous pouvoir planter dans ce champ ? Est-ce que tu veux que je te dessine les surfaces de Marimon pour t'aider ?",
    c4_b_sd_b1: "Oui !",
    c4_b_sd_b2: "Pas besoin.",
    c4_b_sd2: "Et voilà ! Les surfaces de Marimon, 100 centièmes de carré magique chacune, sont découpées. Il reste juste un petit carré au fond qui est plus petit qu'un carré magique.",
    c4_b_fl_q: "Une graine de fleur a besoin d'un <b>carré à fleurs</b> — un centième de carré magique. Combien de graines de fleurs peut-on semer sur la surface restante, dans le petit coin en bas à droite ?",
    c4_b_fl_h: "Un quart de carré magique, compté en centièmes.",
    c4_b_fl_ok: "{n} graines de fleur. Voilà donc le champ entier acheté : <b>{trees} graines d'arbre</b>, <b>{n} graines de fleur</b>, et <b>{wire} longueurs magiques</b> de fil. Pas une miette de gâchée.",
    c4_b_wp1: "Pffou !! Bin dis-donc ! Ça n'a pas été simple. On a dû poser 17 carrés magiques un par un, mesurer la largeur de la bande de terrain restante en dixièmes de longueur magique, compter neuf cent vingt-cinq centièmes de carré magique pour vérifier si on retombait sur nos pieds. Tout ça pour trouver <b>s</b>.",
    c4_b_wp2: "Et en plus, on a eu de la chance que la largeur de la bande jaune soit exactement de cinq dixièmes. Si elle était tombée sur quatre dixièmes et des poussières, nous serions encore en train de la mesurer.",
    c4_b_wp3: "Marimon et moi, on a trouvé encore d'autres champs de ce type à replanter, et je n'ai pas envie de devoir répéter toutes ces étapes pour chacun d'entre eux. Ce serait génial s'il y avait une manière plus rapide de faire, non ? Tu sais, un peu comme celle qu'on a utilisée pour mesurer la racine carrée ? T'en penses quoi ?",

    supply_tenths: "Tes dixièmes de longueur magique — clique sur la bande pour les poser :",
    c4_b_wp_b1: "Oh oui, ce serait génial !!",
    c4_b_wp_b2: "Mouais, j'y crois pas trop, c'est super compliqué.",
    c4_c_rl1: "Voici l'astuce en mots, avant de l'écrire.",
    c4_c_rl2: "Un champ en L, c'est <b>un carré avec un coin en moins</b>. Le coin en moins est un carré lui aussi, et la longueur de son côté est la longueur inscrite dans les registres de Marimon, donc on peut déduire l'aire du carré manquant sans même avoir à la mesurer.",
    c4_c_rl3: "Une fois que nous avons rempli le champ en L avec le coin qui lui manque, nous avons un autre <b>carré</b>, plus grand, et nous en connaissons l'aire. On prend sa racine carrée et nous avons le côté entier, {sum}. On en retire les {bn}, et ce qui reste, c'est {s}.",
    c4_c_rl4: "Remplir, prendre la racine, retirer les {bn}. C'est tout — et cela marchera sur chaque champ en L.",

    c4_c_yes: "Oui",
    c4_c_no: "Non",
    c4_c_n1: "Regarde, c'est le premier champ en « L » avec lequel on a commencé cette aventure. Si on voulait utiliser notre astuce de la racine carrée, il nous faudrait connaître l'aire d'un <b>carré</b>. On les passe en revue, pour voir ?",
    c4_c_n1_a1: "Allez !",
    c4_c_n1_a2: "Y'a plusieurs carrés ? T'es pas bien ou quoi ?",
    c4_c_n2: "Déjà, le carré de côté {s}. Ce serait le plus pratique si on pouvait trouver son aire, mais ça me semble mort, non ? On sait juste qu'elle est plus petite que {area}, c'est tout. Ça nous dit pas grand-chose. T'es d'accord ?",
    c4_c_n3: "Y'a un autre carré qu'on a déjà vu : celui du coin en haut à droite. Il n'est pas dans le champ, mais au moins, on connaît son aire. Tu t'en souviens ?",
    c4_c_n3_q: "Ce petit carré du coin, ça fait combien de carrés magiques ?",
    c4_c_n3_h: "Son côté fait 5 longueurs magiques, et 5 rangées de 5.",
    c4_c_n4: "Yes !! {corner}. Et le côté de ce carré, ça fait combien ?",
    c4_c_n4_q: "Le côté du carré du coin, ça fait combien de longueurs magiques ?",
    c4_c_n4_h: "Quel nombre, multiplié par lui-même, donne 25 ?",
    c4_c_n5: "Oui !! Bravo !! Mais est-ce que ça nous aide beaucoup, ça, ou est-ce qu'on le savait déjà ?",
    c4_c_n5_a1: "Ça nous aide beaucoup !",
    c4_c_n5_a2: "On le savait déjà !",
    c4_c_n6: "Ça sert à rien de connaître l'aire du carré en haut à droite si on s'en sert pour déduire le côté du rectangle, qu'on connaît déjà. Bon. On n'est pas très avancés. À ton avis, il y a encore un carré dans cette figure dont on pourrait connaître l'aire, et dont la racine nous donnerait une longueur qu'on ne connaît pas déjà ?",
    c4_c_n7: "Voyons. Le grand carré là, qu'on a formé en regroupant le champ en « L » et le carré du haut à droite, tu connais son aire par hasard ?",
    c4_c_n7a: "OK, OK, tu vois grand, c'est bien.",
    c4_c_n7a_q: "Alors, tu penses qu'il couvre combien de carrés magiques, ce grand champ carré ?",
    c4_c_n7a_h: "Le champ en « L » et le carré du coin, mis ensemble.",
    c4_c_n7b: "OK, tu y vas prudemment, tu as raison. Bon, on a qu'à le découper en morceaux et voir si on connaît leur aire. Tiens, prends le « L ».",
    c4_c_n7b_q: "C'est quoi, l'aire du champ en « L » ?",
    c4_c_n7b_h: "Elle est notée dans les registres de Marimon.",
    c4_c_n7c: "OK, parfait. Et maintenant, le carré en haut à droite.",
    c4_c_n7c_q: "C'est quoi, son aire ?",
    c4_c_n7c_h: "5 sur 5.",
    c4_c_n7d: "Yes !! Et on est d'accord que l'aire du grand carré, c'est pile l'aire du « L » plus l'aire du coin en haut à droite ?",
    c4_c_n7d_a1: "Oui, bien sûr !",
    c4_c_n7d_a2: "Heu, vraiment ?",
    c4_c_n7e: "Oui, c'est bien la somme des deux aires, donc {eq}.",
    c4_c_n7e_q: "{eq}, ça fait combien ?",
    c4_c_n7e_h: "Trente-neuf et vingt-cinq.",
    c4_c_n7_ok: "Ok !! Bravo !! L'aire du grand carré, c'est {big}. Bon, est-ce que, si on prend sa racine, ça nous permet de trouver une longueur qu'on ne connaît pas ?",
    c4_c_n8: "C'est quoi, la longueur du côté de ce grand carré ?",
    c4_c_n8_no: "Regarde le côté du grand carré sur toute sa longueur : il fait {s}, et puis les 5 longueurs magiques du coin. C'est donc les deux mis bout à bout.",
    c4_c_n9: "Oui !!! Yes !! Attends, mais là, c'est magique, ou quoi ? Est-ce que si on connaît {sum}, on peut retrouver {s} ?",
    c4_c_n10: "Bin, si on connaît {rt}, il suffit de calculer la racine de {n}, la longueur du côté du grand carré, et d'en retirer les 5 longueurs magiques qui appartiennent au côté du rectangle, pour retrouver {s}, non ?",
    c4_c_n10_a1: "Oui ! C'est de la magie ou quoi ?!",
    c4_c_n10_a2: "Hein, attends, quoi ?",
    c4_c_n11: "On va y aller doucement. Prenons d'abord la racine de {n}.",
    c4_c_n11_q: "{n}, ça fait combien ?",
    c4_c_n11_h: "Quel nombre, multiplié par lui-même, donne {n} ?",
    c4_c_n11_ok: "Oui !!! {eq} — {eight} ! C'est la longueur totale du côté du grand carré.",
    c4_c_n12: "Mais attends, ce côté, c'est 5 longueurs magiques de plus que {s}.",
    c4_c_n12_q: "Donc c'est quel nombre, qui fait que {eq} ?",
    c4_c_n12_h: "{bn} et combien de plus font {eight} ?",
    c4_c_n13: "Oui ! Exact ! {eq}. On dit que 3 est égal à 8 <b>moins</b> 5, parce qu'on a enlevé 5 à 8 pour le trouver, et on écrit {seq}.",
    c4_c_n13b: "Mais attends, on a résolu le problème sans rien mesurer, là, non ? Juste à partir des nombres qu'on a trouvés dans les registres de Marimon, pas vrai ?",
    c4_c_n13_a1: "Oui, incroyable !",
    c4_c_n13_a2: "Attends, j'arrive pas à y croire, c'est pas possible !",
    c4_d_w1: "Remplir, prendre la racine, retirer les {b}. Trois étapes, qui marcheront avec n'importe quel champ en L. Pour nous en souvenir facilement, on va les écrire dans une seule ligne de calcul, ce qu'on appelle une <b>formule mathématique</b>. Et pour que cette formule marche pour tous les champs en L, on va utiliser des lettres à la place des quantités qu'on connaît : comme ça, pour chaque champ, on n'aura qu'à remplacer les lettres par les valeurs qu'on tirera des registres de Marimon.",
    c4_d_w2: "L'aire du champ en L, nous l'appellerons {a}. C'est la lettre dont nous nous sommes servis pour désigner l'aire des champs carrés, dans notre dernière quête, et ici aussi, elle désigne l'aire du champ notée dans les registres. La longueur du côté de chaque rectangle, on la notera {bb}. Elle est aussi notée dans les registres de Marimon. Le côté que nous cherchons, on l'appelle {s} depuis toujours, pas vrai ? Alors on continue, pas de raison de changer.",
    c4_d_w3: "Alors <b>remplir</b>, cela s'écrit {f1} — le champ, plus le coin que nous ajoutons.",
    c4_d_w4: "<b>Prendre la racine</b>, cela s'écrit {f2} — le côté entier du carré que nous venons de fabriquer.",
    c4_d_w5: "Et <b>retirer les {bb}</b> nous laisse ceci :",
    c4_d_w6: "Voilà toute la méthode, sur une seule ligne.",
    c4_d_w7: "Essayons-la sur un champ dont nous connaissons déjà la réponse, et voyons si elle dit vrai.",
    c4_d_w_btn: "Essaie-la sur le premier champ !",
    c4_d_a1: "Le premier champ : {a} vaut {av}, {bb} vaut {bv}.",
    c4_d_a_q: "{eq}. Combien vaut {s} ?",
    c4_d_a_h: "Trente-neuf et vingt-cinq, puis la racine, puis on retire cinq.",
    c4_d_a_ok: "{eq} — notre formule marche !! Et cette fois-ci, pas besoin de poser trente-neuf carrés magiques à la main un par un pour trouver le résultat : on lit les deux chiffres inscrits dans les registres de Marimon, on applique notre formule, et boum !! Le résultat tombe.",
    c4_d_c1: "Passons au deuxième champ, celui qui nous a coûté toutes ces mesures. {a} vaut {av}, {bb} vaut {bv}.",
    c4_d_c_q: "Alors, qu'y a-t-il sous la racine ?",
    c4_d_c_h: "L'aire, et le coin, qui fait huit FOIS huit.",
    c4_d_c2: "{n}. Et là, nous rencontrons du nouveau : {n} n'est pas sur la table du chapitre 1. {lo}, c'est pas assez. {hi}, c'est trop.",
    c4_d_c3: "La longueur du côté du grand carré se trouve donc quelque part entre neuf et dix — et c'est <b>exactement</b> ce que nous avons appris à faire dans notre dernière quête : trouver la racine carrée même quand elle ne tombe pas pile sur un nombre tout rond. (Ces nombres tout ronds, sans chiffres après la virgule, on les appelle des <b>entiers</b> : c'est plus court et plus précis que « nombre tout rond » ou « nombre qui tombe pile ».) Nous savons donc quoi faire. Posons le plus grand carré qui tienne, et partageons ce qui reste.",
    c4_d_c_btn0: "Pose les quatre-vingt-un !",
    c4_d_c_r1: "Le plus grand carré qui tienne dans {n}, c'est {lo}, qui fait {root} de côté. Ce qui reste court en deux bandes, une en haut et une sur le côté. Tu te souviens comment on fait ? On calcule l'aire de cette bande, puis on essaye de trouver son épaisseur. Commençons par l'aire : c'est l'aire totale du grand carré moins {sq}.",
    c4_d_c_rq1: "{eq}. Combien reste-t-il de terrain ?",
    c4_d_c_rh1: "Retire {lo} de {n}.",
    c4_d_sp1: "Il reste {n} de terrain, tout autour du bloc. Et ce sont les trois mêmes morceaux que toujours : une bande en haut, une bande sur le côté, et le petit carré du coin, là où elles se rejoignent.",
    c4_d_sp_btn: "Prolonge les traits !",
    c4_d_sp2: "Les voilà. Deux bandes, longues de {root} et larges de {d} — et le coin, {dd}, le morceau que tout le monde oublie. Enlevons-les du bloc et étalons-les à plat.",
    c4_d_sp_btn2: "Étale-les à plat !",
    c4_d_fg1: "Deux bandes et un coin, et ensemble ils font tout le {n}. Or le coin est un carré de côté {d}, et {d}, c'est précisément ce que nous cherchons. Impossible de travailler avec. Alors faisons comme la quête précédente : <b>oublions-le</b>.",
    c4_d_fg_btn1: "Oublie le coin !",
    c4_d_fg2: "Et voilà que les deux bandes ne suffisent plus. Il leur manque exactement le coin que nous venons d'oublier.",
    c4_d_fg3: "Les bandes doivent donc compenser toutes seules : chacune s'élargit d'un cheveu, jusqu'à ce qu'à elles deux elles recouvrent tout le reste. Cette nouvelle largeur n'est plus {d}, alors elle reçoit un nom bien à elle — {dt}, un peu plus grand que {d}.",
    c4_d_fg_btn2: "Élargis les bandes !",
    c4_d_fg4: "{eq}, exactement. Pas le moindre <b>à peu près</b> dans cette ligne : {dt}, c'est ce que les bandes doivent mesurer pour qu'elle soit vraie.",
    c4_d_jn1: "Deux bandes de même largeur, posées côte à côte. Mettons-les bout à bout et cela ne fait plus qu'une seule longue bande — le même terrain, d'un seul tenant.",
    c4_d_jn_btn1: "Mets-les bout à bout !",
    c4_d_jn2: "Une bande, large de {dt}. Et une bande pareille, c'est une rangée de morceaux longs chacun d'une longueur magique — coupons-la donc à chaque longueur magique, exactement comme nous découpons un champ en carrés magiques.",
    c4_d_jn_btn2: "Coupe à chaque longueur magique !",
    c4_d_jn3: "Voilà. Chacun d'eux long d'une longueur magique, et chacun large de {dt}.",
    c4_d_jn_q: "Cela fait combien de morceaux ?",
    c4_d_jn_h: "{root} pour une bande et {root} pour l'autre.",
    c4_d_tl1: "{n} morceaux, tous longs d'une longueur magique et larges de {dt}. Empilons-les les uns sur les autres : cela fait une bande haute et mince, large d'<b>une seule longueur magique</b>.",
    c4_d_tl_btn: "Empile-les !",
    c4_d_tl2: "Et maintenant l'autre moitié de l'affaire. Tout ce terrain qui restait — {area} — poussé lui aussi dans une bande large d'<b>une longueur magique</b>. Même terrain, même largeur. Donc même hauteur.",
    c4_d_tl_q: "Une bande large d'une longueur magique, qui contient {area}. Combien mesure-t-elle de longueurs magiques de haut ?",
    c4_d_tl_h: "Une longueur magique de large, donc chaque longueur magique de hauteur fait un carré magique de terrain.",
    c4_d_dv1: "Les voilà côte à côte, exactement aussi hautes — {n} de nos morceaux à gauche, {height} à droite. Même terrain, même largeur : nous avons donc le droit d'écrire un signe égal entre les deux.",
    c4_d_dv2: "Et voilà la ligne vers laquelle nous travaillions depuis le début. {n} fois {dt} font {height}. Alors, combien mesure une seule fois {dt} ?",
    c4_d_dv_btn: "Prends-en un et mesure-le !",
    c4_d_lay1: "Voici un des morceaux tout seul, en très gros. Nous faisons ce que nous faisons toujours avec une longueur que nous ne savons pas nommer : nous posons nos unités le long et nous comptons. Clique pour poser un dixième de longueur magique.",
    c4_d_lay2: "Continue. Clique pour poser le dixième suivant.",
    c4_d_lay_over: "Et celui-là dépasse franchement au bout. Un bout de trop : on l'enlève !",
    c4_d_lay_btn: "Retire-le !",
    c4_d_lay_q: "Alors, combien de dixièmes entiers tiennent le long de {dt} ?",
    c4_d_lay_h: "Compte ceux qui sont descendus avant le rouge.",
    c4_d_c_r3: "Il en tient cinq, et le sixième dépasse. Le côté du grand carré vaut donc plus de {lo9} et moins de {hi9}.",
    c4_d_c_r4: "Comme dans notre quête précédente, on pourrait prendre un centième de plus pour être sûr qu'on aura assez de fil, et écrire <b>à peu près</b>. Mais là, j'ai comme une intuition. J'aimerais vérifier si {half} n'est pas exactement égal à {rt}. Ça te va qu'on essaye de voir si c'est la bonne longueur ?",
    c4_d_c_btn: "Allez, on essaye !",
    c4_d_c4: "{eq}. Cela tombe exactement juste. La racine vaut donc bien {half}.",
    c4_d_c_q2: "{eq}. Alors, combien vaut {s} ?",
    c4_d_c_ok2: "Bon, j'ai un peu triché parce que mon intuition était juste le résultat qu'on avait trouvé en posant tous les carrés ;) Mais regarde, c'est pas grave, parce que si on refait un coup d'approximation, comme on a appris à le faire dans notre quête précédente, on trouve {s2}, et ça, c'est quand même quasiment pareil que {sv}, et juste un peu au-dessus, comme ça on aurait été sûrs de pas manquer de fil.",
    c4_d_c_h2: "Retire les huit de neuf et demi.",
    c4_d_c_ok: "{seq}. Notre formule marche !! On retrouve le même nombre qu'on avait déjà calculé, mais cette fois-ci, sans avoir à poser un seul carré magique, juste en lisant les deux chiffres inscrits dans les registres de Marimon, et en les injectant dans notre formule.",
    c4_d_n1: "Et maintenant un champ auquel nous n'avons jamais touché. Les registres de Marimon disent que son aire est de {av}, et que le côté des rectangles mesure {bv}. Allez, on applique la formule direct, sans poser les carrés magiques un par un.",
    c4_d_n_q: "Qu'y a-t-il sous la racine ?",
    c4_d_n_h: "Soixante-huit, et cinq FOIS cinq.",
    c4_d_n2: "{n}. Encore une racine carrée qui ne tombe pas pile, il me semble, non ? {lo}. 9 est trop petit. {hi}. Alors, on est repartis, on utilise les astuces qu'on a apprises pendant notre quête précédente.",
    c4_d_n_btn: "La racine de quatre-vingt-treize !",
    c4_d_r2: "{tenths} dixièmes tiennent le long de {dt}, et le suivant a dépassé. {dt} vaut donc plus de {tenths} dixièmes et moins de {next} — et cette fois, ça ne va pas tomber pile comme 1,5 dans le champ en L qu'on a vu juste avant. {eq} ne tombe jamais juste, aussi loin qu'on aille. En fait, ce nombre est égal à {frac} (qu'on appelle généralement <b>deux tiers</b>), mais je t'expliquerai une autre fois pourquoi, si j'ai le temps. Pour l'instant, on va faire comme dans la quête précédente : on va aller un cran plus fin, en posant des centièmes, et, pour être tranquilles et être sûrs d'avoir assez de fil pour faire le tour du champ, on va en prendre un de PLUS, pour que notre réponse soit assez grande.",
    c4_d_r_btn: "Regarde de plus près encore !",
    c4_d_rh2a: "Voici le bout qui restait, tout seul et plus gros encore. Pose maintenant des <b>centièmes</b> le long : clique pour en poser un.",
    c4_d_rh2b: "Continue. Clique pour poser le centième suivant.",
    c4_d_rh_q: "Combien de centièmes entiers tu as pu poser ?",
    c4_d_rh_h: "Compte ceux qui tenaient avant le rouge.",
    c4_d_rh_ok: "{dt} vaut donc plus de {lo} et moins de {hi}. Cela ne tombe toujours pas juste — et cela ne tombera jamais juste. Mais on a dit qu'on prendrait un peu plus, pour être sûr d'avoir assez de fil (on dit qu'on <b>arrondit vers le haut</b>).",
    c4_d_r_q2: "Alors, qu'écrivons-nous pour {dt} ?",
    c4_d_r_h2: "Deux tiers, cela fait 0,666 et ainsi de suite sans fin. Arrondis vers le HAUT, pour que la réponse reste assez grande.",
    c4_d_r3: "{eq}. Voilà la racine, à peu de chose près — et, avec ce qu'on a appris dans la quête précédente, on pourrait refaire un tour et l'approcher de plus près encore. Mais ça suffira bien comme ça.",
    c4_d_r_q3: "{eq}. Alors, combien vaut {s} ?",
    c4_d_r_h3: "Retire les cinq.",
    c4_d_r_ok: "{seq}. Notre premier <b>à peu près</b> de tout ce chapitre — et un à peu près suffit bien, tant qu'il est vers le haut, et que la réponse est un peu trop grande, puisqu'on peut toujours couper du fil et jamais l'étirer.",
    c4_d_wr1: "Puis la clôture, comme toujours : quatre côtés de {s} et quatre côtés de {bb}. Ça fait donc {eq}. Commençons par la partie facile.",
    c4_d_wr_q1: "{eq1}, ça fait combien ?",
    c4_d_wr_h1: "Quatre fois cinq.",
    c4_d_wr2: "Vingt, oui. Maintenant {eq2}. Celui-là est un peu gros pour notre table — mais on connaît une astuce : {split}, et multiplier par une somme, c'est multiplier chaque morceau et tout additionner. C'est la <b>distributivité</b>, de la quête du champ étrange.",
    c4_d_wr_q2: "Prenons le morceau facile d'abord : {eq2a} ?",
    c4_d_wr_h2: "Quatre fois quatre.",
    c4_d_wr3: "Seize. Il reste {eq3}. Et tu te souviens ? {frac67}, c'était notre {frac} — alors {chain}.",
    c4_d_wr_q3: "{eq3b}, ça fait combien, arrondi vers le haut ?",
    c4_d_wr_h3: "Huit partagé en trois : deux, et deux tiers qui restent.",
    c4_d_wr4: "Bien. On a donc nos trois morceaux : {eq4}.",
    c4_d_wr_q4: "{eq4}, ça fait combien de fil en tout ?",
    c4_d_wr_h4: "Vingt, et seize, et 2,67.",
    c4_d_wr_ok: "{eq} longueurs magiques. Un peu plus que ce que le champ demande vraiment, et c'est le bon sens dans lequel se tromper.",
    c4_d_e1: "Trois champs en L, et grâce à notre formule, pas besoin de poser un seul carré magique pour retrouver {s} : on lit {a} et {bb} dans les registres de Marimon, on applique la formule, et boum ! Le résultat tombe.",
    c4_d_e2: "Une seule formule, qui tient sur une ligne : {f}. Elle marche toujours, que la réponse tombe pile ou non.",
    c4_d_e3: "Et tu as vu tout ce qui la fait marcher. Un L, c'est un carré avec un coin en moins. Remplis le coin et tu as un carré. Et un carré livre son côté à qui sait trouver une racine — et trouver des racines, on sait faire depuis notre dernière quête ensemble, pas vrai ? Ça nous fait même pas peur ;)",
    c4_d_celeb: "Tu as transformé une forme en formule !",
    c4_d_celeb_text: "Trois champs en L résolus à partir de leur seule aire — et le dernier par une méthode qu'aucun recouvrement n'aurait jamais pu atteindre.",

    c4_e_in1: "Marimon et moi avons trouvé un nouveau type de champ pour lequel nous n'arrivons pas à déterminer le périmètre, et donc combien de fil acheter pour le clôturer. Le champ est simplement <b>un rectangle posé sur un carré</b>. On connaît l'aire totale du champ ({area}), la longueur du rectangle ({r}), mais pas le côté du carré.",
    c4_e_in2: "C'est comme si on avait enlevé une des branches du L, et conservé l'autre. Il nous manque juste {s} pour retrouver le périmètre total du champ et décider combien de fil acheter. Tu vois comment on pourrait faire ?",
    c4_e_in_a1: "Hmmmm, je suis pas sûr.",
    c4_e_in_a2: "Alors là, je vois pas du tout.",
    c4_e_st1: "Notre astuce — trouver un grand champ carré dont nous connaissons l'aire et dont nous savons trouver facilement la racine carrée, puis retirer la longueur du rectangle du côté — marchait pour les champs en <b>L</b>, pas pour les rectangles posés sur des champs carrés. Que pouvons-nous faire ?",
    c4_e_st2: "À moins que…",
    c4_e_st_btn: "À moins que quoi ?",
    c4_e_cut1: "À moins que nous le <b>coupions en deux</b>.",
    c4_e_cut_btn: "Coupe-le en deux !",
    c4_e_cut2: "Deux moitiés, chacune de {s} de large et de {half} de longueur. Et maintenant, qu'est-ce qu'il va se passer si je bascule celle du dessus et que je la place le long du carré ?",
    c4_e_cut_a1: "Hmmm, je vois pas.",
    c4_e_cut_a2: "Attends, dis-moi pas que...",
    c4_e_mv1: "Voilà. Un carré, un rectangle au-dessus, et le même rectangle à côté. <b>C'est notre L</b> — la forme pour laquelle nous savons déjà trouver {s}.",
    c4_e_mv2: "Et nous n'avons ajouté ni retiré un pouce de terrain. C'est le même champ, disposé autrement : toujours {area}.",
    c4_e_b1: "Mais regarde ce qui est arrivé au nombre que nous introduisons dans notre formule : le rectangle faisait {r} de longueur. Chaque moitié fait {half}.",
    c4_e_b2: "Donc, quand le rectangle est tout entier au même endroit, avec une longueur totale de {bb} — ici {bv} — on le <b>coupe d'abord en deux</b>, de sorte que {beq}, ici {bh}. Et ensuite c'est le champ en <b>L</b> que nous savons déjà faire, avec {beq}.",
    c4_e_b3: "Donc, la nouvelle formule pour ces champs dont on connaît l'aire totale {a}, et qui sont faits d'un carré {sq} avec un rectangle dont on connaît la longueur {bb} posé dessus, c'est :",
    c4_e_ap_q: "{eq}. Combien vaut {s} ?",
    c4_e_ap_h: "Vingt et un et quatre font vingt-cinq. Quelle est la racine de vingt-cinq ?",
    c4_e_ap_ok: "{eq}.",
    c4_e_ck1: "Et nous pouvons vérifier sans rien déplacer. Remets les moitiés d'où elles viennent : le champ fait {s} de large, et {s} plus {r} de haut.",
    c4_e_ck_q: "Quelle est donc son aire ?",
    c4_e_ck_h: "Trois de large et sept de haut.",
    c4_e_ck_ok: "{eq} — le nombre inscrit dans les registres de Marimon. La formule marche !!",
    c4_e_pr1: "De quelle longueur de fil avons-nous besoin pour clôturer ce champ, alors ?",
    c4_e_pr_q: "Le champ est un rectangle, {w} de large et {h} de haut. Ça, tu sais faire, les doigts dans le nez ;)",
    c4_e_pr_h: "Deux fois chaque côté.",
    c4_e_pr_ok: "{eq} longueurs magiques.",
    c4_e_sd_q: "Puis les graines, et celles-là sont faciles : {area}, tous entiers. Combien de graines d'arbre ?",
    c4_e_sd_h: "C'est l'aire, encore une fois.",
    c4_e_sd_ok: "{n} graines d'arbre et {w} longueurs magiques de fil. Un champ de plus planté et clôturé — et une astuce de plus dans notre panier à astuces : même si un champ n'est pas un <b>L</b>, nous pouvons toujours le transformer en L et trouver {s}.",

    c4_f_in1: "Il nous est arrivé quelque chose de bizarre avec Marimon. On a trouvé un champ à replanter qui a été construit de la même manière que le précédent : un rectangle collé contre un carré.",
    c4_f_in2: "Mais cette fois-ci, les anciens n'ont <b>pas</b> noté dans les registres la surface totale du champ. Ils ont juste noté la surface du rectangle collé contre le carré ({cv}), et la longueur totale du côté du champ (carré plus rectangle), qui fait {bv}.",
    c4_f_in3: "On est bien embêtés avec Marimon : comment on peut décider de combien de graines on a besoin pour replanter le champ si on ne connaît même pas sa surface totale ? Et même si on ne plante que le champ rectangulaire de {cv} de surface, comment on le protège des Gorns quand on ne sait même pas quelles sont ses dimensions ? C'est un problème super difficile. Tu veux bien nous aider ?",
    c4_f_in_btn: "Bien sûr !",
    c4_f_wt1: "Pour le champ précédent, on a coupé en deux la longueur qu'on connaissait, celle du côté du rectangle qui avait été collé contre le carré. Mais là, la longueur qu'on connaît, c'est la <b>longueur totale d'un des deux côtés du champ</b> (carré plus rectangle).",
    c4_f_wt2: "Que faire ? Si on essayait la même astuce quand même, pour voir si ça nous donne un <b>L</b> qu'on peut exploiter ? T'es game ? Ou tu préférerais qu'on essaye de couper en deux la longueur qu'on connaît — les {bv} en entier — et qu'on voie ce que ça donne ? À ton avis ?",
    c4_f_wt_a1: "Coupons le rectangle en deux, comme la dernière fois !",
    c4_f_wt_a2: "Non — coupons en deux la longueur qu'on connaît.",
    c4_f_dd1: "D'accord, la même astuce que la dernière fois : on coupe le rectangle en deux par le milieu, et on fait pivoter une moitié d'un quart de tour pour la poser sur le carré.",
    c4_f_dd2: "Et voilà — un vrai <b>L</b> ! Alors, est-ce qu'on peut lui appliquer notre formule ? Pour ça il nous faut deux choses : {a}, l'aire totale du L, et {bb}, la moitié de la longueur du rectangle.",
    c4_f_dd3: "Sauf qu'on ne connaît <b>ni l'une ni l'autre</b>. Personne ne nous a dit combien fait le carré, donc impossible de l'ajouter aux {cv} pour avoir l'aire du L. Et personne ne nous a dit la longueur du rectangle, donc impossible de la couper en deux. On ne sait même pas combien fait le petit coin qui manque, donc on ne peut pas remplir le L pour en faire un grand carré.",
    c4_f_dd4: "Cette route-là est donc une impasse. Ça valait le coup d'essayer — maintenant on le sait. Revenons en arrière et essayons l'autre : couper en deux la longueur qu'on connaît, <b>elle</b>.",
    c4_f_dd_btn: "Revenons en arrière !",
    c4_f_hf1: "Coupons la bande en deux. Deux moitiés de {hv} chacune, et j'ai marqué le milieu.",
    c4_f_hf2: "Regarde maintenant où s'arrête le carré. Il s'arrête <b>avant</b> la marque. Appelons {g} ce petit écart.",
    c4_f_hf_btn: "Marque les écarts !",
    c4_f_hf3: "Où en sommes-nous ? Le carré s'arrête {g} avant la marque — le rectangle récupère donc ce {g} d'abord, et <b>ensuite toute la seconde moitié</b>. Il fait {hpg} de large.",
    c4_f_hf4: "Le carré fait donc {seq} de côté. Et le rectangle fait {hpg} de large et {hg} de profondeur, puisqu'il est couché contre le carré. C'est bon pour toi ?",
    c4_f_hf_a1: "Hmmm, attends voir, ça fait beaucoup de trucs qu'on ne sait pas, je vois pas comment ça nous aide.",
    c4_f_hf_a2: "Mmoui, allez, je crois que ça va, mais je vois toujours pas comment on va s'en sortir.",
    c4_f_rc1: "Attends, mais regarde, on a avancé, là, non ? On a un champ rectangulaire dont on connaît l'aire ({cv}), et ça, c'est comme les champs qu'on a étudiés juste avant. Et puis, on a une longueur qu'on connaît maintenant, celle d'un côté de ce rectangle, moins {g} : {heq}.",
    c4_f_rc2: "Donc il nous manque juste un <b>L</b> maintenant, dont on connaisse l'aire. Il faut donc garder le rectangle <b>jaune</b> de longueur {heq} et le rectangle <b>vert</b>, puisque c'est à eux deux qu'ils font {cv}.",
    c4_f_rc5: "À ton avis, est-ce qu'en basculant le rectangle vert de largeur {g} et de hauteur {s} au-dessus de notre rectangle de longueur {heq}, on pourrait obtenir un vrai <b>L</b> ?",
    c4_f_rc_a1: "Oui, bien vu !!!",
    c4_f_rc_a2: "Euh, pardon, quoi !!! Ça va pas la tête ??",
    c4_f_rc3: "Voilà. Le petit morceau a fait un quart de tour et s'est posé sur le grand, calé dans son coin de gauche.",
    c4_f_rc4: "Comme rien n'a été perdu et rien n'a été ajouté — nous avons seulement déplacé un morceau —, la surface totale des deux champs (jaune + vert) fait toujours {cv}. Et puis, maintenant, ils ressemblent drôlement à un <b>L</b>, agencés comme ça, pas vrai ?",
    c4_f_rc4_a1: "Ah bin, oui, c'est clair !",
    c4_f_rc4_a2: "Hmmm, OK, mais attends une minute, y'a un truc qui me chiffonne.",
    c4_f_ck1: "OK. Donc on a un champ qui ressemble à un <b>L</b>, mais pour pouvoir utiliser notre formule pour calculer le côté du carré dans un champ en L, on doit être sûrs que le L peut être transformé en un <b>carré</b> juste en ajoutant le morceau qui manque en haut à droite. Pour ça, il faut que les deux côtés du L soient de la même longueur, pas vrai ? Mais, moi, j'en suis pas sûr. T'en penses quoi, toi ?",
    c4_f_ck_a1: "Mais oui, bien sûr.",
    c4_f_ck_a2: "Bin, pas trop.",
    c4_f_ck_a3: "Bin maintenant, je sais ce qui me chiffonnait tout à l'heure.",
    c4_f_wk2: "On a qu'à essayer de regarder nous-mêmes. Quelle est la longueur du <b>petit</b> côté du rectangle vert que nous venons de basculer au-dessus du rectangle jaune ?",
    c4_f_wk_no2: "C'est la tranche qu'on a coupée à gauche de la marque du milieu — ce qui manque au carré pour l'atteindre.",
    c4_f_wk3: "Oui, exact, le petit côté du rectangle vert est {g}, la longueur qui manque à {s} pour atteindre la moitié de la longueur de notre champ ({heq}). Et donc, au final, c'est quoi la longueur du côté <b>gauche</b> du L ?",
    c4_f_wk_no3: "Remonte-le du doigt : d'abord le rectangle vert, puis le rectangle jaune en dessous — les deux, l'un sur l'autre.",
    c4_f_wk4: "Oui !! Tout à fait, la longueur du côté gauche du L est {heq}. On sait déjà quelle est la longueur du côté du L qui est en <b>bas</b>, pas vrai ? C'est aussi {heq}, c'est même comme ça qu'on l'a construit dès le départ, en coupant la longueur totale du champ en deux.",
    c4_f_wk5: "Mais donc, on est d'accord, notre champ en L a bien <b>deux côtés de même longueur</b>. Donc, si on le complète avec le coin manquant en haut à droite, on a un <b>carré</b>. Ouf, c'est bien parti, tu penses pas !",
    c4_f_wk_a1: "Yes !!! Énorme.",
    c4_f_wk_a2: "Mouais, je te suis, allez.",
    c4_f_ms1: "Bon, on en est où ? Qu'est-ce qu'on sait et qu'est-ce qu'on sait pas, maintenant, dans ce nouveau champ en <b>L</b> qu'on a construit ? Le L fait {cv}. OK. Dans les champs en L que nous avons déjà vus, on ajoutait à l'aire du L l'aire du coin manquant et ça nous donnait l'aire du grand carré, et on s'en servait pour retrouver le côté du grand carré, qu'on ne connaissait pas, et on lui enlevait la longueur du rectangle, pour retrouver {s}.</p><p style=\"margin-top:10px\">Mais une minute, regarde bien ! La longueur du côté du grand carré, on la <b>connaît déjà</b>. Donc ça nous sert à rien de la retrouver. Et donc, tiens-toi bien, on connaît l'<b>aire</b> du grand carré aussi, pas vrai ? C'est {hsq}. Donc, on peut utiliser notre astuce <b>à l'envers</b> : si on connaît l'aire du grand carré, et qu'on connaît l'aire du L, et que l'aire du grand carré c'est l'aire du L plus l'aire du coin, on connaît l'aire du coin, pas vrai ? C'est le nombre tel que {eq25}.",
    c4_f_ms_a1: "Bien sûr que c'est un carré !",
    c4_f_ms_a2: "Mmff, je demande à voir.",
    c4_f_ms_q: "Donc, à ton avis, c'est quoi l'aire du coin ?",
    c4_f_ms_h: "Vingt et un, et combien de plus font vingt-cinq ?",
    c4_f_ms2: "Yes, super !! L'aire du coin, c'est {nv}. Si ce coin était un <b>carré</b>, on pourrait calculer la longueur de son côté, et, attends voir, mais oui !!! On aurait qu'à enlever cette longueur à {heq} et on aurait {s} ! On y est presque. Si seulement on pouvait vérifier que le coin en haut à droite est bien un carré. T'en penses quoi, toi ?",
    c4_f_cn1: "Pas facile hein ? Bon, déjà, on sait que le côté <b>vertical</b> du coin est de longueur {g}, puisqu'il est égal à la largeur du rectangle vert qu'on a placé sur le dessus. Mais quelle est la longueur de son autre côté ? Attends voir, cette longueur, si tu lui ajoutes {s}, qui est la longueur horizontale du rectangle vert qu'on a placé au-dessus, ça donne {hv}, le côté du grand carré. À ton avis, c'est quoi qui fait {eq} ?",
    c4_f_cn_no: "Parcours le haut du grand carré : d'abord le rectangle vert, large de {s}, puis le coin. Les deux ensemble font {heq}.",
    c4_f_cn_ok: "Yes !!! Tu as trouvé, la longueur horizontale du coin est {geq}, donc le coin a ses deux côtés égaux à {g} : c'est bien un <b>carré</b>.",
    c4_f_gq: "Donc, comme on connaît son aire (c'est {sub}), on peut prendre sa racine et trouver {g} : {geqn}.",
    c4_f_gh: "Quel nombre FOIS lui-même fait quatre ?",
    c4_f_gq2: "Alors, ça fait combien ? {rt}",
    c4_f_eq_ok: "{g} vaut {gv}.",
    c4_f_s_q: "Et la longueur {s} que nous cherchons est telle que {eq}. Alors, combien vaut {s} ?",
    c4_f_s_h: "Cinq, moins deux.",
    c4_f_s_ok: "{seq}. Vérifions que nous retombons sur nos pieds. {hv} plus {g} font {other}. {sv} et {other} font {bv} ensemble, et {mult}, qui sont exactement les nombres que Marimon a lus dans les registres des anciens.",
    c4_f_ar_q: "Le champ entier fait {bv} de long et {sv} de profondeur. Quelle est son aire ?",
    c4_f_ar_h: "Dix FOIS trois.",
    c4_f_ar_ok: "{n} carrés magiques — et la partie carrée en fait {sq}, donc le rectangle en fait {c}. Tout concorde.",
    c4_f_wr_q: "Et la clôture, autour d'une bande de {bv} sur {sv}. Combien de fil ?",
    c4_f_wr_h: "Deux fois chaque côté.",
    c4_f_wr_ok: "{eq} longueurs magiques. Acheté.",
    c4_f_rl1: "Voici donc une nouvelle formule, qui permet de trouver le côté d'un champ formé par un carré collé à un rectangle d'aire connue, quand tu as la <b>longueur entière du champ</b> (carré plus rectangle) au lieu de la longueur du rectangle seule.",
    c4_f_rl2: "Coupe la longueur en deux. Mets la moitié au carré. Retires-en l'aire. Prends la racine de ce qui reste — c'est {g} — et retire-la de la moitié.",
    c4_f_rl3: "Tout ça ressemble diablement à ce qu'on a déjà fait pour les champs précédents, pas vrai ? On coupe en deux. On met au carré. On prend la racine. Mais deux choses changent. <b>Un :</b> on retire l'aire du rectangle <b>de</b> l'aire du grand carré, parce que ce que nous cherchons, c'est la racine du petit coin, {gsq}. <b>Deux :</b> on retire cette racine du <b>côté coupé en deux</b> — alors que la dernière fois, nous retirions le côté coupé en deux de la racine.",

    c4_g_bo1: "Deux champs, donc, et deux problèmes différents à résoudre. Regarde-les côte à côte.",
    c4_g_bo2: "L'avant-dernier : un carré avec un rectangle posé dessus, et {e1}. Celui-ci : un carré à côté d'un rectangle, et {e2}. Ce n'est pas exactement le même problème. Mais ils se ressemblent. Et leurs solutions avaient des airs de famille : couper en deux la longueur connue, la mettre au carré, ajouter ou retirer l'aire connue, prendre la racine du résultat, puis l'ajouter à la moitié — ou la lui retirer.",
    c4_g_bo3: "Pourrions-nous écrire le problème, et sa solution, d'une façon qui couvre <b>tous</b> les cas que nous avons vus ici — et peut-être d'autres encore ?",
    c4_g_bo_q: "Tu crois que c'est possible ?",
    c4_g_bo_yes: "Oui, bien sûr.",
    c4_g_bo_no: "Non, je ne crois pas aux miracles.",
    c4_g_bo4: "Essayons de fabriquer un miracle, alors. D'abord, écrivons les deux problèmes d'une façon qui se ressemble.",
    c4_g_mv1: "Souviens-toi de ce que nous avions fait lors de notre quête des racines carrées — nous avions retiré la même chose des deux côtés, et les deux côtés étaient restés égaux. Nous avions retiré quatre carrés magiques d'un champ et du nombre de carrés magiques qui mesurait son aire à côté, et rien n'avait changé.",
    c4_g_mv2: "Alors faisons pareil ici : enlevons toute l'aire de droite à la fois à droite et à gauche, jusqu'à ce qu'il ne <b>reste rien à droite</b>.",
    c4_g_mv_btn: "Fais tout passer !",
    c4_g_ow1: "Sur le premier champ, nous retirons {c} des deux côtés. À droite, il ne reste plus rien du tout. À gauche — eh bien, nous n'avions pas de {c} à retirer, alors maintenant nous en <b>devons</b> un.",
    c4_g_ow2: "C'est ce que veut dire le petit trait devant. {neg} n'est pas un champ et ne le sera jamais. C'est un nombre que nous portons du mauvais côté de la ligne, et cela finira par s'arranger.",
    c4_g_ow3: "Fais de même avec le second champ, et voici ce que nous obtenons :",
    c4_g_one1: "Et maintenant, regarde bien nos deux formules. Elles ont la même forme, toutes les deux : {form}.",
    c4_g_one2: "La première a {b1} et {c1}. La seconde a {b2} et {c2}. Ce sont les seules différences entre elles.",
    c4_g_one3: "Et les deux signes « &minus; » ne sont pas là par hasard. Il y en a un devant {ct} quand les registres nous donnent l'aire du <b>champ entier</b> — le carré et le rectangle ensemble — et il n'y en a pas quand les registres nous donnent l'aire du <b>rectangle seul</b>.",
    c4_g_one4: "Et {bt}, c'est le côté du rectangle posé contre le carré, quand c'est cela qu'on nous a donné — {bt1} sur le premier champ. Quand ce qu'on nous donne, c'est la longueur entière de la bande, alors {bt}, c'est cette longueur avec un signe moins devant : {bt2}.",
    c4_g_one5: "Quand nous écrivons une formule qui décrit un problème que nous cherchons à résoudre, mais qui nous en donne pas la solution, on appelle cette formule une <b>équation</b>. Quand on arrive à trouver une formule qui donne directement la solution à ce problème, sous la forme {sol}, on dit qu'on a <b>résolu</b> l'équation. Des mots un peu ronflants, mais utiles, tu verras. Et puis, on a bien travaillé, et les miracles qu'on a découverts méritent bien un nom, pas vrai ?",
    c4_g_pm1: "Alors, voilà la formule qui résume tout ce qu'on a appris, et qui devrait résoudre tous les cas similaires :",
    c4_g_pm2: "Le petit {pm} veut dire <b>plus ou moins</b> — parce que des fois il faut ajouter la racine carrée, et des fois la retirer. Il y a donc <b>deux réponses</b>, toujours. Nous verrons plus loin comment choisir celle qui résout notre problème.",
    c4_g_sg1: "Regarde ce que fait notre formule. Elle coupe {bt} en deux et le retire. Quand {bt} est <b>positif</b> — {b4} sur notre premier champ — c'est exactement ce que nous avons fait là-bas : retirer la moitié du côté à la racine du grand carré.",
    c4_g_sg2: "Quand {bt} est <b>négatif</b> — {b10} sur notre deuxième champ — elle <b>ajoute</b> la moitié à la racine. C'est dû à la règle des signes, combinée avec l'associativité de la multiplication :",
    c4_g_sg3: "Regarde aussi ce qui arrive au carré. Quand {bt} est négatif, {bteq}, et donc :",
    c4_g_sg3b: "— par associativité et commutativité de la multiplication. Mettre au carré un nombre avec un signe « − » devant donne donc exactement la même chose que sans.",
    c4_g_sg4: "Regarde maintenant ce qui arrive au {ct}. Quand {ct} est <b>positif</b>, nous le retirons du grand carré avant de prendre la racine, pour trouver {g} — c'est ce que nous avons fait sur notre deuxième champ.",
    c4_g_sg5c: "avec C = 21 sur notre premier champ",
    c4_g_sg5: "Quand {ct} est <b>négatif</b> — {ceq} — voici ce que nous faisons à la place :",
    c4_g_sg5b: "— par associativité, encore. Dans ce cas-là nous <b>ajoutons</b> donc l'aire du rectangle à celle du carré, {hh}, parce que ce que nous cherchons, c'est la racine du <b>plus grand</b> carré.",
    c4_g_sg6: "Et ce que fait le {pm}, c'est nous laisser soit ajouter la racine du carré que nous avons construit, soit la retirer. Parfois la bonne réponse demande de l'ajouter, parfois de la retirer. Voyons comment la formule se débrouille en pratique, sur les champs que nous connaissons déjà.",
    c4_g_ds1: "Ces deux signes « − » vont compter dans un instant, alors voici d'abord une petite chose dont tu vas avoir besoin. Quand un signe « − » rencontre un signe « − » dans une multiplication, les deux s'annulent et un plus revient :",
    c4_g_ds2: "Deux signes « − » font un plus. Cela porte un vrai nom, celui que tu retrouveras à l'école : la <b>règle des signes</b>.",
    c4_g_ds3: "Pourquoi c'est vrai, c'est une belle histoire, et ce sera pour un autre jour. Pour l'instant, prends-la et sers-t'en — c'est l'une des petites règles les plus utiles qui soient, et elle est sur le point de nous sauver.",
    c4_g_e_q: "Et la voilà : {eq}. Les deux réponses sont donc moins deux plus cinq, et moins deux moins cinq. Donne-moi celle qui pourrait être la longueur du côté d'un vrai champ.",
    c4_g_w_l: "Essayons de faire tourner notre nouvelle formule sur notre premier champ, morceau par morceau. Voici le champ, et voici la formule. Et en dessous, le problème écrit sous la forme qui nous a servi à définir {bt} et {ct}.",
    c4_g_w_q1: "Combien vaut {bt} sur ce champ ?",
    c4_g_w_h1: "C'est le côté du rectangle posé contre le carré — et il est écrit sur le dessin.",
    c4_g_w_q2: "Bien. Et combien vaut {h2} ?",
    c4_g_w_h2: "La moitié de quatre.",
    c4_g_w_q3: "Et combien vaut {sq} ?",
    c4_g_w_h3: "Deux fois deux.",
    c4_g_w_q4: "Maintenant, combien vaut {ct} ?",
    c4_g_w_h4: "Ce que les registres nous ont donné, c'est l'aire du champ tout entier, {a} — et quand c'est le champ tout entier, le {ct} porte un signe moins devant.",
    c4_g_w_q5: "Alors combien vaut {d} ?",
    c4_g_w_h5: "Deux signes moins font un plus, donc c'est quatre et vingt et un de plus.",
    c4_g_w_q6: "Et combien vaut {rt} ?",
    c4_g_w_h6: "Quel nombre, multiplié par lui-même, donne vingt-cinq ?",
    c4_g_e_h: "Deux signes moins font un plus, donc sous la racine il y a 4 et 21 de plus. Ensuite moins deux, plus cinq — et moins deux, moins cinq. Donne-moi le plus grand.",
    c4_g_e_ok: "{three} — notre champ, et le nombre même que nous avions trouvé en coupant le rectangle en deux. Et l'autre, c'est {neg}.",
    c4_g_e2: "Or aucun champ n'a un côté de {neg}. On ne peut pas arpenter moins sept longueurs magiques ; on ne peut pas les clôturer. Nous mettons donc cette réponse de côté — non pas parce qu'elle est fausse, mais parce que ce n'est pas une vraie longueur d'un vrai champ.",
    c4_g_e3: "Garde-la dans ta poche. Les nombres de cette sorte finissent par servir, et un jour quelqu'un te montrera à quoi.",
    c4_g_f_q: "Et la voilà : {eq}. Les deux réponses sont donc cinq plus deux, et cinq moins deux.",
    c4_g_v_l: "Maintenant le deuxième champ, de la même façon. Le voici, et voici la formule à nouveau.",
    c4_g_v_q1: "Combien vaut {bt} sur ce champ ?",
    c4_g_v_h1: "Ce que les registres nous ont donné ici, c'est la longueur entière de la bande, {b} — et quand c'est la bande entière, {bt} porte un signe moins devant.",
    c4_g_v_q2: "Et combien vaut {h2} ?",
    c4_g_v_h2: "La moitié de moins dix.",
    c4_g_v_q3: "Alors combien vaut {nh} ?",
    c4_g_v_h3: "Deux signes moins font un plus.",
    c4_g_v_q4: "Et combien vaut {sq} ?",
    c4_g_v_h4: "Un moins fois un moins. Mettre au carré un nombre avec un signe moins devant donne la même chose que sans — donc c'est cinq fois cinq.",
    c4_g_v_q5: "Maintenant, combien vaut {ct} ?",
    c4_g_v_h5: "Cette fois, ce que les registres nous ont donné, c'est l'aire du petit rectangle tout seul, {a} — donc pas de signe moins.",
    c4_g_v_q6: "Alors combien vaut {d} ?",
    c4_g_v_h6: "Vingt-cinq, moins vingt-et-un.",
    c4_g_v_q7: "Et combien vaut {rt} ?",
    c4_g_v_h7: "Quel nombre, multiplié par lui-même, donne quatre ?",
    c4_g_tw1: "{seven}, cette fois-ci, notre formule n'a <b>pas</b> donné une réponse absurde. C'est un vrai champ, avec un carré de {seven} de côté, et à côté de lui un rectangle de {three} de large — et on a bien {mult}, l'aire rapportée dans les registres de Marimon. Et la longueur totale du champ est de {bv}, exactement comme c'était écrit dans les registres.",
    c4_g_ot1: "Mais attends. Si on était partis de <b>ce</b> champ-ci à la place — le carré large, avec le rectangle étroit à côté — notre formule aurait marché !! Mais comment ? Nous n'avons jamais rencontré ce cas-là, et notre formule le résout quand même ? Comment c'est possible ? C'est un miracle ou quoi ? Comment ça peut bien marcher ? Tu veux qu'on essaye de voir ?",
    c4_g_ot1_a1: "Ah oui alors !!",
    c4_g_ot1_a2: "Attends, quoi, un miracle ?",
    c4_g_ot_btn1: "Coupe la bande en deux !",
    c4_g_ot3: "Le milieu tombe <b>à l'intérieur du carré</b>.",
    c4_g_ot4: "On ne peut pas découper de rectangle comme nous l'avons fait pour le champ étroit. Par contre, regarde : la dernière fois, le carré s'arrêtait {g} <b>avant</b> la marque. Cette fois, il la dépasse de {g}. Le même petit écart, dans l'autre sens. Et donc, on a {eqa} cette fois-ci.",
    c4_g_ot4b: "Ce qu'on veut, c'est découper le rectangle <b>jaune</b>, dont on connaît l'aire, pour en faire un <b>L</b> dont on connaît la longueur du côté — et ici, on connaît {hv}. Donc, allons-y, découpons le rectangle jaune en deux rectangles, un de longueur {heq} et un avec la longueur qui reste. Tu veux voir ce que ça donne ?",
    c4_g_ot4b_a1: "Yesss, avec plaisir !",
    c4_g_ot4b_a2: "Hmm, tu me parles Klingon, là.",
    c4_g_ot5: "Regarde, le côté du champ (carré + rectangle) fait toujours {bv}. Appelons {s} le côté du carré, et donnons une lettre à l'autre côté du petit rectangle qui est collé contre — celui qui n'est pas {s} — appelons-le {ww}. À eux deux, ils se partagent toute la longueur du champ entier : {wsb}.",
    c4_g_ot6b: "Voilà. On a coupé le rectangle jaune en un morceau de {hv} de côté et un morceau plus petit, avec ce qui reste. Mais à ton avis, c'est quoi, cette longueur qui reste, après qu'on a enlevé {h} du grand côté du rectangle, qui mesure {s} ?",
    c4_g_ot6b_no: "Le grand côté du rectangle mesure {s}. Enlèves-en {h}, et ce qui reste, c'est justement l'écart dont le carré dépassait la marque.",
    c4_g_ot6c: "Yes !!! Tout à fait, le côté du rectangle vert mesure {g} longueurs magiques. Donc, attends, on y est presque, non ? On a un rectangle, le jaune, qui fait {cv}, on l'a découpé en deux morceaux, dont l'un a une longueur de {heq}. Et maintenant, on crée un <b>L</b> à partir de ces deux morceaux, non ? Et on espère que le L aura deux côtés égaux à {heq2}, et que le coin du haut à droite sera bien un carré. On y va ?",
    c4_g_ot6c_a1: "Yes, bascule le rectangle vert !!!",
    c4_g_ot6c_a2: "What !!! C'est pas pareil que la dernière fois !!",
    c4_g_ot7: "Et voilà. Un quart de tour, sur le côté — un <b>L</b>, et toujours les mêmes {cv}.",
    c4_g_ot_bs_q: "Est-ce que les deux côtés du <b>L</b> ont bien la même longueur ? Voyons, le côté gauche, on l'a choisi pour que sa longueur soit {hl} = {hv}. Maintenant, ce qui est dur, c'est le côté du bas &mdash; À ton avis, quelle est sa longueur ?",
    c4_g_ot_bs_w: "C'est w",
    c4_g_ot_bs_h: "C'est h",
    c4_g_ot_bs_no: "Regarde encore, et pose-le contre les deux moitiés du dessous. Il est plus long que {ww}.",
    c4_g_ot_bs_ok: "OK, donc les deux côtés du <b>L</b> qu'on a construit à partir du rectangle jaune sont de même longueur, {hq}.",
    c4_g_ot_fl1: "Donc, si on remplit le <b>L</b> en ajoutant le coin manquant, en haut à droite, on a bien un carré de côté {hq}. On y va, on remplit le <b>L</b> ?",
    c4_g_ot_fl_a1: "Oui, vas-y !!",
    c4_g_ot_fl_a2: "Hmm, allez, ça a l'air de te faire plaisir ;)",
    c4_g_ot_ar_l1: "Et voilà. Le coin est en place, et le <b>L</b> est devenu un carré de côté {hq}.",
    c4_g_ot_ar_q1: "Donc, quelle est l'aire du grand carré que ces deux côtés délimitent ? {sqeq}",
    c4_g_ot_ar_h1: "Cinq fois cinq.",
    c4_g_ot_ar_ok1: "{a1}, oui ! Et le <b>L</b> est posé à l'intérieur de ce grand carré.",
    c4_g_ot_ar_q2: "Quelle est son aire à lui ? Souviens-toi de ce que c'est : le rectangle jaune que nous avons coupé en deux et fait pivoter.",
    c4_g_ot_ar_h2: "C'est le nombre inscrit dans les registres de Marimon, et il n'a pas bougé une seule fois.",
    c4_g_ot_ar_ok2: "{cv}, exact ! Rien n'a été perdu et rien n'a été ajouté depuis le début.",
    c4_g_ot_ar_q3: "Alors, comme tout à l'heure, quelle est l'aire du coin en haut à droite, celui qu'on vient d'ajouter ? {ceq}",
    c4_g_ot_ar_h3: "Vingt-cinq, moins vingt et un.",
    c4_g_ot_cn1: "{a3} pour le coin. Attends !! On y est presque ! Il faut juste qu'on vérifie que le coin est bien un carré, comme ça, sa racine nous donnera la longueur de son côté. Tu en penses quoi ? Le côté du bas du rectangle vert, on l'a découpé exprès pour être de longueur {g}, et il a la même longueur que le côté du bas du coin. Donc, est-ce que le côté droit du coin est aussi de longueur {g} ? Pas simple, hein ?",
    c4_g_ot_cn_q: "Mais on sait que le long côté du rectangle vert que l'on vient de pivoter est exactement égal à la largeur du rectangle jaune. C'est combien, ça ?",
    c4_g_ot_cn_no: "Regarde la largeur du rectangle jaune, marquée sous le champ : le long côté du rectangle vert fait exactement la même longueur.",
    c4_g_ot_cn_ok: "Yes !! Bravo ! C'est bien ça, la plus grande longueur du côté du rectangle vert est {ww}. Et maintenant, comme on sait que le côté du <b>L</b> (et donc du grand carré qui en est issu) est de longueur {hl}, et que le côté du coin est exactement ce qui manque pour combler l'écart entre {ww} et {hl}, on sait que {weq}, avec {qm} la longueur du côté droit du coin.",
    c4_g_ot_cn2_q: "À ton avis, ça fait combien ?",
    c4_g_ot_cn2_no: "Regarde le côté droit du grand carré : le rectangle vert en prend {ww}, et le carré tout entier fait {hl}. Ce qui reste au-dessus, c'est le coin.",
    c4_g_ot_cn2_ok: "Oui !! Les deux côtés du coin en haut à droite mesurent tous les deux {g}, donc c'est bien un carré !! Et on connaît son aire, tu te souviens : l'aire du grand carré {sqeq} moins l'aire du <b>L</b>, qui a la même aire que le rectangle jaune du début ({cv}). Donc, en prenant la racine carrée, on va retrouver {g}, pas vrai ?",
    c4_g_sv_no: "Regarde le champ : {s} est le côté du carré orange, et il est plus long que {hl}. Il faut donc ajouter quelque chose à {hl}, pas le retirer.",
    c4_g_sv_ok5: "Yes !! {seq}. {s}, le côté du carré orange qu'on cherche depuis le début, c'est {hl}, la moitié de la longueur du champ {bl} (carré + rectangle), plus le {g} qui manque, parce que la moitié de {bl} est plus petite que {s} de {g}.",
    c4_g_ot10: "OK, donc, on en est où ? On cherche {s}, pas vrai ? On connaît maintenant {heq} et {geq2}. Est-ce que tu penses qu'on peut trouver {s} maintenant, juste à partir de ces deux longueurs ?",
    c4_g_sv_q1: "Tu penses qu'on devrait utiliser quelle formule ?",
    c4_g_sv_q4: "{geq}. Donc {g} fait combien de longueurs magiques ?",
    c4_g_sv_h4: "Quel nombre FOIS lui-même fait quatre ?",
    c4_g_sv_q5: "Et donc, {s} fait combien de longueurs magiques ?",
    c4_g_sv_h5: "Cinq, et deux de plus.",
    c4_g_sv_ok: "Yes !!! {seq7}. Ça y est, on a compris l'astuce qui permet à la formule de trouver la bonne réponse pour ce champ aussi.",
    c4_g_sv_pm: "C'est le {pm} devant le {rt} qui est là pour couvrir les deux cas à la fois : le champ étroit, et le champ large. La formule donne toujours deux réponses, celle qui correspond au champ étroit, et celle qui correspond au champ large.",
    c4_g_ot12: "Donc, que le champ soit étroit ou large, on sait maintenant comment construire un carré de {hb} = {hv} de côté, et son aire vaut toujours les {cv} plus le petit coin carré d'aire {gsq}. Ce qui nous donne {g} à tous les coups : {geq}.",
    c4_g_ot13: "Et ensuite, un seul coup d'œil règle le reste. Quand le côté du carré est le <b>plus petit</b> côté du champ, on retire {g} de la moitié de la longueur {bl} : {seq1}. Quand le côté du carré est le <b>plus grand</b> côté du champ, on ajoute {g} : {seq2}. Une seule astuce, un seul {g}, deux réponses &mdash; et c'est la forme du champ qui dit laquelle est la bonne. D'où la formule, écrite en entier :",
    c4_g_tw3: "Les deux réponses sont des <b>vraies longueurs</b>, cette fois-ci. Les registres de Marimon nous ont donné une seule longueur et une seule aire, et <b>deux champs différents pourraient correspondre</b>, si on en croit notre formule. Tu crois que c'est possible ? Ou alors notre formule est-elle fausse ? Elle a déjà inventé des longueurs négatives, alors tout est possible, pas vrai ?",
    c4_g_tw3_a1: "Oui, c'est vrai.",
    c4_g_tw3_a2: "Je sais pas, j'espère pas.",
    c4_g_tw_q: "Comment les distinguer, alors ? Regarde-les tous les deux. Sur l'un, le carré est <b>plus étroit</b> que le reste de la bande. Sur l'autre, il est <b>plus large</b>. Lequel de ces deux champs a la même forme que celui dont nous sommes partis ?",
    c4_g_tw_no: "Regarde encore — notre carré faisait {three} de côté, et le rectangle à côté de lui faisait {seven} de large.",
    c4_g_tw_ok: "{three}, c'est ça, notre champ, celui qu'on veut replanter : il est étroit et allongé. Alors que l'autre est plus épais, presque comme un carré. Et c'est comme ça qu'on distingue nos deux réponses : le côté du carré est-il de la même longueur que le <b>grand</b> ou que le <b>petit</b> côté du rectangle contre lequel il est collé ?",
    c4_g_en1: "Hé bien, on en a appris des choses, tu trouves pas !!",
    c4_g_en2: "On a pris un champ qui était un carré avec un coin en moins, et on a rempli le coin. On a pris un champ qui était un carré avec un rectangle collé dessus, et on a coupé le rectangle en deux. On a pris un champ qui était un carré à côté d'un rectangle, et on a trouvé le petit carré caché dans la différence. Trois formes, et chacune d'elles est devenue un carré dont on savait prendre la racine.",
    c4_g_gen1: "Donc : chaque fois qu'un certain nombre d'aires carrées ({eq}) a un champ rectangulaire posé contre lui &mdash; un rectangle qui vaut soit tant de fois le même côté ({bs}), soit une aire connue ({c}) &mdash; et que l'aire totale du champ est soit connue, soit égale à {s} multiplié par un nombre connu, le problème peut toujours s'écrire de la même façon, et se résoudre de la même façon :",
    c4_g_gen2: "Et quand {one}, le problème n'est plus que {eq}, et la solution est bien plus simple : couper le côté {bt} en deux, le mettre au carré, en retirer {ct}, prendre la racine de ce qui reste, et soit l'ajouter à moins la moitié, soit l'en retirer.",
    c4_g_gen3: "Moi, perso, je préfère beaucoup cette formule-là. Au point que, quand {one} n'est pas vrai, je transforme souvent {eq} en {sub} &mdash; avec {defs} &mdash; je résous le grand {sub2} avec la jolie formule, et je reviens ensuite vers {s} en utilisant {back}.",
    c4_g_gen4: "Des fois, il est encore plus simple d'écrire le problème directement comme {eq}, mais cette fois avec {defs}. La jolie formule te donne alors {s} tout de suite.",
    c4_g_gen5: "Pourquoi la formule compliquée de l'école donne le même résultat que notre plus jolie formule quand {one} ? Pour le comprendre, on a besoin de faire un petit calcul, et tu es presque capable de le faire toi-même maintenant. On a juste besoin de l'associativité de la multiplication, et de sa distributivité sur l'addition, et aussi du fait que {r1} et {r2}, ce qu'on appelle {laws} et qui sert tout le temps :",
    c4_g_gen6: "Et nous y voilà, avec {b} qui vaut {bt} et {c} qui vaut {ct}.",
    c4_g_gen_laws: "les règles des racines",
    c4_e8_in1: "Une dernière chose avant de terminer, et elle est entièrement pour toi. Marimon n'a pas chômé : voici huit champs de plus, et chacun est l'une des formes que tu connais maintenant.",
    c4_e8_end: "Bravo !!! Tu as résolu ces 8 problèmes comme un chef ! Et maintenant, on peut calculer le nombre de graines à acheter, la longueur de clôture dont on va avoir besoin, et je peux aller au marché tout acheter ! Merci de ton aide !! Tu gères !",
    c4_e8_in2: "Sous chacun se trouve ce qu'il a noté. Lis {bt} et {ct} sur la forme, puis fais tourner notre formule. Six d'entre eux ont {one} ; les deux derniers non, et sur ceux-là tu peux prendre le chemin que tu préfères.",
    c4_e8_qb: "Champ {n}. Son équation s'écrit sous la forme {d}. Combien vaut {bt} ?",
    c4_e8_hb: "Lis-le sur le champ, comme nous l'avons fait depuis le début.",
    c4_e8_qat: "Il faut d'abord déterminer combien de fois le côté du petit carré a été multiplié pour obtenir le côté du grand carré. Appelons-le {at} : c'est le nombre tel que {aeq}, c'est-à-dire {req}. Alors, combien vaut {at} ?",
    c4_e8_hat: "Quel nombre, multiplié par lui-même, donne quatre ?",
    c4_e8_qbs: "Bien. Maintenant {bt}, c'est le nombre de fois qu'il faut multiplier {ateq} pour obtenir {b} : {bd}. À ton avis, {bq}",
    c4_e8_hbs: "Moins vingt, partagé en deux.",
    c4_e8_qc: "Et combien vaut {ct} ?",
    c4_e8_hc: "Attention au signe.",
    c4_e8_qsq: "Maintenant le morceau sous la racine : combien vaut {sq}, c'est-à-dire {e} ?",
    c4_e8_hsq: "Coupe-le en deux, mets la moitié au carré, et retire l'autre.",
    c4_e8_qrt: "Et combien vaut {rt} ?",
    c4_e8_hrt: "Quel nombre, multiplié par lui-même, donne cela ?",
    c4_e8_qs: "Alors combien vaut {cap} ? Prends {e}.",
    c4_e8_hs: "Moins la moitié, plus la racine.",
    c4_e8_qbd: "Partageons alors toute l'équation par {a}. D'abord {b} : nous cherchons le nombre qui, multiplié par {a}, donne {b} &mdash; {eq}. La table ci-dessous t'aidera à le trouver. Combien vaut-il ?",

// THE FIELDS
// ---------------------------------------------------------------------------
// An L: a square of side s, plus TWO rectangles B x s laid against it, so that the
// whole thing sits in a square of side s + B with the B x B corner missing.
//     C = s^2 + 2Bs        and        (s + B)^2 = C + B^2
// ⚠️ D2 (Sylvain, 2026-08-24): the deck's second field has area 68 and an IRRATIONAL
// side, so its four pages of covering in hundredths never actually finish. Ours goes
// C = 39 (whole), then C = 26.25 (exact, one decimal place), and 68 is held back for
// Part D, where the fast method reaches it and Chapter 3's own approximation returns
// as a subroutine.  All of it asserted in ../ch4_numbers.py.
const L_FIELDS = [
  { C: 39,    B: 5, s: 3   },
  { C: 26.25, B: 8, s: 1.5 },
  { C: 68,    B: 5, s: null },   // s = sqrt(93) - 5. Part D's payoff, not Part B's.
  // ⚠️ Part E's field is NOT an L to begin with — it is a square with one rectangle stuck
  // on, s wide and 2B tall. Cut that rectangle in half and walk one half round and it
  // becomes exactly this L, so from the move onward lFieldEl draws it and the formula Part D
  // wrote applies unchanged. B here is the HALF (2), where the field's own rectangle is 4.
  { C: 21,    B: 2, s: 3   },
];
const CHAPTER_FIELD = 0;

// MUTATED, never replaced — step closures and the picture helpers hold a reference.
const FIELD = { C: 0, B: 0, s: 0, big: 0 };
function applyField(i) {
  const f = L_FIELDS[i];
  FIELD.i = i; FIELD.C = f.C; FIELD.B = f.B;
  FIELD.s = f.s === null ? Math.sqrt(f.C + f.B * f.B) - f.B : f.s;
  FIELD.big = FIELD.s + FIELD.B;      // the side of the square that completes it
}
function setField(i) { if (FIELD.i !== i) applyField(i); }

// ⚠️ THE ANSWER THE CHILD ENDS UP WITH, WHICH IS NOT ALWAYS THE TRUE SIDE. On a field whose
// root comes out even the two are the same number. On the area-68 field the root is √93,
// so the chapter reaches it Chapter 3's way — block 81, share 12/18 rounded UP to 0.67 —
// and lands on 4.67 where the truth is 4.6437.
// Any picture that shows "our answer" must show THIS. The roll-call first printed the true
// side rounded to two places, 4.64, which is BELOW the truth — and an answer below the
// truth does not buy enough wire. That is the very defect ../ch4_numbers.py caught in the
// deck itself (its p13 prints 4.64), reintroduced from the other direction.
function fieldAnswer(i) {
  const f = L_FIELDS[i];
  if (f.s !== null) return f.s;
  const inside = f.C + f.B * f.B;
  const n = Math.floor(Math.sqrt(inside) + 1e-9);
  const share = Math.ceil(((inside - n * n) / (2 * n)) * 100) / 100;   // a share rounds UP
  return n + share - f.B;
}
applyField(CHAPTER_FIELD);

// A stacked fraction, the way school stacks it. Chapter 3 introduced this notation for its
// one division sign; here it names a half beside the decimal that replaces it.
// The radical, drawn properly: the tick and the bar over the number it covers. Chapter 3
// introduced it and this chapter inherits it — the notation the child will meet at school.
// ⚠️ Returns HTML, so it may only go into a story panel. Hints render with textContent.
// ⚠️ THE BAR MUST CLEAR THE TALLEST THING IT COVERS, and how tall that is depends on the
// content, so the radical is drawn from the content rather than at one fixed size.
//   - a combining tilde (B̃, C̃) reaches above cap height, and a bare border-top sits at the top
//     of the content box, so it ran straight through them — which is what Part G's line is
//     made of. The bar lifts, and the tick lifts by the SAME amount or they stop meeting.
//   - a stacked fraction under the root is two lines tall, and a normal-size √ beside it covers
//     only its top half. So the tick STRETCHES to the height of what it covers, the way a
//     proper radical does. `tall` keys on fracHTML's own signature — see the note there.
// Plain one-line content keeps exactly the markup it has always had.
function sqrtHTML(inner) {
  const tall = inner.indexOf('display:inline-block; vertical-align:middle') >= 0;
  const lift = /\u0303/.test(inner) ? '0.36em' : null;
  if (tall) {
    return '<span style="display:inline-flex; align-items:flex-start; vertical-align:middle;' +
      'white-space:nowrap"><span style="display:inline-block; line-height:1;' +
      'transform:scaleY(' + SQ_SY + ') translateY(' + SQ_DY + 'em); transform-origin:top">&radic;</span>' +
      '<span style="border-top:1.5px solid currentColor; padding:' + (lift ? '0.12em' : '0') +
      ' 3px 0 1px; margin-left:-1px">' + inner + '</span></span>';
  }
  const tick = lift ? '<span style="position:relative; top:-' + lift + '">&radic;</span>' : '&radic;';
  return '<span style="white-space:nowrap">' + tick + '<span style="border-top:1.5px solid currentColor;' +
    'padding:' + (lift || '0') + ' 3px 0 1px; margin-left:-1px">' + inner + '</span></span>';
}
// ⚠️ Tuned by measuring the render: at 1.95 the tick's foot lands exactly level with the
// bottom of the fraction it covers, and DY puts its tip on the bar. scaleY does NOT change
// layout height, so the tall tick overflows its box and nothing else on the line moves.
const SQ_SY = 1.95, SQ_DY = 0.11;
function fracHTML(num, den) {
  return '<span style="display:inline-block; vertical-align:middle; text-align:center;' +
    'font-size:0.86em; line-height:1.1">' + num +
    '<span style="display:block; border-top:1.5px solid currentColor">' + den + '</span></span>';
}
const nw = h => '<span style="white-space:nowrap">' + h + '</span>';
const bold = h => '<strong>' + nw(h) + '</strong>';
function areaLabel(a) { return t('c4_lbl_area', { a: fmtNum(a) }); }
function lenLabel(s) {
  return s === 1 ? t('c4_lbl_len_one') : t('c4_lbl_len', { s: fmtNum(s) });
}
