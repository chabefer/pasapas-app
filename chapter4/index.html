//     (s + B)^2  =  s^2 + 2Bs + B^2  =  C + B^2

// piece we are handed this time.
//

// the deck covers an irrational field in hundredths for four pages and never
// finishes, which is a poor advertisement for the slow method).
//
// ⚠️ Lesson 27: anything derived from the current field must be a FUNCTION, never a
// module-level const. The wrapper at the foot of this file swaps the field between

// ============================================================================

registerStrings({
  en: {
    page_title: "Return of the Root",
    celeb_title: "Quest complete!",

    c4_a_in1: "We have done a great deal together, you and I. We replanted the fields that had burned, and we fenced them — even the weird one, whose sides never came out even. And we found the side of square fields from their area alone, so they could be fenced without being measured all over again. What a lot of work! What adventures! You have been magnificent. Sadly, we have still not finished replanting all of my beautiful forest.",
    c4_a_in2: "Marimon and I have just found a new kind of field that once stood under trees, and is now dry and black. These ones are not square. Here, look — there is one below. When my ancestors marked them out, centuries ago, when they planted the forest, they made <b>L</b>-shaped fields, by laying two rectangles of the same size against a square field.",
    c4_a_in3: "In their records they had written down the total area of these fields — this one is {area}. They had written down the length of the rectangles too — these ones are {b}. But the side of the square they had written in an older register, the one that held the square fields' own measurements, and that register Marimon has lost.",
    c4_a_in4: "And still we must replant this field, and keep the Gorns off it with a fence. How are we to do that without knowing the length of the square's side — the one I call {s}? Will you help me find it?",
    c4_a_in_yes: "Let's find it!",
    c4_a_in_no: "A field that is not square?",

    c4_a_sh1: "Here it is, in its three pieces.",
    c4_a_sh2: "The <b>square</b>, down in the corner. Its side is {s} — the {s} we are after.",
    c4_a_sh3: "And the two <b>rectangles</b>, one standing up and one lying down. Each of them is {b} long — that is what the registers Marimon could find have written down — and {s} across, because they lie against the square.",
    c4_a_sh_btn: "Show me the pieces!",
    c4_a_sh4: "That is the whole field. Two sides of it are {s} long and two are {b} long, and every one of the three pieces has an {s} in it somewhere. And the whole field comes to {area}.",

    c4_a_kn1: "This field is very different from every one we have met on our earlier adventures.",
    c4_a_kn2: "On our last quest, the {s} we did not know was in <b>one</b> place: it was the side of a square field whose area {a} we knew, and that area was {s} TIMES {s}. Here {s} is in <b>three places at once</b>. It is the side of the square, and it is the width of both rectangles. Make {s} longer or shorter, and all three pieces of the field change size together.",
    c4_a_kn3: "And what do we know? The registers Marimon found give us the whole field's area, {area}, and the length of the rectangles, {b}. How are we to find {s} from that? Shall we do what we did on the very first field of our last quest — try to cover the field with magic squares, and count how many fall inside the square part?",
    c4_a_kn_a1: "Yes, let's try!!",
    c4_a_kn_a2: "Hmmm, I dunno, but we have to start somewhere I guess.",

    c4_a_lay1: "Go on, lay the magic squares on the field, one at a time, and let us hope the count comes out round. Because if it does not, I cannot see how we are going to manage.",
    c4_a_lay_done: "That is the whole field covered. Not one square over, not one short.",
    c4_a_cnt_q: "So how many magic squares did it take?",
    c4_a_cnt_hint: "Count the arm, then count the foot.",
    c4_a_cnt_ok: "{n} — just as Marimon's registers told us. Perfect! Phew! They tell the truth, old as they are. And look, we were lucky with the square part too, were we not? That one is covered by a whole number of magic squares as well. It might easily not have been.",
    c4_a_cnt_a1: "Oh yes, so it is!",
    c4_a_cnt_a2: "Was it?",


    c4_a_pc1: "Now let us check that adding up the area of the square and of the two rectangles really does give back the area written in Marimon's registers ({area}).",
    c4_a_fs_q: "Now look at the square part on its own. How many magic squares do we need to fully cover it?",
    c4_a_fs_hint: "Three rows of three, and they are already down.",
    c4_a_fs_q2: "{n}, yes! And how many magic lengths {s} do we need to follow one side of this square? Does that remind you of something?",
    c4_a_fs_a1: "Grass root",
    c4_a_fs_a2: "Square root",
    c4_a_fs_a3: "Ground root",
    c4_a_fs_a4: "Cubic root",
    c4_a_fs_no: "Not that one. Think of the shape: it is the side that lies at the <b>root</b> of a <b>square</b> field, and that is exactly where the name comes from.",
    c4_a_fs_q3: "Yes, exactly — the square root. So we know that {eq}. So how many magic lengths is the square root of nine? How many magic lengths long is the side {s} of the square?",
    c4_a_fs_h3: "Which number, multiplied by itself, gives nine?",
    c4_a_fs_ok: "Yes!!! The side of the square part is <b>3 magic lengths</b>. You have found {s}!! Well done!!!",
    c4_a_pc_qsq: "The square in the corner is {s} by {s}. What is its area?",
    c4_a_pc_hsq: "Three TIMES three, off the table.",
    c4_a_pc_qrc: "Each of the two rectangles is {b} by {seq}. What is the area of each one?",
    c4_a_pc_hrc: "Five TIMES three.",
    c4_a_pc_ok: "So the area of the whole field, worked out with {seq}, comes to {eq} — exactly the number written in Marimon's registers. Perfect!!",

    c4_a_w1: "There we are — now we can work out how much fence I shall need to buy to keep this field safe.",
    c4_a_w2: "Every stretch of the fence is either {s} long or {b} long — there is nothing else out there. I have drawn the {s} stretches in one colour and the {b} stretches in the other.",
    c4_a_w_qs: "How many stretches of length {s} are there?",
    c4_a_w_hs: "Two of them are the short ends, and two are hiding inside the longer sides.",
    c4_a_w_qb: "And how many of length {b}?",

    c4_a_wt_q: "Which comes to how many magic lengths of wire?",
    c4_a_wt_hint: "Twelve and twenty.",
    c4_a_wt_ok: "{n} magic lengths. That is the wire bought.",

    c4_a_no1: "I say, look at that — it is rather funny, but this field is very nearly a square, is it not?",
    c4_a_no2: "Click on the piece of ground that would make this field a square if we added it on.",
    c4_a_no3: "And here is the funny part: adding that corner has not done the same thing to the wire we need as it has done to the number of trees we can plant. Do we need <b>more wire</b> than before to fence this new big square field?",
    c4_a_no4: "That is right!! We need no more wire to fence the new square field than we needed for the L-shaped one: {eq}, the very number we just bought. And can we plant the same number of trees in the big square field, or more than in the L-shaped one?",
    c4_a_no_q: "Exactly!! We can plant more trees. How many, do you think? Could you work out the ground we have added? How many magic squares does it come to?",
    c4_a_no_f1: "Yes",
    c4_a_no_f2: "No",
    c4_a_no_fno: "Look at the fence itself. Go round the notch, then go round the corner we have just filled in. The two sides on the inside are exactly as long as the two they were standing in for on the outside. Count again.",
    c4_a_no_t1: "Fewer",
    c4_a_no_t2: "More",
    c4_a_no_t3: "Just as many",
    c4_a_no_tno: "Look at the ground this time, not at the fence. The field has grown: the corner we filled in is ground that was not there before, and a tree needs ground.",
    c4_a_no_h1: "It is a square.",
    c4_a_no_h2: "It is a square, and its side is {b}.",
    c4_a_no_h3: "It is a square of side five, so its area is {sq}.",
    c4_a_no_ok: "Yes!!! That is it! {n}! Not one extra length of fence, but twenty-five magic squares more ground, if we were to plant and fence the big square field rather than the real L-shaped one.",
    c4_a_no_ok2: "Remember that corner. We are going to want it again, and by then it will be doing something rather more surprising.",

    c4_a_sd1: "And the seeds are the easy part, for once — the same as they were last quest, and for the same reason. The area is the one thing Marimon wrote down.",
    c4_a_sd_q: "One seed to a magic square. How many tree seeds does the field need?",
    c4_a_sd_hint: "It is the area, read again in a different unit.",
    c4_a_sd_ok: "{n} tree seeds, and {n2} magic lengths of wire. One field done.",
    c4_a_sd2: "Though I will say this. It took us thirty-nine magic squares laid one at a time to find a single number, and we only got away with it because the count came out round. And Marimon and I have found other L-shaped fields. How are we going to manage?",
    c4_a_sd_b1: "Don't worry, we will get there!",
    c4_a_sd_b2: "Goodness, it really is complicated.",

    c4_b_in1: "Here, look at this one, for instance.",
    c4_b_in2: "The long side of the rectangles is {b} this time. And the area… {area}.",
    c4_b_in4: "Either way, dot or no dot, it changes nothing about our problem. How long is {s}? Shall we try the same way? We cover, and we count?",
    c4_b_in_b1: "Come on then!",
    c4_b_in_b2: "Well, this is not very practical!!",

    c4_b_lay1: "Lay the magic squares. As many as it takes.",
    c4_b_lay_ref: "There is nowhere left for it. Look along the bottom and up the left — there is a <b>border</b> of bare ground all round the outside, and it is thinner than a magic square. Not one more will fit.",
    c4_b_lay_done: "That is every whole magic square that will go on.",
    c4_b_cnt_q: "How many whole magic squares did you get down?",
    c4_b_cnt_hint: "Nine standing up the arm, and eight lying along the foot.",
    c4_b_cnt_ok: "{n}. And Marimon's registers say {area}, so we are not finished — there is still the border to cover.",

    c4_b_bd1: "Here is the border on its own, in three pieces: a <b>strip up the left</b>, a <b>strip along the bottom</b>, and the <b>little square</b> where the two of them meet.",
    c4_b_bd2: "And the two strips are the same shape as each other — one standing, one lying. That will save us a job in a moment.",
    c4_b_bd3: "But first: everything here hangs on how wide that border is. Let us measure it.",

    c4_b_ms1: "Let us put the glass on the top edge of that strip, where it runs straight across. Above it, a magic length cut into its ten tenths, to measure against. Lay tenths along the edge until you reach the end of it.",
    c4_b_ms_q: "How many tenths did it take?",
    c4_b_ms_hint: "Count what you laid.",
    c4_b_ms_ok: "{five} tenths, and not a scrap left over. So the border is {half} of a magic length wide — {dec}, just as we learned to write half a magic length on our last adventure.",

    c4_b_fs1: "Look: {s} is the width of the rectangle, and that is one whole magic length plus the width of the yellow strip we have just measured.",
    c4_b_fs_q: "So how long is {s}?",
    c4_b_fs_hint: "One whole magic length, and half of one more.",
    c4_b_fs_ok: "{seq}. That is our answer — if we have not gone wrong measuring the yellow strip. It would be good to check whether we really get the area written in Marimon's registers, would it not?",
    c4_b_fs_b1: "Good idea!!",
    c4_b_fs_b2: "Hmm. Only if the registers are right, mind.",

    c4_b_ck1: "And we can check it, because Marimon gave us the area. If the border really is {dec} wide, the whole field must come to {area} exactly. Let us count the border and see.",
    c4_b_ck2: "The border is thin, so we count it in <b>hundredths of a magic square</b> — the little squares we cut on the weird field. And remember how the two units go together: measure a side in <b>tenths of a magic length</b>, and the area comes out in <b>hundredths of a magic square</b>.",

    c4_b_st1: "Take the <b>yellow</b> strip first. It is {dec} of a magic length across — that is {five} <b>tenths of a magic length</b> — and it runs {nine} up the field.",
    c4_b_st_q1: "How many tenths of a magic length fit along those {nine}?",
    c4_b_st_h1: "Ten tenths to every magic length.",
    c4_b_st_q2: "So how many hundredths of a magic square is the yellow strip? (and remember, if you multiply <b>tenths of a magic length</b> together, the answer comes out in <b>hundredths of a magic square</b>).",
    c4_b_st_h2: "Five TIMES nine is forty-five — then add the zero.",
    c4_b_st_ok: "{eq} hundredths of a magic square.",

    c4_b_st2_q: "And the <b>green</b> strip is the very same rectangle, turned on its side. How many hundredths of a magic square is it?",
    c4_b_st2_h: "The same as the one we just did.",
    c4_b_st2_ok: "The same, of course — {n}. Turning a piece of ground does not change its area.",

    c4_b_co_q: "That leaves the little square in the corner. It is {five} <b>tenths of a magic length</b> along each side, so how many <b>hundredths of a magic square</b> does it cover?",
    c4_b_co_h: "Five TIMES five.",
    c4_b_co_ok: "{n}.",

    c4_b_tt_q: "So the whole border is {eq} — which comes to how many hundredths of a magic square?",
    c4_b_tt_h: "Nine hundred, and twenty-five more.",
    c4_b_tt_ok: "Yes! Well done!! {n} hundredths of a magic square! That is it! And remember, since a hundred hundredths of a magic square make one magic square, to go from the area measured in hundredths of a magic square to the area measured in magic squares you need only move the dot two places: {conv}.",

    c4_b_ad_q: "{whole} whole magic squares, and {part} more. What does the field come to altogether?",
    c4_b_ad_h: "Add the quarter on afterwards.",
    c4_b_ad_ok: "{n}, exactly!! That is the number written in Marimon's registers, right down to the last hundredth. So our working was right, and {s} really is {len}.",

    c4_b_wr_q: "Now let us work out how much wire we need to fence the field: four stretches of {s}, plus four of {b}. How many magic lengths of wire will we need altogether to fence the field?",
    c4_b_wr_h: "Four halves make two, so four times {s} is six.",
    c4_b_wr_ok: "{eq}. Bought.",

    c4_b_sd_q: "So how many seeds can we sow in this field?",
    c4_b_sd_h: "{whole} in the whole magic squares, and {plots} on the carved plots.",
    c4_b_sd_ok: "{n} tree seeds, well done! {whole} in the whole magic squares, and {plots} on Marimon's patches, which have the area of a magic square each. And then there is a little square right at the far end, too small to plant a tree in. Do you remember that we like to plant flowers on ground like that?",

    c4_b_sd1: "And now let us count the seeds we need. One to a magic square — but remember Marimon's rule, the one we learned on our adventure with the weird fields: a tree seed needs a piece of ground with the area of a whole magic square, <b>all in one piece</b>, whatever shape it happens to be. A tree seed does not have to go in a square at all, so long as the ground is in one piece, however crooked, and covers the same area as a magic square.",
    c4_b_sd1b: "How many tree seeds do you think we shall be able to plant in this field? Would you like me to draw Marimon's patches in to help you?",
    c4_b_sd_b1: "Yes please!",
    c4_b_sd_b2: "No need.",
    c4_b_sd2: "There we are! Marimon's patches, a hundred hundredths of a magic square each, are carved out. All that is left is a little square at the far end, smaller than a magic square.",
    c4_b_fl_q: "A flower seed needs one <b>flower square</b> — one hundredth of a magic square. How many flower seeds can we sow on the ground that is left, in the little corner at the bottom right?",
    c4_b_fl_h: "A quarter of a magic square, counted in hundredths.",
    c4_b_fl_ok: "{n} flower seeds. So that is the whole field bought: <b>{trees} tree seeds</b>, <b>{n} flower seeds</b>, and <b>{wire} magic lengths</b> of wire. Not a scrap of it wasted.",
    c4_b_wp1: "Phew!! Well I never! That was not simple. We had to lay 17 magic squares one at a time, measure the width of the strip of ground left over in tenths of a magic length, and count nine hundred and twenty-five hundredths of a magic square to check that we landed on our feet. All that to find <b>s</b>.",
    c4_b_wp2: "And on top of that we were lucky the yellow strip came out at exactly five tenths. If it had come out at four tenths and a bit, we should still be measuring it now.",
    c4_b_wp3: "Marimon and I have found still more fields of this kind to replant, and I do not fancy going through all those steps for every one of them. It would be wonderful if there were a faster way, would it not? You know, a bit like the one we used to measure the square root? What do you reckon?",

    supply_tenths: "Your tenths of a magic length — click on the strip to lay them:",
    c4_b_wp_b1: "Oh yes, that would be wonderful!!",

    c4_c_rl1: "Here is the trick in words, before we write it down.",
    c4_c_rl2: "An L-shaped field is <b>a square with a corner missing</b>. The missing corner is a square too, and the length of its side is the length written down in Marimon's registers — so we can work out the area of the missing square without even having to measure it.",
    c4_c_rl3: "Once we have filled the L-shaped field in with the corner it is missing, we have another larger <b>square</b>, and we know its area. Take its square root and we have the whole side, {sum}. Take the {bn} off that, and what is left is {s}.",
    c4_c_rl4: "Fill it in, root it, take the {bn} off. That is the whole of it — and it will work on every L-shaped field.",

    c4_c_yes: "Yes",
    c4_c_no: "No",
    c4_c_n1: "Look — this is the first L-shaped field, the one we started this adventure with. If we wanted to use our square-root trick, we should have to know the area of a <b>square</b>. Shall we go through them and see?",
    c4_c_n1_a1: "Come on then!",

    c4_c_n6: "There is no use knowing the area of the corner square if all we get out of it is the side of the rectangle, which we knew from the start. So we have not got very far. What do you think — is there another square in this picture whose area we could know, and whose root would give us a length we do not know already?",
    c4_c_n7: "Let us see. That big square there, the one we made by putting the L-shaped field and the corner square together — do you happen to know its area?",
    c4_c_n7a: "All right, all right — you are thinking big, and I like that.",

    c4_c_n8_no: "Look at the side of the big square, all the way along: it runs {s}, and then the 5 magic lengths of the corner. So it is the two of them put together.",
    c4_c_n9: "Yes!!! That is it! Hold on though — this is magic, or something. If we know {sum}, can we get {s} back out of it?",
    c4_c_n10: "Well, if we know {rt}, all we have to do is work out the root of {n} — the length of the big square's side — and take off the 5 magic lengths that belong to the rectangle's side, and there is {s}, no?",
    c4_c_n10_a1: "Yes! Is that magic or what?!",

    c4_c_n13: "Yes! Exactly! {eq}. We say that 3 is 8 <b>minus</b> 5, because we took the 5 off the 8 to find it, and we write {seq}.",
    c4_c_n13b: "But hold on — we have solved the problem without measuring a thing, have we not? Only out of the numbers we found in Marimon's registers, am I right?",

    c4_c_n13_a2: "Wait, I cannot believe it, it is not possible!",
    c4_d_w1: "Fill it in, root it, take the {b} off. Three steps, and they will work on any L-shaped field at all. To remember them easily we are going to write them out as a single line of working — what is called a <b>formula</b>. And so that the formula works for every L-shaped field, we shall use letters in place of the quantities we know: then, for each field, all we have to do is put the letters back to the values we take out of Marimon's registers.",
    c4_d_w2: "The area of the L-shaped field we shall call {a}. That is the letter we used for the area of the square fields last quest, and here too it means the area of the field as written in the registers. The length of the side of each rectangle we shall write {bb} — that one is in Marimon's registers as well. And the side we are after has been called {s} since forever, has it not? So we shall carry on; no reason to change.",
    c4_d_w3: "Then <b>fill it in</b> is {f1} — the field, plus the corner we add.",
    c4_d_w4: "<b>Root it</b> is {f2} — the whole side of the square we have just made.",
    c4_d_w5: "And <b>take the {bb} off</b> leaves us with this:",
    c4_d_w6: "That is the whole method, on one line.",
    c4_d_w7: "Let us try it on a field we already know the answer to, and see whether it tells the truth.",
    c4_d_w_btn: "Try it on the first field!",
    c4_d_a1: "The first field: {a} is {av}, {bb} is {bv}.",
    c4_d_a_q: "{eq}. What is {s}?",
    c4_d_a_h: "Thirty-nine and twenty-five, then the root, then take five off.",
    c4_d_a_ok: "{eq} — our formula works!! And this time there was no need to lay thirty-nine magic squares one at a time to find the answer: we read the two numbers written in Marimon's registers, we apply our formula, and bang!! Out comes the answer.",
    c4_d_c1: "Now the second field, the one that took us all that measuring. {a} is {av}, {bb} is {bv}.",
    c4_d_c_q: "So what goes inside the root?",
    c4_d_c_h: "The area, and the corner, which is eight TIMES eight.",
    c4_d_c2: "{n}. And here we hit something new: {n} is not on Chapter 1's table. {lo}, which is not enough. {hi}, which is too much.",
    c4_d_c3: "So the length of the big square's side is somewhere between nine and ten — and that is <b>exactly</b> what we learned to do last quest: find a square root even when it does not land squarely on a nice round number. (Those nice round numbers, with no figures after the dot, are called <b>whole numbers</b> — shorter and more exact than \"nice round number\" or \"number that lands squarely\".) We know what to do, then. Lay down the biggest square that fits, and share out whatever is left over.",
    c4_d_c_btn0: "Lay the eighty-one down!",
    c4_d_c_r1: "The biggest square that fits inside {n} is {lo}, which is {root} on a side. What is left over runs in two strips, one along the top and one down the side. Do you remember how we do it? We work out the area of that strip, then we try to find its thickness. Let us start with the area: it is the whole area of the big square, less {sq}.",
    c4_d_c_rq1: "{eq}. How much ground is left?",
    c4_d_c_rh1: "Take {lo} off {n}.",
    c4_d_sp1: "{n} of ground left over, running all round the outside of the block. And it is the same three pieces it has always been — a strip along the top, a strip down the side, and the little square in the corner where they meet.",
    c4_d_sp_btn: "Carry the lines across!",
    c4_d_sp2: "There they are. Two strips, each {root} long and {d} across — and the corner, {dd}, which is the piece everybody forgets. Let us take them off the block and lay them out flat.",
    c4_d_sp_btn2: "Lay them out flat!",
    c4_d_fg1: "Two strips and a corner, and together they are the whole {n}. Now — the corner is a square of side {d}, and {d} is the very thing we are trying to find. We cannot work with it. So we do what we did last quest: we <b>forget it</b>.",
    c4_d_fg_btn1: "Forget the corner!",
    c4_d_fg2: "And now the two strips are not enough. They fall short of the leftover by exactly the corner we have just forgotten.",
    c4_d_fg3: "So the strips have to make up for it themselves: each one grows a whisker wider, until the two of them cover the whole leftover on their own. That new width is not {d} any more, so it gets a name of its own — {dt}, a little bigger than {d}.",
    c4_d_fg_btn2: "Widen the strips!",
    c4_d_fg4: "{eq}, exactly. No <b>about</b> in that line: {dt} is what the strips have to be for it to be true.",
    c4_d_jn1: "Two strips of the same width, lying side by side. Push them end to end and they are one long strip — the same ground, in one piece.",
    c4_d_jn_btn1: "Push them end to end!",
    c4_d_jn2: "One strip, {dt} across. And a strip like that is a row of pieces each one magic length long — so let us cut it at every magic length, exactly as we cut a field into magic squares.",
    c4_d_jn_btn2: "Cut it at every magic length!",
    c4_d_jn3: "There. Every one of them a magic length long, and every one {dt} across.",
    c4_d_jn_q: "How many pieces is that?",
    c4_d_jn_h: "{root} from one strip and {root} from the other.",
    c4_d_tl1: "{n} pieces, every one of them a magic length long and {dt} across. Pile them up, one on top of another, and they make a tall thin strip just <b>one magic length</b> wide.",
    c4_d_tl_btn: "Pile them up!",
    c4_d_tl2: "Now the other half of it. All that leftover ground — {area} — pushed into a strip <b>one magic length</b> wide as well. Same ground, same width. So the same height.",
    c4_d_tl_q: "A strip one magic length wide, holding {area}. How many magic lengths tall is it?",
    c4_d_tl_h: "One magic length wide, so every magic length of height is one magic square of ground.",
    c4_d_dv1: "There they stand, side by side and exactly as tall — {n} of our pieces on the left, {height} on the right. Same ground, same width, so we may write an equals between them.",
    c4_d_dv2: "And there is the line we have been working towards. {n} of {dt} make {height}. So how long is a single {dt}?",
    c4_d_dv_btn: "Take one and measure it!",
    c4_d_lay1: "Here is one of the pieces on its own, blown up big. We do what we always do with a length we cannot name: we lay our units along it and count. Click to lay a tenth of a magic length.",
    c4_d_lay2: "Keep going. Click to lay the next tenth.",
    c4_d_lay_over: "And that one runs straight past the end. One piece too many — off it comes!",
    c4_d_lay_btn: "Take it off again!",
    c4_d_lay_q: "So how many whole tenths fit along {dt}?",
    c4_d_lay_h: "Count the ones that went down before the red one.",
    c4_d_c_r3: "Five fit, and the sixth runs past. So the side of the big square is more than {lo9} and less than {hi9}.",
    c4_d_c_r4: "As in our last quest, we could take one more hundredth to be sure of having enough wire, and write <b>about</b>. But I have a feeling about this one. I should like to see whether {half} is not exactly {rt}. Are you happy for us to try, and find out whether that is the right length?",
    c4_d_c_btn: "Come on, let us try!",
    c4_d_c4: "{eq}. It lands exactly. So the root really is {half}.",
    c4_d_c_q2: "{eq}. So what is {s}?",
    c4_d_c_ok2: "All right, I cheated a little — my feeling was just the answer we had already found by laying all those magic squares ;) But look, it does not matter, because if we run one more round of approximation, the way we learned to last quest, we get {s2} — and that is very nearly {sv} after all, and a shade above it, so we should have been sure of not running out of wire.",
    c4_d_c_h2: "Take the eight off the nine and a half.",
    c4_d_c_ok: "{seq}. Our formula works!! We land on the very number we had already worked out, only this time without laying a single magic square — just by reading the two numbers written in Marimon's registers and feeding them into our formula.",
    c4_d_n1: "And now a field we have never touched. Marimon's registers say its area is {av}, and that the rectangles' side is {bv}. Come on — let us go straight at it with the formula, without laying the magic squares one at a time.",
    c4_d_n_q: "What goes inside the root?",
    c4_d_n_h: "Sixty-eight, and five TIMES five.",
    c4_d_n2: "{n}. Another square root that does not land squarely, it seems to me — no? {lo}. Nine is too small. {hi}. Right then, off we go again: we use the tricks we learned during our last quest.",
    c4_d_n_btn: "The root of ninety-three!",
    c4_d_r2: "{tenths} tenths fit along {dt}, and the next one ran past. So {dt} is more than {tenths} tenths and less than {next} — and this time it is not going to land squarely, the way 1.5 did on the L-shaped field we saw just before. {eq} never comes out even, however far we go. That number is in fact {frac} (what people usually call <b>two thirds</b>), but I shall explain why another time, if I get the chance. For now we shall do what we did last quest: go one notch finer and lay hundredths — and, to be on the safe side and sure of having enough wire to go round the field, we shall take one MORE than fits, so that our answer stays big enough.",
    c4_d_r_btn: "Look closer still!",
    c4_d_rh2a: "There is the bit that was left over, on its own and bigger still. Now lay <b>hundredths</b> along it — click to put one down.",
    c4_d_rh2b: "Keep going. Click to lay the next hundredth.",
    c4_d_rh_q: "How many whole hundredths did you manage to lay?",
    c4_d_rh_h: "Count the ones that fitted before the red one.",
    c4_d_rh_ok: "So {dt} is more than {lo} and less than {hi}. It still has not come out even — and it never will. But we said we would take a little more, to be sure of having enough wire (we say we <b>round up</b>).",
    c4_d_r_q2: "So what do we write for {dt}?",
    c4_d_r_h2: "Two thirds is 0.666 and on for ever. Round it UP, so the answer stays big enough.",
    c4_d_r3: "{eq}. That is the root, near enough — and with what we learned last quest we could go round again and get closer still. But that will do us nicely.",
    c4_d_r_q3: "{eq}. So what is {s}?",
    c4_d_r_h3: "Take the five off.",
    c4_d_r_ok: "{seq}. Our first <b>about</b> of this whole chapter — and about is quite enough, so long as it is upwards and the answer comes out a little too big, because you can always cut wire and you can never stretch it.",
    c4_d_wr1: "Then the fence, the way we always do it: four sides of {s} and four of {bb}. So that is {eq}. Let us start with the easy half.",
    c4_d_wr_q1: "{eq1} — how much is that?",
    c4_d_wr_h1: "Four times five.",
    c4_d_wr2: "Twenty, yes. Now {eq2}. That one is a bit big for our table — but we know a trick: {split}, and multiplying by a sum is multiplying each piece and adding them up. That is <b>distributivity</b>, from the weird-field quest.",
    c4_d_wr_q2: "Let us take the easy piece first: {eq2a}?",
    c4_d_wr_h2: "Four times four.",
    c4_d_wr3: "Sixteen. That leaves {eq3}. And do you remember? {frac67} was our {frac} — so {chain}.",
    c4_d_wr_q3: "{eq3b} — how much is that, rounded up?",
    c4_d_wr_h3: "Eight shared between three: two, and two thirds left over.",
    c4_d_wr4: "Good. So we have our three pieces: {eq4}.",
    c4_d_wr_q4: "{eq4} — how much wire altogether?",
    c4_d_wr_h4: "Twenty, and sixteen, and 2.67.",
    c4_d_wr_ok: "{eq} magic lengths. A little more than the field truly needs, which is the right way to be wrong.",
    c4_d_e1: "Three L-shaped fields, and thanks to our formula there was no need to lay a single magic square to find {s}: we read {a} and {bb} in Marimon's registers, we apply the formula, and bang! Out comes the answer.",
    c4_d_e2: "One formula, and it fits on a line: {f}. It always works, whether the answer lands squarely or not.",
    c4_d_e3: "And you have seen the whole of why it works. An L is a square with a corner missing. Fill the corner in and you have a square. A square gives up its side to anyone who can find a root — and finding roots is something we have known how to do since our last quest together, is it not? It does not even frighten us ;)",
    c4_d_celeb: "You turned a shape into a formula!",
    c4_d_celeb_text: "Three L-shaped fields solved from their area alone — and the last of them by a method no covering could ever have reached.",

    c4_e_in1: "Marimon and I have found a new kind of field, and we cannot work out its perimeter — so we cannot say how much wire to buy to fence it. The field is simply <b>a rectangle sitting on top of a square</b>. We know the whole area of the field ({area}) and the length of the rectangle ({r}), but not the side of the square.",
    c4_e_in2: "It is as though we had taken one arm off the L and kept the other. All we are missing is {s}, and then we can work out the field's whole perimeter and decide how much wire to buy. Can you see how we might do it?",
    c4_e_in_a1: "Hmmm, I am not sure.",
    c4_e_in_a2: "Now that one I cannot see at all.",
    c4_e_st1: "Our trick of finding a giant square field whose area we know, and square root we can easily find, and then taking the length of the side rectangle off, worked for <b>L</b> fields — not for rectangles sitting on top of square fields. What can we do?",
    c4_e_st2: "Unless…",
    c4_e_st_btn: "Unless what?",
    c4_e_cut1: "Unless we <b>cut it in half</b>.",
    c4_e_cut_btn: "Cut it in two!",
    c4_e_cut2: "Two halves, each of them {s} wide and {half} long. And now — what do you suppose happens if I tip the top one over and set it down alongside the square?",
    c4_e_cut_a1: "Hmm, I cannot see it.",
    c4_e_cut_a2: "Wait — do not tell me...",
    c4_e_mv1: "There. A square, a rectangle above it, and the same rectangle beside it. <b>That is our L</b> — the shape whose {s} we already know how to find.",
    c4_e_mv2: "And we have not added a scrap of ground nor taken any away. It is the same field, laid out differently: still {area}.",
    c4_e_b1: "But look what has happened to the number we put into our formula: the rectangle was {r} long. Each half is {half}.",
    c4_e_b2: "So when the rectangle is all in one place, with total length {bb} — here {bv} — we <b>halve it first</b>, so that {beq}, here {bh}. And then it is the <b>L</b>-field we already know how to do, with {beq}.",
    c4_e_b3: "So the new formula for these fields — the ones where we know the whole area {a}, and which are made of a square {sq} with a rectangle of known length {bb} sitting on top — is this:",
    c4_e_ap_q: "{eq}. What is {s}?",
    c4_e_ap_h: "Twenty-one and four make twenty-five. What is the root of twenty-five?",
    c4_e_ap_ok: "{eq}.",
    c4_e_ck1: "And we can check it without moving a thing. Put the halves back where they came from: the field is {s} across, and {s} plus {r} tall.",
    c4_e_ck_q: "So what is its area?",
    c4_e_ck_h: "Three across and seven up.",
    c4_e_ck_ok: "{eq} — the number written in Marimon's registers. The formula works!!",
    c4_e_pr1: "So what length of wire do we need to fence this field?",
    c4_e_pr_q: "The field is a rectangle, {w} across and {h} up. That one you can do with your eyes shut ;)",
    c4_e_pr_h: "Two of each side.",
    c4_e_pr_ok: "{eq} magic lengths.",
    c4_e_sd_q: "Then the seeds, and this one is easy: {area}, all of them whole. How many tree seeds?",
    c4_e_sd_h: "It is the area, again.",
    c4_e_sd_ok: "{n} tree seeds and {w} magic lengths of wire. One more field planted and fenced — and one more trick in our basket of tricks: even when a field is not an <b>L</b>, we can always turn it into one and find {s}.",

    c4_f_in1: "Something odd has happened to Marimon and me. We have found a field to replant that is built the same way as the last one: a rectangle up against a square.",
    c4_f_in2: "But this time the ancestors did <b>not</b> write down the whole area of the field. They wrote down only the area of the rectangle up against the square ({cv}), and the whole length of the field's side — square plus rectangle — which is {bv}.",
    c4_f_in3: "Marimon and I are properly stuck. How are we to decide how many seeds we need to replant the field if we do not even know its whole area? And even if we plant only the rectangular part, {cv}, how do we protect it from the Gorns when we do not know either of its sides? This is a very hard problem. Would you help us?",
    c4_f_in_btn: "Of course!",
    c4_f_wt1: "For the field before, we halved the length we knew — the side of the rectangle that had been stuck against the square. But here, the length we know is the <b>whole length of one of the field's sides</b>, square plus rectangle together.",
    c4_f_wt2: "So what do we do? We could try the same trick anyway, and see whether it gives us an <b>L</b> we can use. Are you game? Or would you rather we tried halving the length we do know — the whole {bv} of it — and saw where that got us? What do you think?",
    c4_f_wt_a1: "Cut the rectangle in half, like last time!",
    c4_f_wt_a2: "No — let us halve the length we know.",
    c4_f_dd1: "All right, the same trick as last time: we cut the rectangle down the middle, and we turn one half a quarter-turn and set it on top of the square.",
    c4_f_dd2: "And there it is — a proper <b>L</b>! So can we use our formula on it? For that we need two things: {a}, the whole area of the L, and {bb}, half the rectangle's length.",
    c4_f_dd3: "But we know <b>neither</b>. We have never been told how big the square is, so we cannot add it to the {cv} and get the L's area. And we have never been told how long the rectangle is, so we cannot halve it. We do not even know how big the little corner is, so we cannot fill the L in and make a big square out of it.",
    c4_f_dd4: "So that road is a dead end. It was worth trying — now we know. Let us go back and try the other one: halving the length we <b>do</b> know.",
    c4_f_dd_btn: "Let us go back!",
    c4_f_hf1: "Halve the strip. Two halves of {hv} each, and I have marked the middle.",
    c4_f_hf2: "Now look at where the square ends. It stops <b>short</b> of the mark. Call that little gap {g}.",
    c4_f_hf_btn: "Mark the gaps!",
    c4_f_hf3: "Where do we stand? The square stops {g} short of the mark — so the rectangle picks up that {g} first, and <b>then the whole of the second half as well</b>. It is {hpg} wide.",
    c4_f_hf4: "So the square is {seq} along each side. And the rectangle is {hpg} wide and {hg} deep, because it lies against the square. Are you happy with that?",
    c4_f_hf_a1: "Hmmm, hold on — that is an awful lot of things we do not know. I cannot see how it helps.",
    c4_f_hf_a2: "Mmyes, all right, I think I follow — but I still cannot see how we are going to get out of this.",
    c4_f_rc1: "Hold on — look, we have got somewhere, have we not? We have a rectangular field whose area we know ({cv}), and that is exactly like the fields we were working on a moment ago. And now we have a length we know as well: one side of that rectangle, less {g} — {heq}.",
    c4_f_rc2: "So all we are missing now is an <b>L</b> whose area we know. We must keep the <b>yellow</b> rectangle, {heq} long, and the <b>green</b> one, because between the two of them they are the {cv}.",
    c4_f_rc5: "What do you think — if we tip the green rectangle, {g} across and {s} tall, up above our {heq} rectangle, might we get a proper <b>L</b>?",
    c4_f_rc_a1: "Yes, smart!!!",
    c4_f_rc_a2: "Er, excuse me, what!!! Have you lost your mind??",
    c4_f_rc3: "There. The little piece has turned a quarter turn and settled on top of the big one, tucked into its left-hand corner.",
    c4_f_rc4: "And since nothing has been lost and nothing has been added — we only walked a piece round — the two fields together (yellow + green) still come to {cv}. And now, laid out like that, they look uncommonly like an <b>L</b>, do they not?",
    c4_f_rc4_a1: "Well yes, obviously!",
    c4_f_rc4_a2: "Hmmm, all right, but hold on a minute — something is bothering me.",
    c4_f_ck1: "All right. So we have a field that <b>looks</b> like an L. But to use our line for the side of the square in an L-shaped field, we have to be sure the L can be turned into a <b>square</b> just by adding the piece missing at the top right. And for that, the L's two sides have to be the same length, do they not? Only I am not sure they are. What do you think?",
    c4_f_ck_a1: "But of course they are.",
    c4_f_ck_a2: "Not really, no.",
    c4_f_ck_a3: "So THAT is what was bothering me a moment ago.",
    c4_f_wk2: "Let us just go and look for ourselves. How long is the <b>short</b> side of the green rectangle we have just tipped up above the yellow one?",
    c4_f_wk_no2: "It is the slice we cut off to the left of the halfway mark — the bit by which the square falls short of it.",
    c4_f_wk3: "Yes, exactly: the green rectangle's short side is {g}, the length {s} is missing to reach the halfway mark of our strip ({heq}). And so, in the end, how long is the L's <b>left-hand</b> side?",
    c4_f_wk_no3: "Run your finger up it: first the green rectangle, then the yellow one below it — the two of them, one on top of the other.",
    c4_f_wk4: "Yes!! Quite right, the L's left-hand side is {heq}. And we already know the length of the L's <b>bottom</b> side, do we not? It is {heq} as well — that is how we built it in the first place, by cutting the field's whole length in two.",
    c4_f_wk5: "So we are agreed: our L-shaped field really does have <b>two sides the same length</b>. So if we complete it with the corner missing at the top right, we have a <b>square</b>. Phew — this is going well, don't you think!",
    c4_f_wk_a1: "Yes!!! Enormous.",
    c4_f_wk_a2: "Mmyes, I follow you, go on.",
    c4_f_ms1: "Right — where are we? What do we know and what do we not know, now, in this new L-shaped field we have built? The <b>L</b> is {cv}. Good. In the L-shaped fields we have met before, we added the missing corner's area to the L's, that gave us the big square's area, and we used it to find the big square's side, which we did not know — and then took the rectangle's length off it to get {s}.</p><p style=\"margin-top:10px\">But hold on, look! We <b>already know</b> the big square's side. So there is no point finding it. And therefore — brace yourself — we know the big square's <b>area</b> too, do we not? It is {hsq}. So we can use our trick <b>backwards</b>: if we know the big square's area, and we know the L's, and the big square's area is the L's plus the corner's, then we know the corner's area, do we not? It is the number that makes {eq25}.",
    c4_f_ms_a1: "Of course it is a square!",
    c4_f_ms_a2: "Mmff, I will believe it when I see it.",
    c4_f_ms_q: "So what do you think — what is the area of the corner?",
    c4_f_ms_h: "Twenty-one and how many more make twenty-five?",
    c4_f_ms2: "Yes, splendid!! The corner's area is {nv}. If that corner were a <b>square</b>, we could work out the length of its side — and, hold on, but yes!!! We should only have to take that length off {heq} and we should have {s}! We are nearly there. If only we could make sure the corner at the top right really is a square. What do you think?",
    c4_f_cn1: "Not easy, is it? Right, we do know one thing: the corner's <b>vertical</b> side is {g} long, because it is the width of the green rectangle we set on top. But how long is its other side? Hold on: that length, if you add {s} to it — the width of the green rectangle we set on top — comes to {hv}, the big square's side. So what do you think, what makes {eq}?",
    c4_f_cn_no: "Run along the top of the big square: first the green rectangle, {s} wide, and then the corner. The two of them together are {heq}.",
    c4_f_cn_ok: "Yes!!! You have it — the corner's other side is {geq}, so both its sides are {g}. It really is a <b>square</b>.",
    c4_f_gq: "So, since we know its area (it is {sub}), we can take its root and find {g}: {geqn}.",
    c4_f_gh: "What number TIMES itself makes four?",
    c4_f_gq2: "So how much is that? {rt}",
    c4_f_eq_ok: "{g} is {gv}.",
    c4_f_s_q: "And the length {s} we are after is such that {eq}. So how long is {s}?",
    c4_f_s_h: "Five, less two.",
    c4_f_s_ok: "{seq}. Let us check that we land on our feet. {hv} plus {g} is {other}. {sv} and {other} add to {bv}, and {mult} — exactly the numbers Marimon read in the ancestors' registers.",
    c4_f_ar_q: "The whole field is {bv} long and {sv} deep. What is its area?",
    c4_f_ar_h: "Ten TIMES three.",
    c4_f_ar_ok: "{n} magic squares — and the square part is {sq} of them, so the rectangle is {c}. Everything agrees.",
    c4_f_wr_q: "And the fence, round a strip {bv} by {sv}. How much wire?",
    c4_f_wr_h: "Two of each side.",
    c4_f_wr_ok: "{eq} magic lengths. Bought.",
    c4_f_rl1: "So here is a new formula, one that finds the side of a field made of a square with a rectangle of known area stuck against it, when what you have is the <b>whole length of the field</b> (square plus rectangle) instead of the rectangle's length on its own.",
    c4_f_rl2: "Halve the length. Square the half. Take the area off it. Root what is left — that is {g} — and take it off the half.",
    c4_f_rl3: "All of that looks uncommonly like what we did on the fields before, does it not? We halve. We square. We take a root. But two things change. <b>One:</b> we take the area of the rectangle <b>off</b> the area of the big square, because what we are after is the root of the little corner, {gsq}. <b>Two:</b> we take that root off the <b>halved side</b> — where last time we took the halved side off the root.",

    c4_g_bo1: "Two fields, then, and two different problems to solve. Look at them side by side.",
    c4_g_bo2: "The one before last: a square with a rectangle on top, and {e1}. This one: a square beside a rectangle, and {e2}. They are not exactly the same problem. But they look alike. And their solutions shared similar features: halve the known length, square it, add or take off the known area, root the result, and add it to — or take it off — the halved known length.",
    c4_g_bo3: "Could we maybe write the problem, and its solution, in a way that covers <b>all</b> the cases we have looked at here — and maybe more besides?",
    c4_g_bo_q: "Do you think it is possible?",
    c4_g_bo_yes: "Yes, sure.",
    c4_g_bo_no: "No, I don't believe in miracles.",
    c4_g_bo4: "Let us try to engineer a miracle, then. First, let us write both problems in a way that is similar.",
    c4_g_mv1: "Remember what we did on our quest for square roots — we took the same thing off both sides, and the two sides stayed equal. We took four magic squares off a field and off the number of magic squares that measured its area beside it, and nothing changed.",
    c4_g_mv2: "So let us do the same here: let us take the whole of the right-hand area off <b>both</b> the right and the left, until there is <b>nothing left on the right</b>.",
    c4_g_mv_btn: "Move it all across!",
    c4_g_ow1: "On the first field we take {c} off both sides. On the right that leaves nothing at all. On the left — well, we had no {c} there to take, so now we <b>owe</b> one.",
    c4_g_ow2: "That is what the little dash in front means. {neg} is not a field and never will be. It is a number we are carrying on the wrong side of the line, and it will come out in the wash.",
    c4_g_ow3: "Do the same to the second field, and here is what we get:",
    c4_g_one1: "And now look carefully at our two formulas. They have the same shape, both of them: {form}.",
    c4_g_one2: "The first has {b1} and {c1}. The second has {b2} and {c2}. Those are the only differences between them.",
    c4_g_one3: "And the two minus signs are not there by accident. There is one in front of {ct} when the registers give us the area of the <b>whole field</b> — square and rectangle together — and there is none when the registers give us the area of the <b>rectangle on its own</b>.",
    c4_g_one4: "And {bt} is the side of the rectangle laid against the square, when that is what we were given — {bt1} on the first field. When what we were given is the whole length of the strip instead, {bt} is that length with a minus sign in front: {bt2}.",
    c4_g_one5: "When we write down a formula that describes a problem we are trying to solve, but does not hand us its solution, we call that formula an <b>equation</b>. And when we manage to find a formula that gives the solution straight out, in the form {sol}, we say we have <b>solved</b> the equation. Rather grand-sounding words, but useful ones, you will see. And besides, we have worked hard, and the miracles we have turned up do deserve a name, don't they?",
    c4_g_pm1: "So here is the formula that gathers up everything we have learned, and that ought to solve every case like these:",
    c4_g_pm2: "The little {pm} says <b>plus or minus</b> — because sometimes the square root has to be added on, and sometimes taken off. So there are <b>two answers</b>, always. We shall see later on how to choose the one that solves our problem.",
    c4_g_sg1: "See what our formula does. It halves {bt} and takes it off. When {bt} is <b>positive</b> — {b4} on our first field — that is exactly what we did there: take the halved side off the root of the big square.",
    c4_g_sg2: "When {bt} is <b>negative</b> — {b10} on our second field — it <b>adds</b> the half to the root. That is down to the rule of signs, combined with the associativity of multiplication:",
    c4_g_sg3: "Look at what happens to the square, too. When {bt} is negative, {bteq}, and so:",
    c4_g_sg3b: "— by associativity and commutativity of multiplication. So squaring a number with a minus sign in front gives exactly the same as squaring it without one.",
    c4_g_sg4: "Now look at what happens to the {ct}. When {ct} is <b>positive</b>, we take it off the big square before rooting, to find {g} — which is what we did on our second field.",
    c4_g_sg5c: "with C = 21 on our first field",
    c4_g_sg5: "When {ct} is <b>negative</b> — {ceq} — here is what we do instead:",
    c4_g_sg5b: "— by associativity again. So in that case we <b>add</b> the rectangle's area to the square's, {hh}, because what we are after is the root of the <b>biggest</b> square.",
    c4_g_sg6: "And what the {pm} does is let us either add the root of the square we have built, or take it off. Sometimes the right answer wants it added, sometimes taken off. Let us see how the formula does in practice, on the fields we already know.",
    c4_g_ds1: "Those two minus signs are about to matter, so here is one small thing you will need first. When a minus sign meets a minus sign in a multiplication, the two cancel each other out and a plus comes back:",
    c4_g_ds2: "Two minus signs make a plus. It has a proper name, and it is the one you will meet at school: the <b>rule of signs</b>.",
    c4_g_ds3: "Why it is true is a good story, and it is one for another day. For now, take it and use it — it is one of the most useful little rules there is, and it is about to save us.",
    c4_g_e_q: "And there it is: {eq}. So the two answers are minus two plus five, and minus two minus five. Give me the one that could be the length of the side of an actual field.",
    c4_g_w_l: "Let us try running our new formula on our first field, one piece at a time. Here is the field, and here is the formula. And below it, the problem written in the shape we used to define {bt} and {ct}.",
    c4_g_w_q1: "What is {bt} on this field?",
    c4_g_w_h1: "It is the side of the rectangle laid against the square — and it is written on the picture.",
    c4_g_w_q2: "Good. And what is {h2}?",
    c4_g_w_h2: "Half of four.",
    c4_g_w_q3: "And what is {sq}?",
    c4_g_w_h3: "Two times two.",
    c4_g_w_q4: "Now, what is {ct}?",
    c4_g_w_h4: "What the registers gave us is the area of the whole field, {a} — and when it is the whole field, the {ct} carries a minus sign in front.",
    c4_g_w_q5: "So what is {d}?",
    c4_g_w_h5: "Two minus signs make a plus, so it is four and twenty-one more.",
    c4_g_w_q6: "And what is {rt}?",
    c4_g_w_h6: "Which number, multiplied by itself, gives twenty-five?",
    c4_g_e_h: "Two minus signs make a plus, so under the root there is 4 and 21 more. Then minus two, plus five — and minus two, minus five. Give me the bigger one.",
    c4_g_e_ok: "{three} — our field, and the very number we found by cutting the rectangle in half. And the other one is {neg}.",
    c4_g_e2: "Now, no field has a side of {neg}. You cannot pace out minus seven magic lengths; you cannot fence them. So we set that answer aside — not because it is wrong, but because it is not a proper length of an actual field.",
    c4_g_e3: "Keep it in your pocket. Numbers like that turn out to be useful, and one day somebody will show you what they are for.",
    c4_g_f_q: "And there it is: {eq}. So the two answers are five plus two, and five minus two.",
    c4_g_v_l: "Now the second field, the same way. Here it is, and here is the formula again.",
    c4_g_v_q1: "What is {bt} on this field?",
    c4_g_v_h1: "What the registers gave us here is the whole length of the strip, {b} — and when it is the whole strip, {bt} carries a minus sign in front.",
    c4_g_v_q2: "And what is {h2}?",
    c4_g_v_h2: "Half of minus ten.",
    c4_g_v_q3: "So what is {nh}?",
    c4_g_v_h3: "Two minus signs make a plus.",
    c4_g_v_q4: "And what is {sq}?",
    c4_g_v_h4: "A minus times a minus. Squaring a number with a minus sign in front gives the same as squaring it without one — so it is five times five.",
    c4_g_v_q5: "Now, what is {ct}?",
    c4_g_v_h5: "This time what the registers gave us is the area of the little rectangle on its own, {a} — so no minus sign.",
    c4_g_v_q6: "So what is {d}?",
    c4_g_v_h6: "Twenty-five, take away twenty-one.",
    c4_g_v_q7: "And what is {rt}?",
    c4_g_v_h7: "Which number, multiplied by itself, gives four?",
    c4_g_tw1: "{seven} — this time our formula has <b>not</b> given a nonsense answer. It is a real field, with a square {seven} along each side and a rectangle beside it {three} wide — and we really do get {mult}, the area recorded in Marimon's registers. And the field's whole length is {bv}, exactly as it was written in the registers.",
    c4_g_ot1: "But wait. If we had started from <b>this</b> field instead — the wide square, with the narrow rectangle beside it — our formula would have worked!! But how? We have never met that case, and our formula solves it anyway? How is that possible? Is it a miracle or what? How can it possibly work? Shall we try to find out?",
    c4_g_ot1_a1: "Oh yes, let's!!",
    c4_g_ot1_a2: "Hang on — what, a miracle?",
    c4_g_ot_btn1: "Halve the strip!",
    c4_g_ot3: "The middle falls <b>inside the square</b>.",
    c4_g_ot4: "We cannot cut a rectangle out of it the way we did on the narrow field. But look: last time the square stopped {g} <b>short</b> of the mark. This time it runs {g} <b>past</b> it. The same little gap, the other way round. And so this time we have {eqa}.",
    c4_g_ot4b: "What we want is to cut up the <b>yellow</b> rectangle, whose area we know, and make an <b>L</b> out of it whose side we know the length of — and here, we know {hv}. So off we go: let us cut the yellow rectangle into two rectangles, one {heq} long and one with whatever length is left over. Would you like to see what that gives?",
    c4_g_ot4b_a1: "Yesss, with pleasure!",
    c4_g_ot4b_a2: "Hmm, you are talking Klingon at me.",
    c4_g_ot5: "Look: the field's side (square + rectangle) is still {bv}. Let us call the square's side {s}, and give a letter to the other side of the little rectangle stuck against it — the one that is not {s} — let us call it {ww}. Between the two of them they share out the whole length of the field: {wsb}.",
    c4_g_ot6b: "There. We have cut the yellow rectangle into a piece {hv} along and a smaller one, with what is left over. But what do you think that leftover length is, once we have taken {h} off the rectangle's long side, which is {s}?",
    c4_g_ot6b_no: "The rectangle's long side is {s}. Take {h} off it, and what is left is the very gap the square overshot the mark by.",
    c4_g_ot6c: "Yes!!! Quite right, the green rectangle's side is {g} magic lengths. So — hold on, we are nearly there, are we not? We have a rectangle, the yellow one, which is {cv}; we have cut it into two pieces, one of them {heq} long. And now we make an <b>L</b> out of those two pieces, do we not? And we hope the L will have two sides equal to {heq2}, and that the corner at the top right really will be a square. Shall we?",
    c4_g_ot6c_a1: "Yes, tip the green rectangle over!!!",
    c4_g_ot6c_a2: "What!!! This is not the same as last time!!",
    c4_g_ot7: "And there it is. A quarter turn, round to the side — an <b>L</b>, and still the very same {cv}.",
    c4_g_ot_bs_q: "Do the L's two sides really come to the same length? Let us see: the left-hand one we chose ourselves, so that it would be {hl} = {hv}. Now the hard one is the bottom side &mdash; what do you think its length is?",
    c4_g_ot_bs_w: "It is w",
    c4_g_ot_bs_h: "It is h",
    c4_g_ot_bs_no: "Look again, and lay it against the two halves below. It is longer than {ww}.",
    c4_g_ot_bs_ok: "OK &mdash; so the two sides of the <b>L</b> we built out of the yellow rectangle are the same length, {hq}.",
    c4_g_ot_fl1: "So if we fill the <b>L</b> in by adding the corner missing at the top right, we do have a square of side {hq}. Shall we? Let us fill the <b>L</b> in.",
    c4_g_ot_fl_a1: "Yes, go on!!",
    c4_g_ot_fl_a2: "Hmm, go on then &mdash; you do look like you want to ;)",
    c4_g_ot_ar_l1: "And there it is. The corner is in place, and the <b>L</b> has become a square of side {hq}.",
    c4_g_ot_ar_q1: "So what is the area of the big square those two sides mark out? {sqeq}",
    c4_g_ot_ar_h1: "Five fives.",
    c4_g_ot_ar_ok1: "{a1}, yes! And the <b>L</b> is sitting inside that big square.",
    c4_g_ot_ar_q2: "What is its own area? Remember what it is: the yellow rectangle we cut in two and turned.",
    c4_g_ot_ar_h2: "It is the number written in Marimon's registers, and it has not moved once.",
    c4_g_ot_ar_ok2: "{cv}, exactly &mdash; nothing has been lost and nothing added since the start.",
    c4_g_ot_ar_q3: "So, just as we did before, what is the area of the corner at the top right &mdash; the one we have just added? {ceq}",
    c4_g_ot_ar_h3: "Twenty-five, take away twenty-one.",
    c4_g_ot_cn1: "{a3} for the corner. Hold on!! We are nearly there! We just have to check that the corner really is a square &mdash; then its root will give us the length of its side. What do you make of it? The green rectangle's bottom side we cut to be {g} long on purpose, and it is exactly as long as the corner's own bottom side. So is the corner's right-hand side {g} too? Not easy, is it?",
    c4_g_ot_cn_q: "But we do know that the long side of the green rectangle we have just turned is exactly the width of the yellow one. And how long is that?",
    c4_g_ot_cn_no: "Look at the yellow rectangle's width, marked under the field: the green rectangle's long side is exactly that.",
    c4_g_ot_cn_ok: "Yes!! Well done! That is it &mdash; the green rectangle's longer side is {ww}. And now, since we know the <b>L</b>'s side (and so the side of the big square it makes) is {hl}, and the corner's side is exactly what is missing to close the gap between {ww} and {hl}, we know that {weq}, with {qm} the length of the corner's right-hand side.",
    c4_g_ot_cn2_q: "What do you think it comes to?",
    c4_g_ot_cn2_no: "Look at the big square's right-hand side: the green rectangle takes {ww} of it, and the whole square is {hl}. What is left above it is the corner.",
    c4_g_ot_cn2_ok: "Yes!! Both of the top-right corner's sides come to {g}, so it really is a square!! And we know its area, remember: the big square, {sqeq}, less the area of the <b>L</b>, which is the same area as the yellow rectangle we started from ({cv}). So taking the square root will hand us {g}, will it not?",
    c4_g_sv_no: "Look at the field: {s} is the orange square's side, and it is longer than {hl}. So something has to be added to {hl}, not taken off it.",
    c4_g_sv_ok5: "Yes!! {seq}. {s}, the orange square's side we have been after since the very start, is {hl} &mdash; half the whole field's length {bl}, square plus rectangle &mdash; plus the {g} that is missing, because half of {bl} falls short of {s} by exactly {g}.",
    c4_g_ot10: "Right &mdash; where are we? We are after {s}, are we not? And we now know {heq} and {geq2}. Do you think we can find {s} now, from those two lengths alone?",
    c4_g_sv_q1: "Which formula do you think we should use?",
    c4_g_sv_q4: "{geq}. So how many magic lengths is {g}?",
    c4_g_sv_h4: "What number TIMES itself makes four?",
    c4_g_sv_q5: "And so how many magic lengths is {s}?",
    c4_g_sv_h5: "Five and two more.",
    c4_g_sv_ok: "Yes!!! {seq7}. There we are &mdash; we have got hold of the trick that lets the formula find the right answer on this field too.",
    c4_g_sv_pm: "It is the {pm} in front of the {rt} that is there to cover both cases at once: the narrow field, and the wide one. The formula always gives two answers &mdash; the one that goes with the narrow field, and the one that goes with the wide one.",
    c4_g_ot12: "So whether the field is narrow or wide, we now know how to build a square of side {hb} = {hv} out of it, and its area is always the {cv} plus the little corner square of area {gsq}. Which gives us {g} every time: {geq}.",
    c4_g_ot13: "And then one look settles the rest. When the square's side is the <b>shorter</b> side of the field, we take {g} off half the length {bl}: {seq1}. When the square's side is the <b>longer</b> one, we add {g} on: {seq2}. One trick, one {g}, two answers &mdash; and it is the shape of the field that says which is the right one. Hence the formula, written out in full:",
    c4_g_tw3: "Both answers are <b>real lengths</b> this time. Marimon's registers gave us one single length and one single area, and <b>two different fields could fit</b>, if our formula is to be believed. Do you think that is possible? Or is our formula wrong? It has already invented negative lengths, so anything is possible, is it not?",
    c4_g_tw3_a1: "Yes, that is true.",
    c4_g_tw3_a2: "I do not know — I hope not.",
    c4_g_tw_q: "So how do we tell them apart? Look at the two of them. On one, the square is <b>narrower</b> than the rest of the strip. On the other it is <b>wider</b>. Which one of these two fields has the same shape as the field we started with?",
    c4_g_tw_no: "Look again — our square was {three} along, and the rectangle beside it was {seven} wide.",
    c4_g_tw_ok: "{three} — that is it, our field, the one we want to replant: it is narrow and long. Where the other is thicker, almost a square. And that is how we tell our two answers apart: is the square's side the same length as the <b>long</b> side or the <b>short</b> side of the rectangle it is stuck against?",
    c4_g_en1: "Well now &mdash; we have learned a thing or two, don't you think!!",
    c4_g_en2: "We took a field that was a square with a corner missing, and filled the corner in. We took a field that was a square with a rectangle stuck on, and cut the rectangle in half. We took a field that was a square beside a rectangle, and found the little square hiding in the difference. Three shapes, and every one of them turned into a square we could take the root of.",
    c4_g_gen1: "So: every time some number of square areas ({eq}) has a rectangular field laid against it &mdash; a rectangle that is either so many of the same side ({bs}) or a known area ({c}) &mdash; and the field's whole area is either known, or equal to {s} multiplied by a known number, the problem can always be written down the same way, and always solved the same way:",
    c4_g_gen2: "And when {one}, the problem is just {eq}, and the solution is much simpler: halve the {bt} side, square it, take {ct} off, take the root of what is left, and either add it to minus the half or take it off it.",
    c4_g_gen3: "I myself much prefer that formula. So much so that when {one} is not true, I often turn {eq} into {sub} &mdash; with {defs} &mdash; solve for the capital {sub2} with the prettier formula, and then come back to {s} using {back}.",
    c4_g_gen4: "Sometimes it is simpler still to write the problem straight off as {eq}, this time with {defs}. Then the prettier formula reads {s} back for you directly.",
    c4_g_gen5: "Why does the school's complicated formula give the same answer as our prettier one when {one}? To see that, we need a little working out, and you are very nearly able to do it yourself now. All we need is the associativity of multiplication, its distributivity over addition, and the fact that {r1} and {r2}, which is called {laws} and is useful all the time:",
    c4_g_gen6: "And there we are, with {b} being {bt} and {c} being {ct}.",
    c4_g_gen_laws: "the root laws",
    c4_e8_in1: "One last thing before we finish, and it is all yours. Marimon has been busy: here are eight more fields, and every one of them is one of the shapes you now know.",
    c4_e8_end: "Well done!!! You solved those eight problems like a champion! And now we can work out how many seeds to buy and how much fence we shall need, and I can go to market and get the lot! Thank you for your help!! You are a star!",
    c4_e8_in2: "Under each one is what he wrote down. Read {bt} and {ct} off the shape, and then run our formula. Six of them have {one}; the last two do not, and on those you may pick whichever road you like.",
    c4_e8_qb: "Field {n}. Its equation is written in the form {d}. What is {bt}?",
    c4_e8_hb: "Read it off the field, the way we have all along.",
    c4_e8_qat: "First we must work out how many times the little square's side was multiplied to give the big square's side. Call it {at}: it is the number with {aeq}, that is {req}. So what is {at}?",
    c4_e8_hat: "Which number, multiplied by itself, gives four?",
    c4_e8_qbs: "Good. Now {bt} is the number you have to multiply {ateq} by to get {b}: {bd}. So what do you think: {bq}",
    c4_e8_hbs: "Minus twenty, shared into two.",
    c4_e8_qc: "And what is {ct}?",
    c4_e8_hc: "Careful with the sign.",
    c4_e8_qsq: "Now the piece under the root: what is {sq}, that is {e}?",
    c4_e8_hsq: "Halve it, square the half, and take the other one off.",
    c4_e8_qrt: "And what is {rt}?",
    c4_e8_hrt: "Which number, multiplied by itself, gives that?",
    c4_e8_qs: "So what is {cap}? Take {e}.",
    c4_e8_hs: "Minus the half, plus the root.",
    c4_e8_qbd: "Then let us share the whole equation out by {a}. First {b}: we want the number that, multiplied by {a}, gives {b} &mdash; {eq}. The table below will help you find it. What is it?",
    c4_e8_hbd: "Run down the lit column until you meet the number you want, and remember the rule of signs.",
    c4_e8_qcd: "And now {c}, the same way: {eq}. What is it?",
    c4_e8_hcd: "Run down the lit column again.",
    c4_e8_cd_told: "And now {c}, the same way — except this one does not come out whole, so I shall give it to you: {eq}.",
    c4_e8_new_q: "And what we have just done — sharing {b} and {c} out by {a} — is simply building a <b>different field</b>, one with the very same {s} as ours but with {one}. Shall I show you it?",
    c4_e8_new_a1: "Yes, show me!",
    c4_e8_new_a2: "If you must.",
    c4_e8_pw_q: "Before we take the number, look at the field. Is it the <b>wide</b> one, where {x} — the side of the square — is as long as the rectangle's <b>long</b> side? Or the <b>shallow</b> one, where {x} is only as long as its <b>short</b> side?",
    c4_e8_pw1: "The wide one",
    c4_e8_pw2: "The shallow one",
    c4_e8_pw_no: "Look again at the picture. The square takes up more of the strip than the rectangle beside it does.",
    c4_e8_ps_q: "The wide one, yes. So which of the two is the right number for {x}?",
    c4_e8_ps_no: "The wide one is the bigger of the two answers.",
    c4_e8_qdiv: "And now back to {s}: we know that {seq}, so {s} is the number with {eq2} &mdash; half of {sv}. How much is that?",
    c4_e8_hdiv: "Share it into two.",
    c4_e8_qd: "The lump under the root first: what is {d}?",
    c4_e8_hd: "Square {b}, then take four times {a} times {c} off it.",
    c4_e8_done: "{seq}. And the other answer is {other}.",
    c4_e8_done2: "{seq}. And the other answer is {other} — and <b>that one is a field too</b>, just as it was back on the strip we solved twice. So which did Marimon mean? Look at the picture: his square is <b>wider</b> than what lies beside it, {sq} against {rest}. One glance, exactly as before.",
    c4_e8_pick: "This one is not {one}: it reads {eq}. Three roads lead to the answer, and they all arrive. Take whichever you like.",
    c4_e8_r1: "Name the widened square S",
    c4_e8_r2: "Divide it all by a",
    c4_e8_r3: "The school formula",
    c4_g_celeb: "Return of the Root — complete!",
    c4_g_celeb_text: "One equation, two answers — and not one magic square laid to find any of them.",

    btn_play_again: "Play again",
    c4_g_the_end: "THE END",
    c4_h_in1: "Marimon and I have found a new field, stranger still. The ancients built it starting from a small square field &mdash; side {s}. Then they cleared a square field whose side is three times as long as {s}, {ss} = {as}. Then they laid a rectangular field of {cv} against the big square.",
    c4_h_in3: "And all they wrote in their registers is the length of the whole field, square and rectangle together: {bv}.",
    c4_h_in4: "My problem is finding {s}, because I have planted a very rare flower in it, and I do not want the Gorns eating it. How do we go about that?",
    c4_h_lk1: "Write down what we know, the way we always do. The big square is {as} along each side, and beside it a rectangle of {cv}, and the two of them {bv} long:",
    c4_h_lk2: "Look at that line. {as} is in it twice, and plain {s} is in it nowhere.",
    c4_h_nm1: "Let me show you a useful trick. Give the piece that keeps turning up a name of its own — call it {ss}. Then the line becomes:",
    c4_h_nm2: "And we have <b>solved that line already</b>. It is the field before last, word for word: {eqf}. Same numbers, same everything.",
    c4_h_sv_q: "Its two answers were {seven} and {three}. Look at the drawing &mdash; is {ss} the length of the rectangle's long side, or of its short side? So is {ss} {tn} or {sn} magic lengths?",
    c4_h_sv_h: "The smaller of the two.",
    c4_h_sv_ok: "{ss} is {three}.",
    c4_h_dv_q: "But {ss} is not quite what I need, is it? What I need is {s}. And {seq} is three times the thing I am after. So how long is {s}?",
    c4_h_dv_h: "Three of them make three.",
    c4_h_dv_ok: "{seq}. One magic length. That little square in the corner is one magic square of ground, and the flower is in it.",
    c4_h_fc_q: "So how much of the extra-strong wire does Eliel need to fence it?",
    c4_h_fc_h: "Four sides of one.",
    c4_h_fc_ok: "{n} magic lengths. That is the smallest fence in four quests.",
    c4_h_gn1: "And the trick has a shape, like all the others.",
    c4_h_gn2: "When the thing that keeps turning up is not plain {s} but {as} &mdash; some number of times {s} &mdash; we do not panic, we adapt: we go looking for {seq} first, we run our formula to find {ss}, and then we go after {s}, by cutting {ss} into {at} pieces and measuring how long one of them is.",
    c4_h_gn3: "Name it, solve it, divide by the number in front. Three moves again.",

    c4_h_sc1: "Ah, one last thing, and it is not about fields at all. It is about how you will meet our formula when they set it in front of you at school.",
    c4_h_sc2: "Instead of keeping the {as} together, they multiply it out into {expand}, and they rename the three numbers standing in front of the three pieces of the problem, giving them small new names of their own: {abc}.",
    c4_h_sc_q1: "Then the line is written this way. There is one lump in it to work out first: {disc}. What does it come to?",
    c4_h_sc_h1: "Nine hundred, less four times nine times twenty-one — which is seven hundred and fifty-six.",
    c4_h_sc_q2: "{n}. And what is its square root?",
    c4_h_sc_h2: "Twelve TIMES twelve.",
    c4_h_sc_ok: "So the two answers are {r1} and {r2} — and {simp}. The same two we had, exactly: our {one}, and the other root shared out three ways.",
    c4_h_sc3b: "It is a mouthful, and it is the same line we already had with the pieces multiplied out. But that is the one written on the board, so now you have seen where it comes from.",
    c4_h_fs_qn1: "This one does not come out even. But we know one thing already: {s0} times {s0} is {s0sq}, from the field before — and that is just under our number. What is {nx}?",
    c4_h_fs_hn1: "Twenty tens.",
    c4_h_fs_qn2: "So the root is more than {s0} and less than twenty. And now our old trick, from the quest before this one: the biggest square that fits is {s0sq}, so how much is left over? {rem}?",
    c4_h_fs_hn2: "Three hundred and seventy-two, take away three hundred and sixty-one.",
    c4_h_fs_qn3: "And that leftover gets shared into {two} equal pieces. What is {two}?",
    c4_h_fs_hn3: "Two nineteens.",
    c4_h_fs_qn4: "Eleven shared into thirty-eight is a shade under a third — {sh} in hundredths, rounded <b>up</b> as a share always is. So what is {sum}?",
    c4_h_fs_hn4: "Nineteen and twenty-nine hundredths.",
    c4_h_fs_approx: "So the root is about {rt}, and {half} gives {sv}. Last time we said {old}, because that round rounded <b>up</b> too, one step earlier. Same field, same method — we simply stopped in a different place, and both answers are a whisker too big, which is the safe way to be wrong about a fence.",
    c4_h_fs_qd: "Now put them into the formula and let us see what comes back. First the lump under the root: what is {d}?",
    c4_h_fs_hd: "{b} times {b} is {bb}. And 4 times {a} times {c} is {fac}. Take the second away from the first.",
    c4_h_fs_qr: "And what is {rt}?",
    c4_h_fs_hr: "{r} times {r}.",
    c4_h_fs_qs: "So what is {e}?",
    c4_h_fs_hs: "Work out the top first, then share it into the bottom.",
    c4_h_fs_done: "{seq} — the very side we found the first time round, by cutting the field up. The formula gets there too. And the other answer is {other}.",
    c4_h_fs_l1: "Now let us go back over every field of this quest and read its {a}, {b} and {c} off it. Here is the very first one. Its area says one thing, and moved all to one side it says the other — and from that, {tri}.",
    c4_h_fs_l: "The next one. Same two lines, and from them {tri}.",
    c4_h_fs_qa: "{aeq}. What is {a}?",
    c4_h_fs_ha: "One times one.",
    c4_h_fs_qb: "{beq}. And {b}?",
    c4_h_fs_hb: "One times {bt}, which leaves it exactly as it was.",
    c4_h_fs_qc: "{ceq}. And {c}?",
    c4_h_fs_hc: "It is {ct} itself.",
    c4_h_fs_ok1: "Good. And look what {a} came to: <b>one</b>. It will be one on every field of this quest but the last, because the piece that keeps turning up is plain {s2} — so {at} is 1, and {a} is 1 times 1. And when {a} is 1, that mouthful of a formula is exactly the line we already had.",
    c4_h_fs_ok: "Same again. {a} is 1, because the repeating piece is plain {s2}.",
    c4_h_sc_way: "So the school way of writing our problem — finding the side of a square with a rectangular field clipped along it — is {eq}.",
    c4_h_sc_form: "And, for reasons we shall come to a little later, the solution to that problem is given this less nice-looking form:",
    c4_h_sc_check: "Let us check how that formula works on our fields. Start with the one we have just done.",
    c4_h_sc_qa: "{aeq}. So what is {a}?",
    c4_h_sc_ha: "Three times three.",
    c4_h_sc_qb: "{beq}. And what is {b}?",
    c4_h_sc_hb: "Three times minus ten. Three lots of a debt of ten.",
    c4_h_sc_qc: "{ceq}. And what is {c}?",
    c4_h_sc_hc: "It is {ct} itself, with nothing done to it.",
    c4_h_sc_qbb: "Now the lump under the root, one piece at a time. What is {bb}?",
    c4_h_sc_hbb: "Minus thirty times minus thirty. Two minus signs make a plus, so it is thirty times thirty.",
    c4_h_sc_qfac: "And what is {fac}?",
    c4_h_sc_hfac: "Four times nine is thirty-six, and thirty-six times twenty-one.",
    c4_h_sc_q2a: "And what is {twoa}?",
    c4_h_sc_h2a: "Two times nine.",
    c4_h_sc_qr: "So one of the two answers is {r}. What does it come to?",
    c4_h_sc_hr: "Eighteen shared into eighteen.",

    c4_lbl_area: "{a} magic squares",
    c4_lbl_len: "{s} magic lengths",
    c4_lbl_len_one: "1 magic length",
    c4_lbl_sq: "the square",
    c4_lbl_arm: "the standing rectangle",
    c4_lbl_foot: "the lying rectangle",
  },
  fr: {
    page_title: "Le Retour de la Racine",
    celeb_title: "Quête terminée !",

    c4_a_in1: "Nous avons déjà réalisé beaucoup de choses ensemble, toi et moi. Nous avons replanté des arbres sur mes champs qui avaient brûlé, nous les avons protégés avec du fil de fer, même quand le champ était bizarre et que ses dimensions ne tombaient jamais juste. Nous avons retrouvé le côté de champs carrés à partir de leur aire, pour pouvoir les clôturer sans avoir à les remesurer. Pfou, quel travail ! Que d'aventures ! Tu as été formidable ! Malheureusement, nous n'avons pas encore fini de replanter toute ma belle forêt.",
    c4_a_in2: "Marimon et moi venons de trouver un nouveau type de champ autrefois couvert d'arbres, et maintenant tout sec et noir. Ces champs-là ne sont pas carrés. Tiens, regarde, il y en a un en dessous. Quand mes ancêtres les ont délimités, il y a des siècles de cela, quand ils ont planté la forêt, ils ont créé des champs en <b>L</b>, en posant deux rectangles de même surface contre un champ carré.",
    c4_a_in3: "Dans leurs registres, ils avaient bien noté la surface totale de ces champs : celui-là fait {area}. Ils avaient aussi noté la longueur des rectangles : ceux-là font {b}. Mais ils avaient noté la longueur du côté du carré dans un registre plus ancien, celui qui contenait les dimensions des champs carrés, et ce registre, Marimon l'a perdu.",
    c4_a_in4: "Pourtant, il nous faut replanter ce champ et le protéger des Gorns avec une clôture. Mais comment faire si on ne connaît pas la longueur du côté du carré — celle que j'appelle {s} ? Tu veux bien m'aider à la trouver ?",
    c4_a_in_yes: "Allons le chercher !",
    c4_a_in_no: "Un champ qui n'est pas carré ?",

    c4_a_sh1: "Le voici, avec ses trois morceaux.",
    c4_a_sh2: "Le <b>carré</b>, en bas dans le coin. Son côté vaut {s}, le {s} que nous cherchons.",
    c4_a_sh3: "Et les deux <b>rectangles</b>, l'un debout et l'autre couché. Chacun mesure {b} de long — c'est ce qui est noté dans les registres que Marimon a pu retrouver — et {s} de large, puisqu'ils sont posés contre le carré.",
    c4_a_sh_btn: "Montre-moi les morceaux !",
    c4_a_sh4: "Voilà le champ tout entier. Deux de ses côtés valent {s} et deux valent {b}, et chacun des trois morceaux a un {s} caché quelque part. Et la surface totale du champ est de {area}.",

    c4_a_kn1: "Ce champ est très différent de tous ceux que nous avons rencontrés dans nos précédentes aventures.",
    c4_a_kn2: "Dans notre dernière quête, le {s} que nous ignorions était à <b>un</b> seul endroit : c'était le côté d'un champ carré dont nous connaissions l'aire {a}, qui valait {s} FOIS {s}. Ici, {s} est à <b>trois endroits à la fois</b>. C'est le côté du carré, et c'est la largeur des deux rectangles. Lorsque tu agrandis ou que tu raccourcis {s}, les trois morceaux du champ changent de surface.",
    c4_a_kn3: "Et que savons-nous ? Les registres que Marimon a retrouvés nous donnent l'aire totale du champ, {area}, et la longueur des rectangles, {b}. Comment faire pour retrouver {s} ? Est-ce que tu veux qu'on fasse comme avec le tout premier champ de notre dernière quête — on essaie de recouvrir le champ de carrés magiques, et on compte combien tombent dans le carré ?",
    c4_a_kn_a1: "Oui, essayons !!",
    c4_a_kn_a2: "Hmmm, je ne sais pas trop, mais il faut bien commencer quelque part.",
