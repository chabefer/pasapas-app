// misleads about the thing the child is about to do. Whole magic lengths are well over
// TRAYMIN and so stay exactly true to size; the tenth is still visibly the small one (18px
// against 46px), and the honest 1:10 lives where it belongs, on the field.
const TRAYMIN = 18;

function supplyGroup(g, horiz) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px; margin:0 12px;';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:6px;' +
    `flex-wrap:wrap; max-width:${horiz ? 540 : 130}px;`;
  const drawLen = Math.max(g.len, TRAYMIN);
  const th = Math.min(6, drawLen / 4);   // ticks can never outrun the body
  const boxW = horiz ? drawLen : 22;
  const boxH = horiz ? 22 : drawLen;
  for (let i = 0; i < g.n; i++) {
    const ml = document.createElement('div');
    ml.className = 'magic-length';
    ml.draggable = true;
    ml.dataset.kind = g.kind;          // read on drop: which unit the child chose
    ml.style.width = boxW + 'px';
    ml.style.height = boxH + 'px';
    ml.style.display = 'flex';
    ml.style.alignItems = 'center';
    ml.style.justifyContent = 'center';
    // neutral in the tray, like Ch1 — unless the screen has a colour for this unit already
    ml.innerHTML = lengthSVG(horiz, drawLen, null, null, g.col || '#3a3a3a', th);
    ml.addEventListener('dragstart', e => {
      currentDraggedLength = ml; ml.classList.add('dragging');
      e.dataTransfer.setData('text/plain', g.kind);
    });
    ml.addEventListener('dragend', () => { ml.classList.remove('dragging'); currentDraggedLength = null; });
    row.appendChild(ml);
  }
  const cap = document.createElement('div');
  cap.textContent = t(g.capKey);
  cap.style.cssText = 'font-family:Georgia,serif; font-size:12px; color:#8a7a5c;';
  wrap.appendChild(row);
  wrap.appendChild(cap);
  return wrap;
}

function wireSupply(groups, horiz) {
  const label = document.createElement('div');
  label.id = 'supply-label';
  label.textContent = t('c2_c_supply');
  gameArea.appendChild(label);
  const area = document.createElement('div');
  area.id = 'supply-area';
  area.style.alignItems = 'flex-start';
  groups.forEach(g => area.appendChild(supplyGroup(g, horiz)));
  gameArea.appendChild(area);
}

// Wire one side, with BOTH units available. The choice between them is the new thing here,
// and neither wrong choice is punished: laying a tenth while a whole one still fits is
// refused with "use the big pieces first" — which is quietly the carry's own principle, met
// a few screens before it matters — and reaching for a whole one that no longer fits is
// refused with "it would stick out past the corner", which is Part A's discovery, recalled.
function wireSide(cfg) {
  const side = cfg.side, horiz = SIDE[side].horiz, n = SIDE[side].n;
  const { stage, rect, W, H } = wireStage();
  (cfg.done || []).forEach(s => drawWire(stage, s, W, H));

  let nw = 0, nt = 0;
  const off = () => nw * PX + nt * TPX;

  function layWhole() {
    if (nw >= n.w) { say('Eliel', t('c2_c_too_big')); return; }
    wirePiece(stage, side, off(), PX, W, H);
    nw++; after();
  }
  function layTenth() {
    if (nt >= n.t) return;
    if (nw < n.w) { say('Eliel', t('c2_c_use_big')); return; }
    wirePiece(stage, side, off(), TPX, W, H);
    nt++; after();
  }
  function after() {
    if (nw < n.w)      say('Eliel', t('c2_c_keep'));
    else if (nt === 0) say('Eliel', t('c2_c_switch'));
    else if (nt < n.t) say('Eliel', t('c2_c_keep'));
    else {
      strip.style.cursor = rect.style.cursor = 'default';
      cfg.onComplete();
    }
  }

  const BAND = HIT + 16;
  const strip = document.createElement('div');
  strip.id = 'measure-strip';        // handle used to drive this in tests
  strip.style.cssText = 'position:absolute; cursor:pointer; z-index:3;' + (horiz
    ? `left:${PAD}px; top:${PAD + H - BAND / 2}px; width:${W}px; height:${BAND}px;`
    : `left:${PAD - BAND / 2}px; top:${PAD}px; width:${BAND}px; height:${H}px;`);
  // A bare click lays whatever fits next, so clicking alone always works; the tray is where
  // the choice between the two units actually gets made.
  strip.addEventListener('click', () => (nw < n.w ? layWhole() : layTenth()));
  strip.addEventListener('dragover', e => e.preventDefault());
  strip.addEventListener('drop', e => {
    e.preventDefault();
    const kind = currentDraggedLength && currentDraggedLength.dataset.kind;
    if (kind === 'tenth') layTenth(); else layWhole();
    if (currentDraggedLength) { currentDraggedLength.remove(); currentDraggedLength = null; }
  });
  stage.appendChild(strip);

  gameArea.appendChild(stage);
  wireSupply([
    { n: n.w, len: PX,  kind: 'whole', capKey: 'c2_c_lbl_wholes' },
    { n: n.t, len: TPX, kind: 'tenth', capKey: 'c2_c_lbl_tenths' },
  ], horiz);
}

// The field with some sides already wired. `styles` maps a side name to its drawWire options
// ({} for plain green); only the sides it names are drawn. Sides listed in `todo` are one
// click each: the child has measured their opposite numbers already and there is nothing left
// to discover.
function wiredField(styles, todo, onAllDone) {
  const { stage, W, H } = wireStage();
  Object.keys(styles || {}).forEach(s => drawWire(stage, s, W, H, styles[s]));
  let left = (todo || []).length;
  (todo || []).forEach(side => {
    const horiz = SIDE[side].horiz, BAND = HIT + 16;
    const strip = document.createElement('div');
    strip.className = 'perimeter-zone';
    strip.style.cssText = 'position:absolute; cursor:pointer; z-index:3; background:transparent;' + (horiz
      ? `left:${PAD}px; top:${PAD + (side === 'top' ? 0 : H) - BAND / 2}px; width:${W}px; height:${BAND}px;`
      : `left:${PAD + (side === 'right' ? W : 0) - BAND / 2}px; top:${PAD}px; width:${BAND}px; height:${H}px;`);
    function cover() {
      if (strip.dataset.done) return;
      strip.dataset.done = '1';
      strip.style.cursor = 'default';
      drawWire(stage, side, W, H, styles && styles[side]);
      if (--left === 0 && onAllDone) setTimeout(onAllDone, 350);
    }
    strip.addEventListener('click', cover);
    strip.addEventListener('dragover', e => e.preventDefault());
    strip.addEventListener('drop', e => {
      e.preventDefault(); cover();
      if (currentDraggedLength) { currentDraggedLength.remove(); currentDraggedLength = null; }
    });
    stage.appendChild(strip);
  });
  gameArea.appendChild(stage);
  return stage;
}

// The carry, laid out and seen. Eighteen tenths side by side, with a whole magic length hung
// directly above the first ten and a dashed line dropped from its far end — so the child can
// watch the tenth piece land exactly under where it stops. The grouping that follows then
// CONFIRMS something they have already noticed, instead of performing a trick on them.
//
// One tenth is 23px here: half the lens's 10×. At the lens's own scale eighteen of them would
// be 828px and run off the screen. The only job of a zoom is to make the thing countable —
// the same argument that gave Part B's three lenses three different magnifications.
const CPX = 23;

// `opts` is Part E's, and additive: {n} how many tenths (default Part C's 18), {prelaid}
// to lay them all at once rather than have the child lay them — Part E is CHECKING a rule
// there, not discovering the regrouping, and it has already been laid once — and {split} to
// mark where one run of tenths ends and the next begins, so 14 reads as 7 and 7.
function carryRow(onFull, opts) {
  const o = opts || {};
  const N = o.n == null ? C2T : o.n;
  const total = N * CPX, x0 = 24;
  const box = document.createElement('div');
  box.style.cssText = `position:relative; width:${total + 2 * x0}px; height:112px; margin:16px auto 0;`;
  const add = css => { const d = document.createElement('div'); d.style.cssText = css; box.appendChild(d); return d; };

  const refLab = add(`position:absolute; left:${x0}px; top:0; width:${CKEEP * CPX}px;` +
    `text-align:center; font-family:Georgia,serif; font-size:13px; color:${CORANGE};`);
  refLab.textContent = t('c2_c_ref_lab');
  const ref = add(`position:absolute; left:${x0}px; top:24px;`);
  ref.innerHTML = lengthSVG(true, CKEEP * CPX, null, null, CORANGE);
  // "where it stops" has to be a place on the row below, not something the child holds in
  // their eye across 40px of white space.
  const dash = add(`position:absolute; left:${x0 + CKEEP * CPX - 1}px; top:34px; width:0; height:36px;` +
    'border-left:2px dashed #8b5e3c; opacity:.55;');

  add(`position:absolute; left:${x0}px; top:70px; box-sizing:border-box;` +
    `width:${total}px; height:${HIT}px; border:2px dashed #c9b88b; border-radius:3px;`);

  // A fused magic length keeps its ten tenth-marks, a shade lighter than the end ticks: the
  // same ten pieces of wire are still there, they are simply counted as one now. Shared with
  // harvest(), which lifts those very bars out.
  let inner = '';
  for (let i = 1; i < CKEEP; i++) inner +=
    `<line x1="${i * CPX}" y1="${HALF - 4}" x2="${i * CPX}" y2="${HALF + 4}" ` +
    'stroke="#f0c9a0" stroke-width="2"/>';

  let laid = 0;
  const pieces = [];
  function lay(quiet) {
    if (laid >= N) return;
    const d = add(`position:absolute; left:${x0 + laid * CPX}px; top:70px; pointer-events:none; z-index:2;`);
    d.innerHTML = lengthSVG(true, CPX, null, null, CPURPLE);
    pieces.push(d);
    laid++;
    if (quiet) return;
    if (laid < N) say('Eliel', t('c2_c_keep'));
    else { hit.style.cursor = 'default'; if (onFull) onFull(); }
  }

  const hit = add(`position:absolute; left:${x0 - 8}px; top:60px; width:${total + 16}px;` +
    'height:40px; cursor:pointer; z-index:3;');
  hit.id = 'measure-strip';
  // NOT `addEventListener('click', lay)` — lay() now takes a `quiet` flag, and a listener
  // bound straight to it receives the click EVENT as that flag. Truthy, so every lay went
  // quiet and onFull() never fired: Part C's carry stopped dead at eighteen laid tenths with
  // no way forward. Invisible to a screenshot; the end-to-end drive found it in one run.
  hit.addEventListener('click', () => lay());
  hit.addEventListener('dragover', e => e.preventDefault());
  hit.addEventListener('drop', e => {
    e.preventDefault(); lay();
    if (currentDraggedLength) { currentDraggedLength.remove(); currentDraggedLength = null; }
  });

  // Ten pieces become one, and they CHANGE COLOUR doing it: ten purple tenths go out and one
  // orange magic length comes in, matching the orange reference hanging above. The carry is
  // then a thing the child can see happen in the chapter's own two colours, not a rule.
  // Every complete ten becomes one magic length. Part C and Part E both have exactly one to
  // make; Part F's second field has TWO (22 tenths), so this loops rather than assuming.
  function fuse() {
    for (let g = 0; g * CKEEP + CKEEP <= N; g++) fuseOne(g);
  }

  function fuseOne(g) {
    const base = x0 + g * CKEEP * CPX;
    pieces.slice(g * CKEEP, (g + 1) * CKEEP).forEach(p => p.remove());
    // Opaque, not a tint: the empty slot's dashed border runs underneath, and showing
    // through it put a row of phantom tick marks along the bar that has just become ONE
    // piece. Those were an accident of a dashed border bleeding through — not to be confused
    // with the divisions drawn deliberately below.
    add(`position:absolute; left:${base - 4}px; top:64px; width:${CKEEP * CPX + 8}px; height:32px;` +
      `background:#fbeedd; border:2px solid ${CORANGE}; border-radius:5px; z-index:1;`);
    const d = add(`position:absolute; left:${base}px; top:70px; z-index:3;`);
    // One orange bar with its ten tenths still marked on it (Sylvain). Nothing was thrown
    // away in the regrouping — the same ten pieces of wire are still there, they are simply
    // being counted as one magic length now, and the picture has to say so or the carry
    // looks like ten tenths going in and something else coming out. The internal divisions
    // are drawn a shade lighter than the end ticks, so the bar still reads as ONE piece with
    // ten parts rather than as ten pieces again.
    d.innerHTML = lengthSVG(true, CKEEP * CPX, null, null, CORANGE)
      .replace('</svg>', inner + '</svg>');
  }

  // The magic lengths the regrouping brought OUT, lifted into the reference bar's place.
  //
  // That is the right spot for them: the reference has done its job by the time they exist,
  // and stacking a third orange thing above the row would leave two of them competing for the
  // same reading. They keep the fused bars' internal tenth marks, because they are those same
  // bars — nothing is thrown away in a regrouping (Sylvain, on Part C's carry).
  //
  // Called only AFTER the child has said how many there are: drawn up front it would be the
  // answer, and the row below already carries the same information for anyone counting.
  function harvest(n, label) {
    [refLab, ref, dash].forEach(el => el.remove());
    const step = CKEEP * CPX + 14;
    for (let i = 0; i < n; i++) {
      const d = add(`position:absolute; left:${x0 + i * step}px; top:24px;`);
      d.innerHTML = lengthSVG(true, CKEEP * CPX, null, null, CORANGE).replace('</svg>', inner + '</svg>');
    }
    const cap = add(`position:absolute; left:${x0}px; top:0; width:${n * step - 14}px;` +
      `text-align:center; font-family:Georgia,serif; font-size:13px; color:${CORANGE};`);
    cap.textContent = label;
  }

  gameArea.appendChild(box);
  if (o.prelaid) {
    while (laid < N) lay(true);
    hit.style.cursor = 'default';
    if (o.split) add(`position:absolute; left:${x0 + o.split * CPX - 1}px; top:64px;` +
      'width:0; height:32px; border-left:2px dashed #8b5e3c; opacity:.6; z-index:4;');
  } else {
    wireSupply([{ n: N, len: CPX, kind: 'tenth', capKey: 'c2_c_lbl_tenths', col: CPURPLE }], true);
  }
  return { fuse: fuse, harvest: harvest };
}

// ===========================================================================
// PART D — Marimon's rule, and the repackaging.
//
// The deck's page 4: a tree seed does not need a magic SQUARE, it needs any patch of
// ground all in one piece with the area of one magic square. So the 494 hundredths that
// Part B counted are not only flower ground — four whole trees are hiding in them.
//
// Three things this part is built on:
//
//   1. The child CARVES, and the arithmetic falls out of it (Sylvain's call). Four plots
//      get marked out one click at a time and the fifth is REFUSED — which is how 94 < 100
//      becomes something felt rather than computed. Chapter 1's shape throughout: do the
//      long thing, then read the number off what you did.
//
//   2. The carry is at 100 here, exactly as Part C's was at 10 — and again it is forced by
//      the situation, not the notation (TODO.md lesson 18). Nothing objects to 494 being
//      "too big"; what makes the regrouping happen is that Eliel wants trees and Marimon
//      has just said a tree will take any hundred hundredths that hang together.
//
//   3. It closes on the SAME sum Part B closed on — three leftover pieces added two at a
//      time under Chapter 1's brackets — with 20 + 60 + 14 where 420 + 60 + 14 stood. That
//      echo is the point: same ground, packed differently, and the picture says so.
//
// GEOMETRY. Plots are built from STRIPS: one strip = 10 tenths across by 1 tenth up = 10
// hundredths, i.e. one row of one 10-wide chunk of the band. The band is 60 x 7, so it is
// 6 chunks of 7 strips = 42 strips = 420. A plot is 10 consecutive strips, marching chunk
// by chunk and bottom-up within each chunk:
//
//     plot 1 = chunk0 x 7 rows (70) + chunk1 x 3 rows (30)
//     plot 2 = chunk1 x 4 (40)      + chunk2 x 6 (60)
//     plot 3 = chunk2 x 1 (10)      + chunk3 x 7 (70) + chunk4 x 2 (20)
//     plot 4 = chunk4 x 5 (50)      + chunk5 x 5 (50)
//     left over: chunk5 x 2 rows = 20 hundredths, at the far end of the band
//
// Every run is a full 10-wide chunk, so consecutive runs always share a whole edge and the
// plot is genuinely contiguous — and every piece of it is 10-by-something, so every plot
// can be checked against Chapter 1's own table if anyone asks. That is why the strips are
// 10 wide and not, say, one column of 7: 100 does not divide by 7, and the plots would come
// out as 14 columns plus a two-cell nub that no child could verify.
// ===========================================================================
const DPLOT = 100;    // hundredths that feed one tree seed
// The rest are the chapter field's, assigned by setField() alongside everything else. Part D
// only ever runs on that field — F cites Marimon's rule rather than re-carving — but they are
// derived rather than typed so nothing here can drift from the geometry above.
let DPLOTS;      // 4 — how many whole plots fit in the leftover band
let DPERCH;      // 7 — strips per 10-wide chunk of the band
let DBANDLEFT;   // 20 — what is left of the band afterwards
let DREST;       // 94 — flower ground, once the trees are out
let DTREES;      // 22

// The deck's own four: yellow, blue, purple, orange.
const DPLOTCOL = ['#e9d558', '#7aa8de', '#c489d8', '#e2a253'];
const DPLOTINK = ['#8a7a10', '#2f5d9e', '#7d3a92', '#9a5a12'];

// Plot p as runs of whole chunks: {c, r0, r1}, rows counted from the BOTTOM of the band.
function plotRuns(p) {
  const runs = [];
  for (let i = p * (DPLOT / 10); i < (p + 1) * (DPLOT / 10); i++) {
    const c = Math.floor(i / DPERCH), r = i % DPERCH;
    const last = runs[runs.length - 1];
    if (last && last.c === c && last.r1 === r) last.r1 = r + 1;
    else runs.push({ c: c, r0: r, r1: r + 1 });
  }
  return runs;
}

// The outline of a plot, traced as one rectilinear path: left to right along the tops,
// then right to left along the bottoms. It works because every run spans a full chunk, so
// consecutive runs abut exactly and the boundary is a plain staircase. Drawing each run
// with its own border instead would put a line THROUGH the plot at every step, which says
// the opposite of what this screen is about — the plot is one piece.
function plotPath(runs, ox, oy, z) {
  const X = c => ox + c * 10 * z, Y = r => oy + (DPERCH - r) * z;
  let d = `M ${X(runs[0].c)},${Y(runs[0].r1)}`;
  runs.forEach((rn, i) => {
    d += ` L ${X(rn.c + 1)},${Y(rn.r1)}`;
    if (i < runs.length - 1) d += ` L ${X(rn.c + 1)},${Y(runs[i + 1].r1)}`;
  });
  const last = runs[runs.length - 1];
  d += ` L ${X(last.c + 1)},${Y(last.r0)}`;
  for (let i = runs.length - 1; i >= 0; i--) {
    d += ` L ${X(runs[i].c)},${Y(runs[i].r0)}`;
    if (i > 0) d += ` L ${X(runs[i].c)},${Y(runs[i - 1].r0)}`;
  }
  return d + ' Z';
}

// Translucent fill so the hundredth rules underneath keep showing through — the child is
// meant to be able to count them, and a plot they cannot see into is just a coloured blob.
function plotSVG(p, ox, oy, z, withLabel) {
  const runs = plotRuns(p), d = plotPath(runs, ox, oy, z);
  let s = `<path d="${d}" fill="${DPLOTCOL[p]}" fill-opacity="0.72"/>` +
          `<path d="${d}" fill="none" stroke="${DPLOTINK[p]}" stroke-width="3" stroke-linejoin="round"/>`;
  if (!withLabel) return s;
  // on the tallest run, which is the only one with room for it
  const big = runs.reduce((a, b) => (b.r1 - b.r0 > a.r1 - a.r0 ? b : a));
  s += `<text x="${ox + (big.c + 0.5) * 10 * z}" y="${oy + (DPERCH - (big.r0 + big.r1) / 2) * z + 6}" ` +
       `text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" ` +
       `fill="${DPLOTINK[p]}">${DPLOT}</text>`;
  return s;
}

// The carving screen. The chapter's one zoom device again: the field at true scale, a ring
// round the band, a cone, and the band held in the lens where the plots are actually
// marked out. The plots are painted in BOTH places, so the child can see the same four
// patches on the little field they have been looking at since screen one.
//
// Its own lens rather than LENS.top: at Part B's zoom of 7 a strip is 7px tall and the
// staircase steps between plots would be invisible, which is the one thing this picture has
// to show. At 9 the band is 540 wide, so the lens is wider than Part B's — affordable here
// because this lens carries no dimension captions, which is what constrained that one
// (TODO.md lesson 16).
const DZ = 9;
const DLENS = { rx: 344, ry: 62, cx: 372, cy: 84, fx: 229, fy: 254, w: 744, h: 444 };

function carveSVG(n) {
  const L = DLENS, r = REGION.top;
  const bx = L.fx + r.x * TPX, by = L.fy + (FT.h - r.y - r.h) * TPX;   // the band, on the field
  let s = svgFieldWithRegions(L.fx, L.fy, 'top');
  for (let p = 0; p < n; p++) s += plotSVG(p, bx, by, TPX, false);

  const rcx = bx + r.w * TPX / 2, rcy = by + r.h * TPX / 2;
  const rrx = r.w * TPX / 2 + 13, rry = r.h * TPX / 2 + 13;
  s += `<path d="M ${rcx - rrx + 3},${rcy - rry + 3} L ${L.cx - L.rx + 10},${L.cy + L.ry - 6} ` +
       `L ${L.cx + L.rx - 10},${L.cy + L.ry - 6} L ${rcx + rrx - 3},${rcy - rry + 3} Z" ` +
       `fill="rgba(180,160,110,0.16)" stroke="${INK}" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>`;
  s += `<ellipse cx="${rcx}" cy="${rcy}" rx="${rrx}" ry="${rry}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;

  const mx = L.cx - r.w * DZ / 2, my = L.cy - r.h * DZ / 2;
  s += `<defs><clipPath id="d-lens"><ellipse cx="${L.cx}" cy="${L.cy}" rx="${L.rx}" ry="${L.ry}"/></clipPath></defs>`;
  s += `<ellipse cx="${L.cx}" cy="${L.cy}" rx="${L.rx}" ry="${L.ry}" fill="#fdfbf3"/>`;
  s += `<g clip-path="url(#d-lens)">` +
       `<rect x="${mx}" y="${my}" width="${r.w * DZ}" height="${r.h * DZ}" fill="${r.fill}"/>` +
       svgGrid(mx, my, r.w, r.h, DZ);
  for (let p = 0; p < n; p++) s += plotSVG(p, mx, my, DZ, true);
  s += `<rect x="${mx}" y="${my}" width="${r.w * DZ}" height="${r.h * DZ}" fill="none" ` +
       `stroke="#6b5e4a" stroke-width="2"/></g>`;
  s += `<ellipse cx="${L.cx}" cy="${L.cy}" rx="${L.rx}" ry="${L.ry}" fill="none" stroke="${INK}" stroke-width="4"/>`;
  return `<svg width="${L.w}" height="${L.h}" viewBox="0 0 ${L.w} ${L.h}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

// A click ANYWHERE on the picture marks out the next plot. Deliberately not a drop target
// on a particular patch of ground: Part A settled this ("a click or drop anywhere along the
// strip lays the next length in sequence") because the child is discovering a property of
// the field and fumbling a target is not the difficulty we want them to have. What the
// click means is "mark one out", and Eliel's line says so.
function carveStage(onPlot, onFull) {
  let n = 0;
  const d = document.createElement('div');
  d.id = 'carve-stage';          // the driver's hook: this screen has no button to click
  d.style.cssText = 'margin:6px auto 0; width:max-content; cursor:pointer;';
  d.innerHTML = carveSVG(0);
  d.addEventListener('click', () => {
    if (n >= DPLOTS) { d.style.cursor = 'default'; onFull(); return; }
    n++;
    d.innerHTML = carveSVG(n);
    onPlot(n);
  });
  gameArea.appendChild(d);
  return d;
}

// ---------------------------------------------------------------------------
// What is left at the far end of the band — counted, not just looked at.
//
// Three things this screen learned the hard way (Sylvain):
//
//   1. It OPENS on the plain field, exactly as `dTrees` draws it. The zoom is something
//      the child asks for by pressing a button, not the state the screen starts in — the
//      apparatus should arrive when there is a reason for it.
//   2. When the lens does come, the field underneath keeps ALL its detail: the same
//      `splitFieldView` call, same colours, same tenth grid, nothing dimmed. Muting it to
//      make the target stand out was trading away the picture the child has been reading
//      all chapter. The target is made bold by a heavy outline and the ring pointing at it,
//      which is what those are for.
//   3. The 20 hundredths inside the lens are CLICKABLE, and the question only comes once
//      they have all been ticked off. Chapter 1's shape, and A′'s `coverWithSquares`
//      exactly: cover the thing, then say how many you placed. Counting by doing is the
//      whole reason this chapter magnifies anything (TODO.md lesson 10).
//
// The field is `splitFieldView`'s own element, re-parented into this composition rather
// than redrawn in SVG — which is what guarantees "the same level of detail" instead of
// merely approximating it. The ring/cone/lens go in one overlay SVG on top, positioned
// against the field's known geometry (hence FVPAD).
// ---------------------------------------------------------------------------
const DRZ = 26;   // px per hundredth inside the lens — a click target, not just a mark
const DRL = { rx: 178, ry: 52, cx: 435, cy: 78, fx: 70, fy: 200, w: 680, h: 432 };
// The remainder, 10 x 2 tenths. Read at CALL time, not at load: DBANDLEFT is filled in by
// setField further down the file, so a `const DRH = DBANDLEFT / 10` up here is NaN — and a
// grid of 10 x NaN cells renders as nothing at all, on the one screen whose whole job is
// having twenty cells to click. Anything derived from the field geometry must be a function.
const DRW = 10;
const drh = () => DBANDLEFT / 10;

function restLensStage(onComplete) {
  const L = DRL, DRH = drh();
  const wrap = document.createElement('div');
  wrap.style.cssText = `position:relative; width:${L.w}px; height:${L.h}px; margin:6px auto 0;`;

  // the field, undimmed and at full detail — splitFieldView appends to gameArea, so this
  // moves it here rather than drawing a second, poorer copy
  const fv = splitFieldView({
    materialize: true, plots: DPLOTS,
    counts: { whole: t('c2_d_cnt_whole', { n: MSROWS * MSCOLS }) },
  });
  fv.style.margin = '0';
  fv.style.position = 'absolute';
  fv.style.left = L.fx + 'px';
  fv.style.top = L.fy + 'px';
  wrap.appendChild(fv);

  // where the far end of the band actually sits, in this composition's coordinates
  const tx = L.fx + FVPAD.l + (REGION.top.w - DRW) * TPX, ty = L.fy;
  const tw = DRW * TPX, th = DRH * TPX;
  const rcx = tx + tw / 2, rcy = ty + th / 2;
  const rrx = tw / 2 + 12, rry = th / 2 + 12;

  let s = `<rect x="${tx}" y="${ty}" width="${tw}" height="${th}" fill="none" ` +
    `stroke="#8a5a12" stroke-width="3"/>`;
  s += `<path d="M ${rcx - rrx + 3},${rcy - rry + 3} L ${L.cx - L.rx + 10},${L.cy + L.ry - 6} ` +
    `L ${L.cx + L.rx - 10},${L.cy + L.ry - 6} L ${rcx + rrx - 3},${rcy - rry + 3} Z" ` +
    `fill="rgba(180,160,110,0.16)" stroke="${INK}" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>`;
  s += `<ellipse cx="${rcx}" cy="${rcy}" rx="${rrx}" ry="${rry}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
  s += `<ellipse cx="${L.cx}" cy="${L.cy}" rx="${L.rx}" ry="${L.ry}" fill="#fdfbf3" ` +
    `stroke="${INK}" stroke-width="4"/>`;
  // caption ABOVE — below the lens is the cone (Part B's corner lens, same reason)
  s += `<text x="${L.cx}" y="${L.cy - L.ry - 13}" text-anchor="middle" font-family="Georgia,serif" ` +
    `font-size="14" fill="#6b5e4a">${t('c2_d_lbl_bandrest')}</text>`;

  const ov = document.createElement('div');
  ov.style.cssText = 'position:absolute; inset:0; z-index:1; pointer-events:none;';
  ov.innerHTML = `<svg width="${L.w}" height="${L.h}" viewBox="0 0 ${L.w} ${L.h}" ` +
    `style="display:block" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
  wrap.appendChild(ov);

  // the ground itself, inside the lens: the ruled rectangle, with one clickable cell per
  // hundredth on top. Unfilled `.field-cell` has no border of its own, so the rules under
  // it are what tell the child where the squares are.
  const bed = tenthGrid(DRW, DRH, DRZ, {
    fill: REGION.top.fill, fine: '#a3977c', border: '3px solid #8a5a12',
  });
  bed.style.position = 'absolute';
  bed.style.left = (L.cx - DRW * DRZ / 2) + 'px';
  bed.style.top = (L.cy - DRH * DRZ / 2) + 'px';
  bed.style.zIndex = '2';

  const grid = document.createElement('div');
  grid.style.cssText = 'position:absolute; inset:0; display:grid;' +
    `grid-template-columns:repeat(${DRW},${DRZ}px); grid-template-rows:repeat(${DRH},${DRZ}px);`;
  let n = 0;
  for (let i = 0; i < DRW * DRH; i++) {
    const c = document.createElement('div');
    c.className = 'field-cell';
    c.style.cssText = `width:${DRZ}px; height:${DRZ}px; cursor:pointer;`;
    let done = false;
    const fill = () => {
      if (done) return;
      done = true;
      c.classList.add('filled');
      n++;
      if (n < DRW * DRH) say('Eliel', t('c2_ap_keep'));
      else setTimeout(onComplete, 350);
    };
    c.addEventListener('click', fill);
    c.addEventListener('dragover', e => e.preventDefault());
    c.addEventListener('drop', e => { e.preventDefault(); fill(); });
    grid.appendChild(c);
  }
  bed.appendChild(grid);
  wrap.appendChild(bed);

  gameArea.appendChild(wrap);
  return wrap;
}

// Marimon's example patch (deck p.4), drawn as the two rectangles it is made of — because
// the shape a bend gets counted with is exactly what Part B taught, and the internal edge
// is the cut the child is about to use. It is also, on purpose, the shape of the very first
// plot they will mark out: 10 by 7, with 10 by 3 tucked beside it.
const DEX = 14;   // px per tenth in the example patch

// The two rectangles the patch is made of. `y` counts DOWN from the top of the bounding
// box, so the low one starts 4 tenths down and both share the bottom edge.
const DEXP = {
  tall: { x: 0,  y: 0, w: 10, h: 7, hSide: 'left'  },
  low:  { x: 10, y: 4, w: 10, h: 3, hSide: 'right' },
};
// Room for the dimension captions. FR runs longer than EN every time and these are
// absolute pixels, so the side pads are sized for « 10 dixièmes », not for "10 tenths"
// (TODO.md lesson 16).
const DEXPAD = { l: 108, r: 108, t: 6, b: 66 };
// Extra depth below, only on the screens that draw the brace. The wrapper grows DOWNWARD
// and the patch is positioned from the top, so nothing the child is looking at moves.
const DEXBRACE = 52;
// The area of each part, off its own geometry rather than written down twice.
const DEXA = k => DEXP[k].w * DEXP[k].h;      // tall 70, low 30

// Marimon's example patch, with one of its two parts optionally LIT and the other dimmed,
// and the lit part's sides labelled. `focus` is 'tall' | 'low' | null.
//
// The sentence names a part and a pair of lengths; without this the child had to work out
// which rectangle "the tall part" meant and take "10 tenths across" on trust. Lighting the
// part being asked about and printing its two lengths against its own sides makes the
// question something they can read off the picture — which is the same move Part C makes
// when it greys out the half of a side that is not in play.
//
// `counts` ({tall: 70, low: 30}, either key optional) keeps each part's answer printed
// under it once the child has produced it, so by the last question both numbers are still
// on screen against the ground they came off — and the question can then ask for
// "70 + 30 = ?" about two things the child can still see.
//
// `total` draws Chapter 1's grouping bracket under both counts — as a brace, since what it
// gathers here is two numbers rather than two fields. Pass '?' before the child answers and
// the number after, which is the chapter's "?" -> reveal flow (`tallyView`). The label
// always carries the UNIT, "? hundredths" as much as "100 hundredths": the question mark
// stands for a quantity of something, not for a bare number.
//
// Returns the element WITHOUT appending: the step swaps it as the questions advance.
function examplePatch(focus, counts, total) {
  const W = 20 * DEX, H = 7 * DEX;
  const padB = DEXPAD.b + (total != null ? DEXBRACE : 0);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; margin:16px auto 0;' +
    `width:${W + DEXPAD.l + DEXPAD.r}px; height:${H + DEXPAD.t + padB}px;`;
  const inner = document.createElement('div');
  inner.style.cssText = `position:absolute; left:${DEXPAD.l}px; top:${DEXPAD.t}px;` +
    `width:${W}px; height:${H}px;`;
  wrap.appendChild(inner);

  Object.keys(DEXP).forEach(k => {
    const r = DEXP[k], dim = focus && focus !== k;
    const g = tenthGrid(r.w, r.h, DEX, {
      fill: dim ? '#efe9dc' : '#f2e6a0', border: 'none',
      fine: dim ? '#ded7c6' : '#c9c2ae',
    });
    g.style.position = 'absolute';
    g.style.left = r.x * DEX + 'px';
    g.style.top = r.y * DEX + 'px';
    if (k === 'tall') g.appendChild(seedDot(34));   // one patch, one tree seed — Ch1's mark
    inner.appendChild(g);
  });

  // ⚠️ The outline is drawn ONCE, round the whole L, and the join is a DASHED cut. Built
  // first as two bordered rectangles, it read as two rectangles sitting next to each other
  // — which says the opposite of the screen it is on, where the entire point is that this
  // is ONE patch that happens to bend. Solid outside = the patch; dashed inside = the cut
  // we are about to make to count it, which is Part B's method and not part of the ground.
  // So the LIT/dim contrast, not the linework, is what says which part is being measured.
  const X = tx => DEXPAD.l + tx * DEX, Y = ty => DEXPAD.t + ty * DEX;
  let s =
    `<path d="M ${X(0)},${Y(0)} L ${X(10)},${Y(0)} L ${X(10)},${Y(4)} L ${X(20)},${Y(4)} ` +
    `L ${X(20)},${Y(7)} L ${X(0)},${Y(7)} Z" fill="none" stroke="#8a7a10" stroke-width="5" ` +
    `stroke-linejoin="round"/>` +
    `<line x1="${X(10)}" y1="${Y(4)}" x2="${X(10)}" y2="${Y(7)}" stroke="#8a7a10" ` +
    `stroke-width="2" stroke-dasharray="6 5"/>`;

  // A span bracket with end ticks and its caption, in the same vocabulary as Part B's
  // `bracket()` — that one is welded to TPX, and this figure is drawn at DEX.
  const span = (horiz, a, b, at, n) => {
    const cap = t('c2_d_ex_lbl_t', { n: n });
    const tick = p => horiz
      ? `<line x1="${p}" y1="${at - 5}" x2="${p}" y2="${at + 5}" stroke="#6b5e4a" stroke-width="1"/>`
      : `<line x1="${at - 5}" y1="${p}" x2="${at + 5}" y2="${p}" stroke="#6b5e4a" stroke-width="1"/>`;
    return (horiz
      ? `<line x1="${a}" y1="${at}" x2="${b}" y2="${at}" stroke="#6b5e4a" stroke-width="1"/>`
      : `<line x1="${at}" y1="${a}" x2="${at}" y2="${b}" stroke="#6b5e4a" stroke-width="1"/>`) +
      tick(a) + tick(b) +
      `<text x="${horiz ? (a + b) / 2 : at + (at < X(10) ? -12 : 12)}" ` +
      `y="${horiz ? at + 19 : (a + b) / 2 + 5}" ` +
      `text-anchor="${horiz ? 'middle' : (at < X(10) ? 'end' : 'start')}" ` +
      `font-family="Georgia,serif" font-size="14" fill="#6b5e4a">${cap}</text>`;
  };
  if (focus) {
    const r = DEXP[focus];
    s += span(true, X(r.x), X(r.x + r.w), Y(7) + 15, r.w);
    s += r.hSide === 'left'
      ? span(false, Y(r.y), Y(r.y + r.h), X(0) - 15, r.h)
      : span(false, Y(r.y), Y(r.y + r.h), X(20) + 15, r.h);
  }

  // Each part's answer, under that part, at a FIXED height whatever the stage — so the
  // numbers do not jump between screens, and they never land on the dimension caption
  // above them (which belongs to the other part by the time a count appears here).
  const c = counts || {};
  Object.keys(DEXP).forEach(k => {
    if (c[k] == null) return;
    const r = DEXP[k];
    s += `<text x="${X(r.x + r.w / 2)}" y="${Y(7) + 56}" text-anchor="middle" ` +
      `font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#3a3a3a">` +
      `${t('c2_d_ex_lbl_h', { n: c[k] })}</text>`;
  });

  if (total != null) {
    const col = groupColors[0], y = Y(7) + 70, r = 9;
    const mid = (X(0) + X(20)) / 2;
    s += `<path d="M ${X(0)},${y} q 0,${r} ${r},${r} L ${mid - r},${y + r} ` +
      `q ${r},0 ${r},${r} q 0,${-r} ${r},${-r} L ${X(20) - r},${y + r} ` +
      `q ${r},0 ${r},${-r}" fill="none" stroke="${col}" stroke-width="2.5" ` +
      `stroke-linecap="round"/>`;
    s += `<text x="${mid}" y="${y + 2 * r + 21}" text-anchor="middle" ` +
      `font-family="Georgia,serif" font-size="17" font-weight="bold" fill="${col}">` +
      `${t('c2_d_ex_lbl_h', { n: total })}</text>`;
  }

  const ov = document.createElement('div');
  ov.style.cssText = 'position:absolute; inset:0; pointer-events:none;';
  ov.innerHTML = `<svg width="${W + DEXPAD.l + DEXPAD.r}" height="${H + DEXPAD.t + padB}" ` +
    `style="display:block" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
  wrap.appendChild(ov);
  return wrap;
}

// What survives the carving: the tail of the band, and the two rectangles nobody touched.
// Same three pieces Part B added up, so the closing sum is visibly the same sum.
function bandRestEl() {
  const col = document.createElement('div');
  col.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:6px;';
  col.appendChild(tenthGrid(10, DBANDLEFT / 10, MPX, {
    fill: REGION.top.fill, magic: true, border: '1.5px solid #6b5e4a',
  }));
  const lab = document.createElement('div');
  lab.innerHTML = `<strong style="font-size:15px; color:#3a3a3a">${DBANDLEFT}</strong>` +
    `<br>${t('c2_d_lbl_bandrest')}`;
  lab.style.cssText = 'font-family:Georgia,serif; font-size:12px; color:#6b5e4a;' +
    'text-align:center; line-height:1.5;';
  col.appendChild(lab);
  return col;
}

// A function, not an array: its three `n`s come from the field geometry, which setField fills
// in further down. Built at load it would have carried `undefined` counts. (Same trap DRH hit.)
const tallyD = () => [
  { make: bandRestEl,                   n: DBANDLEFT },
  { make: () => flowerRectEl('side'),   n: TB },
  { make: () => flowerRectEl('corner'), n: TC },
];

// ===========================================================================
// Part E — naming what we did, and writing the answer down.
//
// Two jobs, in this order:
//   1. Distributivity, NAMED. The child has now cut a rectangle's sides and multiplied
//      the pieces three times over (A′, B, D), so the name lands on something they own —
//      Chapter 1 put its formal definitions of area and perimeter late for the same reason.
//   2. 6.2 x 3.7 = 22.94, i.e. the SECOND place after the dot (Sylvain kept it out of D).
//      Derived, not announced: 94 hundredths will not fit in the tenths place, so the
//      chapter asks its own question one more time — are there tenths hiding among these
//      hundredths? — which is Part C's carry at ten, one unit further down.
//
// The order matters. E3 has Eliel admit he cannot multiply 6.2 by 3.7; the identity is the
// way round it; and the number arrives at the end as the thing that was impossible on the
// first screen of the chapter. Doing it the other way round would answer the question
// before it had been asked.
// ===========================================================================

// The two sides, split — which is where all four rectangles come from and, in E7, what a,
// b, c and d stand for. Read off the geometry, like Part C's Clong/Cshort.
let EA, EB;    // 6 and 0.2, along the bottom  — setField()
let EC, ED;    // 3 and 0.7, up the left side

// Which two of those each rectangle takes. This IS distributivity, as a table:
// one piece of the bottom side, one piece of the left side, and every pairing used once.
//   whole  6   x 3      the 18 magic squares
//   side   0.2 x 3      the strip down the side
//   top    6   x 0.7    the band along the top
//   corner 0.2 x 0.7    the corner
let EPROD;
// a*c + b*c + a*d + b*d — the deck's own ordering, and the one CHAPTER2_PLAN.md quotes.
const EORDER = ['whole', 'side', 'top', 'corner'];

const eProdHTML = k => `${fmtNum(EPROD[k][0])} × ${fmtNum(EPROD[k][1])}`;

// The area, and the three numbers the last two screens need. Derived from the geometry
// rather than typed, so they cannot drift from Part D's 22 trees and 94 flowers — which the
// verify asserts they equal.
let EAREA;    // 22.94 magic squares — setField()
let EWHOLE;   // 22
let EHUND;    // 94 hundredths

// A term of the equation, wearing its own rectangle's colour. Lesson 20: the colour scheme
// is an argument. Here it says the four products on the line and the four pieces of ground
// above it are the same four things — so the identity stays readable off the picture even
// once the numbers have turned into a, b, c and d.
//
// A chip in the region's own FILL rather than coloured text: these fills are pale by
// necessity (they carry grids), and a dark ink of the same hue would be a different colour
// to a child. The chip is the fill, exactly.
// `state` is only used on the identity screen, where the child matches each term to a
// rectangle by clicking it. There the colour has to be the REWARD, not the hint: a chip
// already wearing the corner's pink would answer "which rectangle is b × d?" before the
// question finished. So a term waiting its turn is plain and dashed, the one being asked is
// plain and ringed, and it takes its ground's colour the moment the child places it —
// lesson 17's ordering, applied to an equation.
function eTerm(key, html, state) {
  const skin = state === 'todo'
      ? 'background:#f6f3e8; border:1px dashed rgba(90,80,60,0.5);'
    : state === 'current'
      ? 'background:#fffdf2; border:2px solid #6b5e4a;'
      : `background:${REGION[key].fill}; border:1px solid rgba(90,80,60,0.45);`;
  // vertical-align:BASELINE, and it has to stay that way (Sylvain). An inline-block sits on the
  // baseline of its LAST line box, which for a worked-out term is the value — so 18 lands on the
  // row's own line, level with the "=" and the "+" signs joining the terms, and the product and
  // its little "=" stack up above it. That is the line the eye reads across.
  //
  // It was briefly vertical-align:middle, to stop the chips hanging off the baseline at
  // different heights. That levelled the BOXES and put the secondary "=" on the row's line
  // instead of the value — tidier, and wrong about which number the row is adding up.
  return `<span style="display:inline-block; vertical-align:baseline; ${skin}` +
    ` border-radius:5px; padding:3px 7px; white-space:nowrap;">${html}</span>`;
}

// `leftHTML` may be a chain rather than a single expression — eSplitSides keeps the
// undecomposed product in front of the split one, so the child reads
// `6.2 × 3.7 = (6 + 0.2) × (3 + 0.7) = …` and never loses sight of which product is being
// taken apart. Every piece is nowrap, so a long line can only break at an `=` or a `+`,
// never inside an expression.
function eEqLine(leftHTML, termHTML, state) {
  const d = document.createElement('div');
  d.style.cssText = 'text-align:center; font-family:Georgia,serif; font-size:20px;' +
    'line-height:2.2; margin:14px auto 2px; max-width:820px; color:#4a4030;';
  // Each "+" travels with the term AFTER it, so a line that has to wrap breaks before a
  // "+" and never leaves one dangling at the end of a row. On a tablet the chain is a
  // little wider than the page and this is what decides whether the wrap reads as an
  // equation or as a typo.
  d.innerHTML = `${leftHTML} &nbsp;=&nbsp; ` + EORDER.map((k, i) => {
    const term = eTerm(k, termHTML(k), state && state(k));
    return i ? `<span style="white-space:nowrap">+&nbsp;&nbsp;${term}</span>` : term;
  }).join(' &nbsp; ');
  return d;
}

// A term the child has worked out: the product, then "=" ON ITS OWN LINE, then the value.
//
// Beside the number ("= 18") the equals sign sits at the same level as the "+" signs joining
// the four terms, and the eye reads the whole row as one line of arithmetic. Above it, each
// chip becomes a small partial computation of its own, which is what it is (Sylvain).
//
// Its own line-height: the chain's is 2.2, and three lines of that would be a chip taller than
// the field above it.
const eValued = (k, value) =>
  '<span style="display:inline-block; line-height:1.35; text-align:center;">' +
  `${eProdHTML(k)}<br>` +
  '<span style="font-size:14px; color:#8b7355;">=</span><br>' +
  `<span style="font-size:16px;">${value}</span></span>`;

// "6.2 × 3.7  =  (6 + 0.2) × (3 + 0.7)" — the product, then the same product with both sides
// cut in two. It leads every screen that shows the four terms, including the closing one
// (Sylvain): the four chips are the RESULT of that cut, and putting only "6.2 × 3.7" in front
// of them loses the step that produced them.
const eSplitLHS = () =>
  eExpr(`${fmtNum(FIELD.L)} × ${fmtNum(FIELD.l)}`) + ' &nbsp;=&nbsp; ' +
  eExpr(`(${fmtNum(EA)} + ${fmtNum(EB)}) × (${fmtNum(EC)} + ${fmtNum(ED)})`);

// One expression in the chain, kept on one line.
const eExpr = html => `<strong style="white-space:nowrap">${html}</strong>`;

// Saturated versions of the four region fills, for outlining a rectangle the child has
// matched. The fills themselves are pale by necessity — they carry grids — and a pale
// outline on a 9px strip is not a mark at all.
const REGINK = { whole: '#4a7d4f', top: '#9c7d16', side: '#2f6b96', corner: '#b04a3a' };

// Smallest side a clickable region gets, in px. The corner is 9 × 32 on the field; on a
// tablet that is a mark, not a target.
const PICKMIN = 46;

// Which letter each side's two pieces go by, and which is the long one — the wrong-answer
// line needs to say "b is the SHORT piece of the bottom side", per term.
const eLetterX = k => (EPROD[k][0] === EA ? 'a' : 'b');
const eLetterY = k => (EPROD[k][1] === EC ? 'c' : 'd');
const eTermLetters = k => `${eLetterX(k)} × ${eLetterY(k)}`;

// TWO places after the dot, always — `fmtNum` strips trailing zeros, so it renders 0.10 as
// "0.1" and 4.20 as "4.2". The whole point of these screens is the second place, and a
// number that quietly drops it would be arguing against the lesson. Locale-aware like
// everything else: 0,60 in French.
const eFmt2 = x => {
  const n = Math.round(x * 100);
  return `${Math.floor(n / 100)}${decimalSep()}${String(n % 100).padStart(2, '0')}`;
};

// One of Part D's carved plots, on its own — a block with the area of a magic square that
// is emphatically NOT a square. That is Marimon's rule made visible, and it is why the four
// of them may be added to the 18 at the end.
//
// Drawn as ONE outlined path over its own hundredth rules (clipped to the path), not as a
// row of abutting rectangles: this shape is a single patch that bends, and a picture built
// from bordered pieces would say "three rectangles" (lesson 21).
function plotBlockEl(p, z) {
  const runs = plotRuns(p);
  const c0 = Math.min(...runs.map(r => r.c)), c1 = Math.max(...runs.map(r => r.c));
  const nW = (c1 - c0 + 1) * 10, PAD = 3;
  const ox = PAD - c0 * 10 * z, oy = PAD;
  const d = plotPath(runs, ox, oy, z), id = 'e-plot-' + p;
  const el = document.createElement('div');
  el.style.cssText = 'flex:none;';
  el.innerHTML =
    `<svg width="${nW * z + 2 * PAD}" height="${DPERCH * z + 2 * PAD}" style="display:block">` +
    `<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs>` +
    `<path d="${d}" fill="${DPLOTCOL[p]}" fill-opacity="0.72"/>` +
    `<g clip-path="url(#${id})">${svgGrid(ox, oy, (c1 + 1) * 10, DPERCH, z)}</g>` +
    `<path d="${d}" fill="none" stroke="${DPLOTINK[p]}" stroke-width="2.5" stroke-linejoin="round"/>` +
    '</svg>';
  return el;
}

// The band along the top with its four plots painted on it, to scale — the picture the
// "4 magic squares and 20 hundredths over" claim is checked against.
function bandWithPlotsEl(z, n) {
  const el = tenthGrid(REGION.top.w, REGION.top.h, z, {
    fill: REGION.top.fill, magic: true, border: '1.5px solid #6b5e4a',
  });
  const many = n == null ? DPLOTS : n;
  if (!many) return el;
  const svg = document.createElement('div');
  svg.style.cssText = 'position:absolute; left:0; top:0; pointer-events:none;';
  let s = '';
  for (let p = 0; p < many; p++) s += plotSVG(p, 0, 0, z, false);
  svg.innerHTML = `<svg width="${REGION.top.w * z}" height="${REGION.top.h * z}" ` +
    'style="display:block">' + s + '</svg>';
  el.appendChild(svg);
  return el;
}

// A picture with a number and a word under it — the caption idiom flowerRectEl uses, made
// available to the pieces Part E assembles that flowerRectEl does not draw.
function eLabelled(child, num, label) {
  const col = document.createElement('div');
  col.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:6px;';
  col.appendChild(child);
  const lab = document.createElement('div');
  lab.innerHTML = `<strong style="font-size:15px; color:#3a3a3a">${num}</strong><br>${label}`;
  lab.style.cssText = 'font-family:Georgia,serif; font-size:12px; color:#6b5e4a;' +
    'text-align:center; line-height:1.5;';
  col.appendChild(lab);
  return col;
}

// ONE pair of side pads for every field screen in Part E, so the field never moves between
// them. Both have to be wider than Part B's: the chips read "0.2 × 3" rather than "60", and
// the edge brackets carry whole sentences — « 2 dixièmes = 0,2 longueur magique » is 200px
// of French, centred on a 9px span at the bottom right and right-aligned into the left
// margin on the side. Lesson 16: FR is the binding constraint every time.
// A per-screen pad would be the field jumping sideways between consecutive screens, which
// Part A already had to fix once.
const EPADL = 210, EPADR = 130;

// The working view for one term of the identity: the field with only the rectangle in
// question lit, and the equation underneath with that term ringed and the ones already done
// carrying their value. It is the SAME screen for all four — only the highlight moves.
function eTermStage(current, values) {
  clearGame();
  splitFieldView({
    materialize: true, padL: EPADL, padR: EPADR, focus: current, brackets: EBRACKETS(),
  });
  gameArea.appendChild(eEqLine(eSplitLHS(),
    k => (values[k] ? eValued(k, values[k]) : eProdHTML(k)),
    k => values[k] ? 'done' : (k === current ? 'current' : 'todo')));
}

// Each term's value in magic squares — 18, 0.60, 4.20, 0.14. Rounded at the source rather
// than left to numEquals' tolerance: 0.2 * 3 is 0.6000000000000001 in floating point, and
// an expected answer should never be a number the child could not possibly write.
const eTermNum = k => Math.round(EPROD[k][0] * EPROD[k][1] * 100) / 100;
const eTermValue = k => (k === 'whole' ? String(eTermNum(k)) : eFmt2(eTermNum(k)));

// The same term counted in hundredths: the tenths of one side times the tenths of the other.
const eTenths = n => Math.round(n * 10);
const eHundredths = k => eTenths(EPROD[k][0]) * eTenths(EPROD[k][1]);

// ---------------------------------------------------------------------------
// Part E's perimeter close: the same four-way split, on Chapter 1's other formula.
// ---------------------------------------------------------------------------
// The four terms as chips. Before the reorder they are coloured BY SIDE (blue long, red
// short — Part C's pairing); after it, BY UNIT (orange wholes, purple tenths). The colour
// scheme changes exactly when the argument does, which is lesson 20, and it is the same
// switch Part C made at its own adding-up.
const EPBG = {};
EPBG[CBLUE] = '#eaf2fa'; EPBG[CRED] = '#fbecea';
EPBG[CORANGE] = '#fbeedd'; EPBG[CPURPLE] = '#f5e9fb';

function ePRow(html, size) {
  const d = document.createElement('div');
  d.style.cssText = 'text-align:center; font-family:Georgia,serif; color:#4a4030;' +
    `font-size:${size || 20}px; line-height:2.1; margin:10px auto 2px; max-width:820px;`;
  d.innerHTML = html;
  return d;
}

// Chapter 1's `totalWire` shape (Sylvain): the field stays whole on the LEFT with its four
// colours, an "=" sits between, and the right-hand side is the four terms as actual pieces of
// WIRE, each with its value under it. The regrouping then changes only the right-hand side —
// the same lengths, gathered inside brackets — which is exactly what a regrouping is.
// px per magic length in the packages. Fixed by the container: #game-container is 800px
// with 20px of padding, so the whole top line — field (317) + "=" + four packages — has 760
// to live in. 19.8 magic lengths of wire at 15px each is 297, which leaves room for the
// separators. Bigger and the equation wraps; the equation is the point, so it does not.
// Not a taste constant: it is whatever makes the perimeter fit. 19.8 magic lengths at 15px
// is 297, which leaves room beside a 317px field and the separators. Capped at 15 so the
// chapter's own screen is unchanged; the divisor is what protects a longer fence.
let EMLPX, ETPX;   // ...and a tenth is EMLPX/10, which is the honest 1:10 — setField()

// One package, as WHOLE magic lengths followed by TENTHS. A package is written the way its
// number is: 1.4 is one whole magic length and four tenths, which is precisely what the child
// established two screens earlier by grouping ten of them — so drawing it as fourteen
// undifferentiated tenths would contradict the screen it came from. The two units keep their
// true 1:10, so the package is the same length either way; only its divisions change.
//
// Segments abut, so the half-ticks merge into clean divisions the child can count (Chapter
// 1's geometry, and the reason lengthSVG does NOT inset its end ticks) — and the tick where
// the magic length stops is a full-height one while the tenths' are small, which is the join
// saying "one whole, then the little ones". `th` has to shrink with the segment anyway: a
// 12px tick on a 2.6px tenth reads as the wrong axis entirely (lesson 19).
function ePWire(nw, nt, col) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center;';
  const seg = (len, th) => {
    const d = document.createElement('div');
    d.innerHTML = lengthSVG(true, len, null, null, col, th);
    row.appendChild(d);
  };
  for (let i = 0; i < nw; i++) seg(EMLPX, 6);
  for (let i = 0; i < nt; i++) seg(ETPX, ETPX / 2);
  return row;
}

// A "+" between two packages, or between two brackets.
function ePPlus() {
  const d = document.createElement('div');
  d.textContent = '+';
  d.style.cssText = 'font-family:Georgia,serif; font-size:20px; color:#8b7355; margin:0 2px;';
  return d;
}

// The grouping frame, in the UNIT's colour rather than the side's — the bars keep saying
// which side each came off, and the bracket says which pile it is going into. Two different
// facts, two different channels; recolouring the bars would have thrown the first away.
function ePGroupEl(children, caption, col) {
  const box = document.createElement('div');
  box.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:7px;' +
    `border:3px solid ${col}; border-radius:9px; padding:9px 12px 6px; background:${EPBG[col]};`;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center; gap:4px;';
  children.forEach(c => row.appendChild(c));
  box.appendChild(row);
  const lab = document.createElement('div');
  lab.innerHTML = caption;
  lab.style.cssText = `font-family:Georgia,serif; font-size:15px; font-weight:bold; color:${col};`;
  box.appendChild(lab);
  return box;
}

// The field for the perimeter screens. `split` is what happens at the third line of the
// opening chain: until then a side is one colour, and from `2 × (6 + 0.2)` onward its wholes
// and its tenths are told apart — because that is the line where the sides come apart.
function perimStyles(split) {
  const st = {};
  LONG.forEach(k  => st[k] = { colW: CBLUE, colT: split ? CBLUE2 : CBLUE });
  SHORT.forEach(k => st[k] = { colW: CRED,  colT: split ? CRED2  : CRED  });
  return st;
}

// The field, whole and four-coloured, unchanged at every stage — the left-hand side of the
// equation, and the thing all these pieces came off.
function ePFieldEl() {
  const { stage, W, H } = wireStage();
  const st = perimStyles(true);
  Object.keys(st).forEach(k => drawWire(stage, k, W, H, st[k]));
  stage.style.margin = '0';
  return stage;
}

// TWO equations, one above the other (Sylvain): on top the field and the pieces of wire it
// comes apart into, and underneath the same sentence in numerals, colour for colour. The
// packages carry no numbers of their own — that is the whole point of separating them. A
// shape with its value printed on it is one representation pretending to be two.
function ePerimSumView(stage) {
  const PW = 2 * Clong.w, Pw = 2 * Cshort.w;      // 12 and 6 magic lengths
  const PT = 2 * Clong.t, Pt = 2 * Cshort.t;      // 4 tenths and 14 tenths
  const carried = Math.floor(Pt / 10), over = Pt % 10;   // 1 magic length and 4 tenths
  const c = (col, html) => `<span style="color:${col}">${html}</span>`;
  const sep = decimalSep();

  const right = document.createElement('div');
  right.style.cssText = 'display:flex; align-items:center; gap:5px; flex-wrap:wrap;';
  const put = els => els.forEach(e => right.appendChild(e));
  let formal;
  if (!stage) {
    put([ePWire(PW, 0, CBLUE), ePPlus(), ePWire(0, PT, CBLUE2), ePPlus(),
         ePWire(Pw, 0, CRED), ePPlus(), ePWire(carried, over, CRED2)]);
    formal = c(CBLUE, `2 × ${Clong.w}`) + c(CBLUE2, `${sep}${Clong.t}`) + ' + ' +
             c(CRED, `2 × ${Cshort.w}`) + c(CRED2, `${sep}${Cshort.t}`) + ' &nbsp;=&nbsp; ' +
             c(CBLUE, fmtNum(PW)) + ' + ' + c(CBLUE2, fmtNum(PT / 10)) + ' + ' +
             c(CRED, fmtNum(Pw)) + ' + ' + c(CRED2, fmtNum(Pt / 10));
  } else {
    put([
      ePGroupEl([ePWire(PW, 0, CBLUE), ePPlus(), ePWire(Pw, 0, CRED), ePPlus(),
                 ePWire(carried, 0, CRED2)],
                t('c2_e_lbl_ml', { n: stage >= 2 ? C2W + 1 : '?' }), CORANGE),
      ePPlus(),
      ePGroupEl([ePWire(0, PT, CBLUE2), ePPlus(), ePWire(0, over, CRED2)],
                t('c2_e_lbl_t', { n: stage >= 3 ? CREST : '?' }), CPURPLE),
    ]);
    // Only the right-hand side regroups — in the picture and in the numerals alike. The
    // parentheses take the UNIT's colour, matching the brackets above them, while the
    // numbers inside keep the colour of the side they came off.
    //
    // ...and once the child has written the answer, the whole right-hand side collapses to
    // it (Sylvain). The two bracketed sums have done their work; leaving them up beside the
    // number would be showing the working next to the result it has already become. The
    // answer keeps the unit colours it is made of: 19 magic lengths, 8 tenths.
    const lhs = c(CBLUE, `2 × ${Clong.w}`) + c(CBLUE2, `${sep}${Clong.t}`) + ' + ' +
                c(CRED, `2 × ${Cshort.w}`) + c(CRED2, `${sep}${Cshort.t}`) + ' &nbsp;=&nbsp; ';
    formal = lhs + (stage >= 4
      ? '<strong>' + c(CORANGE, String(C2W + 1)) + c(CPURPLE, `${sep}${CREST}`) + '</strong>'
      : c(CORANGE, '(') + c(CBLUE, fmtNum(PW)) + ' + ' + c(CRED, fmtNum(Pw)) + ' + ' +
        c(CRED2, fmtNum(carried)) + c(CORANGE, ')') + ' + ' +
        c(CPURPLE, '(') + c(CBLUE2, fmtNum(PT / 10)) + ' + ' +
        c(CRED2, fmtNum(over / 10)) + c(CPURPLE, ')'));
  }

  const eq = document.createElement('div');
  eq.textContent = '=';
  eq.style.cssText = 'font-family:Georgia,serif; font-size:30px; color:#8b7355; margin:0 6px;';

  const top = document.createElement('div');
  top.style.cssText = 'display:flex; align-items:center; justify-content:center;' +
    'gap:6px; flex-wrap:wrap; margin:10px auto 0;';
  top.appendChild(ePFieldEl());
  top.appendChild(eq);
  top.appendChild(right);

  const wrap = document.createElement('div');
  wrap.appendChild(top);
  wrap.appendChild(ePRow(`<span style="white-space:nowrap">${formal}</span>`, 21));
  return wrap;
}

// The sides written as numbers, on the very edges the child measured in Part A.
const EBRACKETS = () => ({
  a: fmtNum(EA), b: fmtNum(EB), c: fmtNum(EC), d: fmtNum(ED),
});

// ===========================================================================
// PART F — three more weird fields, this time run by the child
// ===========================================================================
// CHAPTER2_PLAN.md §10. Parts A–E teach the whole method on ONE field and never let the child
// drive it; F is where they do. It practises the method as Part E leaves it — split each side
// into a whole part and a tenths part, four products, add up, regroup at 100 and at 10 — and
// re-runs none of the discoveries: no covering with magic squares to find the 18, no lens on
// the little rectangles, no carving. Marimon's rule is CITED, not re-enacted.
//
// That is also what makes it affordable. The one thing in this file that cannot be laid out
// from a formula is the hand-tuned LENS/DLENS table, and F never magnifies.
//
// The escalation IS the scaffolding coming off (Sylvain, 2026-08-17):
//   field 1  the child measures both sides themselves, with Part A's own magnifier
//   field 2  measured again, with almost nothing said — the measuring is too good to be a one-off
//   field 3  measured as well, and its bottom side comes out EXACTLY whole — `b` is 0 and two
//            of the four rectangles are not ground at all
//
// One new case each, and nothing repeated for its own sake:
//   4.3 × 2.6 = 11.18   the method, alone, with nothing new — that is the point
//   5.2 × 2.9 = 15.08   a ZERO in the tenths place (writing 15.8 is the natural error),
//                       and a perimeter that carries TWO magic lengths
//   5   × 2.4 = 12      a side with nothing to cut, and an area with nothing after the dot
const F_FIELDS = [
  { L: 4.3, l: 2.6, n: 1, measures: true, full: true },
  { L: 5.2, l: 2.9, n: 2, measures: true },
  { L: 5,   l: 2.4, n: 3, measures: true },
];

// The three fields as the closing screens need them. Kept as one derivation so the grand
// totals cannot drift from the fields they are totals of.
function fSummary() {
  return F_FIELDS.map(f => {
    const area = Math.round(f.L * f.l * 100) / 100;
    const trees = Math.floor(area);
    return {
      F: f, L: f.L, l: f.l, n: f.n, area: area, trees: trees,
      flowers: Math.round((area - trees) * 100),
      perim: Math.round((2 * f.L + 2 * f.l) * 10) / 10,
    };
  });
}

// The bag of numbers every Part F string takes. Read off the CURRENT field: the step wrapper
// has already called setField, so Clong / EPROD / EAREA and the rest are this field's.
function fV(extra) {
  return Object.assign({
    L: fmtNum(FIELD.L), l: fmtNum(FIELD.l),
    w1: Clong.w, t1: Clong.t, w2: Cshort.w, t2: Cshort.t,
    ms: EWHOLE, hu: EHUND, area: fmtNum(EAREA), perim: fmtNum(PERIM),
    lo: TA + TB + TC, cw: C2W, ct: C2T, rest: CREST, carry: CCARRY,
  }, extra || {});
}

// The terms that are actually rectangles. On the third field the bottom side is whole, so `b`
// is 0 and two of the four are lines — not asked about, not drawn, not in the equation.
const fTerms = () => EORDER.filter(k => hasArea(REGION[k]));

// The hundredths left over once every whole magic square has been taken out — the flower
// ground, and the tail of the same walk the patches came from.
function fBareRuns() {
  const cells = fLeftoverWalk();
  return fRunsOf(cells.slice(Math.floor(cells.length / DPLOT) * DPLOT));
}

// The edge brackets, in the notation the chapter has built: 4 · 0.3 · 2 · 0.6. Part B's word
// labels belong to the screens that were still discovering what the pieces were.
const fBrackets = () => ({ a: fmtNum(EA), b: fmtNum(EB), c: fmtNum(EC), d: fmtNum(ED) });

// ---------------------------------------------------------------------------
// The leftover ground, cut into whole magic squares — Marimon's rule, materialized.
// ---------------------------------------------------------------------------
// Part D CARVED its plots, one click at a time, because that was where 94 < 100 had to be
// FELT. Part F does not re-run that discovery: the child divides 318 by a hundred and gets 3,
// and these patches are what those 3 look like on the ground (Sylvain, 2026-08-18). They stay
// on screen from that answer through to the total, so "8 magic squares and 3 more" is a
// picture rather than two numbers.
//
// The walk is one connected path over the leftover L: along the band left to right in 10-wide
// chunks and bottom-up inside each (Part D's own scheme), then the corner, then DOWN the side
// strip. Each junction shares a whole edge, so a patch that spans two regions is genuinely one
// piece — which is the entire content of Marimon's rule, and the reason these are drawn on the
// FIELD and not on the three separated rectangles the sum was built from. On the first field
// the third patch really does run out of the band, round the corner and part-way down the
// side; only on the field is that visibly one patch rather than three orphans.
//
// ⚠️ The patches are NOT squares and are not meant to be. "Whatever shape it is" is what the
// rule says, and a child who has just watched Part D refuse a fifth plot knows it.
const FPATCHCOL = ['#e9d558', '#7aa8de', '#c489d8', '#e2a253', '#8fce7a', '#e88fb0'];

function fLeftoverWalk() {
  const cells = [];
  const band = REGION.top, corner = REGION.corner, side = REGION.side;
  const row = (x0, x1, y) => { for (let x = x0; x < x1; x++) cells.push({ x: x, y: y }); };
  if (hasArea(band))
    for (let c = 0; c * 10 < band.w; c++) {
      const x0 = band.x + c * 10, x1 = Math.min(band.x + band.w, x0 + 10);
      for (let r = 0; r < band.h; r++) row(x0, x1, band.y + r);
    }
  if (hasArea(corner))
    for (let r = 0; r < corner.h; r++) row(corner.x, corner.x + corner.w, corner.y + r);
  // top-down: the side strip hangs BELOW the corner, so the walk carries on downwards
  if (hasArea(side))
    for (let r = side.h - 1; r >= 0; r--) row(side.x, side.x + side.w, side.y + r);
  return cells;
}

// Maximal horizontal runs per row, so a patch is a handful of divs instead of a hundred.
function fRunsOf(cells) {
  const byRow = {};
  cells.forEach(c => { (byRow[c.y] = byRow[c.y] || []).push(c.x); });
  const runs = [];
  Object.keys(byRow).forEach(y => {
    const xs = byRow[y].sort((a, b) => a - b);
    let start = xs[0], prev = xs[0];
    for (let i = 1; i <= xs.length; i++) {
      if (xs[i] === prev + 1) { prev = xs[i]; continue; }
      runs.push({ x: start, y: +y, w: prev - start + 1 });
      start = xs[i]; prev = xs[i];
    }
  });
  return runs;
}

// One entry per whole magic square the leftover yields; whatever does not fill a hundred is
// simply not in one, which is how the remainder becomes something to read off the picture.
function fPatchRuns() {
  const cells = fLeftoverWalk(), out = [];
  for (let i = 0; i + DPLOT <= cells.length; i += DPLOT) out.push(fRunsOf(cells.slice(i, i + DPLOT)));
  return out;
}

// The field, cut, with whatever counts have been earned so far. Default pads: F's chips read
// "0.60" and its brackets "0.3", so neither needs Part E's sentence-width margins.
function fStage(focus, counts) {
  clearGame();
  splitFieldView({ materialize: true, brackets: fBrackets(), focus: focus, counts: counts });
}

function fPlainField() {
  const { stage } = fieldStage();
  gameArea.appendChild(stage);
  return stage;
}

// A term of the identity, as the child meets it: "0.3 × 2".
const fProd = k => `${fmtNum(EPROD[k][0])} × ${fmtNum(EPROD[k][1])}`;
// ...and the same thing in tenths, which is where it becomes a multiplication we can do.
const fTenthProd = k => `${eTenths(EPROD[k][0])} × ${eTenths(EPROD[k][1])}`;

// The leftover ground, materialized, under one bracket — Part B's closing picture, drawn for
// however many leftovers this field actually has (three, or one).
function fLeftoverView(total) {
  return rowOf([groupBox(rowOf(leftoverKeys().map(k => flowerRectEl(k)), 20),
                         t('c2_b_unit_sq', { n: total }), 1)]);
}

// The sum being built, with the original in grey above it — Chapter 1's shape, and Part B's.
function fSumLine(parts, running) {
  const d = document.createElement('div');
  d.style.cssText = 'text-align:center; margin:14px 0 4px; font-size:19px; line-height:1.6;';
  d.innerHTML = `<span style="color:#999">${parts.join(' + ')} =</span><br>` +
    `<span style="font-weight:bold; color:${groupColors[1]}">${running}</span>`;
  return d;
}

// ---------------------------------------------------------------------------
// One field's worth of steps. Every step is tagged with the field it belongs to, so the
// wrapper at the bottom can set the geometry before it runs — which is what makes ?step=N and
// the debug jump bar honest no matter which part they land in.
// ---------------------------------------------------------------------------
function fStepsFor(F) {
  const S = [];
  // F's own numbers, read off F rather than off the module state: this function runs at LOAD,
  // when the current field is still the chapter's, so Clong/REGION/fTerms() would answer for
  // 6.2 x 3.7. Anything decided here — which sides have tenths, which rectangles exist — has to
  // come from F. Anything decided inside a step can use the module state, because the wrapper
  // has called setField by then.
  const t1 = Math.round((F.L % 1) * 10), t2 = Math.round((F.l % 1) * 10);
  const buildTerms = EORDER.filter(k =>
    k === 'whole' || (k === 'side' ? t1 : k === 'top' ? t2 : t1 && t2));
  const push = (name, fn) => {
    Object.defineProperty(fn, 'name', { value: name, configurable: true });
    fn.fieldSpec = F;
    S.push(fn);
  };
  const p = F.n;   // 1, 2, 3 — only ever used to build step names and pick strings

  // --- arrival ---------------------------------------------------------------
  if (F.n === 1) {
    // Field 1 is announced by Eliel and then handed over. He does not measure it with them.
    push('fIntro1', function () {
      clearGame();
      showEliel();
      storyHTML(`
        <div class="speaker">Eliel</div>
        <p>${t('c2_f_arrive1')}</p>
        <p style="margin-top:8px">${t('c2_f_arrive2')}</p>
        <p style="margin-top:8px">${t('c2_f_arrive3')}</p>
      `);
      addButton(t('c2_f_btn_myturn'), nextStep);
    });
  } else if (F.n === 2) {
    push('fIntro2', function () {
      clearGame();
      storyHTML(`
        <div class="speaker">Eliel</div>
        <p>${t('c2_f_next2')}</p>
        <p style="margin-top:8px">${t('c2_f_next2b')}</p>
      `);
      fPlainField();
      addButton(t('btn_continue'), nextStep);
    });
  } else {
    // Handed over whole — the only field the child does not measure. The surprise is on the
    // picture, not in the sentence: one side has nothing after the dot, and the child is asked
    // to notice it rather than told.
    push('fIntro3', function () {
      clearGame();
      storyHTML(`
        <div class="speaker">Eliel</div>
        <p>${t('c2_f_next3')}</p>
        <p style="margin-top:8px">${t('c2_f_odd3')}</p>
      `);
      fPlainField();
      addButton(t('btn_continue'), nextStep);
    });
  }

  // --- measuring -------------------------------------------------------------
  // BOTH of the first two fields are measured by the child (Sylvain, 2026-08-18) — the measuring
  // is the most pedagogical part of the whole method and it does not want to be a one-off. Only
  // the third arrives with its sides given, and that one has a different job: noticing that one
  // of them is whole.
  //
  // ONE SIDE, ALL THE WAY THROUGH, before the other is touched: whole magic lengths, then the
  // tenths, then the number written down. Alternating between the two sides makes the child
  // carry two half-measurements at once, and the first is easy to forget by the time it is
  // finally asked for.
  //
  // Part A cannot do this and does not try: there the tenths do not exist yet when the second
  // side is first walked, and hitting the wall on BOTH sides is exactly what invents them.
  // Here the child already owns the unit, so measuring is measuring and it runs to the end.
  //
  // Part A's own machinery, with the discovery lines replaced by plain instructions — the child
  // is not finding out that whole lengths don't fit, they are measuring a field.
  if (F.measures) {
    const measureSide = (which, firstSide, tenths) => {
      const cap = firstSide ? 'Bottom' : 'Left';
      const len = () => (firstSide ? FIELD.L : FIELD.l);
      const unit = () => (firstSide ? Clong : Cshort);
      // The write-up screen draws only what has actually been measured so far, so the picture
      // never shows the child a side they have not done yet.
      const drawn = firstSide ? ['bottom'] : ['bottom', 'left'];

      push('fMeasure' + cap + p, function () {
        clearGame();
        say('Eliel', t(firstSide ? 'c2_f_m_bottom' : 'c2_f_m_left'));
        measureWeirdSide({
          side: which, gapKey: 'c2_f_m_gap', overKey: 'c2_f_m_over',
          conclKey: firstSide ? 'c2_f_m_concl_b' : 'c2_f_m_concl_l',
          // Only ever reached on a side that comes out exactly whole — the third field's
          // bottom. The child lays the last length, nothing is left over, and THAT is how
          // they meet a whole side: found, not announced.
          exactKey: 'c2_f_m_exact',
        });
      });

      // Cover, then count — Chapter 1's shape, kept, and the reason the laying is not skipped.
      // Skipped entirely when the side has no tenths: there would be no sliver to magnify.
      if (tenths) push('fTenths' + cap + p, function () {
        clearGame();
        say('Eliel', t(firstSide ? 'c2_f_t_bottom' : 'c2_f_t_left'));
        magnifiedSliver({ side: which, onComplete: () =>
          askInline(t('c2_f_t_q'), unit().t, nextStep, t('c2_f_t_h')) });
      });

      push('fWrite' + cap + p, function () {
        const v = fV();
        // askNumber leaves the story panel alone, so this screen has to set its own lead.
        // Every step in this chapter must stand alone: ?step=N boots straight into one, and a
        // panel that never changes is invisible in play.
        clearGame();
        say('Eliel', t(tenths ? 'c2_f_w_lead' : 'c2_f_w_lead_whole'));
        measuredField(drawn);
        askNumber(t(firstSide ? 'c2_f_w_qb' : 'c2_f_w_ql'), len(), () => {
          clearGame();
          measuredField(drawn);
          say('Eliel', t(firstSide ? 'c2_f_w_ok_b' : 'c2_f_w_ok', v));
          addButton(t('btn_continue'), nextStep);
        }, tenths ? t('c2_f_w_h', { w: unit().w, t: unit().t })
                  : t('c2_f_w_h_whole'), { decimal: true });
      });
    };

    measureSide('bottom', true, t1);
    measureSide('left', false, t2);
  }

  // --- the cut ---------------------------------------------------------------
  push('fCut' + p, function () {
    clearGame();
    const whole = fTerms().length < 4;
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_f_cut1', fV())}</p>
      <p style="margin-top:8px">${t(whole ? 'c2_f_cut_two' : 'c2_f_cut_four', fV())}</p>
    `);
    splitFieldView({ materialize: true, brackets: fBrackets() });
    addButton(t('btn_continue'), nextStep);
  });

  // --- the four products -----------------------------------------------------
  // Field 1 walks each one on its own screen, down into tenths and back up to magic squares —
  // the road in full. Fields 2 and 3 ask only for the hundredths, all on one screen: by then
  // the conversion is a step, not a lesson, and the count is what the area needs.
  if (F.full) {
    buildTerms.forEach(k => {
      push('fTerm_' + k + p, function () {
        const done = {};
        fTerms().forEach(j => { if (EORDER.indexOf(j) < EORDER.indexOf(k)) done[j] = fTermCount(j); });
        const stage = html => { fStage(k, done); storyHTML(`<div class="speaker">Eliel</div>${html}`); };
        if (k === 'whole') {
          stage(`<p>${t('c2_f_p_whole', fV())}</p>`);
          askNumber(t('c2_f_p_q_ms', { p: fProd(k) }), EA * EC, () => {
            done[k] = fTermCount(k);
            fStage(k, done);
            say('Eliel', t('c2_f_p_ok_ms', { n: EA * EC }));
            addButton(t('btn_continue'), nextStep);
          }, t('hint_find_in_table', { a: EA, b: EC }));
          return;
        }
        const H = eHundredths(k);
        const v = fV({ p: fProd(k), tp: fTenthProd(k), n: H, a: eFmt2(H / 100) });
        stage(`<p>${t('c2_f_p_dec', v)}</p>`);
        askNumber(t('c2_f_p_q_h', v), H, () => {
          stage(`<p>${t('c2_f_p_back', v)}</p>`);
          askNumber(t('c2_f_p_q_ms2', v), H / 100, () => {
            done[k] = fTermCount(k);
            fStage(k, done);
            say('Eliel', t('c2_f_p_ok', v));
            addButton(t('btn_continue'), nextStep);
          }, t('c2_f_p_h_ms', v), { decimal: true });
        }, t('c2_f_p_h_h', v));
      });
    });
  } else {
    push('fProducts' + p, function () {
      const keys = fTerms();
      const done = {};
      const ask = i => {
        const k = keys[i];
        if (k == null) {
          fStage(null, done);
          say('Eliel', t('c2_f_p_alldone'));
          addButton(t('btn_continue'), nextStep);
          return;
        }
        fStage(k, done);
        storyHTML(`<div class="speaker">Eliel</div><p>${t(
          i === 0 ? 'c2_f_p_run1' : 'c2_f_p_run2', fV())}</p>`);
        if (k === 'whole') {
          askNumber(t('c2_f_p_q_ms', { p: fProd(k) }), EA * EC, () => {
            done[k] = fTermCount(k); ask(i + 1);
          }, t('hint_find_in_table', { a: EA, b: EC }));
          return;
        }
        const H = eHundredths(k);
        const v = fV({ p: fProd(k), tp: fTenthProd(k), n: H });
        askNumber(t('c2_f_p_q_h2', v), H, () => {
          done[k] = t('c2_f_cnt_h', { n: H });
          ask(i + 1);
        }, t('c2_f_p_h_h', v));
      };
      ask(0);
    });
  }

  // --- the area --------------------------------------------------------------
  // The long one, and deliberately so: this is Part F's summation, which is where Chapter 1's
  // pride came from. Add the leftover hundredths, regroup a hundred at a time — Marimon's rule
  // is what licenses that, and it is cited here rather than re-earned — then the whole count,
  // then the number itself.
  push('fArea' + p, function () {
    const keys = leftoverKeys();
    const parts = keys.map(k => REGION[k].w * REGION[k].h);
    const total = TA + TB + TC;
    const extra = Math.floor(total / 100), rest = total % 100;
    const v = fV({ tot: total, x: extra, r: rest, sq: EA * EC });
    const stage = (html, running) => {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>${html}`);
      gameArea.appendChild(fLeftoverView(running === '?' ? '?' : total));
      if (parts.length > 1) gameArea.appendChild(fSumLine(parts, running));
    };

    // From the regrouping onwards the picture is the FIELD, not the three separated rectangles
    // the sum was built from — because the patches are about contiguity, and on the first field
    // the third one runs out of the band, round the corner and part-way down the side strip.
    // Once the child has said how many are hiding in there, they are drawn, and they STAY drawn
    // through the remainder, the total and the area (Sylvain, 2026-08-18): "8 magic squares and
    // 3 more" then has a picture behind it, and the leftover hundredths are the ground that is
    // still bare, which makes the next question readable rather than only computable.
    const patches = fPatchRuns();
    const field = (html, withPatches) => {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>${html}`);
      splitFieldView({
        materialize: true, brackets: fBrackets(),
        patches: withPatches ? patches : null,
      });
    };

    const afterTotal = () => {
      field(`<p>${t('c2_f_a_rule', v)}</p>`, false);
      askNumber(t('c2_f_a_q_x', v), extra, () => {
        field(`<p>${t('c2_f_a_patches', v)}</p>`, true);
        askNumber(t('c2_f_a_q_r', v), rest, () => {
          field(`<p>${t('c2_f_a_now', v)}</p>`, true);
          askNumber(t('c2_f_a_q_ms', v), EWHOLE, () => {
            field(`<p>${t('c2_f_a_write', v)}</p>`, true);
            askNumber(t('c2_f_a_q_area', v), EAREA, () => {
              field(`<p>${t(EHUND === 0 ? 'c2_f_a_ok_flat' : 'c2_f_a_ok', v)}</p>`, true);
              addButton(t('btn_continue'), nextStep);
