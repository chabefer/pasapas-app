    c2_c_mkt3: "What we should do is fit as much of it as we can into our <strong>bigger</strong> unit, the magic lengths, and keep only whatever is left over in tenths. Does that make sense?",
    c2_btn_it_does: "It does!",
    c2_btn_not_really: "Not really…",

    c2_c_hide1: "So here is the question: are there whole magic lengths hiding among our {a}?",
    c2_c_hide_q: "How many tenths of a magic length do you need to make one whole magic length?",
    c2_c_hide_h: "Think back to how we cut the magic length up in the first place",
    c2_c_hide_ok: "Ten. Of course — that is exactly how we made them.",

    c2_c_carry1: "Let's put our {a} of wire side by side and have a look. I have hung a whole magic length above them, to compare against.",
    c2_c_carry2: "Lay them all out.",
    c2_c_ref_lab: "one whole magic length",
    c2_c_carry_full: "{a}, all in a row. Now look at where the whole magic length above them stops.",
    c2_btn_group_ten: "Group ten of them!",
    c2_c_carry_done: "There it is. Ten tenths, and they make exactly one whole magic length — it was hiding in there the whole time.",
    c2_c_carry_q: "So how many tenths are left over, once we take that magic length out?",
    c2_c_carry_h: "{t} tenths, take away the ten that just became a magic length",
    c2_c_carry_ok: "Eight! So our {a} were really {b} plus {c}.",

    c2_c_tot1: "Which gives us {a}, plus {e} that was hiding, plus the {b} left over. That is {c} and {d}.",
    c2_c_tot_q: "Your turn: how do we write {c} and {d}?",
    c2_c_tot_h: "Nineteen, then a point, then the number of tenths",
    c2_c_tot_ok: "<strong>{n} magic lengths of wire.</strong> That is what I shall ask for at the market.",
    c2_c_tot2: "And then the Gorns can stay out.",

    // --- Part D: Marimon's rule, and the repackaging ---
    // The motive is Eliel's, not the arithmetic's: he is replanting a burned forest, and
    // eighteen trees is not a forest. That is what sends him to Marimon.
    c2_d_m1: "Eighteen trees. That is not much of a forest, is it? And four hundred and ninety-four flowers is an awful lot of flowers.",
    c2_d_m2: "So I went to see Marimon the wizard about it — and he told me something I did not know.",
    c2_d_m3: "A tree seed does <strong>not</strong> really need a magic square. What it needs is a patch of ground <strong>all in one piece</strong> with the same area as a magic square — a hundred hundredths. The shape does not matter at all.",
    c2_d_btn_show: "Show me one!",

    c2_d_ex1: "Here is the sort of patch Marimon means. It is not a square. It is not even a rectangle — it bends.",
    c2_d_ex2: "But he says a tree seed would grow in it perfectly well. Shall we check why?",
    c2_d_ex_lbl_t: "{n} tenths",
    c2_d_ex_lbl_h: "{n} hundredths",
    c2_d_ex_qa: "The tall part is lit up. It is 10 tenths across and 7 tenths up. How many hundredths is that?",
    c2_d_ex_ha: "10 × 7",
    c2_d_ex_qb: "And now the low part: 10 tenths across and 3 tenths up. How many hundredths?",
    c2_d_ex_hb: "10 × 3",
    c2_d_ex_qc: "So how many hundredths in the whole patch, both parts together? <strong>{a}&nbsp;+&nbsp;{b}&nbsp;=&nbsp;?</strong>",
    c2_d_ex_hc: "Seven tens and three more tens",
    c2_d_ex_ok: "A hundred hundredths — exactly the area of one magic square. It simply isn't square-shaped, and Marimon says that is perfectly fine.",

    c2_d_q1: "Now look at our leftover ground again. {n} hundredths of it, and it is all in one piece — it runs right round the corner.",
    c2_d_q2: "So every patch of a hundred hundredths I can mark out in there is one more tree.",
    c2_d_btn_carve: "Let's mark some out!",

    c2_d_carve_go: "Click on the ground to mark out a plot. I will make each one a hundred hundredths — all in one piece, bending wherever it has to.",
    c2_d_carve_1: "There. A hundred hundredths, all in one piece — that is one more tree. Keep going!",
    c2_d_carve_n: "Plot number {n}. That is {m} hundredths marked out, and {n} more trees. Keep going!",
    c2_d_carve_4: "Four plots — {m} hundredths, and four more trees. Now: do you think there is room for a fifth? Try it and see.",
    // The refusal is careful about WHY. What is left is still contiguous, so Marimon's rule
    // is not what stops him — the area is, and the next screens count it.
    c2_d_carve_no1: "No. There is not enough ground left for a fifth plot.",
    c2_d_carve_no2: "Not because it is in pieces, mind you — what is left still hangs together all the way round the corner. There simply is not a hundred hundredths of it. Let's count what there is.",

    c2_d_band1: "Here is the field with the four tree plots marked out on it.",
    c2_d_band2: "What is left over is for the flowers: the far end of the band along the top, plus the strip down the side and the little corner, which the plots never reached.",
    c2_d_btn_look: "Let's look closer!",
    c2_d_band_click: "Here is the far end of the band, up close. Click on every little flower square in it, so we count them all.",
    c2_d_band_q: "So how many hundredths are left at the far end of the band?",
    c2_d_band_h: "Two rows of ten",
    c2_d_band_ok: "Twenty. And the strip down the side is still {b}, and the little corner is still {c}.",
    c2_d_lbl_bandrest: "end of the band",

    c2_d_tally1: "So this is the ground that is left for the flowers:",
    c2_d_tally_q: "Let's add it up, two at a time — exactly the way we did before.",
    c2_d_tally_p1: "Start with the end of the band and the strip down the side.",
    c2_d_tally_p2: "And now the little corner again — still the easy one to forget.",

    c2_d_tr1: "{r} hundredths of ground left over, and all of it still in one piece.",
    // Asked, not asserted. The child has Marimon's rule and the number; applying it is one
    // step, and it is the step that makes the rule theirs.
    c2_d_tr_ask: "So tell me: is there enough ground left over there to plant one more tree, by Marimon's rule?",
    c2_d_tr_yes: "Have another look. Marimon says a tree needs a hundred hundredths, all in one piece — and we have {r}.",
    c2_d_tr_no: "No. A tree needs a hundred hundredths, and we only have {r}. Four plots really is all we can get out of it.",
    c2_d_tr2: "Which brings me to the question I actually care about.",
    c2_d_tr_q: "I had {a} magic squares of tree ground to start with, and we have just marked out {b} more plots. How many tree seeds do I need to buy now? <strong>{a}&nbsp;+&nbsp;{b}&nbsp;=&nbsp;?</strong>",
    c2_d_tr_h: "Count on from {a} — {b} more",
    c2_d_cnt_whole: "{n} magic squares",

    c2_d_wrap1: "Look at what just happened. Before Marimon told me his rule, this field was {a} tree seeds and {b} flower seeds.",
    c2_d_wrap2: "Now it is <strong>{a} tree seeds</strong> and <strong>{b} flower seeds</strong>.",
    c2_d_wrap3: "And not one handful of earth changed. It is the same field, exactly as big as it always was — we simply packed it better. {n} more trees, out of the very same ground.",

    // --- PART E: name what we did, and write the answer ---
    // Late, like Chapter 1's formal definitions: the child has now cut a rectangle's sides
    // and multiplied the pieces three times over, so the name lands on something they own.
    c2_e_back1: "Before we move on, I want to look at what we just did. It deserves a name.",
    // First person plural throughout — the same register as c2_a_weird2 ("OUR magic lengths
    // can't measure it. WE need something smaller"). The child did this work.
    c2_e_back2: "This field's sides were not whole numbers of magic lengths, so we could not count it the way we count an ordinary field. What we did instead was cut it into <strong>four rectangles</strong> — and every single one of those, we already knew how to count.",

    // The conversion, printed on the edge it is about. The bottom one is Eliel's worked
    // example and is up from the start; the left one appears only AFTER the child has
    // written it (lesson 17) — on screen from the start it would answer the question.
    c2_e_lbl_2t_eq: "2 tenths = {n} magic lengths",
    c2_e_lbl_7t_eq: "7 tenths = {n} magic lengths",
    c2_e_sides1: "Look at the bottom side: 6 whole magic lengths, and 2 tenths. That is <strong>6 + {b}</strong> — and we write the whole thing {L}.",
    c2_e_sides2: "See {b} on its own? There are no whole magic lengths in it at all, so a <strong>0</strong> goes on the left of the dot: {b}.",
    c2_e_sides_q: "Your turn, for the left side. It is 3 whole magic lengths and 7 tenths, which we write {l}. But written as a sum: {l} = 3 + ?",
    c2_e_sides_h: "Zero, then the dot, then the number of tenths",
    c2_e_sides_ok: "Exactly. {L} = 6 + {b}, and {l} = 3 + {d}. Each side is a whole part plus a tenths part.",

    c2_e_prod1: "Now remember the shortcut from our very first field: the area of a rectangle is <strong>L × l</strong> — one side TIMES the other.",
    c2_e_prod2: "So the area of this whole field is <strong>{L} × {l}</strong>.",
    // The chapter's own difficulty, said out loud. Everything that follows is the way round it.
    c2_e_prod3: "And there is my trouble: I have no idea how to multiply {L} by {l}. Nobody ever taught me that. Which is exactly why we had to cut the field up.",

    c2_e_four1: "Every one of the four rectangles is a rectangle too — so every one of them has an area of one side TIMES the other.",
    c2_e_four2: "And look where their sides come from: each little rectangle takes <strong>one piece of the bottom side</strong> and <strong>one piece of the left side</strong>. Nothing else.",
    c2_e_four3: "The big one is easy: 6 magic lengths across and 3 up, so its area is <strong>6 × 3</strong> — the 18 magic squares we counted right at the beginning.",
    c2_e_four_btn: "My turn!",
    // The rectangle's name carries its own article, and the sentence never uses a pronoun
    // that has to agree with it: French says "le coin" but "la bande", and a hard-coded
    // article would have produced "la coin". Hence "sa largeur" in FR, and these three keys
    // rather than Part B's article-less c2_b_lbl_*, which other screens still need bare.
    c2_e_lbl_top: "the top band",
    c2_e_lbl_side: "the side strip",
    c2_e_lbl_corner: "the corner",
    c2_e_q_across: "Now <strong>{what}</strong>. How far does it reach across, in magic lengths?",
    c2_e_q_up: "And <strong>{what}</strong> — how tall is it, in magic lengths?",
    c2_e_h_w: "{n} whole magic lengths",
    c2_e_h_t: "{n} tenths — zero, then the dot, then {n}",
    c2_e_four_done1: "There they are: all four areas, written on the ground they belong to.",
    c2_e_four_done2: "And the sides are written as numbers now too — 6 and {b} along the bottom, 3 and {d} up the side.",

    c2_e_eq1: "The four rectangles <strong>are</strong> the field. Nothing was left out, and nothing was counted twice. So the big area and the four small areas added together have to be the same thing:",
    c2_e_eq2: "That is what we have been doing all along. Now let's write it in a way that shows <em>why</em> it works.",

    c2_e_sp1: "We know each side is a sum: {L} = 6 + {b}, and {l} = 3 + {d}. Let's put those in.",
    c2_e_sp2: "Now you can read it straight off the picture: <strong>each piece of the bottom side, times each piece of the left side</strong>. Two pieces and two pieces make four rectangles, and there they all are.",

    c2_e_id1: "And here is the really useful part. It was never about 6, or {b}, or 3, or {d}. Cut <strong>any</strong> rectangle's sides <strong>L</strong> and <strong>l</strong> in two, and exactly the same thing happens.",
    c2_e_id2: "Call the two pieces of one side <strong>a</strong> and <strong>b</strong>, and the two pieces of the other <strong>c</strong> and <strong>d</strong>:",
    // The name arrives with the formula, not on a screen of its own — and it is immediately
    // cut back down to size, because a fancy name is not what the child gained here.
    // "Another" is doing real work: Part B already handed them associativity.
    c2_e_id_name: "This property has another fancy name: <strong>the distributivity of multiplication over addition</strong>. But in the end, it is just about cutting rectangles up so that their area is easier to compute. Let's check.",
    c2_e_btn_check: "Let's check!",
    c2_e_id_go: "One term at a time, then. Each one is a rectangle of the field — find it and click on it.",
    c2_e_id_q: "Click on the rectangle whose area is <strong>{term}</strong>.",
    c2_e_pc_long: "long",
    c2_e_pc_short: "short",
    c2_e_id_wrong: "Not that one. <strong>{x}</strong> is the {px} piece of the bottom side, and <strong>{y}</strong> is the {py} piece of the left side — so look for the rectangle where those two meet.",
    c2_e_id_done: "All four, and the little corner last — the one everybody forgets. Here it is {b} × {d}, the {n} hundredths we counted way back. That is what distributivity says: cut the sides, multiply every piece of one by every piece of the other, add up. And it is the most useful thing in this whole chapter — you and I will be needing it again.",

    // --- the four terms, worked out one at a time ---
    // The identity is not left as a picture: it is USED. Every term is computed on its own,
    // with the field showing only the rectangle in question, and each one is a decimal
    // multiplication the child could not have done an hour ago.
    c2_e_ap1: "So — what is {L} × {l}? We have never actually multiplied it. But now we do not have to guess: we know it is those four rectangles added up, and each of those we can work out on its own.",
    c2_e_ap2: "One at a time, then. I will light up whichever one we are on.",
    c2_e_q_ms: "<strong>{p} = ?</strong> magic squares",
    c2_e_q_h: "<strong>{p} = ?</strong> hundredths of a magic square",

    c2_e_tw1: "The big one first, and it is the easy one: 6 magic lengths across, 3 up, and every square in it a whole magic square.",
    c2_e_tw_h: "Six threes",
    c2_e_tw_ok: "{n} magic squares — the very ground you covered on your first go at this field.",

    // The road through a decimal multiplication, laid once and then walked twice more.
    c2_e_ts1: "Now the strip down the side: <strong>{b} × 3</strong>. That is a multiplication with a dot in it, and we never learned how to do one of those either.",
    c2_e_ts2: "But here is the way round. Do it in <strong>tenths</strong> first — tenths are whole numbers, and we can multiply those. Count what comes out in <strong>hundredths</strong> of a magic square. Then come back to magic squares at the end.",
    c2_e_ts_qa: "First, then: how many tenths of a magic length is <strong>{b}</strong> magic lengths?",
    c2_e_ts_ha: "Two of them",
    c2_e_ts_qb: "And how many tenths is <strong>3</strong> whole magic lengths?",
    c2_e_ts_hb: "Three times ten — and multiplying by ten just adds a zero",
    c2_e_ts3: "So <strong>{b} × 3</strong> in magic lengths is <strong>2 × 30</strong> in tenths. And a tenth times a tenth is a hundredth of a magic square, so that is what the answer will be counted in.",
    c2_e_ts_hc: "Two times three tens",
    c2_e_ts4: "Sixty hundredths. Now back to magic squares — and for that we need to know how a hundredth is written.",
    c2_e_ts5: "One hundredth of a magic square we write <strong>{one}</strong>. Ten hundredths, <strong>{ten}</strong>. And so on, as long as there are fewer than a hundred of them.",
    c2_e_ts_qd: "So how do you think we write <strong>{n} hundredths</strong> of a magic square?",
    c2_e_ts_hd: "Zero, then the dot, then {n}",
    c2_e_ts_ok: "<strong>{a}</strong> magic squares. That is the strip down the side, and you have just multiplied two numbers with a dot in them.",

    c2_e_tc1: "The little corner now: <strong>{b} × {d}</strong>. Same road, and this time you know it.",
    c2_e_tc_qa: "How many tenths is <strong>{b}</strong> magic lengths?",
    c2_e_tc_qb: "And how many tenths is <strong>{d}</strong> magic lengths?",
    c2_e_tc_hb: "Seven of them",
    c2_e_tc_hc: "Two sevens",
    c2_e_tc_qd: "And how do we write <strong>{n} hundredths</strong> of a magic square?",
    c2_e_tc_ok: "<strong>{a}</strong>. The little corner — and it is the same {n} hundredths we counted in it long ago.",

    c2_e_tt1: "And the band along the top: <strong>6 × {d}</strong>. Same road one last time.",
    c2_e_tt_qa: "How many tenths is <strong>6</strong> whole magic lengths?",
    c2_e_tt_ha: "Six times ten — add a zero",
    c2_e_tt2: "So it is <strong>60 × 7</strong> hundredths. That is off our table — but we have met it before: <strong>60 × 7 = (6 × 7) × 10</strong>, and 6 × 7 <em>is</em> on the table.",
    c2_e_tt_hc: "6 × 7 = 42, then add a zero",
    c2_e_tt3: "Four hundred and twenty hundredths. That is a lot more than a hundred, so this time there are whole magic squares hiding in there.",
    c2_e_tt4: "Let's try the same trick as before and see whether it still holds: to come back from hundredths to magic squares, move the dot two places to the left.",
    c2_e_tt_qd: "So how would we write <strong>{n} hundredths</strong> of a magic square?",
    c2_e_tt_hd: "Four, then the dot, then 20",

    // ...and the trick is CHECKED, against ground the child carved out with their own clicks.
    c2_e_tk1: "<strong>{a}</strong>. Now, if that trick is any good, it has just told us two things we can go and check on the ground.",
    c2_e_tk_qa: "First: how many whole magic squares does {a} say are hiding in that band?",
    c2_e_tk_ha: "The figure on the left of the dot",
    c2_e_tk2: "Four! And look — we marked them out ourselves, back when we were carving plots for the trees. There they are: four patches, a hundred hundredths each.",
    c2_e_tk_qb: "And second: how many hundredths does {a} say are left over after those four?",
    c2_e_tk_hb: "The two figures on the right of the dot",
    c2_e_tk3: "Twenty, it says. Shall we go and count them, and see if it told the truth?",
    c2_e_tk_btn: "Let's count them!",
    c2_e_tk_ok: "Twenty, exactly as it promised. So the trick holds: moving the dot two places to the left really does turn hundredths back into magic squares.",

    c2_e_tp1: "There we are — every piece of the field, worked out from its own two sides: the field on the left, and on the right the {n} whole magic squares, then the band with its four marked-out patches and its {r} hundredths over, then the strip and the corner.",
    c2_e_tp3: "Now, Marimon's rule again. He does not care whether a hundred hundredths is a square or not — it only has to be all in one piece, whatever shape it takes. So we may count those four odd-looking patches as four magic squares, when we work out the area and my shopping list. Agreed?",

    c2_e_rg1: "Then let's put them where they belong: the four patches over with the whole magic squares, and the odds and ends together.",
    c2_e_rg_qa: "So how many blocks with the area of a magic square does this field hold altogether? <strong>{a}&nbsp;+&nbsp;{b}&nbsp;=&nbsp;?</strong>",
    c2_e_rg_ha: "Count on from {a} — {b} more",
    c2_e_rg_qb: "And the leftovers: <strong>{x}&nbsp;+&nbsp;{y}&nbsp;+&nbsp;{z}&nbsp;=&nbsp;?</strong> hundredths.",
    c2_e_rg_hb: "{x} and {y} make 80",
    c2_e_rg_qc: "So: {w} whole magic squares and {h} hundredths. How would you write that with a dot — the whole magic squares on the left, the hundredths on the right?",
    c2_e_rg_hc: "{w}, then the dot, then {h}",
    c2_e_rg_ok1: "We say the area of this field is <strong>{A} magic squares</strong>. Which means: {w} separate blocks each with the area of a magic square — a hundred hundredths, square or not — and {h} hundredths left over.",
    c2_e_rg_ok2: "And see how good that is. The number hands me my shopping list straight off: <strong>{w} tree seeds</strong> and <strong>{h} flower seeds</strong>. Powerful, isn't it?",
    // --- the perimeter, done the same way (Sylvain, 2026-08-14) ---
    // The chapter's last screen brings distributivity back to Chapter 1's OTHER formula, and
    // lands on the very number Part C got by laying wire piece by piece and hauling it to the
    // market. Same answer, a fraction of the work — which is what a shortcut is for.
    c2_e_pw1: "One last thing. Distributivity helps with the <strong>perimeter</strong> too — with working out how much wire to buy.",
    c2_e_pw_ask: "Want me to show you?",
    c2_e_pw_yes: "Yes!!!",
    c2_e_pw_why: "Why not?",
    c2_e_pw2: "Four small multiplications instead of two frightening ones. Let's start with the easy ones.",
    c2_e_q_ml: "<strong>{p} = ?</strong> magic lengths",
    c2_e_q_t: "<strong>{p} = ?</strong> tenths of a magic length",
    c2_e_pw_ok: "{a} and {b} — the whole magic lengths on the two long sides, and on the two short ones.",

    c2_e_pt1: "Now <strong>2 × {b}</strong>. Same trouble as before, and the same way round it: do it in tenths first, and come back at the end.",
    c2_e_pt_qa: "How many tenths of a magic length is <strong>{b}</strong> magic lengths?",
    c2_e_pt2: "Four tenths of a magic length. And tenths go on the right of the dot — that we have known since the very beginning.",
    c2_e_pt_qc: "So how do we write <strong>{n} tenths</strong> in magic lengths?",
    c2_e_pt_hc: "Zero, then the dot, then {n}",
    c2_e_pt_ok: "<strong>{a}</strong>. That is the tenths along the two long sides.",

    c2_e_pu1: "And now the hard one: <strong>2 × {d}</strong>.",
    c2_e_pu_qa: "How many tenths is <strong>{d}</strong> magic lengths?",
    c2_e_pu2: "Fourteen tenths. So how do we turn that into magic lengths? Let's try the same trick — but move the dot only <strong>one</strong> place to the left this time, because we are coming back from tenths and not from hundredths.",
    c2_e_pu_qc: "So how would we write <strong>{n} tenths</strong> in magic lengths?",
    c2_e_pu_hc: "One, then the dot, then 4",
    c2_e_pu3: "<strong>{a}</strong>, it says — one whole magic length and four tenths. Let's go and check that, the way we checked the other one.",
    c2_e_pu4: "Here are the {n} tenths: {t} from one short side and {t} from the other. Group ten of them and let's see what is left.",
    c2_e_pu_q: "So — how many tenths are left over?",
    c2_e_pu_h: "Count what did not go into the big piece",
    c2_e_pu_ok: "Four! One whole magic length and four tenths — exactly what the trick promised. So it works coming back from tenths too.",

    c2_e_ps1: "All four done. Now let's add them up.",
    c2_e_ps2: "And here is where <strong>commutativity</strong> and <strong>associativity</strong> come back: they let us shuffle the terms of a sum around however we please. So let's put the whole magic lengths together and the tenths together. All right?",
    c2_e_btn_allright: "All right!",
    c2_e_btn_dunno: "Don't see why.",
    c2_e_ps3: "There. Whole magic lengths on one side, tenths on the other — and {a} has split into one whole magic length and four tenths, which is exactly what it means.",
    c2_e_ps_qa: "Count the magic lengths. How many?",
    c2_e_ps_ha: "{a} and {b} and one more",
    c2_e_ps_qb: "And now the tenths. How many?",
    c2_e_ps_hb: "Four and four",
    c2_e_ps_qc: "{w} magic lengths and {t} tenths. How would you write that as a single number?",
    c2_e_ps_hc: "{w}, then the dot, then {t}",
    c2_e_ps_ok1: "<strong>{P} magic lengths of wire</strong> — and that is the very same number we got by laying the wire out piece by piece and carting it all to the market.",
    c2_e_ps_ok2: "Only this time it took four small multiplications and a sum. See how fast you can work out this weird field now?",
    c2_e_lbl_ml: "{n} magic lengths",
    c2_e_lbl_t: "{n} tenths",
    c2_e_lbl_whole: "whole magic squares",
    c2_e_lbl_plots: "{n} patches",
    c2_e_lbl_ms: "{n} magic squares",

    c2_e_cn_help: "You've been of <strong>tremendous help</strong> — again!",
    c2_e_cn_learned: "You've learned <strong>tenths</strong> and <strong>hundredths</strong>, how to write them after a dot, how to pack ten of them back into one, and <strong>distributivity</strong> — chopping a rectangle's sides up to multiply the pieces.",
    c2_e_cn_forest: "My weird field is planted: 22 trees and 94 flowers. Marimon says he has never seen a tidier one.",

    c2_e_prod3: "Et voilà mon problème : je n'ai aucune idée de comment multiplier {L} par {l}. Personne ne me l'a jamais appris. C'est précisément pour ça qu'on a dû découper le champ.",

    c2_e_four1: "Chacun des quatre rectangles est un rectangle lui aussi — donc chacun d'eux a pour aire un côté FOIS l'autre.",
    c2_e_four2: "Et regarde d'où viennent leurs côtés : chaque petit rectangle prend <strong>un morceau du côté du bas</strong> et <strong>un morceau du côté gauche</strong>. Rien d'autre.",
    c2_e_four3: "Le grand est facile : 6 longueurs magiques de large et 3 de haut, donc son aire fait <strong>6 × 3</strong> — les 18 carrés magiques qu'on a comptés tout au début.",
    c2_e_four_btn: "À moi !",
    c2_e_lbl_top: "la bande du haut",
    c2_e_lbl_side: "la bande du côté",
    c2_e_lbl_corner: "le coin",
    c2_e_q_across: "Maintenant <strong>{what}</strong>. Quelle est sa largeur, en longueurs magiques ?",
    c2_e_q_up: "Et <strong>{what}</strong> — quelle est sa hauteur, en longueurs magiques ?",
    c2_e_h_w: "{n} longueurs magiques entières",
    c2_e_h_t: "{n} dixièmes — zéro, puis la virgule, puis {n}",
    c2_e_four_done1: "Les voilà : les quatre aires, écrites chacune sur le terrain qui lui appartient.",
    c2_e_four_done2: "Et les côtés aussi sont écrits en nombres maintenant — 6 et {b} en bas, 3 et {d} sur le côté.",

    c2_e_eq1: "Les quatre rectangles, <strong>c'est</strong> le champ. On n'a rien oublié, et on n'a rien compté deux fois. Donc la grande aire et les quatre petites aires additionnées, c'est forcément la même chose :",
    c2_e_eq2: "C'est ce qu'on a fait depuis le début. Maintenant écrivons-le d'une façon qui montre <em>pourquoi</em> ça marche.",

    c2_e_sp1: "On sait que chaque côté est une somme : {L} = 6 + {b}, et {l} = 3 + {d}. Remplaçons.",
    c2_e_sp2: "Maintenant tu peux le lire directement sur le dessin : <strong>chaque morceau du côté du bas, fois chaque morceau du côté gauche</strong>. Deux morceaux et deux morceaux, ça fait quatre rectangles, et ils y sont tous.",

    c2_e_id1: "Et voilà le plus utile. Il n'y a rien de spécial avec 6, {b}, 3 et {d}. Coupe en deux les côtés <strong>L</strong> et <strong>l</strong> de <strong>n'importe quel</strong> rectangle, et il se passe exactement la même chose.",
    c2_e_id2: "Appelons <strong>a</strong> et <strong>b</strong> les deux morceaux d'un côté, et <strong>c</strong> et <strong>d</strong> les deux morceaux de l'autre :",
    c2_e_id_name: "Cette propriété a encore un nom savant : <strong>la distributivité de la multiplication par rapport à l'addition</strong>. Mais au fond, il ne s'agit que de découper des rectangles pour que leur aire soit plus facile à calculer. Vérifions.",
    c2_e_btn_check: "Vérifions !",
    c2_e_id_go: "Un terme à la fois, alors. Chacun est un rectangle du champ — trouve-le et clique dessus.",
    c2_e_id_q: "Clique sur le rectangle dont l'aire est <strong>{term}</strong>.",
    c2_e_pc_long: "grand",
    c2_e_pc_short: "petit",
    c2_e_id_wrong: "Pas celui-là. <strong>{x}</strong>, c'est le {px} morceau du côté du bas, et <strong>{y}</strong> le {py} morceau du côté gauche — cherche donc le rectangle à la rencontre des deux.",
    c2_e_id_done: "Les quatre, et le petit coin en dernier — celui que tout le monde oublie. Ici il vaut {b} × {d}, les {n} centièmes qu'on a comptés tout à l'heure. Voilà ce que dit la distributivité : on coupe les côtés, on multiplie chaque morceau de l'un par chaque morceau de l'autre, et on additionne. Et c'est la chose la plus utile de tout ce chapitre — on en aura encore besoin, j'en suis sûr.",

    // --- les quatre termes, calculés un par un ---
    c2_e_ap1: "Alors — ça vaut combien, {L} × {l} ? On ne l'a jamais vraiment multiplié. Mais on n'a plus besoin de deviner : on sait que c'est ces quatre rectangles additionnés, et chacun d'eux, on peut le calculer tout seul.",
    c2_e_ap2: "Un à la fois, alors.",
    c2_e_q_ms: "<strong>{p} = ?</strong> carrés magiques",
    c2_e_q_h: "<strong>{p} = ?</strong> centièmes de carré magique",

    c2_e_tw1: "Le grand d'abord, et c'est le plus facile : 6 longueurs magiques de large, 3 de haut, et chaque carré dedans est un carré magique entier.",
    c2_e_tw_h: "Six fois trois",
    c2_e_tw_ok: "{n} carrés magiques — exactement le terrain que tu as couvert la première fois qu'on s'est occupés de ce champ.",

    c2_e_ts1: "Maintenant la bande du côté : <strong>{b} × 3</strong>. C'est une multiplication avec une virgule dedans, et ça non plus, personne ne nous l'a jamais appris.",
    c2_e_ts2: "Mais voilà comment on s'en sort. On le fait d'abord en <strong>dixièmes</strong> — les dixièmes sont des nombres entiers, et ceux-là on sait les multiplier. On compte ce qui sort en <strong>centièmes</strong> de carré magique. Et on revient aux carrés magiques à la fin.",
    c2_e_ts_qa: "D'abord, donc : combien de dixièmes de longueur magique font <strong>{b}</strong> longueur magique ?",
    c2_e_ts_ha: "Deux",
    c2_e_ts_qb: "Et combien de dixièmes font <strong>3</strong> longueurs magiques entières ?",
    c2_e_ts_hb: "Trois fois dix — et multiplier par dix, ça revient à ajouter un zéro",
    c2_e_ts3: "Donc <strong>{b} × 3</strong> en longueurs magiques, c'est <strong>2 × 30</strong> en dixièmes. Et un dixième fois un dixième, ça fait un centième de carré magique : c'est dans ces unités que la réponse va se compter.",
    c2_e_ts_hc: "Deux fois trois dizaines",
    c2_e_ts4: "Soixante centièmes. Maintenant, retour aux carrés magiques — et pour ça il faut savoir comment s'écrit un centième.",
    c2_e_ts5: "Un centième de carré magique, on l'écrit <strong>{one}</strong>. Dix centièmes, <strong>{ten}</strong>. Et ainsi de suite, tant qu'il y en a moins de cent.",
    c2_e_ts_qd: "Alors, à ton avis, comment est-ce qu'on écrit <strong>{n} centièmes</strong> de carré magique ?",
    c2_e_ts_hd: "Zéro, puis la virgule, puis {n}",
    c2_e_ts_ok: "<strong>{a}</strong> carré magique. Voilà la bande du côté — et tu viens de multiplier deux nombres qui ont une virgule dedans.",

    c2_e_tc1: "Le petit coin maintenant : <strong>{b} × {d}</strong>. Même chemin, et cette fois tu le connais.",
    c2_e_tc_qa: "Combien de dixièmes font <strong>{b}</strong> longueur magique ?",
    c2_e_tc_qb: "Et combien de dixièmes font <strong>{d}</strong> longueur magique ?",
    c2_e_tc_hb: "Sept",
    c2_e_tc_hc: "Deux fois sept",
    c2_e_tc_qd: "Et comment est-ce qu'on écrit <strong>{n} centièmes</strong> de carré magique ?",
    c2_e_tc_ok: "<strong>{a}</strong>. Le petit coin — et ce sont bien les mêmes {n} centièmes qu'on y avait comptés il y a longtemps.",

    c2_e_tt1: "Et la bande du haut : <strong>6 × {d}</strong>. Même chemin une dernière fois.",
    c2_e_tt_qa: "Combien de dixièmes font <strong>6</strong> longueurs magiques entières ?",
    c2_e_tt_ha: "Six fois dix — on ajoute un zéro",
    c2_e_tt2: "Donc ça fait <strong>60 × 7</strong> centièmes. Ce n'est pas dans notre table — mais on l'a déjà rencontré : <strong>60 × 7 = (6 × 7) × 10</strong>, et 6 × 7, lui, <em>y est</em>.",
    c2_e_tt_hc: "6 × 7 = 42, puis on ajoute un zéro",
    c2_e_tt3: "Quatre cent vingt centièmes. C'est bien plus que cent, donc cette fois il y a des carrés magiques entiers cachés là-dedans.",
    c2_e_tt4: "Essayons la même astuce que tout à l'heure, pour voir si elle tient encore : pour revenir des centièmes aux carrés magiques, on déplace la virgule de deux rangs vers la gauche.",
    c2_e_tt_qd: "Alors, comment est-ce qu'on écrirait <strong>{n} centièmes</strong> de carré magique ?",
    c2_e_tt_hd: "Quatre, puis la virgule, puis 20",

    c2_e_tk1: "<strong>{a}</strong>. Maintenant, si cette astuce vaut quelque chose, elle vient de nous dire deux choses qu'on peut aller vérifier sur le terrain.",
    c2_e_tk_qa: "D'abord : combien de carrés magiques entiers est-ce que {a} dit qu'il y a de cachés dans cette bande ?",
    c2_e_tk_ha: "Le chiffre à gauche de la virgule",
    c2_e_tk2: "Quatre ! Et regarde — on les a délimités nous-mêmes, quand on découpait les parcelles pour les arbres. Les voilà : quatre parcelles, cent centièmes chacune.",
    c2_e_tk_qb: "Et ensuite : combien de centièmes est-ce que {a} dit qu'il reste, une fois ces quatre-là enlevées ?",
    c2_e_tk_hb: "Les deux chiffres à droite de la virgule",
    c2_e_tk3: "Vingt, d'après lui. On va les compter, pour voir s'il a dit vrai ?",
    c2_e_tk_btn: "Allons les compter !",
    c2_e_tk_ok: "Vingt, exactement comme promis. Donc l'astuce tient : déplacer la virgule de deux rangs vers la gauche transforme bel et bien des centièmes en carrés magiques.",

    c2_e_tp1: "Et voilà — l'aire de chaque morceau du champ, calculée à partir de leurs deux côtés : à droite les {n} carrés magiques entiers, puis la bande avec ses quatre parcelles biscornues qui font 100 centièmes de carré magique, et les {r} centièmes qui restent, puis la bande du côté et le coin.",
    c2_e_tp3: "Maintenant, la règle de Marimon nous dit que, pour planter un arbre, on se fiche de savoir si cent centièmes forment un carré ou pas — il faut seulement que la surface soit d'un seul tenant, quelle que soit la forme. Donc on a le droit de compter les quatre parcelles biscornues comme quatre carrés magiques, quand on calcule l'aire et qu'on décide combien de graines d'arbres acheter. D'accord ?",

    c2_e_rg1: "Alors mettons-les où elles doivent aller : les quatre parcelles avec les carrés magiques entiers, et les restes ensemble.",
    c2_e_rg_qa: "Donc combien de blocs ayant l'aire d'un carré magique est-ce que ce champ contient en tout ? <strong>{a}&nbsp;+&nbsp;{b}&nbsp;=&nbsp;?</strong>",
    c2_e_rg_ha: "Compte à partir de {a} — {b} de plus",
    c2_e_rg_qb: "Et les restes : <strong>{x}&nbsp;+&nbsp;{y}&nbsp;+&nbsp;{z}&nbsp;=&nbsp;?</strong> centièmes.",
    c2_e_rg_hb: "{x} et {y} font 80",
    c2_e_rg_qc: "Donc : {w} carrés magiques entiers et {h} centièmes. Comment est-ce que tu écrirais ça avec une virgule — les carrés magiques entiers à gauche, les centièmes à droite ?",
    c2_e_rg_hc: "{w}, puis la virgule, puis {h}",
    c2_e_rg_ok1: "On dit que l'aire de ce champ fait <strong>{A} carrés magiques</strong>. Ce qui veut dire : {w} blocs séparés ayant chacun l'aire d'un carré magique — cent centièmes d'un seul tenant, qu'ils forment un carré ou pas — et {h} centièmes qui restent.",
    c2_e_rg_ok2: "Et regarde comme c'est pratique. Le nombre me donne ma liste de courses directement : <strong>{w} graines d'arbre</strong> et <strong>{h} graines de fleur</strong>. Costaud, non ?",
    // --- le périmètre, par le même chemin ---
    c2_e_pw1: "Une dernière chose. La distributivité aide aussi pour le <strong>périmètre</strong> — pour savoir combien de fil acheter.",
    c2_e_pw_ask: "Tu veux que je te montre ?",
    c2_e_pw_yes: "Oui !!!",
    c2_e_pw_why: "Pourquoi pas ?",
    c2_e_pw2: "Quatre petites multiplications au lieu de deux qui font peur. Commençons par les faciles.",
    c2_e_q_ml: "<strong>{p} = ?</strong> longueurs magiques",
    c2_e_q_t: "<strong>{p} = ?</strong> dixièmes de longueur magique",
    c2_e_pw_ok: "{a} et {b} — les longueurs magiques entières des deux grands côtés, et celles des deux petits.",

    c2_e_pt1: "Maintenant <strong>2 × {b}</strong>. Même problème qu'avant, et même façon de s'en sortir : on le fait d'abord en dixièmes, et on revient à la fin.",
    c2_e_pt_qa: "Combien de dixièmes de longueur magique font <strong>{b}</strong> longueur magique ?",
    c2_e_pt2: "Quatre dixièmes de longueur magique. Et les dixièmes se rangent à droite de la virgule — ça, on le sait depuis le tout début.",
    c2_e_pt_qc: "Alors comment est-ce qu'on écrit <strong>{n} dixièmes</strong> en longueurs magiques ?",
    c2_e_pt_hc: "Zéro, puis la virgule, puis {n}",
    c2_e_pt_ok: "<strong>{a}</strong>. Voilà les dixièmes le long des deux grands côtés.",

    c2_e_pu1: "Et maintenant, plus difficile : <strong>2 × {d}</strong>.",
    c2_e_pu_qa: "Combien de dixièmes font <strong>{d}</strong> longueur magique ?",
    c2_e_pu2: "Quatorze dixièmes. Alors comment est-ce qu'on transforme ça en longueurs magiques ? Essayons la même astuce — mais en déplaçant la virgule d'un <strong>seul</strong> rang vers la gauche cette fois, parce qu'on revient des dixièmes vers les unités (les longueurs magiques) et pas des centièmes vers les unités (les carrés magiques).",
    c2_e_pu_qc: "Alors comment est-ce qu'on écrirait <strong>{n} dixièmes</strong> en longueurs magiques ?",
    c2_e_pu_hc: "Un, puis la virgule, puis 4",
    c2_e_pu3: "<strong>{a}</strong>, oui — une longueur magique entière et quatre dixièmes. Vérifions si l'astuce marche bien, comme on l'a déjà fait tout à l'heure.",
    c2_e_pu4: "Voilà les {n} dixièmes : {t} d'un côté et {t} de l'autre. Regroupes-en dix, et voyons ce qui reste.",
    c2_e_pu_q: "Alors — combien de dixièmes reste-t-il ?",
    c2_e_pu_h: "Compte ce qui n'est pas entré dans le grand morceau",
    c2_e_pu_ok: "Quatre ! Une longueur magique entière et quatre dixièmes — exactement ce que l'astuce promettait. Donc elle marche aussi quand on revient des dixièmes.",

    c2_e_ps1: "Les quatre sont faits. Maintenant, additionnons.",
    c2_e_ps2: "Et c'est là que la <strong>commutativité</strong> et l'<strong>associativité</strong> reviennent : elles nous permettent de remettre les termes d'une somme dans l'ordre qu'on veut. Alors mettons les longueurs magiques entières ensemble, et les dixièmes ensemble. D'accord ?",
    c2_e_btn_allright: "D'accord !",
    c2_e_btn_dunno: "Je ne vois pas pourquoi.",
    c2_e_ps3: "Voilà. Les longueurs magiques entières d'un côté, les dixièmes de l'autre — et {a} s'est coupé en une longueur magique entière et quatre dixièmes, ce qui est exactement ce que ça veut dire.",
    c2_e_ps_qa: "Compte les longueurs magiques. Combien ?",
    c2_e_ps_ha: "{a} et {b} et encore une",
    c2_e_ps_qb: "Et maintenant les dixièmes. Combien ?",
    c2_e_ps_hb: "Quatre et quatre",
    c2_e_ps_qc: "{w} longueurs magiques et {t} dixièmes. Comment est-ce que tu écrirais ça en un seul nombre ?",
    c2_e_ps_hc: "{w}, puis la virgule, puis {t}",
    c2_e_ps_ok1: "<strong>{P} longueurs magiques de fil</strong> — et c'est exactement le même nombre qu'on avait trouvé en posant le fil morceau par morceau.",
    c2_e_ps_ok2: "Sauf que cette fois, ça a pris quatre petites multiplications et une addition. Tu vois comme tu calcules vite, maintenant ?",
    c2_e_lbl_ml: "{n} longueurs magiques",

    c2_e_cn_help: "Tu as été d'une <strong>aide immense</strong> — encore une fois !",
    c2_e_cn_learned: "Tu as appris les <strong>dixièmes</strong> et les <strong>centièmes</strong>, comment les écrire après une virgule, comment en ranger dix dans un seul, et la <strong>distributivité</strong> — découper les côtés d'un rectangle pour en multiplier les morceaux.",
    c2_e_cn_forest: "Mon drôle de champ est planté : 22 arbres et 94 fleurs. Marimon dit qu'il n'en a jamais vu d'aussi bien rangé.",

    c2_e_cn_finished: "Tu as terminé le Tableau des aires — Chapitre 2.",

    c2_f_arrive1: "Marimon a fait le tour de toute la forêt, et il rapporte des nouvelles. Trois autres champs brûlés par le feu — et tous les trois sont de drôles de champs.",
    c2_f_arrive2: "Mais tu connais toute la méthode maintenant. Mesurer les côtés, les écrire avec une virgule, découper le champ en rectangles, compter les morceaux, tout additionner.",

    c2_f_btn_myturn: "À moi !",

    c2_f_m_bottom: "Le voici. Commence par le côté du bas — des longueurs magiques entières, aussi loin qu'elles vont.",

    c2_f_m_exact: "Dis donc, attends une minute, tu es arrivé au bout du côté du champ sans avoir à utiliser de dixième de longueur magique. Les longueurs magiques tombent <strong>exactement</strong> juste, il ne reste rien du tout. Ça n'était pas arrivé une seule fois depuis le début de l'aventure.",

    c2_f_next3: "Dernier champ. Tu connais toute la méthode par cœur maintenant, alors vas-y — mesure-le, découpe-le, compte-le.",
    c2_f_odd3: "Je dis juste une chose et après je me tais : celui-là a quelque chose d'un peu différent. À toi de le repérer.",

    c2_f_cut1: "Découpe chaque côté en longueurs magiques entières et en dixièmes, et le champ se sépare en quatre tout seul.",

    c2_f_p_whole: "Le grand d'abord — des longueurs magiques entières des deux côtés, donc des carrés magiques entiers.",
