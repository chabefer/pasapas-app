            }, t('c2_f_a_h_area', v), { decimal: true });
          }, t('c2_f_a_h_ms', v));
        }, t('c2_f_a_h_r', v));
      }, t('c2_f_a_h_x', v));
    };

    if (parts.length > 1) {
      // The sum line above IS the question — "240 + 60 + 18 =" in grey with a "?" under it,
      // Chapter 1's shape. The prompt must not print it a second time right below the picture.
      stage(`<p>${t('c2_f_a_add', v)}</p>`, '?');
      askNumber(t('c2_f_a_q_tot'), total, afterTotal,
        t('c2_f_a_h_tot', { s: parts.join(' + ') }));
    } else {
      afterTotal();
    }
  });

  // --- the shopping list -----------------------------------------------------
  push('fSeeds' + p, function () {
    const v = fV();
    // The patches stay, and they carry a seed each. The whole magic squares hold 8 of them and
    // the answer is 11 — the other 3 grow on the patches the child just watched appear, so a
    // field without them would be showing a different number from its own caption (lesson 22).
    const patches = fPatchRuns(), bare = fBareRuns();
    // BOTH kinds of seed are sown at once, on the opening screen — Part B's `bSeeds` exactly:
    // the seeds arrive as an EVENT, and only then does Eliel ask how many of each he has to
    // buy. (Sylvain, 2026-08-18. The first build held the flowers back until their own answer;
    // that is lesson 17 applied to the wrong thing. "?" -> answer -> reveal is about the
    // NUMBER — a caption, a bracket's label — not about the ground. Here the ground being
    // fully sown is what the question is asked ABOUT, and the child counts what they can see.)
    const stage = key => {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div><p>${t(key, v)}</p>`);
      splitFieldView({
        materialize: true, seeds: true, brackets: fBrackets(),
        patches: patches, flowers: bare,
      });
    };
    stage('c2_f_s_intro');
    askNumber(t('c2_f_s_q_trees'), EWHOLE, () => {
      stage('c2_f_s_intro');
      askNumber(t('c2_f_s_q_flowers'), EHUND, () => {
        stage(EHUND === 0 ? 'c2_f_s_ok_flat' : 'c2_f_s_ok');
        addButton(t('btn_continue'), nextStep);
      }, t('c2_f_s_h_flowers', v));
    }, t('c2_f_s_h_trees', v));
  });

  // --- the wire --------------------------------------------------------------
  // Part C's own screens: the field carries the calculation, the pair being worked on is in
  // colour and the half not in play goes pale. Four lookups, each off Chapter 1's table.
  push('fPerim' + p, function () {
    const v = fV();
    calcStage('long', 'w', 2, Clong.w);
    askAfterButton(
      `<p>${t('c2_f_pm1', v)}</p><p style="margin-top:10px; text-align:center">${t('c2_c_form_f')}</p>` +
      `<p style="margin-top:10px">${t('c2_f_pm_qlw', v)}</p>`,
      2 * Clong.w, () => {
        calcStage('long', 't', 2, Clong.t);
        askInline(t('c2_f_pm_qlt', v), 2 * Clong.t, () => {
          calcStage('short', 'w', 2, Cshort.w);
          askInline(t('c2_f_pm_qsw', v), 2 * Cshort.w, () => {
            calcStage('short', 't', 2, Cshort.t);
            askInline(t('c2_f_pm_qst', v), 2 * Cshort.t, () => {
              calcStage(null, null, 2, Cshort.t);
              say('Eliel', t('c2_f_pm_ok', fV({
                a: 2 * Clong.w, b: 2 * Clong.t, c: 2 * Cshort.w, d: 2 * Cshort.t })));
              addButton(t('btn_continue'), nextStep);
            }, t('hint_find_in_table', { a: 2, b: Cshort.t }));
          }, t('hint_find_in_table', { a: 2, b: Cshort.w }));
        }, t('hint_find_in_table', { a: 2, b: Clong.t }));
      }, t('hint_find_in_table', { a: 2, b: Clong.w }));
  });

  // The colours regroup by unit, as they do in Part C, and then the carry — laid out and
  // watched on the second field, where TWO magic lengths come out of the tenths.
  push('fWire' + p, function () {
    const v = fV();
    const finish = () => {
      clearGame();
      wiredField(unitStyles(null));
      askAfterButton(`<p>${t('c2_f_pw_tot', v)}</p>`, PERIM, () => {
        clearGame();
        wiredField(unitStyles(null));
        say('Eliel', t('c2_f_pw_ok', v));
        addButton(t('btn_continue'), nextStep);
      }, t('c2_f_pw_h_tot', v), { decimal: true });
    };

    clearGame();
    wiredField(unitStyles('w'));
    askAfterButton(
      `<p>${t('c2_f_pw1', { a: oML(2 * Clong.w), b: oML(2 * Cshort.w) })}</p>`,
      C2W, () => {
        clearGame();
        wiredField(unitStyles('t'));
        askInline(t('c2_f_pw_qt', { a: pT(2 * Clong.t), b: pT(2 * Cshort.t) }), C2T, () => {
          if (CCARRY === 0) {
            clearGame();
            wiredField(unitStyles(null));
            say('Eliel', t('c2_f_pw_nocarry', fV({ a: oML(C2W), b: pT(C2T) })));
            addButton(t('btn_continue'), finish);
            return;
          }
          clearGame();
          storyHTML(`
            <div class="speaker">Eliel</div>
            <p>${t('c2_f_pw_carry1', { a: pT(C2T) })}</p>
            <p style="margin-top:8px">${t('c2_f_pw_carry2')}</p>
          `);
          const row = carryRow(null, { n: C2T, prelaid: true });
          addButton(t('c2_btn_group_ten'), () => {
            row.fuse();
            buttonArea.innerHTML = '';
            // The magic lengths that came OUT get their own question and their own picture
            // (Sylvain). The second field brings out two, where every other carry in the
            // chapter brings out one — so "how many" stops being rhetorical, and the answer is
            // then lifted clear of the row rather than left to be read off it.
            askInline(t('c2_f_pw_q_made', v), CCARRY, () => {
              row.harvest(CCARRY, t(CCARRY === 1 ? 'c2_f_pw_made_lbl1' : 'c2_f_pw_made_lbl',
                                    { n: CCARRY }));
              say('Eliel', t('c2_f_pw_made_ok'));
              addButton(t('btn_continue'), () => {
                buttonArea.innerHTML = '';
                askInline(t('c2_f_pw_q_rest', v), CREST, () => {
                  say('Eliel', t('c2_f_pw_carry_ok',
                    fV({ a: oML(CCARRY), b: pT(CREST) })));
                  addButton(t('btn_continue'), finish);
                }, t('c2_f_pw_h_rest', v));
              });
            }, t('c2_f_pw_h_made', v));
          });
        }, t('c2_f_pw_h', { a: 2 * Clong.t, b: 2 * Cshort.t }));
      }, t('c2_f_pw_h', { a: 2 * Clong.w, b: 2 * Cshort.w }));
  });

  return S;
}

// A term's earned count, as it sits on the field: "0.60" for a rectangle, a plain number for
// the whole magic squares (which are squares, not a decimal fraction of one).
function fTermCount(k) {
  return k === 'whole' ? String(EA * EC) : eFmt2(eHundredths(k) / 100);
}

// ---------------------------------------------------------------------------
// The three fields together — Chapter 1's totalSeeds / totalWire shape, and Part F's own
// long summation. Two piles kept separate, never one column of decimals: adding decimals in
// columns is an operation this chapter never teaches, and there is a second reason as well
// (CHAPTER2_PLAN.md §10.4.1) — across fields the WIRE regroups and the AREA does not, because
// Marimon's rule wants a hundred hundredths all in ONE piece and three fields are not one
// piece. The numbers here are chosen so the wrong carry is never even tempting: 18 + 8 + 0 is
// 26, well under a hundred. Do not "improve" them without reading that section.
// ---------------------------------------------------------------------------
// One field, drawn EXACTLY as the child last saw it: its own magic squares, its own patches, and
// a seed in every one of them plus a stipple on the flower ground (Sylvain, 2026-08-18). Not a
// second drawing routine — the same `splitFieldView`, re-parented out of gameArea (the move
// dBandLeft already uses), with the current field switched to each in turn. That is the whole
// reason setField exists, and it is what makes "the same picture" true by construction rather
// than approximated.
//
// It also settles the count honestly: field one shows 8 seeds in the whole magic squares and 3
// on its patches, which is the 11 its caption claims. The earlier version drew a plain rectangle
// precisely because 8 ruled squares under a caption of 11 would have been a lie (lesson 22) —
// materializing the patches is what removes the need to hide anything.
function fFieldEl(F) {
  applyField(F);
  const el = splitFieldView({
    materialize: true, seeds: true, patches: fPatchRuns(), flowers: fBareRuns(),
    padL: 2, padR: 2, padB: 2,     // 0 would fall through `||` to the full side margins
  });
  el.remove();                     // splitFieldView appends; here it is a flex child
  el.style.margin = '0';
  return el;
}

// ...and the same for the wire: each field wearing its own fence, drawn by Part C's `wiredField`
// with the colours it regrouped into at the market — every whole magic length orange, every tenth
// purple, ticks and all. That is what the two questions on this screen ask for, in that order, so
// the child counts orange and then counts purple off the three fences they built.
//
// The −6px side margins claw back part of wireStage's 16px of headroom. Three fenced fields come
// to 763px and #game-container gives 760, so without it the third one wraps onto its own row —
// and the whole point of the screen is the three of them side by side. The wire pieces reach
// HALF (10px) past the field edge, so 6px is spare on each side and nothing is clipped.
function fWireEl(F) {
  applyField(F);
  const el = wiredField(unitStyles(null));
  el.remove();
  el.style.margin = '0 -6px';
  return el;
}

// `mode` decides what the picture is OF, and it has to match the number underneath — three
// identical blank rectangles labelled once in seeds and once in wire say nothing about either.
// 'ground' is each field as it was planted; 'wire' draws the fence itself, thick and green.
function fTotalsRow(rows, pick, unitKey, mode) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:flex-end; justify-content:center;' +
    'gap:10px; flex-wrap:wrap; margin:12px auto 0; padding:0 4px;';
  rows.forEach((r, i) => {
    const col = document.createElement('div');
    col.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:6px;';
    col.appendChild(mode === 'wire' ? fWireEl(r.F) : fFieldEl(r.F));
    // The number is the bold line; the unit is a BARE label under it, carrying no {n} of its
    // own. That is not tidiness — the third field needs 0 flower seeds, and « 0 graines » vs
    // « 0 graine » is an agreement question French would make us answer for nothing.
    const lab = document.createElement('div');
    lab.innerHTML = `<strong style="font-size:15px; color:#3a3a3a">${pick(r)}</strong><br>` +
      t(unitKey);
    lab.style.cssText = 'font-family:Georgia,serif; font-size:12px; color:#6b5e4a;' +
      'text-align:center; line-height:1.5;';
    col.appendChild(lab);
    row.appendChild(col);
  });
  // The drawing left the current field set to whichever was done last. These two steps carry no
  // fieldSpec of their own, so put it back where the wrapper thinks it is.
  applyField(CHAPTER_FIELD);
  return row;
}

function fGrandSeeds() {
  const rows = fSummary();
  const trees = rows.reduce((a, r) => a + r.trees, 0);
  const flowers = rows.reduce((a, r) => a + r.flowers, 0);
  const stage = (html, pick, unitKey) => {
    clearGame();
    storyHTML(`<div class="speaker">Eliel</div>${html}`);
    gameArea.appendChild(fTotalsRow(rows, pick, unitKey, 'ground'));
  };
  stage(`<p>${t('c2_f_g_seeds1')}</p><p style="margin-top:8px">${t('c2_f_g_seeds2')}</p>`,
    r => r.trees, 'c2_f_u_trees');
  askNumber(t('c2_f_g_q_trees', { s: rows.map(r => r.trees).join(' + ') }), trees, () => {
    stage(`<p>${t('c2_f_g_seeds3', { n: trees })}</p>`, r => r.flowers, 'c2_f_u_flowers');
    askNumber(t('c2_f_g_q_flowers', { s: rows.map(r => r.flowers).join(' + ') }), flowers, () => {
      stage(`<p>${t('c2_f_g_seeds_ok', { a: trees, b: flowers })}</p>`,
        r => r.flowers, 'c2_f_u_flowers');
      addButton(t('btn_continue'), nextStep);
    }, t('c2_f_g_h', { s: rows.map(r => r.flowers).join(' + ') }));
  }, t('c2_f_g_h', { s: rows.map(r => r.trees).join(' + ') }));
}

function fGrandWire() {
  const rows = fSummary();
  const wholes = rows.reduce((a, r) => a + Math.floor(r.perim), 0);
  const tenths = rows.reduce((a, r) => a + Math.round((r.perim % 1) * 10), 0);
  const carry = Math.floor(tenths / 10), rest = tenths % 10;
  const total = Math.round((wholes + carry + rest / 10) * 10) / 10;
  const v = { w: wholes, t: tenths, c: carry, r: rest, n: fmtNum(total),
              s: rows.map(r => fmtNum(r.perim)).join(' + ') };
  const stage = html => {
    clearGame();
    storyHTML(`<div class="speaker">Eliel</div>${html}`);

// ===========================================================================
// THE CURRENT FIELD — one swappable geometry for the whole file
// ===========================================================================
// Every geometry constant above is a pure function of (L, l), so Part F does not need any of
// them threaded through a signature: it needs them RECOMPUTED. That matters — there are some
// 240 references to FIELD / FT / CUT / REGION / Clong / Cshort / the E* family in this file,
// and each one changed is a chance to break a chapter that currently drives clean end to end.
// This way every call site keeps working verbatim and Parts A–E are unchanged by construction.
//
// Mutate, never replace, anything an existing structure holds a reference to: SIDE points at
// Clong/Cshort, REGION points at the REGIONS objects, and the step closures point at FIELD.
//
// ⚠️ What is NOT reactive, on purpose: PIECES (Part B), the D* plot geometry, LENS and DLENS.
// Those belong to parts that only ever run on the chapter field, and LENS/DLENS are hand-tuned
// pixel tables that would need a solver rather than a formula (CHAPTER2_PLAN.md §10.5 — the
// reason Part F does no magnification at all).
function setField(f) {
  if (FIELD.L === f.L && FIELD.l === f.l) return;   // runs on every step entry; keep it cheap
  applyField(f);
}

function applyField(f) {
  FIELD.L = f.L; FIELD.l = f.l;

  FT.w = Math.round(f.L * 10);   FT.h = Math.round(f.l * 10);
  CUT.x = Math.floor(f.L) * 10;  CUT.y = Math.floor(f.l) * 10;

  const set = (k, x, y, w, h) => { const r = REGION[k]; r.x = x; r.y = y; r.w = w; r.h = h; };
  set('whole',  0,     0,     CUT.x,        CUT.y);
  set('top',    0,     CUT.y, CUT.x,        FT.h - CUT.y);
  set('side',   CUT.x, 0,     FT.w - CUT.x, CUT.y);
  set('corner', CUT.x, CUT.y, FT.w - CUT.x, FT.h - CUT.y);

  MSCOLS = Math.floor(f.L); MSROWS = Math.floor(f.l);
  TA = REGION.top.w * REGION.top.h;
  TB = REGION.side.w * REGION.side.h;
  TC = REGION.corner.w * REGION.corner.h;
  TALLY_B = ['top', 'side', 'corner'].map(k =>
    ({ make: () => flowerRectEl(k), n: REGION[k].w * REGION[k].h }));

  Clong.w  = Math.floor(f.L); Clong.t  = Math.round((f.L % 1) * 10);
  Cshort.w = Math.floor(f.l); Cshort.t = Math.round((f.l % 1) * 10);
  C2W = 2 * Clong.w + 2 * Cshort.w;
  C2T = 2 * Clong.t + 2 * Cshort.t;
  CCARRY = Math.floor(C2T / CKEEP);
  CREST  = C2T % CKEEP;
  PERIM  = C2W + CCARRY + CREST / 10;

  EA = Clong.w;  EB = Clong.t / 10;
  EC = Cshort.w; ED = Cshort.t / 10;
  EPROD = { whole: [EA, EC], side: [EB, EC], top: [EA, ED], corner: [EB, ED] };
  EAREA  = Math.round(f.L * f.l * 100) / 100;
  EWHOLE = Math.floor(EAREA);
  EHUND  = Math.round((EAREA - EWHOLE) * 100);
  EMLPX  = Math.min(15, Math.floor(430 / PERIM));
  ETPX   = EMLPX / 10;

  DPLOTS    = Math.floor(TA / DPLOT);
  DPERCH    = REGION.top.h;
  DBANDLEFT = TA - DPLOTS * DPLOT;
  DREST     = DBANDLEFT + TB + TC;
  DTREES    = MSROWS * MSCOLS + DPLOTS;
}

applyField(CHAPTER_FIELD);

  // The colours REGROUP here, from by-pair to by-unit: every whole magic length orange, every

  function cAddUp() {

          say('Eliel', t('c2_c_add_ok', { a: oML(C2W), b: pT(C2T) }));

  // --- PART D: Marimon's rule + the repackaging ----------------------------
  // The motive comes first and it is Eliel's, not the arithmetic's: he is replanting a
  // burned FOREST, and eighteen trees is not a forest. That is what sends him to Marimon,
  // and it is what makes the rule worth having when it arrives.
  function dMarimon() {
    clearGame();
    showEliel();
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_d_m1')}</p>
      <p style="margin-top:8px">${t('c2_d_m2')}</p>
      <p style="margin-top:8px">${t('c2_d_m3')}</p>
    `);
    addButton(t('c2_d_btn_show'), nextStep);
  },

  // The rule is checked before it is used. The patch bends, and a bend is the shape Part B
  // taught the child to count — so the check is a method they own, run once more on a new
  // object. It is also exactly the shape of the first plot they are about to mark out.
  function dExample() {
    clearGame();
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_d_ex1')}</p>
      <p style="margin-top:8px">${t('c2_d_ex2')}</p>
    `);
    // The figure follows the question: the part being asked about lights up, the other one
    // dims, and the two lengths the sentence quotes are printed against that part's own
    // sides. Both go back up for the last question, which is about the whole patch.
    const A = DEXA('tall'), B = DEXA('low');
    let fig = examplePatch(null);
    gameArea.appendChild(fig);
    const show = (f, counts, total) => {
      const next = examplePatch(f, counts, total);
      gameArea.replaceChild(next, fig);
      fig = next;
    };
    addButton(t('btn_continue'), () => {
      show('tall');
      askAfterButton(t('c2_d_ex_qa'), A, () => {
        show('low', { tall: A });
        askInline(t('c2_d_ex_qb'), B, () => {
          // Both counts are still under their own parts here, so "{a} + {b} = ?" is a sum
          // over two things on screen rather than two numbers the child has to remember —
          // with the brace under them carrying the "?" the question is asking for.
          show(null, { tall: A, low: B }, '?');
          askInline(t('c2_d_ex_qc', { a: A, b: B }), DPLOT, () => {
            show(null, { tall: A, low: B }, DPLOT);
            say('Eliel', t('c2_d_ex_ok'));
            addButton(t('btn_continue'), nextStep);
          }, t('c2_d_ex_hc'));
        }, t('c2_d_ex_hb'));
      }, t('c2_d_ex_ha'));
    });
  },

  function dQuestion() {
    clearGame();
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_d_q1', { n: TA + TB + TC })}</p>
      <p style="margin-top:8px">${t('c2_d_q2')}</p>
    `);
    splitFieldView({ materialize: true });
    addButton(t('c2_d_btn_carve'), nextStep);
  },

  // The long one. Four plots, one click each, and then a fifth that is REFUSED — which is
  // how "94 is not enough" gets felt instead of computed. The refusal is careful about
  // WHY: the ground left is still all in one piece (it runs right round the corner), so
  // contiguity is not what stops him. It is the area, and the next screens count it.
  function dCarve() {
    clearGame();
    say('Eliel', t('c2_d_carve_go'));
    carveStage(
      n => {
        if (n === 1) say('Eliel', t('c2_d_carve_1'));
        else if (n < DPLOTS) say('Eliel', t('c2_d_carve_n', { n: n, m: n * DPLOT }));
        else say('Eliel', t('c2_d_carve_4', { m: DPLOTS * DPLOT }));
      },
      () => {
        storyHTML(`
          <div class="speaker">Eliel</div>
          <p>${t('c2_d_carve_no1')}</p>
          <p style="margin-top:8px">${t('c2_d_carve_no2')}</p>
        `);
        addButton(t('btn_continue'), nextStep);
      });
  },

  // Only one of the three leftover pieces is new, so only one is asked for. The side strip
  // and the corner were never touched and still read 60 and 14 — saying so out loud is what
  // makes the sum on the next screen recognisably the same sum as Part B's.
  function dBandLeft() {
    clearGame();
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_d_band1')}</p>
      <p style="margin-top:8px">${t('c2_d_band2')}</p>
    `);
    // Opens on the plain field, exactly as dTrees draws it. The zoom is something the child
    // asks for, not the state the screen starts in.
    splitFieldView({
      materialize: true, plots: DPLOTS,
      counts: { whole: t('c2_d_cnt_whole', { n: MSROWS * MSCOLS }) },
    });
    addButton(t('c2_d_btn_look'), () => {
      clearGame();
      say('Eliel', t('c2_d_band_click'));
      // ...and the question only arrives once all twenty have been ticked off. Chapter 1's
      // shape: cover the thing, then say how many you placed.
      restLensStage(() => {
        askInline(t('c2_d_band_q'), DBANDLEFT, () => {
          say('Eliel', t('c2_d_band_ok', { b: TB, c: TC }));
          addButton(t('btn_continue'), nextStep);
        }, t('c2_d_band_h'));
      });
    });
  },

  // Part B's closing sum, said again over the same three pieces of ground with the trees
  // taken out: 20 + 60 + 14 where 420 + 60 + 14 stood. Same brackets, same "?" -> reveal,
  // same helper — which is the whole reason tallyView/tallySum take their items now.
  function dTally() {
    const story = `<div class="speaker">Eliel</div>
      <p>${t('c2_d_tally1')}</p>
      <p style="margin-top:8px">${t('c2_d_tally_q')}</p>`;
    const render = stage => {
      clearGame();
      storyHTML(story);
      const items = tallyD();
      gameArea.appendChild(tallyView(stage, items));
      gameArea.appendChild(tallySum(stage, items));
    };
    const ask = (stage, answer, prompt, then) => {
      render(stage);
      const p = document.createElement('div');
      p.textContent = prompt;
      p.style.cssText = 'text-align:center; font-size:17px; margin-bottom:6px;';
      gameArea.appendChild(p);
      askNumber('', answer, () => { render(stage + 1); setTimeout(then, 900); }, String(answer));
    };
    ask(0, DBANDLEFT + TB, t('c2_d_tally_p1'), () => ask(2, DREST, t('c2_d_tally_p2'), nextStep));
  },

  function dTrees() {
    clearGame();
    // Drawn once and left alone: the story panel and the buttons are what change below.
    splitFieldView({
      materialize: true, plots: DPLOTS,
      counts: { whole: t('c2_d_cnt_whole', { n: MSROWS * MSCOLS }) },
    });

    // "Is there enough left for one more tree?" is a real question with a real answer, so
    // unlike the chapter's both-answers-advance screens (aWeirdIndeed and its kin, which are
    // invitations to have an opinion) a "yes" is not waved through. It is answered the way
    // askInline answers a wrong number — Eliel restates the rule and the count and asks
    // again, with the buttons still there. Nothing is lost by trying.
    const pose = lead => {
      storyHTML(`
        <div class="speaker">Eliel</div>
        <p>${lead}</p>
        <p style="margin-top:8px">${t('c2_d_tr_ask')}</p>
      `);
      buttonArea.innerHTML = '';
      addButton(t('c2_btn_yes_plain'), () => pose(t('c2_d_tr_yes', { r: DREST })));
      addButton(t('c2_btn_no_plain'), () => {
        storyHTML(`
          <div class="speaker">Eliel</div>
          <p>${t('c2_d_tr_no', { r: DREST })}</p>
          <p style="margin-top:8px">${t('c2_d_tr2')}</p>
        `);
        buttonArea.innerHTML = '';
        // Straight into the wrap-up on a correct answer (Sylvain): a screen saying "22
        // trees!" sat between the child's answer and dWrapUp, which opens by saying the
        // same thing with the ground to back it up. askInline still shows its own
        // "Wonderful!" before advancing, so the answer is acknowledged.
        addButton(t('btn_continue'), () => {
          askAfterButton(t('c2_d_tr_q', { a: MSROWS * MSCOLS, b: DPLOTS }), DTREES,
            nextStep, t('c2_d_tr_h', { a: MSROWS * MSCOLS, b: DPLOTS }));
        });
      });
    };
    pose(t('c2_d_tr1', { r: DREST }));
  },

  // Conservation of area, said as the thing it is: the field did not change. The before and
  // after are put next to each other because the numbers on their own ("18 and 494" vs
  // "22 and 94") look like a different field until you see they came off the same ground.
  function dWrapUp() {
    clearGame();
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_d_wrap1', { a: MSROWS * MSCOLS, b: TA + TB + TC })}</p>
      <p style="margin-top:8px">${t('c2_d_wrap2', { a: DTREES, b: DREST })}</p>
      <p style="margin-top:8px">${t('c2_d_wrap3', { n: DPLOTS })}</p>
    `);
    // Every tree seed is on the ground here: one in each of the 18 magic squares, one in
    // each of the 4 plots, all the same size. NO caption (Sylvain) — "18 tree seeds" written
    // across the block was the one number on this screen that is not the point. The screen
    // is about 22, the prose says 22, and the ground now shows 22 for the child to count.
    splitFieldView({ materialize: true, plots: DPLOTS, seeds: true });
    addButton(t('btn_continue'), nextStep);
  },

  // --- PART E: name what we did, and write the answer -----------------------
  // Part D ended on the repacked field, with four tree plots carved out of the leftover
  // ground. E goes back to the four-rectangle reading, and says so — that picture is where
  // the identity is legible, and D has just finished establishing that the two readings are
  // the same field.
  function eLookBack() {
    clearGame();
    showEliel();
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_e_back1')}</p>
      <p style="margin-top:8px">${t('c2_e_back2')}</p>
    `);
    splitFieldView({ materialize: true, padL: EPADL, padR: EPADR, brackets: true });
    addButton(t('btn_continue'), nextStep);
  },

  // The sides, written as SUMS. Part A wrote 6.2 and 3.7; what is new here is the split —
  // and 0.2 and 0.7 as numbers in their own right, which the child has never written. The
  // leading zero gets a sentence of its own, because it is the first time a number in this
  // chapter has had nothing on the left of the dot.
  function eSides() {
    const v = { L: fmtNum(FIELD.L), l: fmtNum(FIELD.l), b: fmtNum(EB), d: fmtNum(ED) };
    // The conversion is written on the very edge it is about (Sylvain): the bracket that
    // said "2 tenths" now says "2 tenths = 0.2 magic lengths". The left side's stays in
    // words until the child has written it — the same "?"-then-reveal ordering the chapter
    // uses everywhere else, and here the relabel is literally the answer being confirmed on
    // the ground rather than only in Eliel's reply.
    const draw = withLeft => {
      clearGame();
      splitFieldView({
        materialize: true, padL: EPADL, padR: EPADR,
        brackets: {
          b: t('c2_e_lbl_2t_eq', { n: fmtNum(EB) }),
          d: withLeft ? t('c2_e_lbl_7t_eq', { n: fmtNum(ED) }) : null,
        },
      });
    };
    draw(false);
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_e_sides1', v)}</p>
      <p style="margin-top:8px">${t('c2_e_sides2', v)}</p>
    `);
    addButton(t('btn_continue'), () => {
      // The question stands alone. It normally would not — askInline replaces the story
      // panel, so "a 0 goes on the left of the dot" would leave the screen at the exact
      // moment the child has to use it, which is why aNotation and the associativity screens
      // hand their explanation over WITH the question. Here the bracket does that job
      // instead: "2 tenths = 0.2 magic lengths" is on the field and stays there, so
      // repeating the sentence would only be saying twice what the picture already says.
      askAfterButton(t('c2_e_sides_q', v),
        ED, () => {
          draw(true);
          say('Eliel', t('c2_e_sides_ok', v));
          addButton(t('btn_continue'), nextStep);
        }, t('c2_e_sides_h'), { decimal: true });
    });
  },

  // Chapter 1's formula, applied to a field Chapter 1 could not have handled — and Eliel
  // admitting he cannot do the multiplication it asks for. That admission is the whole
  // reason the rest of Part E exists, and it is honest: nothing so far has multiplied two
  // decimals, and the chapter is about to do it without ever learning how.
  function eBigProduct() {
    clearGame();
    splitFieldView({ materialize: true, padL: EPADL, padR: EPADR, brackets: EBRACKETS() });
    const v = { L: fmtNum(FIELD.L), l: fmtNum(FIELD.l) };
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_e_prod1')}</p>
      <p style="margin-top:8px">${t('c2_e_prod2', v)}</p>

  // The four products, read off the field by the child. Eliel does the first one (6 x 3,

  // The brackets stay in WORDS while the questions are open — "7 tenths", not "0.7" — so
  // the answer is a conversion the child performs rather than a label they copy. They
  // switch to numbers only on the closing screen, which is then the deck's page-7 picture,
  // built by the child.
  function eFourProducts() {
    const v = { b: fmtNum(EB), d: fmtNum(ED) };
    const done = { whole: eProdHTML('whole') };
    const render = (focus, numbers) => {
      clearGame();
      splitFieldView({
        materialize: true, focus: focus, counts: done, padL: EPADL, padR: EPADR,
        brackets: numbers ? EBRACKETS() : true,
      });
    };

    // One rectangle: how far across, then how tall, then its product goes on the ground.
    const measure = (key, next) => {
      const [across, up] = EPROD[key];
      const what = t('c2_e_lbl_' + key);
      const hint = n => (n < 1 ? t('c2_e_h_t', { n: Math.round(n * 10) })
                               : t('c2_e_h_w', { n: n }));
      render(key);
      askAfterButton(t('c2_e_q_across', { what: what }), across, () => {

  function eSplitSides() {
    clearGame();
    const v = { L: fmtNum(FIELD.L), l: fmtNum(FIELD.l), b: fmtNum(EB), d: fmtNum(ED) };
    splitFieldView({
      materialize: true, padL: EPADL, padR: EPADR, brackets: EBRACKETS(),

  // The letters, and the name, on one screen (Sylvain). The name used to have a screen of
  // its own; it now arrives WITH the formula it names and is immediately cut back down to
  // size — *"in the end it is just about cutting rectangles up so their area is easier to
  // compute"* — because the fancy word is not what the child gained here. What follows the
  // name is not applause, it is "let's check", which is the same instinct as Part D's
  // dropped "22 trees!" screen.
  //
  // The field and the identity live in the GAME area and the prose in the story panel,
  // because a wrong answer re-poses the question — and if the identity lived in the panel it
  // would leave the screen exactly when the child needs to read it.
  //
  // `L` and `l` are bracketed round the WHOLE of each side, outside a/b/c/d. The equation
  // opens `L × l = (a + b) × (c + d)`, and without those two brackets the child would have
  // to take on trust that L is the two bottom pieces put back together — which is the claim.
  function eIdentity() {
    const v = { b: fmtNum(EB), d: fmtNum(ED), n: TC };
    const done = [];   // rectangles matched so far, in the equation's own order

    // The child CLICKS the rectangle rather than picking its name off a list (Sylvain), and
    // does it for all four terms in turn instead of just the corner. Two reasons it is
    // better: the answer is given on the ground the term is about rather than in words, and
    // four matches build the whole correspondence rather than sampling one of it. The order
    // is the equation's, so the field fills in left to right as the line is read — and the
    // corner, "the one everybody forgets", is still the last one.
    const render = (current, onPick) => {
      clearGame();
      splitFieldView({
        materialize: true, padL: EPADL, padR: EPADR, padB: 96,
        brackets: { a: 'a', b: 'b', c: 'c', d: 'd', L: 'L', l: 'l' },
        solved: done, onPick: onPick,
      });
      gameArea.appendChild(eEqLine(
        eExpr('L × l') + ' &nbsp;=&nbsp; ' + eExpr('(a + b) × (c + d)'),
        eTermLetters,
        k => done.indexOf(k) >= 0 ? 'done' : (k === current ? 'current' : 'todo')));
    };

    const pose = (k, lead) => storyHTML(`
      <div class="speaker">Eliel</div>
      ${lead ? `<p>${lead}</p>` : ''}
      <p${lead ? ' style="margin-top:8px"' : ''}>${t('c2_e_id_q', { term: eTermLetters(k) })}</p>
    `);

    // A wrong pick is not waved through — dTrees' treatment, and for the same reason.
    // Nothing is lost by trying, and the refusal says which two pieces to look for rather
    // than just "no".
    const wrongText = k => t('c2_e_id_wrong', {
      x: eLetterX(k), y: eLetterY(k),
      px: t(eLetterX(k) === 'a' ? 'c2_e_pc_long' : 'c2_e_pc_short'),
      py: t(eLetterY(k) === 'c' ? 'c2_e_pc_long' : 'c2_e_pc_short'),
    });

    const ask = i => {
      if (i >= EORDER.length) {
        render(null, null);
        say('Eliel', t('c2_e_id_done', v));
        addButton(t('btn_continue'), nextStep);
        return;
      }
      const k = EORDER[i];
      render(k, picked => {
        if (picked !== k) return pose(k, wrongText(k));
        done.push(k);
        ask(i + 1);
      });
      pose(k, i === 0 ? t('c2_e_id_go') : null);
    };

    render(null, null);
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_e_id1', v)}</p>
      <p style="margin-top:8px">${t('c2_e_id2')}</p>
      <p style="margin-top:10px">${t('c2_e_id_name')}</p>
    `);
    addButton(t('c2_e_btn_check'), () => ask(0));
  },

  // --- the four terms, worked out (Sylvain, 2026-08-14) ------------------------

  function eApply() {

  // ...and the trick is CHECKED, against ground the child carved out with their own clicks

    const shown = (plots, lead) => {

  // The whole sentence, as numbers and as ground, side by side — and then Marimon's rule
  // once more, because everything that follows depends on a patch that bends counting as a

  function eTotalPicture() {
    clearGame();
    const V = EORDER.reduce((m, k) => (m[k] = eTermValue(k), m), {});
    gameArea.appendChild(eEqLine(eSplitLHS(), k => eValued(k, V[k])));
    // The field itself, then "=", then the four pieces — the sentence above said "the field
    // on the left", and a picture that does not show it makes the sentence a claim about
    // something absent. Stacked rather than in a row: side by side the whole thing runs past
    // 1100px, and bWrapUp settled that trade the same way.
    const fv = splitFieldView({ materialize: true, plots: DPLOTS, padL: 6, padR: 6, padB: 6 });
    fv.style.margin = '4px auto 0';

      'color:#8b7355; margin:6px 0 2px;';
    gameArea.appendChild(eq);
    gameArea.appendChild(rowOf([
      eLabelled(magicSquaresBlock(MSCOLS, MSROWS, 22, false),
                MSROWS * MSCOLS, t('c2_e_lbl_whole')),
      eLabelled(bandWithPlotsEl(MPX), TA, t('c2_b_lbl_top')),
      flowerRectEl('side'), flowerRectEl('corner'),
    ], 22));
    storyHTML(`
      <div class="speaker">Eliel</div>

      <p style="margin-top:10px">${t('c2_e_tp3')}</p>
    `);

  // The regrouping, and the number. The four patches leave the band and join the 18; what is
  // left of the band joins the strip and the corner. Then 18 + 4, then 20 + 60 + 14, then
  // the child writes 22.94 — and the last thing said about it is that the two halves of that
  // number ARE the shopping list, which is what the whole chapter was for.
  function eRegroup() {
    const v = {
      a: MSROWS * MSCOLS, b: DPLOTS, w: EWHOLE, h: EHUND,
      x: DBANDLEFT, y: TB, z: TC, A: eFmt2(EAREA),
      L: fmtNum(FIELD.L), l: fmtNum(FIELD.l),
    };
    // Each bracket carries "?" until its own question is answered — Chapter 1's "?"-then-
    // reveal, which tallyView follows too. Captioned with the answers from the start, the
    // two groups would be sitting there telling the child what 18 + 4 and 20 + 60 + 14 come
    // to, right above the inputs asking for them.
    const groups = st => rowOf([
      groupBox(rowOf([magicSquaresBlock(MSCOLS, MSROWS, MSCELL, false),
                      rowOf(Array.from({ length: DPLOTS }, (_, p) => plotBlockEl(p, 3)), 10)], 18),
               t('c2_e_lbl_ms', { n: st >= 1 ? EWHOLE : '?' }), 2),
      groupBox(rowOf([bandRestEl(), flowerRectEl('side'), flowerRectEl('corner')], 20),
               t('c2_b_unit_h', { n: st >= 2 ? EHUND : '?' }), 1),
    ], 40);

    const stage = (st, html) => {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>${html}`);
      gameArea.appendChild(groups(st));
    };

    stage(0, `<p>${t('c2_e_rg1')}</p>`);
    askNumber(t('c2_e_rg_qa', v), EWHOLE, () => {
      stage(1, `<p>${t('c2_e_rg1')}</p>`);
      askNumber(t('c2_e_rg_qb', v), EHUND, () => {
        stage(2, `<p>${t('c2_e_rg_qc', v)}</p>`);
        askNumber('', EAREA, () => {
          clearGame();
          const eq = document.createElement('div');
          eq.innerHTML = `${v.L} × ${v.l} = <strong>${v.A}</strong>`;
          eq.style.cssText = 'text-align:center; font-family:Georgia,serif; font-size:30px;' +
            'color:#5a8f3d; margin:6px 0 12px;';
          gameArea.appendChild(eq);
          gameArea.appendChild(groups(2));
          storyHTML(`

          addButton(t('btn_continue'), nextStep);
        }, t('c2_e_rg_hc', v), { decimal: true });

  },


  // --- the perimeter, by the same road (Sylvain, 2026-08-14) -------------------
  // Chapter 1's other formula, split the same four ways — and it lands on 19.8, the exact
  // number Part C reached by laying wire piece by piece and carting it to the market. Same
  // answer, a fraction of the work, which is the whole argument for having a shortcut.
  function ePerimIntro() {
    clearGame();
    const L = fmtNum(FIELD.L), l = fmtNum(FIELD.l), b = fmtNum(EB), d = fmtNum(ED);
    // The reveal does not start until the child has said go (Sylvain). It used to run the
    // moment the screen appeared, which left no time to read the paragraph that says what is
    // about to happen — and the animation is the whole point of the screen. Both buttons
    // advance: it is an invitation, not a test.
    const ask = () => storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_e_pw1')}</p>
      <p style="margin-top:8px">${t('c2_e_pw_ask')}</p>
    `);
    ask();

    // The field, built ONCE and only re-wired — a full redraw between lines would flicker,
    // and the thing the child is meant to notice is the wire changing colour, not the
    // picture blinking.
    const { stage, W, H } = wireStage();
    const layer = document.createElement('div');
    layer.style.cssText = 'position:absolute; left:0; top:0; right:0; bottom:0;';
    stage.appendChild(layer);
    const paint = split => {
      layer.innerHTML = '';
      const st = perimStyles(split);
      Object.keys(st).forEach(k => drawWire(layer, k, W, H, st[k]));
    };
    paint(false);
    gameArea.appendChild(stage);

    // The chain, coloured to the ground (Sylvain). Built in code rather than held in the
    // dictionary: there is not a word in it, only notation and the decimal separator, and the
    // colours are code constants that would have to be threaded through placeholders anyway.
    const c = (col, html) => `<span style="color:${col}">${html}</span>`;
    const lines = [
      c(CBLUE, '2 × L') + ' + ' + c(CRED, '2 × l'),
      '= ' + c(CBLUE, `2 × ${L}`) + ' + ' + c(CRED, `2 × ${l}`),
      '= ' + c(CBLUE, '2 × (6 + ') + c(CBLUE2, b) + c(CBLUE, ')') + ' + ' +
             c(CRED, '2 × (3 + ') + c(CRED2, d) + c(CRED, ')'),
      '= ' + c(CBLUE, '2 × 6') + ' + ' + c(CBLUE2, `2 × ${b}`) + ' + ' +
             c(CRED, '2 × 3') + ' + ' + c(CRED2, `2 × ${d}`),
    ];
    // Unveiled a line at a time, with room to notice (Sylvain). The pause matters most at
    // the THIRD line, which is where the sides come apart and the wire on the field splits
    // into four colours at the same instant. Reserving the rows' space from the start (they
    // are hidden, not absent) keeps the lines already on screen from jumping as each
    // arrives. The Continue button only appears at the end, so the reveal cannot be
    // outrun — and the comment on the finished chain arrives with it, since "four small
    // multiplications" is not true of the screen until all four are up.
    const STEP = 1500;
    const run = () => {
      buttonArea.innerHTML = '';
      storyHTML(`<div class="speaker">Eliel</div><p>${t('c2_e_pw1')}</p>`);
      const box = ePRow(lines.map(x =>
        `<div style="white-space:nowrap; visibility:hidden">${x}</div>`).join(''), 19);
      gameArea.appendChild(box);
      const rows = [...box.children];
      rows[0].style.visibility = 'visible';
      for (let i = 1; i < rows.length; i++) setTimeout(() => {
        if (i === 2) paint(true);
        rows[i].style.visibility = 'visible';
      }, i * STEP);
      setTimeout(() => {
        storyHTML(`
          <div class="speaker">Eliel</div>
          <p>${t('c2_e_pw1')}</p>
          <p style="margin-top:8px">${t('c2_e_pw2')}</p>
        `);
        addButton(t('btn_continue'), nextStep);
      }, rows.length * STEP);
    };
    addButton(t('c2_e_pw_yes'), run);
    addButton(t('c2_e_pw_why'), run);
  },

  // The two whole-number terms, off Chapter 1's table, with the field re-dressing itself
  // between them exactly as Part C's cTwoLong/cTwoShort do.
  function ePerimWhole() {
    calcStage('long', 'w', 2, Clong.w);
    askAfterButton(t('c2_e_q_ml', { p: `2 × ${Clong.w}` }), 2 * Clong.w, () => {
      calcStage('short', 'w', 2, Cshort.w);
      askInline(t('c2_e_q_ml', { p: `2 × ${Cshort.w}` }), 2 * Cshort.w, () => {
        calcStage(null, 'w', 2, Cshort.w);
        say('Eliel', t('c2_e_pw_ok', { a: 2 * Clong.w, b: 2 * Cshort.w }));
        addButton(t('btn_continue'), nextStep);
      }, t('hint_find_in_table', { a: 2, b: Cshort.w }));
    }, t('hint_find_in_table', { a: 2, b: Clong.w }));
  },

  // 2 x 0.2 — down into tenths and straight back, with no carry to worry about. The notation
  // it comes back through is Part A's, not a new rule: tenths live on the right of the dot.
  function ePerimTenthA() {
    const v = { b: fmtNum(EB), n: 2 * Clong.t, a: fmtNum(2 * Clong.t / 10) };
    const stage = html => {
      calcStage('long', 't', 2, Clong.t);
      storyHTML(`<div class="speaker">Eliel</div>${html}`);
    };
    stage(`<p>${t('c2_e_pt1', v)}</p>`);
    askNumber(t('c2_e_pt_qa', v), Clong.t, () => {
      stage(`<p>${t('c2_e_pt1', v)}</p>`);
      askNumber(t('c2_e_q_t', { p: `2 × ${Clong.t}` }), 2 * Clong.t, () => {
        stage(`<p>${t('c2_e_pt2')}</p>`);
        askNumber(t('c2_e_pt_qc', v), 2 * Clong.t / 10, () => {
          // Stays on 't' rather than opening back out to the whole pair (Sylvain): the line
          // says "that is the TENTHS along the two long sides", so only the two 0.2 bits are
          // at full strength and the six whole magic lengths beside them stay dimmed. The
          // sentence and the picture then name the same thing.
          calcStage('long', 't', 2, Clong.t);
          say('Eliel', t('c2_e_pt_ok', v));
          addButton(t('btn_continue'), nextStep);
        }, t('c2_e_pt_hc', v), { decimal: true });
      }, t('hint_find_in_table', { a: 2, b: Clong.t }));
    }, t('c2_e_ts_ha'));
  },

  // 2 x 0.7 — the one that overflows ten, so coming back needs the dot moved, and the move
  // is CHECKED against the regrouping. Note what this rescues: Part C met these same 14
  // tenths and deliberately said nothing about them being more than ten (lesson 18 — the
  // carry was forced at the market, not by how the number looked). They come back here as
  // the test of a rule about notation, which is the right job for them.
  function ePerimTenthB() {
    const v = { d: fmtNum(ED), n: 2 * Cshort.t, t: Cshort.t, a: fmtNum(2 * Cshort.t / 10) };
    const stage = html => {
      calcStage('short', 't', 2, Cshort.t);
      storyHTML(`<div class="speaker">Eliel</div>${html}`);
    };
    stage(`<p>${t('c2_e_pu1', v)}</p>`);
    askNumber(t('c2_e_pu_qa', v), Cshort.t, () => {
      stage(`<p>${t('c2_e_pu1', v)}</p>`);
      askNumber(t('c2_e_q_t', { p: `2 × ${Cshort.t}` }), 2 * Cshort.t, () => {
        stage(`<p>${t('c2_e_pu2')}</p>`);
        askNumber(t('c2_e_pu_qc', v), 2 * Cshort.t / 10, () => {
          clearGame();
          storyHTML(`
            <div class="speaker">Eliel</div>
            <p>${t('c2_e_pu3', v)}</p>
            <p style="margin-top:8px">${t('c2_e_pu4', v)}</p>
          `);
          // Part C's own carry device, pre-laid: the child laid these once already, and what
          // is being tested here is the notation, not the regrouping.
          const row = carryRow(null, { n: 2 * Cshort.t, prelaid: true, split: Cshort.t });
          addButton(t('c2_btn_group_ten'), () => {
            row.fuse();
            buttonArea.innerHTML = '';
            askInline(t('c2_e_pu_q'), 2 * Cshort.t - CKEEP, () => {
              say('Eliel', t('c2_e_pu_ok'));
              addButton(t('btn_continue'), nextStep);
            }, t('c2_e_pu_h'));
          });
        }, t('c2_e_pu_hc'), { decimal: true });
      }, t('hint_find_in_table', { a: 2, b: Cshort.t }));
    }, t('c2_e_tc_hb'));
  },

  // The sum — and the colours regroup one last time, from by-side to by-unit, at exactly the
  // moment the question stops being "this side then that side" and becomes "all the wholes
  // then all the tenths". 1.4 splits into the whole magic length and the four tenths it is.
  function ePerimSum() {
    const v = {
      a: fmtNum(2 * Cshort.t / 10), w: C2W + 1, t: CREST, P: fmtNum(PERIM),
      x: 2 * Clong.w, y: 2 * Cshort.w,
    };
    const stage = (st, html) => {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>${html}`);
      gameArea.appendChild(ePerimSumView(st));
    };
    stage(0, `<p>${t('c2_e_ps1')}</p><p style="margin-top:8px">${t('c2_e_ps2')}</p>`);
    const go = () => {
      stage(1, `<p>${t('c2_e_ps3', v)}</p>`);
      askNumber(t('c2_e_ps_qa'), C2W + 1, () => {
        stage(2, `<p>${t('c2_e_ps3', v)}</p>`);
        askNumber(t('c2_e_ps_qb'), CREST, () => {
          stage(3, `<p>${t('c2_e_ps_qc', v)}</p>`);
          askNumber('', PERIM, () => {
            clearGame();
            storyHTML(`
              <div class="speaker">Eliel</div>
              <p>${t('c2_e_ps_ok1', v)}</p>
              <p style="margin-top:8px">${t('c2_e_ps_ok2')}</p>
            `);
            // ONE field (Sylvain): this screen used to draw a second one above, in the
            // orange/purple unit colours, which said less than the one already sitting on the
            // left of the equation and put two copies of the same fence on the same screen.
            gameArea.appendChild(ePerimSumView(4));
            addButton(t('btn_continue'), nextStep);
          }, t('c2_e_ps_hc', v), { decimal: true });
        }, t('c2_e_ps_hb'));
      }, t('c2_e_ps_ha', { a: v.x, b: v.y }));
    };
    addButton(t('c2_e_btn_allright'), go);
    addButton(t('c2_e_btn_dunno'), go);
  },

];

// --- PART F: three more fields, run by the child, then the three of them together ---------
F_FIELDS.forEach(F => fStepsFor(F).forEach(fn => chapterSteps.push(fn)));
chapterSteps.push(fGrandSeeds, fGrandWire);

chapterSteps.push(
  // The chapter's ending — Chapter 1's `conclusion()`, in Chapter 2's words. Before this
  // existed, nextStep() fell through at the last step and the final screen stayed up.
  function eConclusion() {
    clearGame();
    showEliel();
    storyHTML(`
      <div class="speaker">Eliel</div>
      <p>${t('c2_e_cn_help')}</p>
      <p style="margin-top:8px">${t('c2_e_cn_learned')}</p>
      <p style="margin-top:12px">${t('c2_e_cn_forest')}</p>
    `);

    const endBox = document.createElement('div');
    endBox.style.cssText = 'text-align:center; margin-top:30px; padding:20px;' +
      'background:#d4edda; border-radius:12px;';
    endBox.innerHTML = `
      <h2 style="color:#5a8f3d; margin-bottom:8px;">${t('c2_e_cn_complete')}</h2>
      <p style="font-size:18px;">${t('c2_e_cn_finished')}</p>
      <p style="margin-top:12px; color:#888;">${t('c2_e_cn_next')}</p>
    `;
    gameArea.appendChild(endBox);
    addButton(t('btn_play_again'), () => { currentStep = 0; steps[0](); });
  });

// Every step runs on ITS OWN field. Part F's steps carry a `fieldSpec`; everything else is
// the chapter's own 6.2 × 3.7. Doing it here rather than inside each step is what keeps
// ?step=N and the debug jump bar honest: they enter at an arbitrary index, in any order, and
// the geometry has to be right before the first line of the step runs.
// The name is carried across by hand — the debug bar labels its menu from fn.name, and an
// anonymous wrapper would turn 118 named steps into "step 43".
const steps = chapterSteps.map(fn => {
  const spec = fn.fieldSpec || CHAPTER_FIELD;
  const wrapped = function () { setField(spec); return fn.apply(this, arguments); };
  Object.defineProperty(wrapped, 'name', { value: fn.name, configurable: true });
  return wrapped;
});

startGame(steps);

</script>
