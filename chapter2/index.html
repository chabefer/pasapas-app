const PX = 46;              // screen pixels per magic length


// Hatched ground: used for the sliver of field the lengths don't reach, for the excess
// area an overshoot would wrongly claim, and for the zoomed sliver in Part A2 — one
// pattern so the child reads them as the same kind of thing at three different moments.
const HATCH =
  'background:repeating-linear-gradient(45deg,rgba(232,163,61,.55),rgba(232,163,61,.55) 4px,'
  + 'rgba(255,246,224,.55) 4px,rgba(255,246,224,.55) 9px);';

// lengthSVG(), seedDot() and tenthGrid() moved to pap-core.js on 2026-08-18, when Chapter 3
// became their third caller. Nothing about them was chapter-specific; PX stays here because
// pixels-per-magic-length is this chapter's geometry, not shared vocabulary.

// The field and its stage. Identical on every Part A screen so the field never moves as
// the child goes from step to step.
function fieldStage() {
  const W = FIELD.L * PX, H = FIELD.l * PX;
  const stage = document.createElement('div');
  stage.style.cssText = `position:relative; width:${W}px; height:${H + 34}px; margin:6px auto 0;`;
  // border-box so the field's OUTER edge lands exactly on W / H. Without it the 3px border
  // pushes the visible boundary past the geometry the lengths are measured against, and the
  // overshoot stops being an honest measurement.
  const rect = document.createElement('div');
  rect.style.cssText =
    `position:absolute; left:0; top:0; box-sizing:border-box; width:${W}px; height:${H}px;` +
    'background:#fafaf5; border:3px solid #8b5e3c; border-radius:3px;';
  stage.appendChild(rect);
  return { stage, rect, W, H };
}

// ---------------------------------------------------------------------------
// Measure one side of the weird field with whole magic lengths.
//
// The point of this interaction is that IT DOES NOT WORK. The child lays lengths
// end to end, runs out of field with a gap still showing, lays one more, and watches
// it stick out past the corner. Only then does Eliel conclude "longer than 6, shorter
// than 7" — a fact the child has established, not been told.
//
// So: no numbers on the field, no tick marks, and 6.2 / 3.7 are never uttered. The
// notation arrives later, once the child has felt the need for something smaller than
// a magic length. (Vision doc, §6: "symbolic notation introduced only when the child
// feels the need for it.")
//
// Placement is forgiving on purpose — a click or drop ANYWHERE along the strip lays
// the next length in sequence. The child is discovering a property of the field, and
// fumbling the drop target is not the difficulty we want them to be having.
// ---------------------------------------------------------------------------
function measureWeirdSide(cfg) {
  const horiz  = cfg.side === 'bottom';
  const trueLen = horiz ? FIELD.L : FIELD.l;   // 6.2 / 3.7 — geometry only, never shown
  const whole  = Math.floor(trueLen);          // 6 / 3 — as many as actually fit
  const { stage, rect, W, H } = fieldStage();

  // The area we would WRONGLY COUNT by calling the side 7 instead of its true length —
  // the exact mirror of the sliver we MISS by calling it 6. Both stay on screen at the
  // end, with the field's true edge running between them, so "too little" and "too much"
  // are one picture rather than two remembered screens.
  // Same hatch as the missing sliver (it's the same kind of quantity) but a dashed
  // border, because this one isn't really there.
  function showExcess() {
    const run = (whole + 1 - trueLen) * PX;
    excessMark = document.createElement('div');
    excessMark.style.cssText =
      (horiz
        ? `position:absolute; left:${W}px; top:0; width:${run}px; height:${H}px;`
        : `position:absolute; left:0; top:${-run}px; width:${W}px; height:${run}px;`) +
      'box-sizing:border-box; z-index:1; pointer-events:none;' + HATCH + 'border:2px dashed #c98a2a;';
    stage.appendChild(excessMark);
  }

  // A side can come out EXACTLY whole — Part F's third field is 5 magic lengths across. Then
  // there is no sliver to show and no overshoot to compare it with: the child lays the last
  // length, nothing is left over, and that is the whole discovery. Asking for one more would
  // only demonstrate that a sixth sticks out by a whole length, which teaches nothing and
  // muddies the one thing this screen has to say.
  const exact = trueLen === whole;

  let laid = 0, gapMark = null, excessMark = null;

  // The leftover is a SLIVER OF FIELD, so draw it on the field — a full-height band
  // of ground the lengths didn't reach. Marking it on the ruler instead makes it a
  // 9px nick that a child can easily miss; what's left over is land, not ruler.
  function showGap() {
    const run = (trueLen - whole) * PX;
    gapMark = document.createElement('div');
    gapMark.style.cssText =
      (horiz
        ? `position:absolute; left:${whole * PX}px; top:0; width:${run}px; height:${H}px;`
        : `position:absolute; left:0; top:0; width:${W}px; height:${run}px;`) +   // laid bottom-up, so what's left is the TOP band
      'z-index:1; pointer-events:none;' + HATCH + 'outline:2px solid #c98a2a; outline-offset:-1px;';
    stage.appendChild(gapMark);
  }

  function lay() {
    if (laid >= (exact ? whole : whole + 1)) return;   // whole + 1 is the last one allowed
    const over = !exact && (laid === whole);
    // The missing sliver STAYS on screen when the overshoot appears — the two errors
    // are meant to be compared, not shown one after the other.
    let gs = 0, ge = PX;
    if (over) {
      if (horiz) ge = (trueLen - whole) * PX;          // runs off the far (right) end
      else       gs = (whole + 1 - trueLen) * PX;      // laid upward, so it runs off the near (top) end
    }

    const p = document.createElement('div');
    p.innerHTML = lengthSVG(horiz, PX, gs, ge);
    // Centred ON the field's boundary line, like Chapter 1 — the child is laying the
    // length along the edge, not beside it.
    // pointer-events:none is load-bearing: pieces are appended after the hit strip, so
    // without it each laid length covers the strip and swallows the next click.
    // Left side is laid from the BOTTOM corner upward, so piece i sits one length
    // higher than the last.
    p.style.cssText = 'position:absolute; pointer-events:none; z-index:2;' + (horiz
      ? `left:${laid * PX}px; top:${H - HALF}px;`
      : `left:${-HALF}px; top:${H - (laid + 1) * PX}px;`);
    stage.appendChild(p);
    laid++;

    if (laid < whole)       say('Eliel', t('c2_a_keep_going'));
    else if (laid === whole && exact) {
      strip.style.cursor = rect.style.cursor = 'default';
      say('Eliel', t(cfg.exactKey));
      addButton(t('btn_continue'), nextStep);
    }
    else if (laid === whole) { showGap(); say('Eliel', t(cfg.gapKey)); }
    else {
      showExcess();
      strip.style.cursor = rect.style.cursor = 'default';
      say('Eliel', `${t(cfg.overKey)}<p style="margin-top:8px">${t(cfg.conclKey)}</p>`);
      addButton(t('btn_continue'), nextStep);
    }
  }

  // Hit target: a band straddling the side being measured, generously thicker than the
  // length itself, running past the end so the overshoot region is clickable too.
  const BAND = HIT + 16;
  const strip = document.createElement('div');
  strip.id = 'measure-strip';        // handle used to drive this in tests
  strip.style.cssText = 'position:absolute; cursor:pointer;' + (horiz
    ? `left:0; top:${H - BAND / 2}px; width:${W + PX}px; height:${BAND}px;`
    : `left:${-BAND / 2}px; top:${-HALF}px; width:${BAND}px; height:${H + HALF}px;`);
  strip.addEventListener('click', lay);
  strip.addEventListener('dragover', e => e.preventDefault());
  strip.addEventListener('drop', e => {
    e.preventDefault();
    lay();
    if (currentDraggedLength) { currentDraggedLength.remove(); currentDraggedLength = null; }
  });
  stage.appendChild(strip);

  gameArea.appendChild(stage);
  const spare = exact ? whole : whole + 1;
  addMagicLengthSupply(PX, horiz ? spare : 0, horiz ? 0 : spare);
}

// ---------------------------------------------------------------------------
// Part A2 — cut the magic length into ten, re-measure, and only THEN write 6.2.
//
// A tenth of a magic length is 4.6px on the field: invisible, and impossible to work
// with. So the tenth-work happens ZOOMED — a tenth is drawn at PX, exactly the size a
// whole magic length has on the field, i.e. 10x magnification. The cutting step
// establishes that scale before anything depends on it: one magic length is shown at
// 10*PX and cut into ten pieces of PX each, so the child watches the big little pieces
// being made rather than being handed them.
// ---------------------------------------------------------------------------

// The ruler that gets cut. draw(1) = one whole magic length; draw(10) = the same bar
// divided into ten. Same total length either way — only the tick marks change, which is
// the point: cutting doesn't make it longer or shorter.
function cutRulerView() {
  const el = document.createElement('div');
  el.style.cssText = 'margin:14px auto 6px; width:max-content;';
  function draw(n) {
    el.innerHTML = '';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.innerHTML = lengthSVG(true, (10 * PX) / n);
      row.appendChild(d);
    }
    el.appendChild(row);
  }
  draw(1);
  return { el, cut: () => draw(10) };
}

// A small tray of tenth-pieces, so this works by dragging as well as clicking.
// (Not the core's addMagicLengthSupply: its caption says "magic lengths", and these
// are tenths — the whole distinction the step is about.)
function tenthSupply(n, horiz) {
  const label = document.createElement('div');
  label.id = 'supply-label';
  label.textContent = t('c2_supply_tenths');
  gameArea.appendChild(label);

  const area = document.createElement('div');
  area.id = 'supply-area';
  area.style.alignItems = 'center';
  for (let i = 0; i < n; i++) {
    const ml = document.createElement('div');
    ml.className = 'magic-length';
    ml.draggable = true;
    // Oriented the way they will be laid: horizontal for the bottom side, vertical for the
    // left one. A horizontal tenth in the tray above a vertical slot asks the child to do a
    // mental rotation that has nothing to do with the maths.
    ml.style.width = (horiz ? PX : 20) + 'px';
    ml.style.height = (horiz ? 20 : PX) + 'px';
    ml.innerHTML = lengthSVG(horiz, PX, null, null, '#3a3a3a');   // neutral in the tray, like Ch1
    ml.addEventListener('dragstart', e => {
      currentDraggedLength = ml; ml.classList.add('dragging');
      e.dataTransfer.setData('text/plain', 'tenth');
    });
    ml.addEventListener('dragend', () => { ml.classList.remove('dragging'); currentDraggedLength = null; });
    area.appendChild(ml);
  }
  gameArea.appendChild(area);
}

// The field as the child left it: n whole lengths laid, leftover sliver hatched.
// Static — it's context for the zoomed work below, not something to interact with.
function staticField(side, n) {
  const horiz = side === 'bottom';
  const { stage, W, H } = fieldStage();
  const trueLen = horiz ? FIELD.L : FIELD.l;
  const whole = Math.floor(trueLen);

  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.innerHTML = lengthSVG(horiz, PX);
    p.style.cssText = 'position:absolute; pointer-events:none; z-index:2;' + (horiz
      ? `left:${i * PX}px; top:${H - HALF}px;`
      : `left:${-HALF}px; top:${H - (i + 1) * PX}px;`);
    stage.appendChild(p);
  }

  const run = (trueLen - whole) * PX;
  const sliver = document.createElement('div');
  sliver.style.cssText =
    (horiz ? `position:absolute; left:${whole * PX}px; top:0; width:${run}px; height:${H}px;`
           : `position:absolute; left:0; top:0; width:${W}px; height:${run}px;`) +
    'z-index:1; pointer-events:none;' + HATCH + 'outline:2px solid #c98a2a; outline-offset:-1px;';
  stage.appendChild(sliver);

  gameArea.appendChild(stage);
  return stage;
}

// The field with both sides fully measured: whole magic lengths, then the tenths that
// finished the job, all in green with their tick marks showing. At field scale a tenth is
// only 4.6px, so the tenths read as a fine comb at the end of each side — which is honest:
// they ARE small, and that smallness is why they could measure what the whole lengths couldn't.
// `sides` defaults to both, which is how Part A meets it. Part F measures one side all the way
// through before touching the other, so its first write-up screen asks for only the bottom —
// and the picture must not already show a left side the child has not measured yet.
function measuredField(sides) {
  const { stage, W, H } = fieldStage();

  (sides || ['bottom', 'left']).forEach(side => {
    const horiz = side === 'bottom';
    const trueLen = horiz ? FIELD.L : FIELD.l;
    const whole = Math.floor(trueLen);
    const tenths = Math.round((trueLen - whole) * 10);
    const T = PX / 10;

    for (let i = 0; i < whole; i++) {
      const d = document.createElement('div');
      d.innerHTML = lengthSVG(horiz, PX);
      d.style.cssText = 'position:absolute; pointer-events:none; z-index:2;' + (horiz
        ? `left:${i * PX}px; top:${H - HALF}px;`
        : `left:${-HALF}px; top:${H - (i + 1) * PX}px;`);
      stage.appendChild(d);
    }
    for (let k = 0; k < tenths; k++) {
      const d = document.createElement('div');
      d.innerHTML = lengthSVG(horiz, T, null, null, null);
      d.style.cssText = 'position:absolute; pointer-events:none; z-index:2;' + (horiz
        ? `left:${whole * PX + k * T}px; top:${H - HALF}px;`
        : `left:${-HALF}px; top:${H - whole * PX - (k + 1) * T}px;`);
      stage.appendChild(d);
    }
  });

  gameArea.appendChild(stage);
  return stage;
}

// The leftover sliver, under the SAME magnifying glass the child has already seen.
//
// It was a detached "close up" bar before, which made the zoom a second, unrelated diagram
// style. Reusing the lens keeps one continuous world: the ring sits on the very bit of edge
// that was left over, the cone goes to the lens, and the lens holds that same bit at 10x —
// where a tenth is drawn at PX, the size a whole magic length has on the field.
//
// The lens sits on the side of the field being measured, and the sliver keeps its real
// orientation: below and horizontal for the bottom side, left and vertical for the left one.
// Rotating it flat would have been easier to lay out and would have quietly broken the
// correspondence with the edge the child just measured.
//
// No overshoot is possible here — the tenths fit EXACTLY, and that exactness is the payoff
// of having cut the magic length up.
function magnifiedSliver(cfg) {
  const horiz = cfg.side === 'bottom';
  const W = FIELD.L * PX, H = FIELD.l * PX;
  const trueLen = horiz ? FIELD.L : FIELD.l;
  const whole = Math.floor(trueLen);
  const run = (trueLen - whole) * PX;        // the sliver at field scale: 9.2 / 32.2
  const tenths = Math.round((trueLen - whole) * 10);
  const mag = tenths * PX;                   // the sliver at 10x: 92 / 322
  const RING = 26, GAP = 52;

  // The ring covers more than the sliver: it also catches the tail end of the LAST whole
  // magic length. Carrying that into the lens is what makes the magnified view read as the
  // same continuous edge rather than a fragment floating on its own — the child can see
  // where the whole length stops and the leftover begins. How much shows is exactly what
  // the ring covers, so the lens stays an honest picture of it.
  const preRun = Math.max(0, RING - run / 2);
  const preMag = preRun * 10;
  const span = preMag + mag;                 // everything the lens holds

  // Lens below (bottom side) or to the left (left side), always on the edge being measured.
  // A vertical lens is inherently tall; without a generous rx it stops looking like a lens
  // and becomes a capsule, with the cone degenerating into a strip.
  const lensRx = horiz ? span / 2 + 30 : 90;
  const lensRy = horiz ? 40 : span / 2 + 26;
  const fx = horiz ? 0 : 2 * lensRx + GAP;
  // When the lens is taller than the field, centre the field against it so the cone has a
  // sane angle instead of diving from the very top corner.
  const fy = horiz ? 0 : Math.max(0, (2 * lensRy - H) / 2);
  const ringCx = horiz ? fx + whole * PX + run / 2 : fx;
  const ringCy = horiz ? fy + H : fy + run / 2;
  // The lens sits directly under (or beside) the ring, not under the middle of the field —
  // a magnifier that isn't over the thing it magnifies reads as an unrelated diagram.
  const lensCx = horiz ? ringCx : lensRx;
  const lensCy = horiz ? H + GAP + lensRy : lensRy;
  const cw = horiz ? Math.max(W, lensCx + lensRx) : fx + W;
  const ch = horiz ? lensCy + lensRy : Math.max(fy + H, 2 * lensRy);

  const box = document.createElement('div');
  box.style.cssText = `position:relative; width:${cw}px; height:${ch}px; margin:6px auto 0;`;

  const add = css => { const d = document.createElement('div'); d.style.cssText = css; box.appendChild(d); return d; };

  // --- the field, exactly as the child left it ---
  add(`position:absolute; left:${fx}px; top:${fy}px; box-sizing:border-box; width:${W}px; height:${H}px;` +
      'background:#fafaf5; border:3px solid #8b5e3c; border-radius:3px;');
  for (let i = 0; i < whole; i++) {
    const d = add('position:absolute; pointer-events:none; z-index:2;' + (horiz
      ? `left:${fx + i * PX}px; top:${fy + H - HALF}px;`
      : `left:${fx - HALF}px; top:${fy + H - (i + 1) * PX}px;`));
    d.innerHTML = lengthSVG(horiz, PX);
  }
  add((horiz ? `position:absolute; left:${fx + whole * PX}px; top:${fy}px; width:${run}px; height:${H}px;`
             : `position:absolute; left:${fx}px; top:${fy}px; width:${W}px; height:${run}px;`) +
      'z-index:1; pointer-events:none;' + HATCH + 'outline:2px solid #c98a2a; outline-offset:-1px;');

  // --- cone, drawn under everything so both rings sit on top of it ---
  const cone = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  cone.setAttribute('width', cw); cone.setAttribute('height', ch);
  cone.style.cssText = 'position:absolute; left:0; top:0; pointer-events:none; z-index:0;';
  const pts = horiz
    ? `${ringCx - RING + 3},${ringCy + 18} ${lensCx - lensRx + 8},${lensCy - lensRy - 3} ` +
      `${lensCx + lensRx - 8},${lensCy - lensRy - 3} ${ringCx + RING - 3},${ringCy + 18}`
    : `${ringCx - 18},${ringCy - RING + 3} ${lensCx + lensRx + 3},${lensCy - lensRy + 8} ` +
      `${lensCx + lensRx + 3},${lensCy + lensRy - 8} ${ringCx - 18},${ringCy + RING - 3}`;
  cone.innerHTML = `<polygon points="${pts}" fill="rgba(180,160,110,0.16)" stroke="#8b5e3c" ` +
                   `stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>`;
  box.appendChild(cone);

  // --- the ring, around the very bit of edge that was left over ---
  add(`position:absolute; left:${ringCx - RING}px; top:${ringCy - RING}px; width:${2 * RING}px;` +
      `height:${2 * RING}px; border:3px solid #8b5e3c; border-radius:50%; z-index:3; pointer-events:none;`);

  // --- the lens ---
  add(`position:absolute; left:${lensCx - lensRx}px; top:${lensCy - lensRy}px; box-sizing:border-box;` +
      `width:${2 * lensRx}px; height:${2 * lensRy}px; background:#fdfbf3; border:4px solid #8b5e3c;` +
      'border-radius:50%; z-index:1;');

  // The bottom side runs left->right, so "before" is to the LEFT. The left side was laid
  // bottom-up, so "before" is BELOW. Getting this backwards would put the tail of the last
  // whole length on the wrong side of the leftover and silently reverse the edge.
  const c0 = (horiz ? lensCx : lensCy) - span / 2;
  const sx = horiz ? c0 + preMag : lensCx - 12;
  const sy = horiz ? lensCy - 12 : c0;

  // the tail of the last whole magic length. No tick at its OUTER end — it doesn't end
  // there, it just runs out of the lens — but a tick at the junction, because that is
  // exactly where the whole magic length stops and the leftover starts. Same tick the
  // child has seen on every laid length, so the magnified view keeps the same vocabulary.
  add('position:absolute; z-index:2; background:#5a8f3d;' + (horiz
      ? `left:${c0}px; top:${lensCy - 3.5}px; width:${preMag}px; height:7px;`
      : `left:${lensCx - 3.5}px; top:${c0 + mag}px; width:7px; height:${preMag}px;`));
  add('position:absolute; z-index:3; background:#5a8f3d;' + (horiz
      ? `left:${c0 + preMag - 1.5}px; top:${lensCy - 7}px; width:3px; height:14px;`
      : `left:${lensCx - 7}px; top:${c0 + mag - 1.5}px; width:14px; height:3px;`));

  // the sliver itself, magnified, still hatched so it reads as the same piece of ground
  const slot = add(`position:absolute; left:${sx}px; top:${sy}px; box-sizing:border-box;` +
      (horiz ? `width:${mag}px; height:24px;` : `width:24px; height:${mag}px;`) +
      HATCH + 'outline:2px solid #c98a2a; z-index:2;');

  // The child LAYS the tenths, exactly as they covered fields with magic squares in
  // Chapter 1 — and then counts what they laid. The laying is the point: it is what makes
  // "two tenths" a thing they did rather than a thing they read off a ruler. Graduating the
  // slot in advance would answer the question before it was asked.
  let laid = 0;
  function lay() {
    if (laid >= tenths) return;
    const d = add('position:absolute; pointer-events:none; z-index:4;' + (horiz
      ? `left:${sx + laid * PX}px; top:${lensCy - HALF}px;`
      // left side was laid bottom-up; keep going the same way inside the lens
      : `left:${lensCx - HALF}px; top:${sy + mag - (laid + 1) * PX}px;`));
    d.innerHTML = lengthSVG(horiz, PX);
    laid++;
    if (laid < tenths) {
      say('Eliel', t('c2_sliver_keep'));
    } else {
      slot.style.outline = '2px solid #5a8f3d';
      strip.style.cursor = 'default';
      if (cfg.onComplete) cfg.onComplete();
    }
  }

  const strip = add(`position:absolute; left:${lensCx - lensRx}px; top:${lensCy - lensRy}px;` +
      `width:${2 * lensRx}px; height:${2 * lensRy}px; border-radius:50%; cursor:pointer; z-index:5;`);
  strip.id = 'measure-strip';
  strip.addEventListener('click', lay);
  strip.addEventListener('dragover', e => e.preventDefault());
  strip.addEventListener('drop', e => {
    e.preventDefault();
    lay();
    if (currentDraggedLength) { currentDraggedLength.remove(); currentDraggedLength = null; }
  });

  gameArea.appendChild(box);
  tenthSupply(tenths, horiz);
}

// ---------------------------------------------------------------------------
// Part A′ — the same wall as Part A, one dimension up.
//
// The child measured the sides and now needs the GROUND. They cover what they can with
// magic squares, 18 fit, and a strip is left over all round the edge that a magic square
// is far too big for — exactly the shape of the problem they already solved once for
// lengths. That symmetry is the point: the answer (cut it) is one they can reach for.
// ---------------------------------------------------------------------------

// 18 magic squares into the 6x3 that fits, with the L-shaped remainder hatched.
// Reuses Chapter 1's .field-cell / .filled / .magic-square vocabulary so covering ground
// looks and behaves exactly as it did there.
function coverWithSquares(onComplete) {
  const { stage, W, H } = fieldStage();
  const COLS = 6, ROWS = 3, NEED = COLS * ROWS;

  // the ground the squares can't reach: a band along the top, a strip down the right
  [[0, 0, W, H - ROWS * PX], [COLS * PX, H - ROWS * PX, W - COLS * PX, ROWS * PX]]
    .forEach(([x, y, w, h]) => {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute; left:${x}px; top:${y}px; width:${w}px; height:${h}px;` +
        'z-index:1; pointer-events:none;' + HATCH + 'outline:2px solid #c98a2a; outline-offset:-1px;';
      stage.appendChild(d);
    });

  let filled = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'field-cell';
      cell.style.cssText =
        `position:absolute; left:${c * PX}px; top:${H - (r + 1) * PX}px;` +
        `width:${PX}px; height:${PX}px; z-index:2; cursor:pointer;`;
      let done = false;
      const fill = () => {
        if (done) return;
        done = true;
        cell.classList.add('filled');
        filled++;
        if (filled < NEED) say('Eliel', t('c2_ap_keep'));
        else setTimeout(onComplete, 350);
      };
      cell.addEventListener('click', fill);
      cell.addEventListener('dragover', e => e.preventDefault());
      cell.addEventListener('drop', e => {
        e.preventDefault();
        fill();
        if (currentDraggedSquare) { currentDraggedSquare.remove(); currentDraggedSquare = null; }
      });
      stage.appendChild(cell);
    }
  }

  gameArea.appendChild(stage);

  const label = document.createElement('div');
  label.id = 'supply-label';
  label.textContent = t('supply_squares');
  gameArea.appendChild(label);
  const supply = document.createElement('div');
  supply.id = 'supply-area';
  for (let i = 0; i < NEED; i++) {
    const sq = document.createElement('div');
    sq.className = 'magic-square';
    sq.style.width = sq.style.height = PX + 'px';
    sq.draggable = true;
    sq.textContent = '·';
    sq.addEventListener('dragstart', e => {
      currentDraggedSquare = sq; sq.classList.add('dragging');
      e.dataTransfer.setData('text/plain', 'magic-square');
    });
    sq.addEventListener('dragend', () => { sq.classList.remove('dragging'); currentDraggedSquare = null; });
    supply.appendChild(sq);
  }
  gameArea.appendChild(supply);
  return stage;
}

// The field as the child covered it: 18 squares down, remainder hatched. Static.
function coveredField() {
  const { stage, W, H } = fieldStage();
  const COLS = 6, ROWS = 3;
  [[0, 0, W, H - ROWS * PX], [COLS * PX, H - ROWS * PX, W - COLS * PX, ROWS * PX]]
    .forEach(([x, y, w, h]) => {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute; left:${x}px; top:${y}px; width:${w}px; height:${h}px;` +
        'z-index:1;' + HATCH + 'outline:2px solid #c98a2a; outline-offset:-1px;';
      stage.appendChild(d);
    });
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div');
    cell.className = 'field-cell filled';
    cell.style.cssText = `position:absolute; left:${c * PX}px; top:${H - (r + 1) * PX}px;` +
      `width:${PX}px; height:${PX}px; z-index:2;`;
    stage.appendChild(cell);
  }
  gameArea.appendChild(stage);
  return stage;
}

// One magic square drawn at its own scale, ruled into the hundred little squares that
// tile it. SQ is not the lens's 10x — a magic square there would be 460px square and
// wouldn't fit beside its own explanation.
const SQ = 300, SQC = SQ / 10;


// A block of whole magic squares in Chapter 1's colours, with or without their seeds.
// Hand-built rather than `showFilledField`, whose `.field-cell.filled::after` always draws
// the seed — and the area screen has to show the ground WITHOUT it, so that the seeds
// arriving on the next screen are an event rather than something already on the page.
function magicSquaresBlock(cols, rows, cell, withSeeds) {
  const g = document.createElement('div');
  g.style.cssText = `display:grid; flex:none;` +
    `grid-template-columns:repeat(${cols},${cell}px); grid-template-rows:repeat(${rows},${cell}px);`;
  for (let i = 0; i < cols * rows; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:relative; box-sizing:border-box; width:${cell}px; height:${cell}px;` +
      'background:#d4edda; border:1px solid #8aba8a;';
    if (withSeeds) c.appendChild(seedDot(Math.min(24, Math.round(cell * 0.8))));
    g.appendChild(c);
  }
  return g;
}

function magicSquareEl(ruled) {
  const el = tenthGrid(10, 10, SQC, { grid: ruled, border: '3px solid #3a3a3a' });
  el.style.borderRadius = '3px';
  return el;
}

// The flower square beside a magic square, to scale and sharing a baseline — the whole
// point is for the child to SEE how small it is before it is given a name.
function compareSquares() {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:flex-end; justify-content:center; gap:56px; margin:10px auto 0;';
  [[magicSquareEl(false), 'c2_ap_lbl_magic'], [null, 'c2_ap_lbl_flower']].forEach(([big, key]) => {
    const col = document.createElement('div');
    col.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:8px;';
    let sq = big;
    if (!sq) {
      sq = document.createElement('div');
      sq.style.cssText = `position:relative; width:${SQC}px; height:${SQC}px; box-sizing:border-box;` +
        'background:#fffef5; border:2px solid #3a3a3a; border-radius:2px; flex:none;';
    }
    sq.appendChild(seedDot(big ? 44 : 22));
    const cap = document.createElement('div');
    cap.textContent = t(key);
    cap.style.cssText = 'font-family:Georgia,serif; font-size:14px; color:#8b7355; max-width:200px; text-align:center;';
    col.appendChild(sq); col.appendChild(cap);
    row.appendChild(col);
  });
  gameArea.appendChild(row);
  return row;
}

// ---------------------------------------------------------------------------
// The magnifying glass.
//
// Without this, the chapter asks the child to accept that a 9px sliver on the field and
// a 92px bar two screens later are the same thing. That's a leap of faith, not an
// observation. So: the field at its real size with all 7 lengths down, a lens ring
// around the seventh, a cone, and the same length again — same colours, same split —
// but ten times bigger. The magnification is something the child SEES happening.
//
// Static illustration, so it's one SVG: positioning a ring, a cone and a lens against a
// field built from divs would be far more fragile than drawing the lot in one coordinate
// system.
// ---------------------------------------------------------------------------
const INK = '#8b5e3c', GREEN = '#5a8f3d', RED = '#c0392b';

// A horizontal length with end ticks, in SVG user units. `w` scales the stroke so the
// magnified copy looks like the same object seen closer, not a different, fatter object.
function svgLen(x, y, len, col, w) {
  const t = (w || 7) * 0.36, h = (w || 7) * 1.0;
  return `<line x1="${x}" y1="${y}" x2="${x + len}" y2="${y}" stroke="${col}" stroke-width="${w || 7}" stroke-linecap="butt"/>` +
         `<line x1="${x}" y1="${y - h}" x2="${x}" y2="${y + h}" stroke="${col}" stroke-width="${t}"/>` +
         `<line x1="${x + len}" y1="${y - h}" x2="${x + len}" y2="${y + h}" stroke="${col}" stroke-width="${t}"/>`;
}

function magnifierSVG() {
  const W = FIELD.L * PX, H = FIELD.l * PX;
  const ox = 18, oy = 8, by = oy + H;             // field origin, and its bottom edge
  const onField = (FIELD.L - 6) * PX;             // 9.2 — the scrap of the 7th that was on the field
  const cx = ox + 6.5 * PX, r = 31;               // lens ring, centred on the 7th length
  const lx = 310, ly = 322, rx = 248, ry = 60;    // the big lens
  const mag = 10 * PX, mx = lx - mag / 2;         // the same length, 10x
  const magGreen = onField * 10;

  let s = `<rect x="${ox}" y="${oy}" width="${W}" height="${H}" fill="#fafaf5" stroke="${INK}" stroke-width="3"/>`;
  for (let i = 0; i < 6; i++) s += svgLen(ox + i * PX, by, PX, GREEN);
  s += svgLen(ox + 6 * PX, by, onField, GREEN) +
       svgLen(ox + 6 * PX + onField, by, PX - onField, RED);

  // cone from the ring down to the lens — drawn first so both rings sit on top of it
  s += `<path d="M ${cx - r + 4},${by + 24} L ${lx - rx + 12},${ly - ry - 4} L ${lx + rx - 12},${ly - ry - 4} L ${cx + r - 4},${by + 24} Z" ` +
       `fill="rgba(180,160,110,0.16)" stroke="${INK}" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>`;
  s += `<circle cx="${cx}" cy="${by}" r="${r}" fill="none" stroke="${INK}" stroke-width="3"/>`;
  s += `<ellipse cx="${lx}" cy="${ly}" rx="${rx}" ry="${ry}" fill="#fdfbf3" stroke="${INK}" stroke-width="4"/>`;
  s += svgLen(mx, ly, magGreen, GREEN, 11) + svgLen(mx + magGreen, ly, mag - magGreen, RED, 11);

  return `<svg width="620" height="400" viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

// ---------------------------------------------------------------------------
// Every candidate for "the smaller magic length", laid out so the choice can be
// REASONED rather than announced. The foot and the thumb are there to be REJECTED:
// whatever number you line up, they never land exactly on one magic length, and the
// leftover is drawn so you can see that. Everything from halves to tenths lands exactly —
// so the real question becomes "which size is useful?", which is the actual idea.
// ---------------------------------------------------------------------------
function optionsSVG() {
  const BARX = 150, BARW = 10 * PX;               // same 460px as the magnified length
  const rows = [
    { key: 'c2_opt_foot',  piece: 0.300 * BARW },  // never lands exactly
    { key: 'c2_opt_thumb', piece: 0.085 * BARW },  // never lands exactly
  ];
  for (let n = 2; n <= 10; n++) rows.push({ key: 'c2_opt_' + n, n: n, piece: BARW / n });

  const rowH = 27, top = 74;
  let s = '';

  // the length we're trying to subdivide, at the magnified size the lens just established
  s += svgLen(BARX, 30, (FIELD.L - 6) * PX * 10, GREEN, 11);
  s += svgLen(BARX + (FIELD.L - 6) * PX * 10, 30, BARW - (FIELD.L - 6) * PX * 10, RED, 11);

  rows.forEach((row, i) => {
    const y = top + i * rowH;
    const exact = !!row.n;
    const col = row.n === 10 ? GREEN : '#8b7355';
    const fits = exact ? row.n : Math.floor(BARW / row.piece);
    const covered = exact ? BARW : fits * row.piece;

    if (row.n === 10) {
      s += `<rect x="${BARX - 8}" y="${y - 13}" width="${BARW + 16}" height="24" rx="5" fill="rgba(90,143,61,0.10)"/>`;
    }
    s += `<text x="${BARX - 16}" y="${y + 4}" text-anchor="end" font-family="Georgia,serif" ` +
         `font-size="13" fill="${row.n === 10 ? GREEN : '#6b5e4a'}"${row.n === 10 ? ' font-weight="bold"' : ''}>` +
         `${t(row.key)}</text>`;
    s += `<line x1="${BARX}" y1="${y}" x2="${BARX + covered}" y2="${y}" stroke="${col}" stroke-width="6" stroke-linecap="butt"/>`;
    for (let k = 0; k <= fits; k++) {
      const x = BARX + k * (exact ? row.piece : row.piece);
      s += `<line x1="${x}" y1="${y - 6}" x2="${x}" y2="${y + 6}" stroke="${col}" stroke-width="2"/>`;
    }
    if (!exact) {
      // the bit that never gets covered — the reason a foot and a thumb are useless here
      s += `<line x1="${BARX + covered}" y1="${y}" x2="${BARX + BARW}" y2="${y}" stroke="${RED}" ` +
           `stroke-width="6" stroke-linecap="butt" stroke-dasharray="4 3"/>`;
      s += `<text x="${BARX + BARW + 10}" y="${y + 5}" font-family="Georgia,serif" font-size="15" fill="${RED}">✗</text>`;
    }
  });

  const h = top + rows.length * rowH + 10;
  return `<svg width="640" height="${h}" viewBox="0 0 640 ${h}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

// ===========================================================================
// PART B — the field cut into four rectangles.
//
// The leftover ground from A′ is an L. The child knows how to measure a rectangle's area (one
// side TIMES the other, Chapter 1) and not a bend's — so the cut is not a
// trick, it is the only move available. Carry on the two lines where the whole magic
// squares stop, and the L falls apart into three rectangles it can already handle.
//
// Four colours, because Part E reads (a+b)(c+d) = ac + bc + ad + bd straight off this
// picture, and Ch3/Ch4 square and complete the same one (CHAPTER2_PLAN.md §1). Colour is
// the REDUNDANT cue though — every region is named by its position ("the band along the
// top", "the strip down the side", "the little corner"), so nothing depends on telling
// green from amber.
// ===========================================================================
const TPX = PX / 10;                    // 4.6px — one tenth, at the field's own scale
const ZPX = 7;                          // one tenth inside the lens (~1.5x the field's own scale)
// The field in TENTHS (62 x 37 for the chapter's own 6.2 x 3.7), and where the whole magic
// squares stop. Both filled by setField() — see the note on CHAPTER_FIELD.
const FT = { w: 0, h: 0 };
const CUT = { x: 0, y: 0 };

// The big region keeps Chapter 1's filled-cell green, so it reads as "the part you already
// covered" as well as one of the four colours. x/y/w/h come from setField():
//   whole  = the magic squares that fit          top    = the band above them
//   side   = the strip down the right-hand side  corner = where the two leftovers meet
// ⚠️ Part F's third field has a WHOLE side, so `side` and `corner` are 0 tenths wide there.
// Every consumer of REGIONS has to skip a region with no area — see `hasArea`.
const REGIONS = [
  { key: 'whole',  fill: '#d4edda' },
  { key: 'top',    fill: '#f6e7a8' },
  { key: 'side',   fill: '#bcd8ea' },
  { key: 'corner', fill: '#efb9b0' },
];
const REGION = {};
REGIONS.forEach(r => { REGION[r.key] = r; });

// A region with a zero side is not a rectangle, it is a line — it must not be drawn, counted,
// labelled, bracketed or clicked. One predicate, so no consumer forgets.
const hasArea = r => r.w > 0 && r.h > 0;
const liveRegions = () => REGIONS.filter(hasArea);

// A span bracket with end ticks, sitting outside the field. Ch1 labels sides this way, and
// it is how the deck itself annotates the picture.
function bracket(wrap, cfg) {
  const { horiz, from, to, at, label, tiny } = cfg;
  const a = from * TPX, b = to * TPX;
  const line = document.createElement('div');
  line.style.cssText = 'position:absolute; background:#8b7355;' + (horiz
    ? `left:${a}px; top:${at}px; width:${b - a}px; height:1px;`
    : `left:${at}px; top:${a}px; width:1px; height:${b - a}px;`);
  wrap.appendChild(line);
  [a, b].forEach(p => {
    const tick = document.createElement('div');
    tick.style.cssText = 'position:absolute; background:#8b7355;' + (horiz
      ? `left:${p}px; top:${at - 4}px; width:1px; height:9px;`
      : `left:${at - 4}px; top:${p}px; width:9px; height:1px;`);
    wrap.appendChild(tick);
  });
  const cap = document.createElement('div');
  cap.innerHTML = label;
  cap.style.cssText = 'position:absolute; font-family:Georgia,serif; font-size:13px; color:#6b5e4a;' +
    'white-space:nowrap;' + (horiz
      // A 2-tenth span is 9px wide, far narrower than its own label, so the tiny ones hang
      // one row lower — otherwise "2 tenths" would sit on top of "6 magic lengths".
      ? `left:${(a + b) / 2}px; top:${at + (tiny ? 20 : 7)}px; transform:translateX(-50%);`
      : `left:${at - 10}px; top:${(a + b) / 2}px; transform:translate(-100%,-50%); text-align:right;`);
  wrap.appendChild(cap);
}

// The field, cut. `show` selects which regions are coloured (all of them by default), so the
// same view serves the reveal, each region's own screen (with the others greyed back), and
// the final tally.
// Module-level so Part D can position its lens against the field this draws — the ring has
// to land on a specific 46 x 9 patch of it, which needs the left pad exactly.
const FVPAD = { l: 112, b: 62, r: 66 };
// Seed-dot radius on the field. ONE constant for both kinds: the magic squares get theirs
// from a background gradient and the carved plots from a div, and drawn from two different
// numbers they came out visibly different sizes — which says the plots' trees are smaller
// trees, when the whole point of Marimon's rule is that they are exactly the same tree.
const FVSEED = 2.4;

function splitFieldView(opts) {
  const o = opts || {};
  const W = FT.w * TPX, H = FT.h * TPX;
  // padL/padR are widened only by Part E (see EPADL/EPADR), whose chips read "0.2 x 3"
  // rather than "60" and whose edge brackets carry whole sentences. Part D's lens places its
  // ring against FVPAD.l directly, and never passes padL — so it is unaffected.
  // padB only makes the wrapper taller — the field itself sits at top:0 either way — so a
  // screen that needs a second row of brackets can ask for the room without moving anything.
  const PADL = o.padL || FVPAD.l, PADB = o.padB || FVPAD.b, PADR = o.padR || FVPAD.r;
  const wrap = document.createElement('div');
  wrap.style.cssText = `position:relative; width:${W + PADL + PADR}px; height:${H + PADB}px; margin:10px auto 0;`;

  const inner = document.createElement('div');
  inner.style.cssText = `position:absolute; left:${PADL}px; top:0; width:${W}px; height:${H}px;`;
  wrap.appendChild(inner);

  liveRegions().forEach(r => {
    const lit = !o.show || o.show.indexOf(r.key) >= 0;
    // `focus` fades everything that is not being asked about, the way Part D's example patch
    // does — the picture follows the question. The count that a faded region has already
    // earned fades with it, chip and leader line included, so it reads as "answered, and not
    // what we are on now" rather than disappearing.
    const dim = (o.focus && r.key !== o.focus) ? 0.3 : 1;
    const d = document.createElement('div');
    d.style.cssText =
      `position:absolute; left:${r.x * TPX}px; top:${(FT.h - r.y - r.h) * TPX}px;` +
      `width:${r.w * TPX}px; height:${r.h * TPX}px;` +
      `background:${lit ? r.fill : '#f1ede2'};` +
      `outline:1px solid rgba(90,80,60,${lit ? 0.5 : 0.25}); outline-offset:-1px;` +
      'display:flex; align-items:center; justify-content:center;' +
      'font-family:Georgia,serif; font-size:14px; color:#4a4030;';
    // The big region carries its magic-square rules, so "18" is something the child can
    // count off the picture rather than a number sitting on a flat colour.
    if (r.key === 'whole' && lit) {
      const rules =
        'repeating-linear-gradient(to right, rgba(90,120,85,0.45) 0 1px, transparent 1px ' + PX + 'px),' +
        'repeating-linear-gradient(to bottom, rgba(90,120,85,0.45) 0 1px, transparent 1px ' + PX + 'px)';
      // `seeds` puts one seed in each magic square, the way tenthGrid does for hundredths:
      // a radial tile exactly one square across lands its dot in the middle for free.
      // Declared first, so the dots paint over the rules.
      if (o.seeds) {
        d.style.backgroundImage = `radial-gradient(circle, #555 0 ${FVSEED}px, ` +
          `transparent ${FVSEED + 0.6}px),` + rules;
        d.style.backgroundSize = PX + 'px ' + PX + 'px, auto, auto';
      } else d.style.backgroundImage = rules;
    }
    if (dim !== 1) d.style.opacity = dim;
    // A region the child has already matched to its term keeps a saturated outline in its
    // own ink. It cannot carry a caption instead: the side strip and the corner are 9px
    // wide, which is why every count they ever show sits in a chip out to the right.
    if (o.solved && o.solved.indexOf(r.key) >= 0) {
      d.style.outline = `3px solid ${REGINK[r.key]}`;
      d.style.outlineOffset = '-2px';
    }
    // ...and on the final tally the three leftover regions carry theirs, so the 494 sits on
    // top of 494 visible flower squares rather than on three flat colours. A tenth is 4.6px
    // here, which is small but real — and that smallness is the honest fact about them.
    if (o.materialize && r.key !== 'whole' && lit) d.style.backgroundImage =
      'repeating-linear-gradient(to right, rgba(90,80,60,0.35) 0 1px, transparent 1px ' + TPX + 'px),' +
      'repeating-linear-gradient(to bottom, rgba(90,80,60,0.35) 0 1px, transparent 1px ' + TPX + 'px)';
    inner.appendChild(d);

    if (!(o.counts && o.counts[r.key] && lit)) return;
    // A 2-tenth region is 9px wide — its count cannot live inside it. Anything too narrow
    // gets a chip out to the right with a leader line back to its own strip.
    if (r.w * TPX >= 60) {
      // On a seeded ground the count needs its own chip, or a seed dot lands in the middle
      // of the word. Part B never seeds this region, so its screens are unchanged.
      if (!o.seeds) { d.textContent = o.counts[r.key]; return; }
      const sp = document.createElement('span');
      sp.textContent = o.counts[r.key];
      sp.style.cssText = 'background:rgba(255,255,255,0.88); padding:1px 8px; border-radius:5px;';
      d.appendChild(sp);
      return;
    }
    const cy = (FT.h - r.y - r.h / 2) * TPX;
    const lead = document.createElement('div');
    lead.style.cssText = `position:absolute; left:${PADL + (r.x + r.w) * TPX}px; top:${cy}px;` +
      `width:${W - (r.x + r.w) * TPX + 12}px; height:1px; background:rgba(90,80,60,0.55);` +
      `opacity:${dim};`;
    wrap.appendChild(lead);
    const chip = document.createElement('div');
    chip.textContent = o.counts[r.key];
    chip.style.cssText = `position:absolute; left:${PADL + W + 14}px; top:${cy}px;` +
      'transform:translateY(-50%); font-family:Georgia,serif; font-size:14px; color:#4a4030;' +
      `background:${r.fill}; border:1px solid rgba(90,80,60,0.5); border-radius:6px; padding:2px 8px;` +
      `opacity:${dim};`;
    wrap.appendChild(chip);
  });

  // Part D's tree plots, painted over the band they were carved out of. Additive: without
  // `plots` this is the Part B picture, unchanged. Each run is one 10-wide chunk of the
  // band, so a plot lands as two or three abutting blocks in one colour — the staircase the
  // child watched it take under the lens, at the field's own scale.
  if (o.plots) for (let p = 0; p < o.plots; p++) {
    const runs = plotRuns(p);
    runs.forEach(rn => {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute; left:${rn.c * 10 * TPX}px;` +
        `top:${(REGION.top.h - rn.r1) * TPX}px; width:${10 * TPX}px;` +
        `height:${(rn.r1 - rn.r0) * TPX}px; background:${DPLOTCOL[p]};`;
      inner.appendChild(d);
    });
    // One seed per plot, centred on its tallest run — the four that turn 18 into 22. Only
    // when asked for: on the screen that ASKS how many tree seeds, the ground stays bare.
    //
    // Drawn as a disc of the SAME radius as the magic squares' gradient dots rather than
    // with seedDot(), whose '·' glyph renders far smaller than its font-size suggests. A
    // tree is a tree wherever it is planted, and the picture has to say so.
    if (!o.seeds) continue;
    const big = runs.reduce((a, b) => (b.r1 - b.r0 > a.r1 - a.r0 ? b : a));
    const cx = (big.c * 10 + 5) * TPX;
    const cy = (REGION.top.h - (big.r0 + big.r1) / 2) * TPX;
    const dot = document.createElement('div');
    dot.style.cssText = `position:absolute; left:${cx - FVSEED}px; top:${cy - FVSEED}px;` +
      `width:${2 * FVSEED}px; height:${2 * FVSEED}px; background:#555; border-radius:50%;`;
    inner.appendChild(dot);
  }

  // Part F's patches. Part D's `plots` walks its own band in 10-wide chunks; F's leftover is
  // whatever the field gives — for the first field the third patch runs out of the band, round
  // the corner and part-way down the side strip. So F hands over ready-made runs in tenth
  // coordinates (see fPatchRuns) and this just paints them.
  //
  // Translucent, so the hundredth rules keep showing through — a patch the child cannot see
  // into is a coloured blob. And no border per run: that would draw lines THROUGH a patch, and
  // the one thing these pictures have to say is that each patch is ONE piece (lesson 21). The
  // colour boundary is the outline.
  if (o.patches) o.patches.forEach((runs, p) => {
    const col = FPATCHCOL[p % FPATCHCOL.length];
    runs.forEach(rn => {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute; left:${rn.x * TPX}px;` +
        `top:${(FT.h - rn.y - 1) * TPX}px; width:${rn.w * TPX}px; height:${TPX}px;` +
        `background:${col}; opacity:0.72;`;
      inner.appendChild(d);
    });
    const big = runs.reduce((a, b) => (b.w > a.w ? b : a));
    // A seed in each patch, when the screen is asking for seeds — Part D's move, and it is
    // load-bearing: the whole magic squares carry 8 dots and the answer is 11, so without
    // these the picture would contradict its own caption (lesson 22). Same radius as the
    // magic squares' gradient dots, because a tree is a tree wherever it is planted.
    if (o.seeds) {
      const dot = document.createElement('div');
      dot.style.cssText =
        `position:absolute; left:${(big.x + big.w / 2) * TPX - FVSEED}px;` +
        `top:${(FT.h - big.y - 0.5) * TPX - FVSEED}px;` +
        `width:${2 * FVSEED}px; height:${2 * FVSEED}px; background:#555; border-radius:50%;`;
      inner.appendChild(dot);
      return;
    }
    // ...and otherwise "100" on the widest run, the only one with room for it. It is what says
    // these are magic squares' worth of ground rather than three coloured areas.
    // (Never a square, by construction: a patch would have to be 10 tenths tall, and the band's
    // height is the tenths digit of the side, which is at most 9. The prose says so.)
    if (big.w * TPX < 26) return;
    const lab = document.createElement('div');
    lab.textContent = DPLOT;
    lab.style.cssText = `position:absolute; left:${big.x * TPX}px;` +
      `top:${(FT.h - big.y - 1) * TPX - 4}px; width:${big.w * TPX}px; text-align:center;` +
      'font-family:Georgia,serif; font-size:11px; font-weight:bold; color:#3a3a3a;' +
      'line-height:1; pointer-events:none;';
    inner.appendChild(lab);
  });

  // The flower seeds: one in every hundredth that did NOT end up inside a patch. Passed in as
  // runs rather than worked out here, because only Part F knows which ground is left over.
  //
  // A radial tile exactly one cell across lands its dot at each cell's centre for free, since
  // the tiling starts at the run's left edge and that is a cell boundary — the same trick
  // tenthGrid uses, and the same radius, so these read as the flower seeds Part B already drew.
  // They are tiny: a hundredth is 4.6px here. That is honest, and it is the chapter's own point
  // about hundredths — the smallness is why they could measure what magic lengths could not.
  if (o.flowers) {
    const r = Math.max(0.9, TPX * 0.13);
    o.flowers.forEach(rn => {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute; left:${rn.x * TPX}px;` +
        `top:${(FT.h - rn.y - 1) * TPX}px; width:${rn.w * TPX}px; height:${TPX}px;` +
        `background-image:radial-gradient(circle, #555 0 ${r}px, transparent ${r + 0.6}px);` +
        `background-size:${TPX}px ${TPX}px;`;
      inner.appendChild(d);
    });
  }

  // Clickable regions, for Part E's "which rectangle is b × d?". The hit zones are their own
  // transparent overlays rather than listeners on the region divs, because two of the four
  // regions are **9px wide** — a mark, not a target. Each one is widened OUTWARD to at least
  // PICKMIN, into the right-hand margin where nothing else lives, so the four never overlap
  // and none of them is a precision task. Part A and Part D both settled this already: the
  // child is discovering a property of the field, and fumbling a target is not the
  // difficulty we want them to have.
  if (o.onPick) liveRegions().forEach(r => {
    let x0 = r.x * TPX, x1 = (r.x + r.w) * TPX;
    if (x1 - x0 < PICKMIN && r.x + r.w === FT.w) x1 = x0 + PICKMIN;   // grow right, off-field
    const y0 = (FT.h - r.y - r.h) * TPX, y1 = (FT.h - r.y) * TPX;
    const z = document.createElement('div');
    z.className = 'pick-zone';
    z.dataset.region = r.key;
    z.style.cssText = `position:absolute; left:${PADL + x0}px; top:${y0}px;` +
      `width:${x1 - x0}px; height:${y1 - y0}px; cursor:pointer; z-index:4;`;
    z.addEventListener('click', () => o.onPick(r.key));
    wrap.appendChild(z);
  });

  // The field's own outline goes on TOP of the regions, so the boundary the child measured
  // in Part A stays the outermost thing on screen.
  const edge = document.createElement('div');
  edge.style.cssText = `position:absolute; left:${PADL - 3}px; top:-3px; box-sizing:border-box;` +
    `width:${W + 6}px; height:${H + 6}px; border:3px solid #8b5e3c; border-radius:3px; pointer-events:none;`;
  wrap.appendChild(edge);

  // `brackets: true` labels the four spans in words ("6 magic lengths"), which is how Part B
  // met them. Part E hands an object instead to relabel the same four spans as NUMBERS
  // (6, 0.2, 3, 0.7) — the same edges, said in the notation the chapter has since built.
  if (o.brackets) {
    const bl = (typeof o.brackets === 'object') ? o.brackets : {};
    const lab = document.createElement('div');
    lab.style.cssText = `position:absolute; left:${PADL}px; top:0; width:${W}px; height:${H}px;`;
    wrap.appendChild(lab);
    // A side with nothing to cut (Part F's third field) gets ONE bracket spanning it whole,
    // not a full-width one plus a zero-width one labelled "0 tenths". The picture has to say
    // what the equation says, and there `b` is simply not a piece of ground.
    bracket(lab, { horiz: true, from: 0, to: CUT.x, at: H + 14, label: bl.a || t('c2_b_lbl_6ml') });
    if (CUT.x < FT.w)
      bracket(lab, { horiz: true, from: CUT.x, to: FT.w, at: H + 14, label: bl.b || t('c2_b_lbl_2t'), tiny: true });
    bracket(lab, { horiz: false, from: FT.h - CUT.y, to: FT.h, at: -14, label: bl.c || t('c2_b_lbl_3ml') });
    if (CUT.y < FT.h)
      bracket(lab, { horiz: false, from: 0, to: FT.h - CUT.y, at: -14, label: bl.d || t('c2_b_lbl_7t') });
    // A second, outer pair spanning each side WHOLE — Part E's `L × l = (a+b) × (c+d)`.
    // Without them the child would have to take on trust that L is the two bottom pieces
    // put back together, which is exactly the claim the equation is making.
    if (bl.L) bracket(lab, { horiz: true,  from: 0, to: FT.w, at: H + 52, label: bl.L });
    if (bl.l) bracket(lab, { horiz: false, from: 0, to: FT.h, at: -46,    label: bl.l });
  }
  gameArea.appendChild(wrap);
  return wrap;
}

// ---------------------------------------------------------------------------
// A region under the magnifying glass — the chapter's ONE zoom device (Sylvain, Part A2).
//
// Each rectangle could have been drawn on its own, detached, and it would have been far
// less code. But a detached diagram asks the child to accept that the 9px sliver on the
// field and the ruled band on the next screen are the same piece of ground. Part A settled
// that question already: the field stays on screen, a ring goes round the piece being
// looked at, and a cone carries it into the lens. So Part B uses the same apparatus, and
// the child never leaves the one field they have been measuring since the first screen.
//
// The rules that came out of A2 and still apply:
//   - the lens sits directly over (or beside) the RING, never over the middle of the field;
//   - the region keeps its real orientation — the top band stays horizontal above the
//     field, the side strip stays vertical beside it. Laying the vertical one flat would be
//     easier to lay out and would quietly break the correspondence with the edge it came
//     from;
//   - a lens is an ELLIPSE and its content must fit inside it, which is a real constraint:
//     the 60-tenth band is 540px wide magnified, so its lens is 630px across.
//
// One SVG, for the same reason `magnifierSVG` is: positioning a ring, a cone and a lens
// against div-built rectangles would be far more fragile than drawing the lot in one
// coordinate system.
// ---------------------------------------------------------------------------
// rx/ry of the lens and where the field sits, per region. Two constraints fight here and
// both are real: the magnified rectangle's CORNERS must clear the ellipse
// ((w/2/rx)^2 + (h/2/ry)^2 < 1), and the dimension labels sit OUTSIDE the lens — so a lens
// that fills the canvas leaves its own labels nowhere to go. That is what fixes ZPX at 7:
// at 9 the top band's lens was 630px wide and clipped "7 tenths" off the left edge.
// Each lens carries its OWN magnification. That is not an inconsistency: the field sits
// right below every one of them at true scale, so the relative sizes are already told
// honestly there — the corner really is a speck next to the band, and the ring says so.
// The lens's job is the other one, making the thing countable. At the band's zoom the
// corner would be 14px across and its 14 flower squares unreadable, which would be a
// magnifying glass that fails at magnifying.
const LENS = {
  top:    { zoom: 7,  rx: 240, ry: 62,  fieldX: 214, fieldY: 185, lensX: 352, lensY: 72,  w: 620, h: 382 },
  side:   { zoom: 10, rx: 76,  ry: 170, fieldX: 12,  fieldY: 74,  lensX: 426, lensY: 175, w: 730, h: 370 },
  // the only lens whose caption goes ABOVE it — below, it would land on its own cone,
  // which is narrow here because the thing being magnified is narrow.
  corner: { zoom: 16, rx: 52, ry: 76,   fieldX: 12,  fieldY: 220, lensX: 293, lensY: 100, w: 360, h: 415, capAbove: true },
};

function svgGrid(x, y, wT, hT, px) {
  let s = '';
  const rule = (x1, y1, x2, y2, on) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? 'rgba(58,58,58,0.85)' : '#c9c2ae'}" ` +
    `stroke-width="${on ? 1.8 : 0.7}"/>`;
  for (let i = 0; i <= wT; i++) s += rule(x + i * px, y, x + i * px, y + hT * px, i % 10 === 0);
  for (let j = 0; j <= hT; j++) s += rule(x, y + j * px, x + wT * px, y + j * px, j % 10 === 0);
  return s;
}

// The field itself, small and honest, with the region under the lens at full strength and
// the other three faded — so it is always clear WHICH piece is being magnified.
function svgFieldWithRegions(ox, oy, focusKey) {
  let s = `<rect x="${ox}" y="${oy}" width="${FT.w * TPX}" height="${FT.h * TPX}" fill="#fafaf5"/>`;
  liveRegions().forEach(r => {
    const on = r.key === focusKey;
    s += `<rect x="${ox + r.x * TPX}" y="${oy + (FT.h - r.y - r.h) * TPX}" ` +
         `width="${r.w * TPX}" height="${r.h * TPX}" fill="${r.fill}" opacity="${on ? 1 : 0.35}" ` +
         `stroke="rgba(90,80,60,0.45)" stroke-width="0.6"/>`;
  });
  s += `<rect x="${ox}" y="${oy}" width="${FT.w * TPX}" height="${FT.h * TPX}" fill="none" ` +
       `stroke="${INK}" stroke-width="3"/>`;
  return s;
}

function regionLens(key, cfg) {
  const c = cfg || {}, r = REGION[key], L = LENS[key];
  const Z = L.zoom;
  const mw = r.w * Z, mh = r.h * Z;                          // the region, magnified
  const ox = L.fieldX, oy = L.fieldY;

  // the ring, drawn round the region where it actually sits on the field
  const rcx = ox + (r.x + r.w / 2) * TPX, rcy = oy + (FT.h - r.y - r.h / 2) * TPX;
  const rrx = r.w * TPX / 2 + 13, rry = r.h * TPX / 2 + 13;

  let s = svgFieldWithRegions(ox, oy, key);

  // cone from the ring to the lens, drawn first so both outlines sit on top of it
  const vertical = key === 'side';
  const cone = vertical
    ? `M ${rcx + rrx - 3},${rcy - rry + 3} L ${L.lensX - L.rx + 6},${L.lensY - L.ry + 10} ` +
      `L ${L.lensX - L.rx + 6},${L.lensY + L.ry - 10} L ${rcx + rrx - 3},${rcy + rry - 3} Z`
    : `M ${rcx - rrx + 3},${rcy - rry + 3} L ${L.lensX - L.rx + 10},${L.lensY + L.ry - 6} ` +
      `L ${L.lensX + L.rx - 10},${L.lensY + L.ry - 6} L ${rcx + rrx - 3},${rcy - rry + 3} Z`;
  s += `<path d="${cone}" fill="rgba(180,160,110,0.16)" stroke="${INK}" stroke-width="1.5" ` +
       `stroke-dasharray="5 4" opacity="0.75"/>`;
  s += `<ellipse cx="${rcx}" cy="${rcy}" rx="${rrx}" ry="${rry}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;

  // the lens, and the region magnified inside it
  const clip = 'lens-' + key;
  const mx = L.lensX - mw / 2, my = L.lensY - mh / 2;
  s += `<defs><clipPath id="${clip}"><ellipse cx="${L.lensX}" cy="${L.lensY}" rx="${L.rx}" ry="${L.ry}"/></clipPath></defs>`;
  s += `<ellipse cx="${L.lensX}" cy="${L.lensY}" rx="${L.rx}" ry="${L.ry}" fill="#fdfbf3"/>`;
  // `split` shows the rectangle as n copies of one little rectangle. The heavy magic-square
  // rules already fall exactly on the joins, so all this adds is a tint on alternate copies
  // and a heavier join — enough to read "the same thing, n times" at a glance.
  let tint = '';
  if (c.split) {
    const alongX = r.w > r.h, n = Math.round((alongX ? r.w : r.h) / 10);
    for (let k = 0; k < n; k++) {
      if (k % 2 === 0) continue;
      tint += alongX
        ? `<rect x="${mx + k * 10 * Z}" y="${my}" width="${10 * Z}" height="${mh}" fill="rgba(90,80,60,0.13)"/>`
        : `<rect x="${mx}" y="${my + k * 10 * Z}" width="${mw}" height="${10 * Z}" fill="rgba(90,80,60,0.13)"/>`;
    }
    for (let k = 1; k < n; k++) {
      tint += alongX
        ? `<line x1="${mx + k * 10 * Z}" y1="${my}" x2="${mx + k * 10 * Z}" y2="${my + mh}" stroke="#3a3a3a" stroke-width="3"/>`
        : `<line x1="${mx}" y1="${my + k * 10 * Z}" x2="${mx + mw}" y2="${my + k * 10 * Z}" stroke="#3a3a3a" stroke-width="3"/>`;
    }
  }
  s += `<g clip-path="url(#${clip})">` +
       `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="${r.fill}"/>` +
       svgGrid(mx, my, r.w, r.h, Z) + tint +
       `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="none" stroke="#6b5e4a" stroke-width="2"/>` +
       `</g>`;
  s += `<ellipse cx="${L.lensX}" cy="${L.lensY}" rx="${L.rx}" ry="${L.ry}" fill="none" stroke="${INK}" stroke-width="4"/>`;

  // dimension labels, outside the lens so they never sit on the flower squares
  const txt = (x, y, str, anchor) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="Georgia,serif" font-size="14" fill="#6b5e4a">${str}</text>`;
  if (c.bottom) s += txt(L.lensX, L.lensY + (L.capAbove ? -L.ry - 12 : L.ry + 20), c.bottom, 'middle');
  if (c.side) s += txt(
    vertical ? L.lensX + L.rx + 12 : L.lensX - L.rx - 12,
    L.lensY + 5, c.side, vertical ? 'start' : 'end');

  const W = L.w, H = L.h;
  const d = document.createElement('div');
  d.style.cssText = 'margin:6px auto 0; width:max-content;';
  d.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
  gameArea.appendChild(d);
  return d;
}

// ---------------------------------------------------------------------------
// Counting one rectangle: the five screens, and the two rectangles they run for.
//
//   n  copies of the little rectangle        a  the side that is not ten, in tenths
//   p = n x a  (the pair that IS on Chapter 1's table)      r = p x 10  the answer
//
// `left`/`bottom` are what the child will measure on the little rectangle, and `rows`/`cols`
// build it — they are not restatements of a/10, because which of the two sides is the
// ten depends on whether the rectangle stands up or lies down.
//
// `w`/`h` are ONE COPY's sides, for the "it is n TIMES this little rectangle" sentence.
// `capW`/`capH` are the WHOLE rectangle's sides, for the lens captions — the lens holds the
// entire band, so labelling its foot "one whole magic length" was simply describing the
// wrong object.
// ---------------------------------------------------------------------------
const PIECES = {
  top:  { key: 'top',  n: 6, a: 7, left: 7,  bottom: 10, rows: 7,  cols: 10,
          what: 'c2_b_what_top',  w: 'c2_b_dim_1ml', h: 'c2_b_dim_7t',
          capW: 'c2_b_dim_6ml',   capH: 'c2_b_dim_7t' },
  side: { key: 'side', n: 3, a: 2, left: 10, bottom: 2,  rows: 10, cols: 2,
          what: 'c2_b_what_side', w: 'c2_b_dim_2t',  h: 'c2_b_dim_1ml',
          capW: 'c2_b_dim_2t',    capH: 'c2_b_dim_3ml' },
};
const CELL = 26;   // one tenth on the little rectangle the child measures

// Every string on these screens takes the same bag of numbers, so the two runs cannot
// drift apart the way two hand-written copies would.
function pvars(P) {
  return { what: t(P.what), n: P.n, a: P.a, p: P.n * P.a, r: P.n * P.a * 10,
           w: t(P.w), h: t(P.h) };
}

// A question asked FROM a Continue button, keeping the picture but dropping the button.

// The three rectangles, drawn with every one of their flower squares, side by side and
// TO SCALE against each other — Chapter 1's wrap-up idiom (Sylvain): before the numbers get
// added, the quantities are made material. 420 next to 60 next to 14 is a picture the child
// can weigh; three chips reading "420 / 60 / 14" is not.
//
// Not scaled-to-fit per rectangle, which is what Chapter 1's `persistentSides` does — here
// the whole point is the disparity, and normalising each to the same box would delete it.
const MPX = 5;   // px per tenth in the materialized rectangles

function flowerRectEl(key, withSeeds) {
  const r = REGION[key];
  const col = document.createElement('div');
  col.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:6px;';
  col.appendChild(tenthGrid(r.w, r.h, MPX, {
    fill: r.fill, magic: true, seeds: withSeeds, border: '1.5px solid #6b5e4a',
  }));
  const lab = document.createElement('div');
  lab.innerHTML = `<strong style="font-size:15px; color:#3a3a3a">${r.w * r.h}</strong>` +
    `<br>${t('c2_b_lbl_' + key)}`;
  lab.style.cssText = 'font-family:Georgia,serif; font-size:12px; color:#6b5e4a;' +
    'text-align:center; line-height:1.5;';
  col.appendChild(lab);
  return col;
}

function rowOf(children, gap) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:flex-end; justify-content:center;' +
    `gap:${gap || 26}px; flex-wrap:wrap; margin:6px auto 0;`;
  children.forEach(c => row.appendChild(c));
  return row;
}

// Chapter 1's grouping frame, reproduced: a 3px coloured border on a tinted ground, with
// the group's total in bold underneath — the same border/radius/label that
// buildGroupedFieldsDisplay draws, and the same `groupColors`/`groupBgs` from the core, so
// a bracket means here exactly what it meant in Chapter 1's final summations. It wraps our
// materialized rectangles rather than magic-square fields, which is the only difference.
function groupBox(child, totalHTML, ci) {
  const color = groupColors[ci % groupColors.length];
  const box = document.createElement('div');
  box.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:7px;' +
    `border:3px solid ${color}; border-radius:8px; padding:9px;` +
    `background:${groupBgs[ci % groupBgs.length]};`;
  box.appendChild(child);
  const lab = document.createElement('div');
  lab.innerHTML = totalHTML;
  lab.style.cssText = `font-family:Georgia,serif; font-size:16px; font-weight:bold; color:${color};`;
  box.appendChild(lab);
  return box;
}

// The two groups the field comes to: whole magic squares on one side, all the flower
// squares still in their own three rectangles but gathered under ONE bracket — the same
// bracket the sum was built with. Drawn twice, once bare for the area and once seeded for
// the shopping list, which is the only thing that changes between the two screens.
const MSCELL = 30;              // px per magic square in the block
let MSROWS, MSCOLS;             // 3 x 6 = the 18 whole magic squares — setField()

function areaGroups(withSeeds, flowerKey, magicKey) {
  const trees = groupBox(magicSquaresBlock(MSCOLS, MSROWS, MSCELL, withSeeds),
                         t(magicKey || 'c2_b_unit_ms', { n: MSROWS * MSCOLS }), 2);

  // The two groups are the right-hand side of an equation, so a "+" joins them — hung off
  // the magic-square box and centred on the SQUARES themselves, not on the box (whose
  // height includes its caption) and not on the row (whose height is the much taller
  // flower group). Absolutely positioned against the box's padding edge, which is exactly
  // where the grid starts, so it stays put if the caption ever wraps to two lines.
  trees.style.position = 'relative';
  const plus = document.createElement('div');
  plus.textContent = '+';
  plus.style.cssText = 'position:absolute; right:-32px; top:0; display:flex;' +
    `align-items:center; height:${MSROWS * MSCELL}px;` +
    'font-family:Georgia,serif; font-size:30px; color:#8b7355; line-height:1;';
  trees.appendChild(plus);

  // Only the leftovers that exist: Part F's whole-sided field has no side strip and no
  // corner, so it shows one rectangle beside the magic squares rather than three empty divs.
  return rowOf([
    trees,
    groupBox(rowOf(leftoverKeys().map(k => flowerRectEl(k, withSeeds)), 20),
             t(flowerKey || 'c2_b_unit_sq', { n: TA + TB + TC }), 1),
  ], 52);
}

let TA, TB, TC;    // 420 / 60 / 14 hundredths in the three leftovers — setField()

// The leftover regions that actually have ground in them, in reading order.
const leftoverKeys = () =>
  ['top', 'side', 'corner'].filter(k => hasArea(REGION[k]));

// The four stages of the tally. The bracket is drawn round the two things being added and
// carries "?" until the child answers — Chapter 1's "?" -> answer -> reveal flow, which is
// what makes the total feel like something they produced rather than something displayed.
//   0: [top side] = ?      + corner
//   1: [top side] = 480    + corner
//   2: [ [480] corner ] = ?
//   3: [ [480] corner ] = 494
// Three things to add up, each able to draw itself: `make()` returns the picture, `n` is
// what it counts. Part B adds the three leftover rectangles (420 + 60 + 14); Part D adds
// what survives the repackaging (20 + 60 + 14) — the SAME sum, said again over the same
// three pieces of ground, which is exactly why it is worth one implementation rather than
// two that drift.
let TALLY_B;   // the three leftovers as tally items — setField()

function tallyView(stage, items) {
  const it = items || TALLY_B, s12 = it[0].n + it[1].n;
  // The bracket's label always carries the unit — "? flower squares" as much as
  // "480 flower squares". Chapter 1's group labels read "<total> <valueLabel>", and the
  // question mark stands for a quantity of something, not for a bare number.
  const lab = n => t('c2_b_unit_sq', { n: n });
  const g1 = groupBox(rowOf([it[0].make(), it[1].make()], 22),
                      lab(stage === 0 ? '?' : s12), 0);
  if (stage < 2) return rowOf([g1, it[2].make()], 28);
  return rowOf([groupBox(rowOf([g1, it[2].make()], 22),
                         lab(stage === 2 ? '?' : s12 + it[2].n), 1)]);
}

// The running sum, with the original in grey above it — again Chapter 1's shape, so the
// child can see which two numbers just collapsed into one.
function tallySum(stage, items) {
  const it = items || TALLY_B;
  const A = it[0].n, B = it[1].n, D = it[2].n;
  const C = (n, ci) => `<span style="font-weight:bold; color:${groupColors[ci % groupColors.length]}">${n}</span>`;
  const body = [
    C(`${A} + ${B}`, 0) + ` + ${D}`,
    C(A + B, 0) + ` + ${D}`,
    C(`${A + B} + ${D}`, 1),
    C(A + B + D, 1),
  ][stage];
  const d = document.createElement('div');
  d.style.cssText = 'text-align:center; margin:14px 0 4px; font-size:19px; line-height:1.6;';
  d.innerHTML = `<span style="color:#999">${A} + ${B} + ${D} =</span><br>${body}`;
  return d;
}

// ---------------------------------------------------------------------------
// Part C — the wire, and the carry.
//
// Chapter 1's other job: the field is planted, so now it has to be kept from the Gorns, and
// wire is bought by the length. What is new is that a side is wholes AND tenths at once, so
// the child lays both kinds along the same edge and has to choose which one goes next. Part A
// never asked that — there the two units were laid on separate screens, at separate scales.
//
// The carry is NOT motivated by the notation. Fourteen tenths turns up in 2×l and nothing
// remarks on it; we have already let 494 hundredths ride uncarried through the whole of
// Part B without it hurting. What forces the regrouping is the MARKET: wire is wire, it all
// comes off one roll, so asking for it in two piles is nonsense — and the only sensible
// thing left is to fit as much as possible into the bigger unit. (Sylvain, 2026-08-13.)
//
// A tenth is 4.6px at field scale. That is small on purpose: it is the same fine comb
// measuredField() already draws, and the smallness is the honest fact about tenths. What
// keeps it usable is that placement is forgiving — a click anywhere along the side lays the
// next piece, so the child is never asked for precision.
// ---------------------------------------------------------------------------

// Wholes and tenths per side, read off the geometry rather than written down: 6/2 and 3/7.
// MUTATED by setField, never replaced — SIDE below holds references to these two objects.
const Clong  = { w: 0, t: 0 };
const Cshort = { w: 0, t: 0 };
const CKEEP = 10;                         // tenths in one whole magic length
let C2W;      // 18 whole magic lengths
let C2T;      // 18 tenths — deliberately left uncarried until the market
let CCARRY;   // whole magic lengths hiding in C2T: 1 here, 2 on Part F's second field
let CREST;    // 8 — the tenths still loose after the carry
let PERIM;    // 19.8

const SIDE = {
  bottom: { horiz: true,  n: Clong  },
  top:    { horiz: true,  n: Clong  },
  left:   { horiz: false, n: Cshort },
  right:  { horiz: false, n: Cshort },
};

// Headroom, so pieces laid on the top and right edges are not clipped by the stage.
const PAD = 16;

function wireStage() {
  const W = FIELD.L * PX, H = FIELD.l * PX;
  const stage = document.createElement('div');
  stage.style.cssText = `position:relative; width:${W + 2 * PAD}px; height:${H + 2 * PAD}px; margin:14px auto 0;`;
  // border-box for the same reason as fieldStage(): without it the 3px border pushes the
  // visible edge past the geometry the wire is measured against.
  const rect = document.createElement('div');
  rect.style.cssText =
    `position:absolute; left:${PAD}px; top:${PAD}px; box-sizing:border-box; width:${W}px; height:${H}px;` +
    'background:#fafaf5; border:3px solid #8b5e3c; border-radius:3px;';
  stage.appendChild(rect);
  return { stage, rect, W, H };
}

// One laid piece of wire, centred ON the field's boundary line — Chapter 1's look, drawn by
// the same lengthSVG the child has been laying all chapter. Vertical sides run BOTTOM-UP, as
// Chapter 1 and Part A both do.
function wirePiece(stage, side, o, len, W, H, col, op) {
  const horiz = SIDE[side].horiz;
  const pos = horiz
    ? `left:${PAD + o}px; top:${PAD + (side === 'top' ? 0 : H) - HALF}px;`
    : `left:${PAD + (side === 'right' ? W : 0) - HALF}px; top:${PAD + H - o - len}px;`;
  const d = document.createElement('div');
  d.innerHTML = lengthSVG(horiz, len, null, null, col);
  // pointer-events:none is load-bearing, exactly as in Part A: laid pieces are appended
  // after the hit strip and would otherwise cover it and swallow the next click.
  d.style.cssText = 'position:absolute; pointer-events:none; z-index:2;' + pos +
    (op != null && op < 1 ? `opacity:${op};` : '');
  stage.appendChild(d);
  return d;
}

// A whole side, already wired: the wholes first, then the tenths that finish it off.
// `o` dresses it for one moment of the calculation — {col, wholeOp, tenthOp}. Left out, it
// is Chapter 1's plain green at full strength, which is how it is laid and how it stays for
// everything outside the 2×L + 2×l screens.
function drawWire(stage, side, W, H, o) {
  o = o || {};
  const n = SIDE[side].n;
  const cw = o.colW || o.col, ct = o.colT || o.col;   // wholes and tenths can differ — see unitStyles
  for (let i = 0; i < n.w; i++) wirePiece(stage, side, i * PX, PX, W, H, cw, o.wholeOp);
  for (let k = 0; k < n.t; k++) wirePiece(stage, side, n.w * PX + k * TPX, TPX, W, H, ct, o.tenthOp);
}

// ---- the field as the calculation's own picture (Sylvain, 2026-08-13) --------------------
// The two LONG sides are blue and the two SHORT ones red, so `2 × L + 2 × l` stops being two
// lines of arithmetic and becomes two visible pairs on the field the child wired themselves.
// And within a pair, the half not currently in play goes PALE: the child can then SEE that
// the tenths take no part in 2 × 6 and the wholes take none in 2 × 2 — which is the whole
// reason we are allowed to split the side up in the first place.
const CBLUE = '#2a6fb0', CRED = '#c0392b', PALE = 0.22;
// ...and a lighter shade of each, for Part E's perimeter opening, where the two pairs have to
// split again into four: the whole part of a side keeps the pair's deep colour and its TENTHS
// take the light one. Four terms in the sum, four colours, four pieces of ground.
const CBLUE2 = '#6fa8dc', CRED2 = '#df8b7e';
const LONG = ['bottom', 'top'], SHORT = ['left', 'right'];

// focus: 'long' | 'short' | null — the pair being worked on; the other pair goes pale.
// part:  'w' | 't' | null        — the half in play; the other half goes pale.
// Both null = the whole fence at full strength, in its two colours.
function calcStyles(focus, part) {
  const op = p => (part == null || part === p) ? 1 : PALE;
  const mk = (col, live) => ({ col, wholeOp: live ? op('w') : PALE, tenthOp: live ? op('t') : PALE });
  const s = {};
  LONG.forEach(k  => s[k] = mk(CBLUE, focus !== 'short'));
  SHORT.forEach(k => s[k] = mk(CRED,  focus !== 'long'));
  return s;
}

// ---- and then the colours REGROUP, by unit (Sylvain, 2026-08-13) -------------------------
// From the adding-up onward, every whole magic length is ORANGE and every tenth PURPLE,
// whatever side it sits on. The switch happens at exactly the moment the question stops being
// "this side, then that side" and becomes "all the wholes, then all the tenths" — which is the
// grouping the carry then operates on, so the field re-sorts itself into the two piles the
// child is about to be asked to buy. The text from here on uses the same two colours, and in
// the carry the ten purple tenths visibly become one orange magic length.
const CORANGE = '#c2691a', CPURPLE = '#8a2ab0';

function unitStyles(part) {
  const op = p => (part == null || part === p) ? 1 : PALE;
  const s = {};
  LONG.concat(SHORT).forEach(k => s[k] = {
    colW: CORANGE, colT: CPURPLE, wholeOp: op('w'), tenthOp: op('t'),
  });
  return s;
}

// The same two colours, as phrases in the prose. The unit word travels INSIDE the coloured
// span — colouring the bare number would leave "magic lengths" and "tenths" looking alike,
// which is the very thing the colours exist to separate.
// ⚠️ These return HTML, so they may only go into a story panel. Hints are rendered with
// textContent (pap-core.js `fb_hint`) and would print the markup literally.
const oML  = n => `<strong style="color:${CORANGE}">${t('c2_c_u_ml',  { n: n })}</strong>`;
const oML1 = () => `<strong style="color:${CORANGE}">${t('c2_c_ref_lab')}</strong>`;
const oOne = () => `<strong style="color:${CORANGE}">${t('c2_c_u_the1')}</strong>`;
const pT   = n => `<strong style="color:${CPURPLE}">${t('c2_c_u_t',   { n: n })}</strong>`;
const pTML = n => `<strong style="color:${CPURPLE}">${t('c2_c_u_tml', { n: n })}</strong>`;

// The field, then the table, on one screen — so the numbers being looked up never leave the
// sides they came off. (Before, each multiplication cleared the field away.)
function calcStage(focus, part, a, b) {
  clearGame();
  wiredField(calcStyles(focus, part));
  gameArea.appendChild(showFullMultTable(1, 10, { a: a, b: b }, true));
}

// A tray of one kind of piece, drawn in the orientation it will be LAID: vertical for the
// left side, horizontal for the bottom. The grab box around each is padded out to something a
// finger can hit — same principle as the forgiving hit strip, the child's difficulty should
// never be motor.
//
// ⚠️ Tray pieces below TRAYMIN are drawn LONGER than life, and that is a deliberate trade.
// At field scale a tenth is 4.6px long and the wire is 7px thick, so a faithful tenth is
// genuinely wider than it is long and no honest icon of it can read as pointing anywhere.
// Drawn true to size it came out as a horizontal dumbbell in the LEFT side's tray and a
// vertical one in the BOTTOM's — i.e. reading as the wrong axis in both, which actively
