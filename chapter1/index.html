// PROGRESSIVE GROUPING DISPLAY
// ============================================================
// Shows fields with values, allows grouping identical ones with a green bracket
// groups: [{fields: [{rows,cols}], value, count, label}]
// ungrouped: [{rows,cols, value}]
// Returns the container div for updating

// Group border colors — assigned by nesting depth (outermost = highest level = last color)
// Level 0 (innermost, first created) = green, then blue, orange, purple, pink for outer layers
const groupColors = ['#5a8f3d', '#2a6fb0', '#b05a2a', '#8a2ab0', '#b02a6f'];
const groupBgs = ['#f0f8ed', '#edf3fa', '#faf0ed', '#f3edfa', '#faedF3'];

function getMaxGroupDepth(items, level) {
  let max = level || 0;
  (items || []).forEach(item => {
    if (item.type === 'group') {
      const childMax = item.items ? getMaxGroupDepth(item.items, (level||0) + 1) : (level||0);
      if (childMax > max) max = childMax;
    }
  });
  return max;
}

function buildGroupedFieldsDisplay(items, valueLabel, nestLevel, maxDepth) {
  // Recursive: items can be:
  //   {type:'group', items:[...], total, label} — nested group (can contain groups or singles)
  //   {type:'group', fields:[{rows,cols,side}], total, label} — flat group (legacy, fields only)
  //   {type:'single', rows, cols, side, value} — individual field
  const level = nestLevel || 0;
  // Compute max depth on first call so innermost groups get color 0 (green)
  if (maxDepth === undefined) maxDepth = getMaxGroupDepth(items, 0);
  const container = document.createElement('div');
  const isTopLevel = (level === 0);
  container.style.cssText = 'display:flex; flex-wrap:nowrap; gap:' + (isTopLevel ? '12px' : '6px') + '; justify-content:center; align-items:flex-end; margin-bottom:' + (isTopLevel ? '12px' : '2px') + ';';

  items.forEach(item => {
    if (item.type === 'group') {
      // Use explicit colorIdx if provided, otherwise fall back to depth-based
      const ci = (item.ci !== undefined) ? item.ci : (maxDepth - level);
      const color = groupColors[ci % groupColors.length];
      const bg = groupBgs[ci % groupBgs.length];
      const groupWrapper = document.createElement('div');
      groupWrapper.style.cssText = `display:flex; flex-direction:column; align-items:center; gap:4px; border:3px solid ${color}; border-radius:8px; padding:5px; background:${bg};`;

      if (item.items) {
        // Nested group — recurse
        const inner = buildGroupedFieldsDisplay(item.items, valueLabel, level + 1, maxDepth);
        if (item.vertical) inner.style.flexDirection = 'column';
        inner.style.marginBottom = '2px';
        groupWrapper.appendChild(inner);
      } else if (item.fields) {
        // Flat group (legacy) — render fields directly
        const fieldsInGroup = document.createElement('div');
        fieldsInGroup.style.cssText = 'display:flex; gap:4px; align-items:flex-end; flex-wrap:wrap;';
        item.fields.forEach(fd => {
          const wrapper = document.createElement('div');
          wrapper.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:2px;';
          const r = fd.rows || fd.side || 2;
          const c = fd.cols || fd.side || 2;
          const maxDim = Math.max(r, c);
          const cs = Math.min(14, 70 / maxDim);
          const f = showFilledField(r, c, cs);
          f.style.margin = '0';
          wrapper.appendChild(f);
          if (fd.value !== undefined) {
            const vl = document.createElement('div');
            vl.style.cssText = 'font-size:10px; color:#888; text-align:center; max-width:60px; word-wrap:break-word;';
            vl.textContent = `${fd.value} ${valueLabel}`;
            wrapper.appendChild(vl);
          }
          fieldsInGroup.appendChild(wrapper);
        });
        groupWrapper.appendChild(fieldsInGroup);
      }

      const label = document.createElement('div');
      label.style.cssText = `font-size:12px; font-weight:bold; color:${color}; text-align:center;`;
      label.textContent = `${item.total} ${valueLabel}`;
      groupWrapper.appendChild(label);
      container.appendChild(groupWrapper);
    } else if (item.type === 'wire-field') {
      // Field with green perimeter segments (for wire totals)
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:2px;';
      const wr = item.rows || item.side || 2;
      const wc = item.cols || item.side || 2;
      const maxD = Math.max(wr, wc);
      const cs = Math.min(14, 70 / maxD);
      if (item.aboveValue !== undefined) {
        const aboveLabel = document.createElement('div');
        aboveLabel.style.cssText = 'font-size:11px; font-weight:bold; color:#5a8f3d; text-align:center; max-width:60px; word-wrap:break-word;';
        aboveLabel.textContent = `${item.aboveValue} ${valueLabel}`;
        wrapper.appendChild(aboveLabel);
      }
      const f = showFilledFieldWithPerimeter(wr, wc, cs, item.omit || [], item.segColors);
      f.style.margin = '0';
      wrapper.appendChild(f);
      const label = document.createElement('div');
      label.style.cssText = 'font-size:11px; font-weight:bold; color:#5a8f3d; text-align:center; max-width:60px; word-wrap:break-word;';
      label.textContent = `${item.value} ${valueLabel}`;
      wrapper.appendChild(label);
      container.appendChild(wrapper);
    } else if (item.type === 'detached-wire') {
      // Standalone green segments (detached from a field)
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:2px;';
      const cs = Math.min(14, 70 / (item.segSide || 6));
      wrapper.appendChild(showDetachedSegments(item.count, cs, item.horiz));
      const label = document.createElement('div');
      label.style.cssText = 'font-size:11px; font-weight:bold; color:#5a8f3d; text-align:center; max-width:60px; word-wrap:break-word;';
      label.textContent = `${item.value} ${valueLabel}`;
      wrapper.appendChild(label);
      container.appendChild(wrapper);
    } else {
      // Single field with original value
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:2px;';
      const r = item.rows || item.side || 2;
      const c = item.cols || item.side || 2;
      const maxDim = Math.max(r, c);
      const cs = Math.min(14, 70 / maxDim);
      const f = showFilledField(r, c, cs);
      f.style.margin = '0';
      wrapper.appendChild(f);
      const label = document.createElement('div');
      label.style.cssText = 'font-size:11px; font-weight:bold; color:#5a8f3d; text-align:center; max-width:60px; word-wrap:break-word;';
      label.textContent = `${item.value} ${valueLabel}`;
      wrapper.appendChild(label);
      container.appendChild(wrapper);
    }
  });

  return container;
}

      const seg = document.createElement('div');

      seg.style.left = x + 'px';

      seg.style.width = w + 'px';

      function cover() {
        if (covered) return;
        covered = true;
        // Draw a green line segment thick enough to cover the black border
        const lineW = 7; // thicker than the 3px border
        if (isHoriz) {
          seg.innerHTML = `<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;">

          seg.innerHTML = `<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;">

            <line x1="${w/2-6}" y1="${h}" x2="${w/2+6}" y2="${h}" stroke="#5a8f3d" stroke-width="2.5"/>
          </svg>`;
        }
        onSegmentCovered();
      }

      seg.addEventListener('click', cover);
      seg.addEventListener('dragover', (e) => e.preventDefault());
      seg.addEventListener('drop', (e) => {
        e.preventDefault();
        cover();
        if (currentDraggedLength) {
          currentDraggedLength.remove();
          currentDraggedLength = null;
        }
      });

      fieldContainer.appendChild(seg);
    }

    // Drop zones centered on the border, but the green line drawn thick enough
    // to fully cover the 3px black border underneath.
    const halfHit = hitZone / 2;

    // Top segments (horizontal)
    for (let c = 0; c < cols; c++) {
      makeSegment(c * cellSize, -halfHit, cellSize, hitZone, true);
    }
    // Bottom segments (horizontal)
    for (let c = 0; c < cols; c++) {
      makeSegment(c * cellSize, rows * cellSize - halfHit, cellSize, hitZone, true);
    }
    // Left segments (vertical)
    for (let r = 0; r < rows; r++) {
      makeSegment(-halfHit, r * cellSize, hitZone, cellSize, false);

    for (let r = 0; r < rows; r++) {

          <line x1="10" y1="2" x2="10" y2="${cellSize-2}" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
          <line x1="4" y1="2" x2="16" y2="2" stroke="#3a3a3a" stroke-width="2"/>
          <line x1="4" y1="${cellSize-2}" x2="16" y2="${cellSize-2}" stroke="#3a3a3a" stroke-width="2"/>
        </svg>`;
      }
      ml.addEventListener('dragstart', (e) => {
        currentDraggedLength = ml;
        ml.classList.add('dragging');
        e.dataTransfer.setData('text/plain', 'magic-length');
      });
      ml.addEventListener('dragend', () => {
        ml.classList.remove('dragging');
        currentDraggedLength = null;
      });
      return ml;
    }

    // Add horizontal pieces (for top/bottom)
    const horizLabel = document.createElement('div');
    horizLabel.style.cssText = 'width:100%; text-align:center; font-size:13px; color:#888; margin-bottom:4px;';
    horizLabel.textContent = t('lbl_horizontal');
    supplyArea.appendChild(horizLabel);
    for (let i = 0; i < 8; i++) {

    // Add vertical pieces (for left/right)
    const vertLabel = document.createElement('div');
    vertLabel.style.cssText = 'width:100%; text-align:center; font-size:13px; color:#888; margin-top:8px; margin-bottom:4px;';
    vertLabel.textContent = t('lbl_vertical');
    supplyArea.appendChild(vertLabel);
    for (let i = 0; i < 8; i++) {
      supplyArea.appendChild(makeLengthPiece(false));
    }

    gameArea.appendChild(supplyArea);
  },

  // A6: Total seeds summary with progressive visual regrouping (nested brackets)
  function totalSeeds() {
    clearGame();
    storyHTML(`<div class="speaker">Eliel</div>
      <p>${t('ts_intro')}</p>`);

    gameArea.appendChild(showFieldsRow([
      {side:2, value:4}, {side:2, value:4}, {side:2, value:4},

    ], t('unit_seeds')));

    intro.style.cssText = 'text-align:center; margin-top:16px; font-size:17px; line-height:1.6;';
    intro.innerHTML = `<p><strong>4 + 4 + 4 + 16 + 16 + 25 + 36 = ?</strong></p>
      <p style="margin-top:8px">${t('ts_long_sum')}</p>
      <p style="margin-top:8px">${t('ts_commutative')}</p>`;
    gameArea.appendChild(intro);

    // Field shorthands with original values preserved
    const s4_16 = {side:4, value:16};
    const s2_4 = {side:2, value:4};
    const s6_36 = {side:6, value:36};
    const s5_25 = {side:5, value:25};

    // Group helpers — fields keep their value, groups show total
    function S(side, value) { return {type:'single', side, value}; }
    function SR(rows, cols, value) { return {type:'single', rows, cols, value}; }
    function G(fields, total, ci) { return {type:'group', fields: fields.map(f => f.side ? {side:f.side, value:f.value} : {rows:f.rows, cols:f.cols, value:f.value}), total, ci: ci !== undefined ? ci : 0}; }
    function GN(items, total, ci) { return {type:'group', items, total, ci}; }

  // A7: Total wire summary with smart addition
  function totalWire() {
    clearGame();
    storyHTML(`<div class="speaker">Eliel</div>
      <p>${t('tw_intro')}</p>
      <p style="margin-top:8px"><strong>8 + 8 + 8 + 16 + 16 + 20 + 24 = ?</strong></p>
      <p style="margin-top:8px">${t('tw_rearrange_q')}</p>`);

    gameArea.appendChild(buildGroupedFieldsDisplay([
      W(2,8), W(2,8), W(2,8), W(4,16), W(4,16), W(5,20), W(6,24)
    ], t('unit_lengths')));

    const sumBelow = document.createElement('div');
    sumBelow.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; font-weight:bold;';
    sumBelow.textContent = '8 + 8 + 8 + 16 + 16 + 20 + 24 = ?';
    gameArea.appendChild(sumBelow);

    // Wire field shorthands
    const w2_8 = {side:2, value:8};
    const w4_16 = {side:4, value:16};
    const w5_20 = {side:5, value:20};
    const w6_24 = {side:6, value:24};

    // Wire field: shows filled square with green perimeter segments
    function W(side, value) { return {type:'wire-field', side, value}; }
    // Side-6 field with 4 segments removed from bottom of right side
    function W6split20() { return {type:'wire-field', side:6, value:20, omit:[{side:'right',index:2},{side:'right',index:3},{side:'right',index:4},{side:'right',index:5}]}; }
    // 4 detached green segments (from the side-6 field)
    function DW4(value) { return {type:'detached-wire', count:4, segSide:6, value}; }
    function G(fields, total, ci) { return {type:'group', fields: fields.map(f => f.side ? {side:f.side, value:f.value} : {rows:f.rows, cols:f.cols, value:f.value}), total, ci: ci !== undefined ? ci : 0}; }
    function GN(items, total, ci) { return {type:'group', items, total, ci}; }

    // Reuse the step helper from totalSeeds (show with "?", then reveal)
    const origSum = '8 + 8 + 8 + 16 + 16 + 20 + 24';
    function wstep(storyText, displayBefore, sumHtml, question, answer, displayAfter, sumAfterHtml, next) {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
      gameArea.appendChild(buildGroupedFieldsDisplay(displayBefore, t('unit_lengths')));
      if (sumHtml) {
        const sd = document.createElement('div');
        sd.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
        sd.innerHTML = `<span style="color:#888;">${origSum} =</span><br>${sumHtml}`;
        gameArea.appendChild(sd);
      }
      askNumber(question, answer, () => {
        clearGame();
        storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
        gameArea.appendChild(buildGroupedFieldsDisplay(displayAfter, t('unit_lengths')));
        if (sumAfterHtml) {
          const sd2 = document.createElement('div');
          sd2.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
          sd2.innerHTML = `<span style="color:#888;">${origSum} =</span><br>${sumAfterHtml}`;
          gameArea.appendChild(sd2);
        }
        setTimeout(next, 800);
      }, `${answer}`);
    }

    addButton(t('tw_btn_start'), () => {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>
        <p>${t('tw_split_intro')}</p>`);
      gameArea.appendChild(buildGroupedFieldsDisplay([
        W(2,8), W(2,8), W(4,16), W(2,8), W(6,24), W(4,16), W(5,20)
      ], t('unit_lengths')));
      const sumDiv = document.createElement('div');
      sumDiv.style.cssText = 'text-align:center; margin:12px 0; font-size:18px; line-height:1.6;';
      sumDiv.innerHTML = `<span style="color:#888;">${origSum} =</span><br>8 + 8 + 16 + 8 + 24 + 16 + 20`;
      gameArea.appendChild(sumDiv);

      addButton(t('tw_btn_split'), () => {
        clearGame();
        storyHTML(`<div class="speaker">Eliel</div>
          <p>${t('tw_decompose')}</p>`);
        gameArea.appendChild(buildGroupedFieldsDisplay([
          W(2,8), W(2,8), W(4,16), W(2,8), W6split20(), DW4('?'), W(4,16), W(5,20)
        ], t('unit_lengths')));

        const sumD = document.createElement('div');
        sumD.style.cssText = 'text-align:center; margin:8px 0; font-size:18px; line-height:1.6;';
        sumD.innerHTML = `<span style="color:#888;">${origSum} =</span><br>8 + 8 + 16 + 8 + 20 + <strong>?</strong> + 16 + 20`;
        gameArea.appendChild(sumD);

        askNumber('24 = 20 + ?', 4, () => {
          // Show resolved split, rearrange 4 next to 16
          clearGame();
          storyHTML(`<div class="speaker">Eliel</div>
            <p>${t('tw_pair_now')}</p>`);

          // Now progressive regrouping with nested brackets
          // Rearranged: 8, 8, 16, 8, 16, 4, 20, 20, 20
          // Wait — after splitting 24→20+4, we have: 8,8,16,8,16,20,4,20
          // Rearrange: 8,8,16,8,16,4,20,20,20 — no, fields are: 3 side-2 (8 each), 2 side-4 (16 each), side-6 now split (20+4), side-5 (20)
          // Sum: 8+8+16+8+16+4+20+20 = rearrange to 8,8,16,8,16,4,20,20

          // Highlight helper: color text + "+" using group color
          const gc = groupColors;
          const C = (n, ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};">${n}</span>`;
          const P = (ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};"> + </span>`;

          // Step: 16+4=? (ci=0 green)
          wstep(t('tw_pair'),
            [W(2,8), W(2,8), W(4,16), W(2,8), W6split20(), GN([DW4(4), W(4,16)], '?', 0), W(5,20)],
            `8 + 8 + 16 + 8 + 20 + ${C(4,0)}${P(0)}${C(16,0)} + 20`,
            '4 + 16 = ?', 20,
            [W(2,8), W(2,8), W(4,16), W(2,8), W6split20(), GN([DW4(4), W(4,16)], '20', 0), W(5,20)],
            '8 + 8 + 16 + 8 + 20 + 20 + 20',
            () => {
          // 20+20=? (ci=1 blue)
          wstep(t('tw_20p20'),
            [W(2,8), W(2,8), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '?', 1), W(5,20)],
            `8 + 8 + 16 + 8 + ${C(20,1)}${P(1)}${C(20,1)} + 20`,
            '20 + 20 = ?', 40,
            [W(2,8), W(2,8), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '8 + 8 + 16 + 8 + 40 + 20',
            () => {
          // 8+8=? (ci=0 green)
          wstep('8 + 8!',
            [GN([W(2,8), W(2,8)], '?', 0), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            `${C(8,0)}${P(0)}${C(8,0)} + 16 + 8 + 40 + 20`,
            '8 + 8 = ?', 16,
            [GN([W(2,8), W(2,8)], '16', 0), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '16 + 16 + 8 + 40 + 20',
            () => {
          // 16+16=? (ci=2 orange)
          wstep('16 + 16!',
            [GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '?', 2), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            `${C(16,2)}${P(2)}${C(16,2)} + 8 + 40 + 20`,
            '16 + 16 = ?', 32,
            [GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '32 + 8 + 40 + 20',
            () => {
          // 32+8=? (ci=3 purple)
          wstep('32 + 8!',
            [GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '?', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            `${C(32,3)}${P(3)}${C(8,3)} + 40 + 20`,
            '32 + 8 = ?', 40,
            [GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '40 + 40 + 20',
            () => {
          // 40+40=? (ci=4 pink)
          wstep('40 + 40!',
            [GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '?', 4), W(5,20)],
            `${C(40,4)}${P(4)}${C(40,4)} + 20`,
            '40 + 40 = ?', 80,
            [GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '80', 4), W(5,20)],
            '80 + 20',
            () => {
          // 80+20=? (ci=5)
          wstep(t('tw_final'),
            [GN([GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '80', 4), W(5,20)], '?', 5)],
            `${C(80,5)}${P(5)}${C(20,5)}`,
            '80 + 20 = ?', 100,
            [GN([GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '80', 4), W(5,20)], '100', 5)],
            t('tw_result'),
            () => {
            say('Eliel', t('tw_say'));
            addButton(t('btn_continue'), nextStep);
          }); }); }); }); }); }); });
        }, '24 - 20 = ?');
      });

    clearGame();

    const side = 4;
    storyHTML(`<div class="speaker">Eliel</div>

    gameArea.appendChild(fc);

      askInline(t('q_side_tall'), side, () => {

        storyHTML(`<div class="speaker">Eliel</div>
          <p>${t('ssw_which_block', {side})}</p>`);

        // Show clickable blocks of sizes 1-6
        const blockChoiceDiv = document.createElement('div');
        blockChoiceDiv.style.cssText = 'display:flex; gap:12px; justify-content:center; align-items:flex-end; margin:16px 0; flex-wrap:wrap;';
        const feedbackDiv = document.createElement('div');
        feedbackDiv.style.cssText = 'text-align:center; min-height:24px; font-size:16px; margin-top:8px;';

        for (let sz = 1; sz <= Math.max(side + 2, 6); sz++) {
          const bw = Math.min(cellSize, 40);
          const block = document.createElement('div');
          block.style.cssText = `width:${bw}px; display:flex; flex-direction:column; align-items:center; gap:0; border:3px solid #5a8f3d; border-radius:3px; background:#fffef5; cursor:pointer; transition:transform 0.1s;`;
          for (let i = 0; i < sz; i++) {
            const sub = document.createElement('div');
            sub.style.cssText = `display:flex; align-items:center; justify-content:center; border-bottom:1px solid #ddd; font-size:16px; color:#555; width:${bw}px; height:${bw}px; box-sizing:border-box;`;
            sub.textContent = '·';
            block.appendChild(sub);
          }
          block.addEventListener('mouseenter', () => { block.style.transform = 'scale(1.1)'; });
          block.addEventListener('mouseleave', () => { block.style.transform = 'scale(1)'; });
          block.addEventListener('click', () => {
            if (sz === side) {
              // Correct! Proceed to covering
              blockChoiceDiv.remove();
              feedbackDiv.remove();
              storyHTML(`<div class="speaker">Eliel</div>
                <p>${t('ssw_block_ok', {side})}</p>`);
              clearGame();
              buildBlockField(side, side, cellSize, side, 1, () => {
                askInline(t('q_nblocks_cover', {n:side}), side, () => {
                  storyHTML(`<div class="speaker">Eliel</div>
                    <p>${t('ssw_total', {side})}</p>`);
                  gameArea.appendChild(showFilledField(side, side, cellSize));
                  gameArea.appendChild(showFullMultTable(1, 10, {a:side, b:side}, true));
                  askNumber(`${side} × ${side} = ?`, side*side, () => {
                    clearGame();
                    storyHTML(`<div class="speaker">Eliel</div>
                      <p>${t('ssw_amazing', {side, p:side*side})}</p>
                      <p style="margin-top:8px">${t('ssw_squared', {side, p:side*side})}</p>`);
                    addButton(t('btn_makes_sense'), nextStep);
                  }, t('hint_find_in_table', {a:side, b:side}));
                }, t('hint_count_blocks_field'));
              });
            } else {
              // Wrong size
              feedbackDiv.innerHTML = `<span class="incorrect">${t('fb_block_column_side', {sz, side})}</span>`;
            }
          });
          blockChoiceDiv.appendChild(block);
        }
        gameArea.appendChild(blockChoiceDiv);
        gameArea.appendChild(feedbackDiv);
      }, t('hint_count_lengths'));
    });

    addMagicLengthSupply(cellSize, 0, side + 2);
  },

      <p>${t('ps3_intro')}</p>`);

    const fc = buildEmptyFieldContainer(side, side, cs);
    gameArea.appendChild(fc);
    buildMeasureLeftSide(side, side, cs, fc, () => {
      askInline(t('q_side_lengths'), side, () => {
        // Show stacked magic length choices
        storyHTML(`<div class="speaker">Eliel</div>
          <p>${t('ps3_which_stacked', {side})}</p>`);

        const choiceDiv = document.createElement('div');
        choiceDiv.style.cssText = 'display:flex; gap:16px; justify-content:center; align-items:center; margin:16px 0; flex-wrap:wrap;';
        let hChosen = false, vChosen = false;
        const fbDiv = document.createElement('div');
        fbDiv.style.cssText = 'text-align:center; min-height:24px; font-size:16px; margin-top:6px;';

        // Vertical stacked lengths
        const vLabel = document.createElement('div');
        vLabel.style.cssText = 'text-align:center; font-size:13px; color:#888;';
        vLabel.textContent = t('lbl_vertical');
        choiceDiv.appendChild(vLabel);
        for (let sz = 1; sz <= 5; sz++) {
          const svgData = makeStackedLengthSVG(sz, 28, false);
          const bl = document.createElement('div');
          bl.style.cssText = `cursor:pointer; transition:transform 0.1s; padding:4px; border:2px solid transparent; border-radius:4px;`;
          bl.innerHTML = svgData.html;
          bl.addEventListener('mouseenter', () => { bl.style.transform = 'scale(1.1)'; });
          bl.addEventListener('mouseleave', () => { bl.style.transform = 'scale(1)'; });
          bl.addEventListener('click', () => {
            if (sz === side) { vChosen = true; bl.style.borderColor = '#5a8f3d'; bl.style.background = '#d4edda'; if (hChosen) afterChoices(); }
            else fbDiv.innerHTML = `<span class="incorrect">${t('fb_not_this_one', {side})}</span>`;
          });
          choiceDiv.appendChild(bl);
        }

        // Horizontal stacked lengths
        const hLabel = document.createElement('div');
        hLabel.style.cssText = 'text-align:center; font-size:13px; color:#888; margin-left:16px;';
        hLabel.textContent = t('lbl_horizontal');
        choiceDiv.appendChild(hLabel);
        for (let sz = 1; sz <= 5; sz++) {
          const svgData = makeStackedLengthSVG(sz, 28, true);
          const bl = document.createElement('div');
          bl.style.cssText = `cursor:pointer; transition:transform 0.1s; padding:4px; border:2px solid transparent; border-radius:4px;`;
          bl.innerHTML = svgData.html;
          bl.addEventListener('mouseenter', () => { bl.style.transform = 'scale(1.1)'; });
          bl.addEventListener('mouseleave', () => { bl.style.transform = 'scale(1)'; });
          bl.addEventListener('click', () => {
            if (sz === side) { hChosen = true; bl.style.borderColor = '#5a8f3d'; bl.style.background = '#d4edda'; if (vChosen) afterChoices(); }
            else fbDiv.innerHTML = `<span class="incorrect">${t('fb_not_this_one', {side})}</span>`;
          });
          choiceDiv.appendChild(bl);
        }
        gameArea.appendChild(choiceDiv);
        gameArea.appendChild(fbDiv);

        function afterChoices() {
          choiceDiv.remove(); fbDiv.remove();
          storyHTML(`<div class="speaker">Eliel</div>
            <p>${t('ps3_place', {side})}</p>`);

          // Use stacked perimeter mechanic

    gameArea.appendChild(showFullMultTable(1, 14, {a:2, b:14}, true));
    askNumber('2 × 14 = ?', 28, () => {
      // Shorthands
      function WR(rows, cols, value) { return {type:'wire-field', rows, cols, value}; }
      function GNw(items, total, ci) { return {type:'group', items, total, ci}; }
      const origRWSum = '10 + 14 + 14 + 20 + 30 + 24';
      const gc = groupColors;
      const C = (n, ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};">${n}</span>`;
      const P = (ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};"> + </span>`;

      function showRWSum(html) {
        const sd = document.createElement('div');
        sd.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
        sd.innerHTML = `<span style="color:#888;">${origRWSum} =</span><br>${html}`;
        gameArea.appendChild(sd);
      }

      function rwStep(storyText, display, sumHtml, question, answer, displayAfter, sumAfterHtml, next) {
        clearGame();
        storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
        gameArea.appendChild(buildGroupedFieldsDisplay(display, t('unit_lengths')));
        showRWSum(sumHtml);
        askNumber(question, answer, () => {
          clearGame();
          storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
          gameArea.appendChild(buildGroupedFieldsDisplay(displayAfter, t('unit_lengths')));
          if (sumAfterHtml) showRWSum(sumAfterHtml);
          setTimeout(next, 800);
        }, `${answer}`);
      }

      const w10 = WR(3,2,10), w14a = WR(4,3,14), w14b = WR(5,2,14);
      const w20 = WR(6,4,20), w30 = WR(6,9,30), w24 = WR(8,4,24);

      showRWSum(`10 + ${C(28,0)} + 20 + 30 + 24`);

      addButton(t('btn_lets_go'), () => {
        // 10+20=?
        rwStep('10 + 20!',
          [GNw([w10, w20], '? ', 1), g28, w30, w24],
          `${C(10,1)}${P(1)}${C(20,1)} + ${C(28,0)} + 30 + 24`,
          '10 + 20 = ?', 30,
          [GNw([w10, w20], '30', 1), g28, w30, w24],
          `30 + ${C(28,0)} + 30 + 24`,

        // 30+30=?
        rwStep('30 + 30!',
          [GNw([GNw([w10, w20], '30', 1), w30], '?', 2), g28, w24],
          `${C(30,2)}${P(2)}${C(30,2)} + ${C(28,0)} + 24`,
          '30 + 30 = ?', 60,
          [GNw([GNw([w10, w20], '30', 1), w30], '60', 2), g28, w24],
          `60 + ${C(28,0)} + 24`,

        // 28+24=?
        rwStep('28 + 24!',
          [GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '?', 3)],
          `60 + ${C(28,3)}${P(3)}${C(24,3)}`,
          `28 + 24 = ? ${t('lbl_hint')} 28+20+4`, 52,
          [GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '52', 3)],
          '60 + 52',

        // 60+52=?
        rwStep('60 + 52!',
          [GNw([GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '52', 3)], '?', 4)],
          `${C(60,4)}${P(4)}${C(52,4)}`,
          '60 + 52 = ?', 112,
          [GNw([GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '52', 3)], '112', 4)],
          t('frw_result'),
          () => {
          say('Eliel', t('frw_say'));
          addButton(t('btn_continue'), nextStep);
        }); }); }); });
      });
    });
  },

function nextStep() {
  currentStep++;
  if (currentStep < steps.length) {
    steps[currentStep]();
  }
}

// ============================================================
// DEBUG: Jump-to-step menu (append ?debug to the URL to enable; off for kids)
// ============================================================
const DEBUG = new URLSearchParams(location.search).has('debug');

if (DEBUG) {
  const debugBar = document.createElement('div');
  debugBar.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#333; color:#fff; padding:4px 8px; font-size:12px; font-family:monospace; z-index:1000; display:flex; align-items:center; gap:8px; flex-wrap:wrap;';

  const label = document.createElement('span');
  label.textContent = 'Jump to step:';
  debugBar.appendChild(label);

  const select = document.createElement('select');
  select.style.cssText = 'font-size:12px; font-family:monospace; max-width:300px; padding:2px;';
  steps.forEach((fn, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    // Extract function name
    const name = fn.name || `step ${i}`;
    opt.textContent = `${i}: ${name}`;
    select.appendChild(opt);
  });
  debugBar.appendChild(select);

  const goBtn = document.createElement('button');
  goBtn.textContent = 'Go';
  goBtn.style.cssText = 'font-size:12px; padding:2px 8px; cursor:pointer;';
  goBtn.addEventListener('click', () => {
    currentStep = parseInt(select.value);
    steps[currentStep]();
  });
  debugBar.appendChild(goBtn);

  const stepInfo = document.createElement('span');
  stepInfo.id = 'debug-step-info';
  stepInfo.textContent = `(${steps.length} steps total)`;
  debugBar.appendChild(stepInfo);

  document.body.appendChild(debugBar);
  document.getElementById('game-container').style.marginTop = '32px';
}

// Start the game!
steps[0]();
