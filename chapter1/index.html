    let coveredCount = 0;
    const hitZone = 20; // wide hit area for drag targets

      coveredCount++;
      if (coveredCount === totalSegments) {
        setTimeout(() => {
          storyHTML(`
            <div class="speaker">Eliel</div>
            <p>${t('ga_surrounded')}</p>

    // isHoriz: true for top/bottom segments, false for left/right
    function makeSegment(x, y, w, h, isHoriz) {
      const seg = document.createElement('div');
      seg.className = 'perimeter-zone';
      seg.style.left = x + 'px';
      seg.style.top = y + 'px';
      seg.style.width = w + 'px';
      seg.style.height = h + 'px';
      seg.style.background = 'transparent';
      let covered = false;

      function cover() {
        if (covered) return;
        covered = true;
        // Draw a green line segment thick enough to cover the black border
        const lineW = 7; // thicker than the 3px border
        if (isHoriz) {
          seg.innerHTML = `<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;">
            <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#5a8f3d" stroke-width="${lineW}" stroke-linecap="butt"/>

            <line x1="${w}" y1="${h/2-6}" x2="${w}" y2="${h/2+6}" stroke="#5a8f3d" stroke-width="2.5"/>
          </svg>`;
        } else {
          seg.innerHTML = `<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;">
            <line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="#5a8f3d" stroke-width="${lineW}" stroke-linecap="butt"/>
            <line x1="${w/2-6}" y1="0" x2="${w/2+6}" y2="0" stroke="#5a8f3d" stroke-width="2.5"/>
            <line x1="${w/2-6}" y1="${h}" x2="${w/2+6}" y2="${h}" stroke="#5a8f3d" stroke-width="2.5"/>
          </svg>`;
        }
        onSegmentCovered();
      }

      seg.addEventListener('click', cover);
      seg.addEventListener('dragover', (e) => e.preventDefault());
      seg.addEventListener('drop', (e) => {
        e.preventDefault();
        cover();
        if (currentDraggedLength) {
          currentDraggedLength.remove();
          currentDraggedLength = null;
        }
      });

      fieldContainer.appendChild(seg);
    }

    // Drop zones centered on the border, but the green line drawn thick enough
    // to fully cover the 3px black border underneath.
    const halfHit = hitZone / 2;

    // Top segments (horizontal)
    for (let c = 0; c < cols; c++) {
      makeSegment(c * cellSize, -halfHit, cellSize, hitZone, true);
    }
    // Bottom segments (horizontal)
    for (let c = 0; c < cols; c++) {
      makeSegment(c * cellSize, rows * cellSize - halfHit, cellSize, hitZone, true);
    }
    // Left segments (vertical)
    for (let r = 0; r < rows; r++) {
      makeSegment(-halfHit, r * cellSize, hitZone, cellSize, false);
    }
    // Right segments (vertical)
    for (let r = 0; r < rows; r++) {
      makeSegment(cols * cellSize - halfHit, r * cellSize, hitZone, cellSize, false);

    // Helper to create a draggable magic length SVG
    function makeLengthPiece(isHoriz) {
      const ml = document.createElement('div');
      ml.className = 'magic-length';
      ml.draggable = true;
      if (isHoriz) {
        ml.style.width = cellSize + 'px';
        ml.style.height = '20px';
        ml.innerHTML = `<svg width="${cellSize}" height="20">
          <line x1="2" y1="10" x2="${cellSize-2}" y2="10" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>

          <line x1="${cellSize-2}" y1="4" x2="${cellSize-2}" y2="16" stroke="#3a3a3a" stroke-width="2"/>
        </svg>`;
      } else {
        ml.style.width = '20px';
        ml.style.height = cellSize + 'px';
        ml.innerHTML = `<svg width="20" height="${cellSize}">
          <line x1="10" y1="2" x2="10" y2="${cellSize-2}" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
          <line x1="4" y1="2" x2="16" y2="2" stroke="#3a3a3a" stroke-width="2"/>
          <line x1="4" y1="${cellSize-2}" x2="16" y2="${cellSize-2}" stroke="#3a3a3a" stroke-width="2"/>
        </svg>`;
      }
      ml.addEventListener('dragstart', (e) => {
        currentDraggedLength = ml;
        ml.classList.add('dragging');
        e.dataTransfer.setData('text/plain', 'magic-length');
      });
      ml.addEventListener('dragend', () => {
        ml.classList.remove('dragging');
        currentDraggedLength = null;
      });
      return ml;
    }

    // Add horizontal pieces (for top/bottom)
    const horizLabel = document.createElement('div');
    horizLabel.style.cssText = 'width:100%; text-align:center; font-size:13px; color:#888; margin-bottom:4px;';
    horizLabel.textContent = t('lbl_horizontal');
    supplyArea.appendChild(horizLabel);
    for (let i = 0; i < 8; i++) {
      supplyArea.appendChild(makeLengthPiece(true));
    }

    // Add vertical pieces (for left/right)
    const vertLabel = document.createElement('div');
    vertLabel.style.cssText = 'width:100%; text-align:center; font-size:13px; color:#888; margin-top:8px; margin-bottom:4px;';
    vertLabel.textContent = t('lbl_vertical');
    supplyArea.appendChild(vertLabel);
    for (let i = 0; i < 8; i++) {
      supplyArea.appendChild(makeLengthPiece(false));
    }

    gameArea.appendChild(supplyArea);
  },

  // A6: Total seeds summary with progressive visual regrouping (nested brackets)
  function totalSeeds() {
    clearGame();
    storyHTML(`<div class="speaker">Eliel</div>
      <p>${t('ts_intro')}</p>`);

    gameArea.appendChild(showFieldsRow([
      {side:2, value:4}, {side:2, value:4}, {side:2, value:4},
      {side:4, value:16}, {side:4, value:16},
      {side:5, value:25}, {side:6, value:36}
    ], t('unit_seeds')));

    const intro = document.createElement('div');
    intro.style.cssText = 'text-align:center; margin-top:16px; font-size:17px; line-height:1.6;';
    intro.innerHTML = `<p><strong>4 + 4 + 4 + 16 + 16 + 25 + 36 = ?</strong></p>
      <p style="margin-top:8px">${t('ts_long_sum')}</p>
      <p style="margin-top:8px">${t('ts_commutative')}</p>`;
    gameArea.appendChild(intro);

    // Field shorthands with original values preserved
    const s4_16 = {side:4, value:16};
    const s2_4 = {side:2, value:4};
    const s6_36 = {side:6, value:36};
    const s5_25 = {side:5, value:25};

    // Group helpers — fields keep their value, groups show total
    function S(side, value) { return {type:'single', side, value}; }
    function SR(rows, cols, value) { return {type:'single', rows, cols, value}; }
    function G(fields, total, ci) { return {type:'group', fields: fields.map(f => f.side ? {side:f.side, value:f.value} : {rows:f.rows, cols:f.cols, value:f.value}), total, ci: ci !== undefined ? ci : 0}; }
    function GN(items, total, ci) { return {type:'group', items, total, ci}; }

    const origSeedSum = '4 + 4 + 4 + 16 + 16 + 25 + 36';
    const gc = groupColors;
    const C = (n, ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};">${n}</span>`;
    const P = (ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};"> + </span>`;

    // Helper: show fields, ask question, on correct reveal answer in group, then call next
    function step(storyText, displayBefore, sumHtml, question, answer, displayAfter, sumAfterHtml, next) {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
      gameArea.appendChild(buildGroupedFieldsDisplay(displayBefore, t('unit_seeds')));
      if (sumHtml) {
        const sd = document.createElement('div');
        sd.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
        sd.innerHTML = `<span style="color:#888;">${origSeedSum} =</span><br>${sumHtml}`;
        gameArea.appendChild(sd);
      }
      askNumber(question, answer, () => {
        clearGame();
        storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
        gameArea.appendChild(buildGroupedFieldsDisplay(displayAfter, t('unit_seeds')));
        if (sumAfterHtml) {
          const sd2 = document.createElement('div');
          sd2.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
          sd2.innerHTML = `<span style="color:#888;">${origSeedSum} =</span><br>${sumAfterHtml}`;
          gameArea.appendChild(sd2);
        }
        setTimeout(next, 800);
      }, `${answer}`);
    }

    addButton(t('ts_btn_rearrange'), () => {
      // Step 0: 16+4=?
      step(t('ts_pair_easy'),
        [G([s4_16, s2_4], '?', 0), S(4,16), S(2,4), S(6,36), S(2,4), S(5,25)],
        `${C(16,0)}${P(0)}${C(4,0)} + 16 + 4 + 36 + 4 + 25`,
        '16 + 4 = ?', 20,
        [G([s4_16, s2_4], '20', 0), S(4,16), S(2,4), S(6,36), S(2,4), S(5,25)],
        '20 + 16 + 4 + 36 + 4 + 25',
        () => {
      // Step 1: second 16+4=?
      step(t('ts_next_pair'),
        [G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '?', 0), S(6,36), S(2,4), S(5,25)],
        `20 + ${C(16,0)}${P(0)}${C(4,0)} + 36 + 4 + 25`,
        '16 + 4 = ?', 20,
        [G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0), S(6,36), S(2,4), S(5,25)],
        '20 + 20 + 36 + 4 + 25',
        () => {
      // Step 2: 36+4=?
      step(t('ts_next'),
        [G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0), G([s6_36, s2_4], '?', 0), S(5,25)],
        `20 + 20 + ${C(36,0)}${P(0)}${C(4,0)} + 25`,
        '36 + 4 = ?', 40,
        [G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0), G([s6_36, s2_4], '40', 0), S(5,25)],
        '20 + 20 + 40 + 25',
        () => {
      // Step 3: 20+20=? → nested
      step(t('ts_two20s'),
        [GN([G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0)], '?', 1), G([s6_36, s2_4], '40', 0), S(5,25)],
        `${C(20,1)}${P(1)}${C(20,1)} + 40 + 25`,
        '20 + 20 = ?', 40,
        [GN([G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0)], '40', 1), G([s6_36, s2_4], '40', 0), S(5,25)],
        '40 + 40 + 25',
        () => {
      // Step 4: 40+40=? → nested
      step(t('ts_two40s'),
        [GN([GN([G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0)], '40', 1), G([s6_36, s2_4], '40', 0)], '?', 2), S(5,25)],
        `${C(40,2)}${P(2)}${C(40,2)} + 25`,
        '40 + 40 = ?', 80,
        [GN([GN([G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0)], '40', 1), G([s6_36, s2_4], '40', 0)], '80', 2), S(5,25)],
        '80 + 25',
        () => {
      // Step 5a: introduce the trick
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>
        <p>${t('ts_daunting')}</p>`);
      gameArea.appendChild(buildGroupedFieldsDisplay([
        GN([GN([G([s4_16, s2_4], '20', 0), G([s4_16, s2_4], '20', 0)], '40', 1), G([s6_36, s2_4], '40', 0)], '80', 2),
        S(5, 25)
      ], t('unit_seeds')));
      const sum5a = document.createElement('div');

  // A7: Total wire summary with smart addition
  function totalWire() {
    clearGame();
    storyHTML(`<div class="speaker">Eliel</div>
      <p>${t('tw_intro')}</p>
      <p style="margin-top:8px"><strong>8 + 8 + 8 + 16 + 16 + 20 + 24 = ?</strong></p>
      <p style="margin-top:8px">${t('tw_rearrange_q')}</p>`);

    gameArea.appendChild(buildGroupedFieldsDisplay([
      W(2,8), W(2,8), W(2,8), W(4,16), W(4,16), W(5,20), W(6,24)
    ], t('unit_lengths')));

    const sumBelow = document.createElement('div');
    sumBelow.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; font-weight:bold;';
    sumBelow.textContent = '8 + 8 + 8 + 16 + 16 + 20 + 24 = ?';
    gameArea.appendChild(sumBelow);

    // Wire field shorthands
    const w2_8 = {side:2, value:8};
    const w4_16 = {side:4, value:16};
    const w5_20 = {side:5, value:20};
    const w6_24 = {side:6, value:24};

    // Wire field: shows filled square with green perimeter segments
    function W(side, value) { return {type:'wire-field', side, value}; }
    // Side-6 field with 4 segments removed from bottom of right side
    function W6split20() { return {type:'wire-field', side:6, value:20, omit:[{side:'right',index:2},{side:'right',index:3},{side:'right',index:4},{side:'right',index:5}]}; }
    // 4 detached green segments (from the side-6 field)
    function DW4(value) { return {type:'detached-wire', count:4, segSide:6, value}; }
    function G(fields, total, ci) { return {type:'group', fields: fields.map(f => f.side ? {side:f.side, value:f.value} : {rows:f.rows, cols:f.cols, value:f.value}), total, ci: ci !== undefined ? ci : 0}; }
    function GN(items, total, ci) { return {type:'group', items, total, ci}; }

    // Reuse the step helper from totalSeeds (show with "?", then reveal)
    const origSum = '8 + 8 + 8 + 16 + 16 + 20 + 24';
    function wstep(storyText, displayBefore, sumHtml, question, answer, displayAfter, sumAfterHtml, next) {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
      gameArea.appendChild(buildGroupedFieldsDisplay(displayBefore, t('unit_lengths')));
      if (sumHtml) {
        const sd = document.createElement('div');
        sd.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
        sd.innerHTML = `<span style="color:#888;">${origSum} =</span><br>${sumHtml}`;
        gameArea.appendChild(sd);
      }
      askNumber(question, answer, () => {
        clearGame();
        storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
        gameArea.appendChild(buildGroupedFieldsDisplay(displayAfter, t('unit_lengths')));
        if (sumAfterHtml) {
          const sd2 = document.createElement('div');
          sd2.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
          sd2.innerHTML = `<span style="color:#888;">${origSum} =</span><br>${sumAfterHtml}`;
          gameArea.appendChild(sd2);
        }
        setTimeout(next, 800);
      }, `${answer}`);
    }

    addButton(t('tw_btn_start'), () => {
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>
        <p>${t('tw_split_intro')}</p>`);
      gameArea.appendChild(buildGroupedFieldsDisplay([
        W(2,8), W(2,8), W(4,16), W(2,8), W(6,24), W(4,16), W(5,20)
      ], t('unit_lengths')));
      const sumDiv = document.createElement('div');
      sumDiv.style.cssText = 'text-align:center; margin:12px 0; font-size:18px; line-height:1.6;';
      sumDiv.innerHTML = `<span style="color:#888;">${origSum} =</span><br>8 + 8 + 16 + 8 + 24 + 16 + 20`;
      gameArea.appendChild(sumDiv);

      addButton(t('tw_btn_split'), () => {
        clearGame();
        storyHTML(`<div class="speaker">Eliel</div>
          <p>${t('tw_decompose')}</p>`);
        gameArea.appendChild(buildGroupedFieldsDisplay([
          W(2,8), W(2,8), W(4,16), W(2,8), W6split20(), DW4('?'), W(4,16), W(5,20)
        ], t('unit_lengths')));

        const sumD = document.createElement('div');
        sumD.style.cssText = 'text-align:center; margin:8px 0; font-size:18px; line-height:1.6;';
        sumD.innerHTML = `<span style="color:#888;">${origSum} =</span><br>8 + 8 + 16 + 8 + 20 + <strong>?</strong> + 16 + 20`;
        gameArea.appendChild(sumD);

        askNumber('24 = 20 + ?', 4, () => {
          // Show resolved split, rearrange 4 next to 16
          clearGame();
          storyHTML(`<div class="speaker">Eliel</div>
            <p>${t('tw_pair_now')}</p>`);

          // Now progressive regrouping with nested brackets
          // Rearranged: 8, 8, 16, 8, 16, 4, 20, 20, 20
          // Wait — after splitting 24→20+4, we have: 8,8,16,8,16,20,4,20
          // Rearrange: 8,8,16,8,16,4,20,20,20 — no, fields are: 3 side-2 (8 each), 2 side-4 (16 each), side-6 now split (20+4), side-5 (20)
          // Sum: 8+8+16+8+16+4+20+20 = rearrange to 8,8,16,8,16,4,20,20

          // Highlight helper: color text + "+" using group color
          const gc = groupColors;
          const C = (n, ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};">${n}</span>`;
          const P = (ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};"> + </span>`;

          // Step: 16+4=? (ci=0 green)
          wstep(t('tw_pair'),
            [W(2,8), W(2,8), W(4,16), W(2,8), W6split20(), GN([DW4(4), W(4,16)], '?', 0), W(5,20)],
            `8 + 8 + 16 + 8 + 20 + ${C(4,0)}${P(0)}${C(16,0)} + 20`,
            '4 + 16 = ?', 20,
            [W(2,8), W(2,8), W(4,16), W(2,8), W6split20(), GN([DW4(4), W(4,16)], '20', 0), W(5,20)],
            '8 + 8 + 16 + 8 + 20 + 20 + 20',
            () => {
          // 20+20=? (ci=1 blue)
          wstep(t('tw_20p20'),
            [W(2,8), W(2,8), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '?', 1), W(5,20)],
            `8 + 8 + 16 + 8 + ${C(20,1)}${P(1)}${C(20,1)} + 20`,
            '20 + 20 = ?', 40,
            [W(2,8), W(2,8), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '8 + 8 + 16 + 8 + 40 + 20',
            () => {
          // 8+8=? (ci=0 green)
          wstep('8 + 8!',
            [GN([W(2,8), W(2,8)], '?', 0), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            `${C(8,0)}${P(0)}${C(8,0)} + 16 + 8 + 40 + 20`,
            '8 + 8 = ?', 16,
            [GN([W(2,8), W(2,8)], '16', 0), W(4,16), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '16 + 16 + 8 + 40 + 20',
            () => {
          // 16+16=? (ci=2 orange)
          wstep('16 + 16!',
            [GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '?', 2), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            `${C(16,2)}${P(2)}${C(16,2)} + 8 + 40 + 20`,
            '16 + 16 = ?', 32,
            [GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '32 + 8 + 40 + 20',
            () => {
          // 32+8=? (ci=3 purple)
          wstep('32 + 8!',
            [GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '?', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            `${C(32,3)}${P(3)}${C(8,3)} + 40 + 20`,
            '32 + 8 = ?', 40,
            [GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1), W(5,20)],
            '40 + 40 + 20',
            () => {
          // 40+40=? (ci=4 pink)
          wstep('40 + 40!',
            [GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '?', 4), W(5,20)],
            `${C(40,4)}${P(4)}${C(40,4)} + 20`,
            '40 + 40 = ?', 80,
            [GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '80', 4), W(5,20)],
            '80 + 20',
            () => {
          // 80+20=? (ci=5)
          wstep(t('tw_final'),
            [GN([GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '80', 4), W(5,20)], '?', 5)],
            `${C(80,5)}${P(5)}${C(20,5)}`,
            '80 + 20 = ?', 100,
            [GN([GN([GN([GN([GN([W(2,8), W(2,8)], '16', 0), W(4,16)], '32', 2), W(2,8)], '40', 3), GN([W6split20(), GN([DW4(4), W(4,16)], '20', 0)], '40', 1)], '80', 4), W(5,20)], '100', 5)],
            t('tw_result'),
            () => {
            say('Eliel', t('tw_say'));
            addButton(t('btn_continue'), nextStep);
          }); }); }); }); }); }); });
        }, '24 - 20 = ?');
      });
    });
  },

      <p>${t('frp_intro')}</p>`);
    buildMultiFieldChallenge([
      {rows:3, cols:2, cellSize:30, answer:10},
      {rows:4, cols:3, cellSize:22, answer:14},
      {rows:5, cols:2, cellSize:25, answer:14},
      {rows:6, cols:4, cellSize:16, answer:20},
      {rows:6, cols:9, cellSize:10, answer:30},
      {rows:8, cols:4, cellSize:12, answer:24},
    ], nextStep, true);
  },

  // F6: Rectangle wire total
  function finalRectWireTotal() {
    clearGame();
    // Perimeters: 2×3+2×2=10, 2×4+2×3=14, 2×5+2×2=14, 2×6+2×4=20, 2×6+2×9=30, 2×8+2×4=24
    storyHTML(`<div class="speaker">Eliel</div>
      <p>${t('frw_intro')}</p>
      <p style="margin-top:8px">${t('frw_lengths')}</p>
      <p style="margin-top:8px">${t('frw_same14')}</p>`);

    // Show with green perimeter segments, two 14-fields grouped
    gameArea.appendChild(buildGroupedFieldsDisplay([
      {type:'wire-field', rows:3, cols:2, value:10},
      {type:'group', items:[{type:'wire-field', rows:4, cols:3, value:14}, {type:'wire-field', rows:5, cols:2, value:14}], total:'2×14 = ?', ci:0},
      {type:'wire-field', rows:6, cols:4, value:20},
      {type:'wire-field', rows:6, cols:9, value:30}, {type:'wire-field', rows:8, cols:4, value:24}
    ], t('unit_lengths')));
    const wireSumInit = document.createElement('div');
    wireSumInit.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; font-weight:bold;';
    const gc0 = groupColors[0];
    wireSumInit.innerHTML = `10 + <span style="font-weight:bold; color:${gc0};">14</span><span style="font-weight:bold; color:${gc0};"> + </span><span style="font-weight:bold; color:${gc0};">14</span> + 20 + 30 + 24 = ?`;
    gameArea.appendChild(wireSumInit);

    gameArea.appendChild(showFullMultTable(1, 14, {a:2, b:14}, true));
    askNumber('2 × 14 = ?', 28, () => {
      // Shorthands
      function WR(rows, cols, value) { return {type:'wire-field', rows, cols, value}; }
      function GNw(items, total, ci) { return {type:'group', items, total, ci}; }
      const origRWSum = '10 + 14 + 14 + 20 + 30 + 24';
      const gc = groupColors;
      const C = (n, ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};">${n}</span>`;
      const P = (ci) => `<span style="font-weight:bold; color:${gc[ci % gc.length]};"> + </span>`;

      function showRWSum(html) {
        const sd = document.createElement('div');
        sd.style.cssText = 'text-align:center; margin:10px 0; font-size:18px; line-height:1.6;';
        sd.innerHTML = `<span style="color:#888;">${origRWSum} =</span><br>${html}`;
        gameArea.appendChild(sd);
      }

      function rwStep(storyText, display, sumHtml, question, answer, displayAfter, sumAfterHtml, next) {
        clearGame();
        storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
        gameArea.appendChild(buildGroupedFieldsDisplay(display, t('unit_lengths')));
        showRWSum(sumHtml);
        askNumber(question, answer, () => {
          clearGame();
          storyHTML(`<div class="speaker">Eliel</div><p>${storyText}</p>`);
          gameArea.appendChild(buildGroupedFieldsDisplay(displayAfter, t('unit_lengths')));
          if (sumAfterHtml) showRWSum(sumAfterHtml);
          setTimeout(next, 800);
        }, `${answer}`);
      }

      const w10 = WR(3,2,10), w14a = WR(4,3,14), w14b = WR(5,2,14);
      const w20 = WR(6,4,20), w30 = WR(6,9,30), w24 = WR(8,4,24);
      const g28 = GNw([w14a, w14b], '2×14 = 28', 0);

      // Show 28 revealed, then start regrouping
      clearGame();
      storyHTML(`<div class="speaker">Eliel</div>
        <p>${t('frw_28')}</p>`);
      gameArea.appendChild(buildGroupedFieldsDisplay([w10, g28, w20, w30, w24], t('unit_lengths')));
      showRWSum(`10 + ${C(28,0)} + 20 + 30 + 24`);

      addButton(t('btn_lets_go'), () => {
        // 10+20=?
        rwStep('10 + 20!',
          [GNw([w10, w20], '? ', 1), g28, w30, w24],
          `${C(10,1)}${P(1)}${C(20,1)} + ${C(28,0)} + 30 + 24`,
          '10 + 20 = ?', 30,
          [GNw([w10, w20], '30', 1), g28, w30, w24],
          `30 + ${C(28,0)} + 30 + 24`,
          () => {
        // 30+30=?
        rwStep('30 + 30!',
          [GNw([GNw([w10, w20], '30', 1), w30], '?', 2), g28, w24],
          `${C(30,2)}${P(2)}${C(30,2)} + ${C(28,0)} + 24`,
          '30 + 30 = ?', 60,
          [GNw([GNw([w10, w20], '30', 1), w30], '60', 2), g28, w24],
          `60 + ${C(28,0)} + 24`,
          () => {
        // 28+24=?
        rwStep('28 + 24!',
          [GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '?', 3)],
          `60 + ${C(28,3)}${P(3)}${C(24,3)}`,
          `28 + 24 = ? ${t('lbl_hint')} 28+20+4`, 52,
          [GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '52', 3)],
          '60 + 52',
          () => {
        // 60+52=?
        rwStep('60 + 52!',
          [GNw([GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '52', 3)], '?', 4)],
          `${C(60,4)}${P(4)}${C(52,4)}`,
          '60 + 52 = ?', 112,
          [GNw([GNw([GNw([w10, w20], '30', 1), w30], '60', 2), GNw([g28, w24], '52', 3)], '112', 4)],
          t('frw_result'),
          () => {
          say('Eliel', t('frw_say'));
          addButton(t('btn_continue'), nextStep);
        }); }); }); });
      });
    });
  },

  // F7: Grand total
  function grandTotal() {
    clearGame();

    // Build a combined display showing all fields
    const allFieldsEl = document.createElement('div');
    allFieldsEl.style.cssText = 'margin-bottom:12px;';

    const sqLabel = document.createElement('div');
    sqLabel.style.cssText = 'text-align:center; font-size:14px; color:#888; margin-bottom:4px;';
    sqLabel.textContent = t('gt_sq_label');
    allFieldsEl.appendChild(sqLabel);
    allFieldsEl.appendChild(buildGroupedFieldsDisplay([
      {type:'single', side:2, value:4}, {type:'single', side:2, value:4}, {type:'single', side:2, value:4},
      {type:'single', side:4, value:16}, {type:'single', side:4, value:16},
      {type:'single', side:5, value:25}, {type:'single', side:6, value:36}
    ], t('unit_seeds')));

    const rectLabel = document.createElement('div');
    rectLabel.style.cssText = 'text-align:center; font-size:14px; color:#888; margin-top:8px; margin-bottom:4px;';
    rectLabel.textContent = t('gt_rect_label');
    allFieldsEl.appendChild(rectLabel);
    allFieldsEl.appendChild(buildGroupedFieldsDisplay([
      {type:'single', rows:3, cols:2, value:6}, {type:'single', rows:4, cols:3, value:12},
      {type:'single', rows:5, cols:2, value:10}, {type:'single', rows:6, cols:4, value:24},
      {type:'single', rows:6, cols:9, value:54}, {type:'single', rows:8, cols:4, value:32}
    ], t('unit_seeds')));

    gameArea.appendChild(allFieldsEl);

    storyHTML(`<div class="speaker">Eliel</div>
      <p>${t('gt_together')}</p>
      <p style="margin-top:8px">${t('gt_total_seeds')}</p>`);

    askNumber('105 + 138 = ?', 243, () => {
      storyHTML(`<div class="speaker">Eliel</div>
        <p>${t('gt_243')}</p>`);
      gameArea.innerHTML = '';
      gameArea.appendChild(allFieldsEl.cloneNode(true));
      askNumber('100 + 112 = ?', 212, () => {
        celebrate(
          t('gt_celeb_t'),
          t('gt_celeb_x'),
          nextStep
        );
      }, '100 + 112 = ?');
    }, `${t('lbl_hint')} 105 + 138 = 100 + 5 + 130 + 8`);
  },

  // Final conclusion
  function conclusion() {
    clearGame();
    storyHTML(`<div class="speaker">Eliel</div>
      <p>${t('cn_help')}</p>
      <p style="margin-top:8px">${t('cn_learned')}</p>
      <p style="margin-top:12px">${t('cn_forest')}</p>`);

    const endBox = document.createElement('div');
    endBox.style.cssText = 'text-align:center; margin-top:30px; padding:20px; background:#d4edda; border-radius:12px;';
    endBox.innerHTML = `
      <h2 style="color:#5a8f3d; margin-bottom:8px;">${t('cn_quest_complete')}</h2>
      <p style="font-size:18px;">${t('cn_finished')}</p>
      <p style="margin-top:12px; color:#888;">${t('cn_next')}</p>
    `;
    gameArea.appendChild(endBox);
    addButton(t('btn_play_again'), () => { currentStep = 0; steps[0](); });
  },
];

startGame(steps);

</script>
</body>
</html>
